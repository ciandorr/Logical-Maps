name: Check public repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r logical-maps/requirements.txt
      - name: Check committed files and publication history
        run: python logical-maps/scripts/check_public.py --history
      - name: Validate and test
        working-directory: logical-maps
        run: |
          python scripts/pmap.py validate
          python scripts/pmap.py selftest
          python scripts/check_public_test.py
          python scripts/check_trawl.py
      - name: Rebuild and check downloads
        working-directory: logical-maps
        run: |
          python scripts/pmap.py build
          python scripts/check_public.py
          python scripts/check_starter.py
