he distinctness-preserving modality.", "formal": "$\\Diamond_{\\ne}P\\quad(P\\text{ closed and pure; }\\operatorname{Max}(C)+P\\text{ consistent})$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 42."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.6, p. 42"}], "notes": "The paper leaves consistency open. The definition of Box_ne and its dual is given in Background.", "file": "topics/classicism/principles/strong-possibility-r.yaml"}, {"id": "strong-possibility-signature-r", "name": "Strong Possibility (signature Σ)", "category": "schematic", "statement": "Every closed sentence of the fixed signature consistent with its Maximalist Classicism is possible under the distinctness-preserving modality.", "formal": "$\\Diamond_{\\ne}P\\quad(P\\in\\mathcal L(\\Sigma)\\text{ closed; }\\operatorname{Max}(C(\\Sigma))+P\\text{ consistent})$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 37–39; §2.6, p. 42."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.5, pp. 37–39; §2.6, p. 42"}], "notes": "This keeps the signature-expanded reference theory throughout the consistency side condition. The separate pure-language variant uses Max(C). No conservativity between these two maximalizations is assumed. Consistency of Strong Possibility is left open in the source.", "file": "topics/classicism/principles/strong-possibility-signature-r.yaml"}, {"id": "tractarianism-r", "name": "Tractarianism", "category": "coarse", "statement": "A proposition entailing every instance of a property entails its universal generalization.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,\\forall p^t X^{\\sigma t}\\, .\\,(\\forall x^\\sigma\\, .\\,p\\le Xx)\\to p\\le(\\forall x^\\sigma\\, .\\,Xx)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.1 and n. 27, pp. 20–21."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "Proposition 2.1 and n. 27, pp. 20–21"}], "notes": "", "file": "topics/classicism/principles/tractarianism-r.yaml"}, {"id": "witnessed-possibility-r", "name": "Witnessed Possibility", "category": "schematic", "statement": "For pure-formulas P with free variables among a finite tuple x, and distinct matching nonlogical constants c, a witness to P entails that P at those constants is possible.", "formal": "$(\\exists\\bar x\\, .\\,P)\\to\\Diamond P[\\bar c/\\bar x]$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.5, n. 57, p. 38"}, {"paper": "bacon-2020", "role": "origin", "locator": "Logical Necessity discussion, as cited in Classicism n. 57"}], "notes": "", "file": "topics/classicism/principles/witnessed-possibility-r.yaml"}], "results": [{"id": "actual-profile-r-implies-actuality", "premises": ["actual-profile-r"], "conclusion": "actuality", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, n. 31, p. 25."], "source_names": ["Classicism"], "proof": "Specialize Actual Profile to the empty tuple, so its relation variables have type t.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, n. 31, p. 25"}], "notes": "", "file": "topics/classicism/results/actual-profile-r-implies-actuality.yaml", "files": {"md": "writeups/actual-profile-r-implies-actuality.md", "handwritten": false, "html": "writeups/actual-profile-r-implies-actuality.html"}}, {"id": "actuality-implies-actual-profile-r", "premises": ["actuality"], "conclusion": "actual-profile-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, n. 31, p. 25."], "source_names": ["Classicism"], "proof": "Let w witness Actuality. At a tuple $\\bar x$, use the relation $\\lambda\\bar y\\, .\\,w\\land\\bigwedge_i x_i=y_i$. It holds at $\\bar x$. If $Z[\\bar x]$ is true, w entails that truth; NI preserves the tuple identities, so the proposed relation entails Z. This gives the required profile for every type tuple.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, n. 31, p. 25"}], "notes": "", "file": "topics/classicism/results/actuality-implies-actual-profile-r.yaml", "files": {"md": "writeups/actuality-implies-actual-profile-r.md", "handwritten": false, "html": "writeups/actuality-implies-actual-profile-r.html"}}, {"id": "actuality-implies-inextensible-comprehension-r", "premises": ["actuality"], "conclusion": "inextensible-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 38, p. 29."], "source_names": ["Classicism"], "proof": "If w is the actual atom, the source takes $\\lambda\\bar y\\, .\\,w\\land X[\\bar y]$. Since w is true, this is coextensive with X. Its restriction to the actual complete profile makes the universal necessary consequences of its instances entailed by it, giving the source’s inextensibility condition.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, n. 38, p. 29"}], "notes": "", "file": "topics/classicism/results/actuality-implies-inextensible-comprehension-r.yaml", "files": {"md": "writeups/actuality-implies-inextensible-comprehension-r.md", "handwritten": false, "html": "writeups/actuality-implies-inextensible-comprehension-r.html"}}, {"id": "actuality-implies-persistent-comprehension-r", "premises": ["actuality"], "conclusion": "persistent-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 38, p. 29."], "source_names": ["Classicism"], "proof": "If w witnesses Actuality, then $\\lambda\\bar y\\, .\\,w\\le X[\\bar y]$ is coextensive with X. Entailments are necessary when true, so this relation is persistent.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, n. 38, p. 29"}], "notes": "", "file": "topics/classicism/results/actuality-implies-persistent-comprehension-r.yaml", "files": {"md": "writeups/actuality-implies-persistent-comprehension-r.md", "handwritten": false, "html": "writeups/actuality-implies-persistent-comprehension-r.html"}}, {"id": "atomicity-and-bf-imply-necessary-actuality", "premises": ["atomicity-r", "barcan-r"], "conclusion": "necessary-actuality", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.7, p. 26."], "source_names": ["Classicism"], "proof": "If w is a propositional atom, it entails every conditional $q\\to(w\\le q)$: either it entails q, in which case the entailment is necessary, or it entails its negation. Tractarianism, equivalent to BF, combines these into the universal claim that w entails every truth. Hence w entails Actuality. Atomicity says every possible proposition has an atom below it, so no possible proposition can entail the negation of Actuality. Thus that negation is $\\bot$ and Actuality is necessary.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.7, p. 26"}], "notes": "", "file": "topics/classicism/results/atomicity-and-bf-imply-necessary-actuality.yaml", "files": {"md": "writeups/atomicity-and-bf-imply-necessary-actuality.md", "handwritten": false, "html": "writeups/atomicity-and-bf-imply-necessary-actuality.html"}}, {"id": "atomicity-r-implies-atomicity-t", "premises": ["atomicity-r"], "conclusion": "atomicity-t", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24."], "source_names": ["Classicism"], "proof": "Specialize the source’s universal type block to type t.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, p. 24"}], "notes": "", "file": "topics/classicism/results/atomicity-r-implies-atomicity-t.yaml", "files": {"md": "writeups/atomicity-r-implies-atomicity-t.md", "handwritten": false, "html": "writeups/atomicity-r-implies-atomicity-t.html"}}, {"id": "atomicity-t-and-bf-imply-necessary-actuality", "premises": ["atomicity-t", "barcan-r"], "conclusion": "necessary-actuality", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.7 and proof, p. 26."], "source_names": ["Classicism"], "proof": "If w is a propositional atom, it entails every conditional $q\\to(w\\le q)$: either it entails q, in which case the entailment is necessary, or it entails its negation. Tractarianism, equivalent to BF, combines these into the universal claim that w entails every truth. Hence w entails Actuality. Atomicity says every possible proposition has an atom below it, so no possible proposition can entail the negation of Actuality. Thus that negation is $\\bot$ and Actuality is necessary.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.7 and proof, p. 26"}], "notes": "The displayed proof uses only the type-t Atomicity instance. BF retains its stated type-schematic scope; no weakening of its range is inferred.", "file": "topics/classicism/results/atomicity-t-and-bf-imply-necessary-actuality.yaml", "files": {"md": "writeups/atomicity-t-and-bf-imply-necessary-actuality.md", "handwritten": false, "html": "writeups/atomicity-t-and-bf-imply-necessary-actuality.html"}}, {"id": "atomicity-t-incompatible-with-atomlessness", "premises": ["atomicity-t", "atomlessness"], "conclusion": "false", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24; Appendix D, p. 76."], "source_names": ["Classicism"], "proof": "Atomicity applied to $\\top$ supplies a non-bottom atom. Atomlessness supplies a strictly smaller non-bottom proposition below that atom, contradicting its defining minimality.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, p. 24; Appendix D, p. 76"}], "notes": "", "file": "topics/classicism/results/atomicity-t-incompatible-with-atomlessness.yaml", "files": {"md": "writeups/atomicity-t-incompatible-with-atomlessness.md", "handwritten": false, "html": "writeups/atomicity-t-incompatible-with-atomlessness.html"}}, {"id": "barcan-r-implies-barcan-t", "premises": ["barcan-r"], "conclusion": "barcan-t", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.1, pp. 20–21."], "source_names": ["Classicism"], "proof": "Specialize the source’s universal type block to type t.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.1, pp. 20–21"}], "notes": "", "file": "topics/classicism/results/barcan-r-implies-barcan-t.yaml", "files": {"md": "writeups/barcan-r-implies-barcan-t.md", "handwritten": false, "html": "writeups/barcan-r-implies-barcan-t.html"}}, {"id": "barcan-r-implies-functionality-r", "premises": ["barcan-r"], "conclusion": "functionality-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.1, n. 27, pp. 20–21."], "source_names": ["Classicism"], "proof": "Pointwise identity gives necessary pointwise agreement under all remaining applications, by Leibniz’s Law and NI. Apply the required BF instances to move the object quantifiers under the box. Intensionality then identifies X and Y. All function types here are admitted by the fixed type system.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.1, n. 27, pp. 20–21"}], "notes": "", "file": "topics/classicism/results/barcan-r-implies-functionality-r.yaml", "files": {"md": "writeups/barcan-r-implies-functionality-r.md", "handwritten": false, "html": "writeups/barcan-r-implies-functionality-r.html"}}, {"id": "boolean-completeness-r-implies-boolean-completeness-t", "premises": ["boolean-completeness-r"], "conclusion": "boolean-completeness-t", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, pp. 23–24."], "source_names": ["Classicism"], "proof": "Specialize the source’s universal type block to type t.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, pp. 23–24"}], "notes": "", "file": "topics/classicism/results/boolean-completeness-r-implies-boolean-completeness-t.yaml", "files": {"md": "writeups/boolean-completeness-r-implies-boolean-completeness-t.md", "handwritten": false, "html": "writeups/boolean-completeness-r-implies-boolean-completeness-t.html"}}, {"id": "c5-and-actuality-imply-completeness", "premises": ["necessary-distinctness-necessary-r", "actuality"], "conclusion": "boolean-completeness-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.5, pp. 25, 29–30."], "source_names": ["Classicism"], "proof": "Proposition 2.10 gives Rigid Comprehension from C5 and Actuality. Proposition 2.8 then gives Boolean Completeness. Both proofs are separately transcribed in this map.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.5, pp. 25, 29–30"}], "notes": "", "file": "topics/classicism/results/c5-and-actuality-imply-completeness.yaml", "files": {"md": "writeups/c5-and-actuality-imply-completeness.md", "handwritten": false, "html": "writeups/c5-and-actuality-imply-completeness.html"}}, {"id": "c5-and-actuality-imply-rigid-comprehension", "premises": ["necessary-distinctness-necessary-r", "actuality"], "conclusion": "rigid-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.10, pp. 29–30 and n. 41."], "source_names": ["Classicism"], "proof": "Actuality supplies persistent coextensions as in note 38. In C5, persistence implies inextensibility. To see this, suppose Y is persistent and each Y-instance necessarily satisfies X. B makes a failure of Y necessarily incompatible with necessary Y; by persistence this gives necessary non-Y. Therefore each argument necessarily satisfies the conditional from Y to X, and BF combines these into entailment. Boxed ND makes the reasoning available throughout the modal range, as required by Inextensible. The persistent coextension is consequently rigid.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.10, pp. 29–30 and n. 41"}], "notes": "", "file": "topics/classicism/results/c5-and-actuality-imply-rigid-comprehension.yaml", "files": {"md": "writeups/c5-and-actuality-imply-rigid-comprehension.md", "handwritten": false, "html": "writeups/c5-and-actuality-imply-rigid-comprehension.html"}}, {"id": "c5-and-atomicity-imply-necessary-atomicity", "premises": ["necessary-distinctness-necessary-r", "atomicity-r"], "conclusion": "necessary-atomicity-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.6, pp. 25–26; concluding equivalences, p. 33."], "source_names": ["Classicism"], "proof": "The premises give boxed Actuality by Proposition 2.7. Axiom 4 supplies boxed C5 instances and doubly boxed Actuality. Necessitate the closed, finite-premise implication used for each target instance in Proposition 2.6 and apply K. This gives each boxed Atomicity instance.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.6, pp. 25–26; concluding equivalences, p. 33"}], "notes": "", "file": "topics/classicism/results/c5-and-atomicity-imply-necessary-atomicity.yaml", "files": {"md": "writeups/c5-and-atomicity-imply-necessary-atomicity.md", "handwritten": false, "html": "writeups/c5-and-atomicity-imply-necessary-atomicity.html"}}, {"id": "c5-and-atomicity-imply-necessary-completeness", "premises": ["necessary-distinctness-necessary-r", "atomicity-r"], "conclusion": "necessary-boolean-completeness-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.6, pp. 25–26; Proposition 2.5."], "source_names": ["Classicism"], "proof": "C5 gives BF, so Proposition 2.7 gives boxed Actuality. C5 is itself necessary by 4. Apply the necessitated, closed instance proofs of Proposition 2.5 inside this box to obtain every boxed instance of Boolean Completeness.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.6, pp. 25–26; Proposition 2.5"}], "notes": "", "file": "topics/classicism/results/c5-and-atomicity-imply-necessary-completeness.yaml", "files": {"md": "writeups/c5-and-atomicity-imply-necessary-completeness.md", "handwritten": false, "html": "writeups/c5-and-atomicity-imply-necessary-completeness.html"}}, {"id": "c5-and-atomicity-imply-necessary-plenitude", "premises": ["necessary-distinctness-necessary-r", "atomicity-r"], "conclusion": "necessary-plenitude-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, concluding equivalences, p. 33."], "source_names": ["Classicism"], "proof": "Proposition 2.6 gives boxed Boolean Completeness. C5 is itself necessary by 4, so the necessitated instance proofs of Proposition 2.14 yield boxed Plenitude.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, concluding equivalences, p. 33"}], "notes": "", "file": "topics/classicism/results/c5-and-atomicity-imply-necessary-plenitude.yaml", "files": {"md": "writeups/c5-and-atomicity-imply-necessary-plenitude.md", "handwritten": false, "html": "writeups/c5-and-atomicity-imply-necessary-plenitude.html"}}, {"id": "c5-and-atomicity-imply-necessary-rigid-comprehension", "premises": ["necessary-distinctness-necessary-r", "atomicity-r"], "conclusion": "necessary-rigid-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, concluding equivalences, p. 33."], "source_names": ["Classicism"], "proof": "C5 and Atomicity give boxed Actuality by Proposition 2.7. C5 is necessary by 4. Use the necessitated instance proofs of Proposition 2.10 to get boxed Rigid Comprehension.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, concluding equivalences, p. 33"}], "notes": "", "file": "topics/classicism/results/c5-and-atomicity-imply-necessary-rigid-comprehension.yaml", "files": {"md": "writeups/c5-and-atomicity-imply-necessary-rigid-comprehension.md", "handwritten": false, "html": "writeups/c5-and-atomicity-imply-necessary-rigid-comprehension.html"}}, {"id": "c5-and-atomicity-imply-no-pure-contingency", "premises": ["necessary-distinctness-necessary-r", "atomicity-r"], "conclusion": "no-pure-contingency-r", "status": "conjectured", "certificate": {"source_id": "goodsell-yli-vakkuri-unpublished", "produced_by": "Zachary Goodsell and Juhani Yli-Vakkuri", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 27."], "source_names": ["Classicism"], "proof": "", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, p. 27"}, {"paper": "goodsell-yli-vakkuri-unpublished", "role": "origin", "locator": "Logical Foundations of Philosophy, as cited in Classicism p. 27"}], "notes": "Reported by the source as a theorem; conjectured is the map’s pending-verification status, not the source authors’ classification.\n\nSource report / verification needed: The source attributes this theorem to Goodsell and Yli-Vakkuri (unpublished) but does not reproduce a proof. Obtain and check that proof for the source schema before promoting this record.", "file": "topics/classicism/results/c5-and-atomicity-imply-no-pure-contingency.yaml", "files": {"md": "writeups/c5-and-atomicity-imply-no-pure-contingency.md", "handwritten": false, "html": "writeups/c5-and-atomicity-imply-no-pure-contingency.html"}}, {"id": "c5-and-completeness-imply-actuality", "premises": ["necessary-distinctness-necessary-r", "boolean-completeness-r"], "conclusion": "actuality", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.5, pp. 25, 32–33."], "source_names": ["Classicism"], "proof": "Under C5, Proposition 2.14 obtains Plenitude from Boolean Completeness. Proposition 2.15 then supplies a true atom. The underlying proofs are recorded separately.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.5, pp. 25, 32–33"}], "notes": "", "file": "topics/classicism/results/c5-and-completeness-imply-actuality.yaml", "files": {"md": "writeups/c5-and-completeness-imply-actuality.md", "handwritten": false, "html": "writeups/c5-and-completeness-imply-actuality.html"}}, {"id": "c5-and-completeness-imply-plenitude", "premises": ["necessary-distinctness-necessary-r", "boolean-completeness-r"], "conclusion": "plenitude-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.14, pp. 32–33 and n. 48."], "source_names": ["Classicism"], "proof": "For functional U with propositional output, take the least upper bound G of all operations X such that Xy entails the unique U-output at y. Fix a and its output p. The operation $\\lambda x\\, .\\,x=a\\land p$ lies below G, by ND, so p entails Ga. The operation $\\lambda x\\, .\\,x\\ne a\\lor p$ is an upper bound of the same family: ND gives the pointwise comparison and BF promotes it to entailment. Therefore Ga entails p. Antisymmetry gives Ga=p. For relational outputs the argument is applied to their finite argument tuples as in the source; all output types are relational.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.14, pp. 32–33 and n. 48"}], "notes": "", "file": "topics/classicism/results/c5-and-completeness-imply-plenitude.yaml", "files": {"md": "writeups/c5-and-completeness-imply-plenitude.md", "handwritten": false, "html": "writeups/c5-and-completeness-imply-plenitude.html"}}, {"id": "c5-and-necessary-actuality-imply-atomicity", "premises": ["necessary-distinctness-necessary-r", "necessary-actuality"], "conclusion": "atomicity-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.6, pp. 25–26."], "source_names": ["Classicism"], "proof": "C5 supplies BF and ND throughout the relevant modal range. BF and ND imply that a possibly atomic entity is already atomic: move the tests of entailment or incompatibility outward with BF, then use ND to turn possible identities into identities. Given a non-bottom proposition, boxed Actuality supplies a possible actual atom compatible with it; BF brings that atom into the current domain, and its compatibility makes it lie below the proposition. At a relation type the same argument uses the possible true profile of an instance, pairing the actual atom with the tuple’s haecceity. BF imports its tuple and ND preserves its identities. This is the type-uniform direction of the proposition stated by the source.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.6, pp. 25–26"}], "notes": "The source sketches the propositional case; the relation-type clause explains the stated schema reading. No assertion is made about types ending in e.", "file": "topics/classicism/results/c5-and-necessary-actuality-imply-atomicity.yaml", "files": {"md": "writeups/c5-and-necessary-actuality-imply-atomicity.md", "handwritten": false, "html": "writeups/c5-and-necessary-actuality-imply-atomicity.html"}}, {"id": "c5-and-necessary-completeness-imply-atomicity", "premises": ["necessary-distinctness-necessary-r", "necessary-boolean-completeness-r"], "conclusion": "atomicity-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.6, pp. 25–26; Proposition 2.5."], "source_names": ["Classicism"], "proof": "C5 remains available necessarily by 4. Necessitated instance proofs of Proposition 2.5 turn boxed Boolean Completeness into boxed Actuality. The other direction of Proposition 2.6 then gives Atomicity.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.6, pp. 25–26; Proposition 2.5"}], "notes": "", "file": "topics/classicism/results/c5-and-necessary-completeness-imply-atomicity.yaml", "files": {"md": "writeups/c5-and-necessary-completeness-imply-atomicity.md", "handwritten": false, "html": "writeups/c5-and-necessary-completeness-imply-atomicity.html"}}, {"id": "classicism-implies-broad-necessitism-r", "premises": [], "conclusion": "broad-necessitism-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 19."], "source_names": ["Classicism"], "proof": "The theorem $\\forall x\\, .\\,\\exists y\\, .\\,y=x$ can be necessitated. Applying CBF yields $\\forall x\\, .\\,\\Box\\exists y\\, .\\,y=x$.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, p. 19"}], "notes": "", "file": "topics/classicism/results/classicism-implies-broad-necessitism-r.yaml", "files": {"md": "writeups/classicism-implies-broad-necessitism-r.md", "handwritten": false, "html": "writeups/classicism-implies-broad-necessitism-r.html"}}, {"id": "classicism-implies-converse-barcan-r", "premises": [], "conclusion": "converse-barcan-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 19."], "source_names": ["Classicism"], "proof": "Necessitate universal instantiation and use K to obtain $\\Box\\forall x\\, .\\,P\\to\\Box P$. Generalize x, preserving the side condition, to obtain CBF. The predicate version is supplied by lambda abstraction.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, p. 19"}], "notes": "", "file": "topics/classicism/results/classicism-implies-converse-barcan-r.yaml", "files": {"md": "writeups/classicism-implies-converse-barcan-r.md", "handwritten": false, "html": "writeups/classicism-implies-converse-barcan-r.html"}}, {"id": "classicism-implies-existence-r", "premises": [], "conclusion": "existence-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.1, p. 7."], "source_names": ["Classicism"], "proof": "Reflexivity gives y=y. Existential introduction yields exists x (x=x) at each admitted type; equivalently use the source’s beta and EG derivation on p. 7.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.1, p. 7"}], "notes": "", "file": "topics/classicism/results/classicism-implies-existence-r.yaml", "files": {"md": "writeups/classicism-implies-existence-r.md", "handwritten": false, "html": "writeups/classicism-implies-existence-r.html"}}, {"id": "classicism-implies-identity-necessary-r", "premises": [], "conclusion": "identity-necessary-r", "status": "proved", "certificate": {"source_id": "necessity-of-identity", "produced_by": "W. V. Quine (historical attribution in Classicism p. 22)", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, p. 22."], "source_names": ["Classicism"], "proof": "Reflexivity is a theorem, so its necessitation gives $\\Box(x=x)$. Leibniz’s Law substitutes y for the second x under the premise x=y, giving $\\Box(x=y)$. Universally close the variables at each type.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.1, p. 22"}], "notes": "", "file": "topics/classicism/results/classicism-implies-identity-necessary-r.yaml", "files": {"md": "writeups/classicism-implies-identity-necessary-r.md", "handwritten": false, "html": "writeups/classicism-implies-identity-necessary-r.html"}}, {"id": "classicism-implies-intensionality-r", "premises": [], "conclusion": "intensionality-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, pp. 17–18."], "source_names": ["Classicism"], "proof": "Logical Equivalence identifies the lambda abstractions of $X[\\bar z]\\land\\forall\\bar u\\, .\\,X[\\bar u]\\leftrightarrow Y[\\bar u]$ and the analogous expression with Y in the first conjunct, with the quantified biconditional parenthesized as the second conjunct. If that biconditional is necessary, substitute its identity with $\\top$ into the abstraction identity. Boolean identities and beta-eta conversion leave X=Y, exactly as on p. 17.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, pp. 17–18"}], "notes": "", "file": "topics/classicism/results/classicism-implies-intensionality-r.yaml", "files": {"md": "writeups/classicism-implies-intensionality-r.md", "handwritten": false, "html": "writeups/classicism-implies-intensionality-r.html"}}, {"id": "classicism-implies-modal-four", "premises": [], "conclusion": "modal-four", "status": "proved", "certificate": {"source_id": "the-broadest-necessity", "produced_by": "Andrew Bacon (source credits the S4 result to Bacon 2018)", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 17."], "source_names": ["Classicism"], "proof": "Apply NI to the identity $p=\\top$. Its conclusion is $\\Box(p=\\top)$, which is $\\Box\\Box p$.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, p. 17"}], "notes": "", "file": "topics/classicism/results/classicism-implies-modal-four.yaml", "files": {"md": "writeups/classicism-implies-modal-four.md", "handwritten": false, "html": "writeups/classicism-implies-modal-four.html"}}, {"id": "classicism-implies-modal-k", "premises": [], "conclusion": "modal-k", "status": "proved", "certificate": {"source_id": "the-broadest-necessity", "produced_by": "Andrew Bacon (source credits the S4 result to Bacon 2018)", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 16."], "source_names": ["Classicism"], "proof": "In the Boolean algebra of propositions, $\\Box(p\\to q)$ says that the implication is $\\top$. Together with $p=\\top$, substitution and the Boolean identities identify q with $\\top$. This is K.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, p. 16"}], "notes": "", "file": "topics/classicism/results/classicism-implies-modal-k.yaml", "files": {"md": "writeups/classicism-implies-modal-k.md", "handwritten": false, "html": "writeups/classicism-implies-modal-k.html"}}, {"id": "classicism-implies-modal-t", "premises": [], "conclusion": "modal-t", "status": "proved", "certificate": {"source_id": "the-broadest-necessity", "produced_by": "Andrew Bacon (source credits the S4 result to Bacon 2018)", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 16."], "source_names": ["Classicism"], "proof": "If $p=\\top$, identity elimination and truth of $\\top$ give p.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, p. 16"}], "notes": "", "file": "topics/classicism/results/classicism-implies-modal-t.yaml", "files": {"md": "writeups/classicism-implies-modal-t.md", "handwritten": false, "html": "writeups/classicism-implies-modal-t.html"}}, {"id": "classicism-implies-modalized-fregean", "premises": [], "conclusion": "modalized-fregean", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 18."], "source_names": ["Classicism"], "proof": "Necessary equivalence identifies $(p\\leftrightarrow q)$ with $\\top$. The Boolean identities then identify p and q; this is the nullary Intensionality instance.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, p. 18"}], "notes": "", "file": "topics/classicism/results/classicism-implies-modalized-fregean.yaml", "files": {"md": "writeups/classicism-implies-modalized-fregean.md", "handwritten": false, "html": "writeups/classicism-implies-modalized-fregean.html"}}, {"id": "classicism-implies-modalized-functionality-r", "premises": [], "conclusion": "modalized-functionality-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 18 and n. 22."], "source_names": ["Classicism"], "proof": "From boxed pointwise identity, identity elimination gives boxed agreement after applying every remaining argument of the relational output type. Quantification over those remaining arguments is inside the necessary logical implication. Intensionality and eta conversion identify the original operations; this is note 22, which relies on the output type ending in t.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, p. 18 and n. 22"}], "notes": "", "file": "topics/classicism/results/classicism-implies-modalized-functionality-r.yaml", "files": {"md": "writeups/classicism-implies-modalized-functionality-r.md", "handwritten": false, "html": "writeups/classicism-implies-modalized-functionality-r.html"}}, {"id": "classicism-implies-ordinary-comprehension-r", "premises": [], "conclusion": "ordinary-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, p. 27."], "source_names": ["Classicism"], "proof": "The lambda term $\\lambda\\bar y\\, .\\,P$ is a witness; beta conversion makes its application equivalent to P at each tuple. Existential introduction supplies the comprehension instance.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, p. 27"}], "notes": "", "file": "topics/classicism/results/classicism-implies-ordinary-comprehension-r.yaml", "files": {"md": "writeups/classicism-implies-ordinary-comprehension-r.md", "handwritten": false, "html": "writeups/classicism-implies-ordinary-comprehension-r.html"}}, {"id": "converse-witnessed-possibility-r-implies-no-pure-contingency-r", "premises": ["converse-witnessed-possibility-r"], "conclusion": "no-pure-contingency-r", "status": "proved", "certificate": {"source_id": "bacon-2020", "produced_by": "Andrew Bacon", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "proof": "Take the empty variable tuple and use the schema on $\\neg P$. Its instance $\\Diamond\\neg P\\to\\neg P$ contraposes to $P\\to\\Box P$.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, n. 57, p. 38"}, {"paper": "bacon-2020", "role": "origin", "locator": "Logical Necessity, as discussed in Classicism n. 57"}], "notes": "", "file": "topics/classicism/results/converse-witnessed-possibility-r-implies-no-pure-contingency-r.yaml", "files": {"md": "writeups/converse-witnessed-possibility-r-implies-no-pure-contingency-r.md", "handwritten": false, "html": "writeups/converse-witnessed-possibility-r-implies-no-pure-contingency-r.html"}}, {"id": "distinctness-necessary-r-implies-distinctness-necessary-t", "premises": ["distinctness-necessary-r"], "conclusion": "distinctness-necessary-t", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.2, p. 22."], "source_names": ["Classicism"], "proof": "Specialize the universal type schema ND to type t.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.2, p. 22"}], "notes": "", "file": "topics/classicism/results/distinctness-necessary-r-implies-distinctness-necessary-t.yaml", "files": {"md": "writeups/distinctness-necessary-r-implies-distinctness-necessary-t.md", "handwritten": false, "html": "writeups/distinctness-necessary-r-implies-distinctness-necessary-t.html"}}, {"id": "distinctness-necessary-t-implies-modal-five", "premises": ["distinctness-necessary-t"], "conclusion": "modal-five", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.2, p. 22."], "source_names": ["Classicism"], "proof": "Apply propositional ND to the distinctness of $\\neg p$ and $\\top$. Using $\\Diamond p\\leftrightarrow\\neg\\Box\\neg p$, its conclusion is $\\Box\\Diamond p$. Universally close p.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.2, p. 22"}], "notes": "", "file": "topics/classicism/results/distinctness-necessary-t-implies-modal-five.yaml", "files": {"md": "writeups/distinctness-necessary-t-implies-modal-five.md", "handwritten": false, "html": "writeups/distinctness-necessary-t-implies-modal-five.html"}}, {"id": "distinctness-schema-r-implies-possibility-schema-r", "premises": ["distinctness-schema-r"], "conclusion": "possibility-schema-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.4, pp. 35–36; §2.5, p. 37."], "source_names": ["Classicism"], "proof": "If P is consistent with the reference C theory, the closed identity $\\neg P=\\top$ is not one of its theorems. Distinctness therefore gives $\\neg P\\ne\\top$, equivalently $\\Diamond P$. Preserve the chosen pure or Sigma-expanded signature.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.4, pp. 35–36; §2.5, p. 37"}], "notes": "", "file": "topics/classicism/results/distinctness-schema-r-implies-possibility-schema-r.yaml", "files": {"md": "writeups/distinctness-schema-r-implies-possibility-schema-r.md", "handwritten": false, "html": "writeups/distinctness-schema-r-implies-possibility-schema-r.html"}}, {"id": "distinctness-signature-r-implies-distinctness-schema-r", "premises": ["distinctness-signature-r"], "conclusion": "distinctness-schema-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 38–39."], "source_names": ["Classicism"], "proof": "The pure closed identities are among the Sigma-language identities. Restrict the signature schema to these instances; adjoining uninterpreted constants does not change pure theoremhood in the reference source theory.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, pp. 38–39"}], "notes": "", "file": "topics/classicism/results/distinctness-signature-r-implies-distinctness-schema-r.yaml", "files": {"md": "writeups/distinctness-signature-r-implies-distinctness-schema-r.md", "handwritten": false, "html": "writeups/distinctness-signature-r-implies-distinctness-schema-r.html"}}, {"id": "distinctness-signature-r-implies-possibility-signature-r", "premises": ["distinctness-signature-r"], "conclusion": "possibility-signature-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.4, pp. 35–36; §2.5, p. 37."], "source_names": ["Classicism"], "proof": "If P is consistent with the reference C theory, the closed identity $\\neg P=\\top$ is not one of its theorems. Distinctness therefore gives $\\neg P\\ne\\top$, equivalently $\\Diamond P$. Preserve the chosen pure or Sigma-expanded signature.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.4, pp. 35–36; §2.5, p. 37"}], "notes": "", "file": "topics/classicism/results/distinctness-signature-r-implies-possibility-signature-r.yaml", "files": {"md": "writeups/distinctness-signature-r-implies-possibility-signature-r.md", "handwritten": false, "html": "writeups/distinctness-signature-r-implies-possibility-signature-r.html"}}, {"id": "distinctness-signature-r-implies-separated-structure-r", "premises": ["distinctness-signature-r"], "conclusion": "separated-structure-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, p. 39."], "source_names": ["Classicism"], "proof": "Fix the allowed c,F,G. If Fc=Gc is a theorem of the reference C theory, uniform substitution for the fresh c followed by its zeta rule yields F=G. Otherwise the signature Distinctness schema makes Fc=Gc false, so the conditional holds. The freshness condition on c is essential.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, p. 39"}], "notes": "", "file": "topics/classicism/results/distinctness-signature-r-implies-separated-structure-r.yaml", "files": {"md": "writeups/distinctness-signature-r-implies-separated-structure-r.md", "handwritten": false, "html": "writeups/distinctness-signature-r-implies-separated-structure-r.html"}}, {"id": "extensionality-r-implies-actuality", "premises": ["extensionality-r"], "conclusion": "actuality", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 25."], "source_names": ["Classicism"], "proof": "Use $\\top$ as the witness. Every true proposition is identical to $\\top$ by the Fregean Axiom, so $\\top$ entails every truth.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, p. 25"}], "notes": "", "file": "topics/classicism/results/extensionality-r-implies-actuality.yaml", "files": {"md": "writeups/extensionality-r-implies-actuality.md", "handwritten": false, "html": "writeups/extensionality-r-implies-actuality.html"}}, {"id": "extensionality-r-implies-atomicity-r", "premises": ["extensionality-r"], "conclusion": "atomicity-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24 and n. 30."], "source_names": ["Classicism"], "proof": "At type t, the Fregean Axiom leaves just $\\bot,\\top$ and $\\top$ is an atom. At a relation type, each tuple’s haecceity $\\lambda\\bar z\\, .\\,\\bigwedge_i z_i=y_i$ is an atom by Extensionality. A non-bottom relation has an instance, whose tuple-haecceity is below that relation.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, p. 24 and n. 30"}], "notes": "", "file": "topics/classicism/results/extensionality-r-implies-atomicity-r.yaml", "files": {"md": "writeups/extensionality-r-implies-atomicity-r.md", "handwritten": false, "html": "writeups/extensionality-r-implies-atomicity-r.html"}}, {"id": "extensionality-r-implies-boolean-completeness-r", "premises": ["extensionality-r"], "conclusion": "boolean-completeness-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24 and n. 29."], "source_names": ["Classicism"], "proof": "For a property X of relations, put $U=\\lambda\\bar z\\, .\\,\\forall Z\\, .\\,XZ\\to Z[\\bar z]$. When XV holds, the Fregean Axiom makes XV necessary and the displayed universal sentence entails $V[\\bar z]$; Extensionality gives $U\\le V$. Conversely, any lower bound Y pointwise entails the displayed defining condition for U, so Extensionality gives $Y\\le U$. Thus U is a GLB.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.2, p. 24 and n. 29"}], "notes": "", "file": "topics/classicism/results/extensionality-r-implies-boolean-completeness-r.yaml", "files": {"md": "writeups/extensionality-r-implies-boolean-completeness-r.md", "handwritten": false, "html": "writeups/extensionality-r-implies-boolean-completeness-r.html"}}, {"id": "extensionality-r-implies-fregean-axiom", "premises": ["extensionality-r"], "conclusion": "fregean-axiom", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16."], "source_names": ["Classicism"], "proof": "Take the nullary instance of Extensionality: the pointwise biconditional is simply p iff q.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.4, pp. 15–16"}], "notes": "", "file": "topics/classicism/results/extensionality-r-implies-fregean-axiom.yaml", "files": {"md": "writeups/extensionality-r-implies-fregean-axiom.md", "handwritten": false, "html": "writeups/extensionality-r-implies-fregean-axiom.html"}}, {"id": "extensionality-r-implies-functionality-r", "premises": ["extensionality-r"], "conclusion": "functionality-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16."], "source_names": ["Classicism"], "proof": "If $Xz=Yz$ for every z, application and identity elimination give agreement of $X[\\bar z]$ and $Y[\\bar z]$ on all remaining arguments. The output type ends in t, so Extensionality identifies X and Y.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.4, pp. 15–16"}], "notes": "", "file": "topics/classicism/results/extensionality-r-implies-functionality-r.yaml", "files": {"md": "writeups/extensionality-r-implies-functionality-r.md", "handwritten": false, "html": "writeups/extensionality-r-implies-functionality-r.html"}}, {"id": "extensionality-r-implies-plenitude-r", "premises": ["extensionality-r"], "conclusion": "plenitude-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, p. 31 and n. 45."], "source_names": ["Classicism"], "proof": "For a functional relation U with output type $\\tau=\\bar\\sigma t$, take $X=\\lambda x\\bar y\\, .\\,\\exists Z^\\tau\\, .\\,(Ux)Z\\land Z[\\bar y]$. At each x, uniqueness of the U-output makes Xx coextensive with that output, and Extensionality identifies them. The formula therefore represents U.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, p. 31 and n. 45"}], "notes": "", "file": "topics/classicism/results/extensionality-r-implies-plenitude-r.yaml", "files": {"md": "writeups/extensionality-r-implies-plenitude-r.md", "handwritten": false, "html": "writeups/extensionality-r-implies-plenitude-r.html"}}, {"id": "extensionality-r-implies-rigid-comprehension-r", "premises": ["extensionality-r"], "conclusion": "rigid-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, p. 29."], "source_names": ["Classicism"], "proof": "Under Extensionality and the Fregean Axiom, every truth is necessary and every relation is persistent and inextensible. The relation itself therefore witnesses its rigid coextension.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, p. 29"}], "notes": "", "file": "topics/classicism/results/extensionality-r-implies-rigid-comprehension-r.yaml", "files": {"md": "writeups/extensionality-r-implies-rigid-comprehension-r.md", "handwritten": false, "html": "writeups/extensionality-r-implies-rigid-comprehension-r.html"}}, {"id": "fregean-axiom-implies-extensionality-r", "premises": ["fregean-axiom"], "conclusion": "extensionality-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, p. 16 and n. 18."], "source_names": ["Classicism"], "proof": "The Fregean Axiom makes every true proposition identical to $\\top$, hence necessary. Apply this to the sentence $\\forall\\bar z\\, .\\,X[\\bar z]\\leftrightarrow Y[\\bar z]$ and then use the background Intensionality theorem at that relational type. Note 18 explicitly excludes the inference to Functionality at types ending in e.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.4, p. 16 and n. 18"}], "notes": "", "file": "topics/classicism/results/fregean-axiom-implies-extensionality-r.yaml", "files": {"md": "writeups/fregean-axiom-implies-extensionality-r.md", "handwritten": false, "html": "writeups/fregean-axiom-implies-extensionality-r.html"}}, {"id": "fregean-axiom-implies-necessary-distinctness-necessary-r", "premises": ["fregean-axiom"], "conclusion": "necessary-distinctness-necessary-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16; Figure 5, p. 23."], "source_names": ["Classicism"], "proof": "The Fregean Axiom gives $p\\to\\Box p$ for every proposition p, by comparison with $\\top$. Apply it to each distinctness claim, then universally close x,y to obtain ND at a chosen type. Apply the same Fregean Axiom to that whole true closed ND sentence. This yields boxed ND at each type.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.4, pp. 15–16; Figure 5, p. 23"}], "notes": "", "file": "topics/classicism/results/fregean-axiom-implies-necessary-distinctness-necessary-r.yaml", "files": {"md": "writeups/fregean-axiom-implies-necessary-distinctness-necessary-r.md", "handwritten": false, "html": "writeups/fregean-axiom-implies-necessary-distinctness-necessary-r.html"}}, {"id": "fregean-axiom-implies-necessary-fregean-axiom", "premises": ["fregean-axiom"], "conclusion": "necessary-fregean-axiom", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16."], "source_names": ["Classicism"], "proof": "Use the Fregean Axiom’s consequence $p\\to\\Box p$ on the proposition expressed by its own universal closure.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.4, pp. 15–16"}], "notes": "", "file": "topics/classicism/results/fregean-axiom-implies-necessary-fregean-axiom.yaml", "files": {"md": "writeups/fregean-axiom-implies-necessary-fregean-axiom.md", "handwritten": false, "html": "writeups/fregean-axiom-implies-necessary-fregean-axiom.html"}}, {"id": "fregean-axiom-implies-no-pure-contingency-r", "premises": ["fregean-axiom"], "conclusion": "no-pure-contingency-r", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16; §2.2, p. 27."], "source_names": ["Classicism"], "proof": "For each closed pure sentence P, if P is true it is materially equivalent to $\\top$, hence identical to $\\top$ by the Fregean Axiom. Thus $P\\to\\Box P$.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.4, pp. 15–16; §2.2, p. 27"}], "notes": "", "file": "topics/classicism/results/fregean-axiom-implies-no-pure-contingency-r.yaml", "files": {"md": "writeups/fregean-axiom-implies-no-pure-contingency-r.md", "handwritten": false, "html": "writeups/fregean-axiom-implies-no-pure-contingency-r.html"}}, {"id": "fregean-incompatible-with-infinity-t", "premises": ["fregean-axiom", "infinity-t"], "conclusion": "false", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 47, p. 32."], "source_names": ["Classicism"], "proof": "The Fregean Axiom identifies every true proposition with $\\top$ and every false one with $\\bot$. Its propositional domain therefore has exactly two elements, contradicting the three-distinct-propositions instance of Infinity.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, n. 47, p. 32"}], "notes": "", "file": "topics/classicism/results/fregean-incompatible-with-infinity-t.yaml", "files": {"md": "writeups/fregean-incompatible-with-infinity-t.md", "handwritten": false, "html": "writeups/fregean-incompatible-with-infinity-t.html"}}, {"id": "functional-choice-r-implies-plenitude-r", "premises": ["functional-choice-r"], "conclusion": "plenitude-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 31–32."], "source_names": ["Classicism"], "proof": "A total single-valued relation is serial. Apply Functional Choice to obtain its representing operation.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, pp. 31–32"}], "notes": "", "file": "topics/classicism/results/functional-choice-r-implies-plenitude-r.yaml", "files": {"md": "writeups/functional-choice-r-implies-plenitude-r.md", "handwritten": false, "html": "writeups/functional-choice-r-implies-plenitude-r.html"}}, {"id": "functional-choice-r-implies-relational-choice-r", "premises": ["functional-choice-r"], "conclusion": "relational-choice-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 31–32."], "source_names": ["Classicism"], "proof": "Choose an operation X selecting from the serial relation U. Its graph, $\\lambda x y\\, .\\,Xx=y$, is a functional subrelation of U. If the output type is e, first replace each output individual by its haecceity of type et. Functional Choice selects such a haecceity; equality with that selected haecceity defines a functional subrelation of the original relation. Haecceities are injective by identity elimination, so this covers the individual-output case without assuming a selecting operation into e.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, pp. 31–32"}], "notes": "", "file": "topics/classicism/results/functional-choice-r-implies-relational-choice-r.yaml", "files": {"md": "writeups/functional-choice-r-implies-relational-choice-r.md", "handwritten": false, "html": "writeups/functional-choice-r-implies-relational-choice-r.html"}}, {"id": "functionality-r-implies-tractarianism-r", "premises": ["functionality-r"], "conclusion": "tractarianism-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.1, n. 27, pp. 20–21."], "source_names": ["Classicism"], "proof": "Assume $p\\le Fx$ for every x. Functionality identifies $F$ with $\\lambda x\\, .\\,Fx\\lor p$. Distribution of the constant disjunct through the universal quantifier identifies $\\forall x\\, .\\,Fx$ with $(\\forall x\\, .\\,Fx)\\lor p$, which is the required entailment.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.1, n. 27, pp. 20–21"}], "notes": "", "file": "topics/classicism/results/functionality-r-implies-tractarianism-r.yaml", "files": {"md": "writeups/functionality-r-implies-tractarianism-r.md", "handwritten": false, "html": "writeups/functionality-r-implies-tractarianism-r.html"}}, {"id": "fundamental-possibility-and-fundamental-individuals-imply-possibility-plus", "premises": ["fundamental-possibility-r", "all-individuals-fundamental"], "conclusion": "possibility-plus-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, n. 60, p. 41."], "source_names": ["Classicism"], "proof": "Given a pairwise distinct tuple of individuals, the second premise makes every member fundamental. This supplies the full antecedent of the corresponding Fundamental Possibility instance, whose consequent is the required possibility.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.6, n. 60, p. 41"}], "notes": "", "file": "topics/classicism/results/fundamental-possibility-and-fundamental-individuals-imply-possibility-plus.yaml", "files": {"md": "writeups/fundamental-possibility-and-fundamental-individuals-imply-possibility-plus.md", "handwritten": false, "html": "writeups/fundamental-possibility-and-fundamental-individuals-imply-possibility-plus.html"}}, {"id": "fundamental-possibility-r-implies-possibility-schema-r", "premises": ["fundamental-possibility-r"], "conclusion": "possibility-schema-r", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 39–40."], "source_names": ["Classicism"], "proof": "Use the empty tuple of fundamental entities. Its empty conjunction of fundamentality and pairwise-distinctness conditions is true, and the remaining instances are exactly pure Possibility.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, pp. 39–40"}], "notes": "", "file": "topics/classicism/results/fundamental-possibility-r-implies-possibility-schema-r.yaml", "files": {"md": "writeups/fundamental-possibility-r-implies-possibility-schema-r.md", "handwritten": false, "html": "writeups/fundamental-possibility-r-implies-possibility-schema-r.html"}}, {"id": "gallin-comprehension-and-bf-imply-rigid-comprehension", "premises": ["gallin-extensional-comprehension-r", "barcan-r"], "conclusion": "rigid-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 37, p. 28."], "source_names": ["Classicism"], "proof": "The source states that, under BF, persistence of a relation and of its negation implies its inextensibility. Given pointwise necessary consequences on its instances, the persistent complement makes all non-instance cases necessary too; BF assembles the resulting pointwise necessary conditional into entailment. Use the Gallin-rigid coextension, which is then rigid in the source’s sense.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, n. 37, p. 28"}], "notes": "The source’s note states the predicate implication. This record applies it to the same comprehension witness; no converse is inferred.", "file": "topics/classicism/results/gallin-comprehension-and-bf-imply-rigid-comprehension.yaml", "files": {"md": "writeups/gallin-comprehension-and-bf-imply-rigid-comprehension.md", "handwritten": false, "html": "writeups/gallin-comprehension-and-bf-imply-rigid-comprehension.html"}}, {"id": "logical-necessity-r-implies-no-pure-contingency-r", "premises": ["logical-necessity-r"], "conclusion": "no-pure-contingency-r", "status": "proved", "certificate": {"source_id": "bacon-2020", "produced_by": "Andrew Bacon", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "proof": "Take the empty tuple in Logical Necessity; it states that a closed pure P is necessary iff true. Its right-to-left direction is No Pure Contingency.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, n. 57, p. 38"}, {"paper": "bacon-2020", "role": "origin", "locator": "Logical Necessity, as discussed in Classicism n. 57"}], "notes": "", "file": "topics/classicism/results/logical-necessity-r-implies-no-pure-contingency-r.yaml", "files": {"md": "writeups/logical-necessity-r-implies-no-pure-contingency-r.md", "handwritten": false, "html": "writeups/logical-necessity-r-implies-no-pure-contingency-r.html"}}, {"id": "logical-necessity-r-implies-witnessed-possibility-r", "premises": ["logical-necessity-r"], "conclusion": "witnessed-possibility-r", "status": "proved", "certificate": {"source_id": "bacon-2020", "produced_by": "Andrew Bacon", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "proof": "Apply the biconditional to the negation of the pure formula. Contraposition and modal and quantifier duality yield Witnessed Possibility.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, n. 57, p. 38"}, {"paper": "bacon-2020", "role": "origin", "locator": "Logical Necessity, as discussed in Classicism n. 57"}], "notes": "", "file": "topics/classicism/results/logical-necessity-r-implies-witnessed-possibility-r.yaml", "files": {"md": "writeups/logical-necessity-r-implies-witnessed-possibility-r.md", "handwritten": false, "html": "writeups/logical-necessity-r-implies-witnessed-possibility-r.html"}}, {"id": "maximalist-distinctness-incompatible-with-nd", "premises": ["distinctness-schema-r", "distinctness-necessary-r"], "conclusion": "false", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 41."], "source_names": ["Classicism"], "proof": "Choose a closed pure identity A=B such that both it and its negation are C-consistent, as the paper explains. Distinctness gives $A\\ne B$ while its equivalent Possibility schema gives $\\Diamond(A=B)$. ND applied at the common type gives $\\Box(A\\ne B)$, a contradiction.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.6, p. 41"}], "notes": "", "file": "topics/classicism/results/maximalist-distinctness-incompatible-with-nd.yaml", "files": {"md": "writeups/maximalist-distinctness-incompatible-with-nd.md", "handwritten": false, "html": "writeups/maximalist-distinctness-incompatible-with-nd.html"}}, {"id": "maximalist-distinctness-incompatible-with-necessary-actuality", "premises": ["distinctness-schema-r", "necessary-actuality"], "conclusion": "false", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 41; Appendix D, Proposition D.5(1), pp. 74–76."], "source_names": ["Classicism"], "proof": "The cited source construction makes a closed instance of Actuality false, so its negation is C-consistent. Pure Possibility, equivalent to pure Distinctness, says that negation is possible. The corresponding boxed instance of the second premise says it is impossible.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.6, p. 41; Appendix D, Proposition D.5(1), pp. 74–76"}], "notes": "", "file": "topics/classicism/results/maximalist-distinctness-incompatible-with-necessary-actuality.yaml", "files": {"md": "writeups/maximalist-distinctness-incompatible-with-necessary-actuality.md", "handwritten": false, "html": "writeups/maximalist-distinctness-incompatible-with-necessary-actuality.html"}}, {"id": "maximalist-distinctness-incompatible-with-necessary-atomicity-r", "premises": ["distinctness-schema-r", "necessary-atomicity-r"], "conclusion": "false", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr,
