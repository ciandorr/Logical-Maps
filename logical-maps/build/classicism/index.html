  } else setAssumption(id, state.excluded.has(id) && state.negativeShown.has(id) ? 'negative' : 'positive');
}
function addBackgroundPreset(presetId) {
  const preset = backgroundPresets.find(p => p.id === presetId);
  if (!preset) return;
  for (const id of preset.principles) { background.add(id); negativeBackground.delete(id); }
  state.modelId = null; state.selected = null;
  saveBackground(); refreshPrincipleControls(); renderAll(true);
}
function saveBackground() {
  try {
    const url = new URL(window.location.href);
    const additions = [...background].filter(p => !topicBackground.includes(p)).sort();
    if (additions.length || backgroundPresets.some(p => p.default)) url.searchParams.set('assume', additions.join(','));
    else url.searchParams.delete('assume');
    negativeBackground.size ? url.searchParams.set('deny', [...negativeBackground].sort().join(',')) : url.searchParams.delete('deny');
    window.history.replaceState(window.history.state, '', url);
  } catch { /* Local files may not allow history updates. */ }
}
function renderBackground() {
  document.querySelectorAll('[data-background-preset]').forEach(button => {
    const preset = backgroundPresets.find(p => p.id === button.dataset.backgroundPreset);
    button.disabled = preset.principles.every(id => background.has(id));
  });
  const list = document.getElementById('background-list');
  // Keep existing rows in place while clicking exclusive choices.
  list.querySelectorAll('.background-row').forEach(row => {
    const removed = !inBackground(row.dataset.backgroundId);
    row.classList.toggle('is-removed', removed); row.inert = removed;
    if (!removed) row.classList.remove('is-collapsed');
  });
  for (const id of backgroundIds()) {
    let row = [...list.querySelectorAll('.background-row')].find(row => row.dataset.backgroundId === id);
    if (!row) {
      row = document.createElement('div'); row.className = 'background-row'; row.dataset.backgroundId = id;
      row.innerHTML = `${assumptionButtons(id)}<span class="sidebar-principle-line"><button class="lnk" data-background-principle="${id}">${esc(name(id))}</button>${topicBackground.includes(id) ? '<span class="background-fixed">fixed</span>' : `<button class="lnk" data-remove-background="${id}" aria-label="Return ${esc(name(id))} to graph">return</button>`}</span>`;
      row.querySelector('[data-background-principle]').addEventListener('click', ev => select({type: 'principle', id}, ev.shiftKey || ev.metaKey || ev.ctrlKey));
      row.querySelector('[data-remove-background]')?.addEventListener('click', () => changeBackground(id, false));
      wireAssumptions(row); list.appendChild(row);
    }
    row.querySelector('[data-assume-positive]').setAttribute('aria-pressed', background.has(id));
    row.querySelector('[data-assume-negative]').setAttribute('aria-pressed', negativeBackground.has(id));
  }
  document.getElementById('background-count').textContent = backgroundIds().length;
  renderSubscripts(list);
  document.getElementById('background-reset').disabled = background.size === topicBackground.length && !negativeBackground.size;
  const consequences = [...E.cl([]).facts].filter(p => p !== FALSE && !background.has(p));
  const excluded = [...backgroundExcluded.keys()].filter(p => !negativeBackground.has(p));
  const status = document.getElementById('background-status');
  status.classList.toggle('is-conflict', backgroundConflicts.length > 0);
  status.textContent = backgroundConflicts.length ? 'Inconsistent background — change or return an assumption.' : `${consequences.length} further principles follow · ${excluded.length} ruled out · ${E.models.length} known models`;
}

function renderAll(refit) {
  // Filter/background changes must not reopen the last inspected item's popup.
  // Only an explicit select() opens details.
  state.selected = null; document.getElementById('pop').hidden = true;
  recompute(); renderHeader(); renderBackground();
  document.querySelector('[data-tab="contribute"]').hidden = !DATA.contribute_html;
  document.getElementById('contribute').innerHTML = DATA.contribute_html || '';
  renderSubscripts(document.getElementById('contribute'));
  const backgroundPage = document.getElementById('background');
  if (!backgroundPage.dataset.ready) {
    backgroundPage.innerHTML = DATA.background_html || '<p class="dim">—</p>';
    renderSubscripts(backgroundPage);
    mountPaperCatalogue(); backgroundPage.dataset.ready = 'true';
  }
  renderGraph(); if (refit) fit(); renderModels(); renderResults(); renderOpen();
}
function resetBackground() {
  for (const id of [...background]) if (!topicBackground.includes(id)) background.delete(id);
  negativeBackground.clear(); state.modelId = null; state.selected = null;
  saveBackground(); refreshPrincipleControls(); renderAll(true);
}
document.getElementById('background-reset').addEventListener('click', resetBackground);
function wireBackgroundCompaction(list) {
  const compact = () => list.querySelectorAll('.is-removed').forEach(row => row.classList.add('is-collapsed'));
  list.addEventListener('pointerleave', compact);
  list.addEventListener('focusout', ev => { if (!list.contains(ev.relatedTarget) && !list.matches(':hover')) compact(); });
}
wireBackgroundCompaction(document.getElementById('background-list'));
(function renderSourceFilters() {
  const el = document.getElementById('source-filters');
  const published = sourceCatalog.filter(s => s.kind === 'published-paper');
  const sourceCheckboxes = sources => sources.map(s => `<label><input type="checkbox" data-source-filter="${esc(s.id)}" checked><span class="sw" style="border-color:${sourceColor(s)}"></span>${esc(s.name)}</label>`).join('');
  el.innerHTML = (published.length ? `<div class="source-group"><div class="source-group-head"><label title="Papers credited with the results or models, including original results presented here in an adapted form."><input type="checkbox" id="all-published-sources" checked>Published papers</label><button type="button" class="lnk" id="expand-published-sources" aria-expanded="false" aria-controls="published-source-list">Show papers</button></div><fieldset class="source-group" id="published-source-list" aria-label="Individual published papers" hidden>${sourceCheckboxes(published)}</fieldset></div>` : '')
    + [['online-submission', 'Online submissions'], ['misc', 'Miscellaneous']].map(([kind, label]) => {
      const sources = sourceCatalog.filter(s => s.kind === kind);
      return sources.length ? `<fieldset class="source-group"><legend>${label}</legend>${sourceCheckboxes(sources)}</fieldset>` : '';
    }).join('');
  const master = document.getElementById('all-published-sources');
  function syncMaster() {
    if (!master) return;
    const count = published.filter(s => state.allowed.has(s.id)).length;
    master.checked = count === published.length;
    master.indeterminate = count > 0 && count < published.length;
  }
  el.querySelectorAll('[data-source-filter]').forEach(cb => cb.addEventListener('change', () => {
    cb.checked ? state.allowed.add(cb.dataset.sourceFilter) : state.allowed.delete(cb.dataset.sourceFilter);
    syncMaster(); renderAll(true);
  }));
  master?.addEventListener('change', () => {
    for (const s of published) master.checked ? state.allowed.add(s.id) : state.allowed.delete(s.id);
    el.querySelectorAll('#published-source-list [data-source-filter]').forEach(cb => { cb.checked = state.allowed.has(cb.dataset.sourceFilter); });
    syncMaster(); renderAll(true);
  });
  document.getElementById('expand-published-sources')?.addEventListener('click', e => {
    const list = document.getElementById('published-source-list');
    list.hidden = !list.hidden;
    e.currentTarget.setAttribute('aria-expanded', String(!list.hidden));
    e.currentTarget.textContent = list.hidden ? 'Show papers' : 'Hide papers';
  });
})();
document.getElementById('lean-only').addEventListener('change', e => { state.leanOnly = e.target.checked; renderAll(true); });
document.getElementById('show-conj').addEventListener('change', e => {
  state.showConj = e.target.checked;
  if (state.showConj) {
    for (const r of R.filter(r => r.status === 'conjectured')) {
      for (const p of [...r.premises, r.conclusion]) state.excluded.delete(p);
    }
  }
  refreshPrincipleControls();
  renderAll(true);
});
function refreshGraphModeControls() {
  const only = state.conjectureOnly || state.unpublishedOnly;
  const conjectures = document.getElementById('show-conj'), isolated = document.getElementById('show-iso');
  conjectures.checked = state.showConj || state.conjectureOnly;
  conjectures.disabled = state.conjectureOnly;
  isolated.checked = state.showIso && !only;
  isolated.disabled = only;
}
for (const [id, key] of [['conjecture-only', 'conjectureOnly'], ['unpublished-only', 'unpublishedOnly']]) {
  document.getElementById(id).addEventListener('change', e => {
    state[key] = e.target.checked;
    if (state[key]) for (const r of R.filter(graphRuleVisible)) {
      for (const p of [...r.premises, r.conclusion]) state.excluded.delete(p);
    }
    refreshGraphModeControls(); refreshPrincipleControls(); renderAll(true);
  });
}
document.getElementById('show-resolved').checked = state.showResolved;
document.getElementById('show-resolved').addEventListener('change', e => {
  state.showResolved = e.target.checked;
  try {
    const url = new URL(window.location.href);
    state.showResolved ? url.searchParams.set('resolved', '1') : url.searchParams.delete('resolved');
    window.history.replaceState(window.history.state, '', url);
  } catch { /* Local-file viewers may not allow history updates. */ }
  renderOpen();
});
document.getElementById('trivial-arrows').addEventListener('change', e => { state.trivial = e.target.checked; renderAll(true); });
document.getElementById('show-iso').addEventListener('change', e => { state.showIso = e.target.checked; renderAll(true); });
document.getElementById('reduce-arrows').addEventListener('change', e => { state.reduced = e.target.checked; renderAll(true); });
document.getElementById('fit').addEventListener('click', fit);
(function () {
  const el = document.getElementById('pr-filters');
  const labels = principles => principles.map(p => `<div class="pr-row${inBackground(p.id) ? ' in-background is-collapsed' : ''}" data-pr-row="${p.id}"><span class="seg graph-choice" role="group" aria-label="Show forms of ${esc(p.name)}"><button data-show-positive="${p.id}" aria-label="Show ${esc(p.name)}" aria-pressed="true">✓</button><button data-show-negative="${p.id}" aria-label="Show not ${esc(p.name)}" aria-pressed="false">✗</button></span><span class="sidebar-principle-line"><button class="lnk principle-name" data-principle="${p.id}">${esc(p.name)}</button><span class="pr-actions"><button class="lnk" data-clear-graph="${p.id}">clear</button><button class="lnk" data-add-background="${p.id}" aria-label="Move ${esc(p.name)} to background">background</button></span></span></div>`).join('');
  el.innerHTML = principleGroups().map((g, i) => `<section class="pr-category" data-category="${g.id}"><h3>${esc(g.name)}</h3><div class="pr-category-actions"><button class="lnk" data-category-select="all">show positive</button><button class="lnk" data-category-select="none">clear</button><span class="pr-category-count"></span></div><div class="ctl">${labels(g.principles)}</div></section>`).join('');
  const repaint = () => { refreshPrincipleControls(); renderGraph(); fit(); };
  el.querySelectorAll('[data-show-positive]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.showPositive; state.excluded.has(id) ? state.excluded.delete(id) : state.excluded.add(id); repaint(); }));
  el.querySelectorAll('[data-show-negative]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.showNegative; state.negativeShown.has(id) ? state.negativeShown.delete(id) : state.negativeShown.add(id); repaint(); }));
  el.querySelectorAll('[data-clear-graph]').forEach(b => b.addEventListener('click', () => { state.excluded.add(b.dataset.clearGraph); state.negativeShown.delete(b.dataset.clearGraph); repaint(); }));
  const setSelection = (rows, selected) => {
    rows.forEach(row => { const id = row.dataset.prRow; if (inBackground(id)) return; selected ? state.excluded.delete(id) : state.excluded.add(id); if (!selected) state.negativeShown.delete(id); }); repaint();
  };
  el.querySelectorAll('[data-category-select]').forEach(b => b.addEventListener('click', () => setSelection(b.closest('.pr-category').querySelectorAll('.pr-row'), b.dataset.categorySelect === 'all')));
  document.getElementById('pr-all').addEventListener('click', () => setSelection(el.querySelectorAll('.pr-row'), true));
  document.getElementById('pr-none').addEventListener('click', () => setSelection(el.querySelectorAll('.pr-row'), false));
  el.querySelectorAll('[data-add-background]').forEach(b => b.addEventListener('click', () => changeBackground(b.dataset.addBackground, true)));
  const presets = document.getElementById('background-presets');
  presets.innerHTML = backgroundPresets.map(p => `<button class="btn small" data-background-preset="${esc(p.id)}">Background ${esc(p.name)}</button>`).join('');
  renderSubscripts(presets);
  presets.querySelectorAll('[data-background-preset]').forEach(b => b.addEventListener('click', () => addBackgroundPreset(b.dataset.backgroundPreset)));
  wire(el);
  const compact = () => el.querySelectorAll('.pr-row.in-background').forEach(row => row.classList.add('is-collapsed'));
  el.addEventListener('pointerleave', compact);
  el.addEventListener('focusout', ev => { if (!el.contains(ev.relatedTarget) && !el.matches(':hover')) compact(); });
  refreshPrincipleControls = () => {
    el.querySelectorAll('.pr-row').forEach(row => {
      const id = row.dataset.prRow, assumed = inBackground(id);
      row.classList.toggle('in-background', assumed); row.inert = assumed;
      if (!assumed) row.classList.remove('is-collapsed');
      row.querySelector('[data-show-positive]').setAttribute('aria-pressed', !state.excluded.has(id));
      row.querySelector('[data-show-negative]').setAttribute('aria-pressed', state.negativeShown.has(id));
    });
    el.querySelectorAll('.pr-category').forEach(group => {
      const ordinary = [...group.querySelectorAll('.pr-row')].filter(row => !inBackground(row.dataset.prRow));
      group.querySelector('.pr-category-count').textContent = `${ordinary.filter(row => !state.excluded.has(row.dataset.prRow) || state.negativeShown.has(row.dataset.prRow)).length}/${ordinary.length}`;
    });
  };
  refreshPrincipleControls();
})();
document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value; renderResults();
});
document.getElementById('graph-search').addEventListener('input', e => {
  const normalize = value => value.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const query = normalize(e.target.value);
  const terms = query.split(/\s+/);
  graphSearch.matches = new Set(query ? P.filter(p => {
    const text = normalize([p.name, p.id, ...(p.aliases || [])].join(' '));
    return terms.every(term => text.includes(term));
  }).map(p => p.id) : []);
  graphSearch.index = 0;
  // Searching closes the popup but keeps the focused principle's shading.
  state.selected = null; document.getElementById('pop').hidden = true; renderGraph();
  if (!query) fit();
  applyGraphSearch(true);
});
document.getElementById('graph-search').addEventListener('keydown', e => {
  if (e.key === 'Enter' && graphSearch.matches.size) {
    e.preventDefault();
    graphSearch.index = (graphSearch.index + (e.shiftKey ? -1 : 1) + graphSearch.matches.size) % graphSearch.matches.size;
    applyGraphSearch(true);
  } else if (e.key === 'Escape') {
    e.preventDefault(); e.target.value = ''; e.target.dispatchEvent(new Event('input', {bubbles: true}));
  }
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));
// Resize without rebuilding either list, so selections, scroll positions and click slots survive.
(function setupPaneDividers() {
  const panes = ['graph', 'open'].map(tab => document.getElementById('pane-' + tab));
  const sidebar = document.getElementById('graph-sidebar');
  const workspace = document.querySelector('.graph-workspace');
  const properties = {sidebar: '--sidebar-width', background: '--background-height', details: '--details-height'};
  const storageKey = 'principle-map:pane-sizes:v1';
  let saved = {};
  try {
    const stored = JSON.parse(localStorage.getItem(storageKey));
    for (const key of Object.keys(properties)) if (Number.isFinite(stored?.[key]) && stored[key] > 0) saved[key] = stored[key];
  } catch (_) { /* Resizing also works when storage is unavailable. */ }
  const handles = { sidebar: document.getElementById('sidebar-divider'), background: document.getElementById('background-divider'), details: document.getElementById('details-divider') };
  const current = {};
  let drag = null;
  function limits(key) {
    const pane = sidebar.closest('.pane');
    if (key === 'details') {
      const height = workspace.clientHeight || panes[0].clientHeight || window.innerHeight;
      return { min: Math.min(160, height * .35), max: Math.max(0, height - Math.min(180, height * .4) - 9), initial: Math.min(260, height * .32) };
    }
    const width = pane.clientWidth || window.innerWidth;
    const height = sidebar.clientHeight || pane.clientHeight || window.innerHeight;
    return key === 'sidebar'
      ? { min: Math.min(200, width * .4), max: Math.max(0, width - Math.min(240, width * .4) - 9), initial: 250 }
      : { min: Math.min(130, height * .3), max: Math.max(0, height - Math.min(140, height * .3) - 9), initial: Math.min(230, Math.max(145, window.innerHeight * .27)) };
  }
  function apply() {
    const pane = sidebar.closest('.pane');
    if (pane.dataset.active !== 'true') return;
    const previousWidth = current.sidebar, previousDetails = current.details;
    for (const key of Object.keys(handles)) {
      if (key === 'details' && pane.id !== 'pane-graph') continue;
      const bounds = limits(key), min = Math.min(bounds.min, bounds.max);
      const value = Math.round(Math.max(min, Math.min(bounds.max, saved[key] ?? bounds.initial)));
      current[key] = value;
      for (const target of panes) target.style.setProperty(properties[key], `${value}px`);
      const handle = handles[key];
      handle.setAttribute('aria-valuemin', Math.round(min));
      handle.setAttribute('aria-valuemax', Math.round(bounds.max));
      handle.setAttribute('aria-valuenow', value);
      handle.setAttribute('aria-valuetext', `${value} pixels ${key === 'sidebar' ? 'wide' : 'high'}`);
    }
    if (pane.id === 'pane-graph' && (previousWidth !== current.sidebar || previousDetails !== current.details)) fit();
  }
  function persist() { try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch (_) {} }
  function setSize(key, value) { saved[key] = value; apply(); saved[key] = current[key]; }
  function finish(cancel = false) {
    if (!drag) return;
    const previous = drag; drag = null;
    if (cancel) { saved = previous.saved; apply(); } else persist();
    handles[previous.key].classList.remove('dragging');
    document.body.classList.remove('resizing-panes');
    document.body.style.removeProperty('--resize-cursor');
    if (handles[previous.key].hasPointerCapture?.(previous.pointerId)) handles[previous.key].releasePointerCapture(previous.pointerId);
  }
  for (const [key, handle] of Object.entries(handles)) {
    handle.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || drag) return;
      ev.preventDefault(); handle.focus(); apply();
      drag = { key, pointerId: ev.pointerId, coordinate: key === 'sidebar' ? ev.clientX : ev.clientY, size: current[key], saved: { ...saved } };
      handle.setPointerCapture?.(ev.pointerId);
      handle.classList.add('dragging');
      document.body.style.setProperty('--resize-cursor', key === 'sidebar' ? 'col-resize' : 'row-resize');
      document.body.classList.add('resizing-panes');
      const details = document.getElementById('pop');
      if (details.parentElement.id !== 'graph-details') details.hidden = true;
    });
    handle.addEventListener('lostpointercapture', () => finish());
    handle.addEventListener('dblclick', () => { finish(); delete saved[key]; apply(); persist(); });
    handle.addEventListener('keydown', ev => {
      if (drag) return;
      const bounds = limits(key), step = ev.shiftKey ? 40 : 10;
      const increase = key === 'sidebar' ? 'ArrowRight' : 'ArrowUp';
      const decrease = key === 'sidebar' ? 'ArrowLeft' : 'ArrowDown';
      if (![increase, decrease, 'Home', 'End', 'Enter'].includes(ev.key)) return;
      ev.preventDefault();
      if (ev.key === 'Enter') { delete saved[key]; apply(); }
      else setSize(key, ev.key === 'Home' ? bounds.min : ev.key === 'End' ? bounds.max : current[key] + (ev.key === increase ? step : -step));
      persist();
    });
  }
  window.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    const delta = (drag.key === 'sidebar' ? ev.clientX : -ev.clientY) - (drag.key === 'sidebar' ? drag.coordinate : -drag.coordinate);
    setSize(drag.key, drag.size + delta);
  });
  window.addEventListener('pointerup', ev => { if (drag?.pointerId === ev.pointerId) finish(); });
  window.addEventListener('pointercancel', ev => { if (drag?.pointerId === ev.pointerId) finish(true); });
  window.addEventListener('blur', () => finish());
  window.addEventListener('keydown', ev => { if (ev.key === 'Escape' && drag) { ev.preventDefault(); finish(true); } });
  window.addEventListener('resize', apply);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', apply));
  if (typeof ResizeObserver !== 'undefined') {
    const observer = new ResizeObserver(apply);
    for (const pane of panes) observer.observe(pane);
  }
  apply();
})();
window.addEventListener('resize', () => { if (state.tab === 'graph') fit(); });
renderAll(true);
requestAnimationFrame(fit);
</script>
