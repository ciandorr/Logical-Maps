lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 41."], "source_names": ["Classicism"], "proof": "", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.6, p. 41"}], "notes": "A reported theorem awaiting a supplied proof in this map; not presented as a conjecture by the source.\n\nSource report / verification needed: The paper credits Zach Goodsell (personal communication) with this incompatibility, but supplies no proof. A checked proof of the stated source-scope incompatibility is still needed.", "file": "topics/classicism/results/maximalist-distinctness-incompatible-with-rigid-comprehension.yaml", "files": {"md": "writeups/maximalist-distinctness-incompatible-with-rigid-comprehension.md", "handwritten": false, "html": "writeups/maximalist-distinctness-incompatible-with-rigid-comprehension.html"}}, {"id": "modal-b-implies-distinctness-necessary-r", "premises": ["modal-b"], "conclusion": "distinctness-necessary-r", "status": "proved", "certificate": {"source_id": "prior-1963", "produced_by": "A. N. Prior", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.2, p. 22 (Prior argument)."], "source_names": ["Classicism"], "proof": "Assume $x\\ne y$. B gives $\\Box\\neg\\Box(x=y)$. The necessitation of NI gives $\\Box(x=y\\to\\Box(x=y))$. Within the box, contraposition yields $\\neg(x=y)$, and K therefore yields $\\Box(x\\ne y)$. The argument is uniform at each type.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.2, p. 22 (Prior argument)"}, {"paper": "prior-1963", "role": "origin", "locator": "pp. 206–207, as credited in Classicism Proposition 2.2"}], "notes": "", "file": "topics/classicism/results/modal-b-implies-distinctness-necessary-r.yaml", "files": {"md": "writeups/modal-b-implies-distinctness-necessary-r.md", "handwritten": false, "html": "writeups/modal-b-implies-distinctness-necessary-r.html"}}, {"id": "modal-b-implies-pure-b-r", "premises": ["modal-b"], "conclusion": "pure-b-r", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, n. 81, p. 59."], "source_names": ["Classicism"], "proof": "Specialize the quantified propositional B principle to the proposition expressed by each closed pure sentence.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§3.5, n. 81, p. 59"}], "notes": "", "file": "topics/classicism/results/modal-b-implies-pure-b-r.yaml", "files": {"md": "writeups/modal-b-implies-pure-b-r.md", "handwritten": false, "html": "writeups/modal-b-implies-pure-b-r.html"}}, {"id": "modal-five-implies-modal-b", "premises": ["modal-five"], "conclusion": "modal-b", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.2, p. 22."], "source_names": ["Classicism"], "proof": "T gives $p\\to\\Diamond p$. Compose this with $\\Diamond p\\to\\Box\\Diamond p$.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.2, p. 22"}], "notes": "", "file": "topics/classicism/results/modal-five-implies-modal-b.yaml", "files": {"md": "writeups/modal-five-implies-modal-b.md", "handwritten": false, "html": "writeups/modal-five-implies-modal-b.html"}}, {"id": "nd-and-bf-imply-necessary-nd", "premises": ["distinctness-necessary-r", "barcan-r"], "conclusion": "necessary-distinctness-necessary-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.4, p. 23."], "source_names": ["Classicism"], "proof": "For arbitrary x,y, classical identity cases, NI and ND give $\\Box(x=y)\\lor\\Box(x\\ne y)$. Using 4, strengthen the second disjunct to $\\Box\\Box(x\\ne y)$. Normal modal reasoning yields $\\Box(x=y\\lor\\Box(x\\ne y))$, equivalently $\\Box(x\\ne y\\to\\Box(x\\ne y))$. Generalize over x,y and apply BF twice to box the entire universal closure. Repeat at each type.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.4, p. 23"}], "notes": "", "file": "topics/classicism/results/nd-and-bf-imply-necessary-nd.yaml", "files": {"md": "writeups/nd-and-bf-imply-necessary-nd.md", "handwritten": false, "html": "writeups/nd-and-bf-imply-necessary-nd.html"}}, {"id": "necessary-actuality-implies-actuality", "premises": ["necessary-actuality"], "conclusion": "actuality", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, T, p. 16."], "source_names": ["Classicism"], "proof": "At each admitted closed instance phi, T gives Box phi → phi. Apply this to every instance in the boxed premise, preserving its type and formula side conditions.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§1.5, T, p. 16"}], "notes": "Routine instancewise use of source axiom T; recorded as a connecting derivation, not an additional Bacon–Dorr theorem.", "file": "topics/classicism/results/necessary-actuality-implies-actuality.yaml", "files": {"md": "writeups/necessary-actuality-implies-actuality.md", "handwritten": false, "html": "writeups/necessary-actuality-implies-actuality.html"}}, {"id": "necessary-atomicity-completeness-bf-imply-rigid-comprehension", "premises": ["necessary-atomicity-r", "boolean-completeness-r", "barcan-r"], "conclusion": "rigid-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.11, p. 30 and n. 42."], "source_names": ["Classicism"], "proof": "For a relation X, form the property F of haecceities of its instances and take their least upper bound $X^*$. It contains each X-instance. Actuality follows from Atomicity and BF by Proposition 2.7; let w be the actual atom. The relation $w\\to X$ is an upper bound of F, so $X^*$ is also contained in X. Each haecceity entails its own necessitation by NI, so $\\Box X^*$ is another upper bound; hence $X^*$ is persistent. For inextensibility, note 42 assumes a possible failure, uses boxed Atomicity and BF to obtain atoms w and w′ witnessing the two stages, and replaces w′ by the GLB of its w-possible aliases. Then $w^{\\prime}\\to Y$ is an upper bound of F but is contradicted by the proposed failure of inextensibility. This contradiction establishes rigidity.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.11, p. 30 and n. 42"}], "notes": "This is a summary of note 42; see the accompanying write-up for the alias-GLB step. The source’s first cross-reference to Proposition 2.6 is replaced in this transcription by the sufficient Proposition 2.7; the statement and premises are unchanged.", "file": "topics/classicism/results/necessary-atomicity-completeness-bf-imply-rigi bacon-dorr-classicism", "role": "proof", "locator": "§1.5, T, p. 16"}], "notes": "Routine instancewise use of source axiom T; recorded as a connecting derivation, not an additional Bacon–Dorr theorem.", "file": "topics/classicism/results/necessary-tractarianism-r-implies-tractarianism-r.yaml", "files": {"md": "writeups/necessary-tractarianism-r-implies-tractarianism-r.md", "handwritten": false, "html": "writeups/necessary-tractarianism-r-implies-tractarianism-r.html"}}, {"id": "no-pure-contingency-r-implies-converse-witnessed-possibility-r", "premises": ["no-pure-contingency-r"], "conclusion": "converse-witnessed-possibility-r", "status": "proved", "certificate": {"source_id": "bacon-2020", "produced_by": "Andrew Bacon", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "proof": "Apply No Pure Contingency to the closed pure sentence $\\neg\\exists\\bar x\\, .\\,P$. If it is true it is necessary, which rules out $\\Diamond P[\\bar c/\\bar x]$. Contraposition proves the required converse.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, n. 57, p. 38"}, {"paper": "bacon-2020", "role": "origin", "locator": "Logical Necessity, as discussed in Classicism n. 57"}], "notes": "", "file": "topics/classicism/results/no-pure-contingency-r-implies-converse-witnessed-possibility-r.yaml", "files": {"md": "writeups/no-pure-contingency-r-implies-converse-witnessed-possibility-r.md", "handwritten": false, "html": "writeups/no-pure-contingency-r-implies-converse-witnessed-possibility-r.html"}}, {"id": "no-pure-contingency-r-implies-pure-b-r", "premises": ["no-pure-contingency-r"], "conclusion": "pure-b-r", "status": "proved", "certificate": {"source_id": "misc", "produced_by": "OpenAI Codex (GPT-6), 17 September 2026", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, n. 81, p. 59."], "source_names": ["Classicism"], "proof": "No Pure Contingency yields $P\\to\\Box P$. Necessitating the T-dual theorem $P\\to\\Diamond P$ and applying K gives $\\Box P\\to\\Box\\Diamond P$.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§3.5, n. 81, p. 59"}], "notes": "", "file": "topics/classicism/results/no-pure-contingency-r-implies-pure-b-r.yaml", "files": {"md": "writeups/no-pure-contingency-r-implies-pure-b-r.md", "handwritten": false, "html": "writeups/no-pure-contingency-r-implies-pure-b-r.html"}}, {"id": "persistent-comprehension-r-implies-actuality", "premises": ["persistent-comprehension-r"], "conclusion": "actuality", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 38 and n. 40, p. 29."], "source_names": ["Classicism"], "proof": "Choose a persistent predicate T coextensive with truth and use $\\forall p\\, .\\,Tp\\to p$. The proof of Proposition 2.9 uses persistence, not inextensibility, to show that this true proposition entails every truth.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, n. 38 and n. 40, p. 29"}], "notes": "", "file": "topics/classicism/results/persistent-comprehension-r-implies-actuality.yaml", "files": {"md": "writeups/persistent-comprehension-r-implies-actuality.md", "handwritten": false, "html": "writeups/persistent-comprehension-r-implies-actuality.html"}}, {"id": "plenitude-r-implies-actuality", "premises": ["plenitude-r"], "conclusion": "actuality", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.15, pp. 32–33."], "source_names": ["Classicism"], "proof": "Use the functional relation taking each true proposition to itself and each false proposition to $\\top$: $(p\\land p=q)\\lor(\\neg p\\land q=\\top)$. Plenitude supplies Z with those values. The proposition $\\forall p\\, .\\,Zp$ is true and entails Zp for every p, hence entails every true p. It witnesses Actuality.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.15, pp. 32–33"}], "notes": "The displayed relation in the PDF’s prose on p. 33 has p=top in its second disjunct. The surrounding definition and subsequent proof require q=top. This transcription explicitly follows that intended truth-to-itself/falsehood-to-top construction.", "file": "topics/classicism/results/plenitude-r-implies-actuality.yaml", "files": {"md": "writeups/plenitude-r-implies-actuality.md", "handwritten": false, "html": "writeups/plenitude-r-implies-actuality.html"}}, {"id": "plenitude-r-implies-distinctness-necessary-r", "premises": ["plenitude-r"], "conclusion": "distinctness-necessary-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.13, p. 32."], "source_names": ["Classicism"], "proof": "Given distinct x,y of any type, use the functional relation taking x to $\\top$ and every other argument to $\\bot$. Plenitude gives an operation Z with $Zx=\\top$ and $Zy=\\bot$. Since those values are necessarily distinct, Leibniz’s Law yields the necessary distinctness of x and y.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.13, p. 32"}], "notes": "", "file": "topics/classicism/results/plenitude-r-implies-distinctness-necessary-r.yaml", "files": {"md": "writeups/plenitude-r-implies-distinctness-necessary-r.md", "handwritten": false, "html": "writeups/plenitude-r-implies-distinctness-necessary-r.html"}}, {"id": "possibility-and-no-pure-contingency-incompatible", "premises": ["possibility-schema-r", "no-pure-contingency-r"], "conclusion": "false", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38; §3.5, p. 59."], "source_names": ["Classicism"], "proof": "The Fregean Axiom A is a closed pure sentence. Both A and its negation are C-consistent: an ordinary two-valued Henkin model satisfies A, whereas the source’s full two-element-group model has four propositions and falsifies A. Possibility gives $\\Diamond A$ and $\\Diamond\\neg A$. By excluded middle either A or its negation is true. No Pure Contingency applied to the true one makes it necessary, contradicting the possibility of the other.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, n. 57, p. 38; §3.5, p. 59"}], "notes": "", "file": "topics/classicism/results/possibility-and-no-pure-contingency-incompatible.yaml", "files": {"md": "writeups/possibility-and-no-pure-contingency-incompatible.md", "handwritten": false, "html": "writeups/possibility-and-no-pure-contingency-incompatible.html"}}, {"id": "possibility-plus-r-implies-possibility-schema-r", "premises": ["possibility-plus-r"], "conclusion": "possibility-schema-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 41."], "source_names": ["Classicism"], "proof": "Take the empty tuple of individual variables. Its distinctness condition is vacuous; the instances are pure Possibility.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.6, p. 41"}], "notes": "", "file": "topics/classicism/results/possibility-plus-r-implies-possibility-schema-r.yaml", "files": {"md": "writeups/possibility-plus-r-implies-possibility-schema-r.md", "handwritten": false, "html": "writeups/possibility-plus-r-implies-possibility-schema-r.html"}}, {"id": "possibility-schema-r-implies-distinctness-schema-r", "premises": ["possibility-schema-r"], "conclusion": "distinctness-schema-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.4, pp. 35–36; §2.5, p. 37."], "source_names": ["Classicism"], "proof": "If a closed identity A=B is not a theorem of the reference theory, its negation is consistent. Possibility gives $\\Diamond(A\\ne B)$. NI implies that A=B would make this impossible, so A and B are distinct.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.4, pp. 35–36; §2.5, p. 37"}], "notes": "", "file": "topics/classicism/results/possibility-schema-r-implies-distinctness-schema-r.yaml", "files": {"md": "writeups/possibility-schema-r-implies-distinctness-schema-r.md", "handwritten": false, "html": "writeups/possibility-schema-r-implies-distinctness-schema-r.html"}}, {"id": "possibility-signature-r-implies-distinctness-signature-r", "premises": ["possibility-signature-r"], "conclusion": "distinctness-signature-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.4, pp. 35–36; §2.5, p. 37."], "source_names": ["Classicism"], "proof": "If a closed identity A=B is not a theorem of the reference theory, its negation is consistent. Possibility gives $\\Diamond(A\\ne B)$. NI implies that A=B would make this impossible, so A and B are distinct.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.4, pp. 35–36; §2.5, p. 37"}], "notes": "", "file": "topics/classicism/results/possibility-signature-r-implies-distinctness-signature-r.yaml", "files": {"md": "writeups/possibility-signature-r-implies-distinctness-signature-r.md", "handwritten": false, "html": "writeups/possibility-signature-r-implies-distinctness-signature-r.html"}}, {"id": "possibility-signature-r-implies-witnessed-possibility-r", "premises": ["possibility-signature-r"], "conclusion": "witnessed-possibility-r", "status": "proved", "certificate": {"source_id": "bacon-2020", "produced_by": "Andrew Bacon", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "proof": "For a fixed pure formula P, either P has a witness consistently with the reference C theory or it does not. In the first case interpreting the fresh constants as witnesses makes P[c/x] consistent, and signature Possibility supplies its possibility. In the second case the reference theory proves there is no witness, so the required conditional has a false antecedent.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, n. 57, p. 38"}, {"paper": "bacon-2020", "role": "origin", "locator": "Logical Necessity and Witnessed Possibility, as discussed in Classicism n. 57"}], "notes": "", "file": "topics/classicism/results/possibility-signature-r-implies-witnessed-possibility-r.yaml", "files": {"md": "writeups/possibility-signature-r-implies-witnessed-possibility-r.md", "handwritten": false, "html": "writeups/possibility-signature-r-implies-witnessed-possibility-r.html"}}, {"id": "pure-distinctness-and-separated-structure-imply-signature-distinctness", "premises": ["distinctness-schema-r", "separated-structure-r"], "conclusion": "distinctness-signature-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, p. 39."], "source_names": ["Classicism"], "proof": "Iterating Separated Structure gives the corresponding conditional for a finite tuple of distinct constants. Abstract the constants occurring in a closed A,B to write them as iterated applications of pure closed F,G. If A=B is not a theorem, F=G cannot be a theorem either. Pure Distinctness gives F≠G; contraposition of the iterated Separated Structure conditional gives A≠B.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, p. 39"}], "notes": "", "file": "topics/classicism/results/pure-distinctness-and-separated-structure-imply-signature-distinctness.yaml", "files": {"md": "writeups/pure-distinctness-and-separated-structure-imply-signature-distinctness.md", "handwritten": false, "html": "writeups/pure-distinctness-and-separated-structure-imply-signature-distinctness.html"}}, {"id": "relational-choice-and-plenitude-imply-functional-choice-r", "premises": ["relational-choice-r", "plenitude-r"], "conclusion": "functional-choice-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 31–32."], "source_names": ["Classicism"], "proof": "For a serial relation U, Relational Choice yields a functional subrelation S. Plenitude represents S by an operation; because S is a subrelation of U, that operation selects from U.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, pp. 31–32"}], "notes": "", "file": "topics/classicism/results/relational-choice-and-plenitude-imply-functional-choice-r.yaml", "files": {"md": "writeups/relational-choice-and-plenitude-imply-functional-choice-r.md", "handwritten": false, "html": "writeups/relational-choice-and-plenitude-imply-functional-choice-r.html"}}, {"id": "rigid-comprehension-and-bf-imply-necessary-bf", "premises": ["rigid-comprehension-r", "barcan-r"], "conclusion": "necessary-barcan-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.12, p. 30 and n. 43."], "source_names": ["Classicism"], "proof": "Choose a rigid property F coextensive with self-identity. Persistence gives $\\forall x\\, .\\,\\Box Fx$ and BF gives $\\Box\\forall x\\, .\\,Fx$. The inextensibility of F supplies boxed BF with its quantifiers restricted to F. Inside the box everything is F, so the restrictions can be removed. This is the boxed, universally closed BF instance at the chosen type.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.12, p. 30 and n. 43"}], "notes": "", "file": "topics/classicism/results/rigid-comprehension-and-bf-imply-necessary-bf.yaml", "files": {"md": "writeups/rigid-comprehension-and-bf-imply-necessary-bf.md", "handwritten": false, "html": "writeups/rigid-comprehension-and-bf-imply-necessary-bf.html"}}, {"id": "rigid-comprehension-and-nd-imply-plenitude", "premises": ["rigid-comprehension-r", "distinctness-necessary-r"], "conclusion": "plenitude-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.16, p. 33 and n. 49."], "source_names": ["Classicism"], "proof": "For functional U with propositional output, choose a rigid coextension $U^*$ and put $Zy=\\forall p\\, .\\,(U^*y)p\\to p$. If Uxq, persistence makes $(U^*x)q$ necessary, so Zx entails q. Functionality, NI and ND make every $U^*$-pair necessarily either have a different first coordinate or have second coordinate q. Inextensibility combines this into necessary uniqueness at x, which gives q entails Zx. Thus Zx=q and Z represents U. The source extends this construction pointwise to every relational relational output type.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.16, p. 33 and n. 49"}], "notes": "", "file": "topics/classicism/results/rigid-comprehension-and-nd-imply-plenitude.yaml", "files": {"md": "writeups/rigid-comprehension-and-nd-imply-plenitude.md", "handwritten": false, "html": "writeups/rigid-comprehension-and-nd-imply-plenitude.html"}}, {"id": "rigid-comprehension-r-implies-actuality", "premises": ["rigid-comprehension-r"], "conclusion": "actuality", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.9, p. 29 and n. 40."], "source_names": ["Classicism"], "proof": "Choose a rigid predicate T coextensive with truth and let $w=\\forall p\\, .\\,Tp\\to p$. This is true. If p is true, then Tp is true and, by persistence, necessary. Consequently w entails p. Thus w is a true lower bound of all truths.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.9, p. 29 and n. 40"}], "notes": "", "file": "topics/classicism/results/rigid-comprehension-r-implies-actuality.yaml", "files": {"md": "writeups/rigid-comprehension-r-implies-actuality.md", "handwritten": false, "html": "writeups/rigid-comprehension-r-implies-actuality.html"}}, {"id": "rigid-comprehension-r-implies-boolean-completeness-r", "premises": ["rigid-comprehension-r"], "conclusion": "boolean-completeness-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.8, p. 29 and n. 39."], "source_names": ["Classicism"], "proof": "For a property X of relations, choose a rigid coextension $X^*$. Define $U=\\lambda\\bar z\\, .\\,\\forall Y\\, .\\,X^*Y\\to Y[\\bar z]$. For any V, being a lower bound of X is equivalent to being one of $X^*$; rigidity turns the pointwise necessary consequences for members of $X^*$ into their necessary universal generalization. This says exactly $V\\le U$. Thus the lower bounds of X are precisely the entities below U, which is the GLB condition. This works at each relational type.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.8, p. 29 and n. 39"}], "notes": "", "file": "topics/classicism/results/rigid-comprehension-r-implies-boolean-completeness-r.yaml", "files": {"md": "writeups/rigid-comprehension-r-implies-boolean-completeness-r.md", "handwritten": false, "html": "writeups/rigid-comprehension-r-implies-boolean-completeness-r.html"}}, {"id": "rigid-comprehension-r-implies-inextensible-comprehension-r", "premises": ["rigid-comprehension-r"], "conclusion": "inextensible-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, definition of rigidity, p. 28; n. 38, p. 29."], "source_names": ["Classicism"], "proof": "Every rigid coextension is inextensible by the definition of Rigid. Use the same witness.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, definition of rigidity, p. 28; n. 38, p. 29"}], "notes": "", "file": "topics/classicism/results/rigid-comprehension-r-implies-inextensible-comprehension-r.yaml", "files": {"md": "writeups/rigid-comprehension-r-implies-inextensible-comprehension-r.md", "handwritten": false, "html": "writeups/rigid-comprehension-r-implies-inextensible-comprehension-r.html"}}, {"id": "rigid-comprehension-r-implies-persistent-comprehension-r", "premises": ["rigid-comprehension-r"], "conclusion": "persistent-comprehension-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, definition of rigidity, p. 28; n. 38, p. 29."], "source_names": ["Classicism"], "proof": "Every rigid coextension is persistent by the definition of Rigid. Use the same witness.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.3, definition of rigidity, p. 28; n. 38, p. 29"}], "notes": "", "file": "topics/classicism/results/rigid-comprehension-r-implies-persistent-comprehension-r.yaml", "files": {"md": "writeups/rigid-comprehension-r-implies-persistent-comprehension-r.md", "handwritten": false, "html": "writeups/rigid-comprehension-r-implies-persistent-comprehension-r.html"}}, {"id": "strong-possibility-r-implies-possibility-schema-r", "premises": ["strong-possibility-r"], "conclusion": "possibility-schema-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 42."], "source_names": ["Classicism"], "proof": "If P is C-consistent, then $\\Diamond P$ is a theorem of Max(C). The source’s consistency theorem for Max(C) therefore makes $\\Diamond P$ consistent with that theory. Strong Possibility gives $\\Diamond_{\\ne}\\Diamond P$, which implies $\\Diamond\\Diamond P$ and hence $\\Diamond P$ by 4.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.6, p. 42"}], "notes": "", "file": "topics/classicism/results/strong-possibility-r-implies-possibility-schema-r.yaml", "files": {"md": "writeups/strong-possibility-r-implies-possibility-schema-r.md", "handwritten": false, "html": "writeups/strong-possibility-r-implies-possibility-schema-r.html"}}, {"id": "strong-possibility-signature-r-implies-possibility-signature-r", "premises": ["strong-possibility-signature-r"], "conclusion": "possibility-signature-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 42, following the signature convention of §2.5."], "source_names": ["Classicism"], "proof": "If the closed Sigma-sentence P is consistent with C(Sigma), Max(C(Sigma)) proves $\\Diamond P$. The source consistency theorem for that maximalization therefore makes $\\Diamond P$ consistent with it. Strong Possibility yields $\\Diamond_{\\ne}\\Diamond P$, hence $\\Diamond\\Diamond P$ and $\\Diamond P$ by 4. The signature and reference theory remain fixed throughout.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.6, p. 42, following the signature convention of §2.5"}], "notes": "", "file": "topics/classicism/results/strong-possibility-signature-r-implies-possibility-signature-r.yaml", "files": {"md": "writeups/strong-possibility-signature-r-implies-possibility-signature-r.md", "handwritten": false, "html": "writeups/strong-possibility-signature-r-implies-possibility-signature-r.html"}}, {"id": "tractarianism-r-implies-barcan-r", "premises": ["tractarianism-r"], "conclusion": "barcan-r", "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.1, n. 27, pp. 20–21."], "source_names": ["Classicism"], "proof": "Use $p=\\top$ in Tractarianism. Entailment by $\\top$ is necessity, so pointwise necessity entails necessity of the universal generalization.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "Proposition 2.1, n. 27, pp. 20–21"}], "notes": "", "file": "topics/classicism/results/tractarianism-r-implies-barcan-r.yaml", "files": {"md": "writeups/tractarianism-r-implies-barcan-r.md", "handwritten": false, "html": "writeups/tractarianism-r-implies-barcan-r.html"}}, {"id": "witnessed-possibility-and-no-pure-contingency-imply-logical-necessity", "premises": ["witnessed-possibility-r", "no-pure-contingency-r"], "conclusion": "logical-necessity-r", "status": "proved", "certificate": {"source_id": "bacon-2020", "produced_by": "Andrew Bacon", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "proof": "No Pure Contingency gives Converse Witnessed Possibility. Apply both directions of the resulting equivalence to the negation of a pure formula and contrapose; modal duality and quantifier duality yield necessity at the constants iff universal truth.", "references": [{"paper": "bacon-dorr-classicism", "role": "proof", "locator": "§2.5, n. 57, p. 38"}, {"paper": "bacon-2020", "role": "origin", "locator": "Logical Necessity, as discussed in Classicism n. 57"}], "notes": "", "file": "topics/classicism/results/witnessed-possibility-and-no-pure-contingency-imply-logical-necessity.yaml", "files": {"md": "writeups/witnessed-possibility-and-no-pure-contingency-imply-logical-necessity.md", "handwritten": false, "html": "writeups/witnessed-possibility-and-no-pure-contingency-imply-logical-necessity.html"}}], "models": [{"id": "coalesced-maximalist-root", "name": "Coalesced sum: maximalist root", "satisfies": ["distinctness-signature-r", "actuality", "distinctness-preserving-collapse"], "violates": ["strong-possibility-r", "distinctness-necessary-r"], "status": "proved", "certificate": {"source_id": "bacon-dorr-classicism", "produced_by": "Andrew Bacon and Cian Dorr", "recorded_by": "OpenAI Codex (GPT-6), 17 September 2026", "checked_by": [], "date": "2026-09-17", "lean": "none"}, "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Theorem 3.26, §§3.6, pp. 62–64; Appendix E, pp. 80–83; §2.6, p. 41."], "source_names": ["Classicism"], "references": [{"pape tract": {"status": "proved", "via": [], "models": ["full-two-object-retract"]}, "henkin-without-relational-choice": {"status": "proved", "via": [], "models": ["henkin-without-relational-choice"]}}}, "navigation": [{"label": "Logical Maps", "url": "https://www.zacharygoodsell.com/logical-maps/"}, {"label": "zacharygoodsell.com", "url": "https://www.zacharygoodsell.com/"}], "repository_url": "https://github.com/zwlgzwlg/Logical-Maps", "downloads": {"bundle": "classicism-map.zip", "json": "data.json", "zip": "source.zip"}, "background_md": "## Framework\n\nThe fixed background is **Classicism (C)** of Andrew Bacon and Cian Dorr,\nusing the paper's **relational type system**. Its base types are $e$ and $t$.\nForm $\\sigma\\tau$ from admitted types only when $\\tau\\ne e$: every\nfunction type ends in $t$. Thus $et$, $tt$ and $(et)t$ are admitted,\nwhile $ee$ and $(ee)t$ are not. Individuals of type $e$ remain available\nas arguments and quantified objects.\n\nUse the definition in *Classicism*, §1.3: C is the smallest H-theory containing\nLogical Equivalence. This schema identifies $\\lambda$-abstractions of formulas\nequivalent in H. Its theoremhood side condition must be preserved when\nreasoning from additional assumptions.\n\nThis is the type system called R in *Classicism*, §1.1. It is fixed\nthroughout the map, so principle names omit a type-system suffix.\n\n## Notation\n\nTypes associate to the right: $\\sigma\\tau\\rho$ means\n$\\sigma\\to(\\tau\\to\\rho)$. Application also associates to the right:\n$fgx=f(gx)$. Write $(fx)y$ for curried application. A dot separates a\nbinder from its scope. The abbreviation $X[\\bar x]$ means explicitly\nleft-nested application to the displayed tuple; it is $X$ for an empty tuple.\n\nPut $\\Box p:=(p=\\top)$ and $\\Diamond p:=(p\\ne\\bot)$.\nAt a relational type $\\tau$, Boolean operations are defined pointwise.\nThe order is algebraic entailment,\n$X\\le_\\tau Y$ iff $Y=X\\lor_\\tau Y$, rather than material implication.\nAt $t$ this is equivalent to $\\Box(X\\to Y)$; at a relation type it is\nequivalent to the necessary universal closure of the pointwise implication.\n\nThe lattice predicates used in the principles are:\n\n$$\n\\begin{aligned}\n\\operatorname{LB}_\\tau(y,X)&:=\\forall z^\\tau\\, .\\,Xz\\to y\\le_\\tau z,\\\\\n\\operatorname{GLB}_\\tau(y,X)&:=\\forall z^\\tau\\, .\\,\n  \\operatorname{LB}_\\tau(z,X)\\leftrightarrow z\\le_\\tau y,\\\\\n\\operatorname{Atom}_\\tau(y)&:=\\forall z^\\tau\\, .\\,\n  (z\\le_\\tau y\\land z\\ne y)\\leftrightarrow z\\le_\\tau\\neg_\\tau z.\n\\end{aligned}\n$$\n\nThus an atom is non-bottom and has no non-bottom strict lower bound.\nThese are the definitions of *Classicism*, §2.2, pp. 23–24.\n\nFor a relation $Y$ with a finite argument tuple, including the empty tuple,\nthe comprehension predicates are:\n\n$$\n\\begin{aligned}\n\\operatorname{Persistent}(Y)&:=Y\\le\\lambda\\bar x\\, .\\,\\Box Y[\\bar x],\\\\\n\\operatorname{Inextensible}(Y)&:=\\Box\\forall X\\, .\\,\n  (\\forall\\bar x\\, .\\,Y[\\bar x]\\to\\Box X[\\bar x])\\to Y\\le X,\\\\\n\\operatorname{Rigid}(Y)&:=\\operatorname{Persistent}(Y)\\land\n  \\operatorname{Inextensible}(Y).\n\\end{aligned}\n$$\n\nThis is the rigidity convention of §2.3, p. 28. Gallin's alternative\nconvention has its own principle. For $U^{\\sigma\\tau t}$, set\n\n$$\n\\begin{aligned}\n\\operatorname{Serial}(U)&:=\\forall x^\\sigma\\, .\\,\\exists y^\\tau\\, .\\,(Ux)y,\\\\\n\\operatorname{Functional}(U)&:=\\forall x^\\sigma\\, .\\,\\exists y^\\tau\\, .\\,\n  (Ux)y\\land\\forall z^\\tau\\, .\\,(Ux)z\\to y=z.\n\\end{aligned}\n$$\n\nFunctional includes totality. Relational Choice selects a functional\nsubrelation; Functional Choice selects an operation. An operation's output\ntype must differ from $e$. Relational Choice also covers relations with\nindividual outputs, since such a relation still ends in $t$.\n\nStrong Possibility uses the distinctness-preserving modality of §2.6, p. 42:\n\n$$\n\\Box_{\\ne}p:=\\exists q\\, .\\,q\\land\\Box(\\Diamond q\\to p),\n\\qquad \\Diamond_{\\ne}p:=\\neg\\Box_{\\ne}\\neg p.\n$$\n\n## Conventions\n\n**Type scope.** Type parameters range over the fixed type system above.\nA relational type is any admitted type other than $e$, including $t$.\nDisplay restrictions such as $\\tau\\ne e$ when the schema needs them;\nthe overall type range is implicit.\n\n**Schema scope.** $\\forall^{\\mathrm{Ty}}$ is metalinguistic. It ranges over\nsimple types, outside the object-language sentence, and does not add a\nquantifier to C. A principle may have one outer universal or existential\nblock of type parameters; quantifier alternation requires a separate\nextension of the convention. The present import has positive schemata and\nselected individual instances. Finite tuples and formula schemata retain\ntheir stated metalinguistic side conditions.\n\n**Modal scope.** A boxed schema means that each admitted, fully closed\nobject-language instance is necessary. Close its object variables before\nboxing it. Type ranges and formula side conditions remain outside the box.\nC5 abbreviates C plus boxed ND at all types. It is an optional preset,\nnot part of the fixed background. A proof under an optional premise cannot\nbe necessitated unless that premise is discharged or supplied necessarily.\n\n**Negation.** Failure of a type schema means failure of at least one of\nits admitted instances, not failure at every type. For example,\n$\\neg\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,A_\\sigma$ means\n$\\exists^{\\mathrm{Ty}}\\sigma\\, .\\,\\neg A_\\sigma$.\nA necessarily false instance,\n$\\exists^{\\mathrm{Ty}}\\sigma\\, .\\,\\Box\\neg A_\\sigma$, is stronger and\ndifferent from failure of the boxed schema. Negated principle nodes are\nnot added by this positive import. Incompatibilities conclude False;\nmodel `violates` entries record schema failure.\n\n**Pure and signature schemata.** In Distinctness and Possibility,\n$C$ denotes the fixed background logic. Its theoremhood and consistency\nside conditions are retained literally.\nFix a signature $\\Sigma$ containing the displayed nonlogical constants and\nfundamentality predicates $\\operatorname{Fun}_\\sigma$, all of admitted types,\nwith arbitrarily many distinct constants of each type. No nonlogical\naxioms about them are standing assumptions. “Pure” excludes these symbols.\nFor Fundamental Possibility, $\\operatorname{Fun}(\\bar x)$ conjoins each\n$\\operatorname{Fun}_{\\sigma_i}(x_i)$ and the distinctness of each pair of\nsame-typed entries. “Distinct constants” means distinct symbols, not an\nassumed inequality between their denotations.\n\n**Evidence.** References use the 87-page draft of *Classicism* dated\n16 May 2023. Models cite the construction and evaluation point directly.\nThe source models now use exactly the map's type system. Their listed\nproperties provide countermodel evidence at the stated evaluation point.\nThe singleton-root coalesced model still awaits an expansion to the fixed\nnonlogical signature; its record explains this separate obligation.\nTwo results reported without proofs in the draft retain pending verification status.\nNo record claims an independent human check or Lean verification.\n\n\n## Literature\n\n### Source literature\n\n- Bacon, Andrew, and Cian Dorr. Classicism. Draft dated 16 May 2023, 87 pages. All page, proposition and footnote locators in this map refer to this draft.\n- Barcan, Ruth C. (1946). A Functional Calculus of First Order Based on Strict Implication. Journal of Symbolic Logic 11, 1–16. Bibliography and attribution as given in Classicism.\n- Prior, A. N. (1963). Formal Logic. Oxford University Press. Pages 206–207, as credited in Classicism, Proposition 2.2.\n- Prior, A. N. (1956). Modality and Quantification in S5. Journal of Symbolic Logic 21(1), 60–62. See also Prior (1967), Past, Present, and Future, p. 146, crediting E. J. Lemmon’s simplified proof. Attribution as given in Classicism, Proposition 2.3.\n- Gallin, Daniel (1975). Intensional and Higher-Order Modal Logic: With Applications to Montague Semantics. North-Holland. Page 77, as cited in Classicism, n. 37.\n- Bacon, Andrew (2020). Logical Combinatorialism. Philosophical Review 129(4), 537–589. As cited in Classicism, §§2.5 and 3.5.\n- Goodsell, Zachary, and Juhani Yli-Vakkuri. Logical Foundations of Philosophy. Unpublished work cited in Classicism, p. 27; no proof from that work is imported here.\n\n### Other relevant literature\n\n- Bacon, Andrew (2018). The Broadest Necessity. Journal of Philosophical Logic 47(5), 733–783. As credited in Classicism, §1.5.\n- Burgess, John P. (2014). On a Derivation of the Necessity of Identity. Synthese 191(7). Historical reference for Quine’s argument, as cited in Classicism, §1.5.\n- Goodsell, Zachary. Personal communication reported by Bacon and Dorr in Classicism, p. 41, concerning Rigid Comprehension and Maximalist Classicism.\n", "background_html": "<h2 id=\"framework\">Framework<\/h2>\n<p>The fixed background is <strong>Classicism (C)<\/strong> of Andrew Bacon and Cian Dorr, using the paper’s <strong>relational type system<\/strong>. Its base types are <span class=\"math inline\">e<\/span> and <span class=\"math inline\">t<\/span>. Form <span class=\"math inline\">\\sigma\\tau<\/span> from admitted types only when <span class=\"math inline\">\\tau\\ne e<\/span>: every function type ends in <span class=\"math inline\">t<\/span>. Thus <span class=\"math inline\">et<\/span>, <span class=\"math inline\">tt<\/span> and <span class=\"math inline\">(et)t<\/span> are admitted, while <span class=\"math inline\">ee<\/span> and <span class=\"math inline\">(ee)t<\/span> are not. Individuals of type <span class=\"math inline\">e<\/span> remain available as arguments and quantified objects.<\/p>\n<p>Use the definition in <em>Classicism<\/em>, §1.3: C is the smallest H-theory containing Logical Equivalence. This schema identifies <span class=\"math inline\">\\lambda<\/span>-abstractions of formulas equivalent in H. Its theoremhood side condition must be preserved when reasoning from additional assumptions.<\/p>\n<p>This is the type system called R in <em>Classicism<\/em>, §1.1. It is fixed throughout the map, so principle names omit a type-system suffix.<\/p>\n<h2 id=\"notation\">Notation<\/h2>\n<p>Types associate to the right: <span class=\"math inline\">\\sigma\\tau\\rho<\/span> means <span class=\"math inline\">\\sigma\\to(\\tau\\to\\rho)<\/span>. Application also associates to the right: <span class=\"math inline\">fgx=f(gx)<\/span>. Write <span class=\"math inline\">(fx)y<\/span> for curried application. A dot separates a binder from its scope. The abbreviation <span class=\"math inline\">X[\\bar x]<\/span> means explicitly left-nested application to the displayed tuple; it is <span class=\"math inline\">X<\/span> for an empty tuple.<\/p>\n<p>Put <span class=\"math inline\">\\Box p:=(p=\\top)<\/span> and <span class=\"math inline\">\\Diamond p:=(p\\ne\\bot)<\/span>. At a relational type <span class=\"math inline\">\\tau<\/span>, Boolean operations are defined pointwise. The order is algebraic entailment, <span class=\"math inline\">X\\le_\\tau Y<\/span> iff <span class=\"math inline\">Y=X\\lor_\\tau Y<\/span>, rather than material implication. At <span class=\"math inline\">t<\/span> this is equivalent to <span class=\"math inline\">\\Box(X\\to Y)<\/span>; at a relation type it is equivalent to the necessary universal closure of the pointwise implication.<\/p>\n<p>The lattice predicates used in the principles are:<\/p>\n<p><span class=\"math display\">\n\\begin{aligned}\n\\operatorname{LB}_\\tau(y,X)&amp;:=\\forall z^\\tau\\, .\\,Xz\\to y\\le_\\tau z,\\\\\n\\operatorname{GLB}_\\tau(y,X)&amp;:=\\forall z^\\tau\\, .\\,\n  \\operatorname{LB}_\\tau(z,X)\\leftrightarrow z\\le_\\tau y,\\\\\n\\operatorname{Atom}_\\tau(y)&amp;:=\\forall z^\\tau\\, .\\,\n  (z\\le_\\tau y\\land z\\ne y)\\leftrightarrow z\\le_\\tau\\neg_\\tau z.\n\\end{aligned}\n<\/span><\/p>\n<p>Thus an atom is non-bottom and has no non-bottom strict lower bound. These are the definitions of <em>Classicism<\/em>, §2.2, pp. 23–24.<\/p>\n<p>For a relation <span class=\"math inline\">Y<\/span> with a finite argument tuple, including the empty tuple, the comprehension predicates are:<\/p>\n<p><span class=\"math display\">\n\\begin{aligned}\n\\operatorname{Persistent}(Y)&amp;:=Y\\le\\lambda\\bar x\\, .\\,\\Box Y[\\bar x],\\\\\n\\operatorname{Inextensible}(Y)&amp;:=\\Box\\forall X\\, .\\,\n  (\\forall\\bar x\\, .\\,Y[\\bar x]\\to\\Box X[\\bar x])\\to Y\\le X,\\\\\n\\operatorname{Rigid}(Y)&amp;:=\\operatorname{Persistent}(Y)\\land\n  \\operatorname{Inextensible}(Y).\n\\end{aligned}\n<\/span><\/p>\n<p>This is the rigidity convention of §2.3, p. 28. Gallin’s alternative convention has its own principle. For <span class=\"math inline\">U^{\\sigma\\tau t}<\/span>, set<\/p>\n<p><span class=\"math display\">\n\\begin{aligned}\n\\operatorname{Serial}(U)&amp;:=\\forall x^\\sigma\\, .\\,\\exists y^\\tau\\, .\\,(Ux)y,\\\\\n\\operatorname{Functional}(U)&amp;:=\\forall x^\\sigma\\, .\\,\\exists y^\\tau\\, .\\,\n  (Ux)y\\land\\forall z^\\tau\\, .\\,(Ux)z\\to y=z.\n\\end{aligned}\n<\/span><\/p>\n<p>Functional includes totality. Relational Choice selects a functional subrelation; Functional Choice selects an operation. An operation’s output type must differ from <span class=\"math inline\">e<\/span>. Relational Choice also covers relations with individual outputs, since such a relation still ends in <span class=\"math inline\">t<\/span>.<\/p>\n<p>Strong Possibility uses the distinctness-preserving modality of §2.6, p. 42:<\/p>\n<p><span class=\"math display\">\n\\Box_{\\ne}p:=\\exists q\\, .\\,q\\land\\Box(\\Diamond q\\to p),\n\\qquad \\Diamond_{\\ne}p:=\\neg\\Box_{\\ne}\\neg p.\n<\/span><\/p>\n<h2 id=\"conventions\">Conventions<\/h2>\n<p><strong>Type scope.<\/strong> Type parameters range over the fixed type system above. A relational type is any admitted type other than <span class=\"math inline\">e<\/span>, including <span class=\"math inline\">t<\/span>. Display restrictions such as <span class=\"math inline\">\\tau\\ne e<\/span> when the schema needs them; the overall type range is implicit.<\/p>\n<p><strong>Schema scope.<\/strong> <span class=\"math inline\">\\forall^{\\mathrm{Ty}}<\/span> is metalinguistic. It ranges over simple types, outside the object-language sentence, and does not add a quantifier to C. A principle may have one outer universal or existential block of type parameters; quantifier alternation requires a separate extension of the convention. The present import has positive schemata and selected individual instances. Finite tuples and formula schemata retain their stated metalinguistic side conditions.<\/p>\n<p><strong>Modal scope.<\/strong> A boxed schema means that each admitted, fully closed object-language instance is necessary. Close its object variables before boxing it. Type ranges and formula side conditions remain outside the box. C5 abbreviates C plus boxed ND at all types. It is an optional preset, not part of the fixed background. A proof under an optional premise cannot be necessitated unless that premise is discharged or supplied necessarily.<\/p>\n<p><strong>Negation.<\/strong> Failure of a type schema means failure of at least one of its admitted instances, not failure at every type. For example, <span class=\"math inline\">\\neg\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,A_\\sigma<\/span> means <span class=\"math inline\">\\exists^{\\mathrm{Ty}}\\sigma\\, .\\,\\neg A_\\sigma<\/span>. A necessarily false instance, <span class=\"math inline\">\\exists^{\\mathrm{Ty}}\\sigma\\, .\\,\\Box\\neg A_\\sigma<\/span>, is stronger and different from failure of the boxed schema. Negated principle nodes are not added by this positive import. Incompatibilities conclude False; model <code>violates<\/code> entries record schema failure.<\/p>\n<p><strong>Pure and signature schemata.<\/strong> In Distinctness and Possibility, <span class=\"math inline\">C<\/span> denotes the fixed background logic. Its theoremhood and consistency side conditions are retained literally. Fix a signature <span class=\"math inline\">\\Sigma<\/span> containing the displayed nonlogical constants and fundamentality predicates <span class=\"math inline\">\\operatorname{Fun}_\\sigma<\/span>, all of admitted types, with arbitrarily many distinct constants of each type. No nonlogical axioms about them are standing assumptions. “Pure” excludes these symbols. For Fundamental Possibility, <span class=\"math inline\">\\operatorname{Fun}(\\bar x)<\/span> conjoins each <span class=\"math inline\">\\operatorname{Fun}_{\\sigma_i}(x_i)<\/span> and the distinctness of each pair of same-typed entries. “Distinct constants” means distinct symbols, not an assumed inequality between their denotations.<\/p>\n<p><strong>Evidence.<\/strong> References use the 87-page draft of <em>Classicism<\/em> dated 16 May 2023. Models cite the construction and evaluation point directly. The source models now use exactly the map’s type system. Their listed properties provide countermodel evidence at the stated evaluation point. The singleton-root coalesced model still awaits an expansion to the fixed nonlogical signature; its record explains this separate obligation. Two results reported without proofs in the draft retain pending verification status. No record claims an independent human check or Lean verification.<\/p>\n<h2 id=\"literature\">Literature<\/h2>\n<section id=\"paper-catalogue\"><h3 id=\"source-literature\">Source literature<\/h3>\n<ul>\n<li>Bacon, Andrew, and Cian Dorr. Classicism. Draft dated 16 May 2023, 87 pages. All page, proposition and footnote locators in this map refer to this draft.<\/li>\n<li>Barcan, Ruth C. (1946). A Functional Calculus of First Order Based on Strict Implication. Journal of Symbolic Logic 11, 1–16. Bibliography and attribution as given in Classicism.<\/li>\n<li>Prior, A. N. (1963). Formal Logic. Oxford University Press. Pages 206–207, as credited in Classicism, Proposition 2.2.<\/li>\n<li>Prior, A. N. (1956). Modality and Quantification in S5. Journal of Symbolic Logic 21(1), 60–62. See also Prior (1967), Past, Present, and Future, p. 146, crediting E. J. Lemmon’s simplified proof. Attribution as given in Classicism, Proposition 2.3.<\/li>\n<li>Gallin, Daniel (1975). Intensional and Higher-Order Modal Logic: With Applications to Montague Semantics. North-Holland. Page 77, as cited in Classicism, n. 37.<\/li>\n<li>Bacon, Andrew (2020). Logical Combinatorialism. Philosophical Review 129(4), 537–589. As cited in Classicism, §§2.5 and 3.5.<\/li>\n<li>Goodsell, Zachary, and Juhani Yli-Vakkuri. Logical Foundations of Philosophy. Unpublished work cited in Classicism, p. 27; no proof from that work is imported here.<\/li>\n<\/ul>\n<h3 id=\"other-relevant-literature\">Other relevant literature<\/h3>\n<ul>\n<li>Bacon, Andrew (2018). The Broadest Necessity. Journal of Philosophical Logic 47(5), 733–783. As credited in Classicism, §1.5.<\/li>\n<li>Burgess, John P. (2014). On a Derivation of the Necessity of Identity. Synthese 191(7). Historical reference for Quine’s argument, as cited in Classicism, §1.5.<\/li>\n<li>Goodsell, Zachary. Personal communication reported by Bacon and Dorr in Classicism, p. 41, concerning Rigid Comprehension and Maximalist Classicism.<\/li>\n<\/ul>\n<\/section>\n", "extraction_md": "# Classicism: import coverage\n\nSource: Andrew Bacon and Cian Dorr, *Classicism*, draft dated 16 May 2023,\n87 pages. Locators refer to that draft, including its footnotes.\n\nThe import includes the positive extension principles in §§1.4–2.6,\ndistinguished type instances used by the paper, boxed variants used in its\nconnections, the Gallin comparison, the choice decomposition, and the\npure/signature variants of the maximalist schemata. The named background\nconsequences in §1.5 have separate nodes. The defining rules of H and C,\nBoolean identities, and the machinery   let h = `<div class="ex"><div class="ex-col"><div class="ex-head">Principles <span class="n">${backgroundIds().length} assumed</span></div><div class="explorer-actions">${backgroundPresets.map(p => `<button class="btn small" data-background-preset="${esc(p.id)}">Background ${esc(p.name)}</button>`).join('')}<button class="btn small" id="ex-clear">clear background</button></div>`;
  if (inspected) h += `<div class="inspection-note">Inspecting <b>${esc(inspected.name)}</b> <button class="lnk" id="ex-deselect">clear selection</button></div>`;
  h += '<div id="model-principles">';
  for (const group of principleGroups()) {
    h += `<section class="model-category" data-model-category="${esc(group.id)}"><h3>${esc(group.name)}</h3><ul class="ex-list">`;
    for (const p of group.principles) {
      const id = p.id, positive = background.has(id), negative = negativeBackground.has(id);
      const follows = !conflict && implied.has(id), ruledOut = !conflict && backgroundExcluded.has(id);
      const evidence = inspected && modelEvidence(inspected, id);
      const tint = inspected ? evidence ? evidence.value ? 'model-in' : 'model-out' : '' : positive ? 'in' : negative ? 'out' : follows ? 'fin' : ruledOut ? 'fout' : '';
      h += `<li class="ex-p ${tint}" data-assumption-row="${id}">${assumptionButtons(id, follows, ruledOut)}<div class="principle-line"><button class="lnk" data-principle="${id}">${esc(name(id))}</button>${inspected ? ' ' + verdictButton(inspected, id, evidence, true) : ''}</div></li>`;

    }

  h += '</div></div><div class="ex-col explorer-models">';

  for (const m of ms) {
    const holds = m.status === 'proved' ? baseE.holds.get(m.id) : new Set(m.satisfies);
    const fails = m.status === 'proved' ? baseE.fails.get(m.id) : new Set(m.violates);
    if (IN.some(p => fails.has(p)) || OUT.some(p => holds.has(p))) continue;
    const gaps = [...IN.filter(p => !holds.has(p)), ...OUT.filter(p => !fails.has(p)).map(p => '!' + p)];
    (gaps.length || m.status !== 'proved' ? unknown : known).push([m, gaps]);

  if (conflict) h += `<h2 class="ex-head">Models</h2><div class="ex-bad" role="alert">These assumptions are inconsistent. Clear or change an assumption to compare models.${conflict.via.length ? `<ul>${conflict.via.map(id => `<li><button class="lnk" data-result="${id}">${resultStmt(byRid.get(id))}</button> ${certBadges(byRid.get(id))}</li>`).join('')}</ul>` : ''}</div>`;
  else {
    h += `<h2 class="ex-head">Matching models <span class="n">${known.length}</span></h2><ul class="ex-list">${known.map(row).join('') || '<li class="empty">No known matching model.</li>'}</ul>`;
    h += `<h2 class="ex-head">Potential models <span class="n">${unknown.length}</span></h2><ul class="ex-list">${unknown.map(row).join('') || '<li class="empty">—</li>'}</ul>`;
  }
  h += '</div></div>';
  const el = document.getElementById('models');
  const focused = el.contains(document.activeElement) ? ['data-assume-positive', 'data-assume-negative'].map(a => [a, document.activeElement.getAttribute(a)]).find(([,id]) => id) : null;
  el.innerHTML = h;
  wireAssumptions(el);
  el.querySelectorAll('[data-background-preset]').forEach(button => { button.disabled = backgroundPresets.find(p => p.id === button.dataset.backgroundPreset).principles.every(id => background.has(id)); button.addEventListener('click', () => addBackgroundPreset(button.dataset.backgroundPreset)); });
  el.querySelector('#ex-clear').addEventListener('click', resetBackground);
  el.querySelector('#ex-deselect')?.addEventListener('click', () => { state.modelId = null; select(null); renderModels(); });
  wire(el);
  if (focused) el.querySelector(`[${focused[0]}="${focused[1]}"]`)?.focus({preventScroll: true});
}

function certBadges(r) {
  const c = r.certificate;
  return `${sourceBadge(sourceOf(r))}${c.lean === 'verified' ? '<span class="badge lean verified">Lean ✓</span>' : ''}${r.status === 'conjectured' ? '<span class="badge conj">conjecture</span>' : ''}`;
}
// Abbreviate only equivalent positive conjunctions. These are presentation
// aliases: the original records and the engines' premise arrays stay intact.
// baseE uses proved, source-filtered rules and the fixed topic framework;
// exploration background and conjectures must never complete a named package.
function abbreviateConjunction(principleIds) {
  let remaining = [...principleIds];
  const presets = [];
  if (baseE) for (const preset of [...backgroundPresets].sort((a, b) => b.principles.length - a.principles.length)) {
    const members = preset.principles;
    if (!members.length || !members.every(id => byPid.has(id))) continue;
    const packageFacts = baseE.cl(members).facts;
    if (packageFacts.has(FALSE)) continue;
    const remainingFacts = baseE.cl(remaining).facts;
    if (!members.every(id => remainingFacts.has(id))) continue;
    // A stronger remaining assumption may help imply the package without
    // being replaceable by it. Remove only terms the package implies back.
    const consumed = remaining.filter(id => packageFacts.has(id));
    if (consumed.length < 2) continue;
    presets.push({ id: preset.id, name: preset.name, principles: [...members], consumed });
    remaining = remaining.filter(id => !packageFacts.has(id));
  }
  return { presets, remaining, abbreviated: presets.length > 0 };
}
function conjunctionStmt(positiveIds, negativeIds = [], abbreviated = true) {
  const grouped = abbreviated ? abbreviateConjunction(positiveIds) : { presets: [], remaining: positiveIds };
  return [
    ...grouped.presets.map(p => `<span class="conjunction-abbreviation" data-preset="${esc(p.id)}">${esc(p.name)}</span>`),
    ...grouped.remaining.map(name).map(esc),
    ...negativeIds.map(id => '¬' + esc(name(id)))
  ].join(' ∧ ') || '⊤';
}
function resultStmt(r, abbreviated = true) { return `${conjunctionStmt(r.premises, [], abbreviated)} ⇒ ${esc(name(r.conclusion))}`; }
function modelStmt(m, abbreviated = true) { return conjunctionStmt(m.satisfies, m.violates, abbreviated); }
function fullConjunctionDetails(x) {
  const isResult = Array.isArray(x.premises);
  const grouped = abbreviateConjunction(isResult ? x.premises : x.satisfies);
  if (!grouped.abbreviated) return '';
  const statement = isResult ? resultStmt(x, false) : modelStmt(x, false);
  const definitions = grouped.presets.map(p => `<div class="full-conjunction-statement"><b>${esc(p.name)}</b> = ${p.principles.map(name).map(esc).join(' ∧ ')}</div>`).join('');
  return `<details class="full-conjunction"><summary>Show full conjunction</summary><div class="full-conjunction-statement"><b>Recorded conjunction:</b> ${statement}</div>${definitions}</details>`;
}
function dateOf(x) { return x.satisfies || x.premises ? (x.certificate.date || '') : (x.date || ''); }
function kindOf(x) { return x.satisfies ? 'model' : x.premises ? 'result' : 'principle'; }
function renderResults() {
  const q = state.search.trim().toLowerCase();
  const items = [...P, ...R, ...MODELS].filter(x => !q || [JSON.stringify(x), x.premises ? resultStmt(x, false) : x.satisfies ? modelStmt(x, false) : ''].join(' ').toLowerCase().includes(q))
    .sort((a, b) => dateOf(b).localeCompare(dateOf(a)));
  // One row per record at its certificate date, plus one row per logged revision at
  // the revision's own date: later additions to a record are changes too.
  const rows = items.flatMap(x => [{ date: dateOf(x), x }, ...(x.changes || []).map(change => ({ date: String(change.date || ''), x, change }))])
    .sort((a, b) => b.date.localeCompare(a.date));
  let h = `<table class="results changes"><tbody>`;
  for (const { date, x, change } of rows) {
    const k = kindOf(x);
    const title = k === 'principle' ? `<b>${esc(x.name)}</b>` : k === 'result' ? resultStmt(x) : `<b>${esc(x.name)}</b>`;
    const stmt = change
      ? `${title} &nbsp; ${esc(change.summary || '')}${(change.satisfies || []).length ? ` <span class="revision-list">Now satisfies: ${change.satisfies.map(name).map(esc).join(', ')}.</span>` : ''}${(change.violates || []).length ? ` <span class="revision-list">Now violates: ${change.violates.map(name).map(esc).join(', ')}.</span>` : ''}`
      : k === 'principle' ? `${title} &nbsp; ${esc(x.statement)}` : k === 'result' ? title : `${title} &nbsp; ${modelStmt(x)}`;
    const by = change ? esc(change.by || '') : k === 'principle' ? '' : esc(x.certificate.produced_by || '');
    const badge = change ? `<span class="badge ${k === 'model' ? 'indep' : 'kind'} revised">revised ${k}</span>` : `<span class="badge ${k === 'model' ? 'indep' : 'kind'}">${x.status === 'conjectured' ? 'conjecture' : k}</span>`;
    h += `<tr data-kind="${k}" data-id="${x.id}" class="${[k !== 'principle' && !passes(x) ? 'filtered' : '', change ? 'revision' : ''].join(' ').trim()}"><td class="mono nowrap">${esc(date)}</td><td>${badge}</td><td class="stmt">${stmt}</td><td>${k === 'principle' ? '' : certBadges(x)}</td><td class="mono">${by}</td></tr>`;
  }
  h += '</tbody></table>';
  const el = document.getElementById('results'); el.innerHTML = h;
  renderSubscripts(el);
  el.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => select({ type: tr.dataset.kind, id: tr.dataset.id })));
  document.getElementById('n-results').textContent = rows.length;
}
function conjectureEvidence(answer, evidenceBase = baseE, summary = 'Evidence') {
  // The rule chains returned for a witness certify the first matching model.
  const witness = answer.models.length ? byMid.get(answer.models[0]) : null;
  const via = new Set();
  if (witness) {
    // Include the proof that the witness fits the background, using the same
    // evidence set that established its verdict (selected or complete).
    const {why} = evidenceBase.cl(witness.satisfies);
    for (const p of background) for (const id of chain(p, why, evidenceBase.byId)) via.add(id);
    for (const p of negativeBackground) for (const id of (evidenceBase.failWhy.get(witness.id).get(p) || []).slice(1)) via.add(id);
  }
  for (const id of answer.via) via.add(id);
  const items = [...(witness ? [witness] : []), ...[...via].map(id => byRid.get(id))];
  if (!items.length) return '<p class="note">This follows directly from the selected assumptions and the question’s requirements.</p>';
  return `<details class="conjecture-evidence"><summary>${esc(summary)} ${evidenceBadges({items})}</summary><ol>${items.map(x => `<li><button class="lnk" data-open-${kindOf(x)}="${esc(x.id)}">${x.satisfies ? esc(x.name) : resultStmt(x)} — details</button> ${certBadges(x)}</li>`).join('')}</ol>${sourceSummary(items)}</details>`;
}
function renderOpen() {
  const questions = [...R, ...MODELS].filter(x => x.status === 'conjectured' || x.was_conjectured)
    .map(item => {
      const answer = E.resolveConjecture(item), allAnswer = allEvidenceE.resolveConjecture(item);
      const status = answer.status === 'open' && allAnswer.status !== 'open'
        ? allAnswer.status === 'inconsistent-background' ? 'inconsistent-background' : 'evidence-limited'
        : answer.status;
      return {item, answer, allAnswer, status};
    });
  const inconsistent = backgroundConflicts.length > 0;
  const allConflict = allEvidenceE.conflict([]);
  const assumedFacts = inconsistent ? new Set() : E.cl([]).facts;
  const labels = {open: 'Open', 'evidence-limited': 'Unresolved by selected evidence', proved: '✓ Proved', refuted: '✗ Refuted', incompatible: 'Incompatible premises', 'inconsistent-background': 'Resolution unavailable'};
  const verdictLabel = (x, status) => Array.isArray(x.satisfies) && status === 'proved' ? '✓ Existence witnessed' : Array.isArray(x.satisfies) && status === 'refuted' ? '✗ Existence refuted' : labels[status];
  const row = ({item: x, answer, allAnswer, status}) => {
    const isM = Array.isArray(x.satisfies);
    const shown = isM ? {...x, satisfies: x.satisfies.filter(p => !assumedFacts.has(p)), violates: x.violates.filter(p => !backgroundExcluded.has(p))}
      : {...x, premises: x.premises.filter(p => !assumedFacts.has(p))};
    const statement = isM ? esc(x.name) : resultStmt(shown);
    const requirements = isM ? `<div class="stmt">${shown.satisfies.length || shown.violates.length ? `Exists: ${modelStmt(shown)}` : 'Exists: a model of the current background.'}</div>` : '';
    let evidence = '';
    if (status === 'open') evidence = '<p class="note">No resolution in all recorded proved evidence under this background.</p>';
    else if (status === 'evidence-limited') {
      evidence = conjectureEvidence(allAnswer, allEvidenceBaseE, `${verdictLabel(x, allAnswer.status)} with all recorded evidence`);
      if (allAnswer.status === 'incompatible') evidence += '<p class="note">The full evidence makes the premises incompatible with this background; this does not settle the implication.</p>';
      if (isM && allAnswer.status === 'proved') evidence += '<p class="note">A proved model meets the requirements; this need not establish the proposed construction.</p>';
    }
    else if (!inconsistent) {
      if (isM && answer.status === 'proved') evidence += '<p class="note">A proved model meets these requirements. This settles their consistency; it need not establish the proposed construction.</p>';
      if (answer.status === 'incompatible') evidence += '<p class="note">The premises conflict with this background. This is not counted as a resolution of the implication.</p>';
      if (status !== 'inconsistent-background') evidence += conjectureEvidence(answer);
    }
    return `<article class="conjecture-row" data-conjecture-id="${esc(x.id)}" data-resolution="${status}" data-selected-resolution="${answer.status}" data-full-resolution="${allAnswer.status}"><div class="conjecture-heading"><button class="lnk stmt" data-${isM ? 'model' : 'result'}="${esc(x.id)}">${statement}</button><span class="resolution ${status}">${verdictLabel(x, status)}</span></div>${requirements}<div class="note">Recorded question: ${sourceBadge(sourceOf(x))} ${esc(x.certificate.date || '')}</div>${evidence}${x.notes ? `<details class="note"><summary>Notes on the recorded question</summary><p>${fmt(x.notes)}</p></details>` : ''}</article>`;
  };
  const warning = document.getElementById('open-warning');
  warning.hidden = !inconsistent && !allConflict;
  warning.innerHTML = inconsistent ? `<h2>Background is inconsistent</h2><p>These assumptions cannot all hold together. Conjecture resolutions are unavailable until the conflicting assumptions are removed.</p>${conjectureEvidence({via: backgroundConflicts[0].via, models: []})}<p>This check uses proved results under the current evidence filters.</p>` : allConflict ? `<h2>Additional evidence shows the background is inconsistent</h2><p>Verdicts from the selected evidence cannot establish which questions remain open with all recorded evidence.</p>${conjectureEvidence({via: allConflict.via, models: []}, allEvidenceBaseE, 'Background conflict with all recorded evidence')}` : '';
  wire(warning);
  const visible = questions.filter(q => q.answer.status !== 'incompatible' && (state.showResolved || !['proved', 'refuted'].includes(q.answer.status)));
  const incompatible = questions.filter(q => q.answer.status === 'incompatible');
  let h = '<h3>Conjectures</h3><p class="hint">“Open” means unresolved by all recorded proved evidence under this background. “Unresolved by selected evidence” means the filters omit evidence available below. Background assumptions are omitted from statements; click a question for its full statement.</p>';
  h += visible.map(row).join('') || `<p class="empty">${questions.length ? 'No open questions apply to this background. Use “Show resolved” to include resolved questions.' : 'No conjectures have been recorded.'}</p>`;
  if (incompatible.length) h += `<details id="open-incompatible"><summary>Incompatible with this background (${incompatible.length})</summary>${incompatible.map(row).join('')}</details>`;
  const el = document.getElementById('open'); el.innerHTML = h;
  wire(el);
  const count = document.getElementById('n-open');
  count.textContent = inconsistent || allConflict ? '—' : questions.filter(q => q.status === 'open').length;
  count.title = 'Open with all recorded evidence; questions unresolved only by the selected evidence are not counted.';
}

// ---------------------------------------------------------------- write-up page
function sourceEntries(items) {
  const entries = new Map();
  for (const x of items) (x.sources || []).forEach((source, i) => {
    if (!entries.has(source)) entries.set(source, { source, label: (x.source_names || [])[i] || (source.length <= 80 ? source : `Source ${entries.size + 1}`) });
  });
  return [...entries.values()];
}
function paperReferences(items) {
  const refs = new Map();
  for (const item of items) for (const ref of item.references || []) {
    const key = JSON.stringify(ref);
    if (byPaperId.has(ref.paper)) refs.set(key, ref);
  }
  const priority = {origin: 0, proof: 0, formulation: 1, related: 2, background: 3};
  return [...refs.values()].sort((a, b) => priority[a.role] - priority[b.role]);
}
function paperButton(ref) {
  return `<button class="lnk" data-paper="${esc(ref.paper)}" title="${esc(byPaperId.get(ref.paper).citation)}">${esc(byPaperId.get(ref.paper).title)}</button>`;
}
function sourceSummary(items) {
  const refs = paperReferences(items);
  const cited = new Set(refs.map(r => r.paper));
  const entries = sourceEntries(items).filter(e => ![...cited].some(id => e.source.toLowerCase().includes(byPaperId.get(id).title.toLowerCase())));
  const links = [...new Map(refs.map(r => [r.paper, paperButton(r)])).values()];
  const provenance = entries.map(x => `<span title="${esc(x.source)}">${esc(x.label)}</span>`);
  return `<div class="pop-sources"><b>References:</b> ${[...links, ...provenance].join('; ') || 'not recorded'}</div>`;
}
function sourceList(items) {
  const refs = paperReferences(items), entries = sourceEntries(items);
  const linked = refs.length ? `<h2>Paper references</h2><ul class="src">${refs.map(ref => `<li><b>${esc(ref.role[0].toUpperCase() + ref.role.slice(1))}:</b> ${paperButton(ref)}${ref.locator ? ' — ' + esc(ref.locator) : ''}${ref.note ? `<p>${esc(ref.note)}</p>` : ''}</li>`).join('')}</ul>` : '';
  return linked + (entries.length ? `<h2>Record provenance</h2><ul class="src">${entries.map(x => `<li><b>${esc(x.label)}</b>${x.label === x.source ? '' : ' — ' + esc(x.source)}</li>`).join('')}</ul>` : '');
}
function mountPaperCatalogue() {
  if (!papers.length) return;
  const backgroundPage = document.getElementById('background');
  let catalogue = backgroundPage.querySelector('#paper-catalogue');
  if (!catalogue) {
    backgroundPage.insertAdjacentHTML('beforeend', '<h2>Literature</h2><section id="paper-catalogue"></section>');
    catalogue = backgroundPage.querySelector('#paper-catalogue');
  }
  catalogue.innerHTML = '<input class="search" id="paper-search" type="search" placeholder="Find a paper, author or principle…" aria-label="Search literature"><div id="papers"></div>';
  document.getElementById('paper-search').addEventListener('input', renderPapers);
  renderPapers();
}
function renderPapers() {
  const query = document.getElementById('paper-search').value.trim().toLowerCase();
  const records = [...DATA.principles, ...DATA.results, ...DATA.models];
  const linked = paper => records.filter(x => (x.references || []).some(ref => ref.paper === paper.id));
  const matching = papers.filter(p => [p.title, p.citation, p.note || '', ...linked(p).flatMap(x => [x.name || x.id, ...(x.aliases || [])])].join(' ').toLowerCase().includes(query));
  const el = document.getElementById('papers');
  const renderPaper = p => {
    const items = linked(p);
    const principles = items.filter(x => DATA.principles.includes(x));
    const results = items.filter(x => DATA.results.includes(x));
    const models = items.filter(x => DATA.models.includes(x));
    const refsFor = x => (x.references || []).filter(ref => ref.paper === p.id);
    const referenceNote = x => refsFor(x).map(ref => `<span class="dim">${esc(ref.role)}${ref.locator ? ' · ' + esc(ref.locator) : ''}</span>${ref.note ? `<p>${esc(ref.note)}</p>` : ''}`).join('');
    const principleList = principles.length ? `<h5>Principles</h5><ul class="src">${principles.map(x => `<li><button class="lnk" data-open-principle="${esc(x.id)}">${esc(x.name)}</button> — ${referenceNote(x)}</li>`).join('')}</ul>` : '';
    const evidenceList = (xs, kind, label) => xs.length ? `<details><summary>${label} (${xs.length})</summary><ul class="src">${xs.map(x => `<li><button class="lnk" data-open-${kind}="${esc(x.id)}">${kind === 'result' ? resultStmt(x) : esc(x.name)}</button> — ${referenceNote(x)}</li>`).join('')}</ul></details>` : '';
    const link = /^https?:\/\//.test(p.url || '') ? ` <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Paper ↗</a>` : '';
    return `<article class="paper-entry" id="paper-${esc(p.id)}" tabindex="-1"><h4>${esc(p.title)}</h4><p>${esc(p.citation)}${link}</p>${p.note ? `<p class="dim">${esc(p.note)}</p>` : ''}${principleList}${evidenceList(results, 'result', 'Results')}${evidenceList(models, 'model', 'Models')}</article>`;
  };
  el.innerHTML = [
    ['source-literature', 'Source literature', matching.filter(p => linked(p).length)],
    ['other-literature', 'Other relevant literature', matching.filter(p => !linked(p).length)]

}
function openPaper(id) {

function fileLinks(x) {

// A record with a hand-written write-up shows that write-up in full on its page.
// The record's own description is rendered first so the page is complete without

function writeupNote(x) {

function loadWriteup(el, x) {
  const f = x.files || {}, box = el.querySelector('.record-summary');
  if (!box || !f.handwritten || !f.html || typeof fetch !== 'function') return;
  fetch(f.html).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(html => {
    if (!box.isConnected) return;
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('nav.writeup-nav, header#title-block-header, script, style').forEach(n => n.remove());
    doc.body.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href'), m = /^([a-z0-9-]+)\.html$/.exec(href);
      if (m && (byRid.has(m[1]) || byMid.has(m[1]))) { a.setAttribute('href', 'writeups/' + href); a.dataset.openWriteup = m[1]; }
      else if (/^[a-z0-9.-]+\.(html|md|pdf)$/.test(href)) a.setAttribute('href', 'writeups/' + href);
      else if (/^https?:/.test(href)) a.target = '_blank';
    });
    box.className = 'prose writeup'; box.innerHTML = doc.body.innerHTML;
    renderSubscripts(box);
    box.querySelectorAll('a[data-open-writeup]').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); const id = a.dataset.openWriteup; openPage({ type: byRid.has(id) ? 'result' : 'model', id }); }));
