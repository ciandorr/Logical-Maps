* { box-sizing: border-box; }
html { background: var(--bg); scrollbar-color: var(--line-strong) var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--sans); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; text-underline-offset: 3px; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
::selection { background: var(--hl); color: var(--ink); }

.writeup-page h3 { font-size: 1em; }
.writeup-page p { margin: 0 0 12px; }
.writeup-page .cert { color: var(--ink-2); font-size: .85em; }
.writeup-page code, .writeup-page pre { font: .85em/1.6 var(--mono); color: var(--ink); }
.writeup-page pre { padding: 14px; background: var(--panel-2); overflow-x: auto; }
.writeup-page blockquote { color: var(--ink-2); border-left: 2px solid var(--line-strong); margin-left: 0; padding-left: 20px; }
.writeup-page math[display="block"] { display: block; overflow-x: auto; padding: 8px 0; }
.writeup-page table { display: block; overflow-x: auto; border-collapse: collapse; }

@media (max-width: 600px) {

/* Shared Okabe–Ito palette: https://jfly.uni-koeln.de/color/#pallet

  :root[data-palette="colourblind"] {
    --bg: #f4f5f6;
    --panel: #ffffff;
    --panel-2: #e9edf0;
    --line: #d0d6da;
    --line-strong: #87949d;

    --assisted: #80506a;
    --ai: #a44500;
    --derived: #687780;
    --indep: #925f00;
    --open: #e9edf0;
    --open-ink: #586670;
    --conj: #80506a;
    --node-fill: #ffffff;
    --node-stroke: #7a8b96;
    --junction: #45535d;
    --hl: #dce4ea;
    --focus: #0072b2;
    --badge-ink: #ffffff;
    --warning-bg: #fff0ce;
    --source-forest: #56b4e9;

    --panel-2: #23303b;
    --line: #354550;
    --line-strong: #718492;
    --ink: #edf2f5;
    --ink-2: #c1ced7;
    --ink-3: #a5b5c1;
    --accent: #56b4e9;
    --link-hover: #e69f00;
    --human: #56b4e9;
    --assisted: #cc79a7;
    --ai: #e69f00;
    --derived: #91a1ad;
    --indep: #e69f00;
    --open: #23303b;
    --open-ink: #a5b5c1;
    --conj: #cc79a7;

    --hl: #354654;

    --shadow: 0 4px 24px rgb(0 0 0 / 25%);

     text to keep the normal contrast on both light and dark surfaces. */

    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--source-color);
    border-left-width: 4px;
  }
}

<script>/* Apply before paint; share the preference between every map and write-up. */
(() => {
  const key = 'pmap-theme';
  const paletteKey = 'pmap-palette';
  const system = window.matchMedia?.('(prefers-color-scheme: dark)');
  let preference;
  let palette;
  try { preference = localStorage.getItem(key); } catch (_) {}
  try { palette = localStorage.getItem(paletteKey); } catch (_) {}
  if (!['light', 'dark'].includes(preference)) preference = null;
  if (palette !== 'colourblind') palette = 'default';
  function apply(theme) {
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll('[data-theme-toggle]').forEach(button => {
      button.textContent = theme === 'dark' ? '[Light mode]' : '[Dark mode]';
      button.setAttribute('aria-label', `Switch to ${theme === 'dark' ? 'light' : 'dark'} mode`);
    });
  }
  function applyPalette() {
    document.documentElement.dataset.palette = palette;
    document.querySelectorAll('[data-colourblind-toggle]').forEach(button => {
      button.setAttribute('aria-pressed', String(palette === 'colourblind'));
      button.textContent = `[Colourblind mode: ${palette === 'colourblind' ? 'on' : 'off'}]`;
    });
  }
  const initial = () => preference || (system?.matches ? 'dark' : 'light');
  apply(initial());
  applyPalette();
  document.addEventListener('DOMContentLoaded', () => {
    apply(initial());
    applyPalette();
    document.querySelectorAll('[data-theme-toggle]').forEach(button => {
      button.addEventListener('click', () => {
        preference = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        apply(preference);
        try { localStorage.setItem(key, preference); } catch (_) {}
      });
    });
    document.querySelectorAll('[data-colourblind-toggle]').forEach(button => {
      button.addEventListener('click', () => {
        palette = palette === 'colourblind' ? 'default' : 'colourblind';
        applyPalette();
        try { localStorage.setItem(paletteKey, palette); } catch (_) {}
      });
    });
  });
  system?.addEventListener('change', () => { if (!preference) apply(initial()); });
  window.addEventListener('storage', event => {
    if (event.key === key || event.key === null) {
      preference = ['light', 'dark'].includes(event.newValue) ? event.newValue : null;
      apply(initial());
    }
    if (event.key === paletteKey || event.key === null) {
      palette = event.newValue === 'colourblind' ? 'colourblind' : 'default';
      applyPalette();
    }
  });
})();
</script>

  #model-principles .model-category h3 { margin-bottom: 5px; }
  #model-principles .ex-list { margin-bottom: 10px; }
  .evidence-link { color: var(--accent); font-size: 11px; }

  .ex-head { line-height: 1.5; }
  .ex-m { display: block; padding: 7px 0; }
  .model-heading { display: flex; align-items: baseline; gap: 12px; }
  .model-heading > .lnk { min-width: 0; flex: 1; font-size: 14px; line-height: 1.55; text-align: left; }
  .ex-m.sel { padding-inline: 12px; border-left: 2px solid var(--accent); }
  .inspection-note { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  .inspection-note > .lnk { display: inline-block; margin-left: 10px; font-size: 11px; }
  .node.negative rect { stroke-dasharray: 6 3; }
  /* Solid fills mean proofs; diagonal halves mean consistency witnesses.
     Open questions retain the normal fill. */
  :root {
    --rel-positive: var(--human);
    --rel-negative: var(--indep);
    --rel-entailed: color-mix(in srgb, var(--rel-positive) 36%, var(--node-fill));
    --rel-excluded: color-mix(in srgb, var(--rel-negative) 30%, var(--node-fill));
  }
  .node.rel-entailed rect, .junction.rel-entailed circle { fill: var(--rel-entailed); }
  .node.rel-excluded rect, .junction.rel-excluded circle { fill: var(--rel-excluded); stroke: var(--indep); }
  .node.rel-consistent rect, .junction.rel-consistent circle { fill: url(#split-consistent); }
  .node.rel-separated rect, .junction.rel-separated circle { fill: url(#split-separated); }
  .node.rel-independent rect, .junction.rel-independent circle { fill: url(#split-independent); }
  .node.rel-conjectured rect, .junction.rel-conjectured circle { fill: url(#hatch-conjectured); }
  .node.rel-base rect, .junction.rel-base circle { fill: var(--hl); }
  .node.rel-base rect, .junction.rel-base circle { stroke: var(--accent); stroke-width: 2.4; }
  #graph.inconsistent-selection .junction circle { fill: var(--rel-excluded); stroke: var(--indep); }
  #graph.shaded .node.dim, #graph.shaded .junction.dim { opacity: .7; }
  .graph-area { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .relation-legend { flex: none; min-width: 0; max-height: 60%; overflow: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--ink-2); }
  .relation-legend[hidden] { display: none; }
  .relation-legend b { color: var(--ink); }
  .relation-legend .key { display: inline-flex; flex: none; align-items: center; gap: 5px; }
  .relation-legend .key i { width: 14px; height: 12px; border: 1px solid var(--node-stroke); border-radius: 2px; display: inline-block; background: var(--node-fill); }
  .relation-legend .key.entailed i { background: var(--rel-entailed); color: var(--human); }
  .relation-legend .key.excluded i { background: var(--rel-excluded); border-color: var(--indep); color: var(--indep); }
  .relation-legend .key.consistent i { background: linear-gradient(to bottom right, var(--rel-entailed) 50%, var(--node-fill) 50%); color: var(--human); }
  .relation-legend .key.separated i { background: linear-gradient(to bottom right, var(--node-fill) 50%, var(--rel-excluded) 50%); color: var(--indep); }
  .rel-status { font-weight: 600; }
  .rel-status.implies { color: var(--human); } .rel-status.excludes, .rel-status.independent, .rel-status.inconsistent { color: var(--indep); }
  .rel-status.open { color: var(--ink-3); font-weight: 500; } .rel-status.conjectured { color: var(--conj); }
  .pop ul.rel { list-style: none; padding: 0; margin: 4px 0 8px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .pop ul.rel li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .pop .rel-line { margin: 4px 0; font-size: 13px; }
  .pop .rel-line .stmt { font-size: 13px; }
  .pop details.rel-evidence { margin: 2px 0 6px 14px; font-size: 12px; } .pop details.rel-evidence summary { cursor: pointer; color: var(--ink-3); }
  .pop .rel-head { margin-top: 10px; }
  .graph-hint svg { flex: none; overflow: visible; }
  .direction-chevron, .flow-chevron { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #flow { pointer-events: none; }
  .edge-g.dim .direction-chevron { opacity: .18; }
  .edge-g.hot .direction-chevron { stroke-width: 2.4; }
  @media (prefers-reduced-motion: reduce) { .flow-chevron { display: none; } }
  @media (max-width: 1000px) { .ex { gap: 24px; } }
  @media (max-width: 760px) {
    .principle-line { font-size: 13px; line-height: 1.5; }

    header.top { gap: 8px 16px; padding: 0 16px 14px; }
    header.top > div:first-child { flex: 1 1 100%; }
    .dl { margin-left: 0; flex: 1; }
    .tabs { padding: 0 16px; gap: 0 18px; }
    .tab { padding: 10px 0; font-size: 13px; }
    .ex { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .list, .page { padding: 18px 16px 32px; }
    .controls-scroll { padding: 12px 10px; }
    .background-dock { padding: 10px; }

    .open-list { grid-template-columns: minmax(0, 1fr); }
    .page dl { grid-template-columns: minmax(0, 1fr); }

  }

    .app { margin-block: 8px; height: calc(100vh - 16px); height: calc(100dvh - 16px); }

.paper-entry:first-of-type { padding-top: 0; }

<body>
<div class="app">
  <header class="top">
    <div>
      <div class="title-row"><h1 id="title"></h1><nav id="site-links" class="site-links" aria-label="Site navigation" hidden></nav></div>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="dl" id="downloads"></div>
    <div class="display-toggles">
      <button type="button" class="theme-toggle" data-theme-toggle>[Dark mode]</button>
      <button type="button" class="theme-toggle" data-colourblind-toggle aria-label="Colourblind mode" aria-pressed="false" title="Okabe–Ito palette: sky blue and orange">[Colourblind mode: off]</button>
    </div>
  </header>
  <div class="body">
    <main>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="background" aria-selected="false">Background</button>
        <button class="tab" role="tab" data-tab="graph" aria-selected="true">Graph</button>
        <button class="tab" role="tab" data-tab="models" aria-selected="false">Theory explorer</button>
        <button class="tab" role="tab" data-tab="open" aria-selected="false">Conjectures <span class="n" id="n-open"></span></button>
        <button class="tab" role="tab" data-tab="results" aria-selected="false">Changes <span class="n" id="n-results"></span></button>
        <button class="tab" role="tab" data-tab="contribute" aria-selected="false" hidden>Contribute</button>
      </div>
      <section class="pane" id="pane-graph" data-active="true">
    <aside class="controls" id="graph-sidebar">
      <div class="controls-scroll" id="principle-controls">
      <div id="conjecture-options">
        <h2>Conjectures</h2>
        <div class="ctl"><label><input type="checkbox" id="show-resolved">Show resolved</label></div>
      </div>
      <div>
        <h2 id="source-filter-heading" title="Filter displayed arrows. Background consequences always use all recorded proofs.">Arrow sources</h2>
        <div class="ctl" id="source-filters"></div>
        <div class="ctl">
          <label><input type="checkbox" id="lean-only"><span class="sw" style="border-color:var(--ink)"></span>Lean-verified only</label>
        </div>
      </div>
      <div id="graph-options">
        <h2>Graph</h2>
        <p class="graph-hint" title="Solid neutral arrows are derived proofs. Click an arrow for its proof steps and sources; intermediate principles may be hidden or combined."><span class="sw derived"></span>Derived proofs</p>
        <div class="ctl">
          <label title="Show conjectures independently of source selection, simplifying their premises using all proved background consequences. Lean-verified only still excludes unverified arrows."><input type="checkbox" id="show-conj"><span class="sw conj dashed"></span>Conjecture arrows</label>
          <label title="Show only conjecture arrows and their connected principles. Proved background consequences still apply."><input type="checkbox" id="conjecture-only">Conjectures only</label>
          <label title="Show arrows from online submissions and miscellaneous sources, including unpublished manuscripts. Combine with Conjectures only for unpublished conjectures."><input type="checkbox" id="unpublished-only">Unpublished only</label>
          <label title="Hide an arrow when a chain of other displayed arrows already gives it, as in a Hasse diagram. Recorded theorems may then be hidden; a proved arrow is never hidden on the strength of a conjecture."><input type="checkbox" id="reduce-arrows">Transitive reduction</label>
          <label title="Show the logical arrows from False to every node and from every node to True."><input type="checkbox" id="trivial-arrows">Trivial arrows</label>
          <label><input type="checkbox" id="show-iso" checked><span class="sw" style="border-style:dashed;border-color:var(--node-stroke)"></span>Isolated principles</label>
        </div>
      </div>
      <div>
        <h2>Principles <button class="lnk dim" id="pr-all">show positive</button> <button class="lnk dim" id="pr-none">clear</button></h2>
        <p class="background-hint conjecture-hint">Choose a principle’s positive or negative form, then move it to background.</p>
        <div class="ctl" id="pr-filters"></div>
      </div>
      </div>
      <div class="pane-divider" id="background-divider" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize background pane" aria-controls="background-dock principle-controls" title="Drag to resize background · Arrow keys to adjust · Double-click to reset"></div>
      <section class="background-dock" id="background-dock" aria-labelledby="background-heading">
        <h2 id="background-heading">Background <span id="background-count"></span><button class="lnk" id="background-reset">clear background</button></h2>
        <div id="background-presets" class="background-presets"></div>
        <div id="background-list" class="ctl"></div>
        <p id="background-status" class="background-status" role="status" aria-live="polite"></p>
      </section>
    </aside>
        <div class="pane-divider" id="sidebar-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize left sidebar" aria-controls="graph-sidebar" title="Drag to resize sidebar · Arrow keys to adjust · Double-click to reset"></div>
        <div class="graph-workspace">
        <div class="graph-area">
          <svg id="graph" role="img" aria-label="Implication graph"></svg>
          <div id="graph-warning" class="graph-warning" role="alert" hidden></div>
          <div id="graph-empty" class="graph-empty" role="status" hidden></div>
          <div class="graph-tools"><div class="graph-search"><input class="search" id="graph-search" type="search" placeholder="Find a principle…" aria-label="Find a principle on the graph" aria-describedby="graph-search-status" autocomplete="off"><span id="graph-search-status" role="status" aria-live="polite"></span></div><button class="btn small" id="fit">Fit</button></div>
        </div>
        <div class="pane-divider" id="details-divider" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize selection details" aria-controls="graph-details" title="Drag to resize details · Arrow keys to adjust · Double-click to reset"></div>
        <aside id="graph-details" class="graph-details" aria-label="Selection details">
          <div id="relation-legend" class="relation-legend" role="status" aria-live="polite" hidden></div>
          <p id="graph-details-hint">Select a principle, conjunction or arrow to see its details and logical relations here. Shift-click to add or remove principles.</p>
        </aside>
        </div>
      </section>
      <section class="pane" id="pane-models"><div class="list" id="models"></div></section>
      <section class="pane" id="pane-results"><div class="list"><input class="search" id="search" type="search" placeholder="Filter" aria-label="Filter changes"><div id="results"></div></div></section>
      <section class="pane" id="pane-open"><div class="open-content"><div id="open-warning" class="graph-warning" role="alert" hidden></div><div class="list" id="open"></div></div></section>
      <section class="pane" id="pane-page"><div class="page" id="page"></div></section>
      <section class="pane" id="pane-background"><div class="page prose-page" id="background"></div></section>
      <section class="pane" id="pane-contribute"><div class="page prose-page" id="contribute"></div></section>
    </main>
  </div>
</div>
<div id="floating-details"><div id="pop" class="pop" hidden></div></div>

y true proposition.", "formal": "$\\exists p\\, .\\,p\\land\\forall q\\, .\\,q\\to p\\le q$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 25."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.2, p. 25"}], "notes": "", "file": "topics/classicism/principles/actuality.yaml"}, {"id": "all-individuals-fundamental", "name": "All individuals fundamental", "category": "schematic", "statement": "Every individual is fundamental.", "formal": "$\\forall x^e\\, .\\,\\operatorname{Fun}_e(x)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, n. 60, p. 41."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.6, n. 60, p. 41"}], "notes": "", "file": "topics/classicism/principles/all-individuals-fundamental.yaml"}, {"id": "atomicity-r", "name": "Atomicity", "category": "lattice", "statement": "Every non-bottom entity of each relational type has an atom below it.", "formal": "$\\forall^{\\mathrm{Ty}}\\tau\\ne e\\, .\\,\\forall x^\\tau\\, .\\,x\\le_\\tau\\neg_\\tau x\\lor\\exists y^\\tau\\, .\\,\\operatorname{Atom}_\\tau(y)\\land y\\le_\\tau x$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.2, p. 24"}], "notes": "", "file": "topics/classicism/principles/atomicity-r.yaml"}, {"id": "atomicity-t", "name": "Atomicity (type t)", "category": "instances", "statement": "Atomicity (type t) in the displayed closed propositional formulation.", "formal": "$\\forall p\\, .\\,p\\le\\neg p\\lor\\exists q\\, .\\,\\operatorname{Atom}_t(q)\\land q\\le p$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.2, p. 24"}], "notes": "", "file": "topics/classicism/principles/atomicity-t.yaml"}, {"id": "atomlessness", "name": "Atomlessness", "category": "instances", "statement": "Atomlessness in the displayed closed propositional formulation.", "formal": "$\\forall p\\, .\\,\\Diamond p\\to\\exists q\\, .\\,\\Diamond q\\land q\\le p\\land q\\ne p$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix D, p. 76."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "Appendix D, p. 76"}], "notes": "", "file": "topics/classicism/principles/atomlessness.yaml"}, {"id": "barcan-r", "name": "BF", "category": "coarse", "statement": "The Barcan Formula at every type. The predicate formulation closes the formula schema using lambda abstraction.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,\\forall X^{\\sigma t}\\, .\\,(\\forall x^\\sigma\\, .\\,\\Box Xx)\\to\\Box(\\forall x^\\sigma\\, .\\,Xx)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.1, pp. 20–21."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "Proposition 2.1, pp. 20–21"}, {"paper": "barcan-1946", "role": "origin", "locator": "pp. 1–16; attribution in Classicism p. 21"}], "notes": "", "aliases": ["Barcan Formula"], "file": "topics/classicism/principles/barcan-r.yaml"}, {"id": "barcan-t", "name": "BF (type t)", "category": "instances", "statement": "BF (type t) in the displayed closed propositional formulation.", "formal": "$\\forall X^{tt}\\, .\\,(\\forall p\\, .\\,\\Box Xp)\\to\\Box(\\forall p\\, .\\,Xp)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, p. 59."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§3.5, p. 59"}], "notes": "", "file": "topics/classicism/principles/barcan-t.yaml"}, {"id": "boolean-completeness-r", "name": "Boolean Completeness", "category": "lattice", "statement": "Every property of entities of a relational type has a greatest lower bound in that type.", "formal": "$\\forall^{\\mathrm{Ty}}\\tau\\ne e\\, .\\,\\forall X^{\\tau t}\\, .\\,\\exists y^\\tau\\, .\\,\\operatorname{GLB}_\\tau(y,X)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, pp. 23–24."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.2, pp. 23–24"}], "notes": "", "file": "topics/classicism/principles/boolean-completeness-r.yaml"}, {"id": "boolean-completeness-t", "name": "Boolean Completeness (type t)", "category": "instances", "statement": "Boolean Completeness (type t) in the displayed closed propositional formulation.", "formal": "$\\forall X^{tt}\\, .\\,\\exists p\\, .\\,\\operatorname{GLB}_t(p,X)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, pp. 23–26; Appendix D, n. 92, p. 74."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.2, pp. 23–26; Appendix D, n. 92, p. 74"}], "notes": "", "file": "topics/classicism/principles/boolean-completeness-t.yaml"}, {"id": "broad-necessitism-r", "name": "Broad Necessitism", "category": "base", "statement": "Every entity of an type is necessarily identical to something.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,\\forall x^\\sigma\\, .\\,\\Box(\\exists y^\\sigma\\, .\\,y=x)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 19."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.5, p. 19"}], "notes": "", "file": "topics/classicism/principles/broad-necessitism-r.yaml"}, {"id": "converse-barcan-r", "name": "CBF", "category": "base", "statement": "The Converse Barcan Formula at every type.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,\\forall X^{\\sigma t}\\, .\\,\\Box(\\forall x^\\sigma\\, .\\,Xx)\\to(\\forall x^\\sigma\\, .\\,\\Box Xx)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 19."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.5, p. 19"}], "notes": "", "file": "topics/classicism/principles/converse-barcan-r.yaml"}, {"id": "converse-witnessed-possibility-r", "name": "Converse Witnessed Possibility", "category": "schematic", "statement": "The converse of Witnessed Possibility, with precisely the same formula, type and constant side conditions.", "formal": "$\\Diamond P[\\bar c/\\bar x]\\to(\\exists\\bar x\\, .\\,P)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.5, n. 57, p. 38"}], "notes": "", "file": "topics/classicism/principles/converse-witnessed-possibility-r.yaml"}, {"id": "distinctness-necessary-r", "name": "ND", "category": "coarse", "statement": "Distinct things of any type are necessarily distinct.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,\\forall x y^\\sigma\\, .\\,x\\ne y\\to\\Box(x\\ne y)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–22."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.1, pp. 21–22"}], "notes": "", "aliases": ["Necessity of distinctness"], "file": "topics/classicism/principles/distinctness-necessary-r.yaml"}, {"id": "distinctness-necessary-t", "name": "ND (type t)", "category": "instances", "statement": "ND (type t) in the displayed closed propositional formulation.", "formal": "$\\forall p q\\, .\\,p\\ne q\\to\\Box(p\\ne q)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.2, p. 22."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "Proposition 2.2, p. 22"}], "notes": "", "file": "topics/classicism/principles/distinctness-necessary-t.yaml"}, {"id": "distinctness-preserving-collapse", "name": "Distinctness-preserving collapse", "category": "schematic", "statement": "Every truth is necessary under the distinctness-preserving modality.", "formal": "$\\forall p\\, .\\,p\\to\\Box_{\\ne}p$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix E, p. 83."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "Appendix E, p. 83"}], "notes": "", "file": "topics/classicism/principles/distinctness-preserving-collapse.yaml"}, {"id": "distinctness-schema-r", "name": "Distinctness (pure)", "category": "schematic", "statement": "Every closed pure identity not provable in C is false. The non-theorem condition is metalinguistic.", "formal": "$A\\ne B\\quad(A=B\\text{ closed and pure; }C\\nvdash A=B)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.4, pp. 35–36."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.4, pp. 35–36"}], "notes": "The reference theory in the side condition is the fixed background C.", "aliases": ["Pure Maximalist Classicism"], "file": "topics/classicism/principles/distinctness-schema-r.yaml"}, {"id": "distinctness-signature-r", "name": "Distinctness (signature Σ)", "category": "schematic", "statement": "The Distinctness schema for the fixed nonlogical signature Sigma.", "formal": "$A\\ne B\\quad(A=B\\text{ closed in }\\mathcal L(\\Sigma);\\ C(\\Sigma)\\nvdash A=B)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 37–39."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.5, pp. 37–39"}], "notes": "", "aliases": ["Maximalist Classicism (R, Σ)"], "file": "topics/classicism/principles/distinctness-signature-r.yaml"}, {"id": "existence-r", "name": "Existence", "category": "base", "statement": "Every type is inhabited.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,\\exists x^\\sigma\\, .\\,x=x$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.1, p. 7."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.1, p. 7"}], "notes": "", "file": "topics/classicism/principles/existence-r.yaml"}, {"id": "extensionality-r", "name": "Extensionality", "category": "extensionality", "statement": "At each relational type, coextensive relations are identical; include the nullary propositional case.", "formal": "$\\forall^{\\mathrm{Ty}}\\bar\\sigma\\, .\\,\\forall X Y\\, .\\,(\\forall\\bar z\\, .\\,X[\\bar z]\\leftrightarrow Y[\\bar z])\\to X=Y$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.4, pp. 15–16"}], "notes": "", "aliases": ["Extensionalism"], "file": "topics/classicism/principles/extensionality-r.yaml"}, {"id": "fregean-axiom", "name": "Fregean Axiom", "category": "extensionality", "statement": "Materially equivalent propositions are identical.", "formal": "$\\forall p q\\, .\\,(p\\leftrightarrow q)\\to p=q$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.4, pp. 15–16"}], "notes": "", "file": "topics/classicism/principles/fregean-axiom.yaml"}, {"id": "functional-choice-r", "name": "Functional Choice", "category": "choice", "statement": "Every serial binary relation admits a selecting operation. Its output type is relational, as required by the type system.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma,\\tau,\\ \\tau\\ne e\\, .\\,\\forall U^{\\sigma\\tau t}\\, .\\,\\operatorname{Serial}(U)\\to\\exists X^{\\sigma\\tau}\\, .\\,\\forall y\\, .\\,(Uy)(Xy)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 31–33."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.3, pp. 31–33"}], "notes": "", "file": "topics/classicism/principles/functional-choice-r.yaml"}, {"id": "functionality-r", "name": "Functionality", "category": "extensionality", "statement": "Operations with the same value on every argument are identical. The output type is relational.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma,\\tau,\\ \\tau\\ne e\\, .\\,\\forall X Y^{\\sigma\\tau}\\, .\\,(\\forall z^\\sigma\\, .\\,Xz=Yz)\\to X=Y$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16, especially n. 18."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.4, pp. 15–16, especially n. 18"}], "notes": "", "file": "topics/classicism/principles/functionality-r.yaml"}, {"id": "fundamental-possibility-r", "name": "Fundamental Possibility", "category": "schematic", "statement": "For a pure-formula P consistent with C with free variables among x, every tuple of fundamental entities, pairwise distinct within each type, possibly satisfies P. Include the empty tuple.", "formal": "$\\forall\\bar x\\, .\\,\\operatorname{Fun}(\\bar x)\\to\\Diamond P$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 39–40."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.5, pp. 39–40"}], "notes": "The predicates Fun_sigma are nonlogical and receive no standing axioms.", "file": "topics/classicism/principles/fundamental-possibility-r.yaml"}, {"id": "gallin-extensional-comprehension-r", "name": "Gallin Extensional Comprehension", "category": "comprehension", "statement": "Every relation is coextensive with one that is persistent and has a persistent pointwise negation. This is the source’s comparison with Gallin’s different rigidity convention.", "formal": "$\\forall^{\\mathrm{Ty}}\\bar\\sigma\\, .\\,\\forall X\\, .\\,\\exists Y\\, .\\,\\operatorname{Persistent}(Y)\\land\\operatorname{Persistent}(\\neg Y)\\land(\\forall\\bar z\\, .\\,X[\\bar z]\\leftrightarrow Y[\\bar z])$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 37, p. 28."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.3, n. 37, p. 28"}, {"paper": "gallin-1975", "role": "origin", "locator": "p. 77, as described in Classicism n. 37"}], "notes": "", "file": "topics/classicism/principles/gallin-extensional-comprehension-r.yaml"}, {"id": "identity-necessary-r", "name": "NI", "category": "base", "statement": "Identity is necessary at every type.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma\\, .\\,\\forall x y^\\sigma\\, .\\,x=y\\to\\Box(x=y)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, p. 22."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.1, p. 22"}], "notes": "", "file": "topics/classicism/principles/identity-necessary-r.yaml"}, {"id": "inextensible-comprehension-r", "name": "Inextensible Comprehension", "category": "comprehension", "statement": "Every relation, including a proposition, is coextensive with a inextensible one.", "formal": "$\\forall^{\\mathrm{Ty}}\\bar\\sigma\\, .\\,\\forall X\\, .\\,\\exists Y\\, .\\,\\operatorname{Inextensible}(Y)\\land(\\forall\\bar z\\, .\\,X[\\bar z]\\leftrightarrow Y[\\bar z])$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 38, p. 29."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.3, n. 38, p. 29"}], "notes": "", "file": "topics/classicism/principles/inextensible-comprehension-r.yaml"}, {"id": "infinity-e", "name": "Infinity (type e)", "category": "instances", "statement": "There are arbitrarily many pairwise distinct entities of this fixed type; one sentence for each positive integer n.", "formal": "$\\exists x_1^e\\cdots x_n^e\\, .\\,\\bigwedge_{i<j}x_i\\ne x_j\\quad(n\\ge1)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 47, p. 32."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.3, n. 47, p. 32"}], "notes": "Schema-level reading of the source’s informal infinity claim; no choice-dependent equivalence with Dedekind infinity is assumed.", "file": "topics/classicism/principles/infinity-e.yaml"}, {"id": "infinity-t", "name": "Infinity (type t)", "category": "instances", "statement": "There are arbitrarily many pairwise distinct entities of this fixed type; one sentence for each positive integer n.", "formal": "$\\exists x_1^t\\cdots x_n^t\\, .\\,\\bigwedge_{i<j}x_i\\ne x_j\\quad(n\\ge1)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 47, p. 32."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.3, n. 47, p. 32"}], "notes": "Schema-level reading of the source’s informal infinity claim; no choice-dependent equivalence with Dedekind infinity is assumed.", "file": "topics/classicism/principles/infinity-t.yaml"}, {"id": "intensionality-r", "name": "Intensionality", "category": "base", "statement": "Necessarily coextensive relations are identical.", "formal": "$\\forall^{\\mathrm{Ty}}\\bar\\sigma\\, .\\,\\forall X Y\\, .\\,\\Box(\\forall\\bar z\\, .\\,X[\\bar z]\\leftrightarrow Y[\\bar z])\\to X=Y$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, pp. 17–18."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.5, pp. 17–18"}], "notes": "", "file": "topics/classicism/principles/intensionality-r.yaml"}, {"id": "logical-necessity-r", "name": "Logical Necessity", "category": "schematic", "statement": "The Logical Necessity schema: necessity at distinct matching constants is equivalent to universal truth of the pure-formula. Preserve the side conditions of Witnessed Possibility.", "formal": "$\\Box P[\\bar c/\\bar x]\\leftrightarrow(\\forall\\bar x\\, .\\,P)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§2.5, n. 57, p. 38"}, {"paper": "bacon-2020", "role": "origin", "locator": "Logical Necessity, cited in Classicism n. 57"}], "notes": "", "file": "topics/classicism/principles/logical-necessity-r.yaml"}, {"id": "modal-b", "name": "B", "category": "coarse", "statement": "Every true proposition is necessarily possible.", "formal": "$\\forall p\\, .\\,p\\to\\Box\\Diamond p$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.2, p. 22."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "Proposition 2.2, p. 22"}], "notes": "", "file": "topics/classicism/principles/modal-b.yaml"}, {"id": "modal-five", "name": "5", "category": "coarse", "statement": "Every possible proposition is necessarily possible.", "formal": "$\\forall p\\, .\\,\\Diamond p\\to\\Box\\Diamond p$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.2, p. 22."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "Proposition 2.2, p. 22"}], "notes": "", "file": "topics/classicism/principles/modal-five.yaml"}, {"id": "modal-four", "name": "4", "category": "base", "statement": "Necessary propositions are necessarily necessary.", "formal": "$\\forall p\\, .\\,\\Box p\\to\\Box\\Box p$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 17."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.5, p. 17"}], "notes": "", "file": "topics/classicism/principles/modal-four.yaml"}, {"id": "modal-k", "name": "K", "category": "base", "statement": "Necessity distributes over implication.", "formal": "$\\forall p q\\, .\\,\\Box(p\\to q)\\to(\\Box p\\to\\Box q)$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 16."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.5, p. 16"}], "notes": "", "file": "topics/classicism/principles/modal-k.yaml"}, {"id": "modal-t", "name": "T", "category": "base", "statement": "Necessary propositions are true.", "formal": "$\\forall p\\, .\\,\\Box p\\to p$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 16."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.5, p. 16"}], "notes": "", "file": "topics/classicism/principles/modal-t.yaml"}, {"id": "modalized-fregean", "name": "Modalized Fregean Axiom", "category": "base", "statement": "Necessarily equivalent propositions are identical.", "formal": "$\\forall p q\\, .\\,\\Box(p\\leftrightarrow q)\\to p=q$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 18."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.5, p. 18"}], "notes": "", "file": "topics/classicism/principles/modalized-fregean.yaml"}, {"id": "modalized-functionality-r", "name": "Modalized Functionality", "category": "base", "statement": "Necessarily co-functional operations of function types are identical.", "formal": "$\\forall^{\\mathrm{Ty}}\\sigma,\\tau,\\ \\tau\\ne e\\, .\\,\\forall X Y^{\\sigma\\tau}\\, .\\,\\Box(\\forall z^\\sigma\\, .\\,Xz=Yz)\\to X=Y$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 18 and n. 22."], "source_names": ["Classicism"], "references": [{"paper": "bacon-dorr-classicism", "role": "formulation", "locator": "§1.5, p. 18 and n. 22"}], "notes": "", "file": "topics/classicism/principles/modalized-functionality-r.yaml"}, {"id": "necessary-actuality", "name": "□Actuality", "category": "lattice", "statement": "Every closed instance of Actuality is necessary. Box the entire object-variable closure; retain the same type range and other schema side conditions.", "formal": "$\\Box\\phi\\quad\\text{for each closed instance }\\phi\\text{ of Actuality}$", "date": "2026-09-17", "sources": ["Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34."], "source_names": ["Classicism"], "reference
