id: analytic-necessitism-codomain-everywhere
requires: [codomain-intensions, infinitely-many-propositions-everywhere]
choice: free
holds: [analytic-necessitism, second-order-analytic-necessitism]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, auditing the withdrawn arguments for the failure of Analytic Necessitism
date: '2026-10-29'
text: >-
  At type $\tau:=tt$. For each object $V$ reachable from the evaluation point fix an injection $A\mapsto
  E^A_V$ from the sets of natural numbers into the sets of propositions at $V$, possible as these are
  infinitely many, and let $Y_A$ be the intension whose value at an arrow into $V$ is $E^A_V$: it depends
  only on the codomain, so it is in the domain, and its transport along an arrow into $V$ is the $Y_A$ of
  $V$, distinct for distinct $A$. Carry the real numbers onto the $Y_A$ and take as relations the
  codomain-only intensions whose value at $V$ is the corresponding set of tuples of the $Y_A$ of $V$.
  Along every arrow the structure is carried to the like structure at the target, an isomorphic copy,
  which is a real number structure there: bounded sets of its elements have least upper bounds among them
  and every inductive subproperty contains its natural numbers. Such a structure is rigid, its instances
  are necessarily distinct, and it is necessarily a real number structure; and the codomain-only intension
  of type $((\tau)^kt)t$ whose value at each object is the set of codomain-only $k$-ary relations among
  the carrier there is a represented power of arity $k$, since at every world each $k$-ary relation agrees
  on the carrier with one of them. So the consequents of Analytic Necessitism and of its second-order form
  hold, and both principles hold. (The argument of the withdrawn analytic-necessitism-unretracted-arrow
  would refute this structure; its step from inextensibility is the gap.)
