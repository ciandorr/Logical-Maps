id: analytic-necessitism-codomain-fixed-individuals
requires: [one-object-action-model, codomain-intensions, infinitely-many-individuals]
choice: free
holds: [analytic-necessitism, second-order-analytic-necessitism]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, auditing the withdrawn arguments for the failure of Analytic Necessitism
date: '2026-10-29'
text: >-
  At type $\tau:=et$, as analytic-necessitism-codomain-fixed: the constant intensions $Y_E$, for $E$ a set
  of individuals, are in the domain, fixed by every arrow, and at least continuum many, there being
  infinitely many individuals; a real number structure on continuum many of them by constant relations has
  fixed parameters, so holds at every world if at the evaluation point, where it does. Such a structure is
  rigid, its instances are necessarily distinct, and it is necessarily a real number structure; and the
  codomain-only intension of type $((\tau)^kt)t$ whose value at each object is the set of codomain-only
  $k$-ary relations among the carrier there is a represented power of arity $k$, since at every world each
  $k$-ary relation agrees on the carrier with one of them. So the consequents of Analytic Necessitism and
  of its second-order form hold, and both principles hold. (The argument of the withdrawn analytic-
  necessitism-unretracted-arrow would refute this structure; its step from inextensibility is the gap.)
