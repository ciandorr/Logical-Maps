id: analytic-necessitism-collapse-orbits
requires: [one-object-action-model, symmetric-domains, finitely-pinned-domains, exact-collapses-of-every-size]
choice: free
holds: [analytic-necessitism, second-order-analytic-necessitism]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, auditing the withdrawn arguments for the failure of Analytic Necessitism
date: '2026-10-29'
text: >-
  At type $tt$. As in the withdrawn analytic-necessitism-exact-collapses-symmetric: for each $n\ge2$ the
  propositions $E_N$, the arrows constant on a set $N$ of $n$ points, form an orbit $O_n$ under the
  symmetry group $G$, pairwise distinct for distinct $n$; for $A\subseteq\mathbb N$ the union $S_A$ of the
  $O_n$, $n\in A$, is $G$-invariant, so the constant intension $Y_A$ with value $S_A$ is symmetric, pinned
  down by $\varnothing$, in the domain, and fixed by transport along every arrow; and $A\mapsto Y_A$ is
  injective. Every set of tuples of the $Y_A$ is $G$-invariant, so it is the value of a constant intension
  in the domain, and so is the set of all those constant relations of a given arity. With one object and
  all parameters fixed, a real number structure on the $Y_A$ by constant relations is one at every world,
  rigid with necessarily distinct instances, and the constant intensions of the sets of its constant
  relations are represented powers. So Analytic Necessitism and its second-order form hold.
