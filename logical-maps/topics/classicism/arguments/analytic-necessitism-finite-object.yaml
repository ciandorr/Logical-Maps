id: analytic-necessitism-finite-object
requires: [finite-reachable-object]
choice: free
fails: [analytic-necessitism]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, auditing the withdrawn arguments for the failure of Analytic Necessitism
date: '2026-10-29'
text: >-
  Let $V$ be the object of the condition, with finitely many entities of every type, and let a real number
  structure exist at the evaluation point. It is possible, so the antecedent of Analytic Necessitism
  holds. Any structure that is necessarily a real number structure would be one at the worlds into $V$,
  where every type is finite, but an ordered field has infinitely many distinct elements. So the
  consequent fails.
