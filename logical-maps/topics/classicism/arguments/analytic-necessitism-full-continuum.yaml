id: analytic-necessitism-full-continuum
requires: [full-continuum-everywhere]
choice: free
holds: [analytic-necessitism]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, auditing the withdrawn arguments for the failure of Analytic Necessitism
date: '2026-10-29'
text: >-
  Let $v$ be the evaluation object and $\tau$ and the $Y_A$ as in the condition: codomain-only intensions
  in the domain, continuum many and pairwise distinct at every reachable object, whose transport along an
  arrow into an object is the like intension there; and for any set $T$ of tuples of them the codomain-
  only intension with value $T$ at an object is in the domain. Carry the real numbers onto the $Y_A$ at
  $v$ and take as relations the codomain-only intensions with the corresponding values at each object.
  Along every arrow the structure goes to an isomorphic one at the target, which is a real number
  structure there, every bounded set of its elements having a least upper bound among them. So the
  structure is rigid, with necessarily distinct instances, and necessarily a real number structure: the
  consequent of Analytic Necessitism holds, and so does the principle. (The withdrawn analytic-
  necessitism-exact-collapses-symmetric built such a structure for its antecedent.)
