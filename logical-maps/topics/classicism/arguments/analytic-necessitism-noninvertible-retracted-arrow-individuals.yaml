id: analytic-necessitism-noninvertible-retracted-arrow-individuals
requires: [full-action-model, noninvertible-retracted-arrow, infinitely-many-individuals]
choice: free
fails: [analytic-necessitism]
by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
date: '2026-10-23'
text: >-
  As the argument analytic-necessitism-noninvertible-retracted-arrow: an arrow $h\colon w\to v$ out
  of the evaluation object with a retraction $j$ but no inverse gives the idempotent $e:=h\circ j$
  out of $v$, which has no retraction, and a rigid real number structure at $w$ at a relational
  type, necessarily a real number structure, would have at $h$ a complete ordered field of instances
  each determined by its transport along $e$, which no entity of a relational type at $v$ is, the
  model being full there. The antecedent of Analytic Necessitism holds at the relational type
  $((et)t)t$, as in the argument analytic-necessitism-unretracted-arrow-individuals, the individuals
  at $w$ being infinitely many. So Analytic Necessitism fails. No choice is used.
withdrawn:
  date: '2026-10-29'
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, after a trawl subagent's report
  reason: >-
    The step from $k\cdot y=k\cdot x\in X_k$ to $Xy$ (or $y\in X_h$) by inextensibility does not
    follow: inextensibility bounds a rigid carrier from above, by the transports of its actual instances,
    and puts nothing new into its actual extension. The conclusion is false in many of the models the
    argument was applied to: entities fixed by every arrow, or transported injectively, can carry a rigid
    real number structure that is necessarily one (see analytic-necessitism-codomain-fixed and
    analytic-necessitism-full-continuum).
