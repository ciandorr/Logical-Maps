id: analytic-necessitism-unretracted-arrow
requires: [full-action-model, unretracted-arrow, infinitely-many-propositions]
choice: free
fails: [analytic-necessitism]
by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
date: '2026-10-23'
text: >-
  Write $w$ for the evaluation object and $k$ for an arrow out of it with no retraction. No entity
  $x$ of a relational type at $w$ is determined by its transport along $k$: the identity of $w$ is
  not of the form $j\circ k$, such a $j$ being a retraction, and the model being full, the intension
  $y$ agreeing with $x$ at every arrow but the identity, where it takes another value, is in the
  domain, while $k\cdot y=k\cdot x$, transport along $k$ reading only the values at the arrows after
  $k$. Suppose then that $\mathfrak R$ were a rigid real number structure at $w$ at a relational
  type, necessarily a real number structure (Background, Analysis), with carrier $X$. For an
  instance $x$ of $X$ and $y$ as above, persistence gives $k\cdot x\in X_k$, so $k\cdot y\in X_k$;
  inextensibility then gives $Xy$; and the necessary distinctness of the instances gives $k\cdot
  y\ne k\cdot x$, a contradiction. So $X$ has no instance and is no complete ordered field. The
  antecedent of Analytic Necessitism holds nevertheless, at some relational type. The propositions
  at $w$ are the sets of the infinitely many arrows out of it, the sets of sets of propositions are
  Dedekind-infinite (a theorem of ZF for any infinite set), and the entities of type $ttt$ at $w$,
  which include one with any given extension at the identity, include a copy of the sets of natural
  numbers and so of the real numbers; the model being full, the order, sum and product of the reals
  are the extensions at the identity of relations in the domain, every subset of that carrier is the
  extension of a subproperty, so the structure is complete, and its least inductive subproperty is
  its natural numbers. So $\exists\mathfrak R\,.\,\operatorname{Real}_{ttt}(\mathfrak R)$ holds at
  $w$ while the consequent of Analytic Necessitism fails there: Analytic Necessitism fails. (When
  the arrows out of $w$ include a copy of the natural numbers, as in the recorded instances, the
  same argument runs at type $t$.) No choice is used.
withdrawn:
  date: '2026-10-29'
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, after a trawl subagent's report
  reason: >-
    The step from $k\cdot y=k\cdot x\in X_k$ to $Xy$ (or $y\in X_h$) by inextensibility does not
    follow: inextensibility bounds a rigid carrier from above, by the transports of its actual instances,
    and puts nothing new into its actual extension. The conclusion is false in many of the models the
    argument was applied to: entities fixed by every arrow, or transported injectively, can carry a rigid
    real number structure that is necessarily one (see analytic-necessitism-codomain-fixed and
    analytic-necessitism-full-continuum).
