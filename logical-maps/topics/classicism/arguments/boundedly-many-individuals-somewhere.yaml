by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
date: '2026-11-24'
text: >-
  Let $v$ and $n$ be as the condition says. By the argument boundedly-many-individuals, with $v$ in
  place of the evaluation object, Potential Infinity (type $e$) fails at the identity arrow of $v$:
  the numeral $\operatorname{Suc}^{n+1}_e\mathbf 0_e$ is a finite cardinality there and holds of no
  property at the identity arrow of any object reachable from $v$. A closed sentence holds at an arrow
  out of the evaluation object exactly when it holds at the identity arrow of the arrow's target (at the
  world seen, in a Kripke-style model), so the arrow into $v$ is a world at which Potential Infinity
  fails, and its necessitation fails at the evaluation point. No choice is used.
