id: boundedly-many-individuals
requires: [boundedly-many-individuals]
choice: free
fails: [potential-infinity-e]
by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
date: '2026-11-24'
text: >-
  Let $n$ bound the number of individuals at the objects reachable from the evaluation point (in a
  Kripke-style model, at the worlds the evaluation point sees). The numeral
  $\operatorname{Suc}^{n+1}_e\mathbf 0_e$ is a closed term, and it denotes a finite cardinality, zero and
  the successor of a finite cardinality being finite cardinalities in C. At the identity arrow of a
  reachable object it holds of no property: a property it holds of has $n+1$ instances any two of which
  are distinct, hence literally distinct, identity being reflexive, and there are at most $n$
  individuals there. A closed sentence holds at an arrow out of the evaluation object exactly when it
  holds at the identity arrow of the arrow's target, so at no world does that numeral hold of a property.
  So Potential Infinity (type $e$) fails, at that number. No choice is used.
