text: >-
  As for individuals (the argument boundedly-many-individuals), at type $t$. Let $n$ bound the number
  of propositions at the objects reachable from the evaluation point. The numeral
  $\operatorname{Suc}^{n+1}_t\mathbf 0_t$ denotes a finite cardinality, and at the identity arrow of a
  reachable object it holds of no property of propositions, a property it holds of having $n+1$
  instances any two of which are distinct, hence literally distinct. A closed sentence holds at an arrow
  exactly when it holds at the identity arrow of the arrow's target, so at no world does that numeral hold
  of a property, and Potential Infinity (type $t$) fails. No choice is used.
