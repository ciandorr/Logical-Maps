id: cardinal-ch-one-individual
requires: [one-individual]
choice: free
holds: [possible-failure-of-cardinal-ch]
fails: [possible-cardinal-ch]
by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
date: '2026-11-25'
text: >-
  Cardinal CH fails at every world, so it is not possible, and its failure, being actual, is possible.
  With one individual at every world, $N=\operatorname{LowerNat}_e$ has exactly three instances at every world.
  At-least zero, $z=\lambda A\, .\,\top$, and its successor, which holds of the properties with an instance,
  differ at the empty property. The successor of that holds of the properties with two distinct instances,
  so of none at any world; it is $\lambda A\, .\,\bot$ by Intensionality, so is its own successor, and differs
  from the other two, which hold of the universal property. Being one of the three is a property of cardinalities
  that $z$ has and that passes to successors, so $N$ has no other instance. The rest is the argument
  cardinal-ch-boundedly-many-individuals with $m=3$: the rigid subproperties of $N$ are the eight
  disjunctions of haecceities of its instances, and a property holding of four of them neither injects
  into the three instances of $N$ nor is in bijection with the eight. No choice is used.
