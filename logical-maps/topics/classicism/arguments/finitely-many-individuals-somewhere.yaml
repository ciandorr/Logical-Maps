id: finitely-many-individuals-somewhere
requires: [finitely-many-individuals-somewhere]
choice: free
fails: [necessary-axiom-of-infinity-e]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
date: '2026-10-31'
text: >-
  At the identity arrow of a reachable object $v$ with $n$ individuals there are not $n+1$ individuals
  any two of which are distinct, distinctness implying literal distinctness, identity being reflexive.
  So the Infinity schema at type $e$ fails there, and with it the Axiom of Infinity at type $e$, which
  implies it in C (axiom-of-infinity-e-implies-infinity-e). A closed sentence holds at an arrow out of
  the evaluation object exactly when it holds at the identity arrow of the arrow's target (at the world
  seen, in a Kripke-style model), so the arrow
  into $v$ is a world at which the Axiom fails, and its necessitation fails at the evaluation point.
