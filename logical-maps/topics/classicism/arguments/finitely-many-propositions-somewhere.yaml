  As for individuals (finitely-many-individuals-somewhere), at type $t$: at the identity arrow of a
  reachable object with $n$ propositions the Infinity schema at type $t$ fails, and so does the Axiom of
  Infinity at type $t$, which implies it in C (axiom-of-infinity-t-implies-infinity-t); so its
  necessitation fails at the evaluation point.
