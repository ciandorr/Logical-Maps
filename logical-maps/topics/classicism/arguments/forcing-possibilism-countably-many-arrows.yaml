text: 'At every reachable object there is one individual. The inexact ordinal predicates are among three
  fixed intensions: well-ordered, having length at least one, and impossible. Successor advances these thresholds
  and fixes the last. For a rigid family of these thresholds, persistence transports each current member;
  for inextensibility test against the disjunction of identity to those current closed thresholds. This
  exhausts the future members, so its intersection is again a threshold. Their collection is an admissible
  induction predicate. Thus H is finite. In a full current domain every infinite carrier contains a countably
  infinite Y, larger than H; Y is power-closed because each strictly smaller subset is finite and its power
  is finite. Every small complete Boolean algebra is therefore finite. For k atoms, choose k outgoing arrows;
  their powerset is exactly the interval below the proposition consisting of these arrows. Every required
  isomorphism is represented by fullness.'
