id: full-comparable-free-arrows-self-atoms
requires:
- full-model
- comparable-free-arrows
holds:
- self-atoms-are-atoms-r
choice: free
by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
date: '2026-10-25'
text: 'Let $I$ be a self-atom of a relational type at the evaluation object. For $\langle k,\bar a\rangle\in
  I$, the transport of $I$ along $k$ is $\{\langle m,\bar b\rangle : \langle m\circ k,\bar b\rangle\in
  I\}$, an atom containing $\langle1,\bar a\rangle$, hence the singleton of it: so $k$ is fixed only by
  the identity, $I$ has no other pair at $k$, and no pair of $I$ sits at a proper left multiple of $k$.
  If $I$ had pairs at two arrows $k\ne k^{\prime}$, both fixed only by identities, comparability would
  make one a proper left multiple of the other. So $I$ is a singleton, an atom.'
