date: '2026-10-25'
text: 'Let $j\circ h=j^{\prime}\circ h$ with $j\ne j^{\prime}$, the composite fixed only by the identity.
  The singleton of the composite is a self-atom: it is true only at the composite, where its transport
  is $\{m : m\circ j\circ h=j\circ h\}=\{1\}$, an atom. It is not a strong atom: under $h$ it becomes
  $\{m : m\circ h=j\circ h\}$, which contains $j$ and $j^{\prime}$, and the proposition $\{j\}$ at $h$’s
  target neither contains nor excludes it.'
