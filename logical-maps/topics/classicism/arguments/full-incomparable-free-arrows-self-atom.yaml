by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
date: '2026-10-25'
text: 'The proposition $\{k,k^{\prime}\}$ is a self-atom: its transport along $k$ is $\{m : m\circ k\in\{k,k^{\prime}\}\}$,
  which is $\{1\}$ since only the identity fixes $k$ and $k^{\prime}$ is not a left multiple of $k$, and
  likewise along $k^{\prime}$; at every other arrow it is false. It is not an atom, since $\{k\}$ lies
  strictly below it.'
