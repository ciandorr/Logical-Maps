id: intensional-choice-moved-instances
requires: [symmetric-domains, moved-instances]
choice: free
fails: [intensional-choice-r]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic),
  prompted by Cian Dorr
date: '2026-10-29'
text: >-
  At the type of the condition's $F$. Suppose $G\le F$ is necessarily uniquely instantiated. $G$ is in
  the domain, so it is symmetric and pinned down by a finite set $N$. Let $h$ be the arrow the condition
  gives for $N$ and $\{y\}$ the extension of $G$ at $h$; $y$ is in $F$'s extension at $h$, since $G\le
  F$. Let $g$ be the symmetry the condition gives, fixing $h(N)$ pointwise and moving $y$. Then $g\circ
  h$ agrees with $h$ on $N$, so by pinning $G$'s extension at $g\circ h$ is $\{y\}$, while by symmetry it
  contains $g\cdot y$. So $g\cdot y=y$, a contradiction. $\Box$Intensional Choice fails with it, by T.
  The condition collapse-onto-point is the case in which $h(N)$ is a single point outside $F$'s extension
  at $h$; with invertible arrows there are no collapses, but an arrow may still carry $N$ to a position
  where every instance of $F$ is moved by the symmetries fixing the image of $N$.
