id: nd-necessity-retractable-actual-pattern
requires:
- retractable-means-actual-pattern
holds:
- truths-are-nd-necessary
by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
date: '2026-10-14'
text: Let $p$ be true, pinned by $N$ (and symmetric, when there is a symmetry group), and let $N^\prime$
  be as in the condition. Let $q$ be the set of arrows that some arrow composes to agree with the identity
  on $N^\prime$; it is true, pinned by $N^\prime$, symmetric, and $\Diamond q=q$. By the condition every
  member of $q$ agrees on $N$ with a symmetry (or the identity), so lies in $p$ together with the identity.
  Hence $\Box(\Diamond q\to p)$ with $q$ true, i.e. $\Box_{\ne}p$.
