id: necessary-axiom-of-infinity-individuals
requires: [finite-extension-properties-everywhere, infinitely-many-individuals-everywhere]
choice: free
holds: [necessary-axiom-of-infinity-e]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
date: '2026-10-31'
text: >-
  In an action model a closed sentence holds at an arrow out of the evaluation object exactly when it
  holds at the identity arrow of the arrow's target, closed terms denoting entities that every arrow
  carries to the corresponding denotations at its target (in a one-world or Kripke-style model, the
  reachable objects are the worlds the evaluation point sees); so it suffices that the Axiom of Infinity at type $e$ holds at
  the identity arrow of every reachable object $v$. Fix such a $v$, and let $\Phi$ be the entity of type
  $(et)t$ in the domain at $v$ that holds there of exactly the properties with finite extension. The
  domain is closed under the operations defined by closed terms, so it contains $W:=\lambda Y^{(et)t}\,
  .\,\forall X^{et}\, .\,YX\to\Phi X$, which holds at $1_v$ of exactly the cardinalities holding there
  only of properties with finite extension. $W$ holds of $\mathbf 0_e$, which holds only of properties
  with empty extension. It passes from $Y$ to $\operatorname{Suc}_e Y$: if $\operatorname{Suc}_e Y$
  holds of $X$, then $Xy$ and $Y(\lambda u\, .\,Xu\land u\ne y)$ for some $y$, and since identity at
  $e$ is literal at $1_v$ the extension of $\lambda u\, .\,Xu\land u\ne y$ is that of $X$ less $y$,
  which is finite as $W$ holds of $Y$; so $X$ has finite extension. Hence every $Z$ that is a finite
  cardinality at $1_v$ falls under $W$, and does not hold of $\lambda u\, .\,\top$, whose extension, all
  the individuals at $v$, is infinite. The step from the domain's entity $\Phi$ is what rules out a
  nonstandard finite cardinality: without it the impredicative ancestral ranges only over the domain's
  properties of cardinalities, which need not include one that excludes the universal property. No
  choice is used: "finite" means in bijection with a natural number, and an infinite set need not be
  Dedekind infinite.
