id: necessary-axiom-of-infinity-propositions
requires: [finite-extension-properties-everywhere, infinitely-many-propositions-everywhere]
choice: free
holds: [necessary-axiom-of-infinity-t]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
date: '2026-10-31'
text: >-
  As for individuals (necessary-axiom-of-infinity-individuals), at type $t$. At the identity arrow of
  each reachable object $v$, with $\Phi$ of type $(tt)t$ holding there of exactly the properties of
  propositions with finite extension, $\lambda Y^{(tt)t}\, .\,\forall X^{tt}\, .\,YX\to\Phi X$ is in the
  domain, holds of $\mathbf 0_t$, and passes to successors, identity at $t$ being literal at $1_v$; so
  every finite cardinality holds only of properties with finite extension, and none holds of the
  universal property of propositions, whose extension is the infinite set of propositions at $v$. So the
  Axiom of Infinity at type $t$ holds at every reachable object, and its necessitation at the evaluation
  point.
