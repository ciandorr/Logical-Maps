id: necessary-potential-infinity-individuals
requires: [finite-extension-properties-everywhere, infinitely-many-individuals-eventually-everywhere]
choice: free
holds: [necessary-potential-infinity-e]
by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
date: '2026-11-24'
text: >-
  Let $v$ be an object reachable from the evaluation point, and $u$ an object with infinitely many
  individuals to which $v$ has an arrow. The Axiom of Infinity at type $e$ holds at the identity arrow
  of $u$, by the argument necessary-axiom-of-infinity-individuals at the reachable object $u$: the
  entity of type $(et)t$ holding of exactly the properties with finite extension there confines the
  finite cardinalities to such properties, and the universal property has infinite extension. A closed
  sentence holds at an arrow exactly when it holds at the identity arrow of the arrow's target, so the
  Axiom holds at the arrow from $v$ to $u$, and Possible Infinity (type $e$) holds at the identity
  arrow of $v$. Potential Infinity (type $e$) follows from it in C
  ([[possible-infinity-e-implies-potential-infinity-e]]), and the model is a model of C. So Potential
  Infinity holds at the identity arrow of every reachable object, and its necessitation at the evaluation
  point. No choice is used.
