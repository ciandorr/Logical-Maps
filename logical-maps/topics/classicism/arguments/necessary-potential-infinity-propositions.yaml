id: necessary-potential-infinity-propositions
requires: [finite-extension-properties-everywhere, infinitely-many-propositions-eventually-everywhere]
choice: free
holds: [necessary-potential-infinity-t]
by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
date: '2026-11-24'
text: >-
  As for individuals (the argument necessary-potential-infinity-individuals), at type $t$. Let $v$ be
  an object reachable from the evaluation point, and $u$ an object with infinitely many propositions to
  which $v$ has an arrow. The Axiom of Infinity at type $t$ holds at the identity arrow of $u$, by
  the argument necessary-axiom-of-infinity-propositions at the reachable object $u$; so it holds at the
  arrow from $v$ to $u$, and Possible Infinity (type $t$) holds at the identity arrow of $v$.
  Potential Infinity (type $t$) follows from it in C
  ([[possible-infinity-t-implies-potential-infinity-t]]), and the model is a model of C. So Potential
  Infinity holds at the identity arrow of every reachable object, and its necessitation at the evaluation
  point. No choice is used.
