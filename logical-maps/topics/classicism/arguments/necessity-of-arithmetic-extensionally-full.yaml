id: necessity-of-arithmetic-extensionally-full
requires: [extensionally-full]
choice: free
holds: [necessity-of-arithmetic]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
date: '2026-10-30'
text: >-
  At each type $\sigma$. At any object $v$ reachable from the evaluation point the numbers at $\sigma$
  are the numerals there, as in the argument arithmetic-necessitism-extensionally-full. If the numerals
  are pairwise distinct at $v$, as they are when $\sigma$ has infinitely many entities there, the $n$th
  being the cardinality of the properties with $n$ instances, then $\operatorname{Sum}_\sigma$ and
  $\operatorname{Prod}_\sigma$ are the least relations closed under their clauses, and by extensional
  fullness the relations whose extensions are the graphs of addition and multiplication on the numerals
  are present and closed under them, so the two are standard. So an arithmetical sentence $A$ at
  $\sigma$ has at $v$ its truth value in the standard model. If two numerals coincide at $v$, then
  $I^*_\sigma$ fails at $v$, since zero is a numeral other than every successor and successor is
  injective on the numerals only when they are pairwise distinct; and then $I_\sigma=\Diamond I^*_\sigma$
  is false at $v$ too, $I^*_\sigma$ being true if possible (Background, [[potential-infinity-forms]]). So
  $\Box(I_\sigma\to A)$ holds when $A$ is true in the standard model and $\Box(I_\sigma\to\neg A)$ when
  it is false. No choice is used.
revisions:
- date: '2026-11-24'
  by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
  note: >-
    The case of a type with finitely many entities at $v$ had argued that two numerals then coincide at
    every object $v$ sees, the type being finite at each by the condition finite-types-stay-finite. That
    needs a finite bound on those objects, not only that each is finite: in
    [[full-omega-chain-new-individuals]] every object has finitely many individuals and the numerals at
    type $e$ are pairwise distinct at each. The cases are now divided by whether the numerals are pairwise
    distinct at $v$, and the condition is no longer required: where they coincide $I^*_\sigma$ fails, and
    with it $I_\sigma$, which is Potential Infinity at $\sigma$.
