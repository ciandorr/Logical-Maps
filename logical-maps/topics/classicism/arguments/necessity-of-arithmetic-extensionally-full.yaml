id: necessity-of-arithmetic-extensionally-full
requires: [extensionally-full, finite-types-stay-finite]
choice: free
holds: [necessity-of-arithmetic]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
date: '2026-10-30'
text: >-
  At each type $\sigma$. At any object $v$ reachable from the evaluation point the numbers at $\sigma$
  are the numerals there, as in the argument arithmetic-necessitism-extensionally-full. If $\sigma$ has
  infinitely many entities at $v$, the numerals are pairwise distinct there, the $n$th being the
  cardinality of the properties with $n$ instances; $\operatorname{Sum}_\sigma$ and
  $\operatorname{Prod}_\sigma$ are the least relations closed under their clauses, and by extensional
  fullness the relations whose extensions are the graphs of addition and multiplication on the numerals
  are present and closed under them, so the two are standard. So an arithmetical sentence $A$ at
  $\sigma$ has at $v$ its truth value in the standard model. If $\sigma$ has finitely many entities at
  $v$, it has finitely many at every object $v$ sees, by the condition, so two numerals coincide and
  $I^*_\sigma$ fails at each of them: $I_\sigma=\Diamond I^*_\sigma$ is false at $v$. So
  $\Box(I_\sigma\to A)$ holds when $A$ is true in the standard model and $\Box(I_\sigma\to\neg A)$ when
  it is false. No choice is used.
