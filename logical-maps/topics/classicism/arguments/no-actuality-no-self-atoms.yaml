id: no-actuality-no-self-atoms
requires:
- no-actuality-anywhere
holds:
- necessary-self-atoms-are-atoms-r
- necessary-self-atoms-are-strong-atoms-r
fails:
- self-atomicity-t
choice: free
by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
date: '2026-10-25'
text: 'A self-atom of any relational type at an object $W$ is instantiated at some arrow $k$ out of $W$,
  and its transport along $k$ is an atom at $k$’s target instantiated at the identity there. The existential
  projection of an atom $I$ of a relational type, the proposition $\exists\bar x\, .\,I\bar x$, is an
  atom of type $t$: it is in the domain, it is not bottom, and for any proposition $p$ the entity $I\land\lambda\bar
  x\, .\,p$ lies below the atom $I$, so is $I$ or bottom, which puts $p$ above the projection or disjoint
  from it. So the projection is a true atom at $k$’s target, which the condition excludes. Hence no reachable
  object has a self-atom, and Self-atoms are atoms and Self-atoms are strong atoms hold vacuously at
  every type and every reachable object, while Self-Atomicity (type t) fails at the evaluation point,
  the top proposition having no self-atom below it.'
