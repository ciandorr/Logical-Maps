date: '2026-10-02'
text: >-
  No two individuals are distinct, and the numeral $\operatorname{Suc}_e\mathbf{0}_e$ holds of the
  universal property at type $e$ at every world. And the numeral
  $\operatorname{Suc}_e\operatorname{Suc}_e\mathbf{0}_e$, a finite cardinality, holds of no property at any
  world, a property it holds of having two distinct instances; so Potential Infinity (type $e$) fails.
