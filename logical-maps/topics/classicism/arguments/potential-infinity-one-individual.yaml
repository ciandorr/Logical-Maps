id: potential-infinity-one-individual
requires: [one-individual]
choice: free
fails: [potential-infinity-e]
by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
date: '2026-11-24'
text: >-
  The numeral $\operatorname{Suc}_e\operatorname{Suc}_e\mathbf{0}_e$, a finite cardinality, holds of no property
  at any world: a property it holds of has two distinct instances, and no two individuals are distinct. So
  Potential Infinity (type $e$) fails, at that number. This is the strongest of the failures of infinity at
  type $e$ in such a model, the Axiom of Infinity and Possible Infinity each implying Potential Infinity.
