- id: pure-sentences-possible
  requires: [complete-components]
  fails: [necessary-vicinity, necessary-weakly-inextensible-comprehension-r]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: >-
    The components are complete for C and a closed pure sentence at the distinguished arrow into a
    component has its truth value at that component root, so every pure sentence consistent with C
    is possible at the root; the negation of Vicinity is consistent (the truncation model) and so is
    the negation of a closed instance of Weakly Inextensible Comprehension at type $t\to t$ (the
    permutation model). Since □Actuality fails here while Vicinity and Weakly Inextensible
    Comprehension hold, the boxed results show that at least one of the boxed principles had to
    fail.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
