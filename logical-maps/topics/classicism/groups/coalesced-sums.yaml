  text: >-
    The negations of the Axioms of Infinity at types $e$ and $t$ are closed pure sentences consistent
    with C: both hold in the full model with one world, one individual and two propositions, where a
    numeral holds of the universal property at each type. So they are possible at the root
    (pure-sentences-possible), and the boxed Axioms fail there.
  lean:
