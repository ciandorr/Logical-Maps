- id: substitution-root-infinity-and-countable-completeness
  requires: [pinned-substitution-root]
  holds: [axiom-of-infinity-e]
  fails: [countable-boolean-completeness-r]
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts
  date: '2026-10-30'
  choice: free
  text: >-
    The root is extensionally full at its identity: any set of tuples there is the extension of the
    entity with that value at every map of the constants and $\bot$ at every arrow into a component,
    pinned down by $\emptyset$ and landing; and quantifiers at the identity range over the root
    domains. So the argument infinitely-many-individuals applies at the root alone: the property of
    cardinalities true of $Z$ exactly when every property $Z$ holds of has a finite extension contains
    $\mathbf 0_e$ and is closed under successor, so every finite cardinality has it, and none holds of
    the universal property, the individuals being the infinitely many individual constants. For the
    same reason the numbers at $e$ at the root are the numerals. Countable Boolean Completeness fails
    at type $t$ by the argument parity-family of coalesced-pinned-interpretations-root, which uses only
    arrows $\langle V,I\rangle$ into one component object and interpretations differing at fresh
    propositional constants; the property $Y$ is now given the value $\{a_n:n\text{ even}\}$ at every
    map and $\emptyset$ at the arrows into components, pinned down by $\emptyset$. The family is
    countable at the root: the relation whose extension at the identity pairs $a_{2k}$ with the numeral
    $\mathbf k_e$ is in the domain, by extensional fullness at the identity, and is an injection into
    the numbers at $e$. So the countable property $Y$ has no least upper bound.

- id: root-only-sentence-pure-b
