  date: '2026-10-30'
  choice: free
  text: >-
    Let $B$ be the sentence of the condition. The worlds seen from a world of a component are worlds
    of that component, where $B$ is false, so $\Diamond B$ fails at every such world; some such world
    is seen from the root, where $B$ is true. So the B instance $B\to\Box\Diamond B$ fails at the
    root.

- id: root-only-sentence-signature
  requires: [root-only-sentence, pinned-substitution-root]
  fails: [witnessed-possibility-r, separated-structure-r]
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts
  date: '2026-10-30'
  choice: free
  text: >-
    Let $B$ be the sentence of the condition, $c$ a relational constant of $\Sigma$, of type
    $\tau=\bar\sigma t$ (for $\tau=t$ read $\exists\bar y\,.\,x\bar y$ below as $x$), and
    $P(x):=B\land\exists\bar y\,.\,x\bar y$, a pure formula. At the root $\exists x\,.\,P(x)$
    holds, witnessed by $\top_\tau$. But $P(\hat c)$ holds at no arrow out of the root: at an arrow
    into a component $B$ is false, and at an arrow into the root (the identity, or a map $f$, which
    carries $\hat c$ to $\widehat{f(c)}$) the entity is a $\hat d$, whose extension at the identity is
    empty. So $\Diamond P(\hat c)$ fails and Witnessed Possibility fails. Separated Structure: with
    the closed pure terms $F:=\lambda x^\tau\,.\,P(x)$ and $G:=\lambda x^\tau\,.\,\bot$, the
    proposition $Fc$ is true at no arrow out of the root, so $Fc=Gc$, while $F\ne G$, $F$ holding of
    $\top_\tau$ at the identity.

- id: substitution-root-independence
  requires: [pinned-substitution-root]
  holds: [independence-signature-r]
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts
  date: '2026-10-30'
  choice: free
  text: >-
    For an individual constant $c$ the instance is vacuous, no term $A\,\bar d$ being of type $e$.
    Let $c$ be relational, of type $\tau$, and $A$ closed and pure, $\bar d$ constants other than
    $c$ ($n\ge0$). $A\,\bar{\hat d}$ is pinned down by $\bar d$, the denotation of a closed pure
    term being pinned down by $\emptyset$. Fix an object $V$ of a component and an interpretation $I$,
    and let $I^{\prime}$ and $I^{\prime\prime}$ agree with $I$ except that they send $c$ to $\top_\tau$ and
    to $\bot_\tau$. Then $A\,\bar{\hat d}$ has the same value at $\langle V,I^{\prime}\rangle$ and
    $\langle V,I^{\prime\prime}\rangle$, while $\hat c$ has there the extensions at $1_V$ of $\top_\tau$ and
    $\bot_\tau$, which differ, every domain being nonempty. So $\hat c\ne A\,\bar{\hat d}$.
