- id: barcan-t-component
  requires: [complete-components, distinguished-arrows, fullest-domains]
  fails: [barcan-t]
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    C is complete for the component set, so some component $M$ refutes BF at its root $M_0$, at type
    $t$ say: some $F$ in $M_0$’s domain has $\forall y\, .\,\Box Fy$ true and $\Diamond\exists y\,
    .\,\neg Fy$ true at $M_0$. Because the root’s domains are as full as possible, the thread
    $F^{\prime}$ that is universal at the root and in every other component and is carried onto $F$
    by the distinguished arrow to $M_0$ is in the root domain. Every arrow from the root into $M$
    factors through that distinguished arrow, so $\forall y\, .\,\Box F^{\prime}y$ at the root
    reduces to $\forall y\, .\,\Box Fy$ at $M_0$ together with trivial checks elsewhere, and
    $\Diamond\exists y\, .\,\neg F^{\prime}y$ at the root follows from $\Diamond\exists y\, .\,\neg
    Fy$ at $M_0$ through the same factorization.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: The three members' verbatim copies stated once.
  - date: '2026-10-31'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: >-
      Condition fullest-domains added to the requirements: the argument builds root entities whose
      parts in the components are chosen freely, which needs the root domains to be the fullest.
      Every member with distinguished arrows has them, so no member's verdicts change.
  lean:
  - fails: barcan-t
    ref: Classicism.Map.Arguments.coalesced_sums.barcan_t_component.barcan_t

- id: atomicity-t-component
  requires: [complete-components, distinguished-arrows, fullest-domains]
  fails: [atomicity-t]
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    C is complete for the components, so some component $M$ refutes Atomicity at its root, by a
    proposition $p_M$ with no atom below it in $M$’s domain; the root proposition that is $p_M$ on
