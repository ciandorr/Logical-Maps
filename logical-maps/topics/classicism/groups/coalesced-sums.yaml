id: coalesced-sums
name: 'Coalesced sums at a new root'
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: Appendix E, Definition E.2, pp. 80–83; Theorem 3.26, §3.6, pp. 62–64

# Models evaluated at a new root added to a family of component models (Classicism, Appendix E).
# Three members coalesce a family of action models complete for C, so every pure sentence
# consistent with C is possible at the root and every component's failures transfer to it; the
# fourth coalesces the full Henkin models on finite individual domains. Each member keeps its own
# file, id and the arguments that are its alone. Built on 2 October 2026 by Claude Opus 5.5 at
# Cian Dorr's direction; texts are the members' unless a revision says otherwise. The
# interpretation of Σ is part of these constructions, so nothing is generated.
#
# Revised 19 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): the parameter `root-arrows`
# added for coalesced-pinned-interpretations-root, whose root has an arrow into every object of every
# component for every interpretation of a signature, and whose root domains are finitely pinned. The
# shared arguments that carry a component's counterexample to the root through the distinguished
# arrow now apply only at `root-arrows: distinguished`.

definition: >-
  {{construction}}


  {{root-arrows}}


  {{domains}}

parameters:
  root-arrows:
    text: How the root's arrows reach the components.
    values:
      distinguished:
        text: >-
          The root has one distinguished arrow to the root of each component, and every arrow from
          the root into a component factors through it.
        label: distinguished arrows
        meets:
          distinguished-arrows: This is the construction.
          actual-world-isolated: >-
            The singleton root proposition, true at the root's identity arrow and nowhere in a
            component, is in the domain and entails every truth; the components have no arrows back
            to the root (Classicism, Appendix E, p. 83, on the distinctness-preserving collapse).
      interpretations:
        text: >-
          The root has an arrow to every object of every component, one for each interpretation there
          of a fixed signature, and the root's individuals are that signature's individual constants.
        label: interpretation arrows
        meets:
          actual-world-isolated: >-
            The singleton root proposition, true at the root's identity arrow and nowhere in a
            component, is in the domain and entails every truth; the components have no arrows back
            to the root (Classicism, Appendix E, p. 83, on the distinctness-preserving collapse).
      interpretations-and-substitutions:
        text: >-
          As for interpretation arrows, and the root has besides an arrow to itself for every
          type-preserving map of the signature's constants to themselves, acting on the root's
          individuals and composing with the interpretation arrows by precomposition.
        label: interpretation and substitution arrows
  construction:
    text: The components, how their individuals and constants meet at the root, and the evaluation
      point, as the member's source gives them.
  domains:
    text: What the root's domains contain.
    values:
      fullest:
        text: >-
          Root domains are as full as compatibility allows: a root proposition is a choice, for each
          component, of a proposition of that component’s root domain, together with a truth value at
          the root’s identity arrow, and a root entity of a relational type is likewise a family of
          component entities with a root component that is an arbitrary function of the root
          arguments.
        meets:
          fullest-domains: This is the value.
  sigma:
    text: >-
      The interpretation of Σ, as each member's construction or definition fixes it. Nothing is
      generated: the interpretation is part of the construction.
    values:
      top:
        text: >-
          Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
          denotes the top element of its type.
        label: Σ top
        brief: every constant of Σ denotes the top element of its type
        meets:
          sigma-top: This is the interpretation.
      construction:
        text: The interpretation of Σ that the member's construction gives.
        label: Σ as constructed
        brief: Σ as the construction interprets it

# The construction in Lean (Coalesced/SumData.lean): the data of a coalesced sum that is a model,
# for any root arrows (distinguished, interpretation or substitution arrows) and any root domains
# (fullest, pinned, definable): the components, the root arrows, the root action and inclusion, the
# root values of the constants. A member gives its data as lean.param. The shared arguments proved
# in Lean are theorems over every such datum meeting their conditions.
lean:
  binder: '(D : Classicism.Meta.Coalesced.SumData)'
  var: D
  model: Classicism.Meta.Coalesced.SumData.model {param}
  is_model: Classicism.Meta.Coalesced.SumData.isModel {param}

# Conditions of the topic that every member meets.

conditions:
- id: complete-components
  text: >-
    The components are a family of action models complete for C: every sentence consistent with C
    is true at the root of some component.
  lean: Classicism.Meta.Coalesced.SumData.CompleteComponents
- id: distinguished-arrows
  text: >-
    Every arrow from the root into a component factors through a single distinguished arrow to
    that component's root.
  lean: Classicism.Meta.Coalesced.SumData.DistinguishedArrows
- id: free-root-component
  text: >-
    A root entity of a relational type has a root component that is an arbitrary function of the
    root arguments.
  lean: Classicism.Meta.Coalesced.SumData.FreeRootComponent
- id: fullest-domains
  text: >-
    The root domains are the fullest: every intension at the root whose transport along every root
    arrow lies in the component's domain is a root entity.
  lean: Classicism.Meta.Coalesced.SumData.FullestDomains
- id: pinned-substitution-root
  text: >-
    The root is built as in coalesced-pinned-substitutions-root: its arrows are the interpretation
    arrows $\langle V,I\rangle$ into every object of every component and the maps of the constants of
    $\Sigma^+$; its entities are the intensions pinned down by a finite set of constants whose
    transports land in the component domains; and each constant $c$ of $\Sigma$ denotes $\hat c$,
    with transport $I(c)$ along $\langle V,I\rangle$ and empty extension at every map.
- id: root-only-sentence
  text: >-
    Some closed pure sentence $B$ is true at the root and false at every object of every component,
    so that $B$ holds at an arrow out of the root exactly when its target is the root.

arguments:
- id: tame-rigidity-component
  requires: [complete-components, free-root-component, distinguished-arrows, fullest-domains]
  fails: [tame-rigidity-r]
  by: Claude Fable 5.1 (Anthropic), answering Cian Dorr's conjecture
  date: '2026-10-03'
  text: >-
    Tame Rigidity fails at a relational argument type in models of C (ultralimit-fork,
    symmetric-qualitative-links), so some component $M$ refutes it at its root $M_0$: some $F_M$
    of type $\sigma\to t$, $\sigma$ relational, is weakly rigid there but not rigid. A root entity
    $F$ of that type is a root extension $F_o$ together with a component $F_N$ in each component
    $N$, and a formula about $F$ at a world of $N$ is the same formula about $F_N$ in $N$. Since
    the components of root entities are arbitrary, $F$ is weakly inextensible at the root exactly
    when, for every $N$, every $X_N$ that necessarily holds of the $N$-components of the members of
    $F_o$ has $F_N\le X_N$. For each other component $N$ fix $z_N$, and for each $y$ in the
    extension of $F_M$ at $M_0$ let $x_y$ be the root entity with $M$-component $y$ and
    $N$-components $z_N$, free at the root by the condition. Put $F_o:=\{x_y\}$, $F_N:=\lambda
    y\, .\,y=z_N$, a haecceity, rigid in every model of C, and keep $F_M$. Then $F$ is persistent
    and weakly inextensible at the root, each component's condition being the weak
    inextensibility of its own component, but not inextensible, since $F_M$ is not inextensible in
    $M$ and every arrow from the root into $M$ factors through the distinguished one. So Tame
    Rigidity fails at the root.
  revisions:
  - date: '2026-10-03'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      One direction of Fable's transfer theorem: at a coalesced root, Tame Rigidity at a
      relational type holds iff it holds at the root of every component. The other direction is
      not recorded, the engine deriving the positive verdict in the one model where it applies.
  - date: '2026-10-31'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: >-
      Condition fullest-domains added to the requirements: the argument builds root entities whose
      parts in the components are chosen freely, which needs the root domains to be the fullest.
      Every member with distinguished arrows has them, so no member's verdicts change.


- id: rigid-power-component
  requires: [complete-components, free-root-component, distinguished-arrows, fullest-domains]
  fails: [rigid-power-r]
  by: GPT-6 Astra (OpenAI), at Cian Dorr's request; checked and recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-11'
  text: >-
    The transfer of tame-rigidity-component, applied to a rigid relation whose power property is not
    rigid. The pure sentence $\exists A^{tt}\, .\,\operatorname{Rigid}(A)\land\neg\operatorname{Rigid}
    (\lambda X\, .\,\operatorname{Rigid}(X)\land X\le A)$ is consistent with C (it holds in the
    one-individual variants of finite-support-pair-injections-or-collapses and symmetric-collapse-pair,
    with $A:=\top$), so some component $m$ satisfies it at its root, with witness $A$. Its extension $D$
    there is nonempty: otherwise weak inextensibility tested on $\bot$ makes $A=\bot$, whose power
    property is the haecceity of $\bot$, which is rigid.

    For $p\in D$ let $\widehat p$ be the root proposition false at the root, with $m$-component $p$ and
    $\bot$ in every other component; let $F$ have root extension $\{\widehat p:p\in D\}$, $m$-component
    $A$, and in each other component $i$ the haecceity of $\bot$. Both are in the domain, the root
    domains being fullest. $F$ is weakly persistent at the root, $A$ and the haecceities being
    persistent. It is weakly inextensible there: if $H$ necessarily holds of every $\widehat p$, its
    root extension contains them, $A\le H_m$ by the weak inextensibility of $A$, and the haecceity of
    $\bot$ entails $H_i$; entailment in the sum is componentwise. Every other accessible world lies in a
    component, where $F$'s components are rigid; so $F$ is rigid. The $m$-component of its power
    property is that of $A$, transport respecting abstraction, rigidity and entailment, and every arrow
    into $m$ factors through the distinguished one; so it is not rigid. Rigid Power fails at the root,
    at type $t\to t$.
  revisions:
  - date: '2026-10-31'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: >-
      Condition fullest-domains added to the requirements: the argument builds root entities whose
      parts in the components are chosen freely, which needs the root domains to be the fullest.
      Every member with distinguished arrows has them, so no member's verdicts change.

- id: intensional-choice-component
  requires: [complete-components, distinguished-arrows, fullest-domains]
  fails: [intensional-choice-r]
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, at Cian Dorr's suggestion
  date: '2026-10-03'
  text: >-
    The type-$e$ instance of Intensional Choice fails in a model of C (symmetric-all-surjections),
    so its negation is consistent with C and some component $M$ refutes it at its root $M_0$: some
    $F$ in $M_0$'s domain is necessarily instantiated and no $G\le F$ there is necessarily uniquely
    instantiated. As in barcan-t-component, the thread $F^{\prime}$ that is universal at the root and in
    every other component and is carried onto $F$ by the distinguished arrow to $M_0$ is in the root
    domain, and it is necessarily instantiated. A root $G\le F^{\prime}$ that is necessarily uniquely
    instantiated would be carried onto such a $G$ for $F$ at $M_0$, every arrow from the root into $M$
    factoring through the distinguished one. So the unboxed principle fails at the root.
  revisions:
  - date: '2026-10-31'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: >-
      Condition fullest-domains added to the requirements: the argument builds root entities whose
      parts in the components are chosen freely, which needs the root domains to be the fullest.
      Every member with distinguished arrows has them, so no member's verdicts change.
  lean:
  - fails: intensional-choice-r
    ref: Classicism.Map.Arguments.coalesced_sums.intensional_choice_component.intensional_choice_r


- id: relational-choice-free-root
  requires: [free-root-component]
  choice: uses
  holds: [relational-choice-r]
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    The functionality of a subrelation is evaluated at the root’s identity arrow only, while the
    subrelation condition is boxed; so for a serial root relation take the subrelation whose root
    component is a functional choice from the root component, by choice in the metatheory, and whose
    component parts are empty. Where some component refutes Relational Choice at its root, as when
    the components are complete for C, its necessitation fails.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      The three complete members' copies stated once; "Its necessitation fails, since some
      component refutes Relational Choice at its root" became conditional on that, since in the
      all-finite-domains member every component satisfies Relational Choice.
  lean:
  - holds: relational-choice-r
    ref: Classicism.Map.Arguments.coalesced_sums.relational_choice_free_root.relational_choice_r


- id: actuality-singleton-root
