- id: arithmetic-necessitism-complete-components
  requires: [complete-components]
  holds: [arithmetic-necessitism]
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  choice: free
  text: >-
    Vacuously, at every type $\sigma$. The negation of $I^*_\sigma$, that zero is a successor or
    successor is not injective on the numbers at $\sigma$, is a pure sentence consistent with C: it
    holds in the full model with one world, one individual and two propositions, where every type is
    finite and the finite cardinalities beyond the size of the type coincide. So it is possible at
    the root (pure-sentences-possible), the antecedent $\Box I^*_\sigma$ fails there, and the
    instance of Arithmetic Necessitism at $\sigma$ is true.
  lean:
  - holds: arithmetic-necessitism
    ref: Classicism.Map.Arguments.coalesced_sums.arithmetic_necessitism_complete_components.arithmetic_necessitism
- id: necessary-axiom-of-infinity-complete-components
  requires: [complete-components]
  fails: [necessary-axiom-of-infinity-e, necessary-axiom-of-infinity-t]
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
