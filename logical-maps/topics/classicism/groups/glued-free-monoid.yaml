id: glued-free-monoid
name: 'Full action models with constants glued at free-monoid sites'
references:
- paper: bacon-2020
  role: origin
  locator: Appendix A.2–A.3, pp. 580–587
  note: The construction, and its claimed validation of Logical Necessity.

# Bacon's models of Logical Necessity: full action models over the free monoid on countably many
# generators in which the constants of Σ are glued, so that the construction itself interprets Σ.
# Moved out of full-action-models on 3 October 2026 by Claude Opus 5.5, at Cian Dorr's direction:
# their Σ cannot be exchanged for another, so they have no Σ variants, and they are the only full
# action models with Logical Necessity. The members differ in their individuals. What they share
# as full action models (the group's `meets`, as in full-action-models) brings the topic's general
# arguments; texts are the members'.
#
# Revised 29 October 2026 (Claude Opus 5.5, prompted by Cian Dorr): full-double-retraction-glued-constants
# and full-free-product-glued-constants, whose categories adjoin a free monoid of sites to other arrows
# and glue Σ at the sites in the same way, joined as members; the group's name now says sites, and its
# conditions that are particular to the free monoid (countably-many-arrows, unretracted-arrow,
# infinitely-many-propositions) moved, their texts unchanged, to its two original members.

definition: >-
  {{construction}}


  The constants of Σ are glued as in the construction above.

parameters:
  construction:
    text: The individuals and the gluing, as the member's write-up gives them.

# The construction in Lean (Models/GluedFreeMonoid.lean): the glued premodel of a GluedData, a
# category with a base object, the individuals, sites at the base, a signature and the constants'
# values at each site, the constants glued at the sites (Semantics/Glued.lean). A member gives its
# data as lean.param. Added 1 November 2026 by Claude Opus 5.5, at Cian Dorr's direction.
lean:
  binder: '(D : Classicism.Meta.Intensional.GluedData)'
  var: D
  model: Classicism.Meta.Intensional.GluedData.model {param}
  is_model: Classicism.Meta.Intensional.GluedData.isModel {param}
  meets:
    full-model: Classicism.Meta.Intensional.GluedData.full {param}
    full-action-model: Classicism.Meta.Intensional.GluedData.full {param}
    extensionally-full: Classicism.Meta.Intensional.Premodel.Full.extFull _ (Classicism.Meta.Intensional.GluedData.full
      {param})

meets:
  codomain-intensions: >-
    The domains are full at every object.
  finite-extension-properties-everywhere: >-
    The domains are full at every object, so they contain the haecceities, making identity literal,
    and an intension with any given extension at each identity arrow.
  infinitely-many-propositions-everywhere:
    requires: [one-object-action-model, infinitely-many-propositions]
    text: The evaluation object is the only object.
  full-model: >-
    Every intension of every relational type is present at every object (Classicism, §3.5,
    p. 59).
  full-action-model: >-
    An action model, full at every object (Classicism, §3.5, p. 59; Appendix D).
  extensionally-full: >-
    A full model contains every intension, so in particular one with any given extension at the
    identity.
  actuality-contingent: >-
    The singleton $a$ of the identity arrow is in the domain, the model being full. It is necessary
    at no world: a world other than the identity sees itself, which lies outside $a$, and the
    identity sees an arrow other than itself. And a non-identity arrow $k$ does not fix it, since
    $1\in k\cdot a$ would need $1\circ k=1$.

arguments: []
