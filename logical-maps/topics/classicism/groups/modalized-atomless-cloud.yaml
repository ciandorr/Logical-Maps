id: modalized-atomless-cloud
name: 'Modalized domains: atomless cloud'
definition: Work in ZFC. {{family}} Take the disjoint union of the nonzero parts of these complete Boolean
  algebras, with refinement given by their Boolean orders, and adjoin a refinement-isolated root r. The
  root sees every point and each cloud point sees its refinements. Use the full modalized-domain model
  of Definitions 2.1–2.10 and 4.1, with constant individual domain ω and literal individual identity.
  At t use all regular-open propositions; at function types use the full underlying function sets with
  the partial equivalence relations of Definition 2.2. Quantification uses existing entities at all refinements,
  as in §2.3. Evaluate at r. Interpret any relational signature constants as top; no signature verdict
  is recorded.
parameters:
  family:
    text: A nonempty family of nontrivial complete Boolean algebras, containing an atomless factor.
references:
- paper: bacon-modalized-domains-2026
  role: proof
  locator: Definitions 2.1–2.10 and 4.1; Theorem 4.4
arguments:
- id: self-atoms
  holds:
  - necessary-self-atomicity-r
  fails:
  - self-atoms-are-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'At a cloud point $t$ every proposition is identical to $\top$ or to $\bot$ (Remark 4.6(iv)),
    and Atom $q$ holds at $t$ exactly when $q$ holds at $t$: if $t\in q$, then at every refinement $t^{\prime}$
    a $z\le q$ is distinct from $q$ there iff $z$ is bottom there; if $t\notin q$, some refinement has
    $q=\bot$, where Atom $q$ fails, and holding persists. So a proposition not containing the root is
    a self-atom at the root whenever it is nonzero, and $\{r\}$ is an atom; every possible proposition
    has one of these below it, and Self-Atomicity (type t) holds at the root. At relational types, a possible
    $X$ at any point has, by no new entities (Lemma 4.3), an actual tuple $\bar x$ with $X\bar x$ possible;
    $Y:=\lambda\bar y\, .\,\bar y=\bar x\land X\bar x$ lies below $X$, is possible, and has at most one
    instance at every point, which at a cloud point where it is instantiated makes it an atom there (its
    parts are $\{\bar x\}$ cut down by propositions, and such a part differs from $Y$ at a refinement
    exactly when it is bottom there); so $Y$ is a self-atom. At cloud points every possible $X$ likewise
    has such a $Y$ below it, so Self-Atomicity holds at every point and every type. Self-atoms are atoms
    (type t) fails at the root: the set of points of an atomless component is a self-atom, and by Theorem
    4.4(d) no atom lies below it.'
- text: The frame is a world–cloud frame. At transparent cloud points every relation is rigid. At the
    isolated root, the check-closure of an actual extension is a coextensive rigid relation (Definition
    3.11 and Theorem 3.12). Thus RC holds at every point, and each boxed instance is valid.
  source:
    paper: bacon-modalized-domains-2026
    locator: Theorem 3.12, pp. 17–18; Theorem 4.4(b), p. 21
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  holds:
  - necessary-rigid-comprehension-r
  id: rigid-comprehension
- text: Theorem 3.14 selects witnesses on a maximal antichain of decided cloud pieces and mixes their
    identity profiles. At a world, choose one actual witness; the world part and the cloud mixture together
    form a necessarily uniquely instantiated subrelation of the given necessarily instantiated relation.
    Hence IC and its necessitation are valid. The proof uses ZFC.
  source:
    paper: bacon-modalized-domains-2026
    locator: Theorem 3.14, pp. 18–19; Theorem 4.4(b), p. 21
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  holds:
  - necessary-intensional-choice-r
  id: intensional-choice
- text: 'Lemma 4.3 proves no new entities at any type: at a cloud point x a relation can be cut down to
    the regular-open closure of the principal downset of x, yielding an entity existing at the root and
    identical to the original at x. Proposition 3.16 therefore gives BF and □BF at every type. This uses
    the paper’s variable-domain quantifiers, not a fixed-domain meet calculation.'
  source:
    paper: bacon-modalized-domains-2026
    locator: Lemma 4.3 and Theorem 4.4(b), pp. 20–21
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  holds:
  - necessary-barcan-r
  id: barcan
- text: The component proposition for an atomless factor is nonzero. At the root, propositional identity
    is literal and entailment is inclusion, so its lower interval is the atomless factor algebra. It therefore
    has no propositional atom below it.
  source:
    paper: bacon-modalized-domains-2026
    locator: Theorem 4.4(d), p. 21
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  fails:
  - atomicity-t
  id: non-atomicity
- text: The top proposition S and the cloud S minus {r} are distinct at the root, but identical at every
    cloud point. They witness failure of ND at type t.
  source:
    paper: bacon-modalized-domains-2026
    locator: Theorem 4.4(c), p. 21
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  fails:
  - distinctness-necessary-t
  id: distinctness
