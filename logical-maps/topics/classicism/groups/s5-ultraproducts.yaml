id: s5-ultraproducts
name: 'Ultraproducts of full S5 models'
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61
  note: Full action models; the factors are full S5 models.

# GPT-6 Astra's ultraproducts (prompted by Daniel Kodsi, research note of 23 October 2026): an
# ultraproduct over a nonprincipal ultrafilter of full S5 models with n individuals, n = 1, 2, ..., a
# Henkin structure that is not full, separating the Infinity Schemata from the Axioms of Infinity.
# Formed on 29 October 2026 by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, from
# ultraproduct-finite-full-s5 and ultraproduct-countable-full-s5-finite-individuals, whose transfer
# argument and type-e Infinity arguments are the group's.

definition: >-
  For $n\ge1$ let $M_n$ be {{factors}}: the full action model on a category in which there is exactly one
  arrow between any two objects, with the same $n$ individuals at every object, fixed by every arrow,
  evaluated at one object. Regard each $M_n$ as a many-sorted first-order structure, with a sort for each
  type, application, the logical constants, the constants of Σ, and a predicate $T$ on the sort of $t$ for
  truth at the evaluation object. Let $U$ be a nonprincipal ultrafilter on the positive integers, and
  $M:=\prod_nM_n/U$, the evaluation point being the class of the factors' evaluation objects. By Łoś's
  theorem a first-order sentence holds in $M$ iff it holds in $M_n$ for $U$-many $n$. $M$ is a Henkin model
  of C, and a sentence of the object language is true in $M$ iff it is true in $U$-many $M_n$ (see the
  write-up). It is not full.


  Interpretation of Σ, fixed for these records: every constant of Σ is relational, and each denotes the top
  element of its type in every factor, hence in $M$.

parameters:
  factors:
    text: The factors' worlds, as the member gives them.
    values:
      finite-worlds:
        text: the full S5 model with $n$ worlds and $n$ individuals
        label: n worlds
      countable-worlds:
        text: the full S5 model with the worlds $\mathbb N$ and $n$ individuals
        label: countably many worlds

meets:
  sigma-top: This is the interpretation the definition fixes.

arguments:

- id: transfer
  holds: [necessary-functional-choice-r, necessary-intensional-choice-r, necessary-barcan-r,
    necessary-distinctness-necessary-r, necessary-atomicity-r, necessary-actuality,
    necessary-rigid-comprehension-r, necessary-strong-atomicity-r, necessary-well-ordering-r,
    no-pure-contingency-r]
  choice: uses
  writeup: ultraproduct-finite-full-s5
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi; checked and recorded by Claude Opus 5.5 (Anthropic),
    prompted by Cian Dorr
  date: '2026-10-25'
  text: >-
    Each instance of each of these schemata is a sentence true in every factor, so true in $M$. The full
    domains contain every function, which gives the choice principles, Rigid Comprehension and
    Well-Ordering; constant domains give BF; identity is crisp, which gives ND; the algebras are atomic, the
    worlds being the atoms and every true proposition entailed by the actual one; and any two worlds are
    related by an automorphism, so a true pure sentence is necessary. All of this holds at every world.

- id: infinity-e
  holds: [infinity-e]
  choice: free
  writeup: ultraproduct-finite-full-s5
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi; checked and recorded by Claude Opus 5.5 (Anthropic),
    prompted by Cian Dorr
  date: '2026-10-25'
  text: >-
    The instance of the Infinity Schema (type $e$) asking for $k$ distinct individuals holds in $M_n$ for
    $n\ge k$, a cofinite set of $n$, hence in $U$.

- id: possible-infinity-e
  fails: [possible-infinity-e]
  choice: free
  writeup: ultraproduct-finite-full-s5
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi; checked and recorded by Claude Opus 5.5 (Anthropic),
    prompted by Cian Dorr
  date: '2026-10-25'
  text: >-
    In $M_n$, at every world, the domains being full, the finite cardinalities are the standard ones, and
    the $n$-th counts the universal property of individuals. So $\Box\exists Z\,
    .\,\operatorname{FiniteCardinality}_e(Z)\land Z(\lambda u\, .\,\top)$ is true in every factor, hence in
    $M$, where the witnessing cardinality is nonstandard.
