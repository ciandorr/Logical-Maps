id: supported-s5-components
name: 'Supported models over an S5 component'
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74; Appendix E, Definition E.2, pp. 80–83
  note: Action models; the unrestricted root is attached as in the coalesced sums.

# Action models in which the domains are cut down by finite support under a group that acts on the
# model without being part of its category: the symmetries change no accessibility. Formed on 29 October
# 2026 by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, from Cian Dorr's reformulation as an
# action model of GPT-6 Astra's finite-support Boolean-valued construction (prompted by Daniel Kodsi,
# note of 25 October 2026, item 20 of Kodsi's pull request #18). The same device, a group acting on the
# individuals but not in the category, is used by absorbing-entrance-swappable-pairs; a generalization
# to categories the group acts on without moving objects would bring it in.

definition: >-
  Fix a set $W$ of worlds, a set $D$ of individuals, a group $G$ acting on $W$ and on $D$, and a set $X$
  of support points on which $G$ acts. {{component}} The component is the action model on the category
  with object set $W$ and exactly one arrow between any two objects, every arrow acting on $D$ as the
  identity. Transport between its objects is then trivial, so an entity of relational type
  $\bar\sigma t$ there is a relation $F\subseteq D_{\bar\sigma}\times W$, giving its extension at each
  world, and the same entities are available at every world. $G$ acts on these relations by $g\cdot
  F:=\{(g\bar x,gw):(\bar x,w)\in F\}$, its action on the argument entities being defined in the same way
  by recursion on their types. $F$ is supported by a finite $P\subseteq X$ if $g\cdot F=F$ for every $g$
  fixing $P$ pointwise. The component's domains hold the supported relations satisfying the member's
  further restriction, if any. Identity is genuine identity, transports being bijective. {{root}} Every
  constant of Σ is relational and denotes the top element of its type.

parameters:
  component:
    text: The worlds, individuals, group, support points and any further restriction on the component's
      domains, as the member gives them.
  root:
    text: Whether an unrestricted root is attached in front of the component.
    values:
      none:
        text: 'The evaluation point is a world of the component.'
        label: no root
        brief: evaluation at a world of the component
      free:
        text: >-
          A root object $r$ is added, with one arrow to each world of the component and none back. A root
          entity of relational type is a pair $(R,a)$ of an arbitrary set $R$ of tuples of root entities,
          its extension at $r$, and a component entity $a$, its transport along every arrow out of $r$;
          the root's individuals are those of $D$, each arrow acting on them as the identity. So the
          propositions at $r$ are the pairs of a truth value at $r$ and a component proposition. The
          evaluation point is $r$.
        label: free root
        brief: an unrestricted root sees every world of the component

meets:
  sigma-top: This is the interpretation the definition fixes.

conditions:
- id: stone-worlds
  text: The worlds are the ultrafilters of a Boolean algebra $B$, each fibre of an admitted relation is
    $\hat b:=\{U:b\in U\}$ for some $b\in B$, and the elements of $B$ are among the support points.

arguments:

- id: barcan
  holds: [necessary-barcan-r]
  choice: free
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, for supported-boolean-complete-predecessor; checked and
    recorded by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, and stated for the group
  date: '2026-10-29'
  text: >-
    At every type. In the component the same entities are available at every world, transport being
    trivial. With a free root $r$, every component entity is the transport of a root entity, the one with
    empty current extension; so what holds necessarily of every root entity holds at every world of every
    entity there.

- id: component-distinctness
  when: {root: none}
  holds: [necessary-distinctness-necessary-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    At every type. Every arrow acts as the identity and an entity is the same relation at every world, so
    distinct entities are distinct at every world.

- id: intensional-choice-compactness
  requires: [stone-worlds]
  holds: [necessary-intensional-choice-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    At every type. In the component, let $F$ be instantiated at every world, with fibre $\hat c_x$ at $x$.
    The clopen sets $\hat c_x$ cover the Stone space of $B$, so by compactness finitely many do, those of
    $x_1,\dots,x_k$, distinct. Let $G$ hold of $x_i$ exactly on $\hat e_i$, where
    $e_i:=c_{x_i}\wedge\neg\bigvee_{j<i}c_{x_j}$, and of nothing else. Its fibres are in $B$, and it is
    supported by the supports of the $x_i$ together with the $e_i$, which are support points; so $G$ is
    admitted, $G\le F$, and at each world exactly one $x_i$ has $G$. With a free root $r$, a root
    $F=(R,a)$ with $\Box\exists x\,Fx$ has a nonempty current extension and a component part $a$ as above;
    pair a singleton $\{x_0\}\subseteq R$ with the $G$ built for $a$. Only finitely many choices are made.
    So Intensional Choice holds at every world the evaluation point sees, and at $r$.
