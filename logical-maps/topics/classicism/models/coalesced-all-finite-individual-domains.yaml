description: >-
  Take the full Henkin models $M_n$ with individual domain $\{1,\ldots,n\}$ for every $n\ge1$, and add a
  root world. Individuals are threads $(a_n)_n$ with $a_n\in\{1,\ldots,n\}$; propositions are sets of
  worlds; an entity of a function type is a family of $M_n$-entities together with an arbitrary root
  component defined on whole threads. Application is componentwise, identity at world $n$ is the identity
  of $M_n$ and at the root is identity of elements. Every theorem of C holds at every world. At the root the
  finite cardinalities are the numerals, the $k$-th numeral's successor holds of the universal property at
  world $k+1$, and $\Diamond$ at the root is truth at some world, so the sentence that there could be any
  positive number of individuals, used in pure-possibility-implies-axiom-of-infinity-t, holds there. The
  root has uncountably many individuals and infinitely many propositions, so both Axioms of Infinity hold
  there. Two threads that agree at some world are distinct but possibly identical, so ND fails at type
  $e$. Evaluation point: the root.
notes: >-
  Recorded to witness the consistency with C of the sentence through which Possibility (pure) reaches the
  Axiom of Infinity at type $t$, and of that Axiom itself. The construction and its verification are in
  the write-up; no independent check is claimed.
