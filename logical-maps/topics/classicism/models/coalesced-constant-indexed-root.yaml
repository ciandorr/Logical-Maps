id: coalesced-constant-indexed-root
name: 'Coalesced sum: root individuals indexed by infinitely many individual constants'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr; the signature reading and the BF failure by Cian Dorr, 22 September
    2026
  recorded_by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 22 September 2026
  checked_by: []
  date: '2026-09-22'
  lean: none
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, pp. 41–42 and n. 61; Appendix E,
  p. 83 (the root indexed by individual constants); Theorem 3.26 and Appendix E, pp. 80–83.
- Cian Dorr, observations of 22 September 2026, as recorded in the notes.
source_names:
- Classicism
- Dorr 22 Sep
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §2.6, pp. 41–42 and n. 61; Appendix E, pp. 80–83
  note: Page 83 describes the alternative root whose individuals are indexed by the individual constants;
    the construction is the coalesced sum of Definition E.2.
group: coalesced-sums
settings:
  root-arrows: distinguished
  construction: 'For a signature Σ with countably infinitely many individual constants and at least one
    relational constant, take a set of action models for L(Σ) complete for C(Σ), and coalesce them at
    a new root whose individual domain is the set of individual constants, each constant denoting itself
    there and being carried by the distinguished arrow to each component onto its interpretation in that
    component; relational constants are glued as in Definition E.2, with free root extensions. Evaluation
    point: the root.'
  domains: fullest
meets:
  two-actual-components: >-
    The components are complete for C(Σ), so two of them satisfy Actuality at their roots; the root
    domains are the fullest.
  complete-components: The action models for L(Σ) are a set complete for C(Σ), so in particular for C.
  free-root-component: The root domains are as full as compatibility allows.
arguments:
- holds:
  - possibility-plus-signature-r
  text: 'The root satisfies Maximalist Classicism for Σ, since every C(Σ)-consistent sentence holds at
    some component root. It satisfies Possibility+ (signature Σ): for P with free individual variables
    x̄, instantiate x̄ by pairwise distinct root individuals, that is, distinct constants c̄′ not occurring
    in P; P[c̄′/x̄] is C(Σ)-consistent because the c̄′ are fresh, so it is possible at the root. The instances
    of the pure form follow.'
- holds:
  - axiom-of-infinity-e
  text: Distinct constants denote distinct root individuals, so there are infinitely many individuals
    at the root, giving the Infinity Schema at type e and, the root domains being as full as possible
    so that the numeral intensions exist, the Axiom of Infinity at type e.
- id: no-boxed-collapse
  fails:
  - necessary-two-hat-implies-nd-necessity
  - necessary-five-implies-two-hat-necessity
  - necessary-truth-implies-five-necessity
  text: The components form a set of action models complete for C in the signature, so for each of the
    three unboxed collapse principles, which fail in some model of C (the paired-individuals two-object
    model for 5-necessities are two-hat necessary, the two-object retract full model for Two-hat necessities
    are ND-necessary, the involution group for Truths are 5-necessary), some component falsifies
    it at its own evaluation point; the component is carried into the coalesced sum unchanged and its
    evaluation point is a world accessible from the root by the distinguished arrow. So none of the boxed
    collapse principles holds at the root, although every truth at the root is ND-necessary.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
notes: Possibility+ holds here, unlike at the maximalist root, because the root individuals are the constants,
  and two distinct constants stay distinct in every component where the sentence of their distinctness
  is realized, not in one component only.
