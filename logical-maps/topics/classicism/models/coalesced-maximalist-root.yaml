description: Take a coalesced sum of a set of source action models complete for C in the fixed signature,
  evaluated at the new root. See Definition E.2 for the construction; the singleton root proposition witnesses
  Actuality. The p. 83 discussion supplies the distinctness-preserving collapse and the obstruction to
  Strong Possibility.
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. BF
  fails at the root. C is complete for the component set, so some component $M$ refutes BF at its root
  $M_0$, at type $t$ say: some $F$ in $M_0$’s domain has $\forall y\, .\,\Box Fy$ true and $\Diamond\exists
  y\, .\,\neg Fy$ true at $M_0$. Because the root’s domains are as full as possible, the thread $F^{\prime}$
  that is universal at the root and in every other component and is carried onto $F$ by the distinguished
  arrow to $M_0$ is in the root domain. Every arrow from the root into $M$ factors through that distinguished
  arrow, so $\forall y\, .\,\Box F^{\prime}y$ at the root reduces to $\forall y\, .\,\Box Fy$ at $M_0$
  together with trivial checks elsewhere, and $\Diamond\exists y\, .\,\neg F^{\prime}y$ at the root follows
  from $\Diamond\exists y\, .\,\neg Fy$ at $M_0$ through the same factorization. Observation of Cian Dorr,
  22 September 2026.'
