  lean: none
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Theorem 3.26, §§3.6, pp. 62–64; Appendix
  E, pp. 80–83; §2.6, p. 41.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: Theorem 3.26, §§3.6, pp. 62–64; Appendix E, pp. 80–83; §2.6, p. 41
group: coalesced-sums
settings:
  root-arrows: distinguished
  construction: Take a coalesced sum of a set of source action models complete for C in the fixed signature,
    evaluated at the new root. See Definition E.2 for the construction.
  domains: fullest
meets:
  two-actual-components: >-
    The components are complete for C, so two of them satisfy Actuality; the root domains are the
    fullest.
  complete-components: The source action models are a set complete for C.
  free-root-component: The root domains are as full as compatibility allows.
arguments:
- holds:
  - distinctness-signature-r
  source:
    paper: bacon-dorr-classicism
    locator: Theorem 3.26, §3.6, pp. 62–64
- holds:
  - axiom-of-infinity-e
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: The root individuals are all families of component individuals, infinitely many since components
    have arbitrarily many individuals; identity at the root is identity of families; and the property
    of cardinalities that is true of exactly the standard numerals at the root and universal in every
    component is a root entity, so a finite cardinality at the root is a standard numeral, and no standard
    numeral holds of the universal property over an infinite domain.
- fails:
  - possibility-plus-r
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: Some component $N$ satisfies necessarily that there are at least three individuals, since that
    sentence is consistent; take two root individuals that differ at $N$ and agree everywhere else; the
    pure formula saying that $x\ne y$ and there are exactly two individuals is consistent, but at the
    root there are infinitely many individuals, under every arrow into another component the two collapse,
    and under every arrow into $N$ there are at least three.
- id: no-boxed-collapse
  fails:
  - necessary-two-hat-implies-nd-necessity
  - necessary-five-implies-two-hat-necessity
  - necessary-truth-implies-five-necessity
  text: The components form a set of action models complete for C in the signature, so for each of the
    three unboxed collapse principles, which fail in some model of C (the paired-individuals two-object
    model for 5-necessities are two-hat necessary, the two-object retract full model for Two-hat necessities
    are ND-necessary, the involution group for Truths are 5-necessary), some component falsifies
    it at its own evaluation point; the component is carried into the coalesced sum unchanged and its
    evaluation point is a world accessible from the root by the distinguished arrow. So none of the boxed
    collapse principles holds at the root, although every truth at the root is ND-necessary.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
notes: The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References.
