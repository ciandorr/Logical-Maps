id: coalesced-pinned-interpretations-root
name: 'Coalesced sum: interpretation arrows into every component object, finitely pinned root'
certificate:
  source_id: misc
  produced_by: Cian Dorr, 19 October 2026 (the construction), with Claude Opus 5.5 (Anthropic), who added
