references:
- paper: bacon-dorr-classicism
  role: background
  locator: Appendix D, Definitions D.1–D.3, Proposition D.4, pp. 73–74; Appendix E, Definition E.2,
    pp. 80–83
  note: The finitely pinned domains of Appendix D, with finite sets of constants in place of finite sets
    of individuals, over the components of a coalesced sum as in Appendix E.
group: coalesced-sums
settings:
  root-arrows: interpretations
  construction: 'Fix a set $A$ of action models complete for C($\Sigma$), with disjoint objects and arrows,
    and a signature $\Sigma^+\supseteq\Sigma$ with countably infinitely many constants of every type.
    Add an object $W_0$. Its arrows out are its identity and, for each object $V$ of a model in $A$ and
    each interpretation $I$ of $\Sigma^+$ at $V$, an arrow $\langle V,I\rangle$ into $V$; an arrow $k$ of
    the component composes with it to give $\langle V^{\prime},k\cdot I\rangle$. The individuals at
    $W_0$ are the individual constants of $\Sigma^+$, and $\langle V,I\rangle$ sends each to its
    interpretation. Evaluation point: $W_0$, at its identity arrow. Interpretation of Σ, fixed for this
    record: each constant $c$ of Σ denotes $\hat c$, the entity whose transport along every
    $\langle V,I\rangle$ is $I(c)$ and whose extension at the identity is empty.'
  domains:
    text: 'An entity at $W_0$ of a relational type is an intension over the arrows out of $W_0$ that is
      pinned down by a finite set $S$ of constants of $\Sigma^+$ (two arrows into the same object whose
      interpretations agree on $S$ give it the same value) and whose transport along every arrow
      $\langle V,I\rangle$ is in the domain of $V$ in its component; its value at the identity is
      unconstrained.'
meets:
  complete-components: The models in $A$ are complete for C($\Sigma$), so in particular for C.
  free-root-component: The value of a root entity at the identity arrow is unconstrained, the identity
    being the only arrow into $W_0$, so no pinning condition bears on it.
arguments:
- fails:
  - self-atoms-are-atoms-t
  - self-atoms-are-strong-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'Self-atoms are atoms (type t) fails at the root, and with it Self-atoms are strong atoms (type
    t). Some component has an object $V$ satisfying Actuality, with true atom $a_V$, since the components
    are complete and Actuality is consistent with C(Σ); and $a_V$ is a self-atom, so for an arrow $m$
    out of $V$ its transport is $a_V$ exactly when $m\in a_V$ (then $a_V$ is the true atom at $m$’s target,
    the atom containing the identity there), and otherwise excludes the identity. Let $c$ be a propositional
    constant of $\Sigma^+$ and $P$ the root proposition false at the identity and true exactly at the
    arrows $\langle V,I\rangle$ with $I(c)=a_V$: pinned down by $\{c\}$, with transport along such an
    arrow the set of $m$ with $m\cdot a_V=a_V$, that is $a_V$, an atom at $V$. So $P$ is possible and
    a self-atom. It is not an atom: for another propositional constant $c^{\prime}$, the arrows with $I(c)=a_V$
    and $I(c^{\prime})=\top$ form a proper nonempty part pinned down by $\{c,c^{\prime}\}$.'
- id: barcan
  holds:
  - barcan-r
  by: Cian Dorr, recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-19'
  choice: free
  writeup: coalesced-pinned-interpretations-root
  text: >-
    At every type, in the form $\Diamond\exists x\, .\,Fx\to\exists x\, .\,\Diamond Fx$. Each constant
    $c$ of type $\sigma$ gives an entity $\hat c$ at $W_0$, pinned down by $\{c\}$, with $\langle
    V,I\rangle\cdot\hat c=I(c)$ (for $\sigma=e$, $c$ itself). Let $F$ be pinned down by a finite $S$
    and true of $y$ at $\langle V,I\rangle$. Choose $c$ of type $\sigma$ outside $S$ and let $I^{\prime}$
    agree with $I$ except that $I^{\prime}(c)=y$. Then $\langle V,I^{\prime}\rangle$ agrees with
    $\langle V,I\rangle$ on $S$, so $F$ holds there of $y=\langle V,I^{\prime}\rangle\cdot\hat c$, and
    $\Diamond F\hat c$.
- id: maximalism
  holds:
  - distinctness-signature-r
  by: Cian Dorr, recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-19'
  choice: free
  writeup: coalesced-pinned-interpretations-root
  text: >-
    A closed sentence of $\Sigma$ holds at $\langle V,I\rangle$ iff it holds at $V$ in its component
    under the restriction of $I$ to $\Sigma$, the constants of $\Sigma$ denoting the entities $\hat c$.
    Every $\Sigma$-sentence consistent with C($\Sigma$) holds at the root of some model in $A$ under some
    interpretation, which extends to $\Sigma^+$, so it is possible at $W_0$: Maximalism for $\Sigma$ in its
    possibility form, and with it the pure form.
- id: possibility-plus
  holds:
  - possibility-plus-signature-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-19'
  choice: free
  text: >-
    The individuals at $W_0$ are the individual constants of $\Sigma^+$, none of them in $\Sigma$. Let
    $P$ be a $\Sigma$-formula with free individual variables among $\bar x$, consistent with C($\Sigma$),
    and $\bar c$ pairwise distinct individual constants. Some model in $A$ has $P$ true at its root $V$
    of some $\bar a$ under some interpretation of $\Sigma$; let $I$ extend it with $I(\bar c)=\bar a$,
    possibly identifying constants. Then $\langle V,I\rangle\cdot\bar c=\bar a$, so $P(\bar c)$ holds at
    $\langle V,I\rangle$ and $\Diamond P(\bar c)$ at $W_0$: Possibility+ for $\Sigma$, and with it the
    pure form.
- holds: [transversal-choice-r]
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  choice: uses
  text: >-
    At the root, by the general argument transversal-choice-extensionally-full, which uses
    extensional fullness at the evaluation point alone: any set of tuples at the identity is the
    extension there of the entity with that value at the identity and empty at every arrow into a
    component, pinned down by $\emptyset$. The components, any action models complete for
    C($\Sigma$), need not be extensionally full, so the model does not meet the condition
    extensionally-full, which asks for it at every object.
notes: 'Built on 19 October 2026 to show that Maximalism (pure, and for Σ) is consistent with BF, which no
  recorded model did. The construction is Cian Dorr''s; the condition that transports land in the component
  domains, without which a transport could leave a component''s domain, was added in discussion. That it is
  a model of C is argued in the write-up along the lines of Classicism, Appendices D and E; the argument has
  not been checked by a second reader. The group''s shared arguments that carry a component''s counterexample
  to the root through a distinguished arrow do not apply, the root having an arrow to every object for every
  interpretation; BF at type t, for one, holds here. No Lean verification is claimed.'
