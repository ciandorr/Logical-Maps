id: coalesced-pinned-substitutions-ch-root
name: 'Coalesced sum: substitution arrows over two atomless components disagreeing about CH'
certificate:
  source_id: misc
  produced_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts,
