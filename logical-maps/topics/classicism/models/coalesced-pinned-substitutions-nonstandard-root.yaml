  - five-implies-two-hat-necessity
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; audited by
    Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  choice: free
  text: >-
    The arguments as-in-all-maps and collapse-at-root of coalesced-pinned-substitutions-root apply
    unchanged. They use the maps of the constants and propositions and properties containing no arrow into
    a component, whose transports there are $\bot$ and land, together with the fact that no composite of
    an arrow into a component with anything is a map; none of this depends on which action models the
    components are. For Vicinity, the worlds seen from a map $f$ collapsing two individual constants $c,d$
    are the maps $g\circ f$ and the arrows $\langle V,I\circ f\rangle$, all of which identify them.
- holds: [transversal-choice-r]
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; audited by
    Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  choice: uses
  text: >-
    As in coalesced-pinned-substitutions-root, by the general argument transversal-choice-extensionally-full
    applied at the root alone: any set of tuples at the identity is the extension there of the entity with
    that value at every map of the constants and empty at every arrow into the component, pinned down by
    $\emptyset$ and landing.
notes: 'A variant of coalesced-pinned-substitutions-root proposed on 29 October 2026 in a trawl for the open
  questions created by □Atomlessness: the substitution arrows keep the root atomless, and the one component
  is atomless at every object but disagrees with the root about arithmetic and about BF. Audited by Claude Opus
  5.5 (Anthropic), prompted by Cian Dorr, 29 October 2026; it inherits the model-of-C argument of
  coalesced-pinned-substitutions-root, which has not had a second reader. No Lean verification is claimed.'
