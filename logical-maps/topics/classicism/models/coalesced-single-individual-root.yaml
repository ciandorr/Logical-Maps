id: coalesced-single-individual-root
name: 'Coalesced sum: singleton individual root'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), prompted by Zachary Goodsell, 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: none
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, pp. 41–42 and n. 61; Appendix E,
  p. 83.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §2.6, pp. 41–42 and n. 61; Appendix E, p. 83
group: coalesced-sums
settings:
  root-arrows: distinguished
  construction: 'Take the alternative coalesced-sum root of Appendix E, p. 83: a set of source action
    models complete for C, coalesced at a new root whose individual domain is a singleton, the unique
    root individual being carried by each distinguished arrow to a chosen individual of that component.
    Evaluation point: the root.'
  domains: fullest
meets:
  two-actual-components: >-
    The components are complete for C, so two of them satisfy Actuality at their roots; the root
    domains are the fullest.
  complete-components: The source action models are a set complete for C.
  free-root-component: The root domains are as full as compatibility allows.
arguments:
- holds:
  - possibility-plus-r
  source:
    paper: bacon-dorr-classicism
    locator: §2.6, pp. 41–42 and n. 61; Appendix E, p. 83
  text: Choosing the components so that every C-consistent formula with one free individual variable is
    true of the chosen individual in some component gives the n = 1 instances of Possibility+; the instances
    with two or more variables have false antecedents at the root, and the empty-tuple instances are Possibility
    Maximalism.
- fails:
  - infinity-e
  text: At the root, where there is one individual, although infinitely many are possible.
- id: no-boxed-collapse
  fails:
  - necessary-two-hat-implies-nd-necessity
  - necessary-five-implies-two-hat-necessity
  - necessary-truth-implies-five-necessity
  text: The components form a set of action models complete for C in the signature, so for each of the
    three unboxed collapse principles, which fail in some model of C (the paired-individuals two-object
    model for 5-necessities are two-hat necessary, the two-object retract full model for Two-hat necessities
    are ND-necessary, the involution group for Truths are 5-necessary), some component falsifies
    it at its own evaluation point; the component is carried into the coalesced sum unchanged and its
    evaluation point is a world accessible from the root by the distinguished arrow. So none of the boxed
    collapse principles holds at the root, although every truth at the root is ND-necessary.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
notes: 'Promoted on 22 September 2026 for the pure package, which the source establishes; the earlier
  conjectured status concerned an expansion to the map’s signature Σ. That expansion exists exactly when
  Σ has at most one individual constant: with two, the unique root individual would have to be carried
  to two different interpretations in a component where they differ, which no arrow can do. So the signature
  principles are not listed; for a signature with individual constants see the constant-indexed root.'
was_conjectured: true
