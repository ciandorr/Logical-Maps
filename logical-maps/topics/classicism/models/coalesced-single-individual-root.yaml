description: 'Take the alternative coalesced-sum root of Appendix E, p. 83: a set of source action models
  complete for C, coalesced at a new root whose individual domain is a singleton, the unique root individual
  being carried by each distinguished arrow to a chosen individual of that component. Choosing the components
  so that every C-consistent formula with one free individual variable is true of the chosen individual
  in some component gives the n = 1 instances of Possibility+; the instances with two or more variables
  have false antecedents at the root, and the empty-tuple instances are Possibility. Evaluation point:
  the root.'
notes: 'Promoted on 22 September 2026 for the pure package, which the source establishes; the earlier
  conjectured status concerned an expansion to the map’s signature Σ. That expansion exists exactly when
  Σ has at most one individual constant: with two, the unique root individual would have to be carried
  to two different interpretations in a component where they differ, which no arrow can do. So the signature
  principles are not listed; for a signature with individual constants see the constant-indexed root.
  Actuality holds by the singleton root proposition; Infinity at type e fails at the root, where there
  is one individual, although infinitely many are possible. BF fails at the root. C is complete for the
  component set, so some component $M$ refutes BF at its root $M_0$, at type $t$ say: some $F$ in $M_0$’s
  domain has $\forall y\, .\,\Box Fy$ true and $\Diamond\exists y\, .\,\neg Fy$ true at $M_0$. Because
  the root’s domains are as full as possible, the thread $F^{\prime}$ that is universal at the root and
  in every other component and is carried onto $F$ by the distinguished arrow to $M_0$ is in the root
  domain. Every arrow from the root into $M$ factors through that distinguished arrow, so $\forall y\,
  .\,\Box F^{\prime}y$ at the root reduces to $\forall y\, .\,\Box Fy$ at $M_0$ together with trivial
  checks elsewhere, and $\Diamond\exists y\, .\,\neg F^{\prime}y$ at the root follows from $\Diamond\exists
  y\, .\,\neg Fy$ at $M_0$ through the same factorization. Observation of Cian Dorr, 22 September 2026.
  Root domains are as full as compatibility allows: a root proposition is a choice, for each component,
  of a proposition of that component’s root domain, together with a truth value at the root’s identity
  arrow, and a root entity of a relational type is likewise a family of component entities with a root
  component that is an arbitrary function of the root arguments. Atomicity fails at type t: C is complete
  for the components, so some component $M$ refutes Atomicity at its root, by a proposition $p_M$ with
  no atom below it in $M$’s domain; the root proposition that is $p_M$ on $M$, empty on every other component
  and false at the root has as its root lower bounds exactly the root propositions that are lower bounds
  of $p_M$ on $M$ and empty elsewhere, so it has no atom below it either. Boolean Completeness fails,
  at type $e\to t$, for the same reason: a component $M$ refutes it by a property $X_M$ of propositions
  without a greatest lower bound in $M$’s domain, and the root property holding of a root proposition
  iff $X_M$ holds of its $M$-component has no greatest lower bound at the root, since such a bound’s $M$-component
  would be one for $X_M$. Relational Choice holds at the root, contrary to a first guess: the functionality
  of a subrelation is evaluated at the root’s identity arrow only, while the subrelation condition is
  boxed; so for a serial root relation take the subrelation whose root component is a functional choice
  from the root component, by choice in the metatheory, and whose component parts are empty. Its necessitation
  fails, since some component refutes Relational Choice at its root. □Relational Choice fails, as the
  notes on Relational Choice explain: some component refutes Relational Choice at its root, which is accessible
  from the root.  Correction of 23 September 2026: the components are only known to refute Boolean Completeness
  at type $e\to t$ (Classicism, n. 92, conjectures failures at type $t$ but has none), so the transfer
  argument refutes the type schema of Boolean Completeness at the root, not its type-$t$ instance, which
  is left unknown; the same transfer, applied to the countable family of haecceities that witnesses the
  component failure, refutes Countable Boolean Completeness.'
