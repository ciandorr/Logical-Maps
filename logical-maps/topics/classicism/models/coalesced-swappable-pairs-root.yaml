  note: The coalesced sum, here of a single one-world component.
group: coalesced-sums
settings:
  root-arrows: distinguished
  construction: >-
    The component is a one-world Henkin model $H$, as an action model with one object and only its
    identity arrow. Its individuals are labels $L_i$ and options $A_i^0,A_i^1$ ($i\in\mathbb N$). The
    group $\{0,1\}^{\mathbb N}$ acts on them, $g$ fixing each $L_i$ and sending $A_i^\epsilon$ to
    $A_i^{\epsilon+g(i)}$ (mod 2), and on functions by conjugation; its domain of each relational type
    $\sigma\tau$ holds the functions from $D_\sigma$ to $D_\tau$ fixed by every group element that is
    $0$ on some finite set, and $D_t=\{0,1\}$. These domains are closed under the logical constants and
    lambda abstraction, terms denoting equivariantly, so $H$ is an extensional Henkin model of C. Coalesce
    $H$ at a new root as in Definition E.2. The root's individuals are those of $H$, carried to
    themselves by the arrow into $H$. Evaluation point: the root. Interpretation of Σ, fixed for this
    record: every constant of Σ is relational, and each denotes the top element of its type.
  domains: fullest
meets:
  free-root-component: The root domains are as full as compatibility allows.
  sigma-top: This is the interpretation the construction fixes.
arguments:
- id: modalized-relational-choice
  fails: [modalized-relational-choice-r]
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 26 October 2026; checked and recorded by Claude Opus
    5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  choice: free
  text: >-
    At the types $e$ and $e$. In $H$, let $U$ relate each $L_i$ to $A_i^0$ and $A_i^1$, and each option to
    $L_0$: it is fixed by the whole group, so in the domain, and serial. No functional subrelation $S$ of
    $U$ is in the domain of $H$: $S$ is fixed by the group elements that are $0$ on some finite set $N$;
    for $i\notin N$, the element swapping the two options of pair $i$ alone fixes $S$ and $L_i$, so it
    carries the $S$-output of $L_i$, one of those options, to a second $S$-output. Now let $R$ be the root
    relation with the universal relation as its root component and $U$ as its component in $H$: it is
    necessarily serial. A necessarily functional $S\le R$ would have as its component in $H$ a functional
    subrelation of $U$ in the domain of $H$. So Modalized Relational Choice fails, and with it
    □Relational Choice.
- id: intensional-choice
  holds: [necessary-intensional-choice-r]
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 26 October 2026; checked and recorded by Claude Opus
    5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  choice: free
  text: >-
    In $H$, a property with an instance $b$ entails the haecceity of $b$, which is in the domain, being
    fixed by whatever fixes $b$. At the root, let $F$ be necessarily instantiated: its root component
    has an instance $a$ and its component in $H$ an instance $b$. The root property with root component
    $\{a\}$ and the haecceity of $b$ as its component entails $F$ and is necessarily uniquely
    instantiated; it does not matter that $b$ need not be the image of $a$. So Intensional Choice holds
    at both objects.
- id: barcan-and-completeness
  holds: [necessary-barcan-r, necessary-boolean-completeness-t]
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 26 October 2026; checked and recorded by Claude Opus
    5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  choice: free
  text: >-
    The arrow into $H$ carries the root domains onto those of $H$ at every type: an entity of $H$ is the
    component of the root entity with that component and an empty root component, and individuals go to
    themselves. So if $Fx$ is necessary for every root $x$, $F$'s component holds of every entity of $H$,
    and $\forall x\,.\,Fx$ is necessary: BF holds at the root, and trivially in the one-world $H$. There are
    four root propositions and two in $H$, so Boolean Completeness (type $t$) holds at both objects.
- id: self-atoms
  holds: [necessary-self-atoms-are-strong-atoms-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    In $H$ the singletons of tuples are fixed by whatever fixes their entries, so $H$ is atomic, and in
    a one-world model atoms are strong atoms. At the root, the singletons of root tuples with empty
    $H$-component, and the entities with empty root extension and a singleton $H$-component, are atoms,
    every nonzero entity is above one, and both kinds are strong atoms. A self-atom instantiated at the
    root is an atom; one instantiated only at $a$ has empty root extension and an atom of $H$ as
    $H$-component, so it is an atom too.
- id: infinity
  holds: [axiom-of-infinity-e]
  fails: [infinity-t]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    Root extensions are arbitrary, so the property of cardinalities that hold at the root only of
    properties with finite root extension is in the domain, and the argument infinitely-many-individuals
    runs at the root, which has infinitely many individuals. There are four propositions at the root and
    two in $H$.
- id: countable-boolean-completeness
  fails: [countable-boolean-completeness-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    At $\sigma=e$. Let $P_i$ have empty root extension and $H$-component $\{A_i^0\}$. An upper bound has
    an $H$-component containing every $A_i^0$, fixed by the swaps vanishing on some finite $N$, so
    containing $A_i^1$ for $i\notin N$; removing one such $A_j^1$ gives a smaller upper bound. The
    numbers at $e$ at the root are the distinct numerals, root extensions being arbitrary, and the
    relation pairing $P_i$ with the $i$th numeral is in the domain, so the family is countable relative
    to $e$.
- id: arithmetic
  holds: [arithmetic-necessitism, necessity-of-arithmetic]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    The numerals are fixed by the whole group, so the property of being a numeral is admitted in $H$ and
    at the root, and the numbers at every type are the numerals, crisply. A type is finite at both
    objects (those built from $t$ alone) or infinite at both; at a finite type $I_\sigma$ fails
    everywhere, and at an infinite one every relation among numerals is fixed by the group, so sum and
    product are standard at both objects. Persistence and inextensibility of the numbers are as in
    arithmetic-necessitism-extensionally-full.
- id: tame-rigidity
  holds: [necessary-tame-rigidity-r, necessary-rigid-power-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    In the one-world $H$ every relation is rigid, so rigidity at the root is weak rigidity there, and
    Tame Rigidity holds. Rigid Power: a rigid root $F$ with root extension $S$ has as $H$-component the
    least finitely supported superset $T$ of $a\cdot S$. For a finitely supported $T'\subseteq T$, let
    $S'$ be the members of $S$ sent into $T'$: any finitely supported $T''\supseteq a\cdot S'$ gives the
    finitely supported superset $(T''\cap T')\cup(T\setminus T')$ of $a\cdot S$, so $T''\supseteq T'$,
    and $(S',T')$ is rigid and below $F$. So the rigid relations below $F$ in $H$ are the transports of
    rigid ones at the root, and the power property of $F$ is weakly rigid, hence rigid. In $H$ the
    principle is trivial.
- id: one-world-component
  holds: [necessary-distinctness-preserving-collapse, necessary-persistent-comprehension-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    Both hold at the root (recorded) and trivially in the one-world $H$.
- id: pure-b
  fails: [pure-b-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    Distinctness-Necessity at $t$ fails at the root and holds in the one-world $H$; so its negation is
    true at the root and not possible at $a$.
- id: second-order-analysis
  holds: [necessity-of-second-order-analysis]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    At the root real number structures are standard, root extensions being arbitrary. In $H$, a real
    number structure has a carrier and relations fixed by the swaps vanishing on some finite $N$, each
    of which acts as an order-automorphism of a complete ordered field, hence trivially on the carrier;
    so every subset of the carrier and every relation on it is admitted, and the structure is standard
    with full second-order quantification. So an analytical sentence is true in every real number
    structure at every world, or false in every one.
notes: >-
  Recorded for the separation of Relational Choice with Intensional Choice from Modalized Relational
  Choice: Relational Choice holds at the root by choice in the metatheory (the group's argument
  relational-choice-free-root), while the choice-free component $H$ has no selector for its pair
  relation. Astra's note also shows that the root satisfies its "logical observer" separation
  principles, which the map does not record. An earlier version of the note took as its component a
  Henkin model of ZF without choice, as in henkin-without-relational-choice; $H$ removes the need for
  that model's set-theoretic hypothesis.
