id: extensional-independent-constants-finite-individuals
name: 'Extensional model: independent constants, finitely many individuals'
certificate:
  source_id: misc
  produced_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 22 October 2026 (for one predicate of type
    $et$); extended to every admissible signature by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 29
    October 2026
  recorded_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 29 October 2026
  checked_by: []
