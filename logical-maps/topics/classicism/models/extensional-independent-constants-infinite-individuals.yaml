  lean: none
sources:
- >-
  OpenAI Codex (GPT-6), prompted by Daniel Kodsi, Central question audit, 22 October 2026 (unpaginated),
  and the models extensional-single-predicate-two-individuals and
  extensional-single-predicate-natural-individuals in Daniel Kodsi's pull request #21 of 28 October 2026.
source_names:
- Codex via Kodsi 22 Oct
definition: >-
  The full one-world extensional hierarchy over individuals an infinite set $E$ of at least the cardinality of Σ ($\mathbb N$ when Σ is countable), with two
  propositions and every function at each relational type. Σ is any signature every constant of which has
  a type in which $e$ occurs; here Σ is arbitrary. Each individual constant denotes an individual of its own, and
  each relational constant $c$ of type $\tau$ gets two individuals $a_c,b_c$ of its own and denotes
  $x_\tau$, where $x_e:=a_c$ and, for $\tau=\bar\sigma t$ with $e$ occurring in $\sigma_i$,
  $x_\tau:=\{\bar y : y_i=x_{\sigma_i}\}$; for one predicate of type $et$ this is the singleton
  $\{a_c\}$. Evaluation at the one world.
arguments:
- id: extensionality
  holds: [extensionality-r]
  choice: free
  writeup: extensional-independent-constants
  text: >-
    Every relation is a function on the lower domains, and identity is identity of functions.
- id: functional-choice
  holds: [necessary-functional-choice-r]
  writeup: extensional-independent-constants
  text: >-
    The domains are full, so a serial relation has a functional subrelation, by choice in the metatheory
    (with finitely many individuals every type is finite and finite choice suffices); there is one world,
    so this is necessary.
- id: independence
  holds: [independence-signature-r]
  choice: free
  writeup: extensional-independent-constants
  text: >-
    Permutations of the individuals act on every type, by conjugation, preserving application, identity,
    the Boolean operations and the quantifiers, so every closed pure term $A$ is equivariant:
    $\pi(A\,\bar d)=A\,(\pi\bar d)$. For distinct constants $c,d_1,\dots,d_n$ with $c$ relational, the
    transposition of $a_c$ and $b_c$ fixes the individuals reserved for the $d_i$, hence each $d_i$, and so
    $A\,\bar d$; but it moves $c$, by induction on its type. So $c\ne A\,\bar d$. For an individual
    constant $c$ the instance is vacuous, no term $A\,\bar d$ being of type $e$.
- id: infinity
  holds: [axiom-of-infinity-e]
  fails: [infinity-t]
  writeup: extensional-independent-constants
  text: >-
    There are two propositions, so the Infinity schema fails at $t$. The numbers at $e$ are the standard
    finite cardinalities, the full hierarchy containing their family, which contains zero and is closed
    under successor; none holds of the universal property of the infinitely many individuals.
notes: >-
  Witnesses the consistency of Independence (signature Σ) with Extensionality, □Functional Choice and the
  Axiom of Infinity at $e$ for every Σ whose constants all have types in which $e$ occurs, of any
  cardinality. The restriction cannot be dropped: Extensionality and Independence (Σ) are inconsistent when
  Σ has a constant whose type does not contain $e$ (write-up). Codex's model is the case Σ $=\{c\}$, $c$ of
  type $et$ denoting $\{0\}$, over $\mathbb N$.
