description: 'Proposition D.5, part 7 (p. 78): the arrows are the maps $f_n$, for $n$ a power of $2$,
  sending $m$ to the greatest multiple of $n$ not exceeding $m$; $f_1$ is the identity. Actuality and
  Atomicity hold because each $\{f_n\}$ is pinned down by a finite set ($\{n-2,n-1,n\}$ for $n>1$, $\{0,1\}$
  for the identity); BF fails since an arrow sending $1$ to $0$ sends everything to even numbers; Boolean
  Completeness fails because the strongest persistent property with extension $\mathbb N$ pinned down
  by $\{0,\ldots,n\}$ has, at $f_m$, the multiples of $\min\{m,n\}$ as extension and so becomes ever stronger.
  In every part, $W_0^\ddagger$ is the set of finite subsets of $\mathbb N$ and the model is ideally full:
  a proposition is a set of arrows whose membership depends only on the arrows’ values on some finite
  set of individuals (it is pinned down by that set), an entity of a higher type is an applicative behaviour
  profile pinned down by a finite set in the same sense, and the individuals are the natural numbers acted
  on by the arrows themselves. Propositions and properties are thus about finitely many individuals and
  indifferent to how the arrows treat the rest. Evaluation point: the sole object, at the identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Boxed
  positive flags use the source’s explicit one-object No Pure Contingency observation, applied separately
  to each closed instance. Interpretation of Σ, fixed for this record: one designated relational constant
  $c$ of type $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of
  the model, the actual-world proposition described above; every other relational constant denotes the
  top element of its type and every individual constant one fixed individual. Under it: No Contingency
  (signature Σ) fails, since the Σ-sentence $\forall\bar x\, .\,c\bar x$ denotes $a$, true and contingent;
  B for sentences of Σ fails, since under any arrow that no arrow composes back into $a$, $\Diamond a$
  is false, so $\Box\Diamond a$ fails; Witnessed Possibility fails for the pure formula $x=\top_\tau$,
  witnessed by $\top_\tau$, since $\Diamond(c=\top_\tau)$ is $\Diamond\Box a$ and $a$ is necessary at
  no arrow; Separated Structure fails with it, being equivalent to Possibly Witnessed Possibility; Independence
  (signature Σ) and Distinctness Maximalism (signature Σ) fail through the other relational constants,
  Σ being assumed to contain at least one: such a constant $c''$ of type $\tau''$ denotes what the closed
  pure term $\top_{\tau''}$ denotes, and $c''=\top_{\tau''}$ is a true identity that C(Σ) does not prove.
  The designated constant refutes neither: closed pure terms denote entities fixed by every arrow (Classicism,
  §3.5, p. 58), whereas $a$ is fixed by no arrow but the identity, so no closed pure term denotes $\lambda\bar
  x\, .\,a$. Everything that implies these fails with them. Countable Boolean Completeness fails as well,
  at type $e\to t$: the property $E$ that the source shows to lack a least upper bound has as its extension
  a countable family of haecceities, and the extensional fullness the source invokes to put $E$ in the
  domain also puts in the relation pairing the haecceity of the $k$-th member of that family with the
  numeral $k$, which injects $E$ into the numerals. Observation of 23 September 2026. Distinctness-preserving
  collapse holds: for a true proposition $p$ pinned down by a finite set take as the witness $q$ the actual-world
  proposition $\{f_1\}$: under $f_n$ with $n>1$, $\Diamond q$ would need $k\circ f_n$ to be the identity,
  impossible since $f_n$ is not injective. Relational Choice holds, necessarily. The model is ideally
  full, hence extensionally full at every object (Appendix D, the remark after Definition D.3): for any
  set $R$ of tuples from the domains at an object $V$, the intension that assigns to every arrow out of
  $V$ into an object $U$ a fixed set $R_U$ of tuples from $U$’s domains, with $R_V=R$, is pinned down
  by $\emptyset$, so it is the intension of an element of $V^{\bar\sigma\to t}$ with extension $R$ at
  $1_V$. Given a relation $U$ serial at $V$, choose for each $x$ a $y$ with $(Ux)y$, by choice in the
  metatheory; the graph is such an $R$, and its element $S$ is functional and a subrelation of $U$ at
  $1_V$, both conditions being unboxed. The closed Relational Choice instance is true at an arrow $h\colon
  W_0\to V$ iff it is true at $1_V$ in the truncation by $h$, whose domains at $V$ are those of the model,
  so it holds at every arrow and $\Box$Relational Choice follows. Cian Dorr’s observation of 23 September
  2026. The type-$t$ Strong Leibniz Biconditionals fail although Atomicity holds, so the two come apart
  here. A strong world is an atom, and the atoms are the singletons $\{f_n\}$. Seen from $f_n$ with $n\ge2$,
  $\{f_n\}$ becomes $\{k : k\circ f_n=f_n\}=\{f_m : m\le n\}$, since $f_m\circ f_n=f_{\max\{m,n\}}$, and
  the proposition $\{f_1\}$ splits that set. So the only strong world is $\{f_1\}$, whose transport along
  every other arrow is empty, and the possible proposition $\{f_2\}$ has no strong world below it. BF
  fails at type $t$ as a consequence, by the recorded result that Atomicity (type $t$) and BF (type $t$)
  imply the type-$t$ Strong Leibniz Biconditionals. Directly: transports along $f_n$ depend only on an
  arrow’s values on the multiples of $n$, where $f_1$ and $f_2$ agree, so for $n\ge2$ the actual world
  $\{f_1\}$ is the transport along $f_n$ of no proposition; so for the relation $X$ holding of every proposition
  except $\{f_1\}$ at the arrows sending $1$ to $0$, pinned down by $\{1\}$, $\forall p\, .\,\Box Xp$
  holds at the identity but $\Box\forall p\, .\,Xp$ fails at $f_2$. Observations of 23 September 2026,
  answering Cian Dorr’s questions whether the failure of BF sharpens to type $t$ and whether failures
  of Atomicity’s strengthening can be found where Atomicity holds; the derivation of BF’s failure from
  them, 25 September 2026. Boolean Completeness fails at type $t$ as well, which the source (n. 92) conjectures
  but does not show. Any set $F$ of propositions is the extension at the identity of an element of the
  domain at type $t\to t$, namely the profile $\langle h,p\rangle\mapsto\{i : i\cdot p\in F\}$: it is
  natural, independent of $h$ and so pinned down by the empty set, and each of its values is pinned down
  by the pinning set of $p$, since $i\cdot p$ depends only on the values of $i$ there. A least upper bound
  of $F$ under entailment is a least finitely pinned superset of $\bigcup F$, and it exists only if the
  least $S$-pinned superset of $\bigcup F$ stops shrinking as the finite set $S$ grows. Here an arrow
  $f_n$ is determined by its value at any $m\ge n$ and all $f_n$ with $n>N$ agree on $\{0,\ldots,N\}$,
  so the finitely pinned propositions are exactly the finite and cofinite sets of arrows. Let $F$ be the
  family of singletons $\{f_n\}$ for $n$ an even power of $2$: an upper bound is a cofinite set containing
  them, and removing an odd-power member of it gives a strictly smaller upper bound. So $F$ has no least
  upper bound, and, taking pointwise negations, the family of complements has no greatest lower bound.
  Observation of Claude Fable 5.1 (Anthropic), 25 September 2026; not in the source.


  Review of 25 September 2026. Boolean Completeness already fails at type t: the finite/cofinite algebra
  of arrow indices has no least upper bound for the even-index singleton family. The family is represented
  by a domain property because this ideally full model is extensionally full (Definition D.3, p. 74).
  See the dated handwritten write-up.


  Review of 25 September 2026. Strong Leibniz-t fails by the nonidentity-idempotent singleton witness
  in writeups/strong-worlds-one-object-action-models.md. The successor quantifier ranges over all propositions
  at the target object, including ones outside the transported image. Its necessary form therefore also
  fails.'
