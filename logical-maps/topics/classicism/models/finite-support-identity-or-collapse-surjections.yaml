# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ, in which "$\{1_{\mathbb N}\}$" replaces "described above", since nothing
# above described the actual-world proposition.
group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
# Its text named the actual-world proposition by the identity arrow; the group describes it.
# migration (3 October): recorded at Σ top, as every member whose interpretation is one of the
# group's values now is; Σ true atom, until then the record's, is now a variant.
settings:
  monoid: >-
    Proposition D.5, part 5 (p. 78): the arrows are the monotone surjections $h$ of $\mathbb N$ with
    $h0=h1$, together with the identity.
  sigma: top

meets:
  non-injective-arrow: >-
    Every arrow other than the identity sends $0$ and $1$ to one number.
  factorizable-arrows: >-
    If $h$ is the identity, take $N^{\prime\prime}:=N\cup S$, $k^{\prime\prime}:=1$ and $j:=k^{\prime}$.
    Otherwise $h$ collapses $0$ and $1$; take $N^{\prime\prime}$ as for the monotone surjections, with
    $0,1\in N$. If $k$ is the identity, $k^{\prime}$ agrees with $h$ on $\{0,1\}$, so it is a collapse;
    take $k^{\prime\prime}:=k^{\prime}$ and $j:=1$. If $k$ is a collapse, the construction for the
    monotone surjections gives $k^{\prime\prime}$ and $j$ that collapse $0$ and $1$, as $h$ and $k$
    do.
  actual-world-pinned: >-
    As in part 4: the identity is the only arrow that does not collapse $0$ and $1$, so
    $\{1_{\mathbb N}\}$ is pinned down by $\{0,1\}$.
  non-identity-non-injective: >-
    Every other arrow collapses $0$ and $1$.
  collapse-unpinned: >-
    The other arrows are those that collapse $0$ and $1$, pinned down by $\{0,1\}$, and a
    collapsing monotone surjection is not determined by its values on a finite set.
  d6-surjective: >-
    Restricting part 4 to surjections, every arrow is a surjection of $\mathbb N$.
    So each arrow acts surjectively on the pinning sets, the finite subsets of $\mathbb N$, and on the individuals, whether these are the natural numbers or a single one that every arrow fixes.
  unbounded-haecceities: >-
    As in parts 2–4, with $A$ the even numbers.
  no-least-pinned-cover: >-
    Let $F$ be the family of propositions $A_m$ ($m\ge1$), each pinned down by $\{2m,2m+1\}$, that
    the arrow sends $2m$ to $0$ and $2m+1$ to $1$, so that its first step is at the odd position
    $2m+1$; the identity belongs to no $A_m$. The least superset of $\bigcup F$ pinned down by
    $\{0,\ldots,N\}$ consists of the non-identity arrows whose first step is at an odd position or
    beyond $N$, and it strictly shrinks as $N$ grows.

# Rewritten at Cian Dorr's direction on 2 October 2026 (Claude Opus 5.5): every argument this
# record shared in substance with another member is now a shared argument of the group
# finite-support-one-object, with this record's witness under `meets`; second arguments for a
# verdict already argued (the trawl's, among them) were dropped. No argument of its own is left:
# every verdict recorded for it comes from the group.
# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date.
arguments:
- holds:
  - necessary-self-atomicity-r
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: Self-Atomicity at every relational type, necessarily, there being one object. Let $I\ne\bot$ be
    an entity of type $\bar\sigma t$, pinned down by $N$, with a pair $\langle k,\bar x\rangle$ in it.
    If $k=1$, the singleton of the pair is in the domain, pinned down by $\{0,1\}$, and is a self-atom.
    Otherwise $k$ is a collapse with $k(0)=k(1)=0$ and $k(y)=1$ for some $y$; let $N^{\prime}:=N\cup\{0,y\}$
    and $J$ the set of pairs $\langle k_1,\bar x\rangle$ with $k_1$ agreeing with $k$ on $N^{\prime}$,
    below $I$ and pinned down by $N^{\prime}$. Its transport along $\langle k_1,\bar x\rangle$ is the
    set of $\langle m,\bar x\rangle$ with $m$ fixing $k(N^{\prime})\supseteq\{0,1\}$ pointwise, which
    only the identity does; so it is the singleton of $\langle1,\bar x\rangle$, an atom, and $J$ is a
    self-atom below $I$.
- holds:
  - necessary-self-atomicity-t
  fails:
  - self-atoms-are-atoms-t
  - self-atoms-are-strong-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: '$\{1\}$ is in the domain and is the only atom, the propositions over the collapses refining.
    A monotone surjection sends $0$ to $0$, so a collapse $k$ has $k(0)=k(1)=0$ and $k(y)=1$ for some
    $y$. For such $k$ and a finite $N\supseteq\{0,y\}$, the set $q$ of collapses agreeing with $k$ on
    $N$ is pinned down by $N$, and a collapse $m$ has $m\circ k^{\prime}\in q$, for $k^{\prime}\in q$,
    only if it fixes $k^{\prime}(N)\supseteq\{0,1\}$ pointwise, which no collapse does; so the transport
    of $q$ along each member is $\{1\}$, and $q$ is a self-atom, not an atom. So Self-atoms are atoms
    (type t) fails, and with it Self-atoms are strong atoms (type t). Self-Atomicity (type t) holds,
    and necessarily, there being one object: a possible proposition contains $1$, and then $\{1\}$, or
    a collapse $k$, and then, being pinned down by some $N$, the self-atom built from $k$ and $N\cup\{0,y\}$.
    The relational form is the argument that follows.'

- id: forcing-possibilism
  fails: [forcing-possibilism]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    The only atom is $\{1\}$: a nonempty set of collapsing arrows pinned down by $\{0,\ldots,M\}$ is
    split by the value at $M+1$, both values extending to arrows. So no proposition has exactly four
    below it, while $\bot$, $\{1\}$, its negation and $\top$ form a complete four-element algebra.
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them.

was_conjectured: true

