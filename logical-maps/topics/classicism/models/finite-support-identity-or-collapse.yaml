# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ, in which "$\{1_{\mathbb N}\}$" replaces "described above", since nothing
# above described the actual-world proposition.
group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
# Its text named the actual-world proposition by the identity arrow; the group describes it.
# migration (3 October): recorded at Σ top, as every member whose interpretation is one of the
# group's values now is; Σ true atom, until then the record's, is now a variant.
settings:
  monoid: >-
    Proposition D.5, part 4 (p. 78): the arrows are the monotone maps $h$ of $\mathbb N$ with
    $h0=h1$, together with the identity.
  sigma: top

meets:
  non-injective-arrow: >-
    Every arrow other than the identity sends $0$ and $1$ to one number.
  # uniformly-pinned-rigidity revised 9 October 2026 (Claude Opus 5.5, at Cian Dorr's direction):
  # stated for weakly rigid relations, which the argument only uses, and the comparison union taken
  # over $[0,s'+1]$, where every agreeing arrow jumps.
  uniformly-pinned-rigidity: >-
    Let $Y$ be weakly rigid, pinned down by $S=[0,s]$, with extension $E$ at the identity. Pinning
    and weak persistence give $Y(k)\supseteq k_2\cdot E$ for every $k_2$ agreeing with $k$ on $S$,
    and weak inextensibility, tested on the intension $k\mapsto\bigcup\{k_2\cdot E:k_2\text{ agrees
    with }k\text{ on }N\}$, pinned down by $N$, gives the reverse inclusion; so
    $\bigcup\{k_2\cdot E:k_2\text{ agrees with }k\text{ on }N\}=Y(k)$ for every finite $N\supseteq S$. If some $p\in E$ were pinned minimally at $T$ with $t:=\max T>s$, take
    $s'\ge t$ and the jump map $k$, sending $0$ and $1$ to $0$, the identity on $[2,s']$ and adding
    $100$ beyond: an arrow agreeing with $k$ on $S$ and sending $t$ to $s'+1$ puts into the
    $S$-union an element pinned at $s'+1$, while every element of the $[0,s'+1]$-union is pinned
    inside $k([0,s'])\cup[s'+100,\infty)$. So $E\subseteq\operatorname{Pin}(S)$, and then
    $k_2\cdot p=k\cdot p$ whenever $k_2$ agrees with $k$ on $S$, so $Y(k)=k\cdot E$.
  actual-world-pinned: >-
    The identity is the only arrow that does not collapse $0$ and $1$, so $\{1_{\mathbb N}\}$ is
    pinned down by $\{0,1\}$.
  non-identity-non-injective: >-
    Every other arrow collapses $0$ and $1$.
  collapse-unpinned: >-
    The other arrows are those that collapse $0$ and $1$, pinned down by $\{0,1\}$, and a
    collapsing monotone map is not determined by its values on a finite set.
  positive-preserving: >-
    Every arrow is monotone, and the arrows with $h0=h1=1$ send $0$ to a positive number.
  transport-gap: >-
    Take $N=\{0\}$, $i$ any arrow with $i0=2$ (hence $i1=2$ and range within $[2,\infty)$), and
    $q:=\{k : k1=1\}$, pinned down by $\{1\}$: the arrows $k$ with $k0=k1=1\le k2$ and
    $k^{\prime}$ with $k^{\prime}0=k^{\prime}1=0$, agreeing beyond $1$, are separated by $q$. The
    model is a one-object finite-support model, and the intension the argument uses is pinned down
    by $N$.
  unbounded-haecceities: >-
    As in parts 2 and 3, with $A$ the even numbers.
  no-least-pinned-cover: >-
    Let $F$ be the family of propositions $A_m$ ($m\ge1$), each pinned down by $\{1,2m,2m+1\}$,
    that the arrow is constant on $\{1,\ldots,2m\}$ and increases at $2m+1$; the identity belongs
    to no $A_m$. The least superset of $\bigcup F$ pinned down by $\{0,\ldots,N\}$ consists of the
    non-identity arrows whose first increase after $1$ is at an odd position or beyond $N$, and it
    strictly shrinks as $N$ grows.

# Rewritten at Cian Dorr's direction on 2 October 2026 (Claude Opus 5.5): every argument this
# record shared in substance with another member is now a shared argument of the group
# finite-support-one-object, with this record's witness under `meets`; second arguments for a
# verdict already argued (the trawl's, among them) were dropped. No argument of its own is left:
# every verdict recorded for it comes from the group.
# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date.
arguments:
- holds:
  - necessary-atoms-are-self-atoms-r
  - necessary-atoms-are-strong-atoms-r
  fails:
  - self-atoms-are-atoms-t
  - self-atomicity-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'The propositions over the collapses refine, two collapses agreeing with a given one on a finite
    $N$ differing beyond it, so no atom contains a collapse; $\{1\}$ is in the domain and is the only
    atom. It is a self-atom and a strong atom, no collapse having a retraction. An atom of a relational
    type sits over $1$ with one tuple, so is a self-atom and a strong atom. One object, so Atoms are
    self-atoms and Atoms are strong atoms hold at every world and every type. Self-atoms are atoms (type
    t) fails: let $k$ be a collapse with $k(0)=k(1)=0$ and $k(y)=1$, and $N\supseteq\{0,y\}$ finite; the
    set $q$ of collapses agreeing with $k$ on $N$ is pinned down by $N$, and for $k^{\prime}\in q$ a collapse
    $m$ has $m\circ k^{\prime}\in q$ only if it fixes $k^{\prime}(N)\supseteq\{0,1\}$ pointwise, which
    no collapse does; so the transport of $q$ along each member is $\{1\}$, $q$ is a self-atom, and it
    is not an atom. Self-Atomicity (type t) fails: the collapses with value $1$ at $0$ form a possible
    proposition pinned down by $\{0\}$, every member of which has range inside $[1,\infty)$, so that for
    any member $k^{\prime}$ and finite $N$ some collapse fixes $k^{\prime}(N)$ pointwise (send $0$ and
    $1$ to $1$, and fix the rest); so no part of it is a self-atom.'

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them.

was_conjectured: true

