description: 'Proposition D.5, part 4 (p. 78): the arrows are the monotone maps $h$ of $\mathbb N$ with
  $h0=h1$, together with the identity. Actuality holds because the identity is the only arrow that does
  not collapse $0$ and $1$, so $\{1_{\mathbb N}\}$ is pinned down by $\{0,1\}$; the actual world is the
  only world, Atomlessness restricted to false propositions holds, and Atomicity fails; BF, ND and Boolean
  Completeness fail as in part 3. In every part, $W_0^\ddagger$ is the set of finite subsets of $\mathbb
  N$ and the model is ideally full: a proposition is a set of arrows whose membership depends only on
  the arrows’ values on some finite set of individuals (it is pinned down by that set), an entity of a
  higher type is an applicative behaviour profile pinned down by a finite set in the same sense, and the
  individuals are the natural numbers acted on by the arrows themselves. Propositions and properties are
  thus about finitely many individuals and indifferent to how the arrows treat the rest. Evaluation point:
  the sole object, at the identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Boxed
  positive flags use the source’s explicit one-object No Pure Contingency observation, applied separately
  to each closed instance. Interpretation of Σ, fixed for this record: one designated relational constant
  $c$ of type $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of
  the model, the actual-world proposition described above; every other relational constant denotes the
  top element of its type and every individual constant one fixed individual. Under it: No Contingency
  (signature Σ) fails, since the Σ-sentence $\forall\bar x\, .\,c\bar x$ denotes $a$, true and contingent;
  B for sentences of Σ fails, since under any arrow that no arrow composes back into $a$, $\Diamond a$
  is false, so $\Box\Diamond a$ fails; Witnessed Possibility fails for the pure formula $x=\top_\tau$,
  witnessed by $\top_\tau$, since $\Diamond(c=\top_\tau)$ is $\Diamond\Box a$ and $a$ is necessary at
  no arrow; Separated Structure fails with it, being equivalent to Possibly Witnessed Possibility; Independence
  (signature Σ) and Distinctness Maximalism (signature Σ) fail through the other relational constants,
  Σ being assumed to contain at least one: such a constant $c''$ of type $\tau''$ denotes what the closed
  pure term $\top_{\tau''}$ denotes, and $c''=\top_{\tau''}$ is a true identity that C(Σ) does not prove.
  The designated constant refutes neither: closed pure terms denote entities fixed by every arrow (Classicism,
  §3.5, p. 58), whereas $a$ is fixed by no arrow but the identity, so no closed pure term denotes $\lambda\bar
  x\, .\,a$. Everything that implies these fails with them. Countable Boolean Completeness fails as well,
  at type $e\to t$: the property $E$ that the source shows to lack a least upper bound has as its extension
  a countable family of haecceities, and the extensional fullness the source invokes to put $E$ in the
  domain also puts in the relation pairing the haecceity of the $k$-th member of that family with the
  numeral $k$, which injects $E$ into the numerals. Observation of 23 September 2026. Distinctness-preserving
  collapse holds: for a true proposition $p$ pinned down by a finite set take as the witness $q$ the actual-world
  proposition $\{1_{\mathbb N}\}$: under any other arrow $h$, $\Diamond q$ would need $k\circ h=1_{\mathbb
  N}$, impossible since $h$ is not injective. Relational Choice holds, necessarily. The model is ideally
  full, hence extensionally full at every object (Appendix D, the remark after Definition D.3): for any
  set $R$ of tuples from the domains at an object $V$, the intension that assigns to every arrow out of
  $V$ into an object $U$ a fixed set $R_U$ of tuples from $U$’s domains, with $R_V=R$, is pinned down
  by $\emptyset$, so it is the intension of an element of $V^{\bar\sigma\to t}$ with extension $R$ at
  $1_V$. Given a relation $U$ serial at $V$, choose for each $x$ a $y$ with $(Ux)y$, by choice in the
  metatheory; the graph is such an $R$, and its element $S$ is functional and a subrelation of $U$ at
  $1_V$, both conditions being unboxed. The closed Relational Choice instance is true at an arrow $h\colon
  W_0\to V$ iff it is true at $1_V$ in the truncation by $h$, whose domains at $V$ are those of the model,
  so it holds at every arrow and $\Box$Relational Choice follows. Cian Dorr’s observation of 23 September
  2026.


  Review of 25 September 2026. The dated write-up supplies the accepted BC-t witness using alternating
  differences of agreement classes and Definition D.3''s extensional-fullness lemma. It replaces the trawl''s
  invalid inference from an unavailable intersection to an unavailable greatest lower bound. Atomicity-t
  also fails, as already specified by the source''s footnote 92 and checked by splitting any nonempty
  finitely pinned subproposition of the false proposition h(0)=h(1)=0.'
