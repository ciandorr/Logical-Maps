description: 'Proposition D.5, part 3 (p. 77): the one-object category whose arrows are all the monotone
  maps of $\mathbb N$. The source notes that with all maps BF would still hold, since every map agrees
  on any finite set with a surjection; monotonicity makes it fail, witnessed by the qualitative property
  of being positive: any monotone map sending $0$ to a positive number sends everything to positive numbers,
  so $\forall y\,\Box(Xz\to Xy)$ holds with $z:=0$ while $\Box\forall y(Xz\to Xy)$ fails. ND, Actuality
  and Atomicity fail, Atomlessness holds, and Boolean Completeness fails as in part 2. In every part,
  $W_0^\ddagger$ is the set of finite subsets of $\mathbb N$ and the model is ideally full: a proposition
  is a set of arrows whose membership depends only on the arrows’ values on some finite set of individuals
  (it is pinned down by that set), an entity of a higher type is an applicative behaviour profile pinned
  down by a finite set in the same sense, and the individuals are the natural numbers acted on by the
  arrows themselves. Propositions and properties are thus about finitely many individuals and indifferent
  to how the arrows treat the rest. Evaluation point: the sole object, at the identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Boxed
  positive flags use the source’s explicit one-object No Pure Contingency observation, applied separately
  to each closed instance. Interpretation of Σ, fixed for this record: one designated relational constant
  $c$ of type $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,p_0$, where $p_0$ is the proposition that
  the arrow fixes $0$, pinned down by $\{0\}$; every other relational constant denotes the top element
  of its type and every individual constant one fixed individual. Under it No Contingency (signature Σ)
  fails, since $\forall\bar x\, .\,c\bar x$ denotes $p_0$, true and false at the constant map to $1$.
  Witnessed Possibility fails for the pure formula $x=\top_\tau$, witnessed by $\top_\tau$: $\Diamond(c=\top_\tau)$
  is $\Diamond\Box p_0$, and $\Box p_0$ holds at no arrow $h$, since the constant map to $1$ composed
  after $h$ moves $0$. Separated Structure fails with it, being equivalent to Possibly Witnessed Possibility.
  Distinctness Maximalism (signature Σ) fails by derivation, since Possibility Maximalism (pure) fails here. Whether $c$ denotes
  what some closed pure term denotes is not settled, so Independence (signature Σ) is left unknown. The
  choice of a contingent rather than a pure denotation is deliberate: this is the only recorded model
  of Atomlessness in which No Contingency (signature Σ) is refuted, the others being one-object models
  with pure interpretations of the constants. Countable Boolean Completeness fails as well, at type $e\to
  t$: the property $E$ that the source shows to lack a least upper bound has as its extension a countable
  family of haecceities, and the extensional fullness the source invokes to put $E$ in the domain also
  puts in the relation pairing the haecceity of the $k$-th member of that family with the numeral $k$,
  which injects $E$ into the numerals. Observation of 23 September 2026. Distinctness-preserving collapse
  fails: the shift $h$ that fixes $0,\ldots,m-1$ and adds one to everything from $m$ on is a monotone
  injection, so for any true $q$ pinned down by a finite $Y$ a monotone $k$ with $k(hy)=y$ on $Y$ exists
  and $k\circ h\in q$; thus $\Diamond q$ holds at $h$, while the true proposition that $m$ is fixed is
  false there. Relational Choice holds, necessarily. The model is ideally full, hence extensionally full
  at every object (Appendix D, the remark after Definition D.3): for any set $R$ of tuples from the domains
  at an object $V$, the intension that assigns to every arrow out of $V$ into an object $U$ a fixed set
  $R_U$ of tuples from $U$’s domains, with $R_V=R$, is pinned down by $\emptyset$, so it is the intension
  of an element of $V^{\bar\sigma\to t}$ with extension $R$ at $1_V$. Given a relation $U$ serial at $V$,
  choose for each $x$ a $y$ with $(Ux)y$, by choice in the metatheory; the graph is such an $R$, and its
  element $S$ is functional and a subrelation of $U$ at $1_V$, both conditions being unboxed. The closed
  Relational Choice instance is true at an arrow $h\colon W_0\to V$ iff it is true at $1_V$ in the truncation
  by $h$, whose domains at $V$ are those of the model, so it holds at every arrow and $\Box$Relational
  Choice follows. Cian Dorr’s observation of 23 September 2026.'
