description: 'Proposition D.5, part 2 (pp. 76–77): the one-object category whose arrows are the monotone
  surjections of $\mathbb N$ (the source first considers all surjections, which gives the same package,
  and restricts to the monotone ones to make the failure of Boolean Completeness easier to exhibit). ND
  fails at the non-injective arrows; BF holds by Proposition D.6 since every arrow is a surjection; Atomlessness
  holds as in part 1; Boolean Completeness fails at type $e\to t$ because the haecceities of the even
  numbers have no least upper bound, the strongest persistent property containing them and pinned down
  by $\{0,\ldots,n\}$ becoming strictly stronger as $n$ grows. In every part, $W_0^\ddagger$ is the set
  of finite subsets of $\mathbb N$ and the model is ideally full: a proposition is a set of arrows whose
  membership depends only on the arrows’ values on some finite set of individuals (it is pinned down by
  that set), an entity of a higher type is an applicative behaviour profile pinned down by a finite set
  in the same sense, and the individuals are the natural numbers acted on by the arrows themselves. Propositions
  and properties are thus about finitely many individuals and indifferent to how the arrows treat the
  rest. Evaluation point: the sole object, at the identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Boxed
  positive flags use the source’s explicit one-object No Pure Contingency observation, applied separately
  to each closed instance. Interpretation of Σ, fixed for this record: each relational constant denotes
  the top element of its type and each individual constant denotes one fixed individual. Under it the
  signature schemata fail. Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily.
  Witnessed Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but impossible
  of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\, .\,\top_\tau$ agree on $c$
  and differ; Independence (signature Σ) fails since $c$ denotes what the closed pure term $\top_\tau$
  denotes; Distinctness Maximalism (signature Σ) fails since $c=\top_\tau$ is a true identity that C(Σ)
  does not prove. Everything that implies these fails with them. Countable Boolean Completeness fails
  as well, at type $e\to t$: the property $E$ that the source shows to lack a least upper bound has as
  its extension a countable family of haecceities, and the extensional fullness the source invokes to
  put $E$ in the domain also puts in the relation pairing the haecceity of the $k$-th member of that family
  with the numeral $k$, which injects $E$ into the numerals. Observation of 23 September 2026. Distinctness-preserving
  collapse holds: for a true proposition $p$ pinned down by a finite set take as the witness $q$ the proposition
  that the arrow fixes $0,\ldots,N$ for $N$ beyond the pinning set. An arrow fixing $0,\ldots,N$ agrees
  with the identity on that set and so is in $p$. An arrow $h$ that does not, with least moved point $m\le
  N$, has $hm<m$ by monotone surjectivity and so collapses $m-1$ and $m$; then no $k\circ h$ can fix both,
  so $\Diamond q$ fails at $h$. Hence $\Box(\Diamond q\to p)$. Relational Choice holds, necessarily. The
  model is ideally full, hence extensionally full at every object (Appendix D, the remark after Definition
  D.3): for any set $R$ of tuples from the domains at an object $V$, the intension that assigns to every
  arrow out of $V$ into an object $U$ a fixed set $R_U$ of tuples from $U$’s domains, with $R_V=R$, is
  pinned down by $\emptyset$, so it is the intension of an element of $V^{\bar\sigma\to t}$ with extension
  $R$ at $1_V$. Given a relation $U$ serial at $V$, choose for each $x$ a $y$ with $(Ux)y$, by choice
  in the metatheory; the graph is such an $R$, and its element $S$ is functional and a subrelation of
  $U$ at $1_V$, both conditions being unboxed. The closed Relational Choice instance is true at an arrow
  $h\colon W_0\to V$ iff it is true at $1_V$ in the truncation by $h$, whose domains at $V$ are those
  of the model, so it holds at every arrow and $\Box$Relational Choice follows. Cian Dorr’s observation
  of 23 September 2026. Boolean Completeness fails at type $t$ as well, which the source (n. 92) conjectures
  but does not show. Any set $F$ of propositions is the extension at the identity of an element of the
  domain at type $t\to t$, namely the profile $\langle h,p\rangle\mapsto\{i : i\cdot p\in F\}$: it is
  natural, independent of $h$ and so pinned down by the empty set, and each of its values is pinned down
  by the pinning set of $p$, since $i\cdot p$ depends only on the values of $i$ there. A least upper bound
  of $F$ under entailment is a least finitely pinned superset of $\bigcup F$, and it exists only if the
  least $S$-pinned superset of $\bigcup F$ stops shrinking as the finite set $S$ grows. Here let $A_m$
  ($m\ge1$) be the proposition, pinned down by $\{2m-1,2m\}$, that the arrow sends $2m-1$ to $0$ and $2m$
  to $1$, so that its first step is at the even position $2m$. The least superset of $\bigcup_mA_m$ pinned
  down by $\{0,\ldots,N\}$ consists of the arrows whose first step is at an even position or beyond $N$,
  and it strictly shrinks as $N$ grows. So $F$ has no least upper bound, and, taking pointwise negations,
  the family of complements has no greatest lower bound. Observation of Claude Fable 5.1 (Anthropic),
  25 September 2026; not in the source. Inextensible Comprehension fails at type $e$, for the property
  of being even, whose extension is the evens at every world (the intension $\langle h,b\rangle\mapsto\{i
  : i(b)\text{ even}\}$, pinned down by the empty set). Suppose $Y$ were inextensible with extension the
  evens and pinned down by $\{0,\ldots,N\}$. Any arrow $g''$ agreeing with the identity on that set has
  $g''\cdot Y=Y$, so $Y$ has extension the evens at the world $g''$ too. Unpacking inextensibility at
  the identity: for every relation $X$ in the domain that is necessary of each even number, $Y\le X$,
  so the extension of $Y$ at $g''$ is contained in that of $X$ at $g''$. Take $X$ pinned down by $S_X:=\{0,\ldots,K\}$
  to hold, at an arrow $h$, of exactly the individuals $h''(a)$ with $a$ even and $h''$ agreeing with
  $h$ on $S_X$ (the intension $\langle h,b\rangle\mapsto\{i : \exists h''\equiv_{S_X}i\circ h,\,\exists
  a\text{ even},\ i(b)=h''(a)\}$, which is natural, pinned down by $S_X$, and necessary of every even
  number). Let $g''$ fix $0,\ldots,N$, send $N+1$ and $N+2$ to $N+1$, and send $m\ge N+3$ to $m-1$; it
  is a monotone surjection agreeing with the identity on the pinning set of $Y$. With $K:=N+4$, the extension
  of $X$ at $g''$ is $g''(\text{evens}\cap[0,K])\cup[g''(K),\infty)=(\text{evens}\le N)\cup(\text{odds}\cap[N+1,K-1])\cup[K-1,\infty)$,
  which omits the even number $N+2$, although $N+2$ is in the extension of $Y$ at $g''$. Contradiction.
  Observation of Claude Fable 5.1 (Anthropic), 25 September 2026; not in the source.'
