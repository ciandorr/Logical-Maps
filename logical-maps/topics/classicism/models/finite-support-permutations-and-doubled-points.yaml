id: finite-support-permutations-and-doubled-points
name: 'Finite-support action model: permutations of N, with each point doubled at a second object'
certificate:
  source_id: misc
  produced_by: Cian Dorr, 29 October 2026
  recorded_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 29 October 2026
  checked_by: []
  date: '2026-10-29'
  lean: none
sources:
