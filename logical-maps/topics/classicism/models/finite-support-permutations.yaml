description: 'Proposition D.5, part 1 (pp. 75–76): the one-object category whose arrows are all the permutations
  of $\mathbb N$, so that each arrow $h$ represents the possibility in which each individual $n$ plays
  the role actually played by $hn$, and the roles can be redistributed in any way. In every part, $W_0^\ddagger$
  is the set of finite subsets of $\mathbb N$ and the model is ideally full: a proposition is a set of
  arrows whose membership depends only on the arrows’ values on some finite set of individuals (it is
  pinned down by that set), an entity of a higher type is an applicative behaviour profile pinned down
  by a finite set in the same sense, and the individuals are the natural numbers acted on by the arrows
  themselves. Propositions and properties are thus about finitely many individuals and indifferent to
  how the arrows treat the rest. Evaluation point: the sole object, at the identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Boxed
  positive flags use the source’s explicit one-object No Pure Contingency observation, applied separately
  to each closed instance. Interpretation of Σ, fixed for this record: each relational constant denotes
  the top element of its type and each individual constant denotes one fixed individual $d$. Under it
  the signature schemata that give the constants a special role fail: with $c\in\Sigma$ of relational
  type $\tau$, $c=\top_\tau$ necessarily, so Witnessed Possibility fails for the pure formula $x\ne\top_\tau$,
  Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\, .\,\top_\tau$ agree on $c$, Independence
  (signature Σ) fails since $c$ denotes what a closed pure term denotes, and Distinctness (signature Σ)
  fails since $c=\top_\tau$ is true and unprovable. But No Contingency (signature Σ), and with it B for
  sentences of Σ, hold. The relational constants denote pure entities, so a closed Σ-sentence denotes
  what some $P(d,\ldots,d)$ denotes for a pure formula $P$; the model’s automorphisms carry every individual
  to every other, so $P(d,\ldots,d)$ is materially equivalent to the pure sentence $\forall x\, .\,P(x,\ldots,x)$
  and its negation to $\forall x\, .\,\neg P(x,\ldots,x)$; whichever is true is necessary by No Pure Contingency,
  and instantiation under the box gives $\Box P(d,\ldots,d)$ or $\Box\neg P(d,\ldots,d)$. Boolean Completeness
  fails here through C5 and the failure of Actuality (Propositions 2.5–2.6), which gives nothing about
  countable families; but the part 2 argument transfers: the strongest persistent property pinned down
  by a finite $X$ whose extension contains the even numbers has, at an arrow $h$, the extension $h(X\cap\text{evens})\cup(\mathbb
  N\setminus hX)$, which strictly shrinks as $X$ grows, so the haecceities of the even numbers have no
  least upper bound. Countable Boolean Completeness fails as well, at type $e\to t$: the property $E$
  that the source shows to lack a least upper bound has as its extension a countable family of haecceities,
  and the extensional fullness the source invokes to put $E$ in the domain also puts in the relation pairing
  the haecceity of the $k$-th member of that family with the numeral $k$, which injects $E$ into the numerals.
  Observation of 23 September 2026. Distinctness-preserving collapse fails: every arrow $h$ has an inverse,
  so for any true $q$ the arrow $q$-member$\circ h^{-1}$ carries $h$ into $q$, making $\Diamond q$ true
  everywhere; so $\Box(\Diamond q\to p)$ would need $p=\top$, and the true proposition that $0$ is fixed
  is not $\top$. Relational Choice holds, necessarily. The model is ideally full, hence extensionally
  full at every object (Appendix D, the remark after Definition D.3): for any set $R$ of tuples from the
  domains at an object $V$, the intension that assigns to every arrow out of $V$ into an object $U$ a
  fixed set $R_U$ of tuples from $U$’s domains, with $R_V=R$, is pinned down by $\emptyset$, so it is
  the intension of an element of $V^{\bar\sigma\to t}$ with extension $R$ at $1_V$. Given a relation $U$
  serial at $V$, choose for each $x$ a $y$ with $(Ux)y$, by choice in the metatheory; the graph is such
  an $R$, and its element $S$ is functional and a subrelation of $U$ at $1_V$, both conditions being unboxed.
  The closed Relational Choice instance is true at an arrow $h\colon W_0\to V$ iff it is true at $1_V$
  in the truncation by $h$, whose domains at $V$ are those of the model, so it holds at every arrow and
  $\Box$Relational Choice follows. Cian Dorr’s observation of 23 September 2026.'
