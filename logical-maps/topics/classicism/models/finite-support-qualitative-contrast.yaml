description: 'Appendix D, p. 79, the final construction: two objects $W_0$ and $W_1$, both copies of $\mathbb
  N$, with the permutations of $\mathbb N$ as the arrows between any pair of objects, finite subsets as
  $W_i^\ddagger$, and one constraint beyond ideal fullness: a set of arrows belongs to $W_i^t$ only if,
  whenever it contains an arrow $h$ into $W_0$, it contains $g\circ h$ for every permutation $g$ of $W_0$.
  Intuitively $W_0$ is a state in which all individuals are qualitatively indiscernible and $W_1$ one
  in which each plays a unique role. The smallest proposition of $W_0^t$ containing the identity is the
  set of all arrows $W_0\to W_0$, which witnesses Actuality at $W_0$; Actuality fails at $W_1$ as in part
  1, so $\Box$Actuality and hence Atomicity fail at $W_0$ although C5 holds. Evaluation point: $W_0$,
  at its identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Interpretation
  of Σ, fixed for this record: each relational constant denotes the top element of its type and each individual
  constant denotes one fixed individual. Under it the signature schemata fail. Let $c\in\Sigma$ have relational
  type $\tau$, so $c=\top_\tau$ necessarily. Witnessed Possibility fails for the pure formula $x\ne\top_\tau$,
  witnessed by $\bot_\tau$ but impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and
  $\lambda x\, .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes
  what the closed pure term $\top_\tau$ denotes; Distinctness (signature Σ) fails since $c=\top_\tau$
  is a true identity that C(Σ) does not prove. Everything that implies these fails with them. Distinctness-preserving
  collapse fails at $W_0$: every arrow has an inverse, so $\Diamond q$ holds at every arrow for every
  true $q$, and $\Box(\Diamond q\to p)$ would force every true $p$ to contain every arrow; but the true
  proposition consisting of all arrows $W_0\to W_0$ together with the arrows into $W_1$ fixing $0$ is
  pinned down by $\{0\}$, meets the closure constraint, and omits arrows. Relational Choice is left unknown
  here: the construction constrains $W_i^t$ beyond ideal fullness, so the paper’s remark that ideally
  full models are extensionally full does not apply to it as stated, and no other argument has been checked.'
was_conjectured: true
