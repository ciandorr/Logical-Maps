# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ, in which "$\{k_0\}$" replaces "described above", since nothing above
# described the actual-world proposition.
group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
# Its text named the actual-world proposition by the identity arrow; the group describes it.
# migration (3 October): recorded at Σ top, as every member whose interpretation is one of the
# group's values now is; Σ true atom, until then the record's, is now a variant.
settings:
  monoid: >-
    Proposition D.5, part 8 (pp. 78–79): the arrows are the maps $k_n$ with $k_nm=0$ for $m\le n$
    and $k_nm=m-n$ otherwise, which compose as $k_n\circ k_m=k_{n+m}$; $k_0$ is the identity.
  sigma: top

meets:
  non-injective-arrow: >-
    $k_1$ sends $0$ and $1$ to $0$.
  arrows-finitely-determined: >-
    For $n\ge1$, $k_n(n+1)=1$ singles out $k_n$, and $k_0(1)=1$ singles out $k_0$; each singleton is pinned down by that one point.
  actual-world-pinned: >-
    $\{k_0\}$ is pinned down by $\{1\}$, since $k_n1=0$ for $n>0$.
  non-identity-non-injective: >-
    Each $k_n$ with $n>0$ sends $0,\ldots,n$ to $0$.
  pinned-atoms: >-
    $\{k_0\}$ and each $\{k_n\}$ are pinned down by finite sets: $k_n$ is the only arrow sending
    $n+1$ to $1$.
  d6-surjective: >-
    $k_n$ sends $0$ to $0$ and $m+n$ to $m$ for $m\ge1$, so it is a surjection of $\mathbb N$.
    So each arrow acts surjectively on the pinning sets, the finite subsets of $\mathbb N$, and on the individuals, whether these are the natural numbers or a single one that every arrow fixes.
  unbounded-haecceities: >-
    With $A$ the even numbers: the strongest persistent property pinned down by $\{0,\ldots,n\}$
    whose extension contains them has, at $k_m$, the evens, the odds with $0$, or all of $\mathbb N$
    according as $m<n$ is even, $m<n$ is odd, or $m\ge n$.
  no-least-pinned-cover: >-
    An arrow $k_n$ is determined by its value at any $m\ge n$ and all $k_n$ with $n\ge N$ agree on
    $\{0,\ldots,N\}$, so the finitely pinned propositions are exactly the finite and cofinite sets
    of arrows. Let $F$ be the family of singletons $\{k_{2j}\}$: a finitely pinned superset of
    $\bigcup F$ is a cofinite set, and removing from it an odd-indexed member gives a strictly
    smaller one.

# Rewritten at Cian Dorr's direction on 2 October 2026 (Claude Opus 5.5): every argument this
# record shared in substance with another member is now a shared argument of the group
# finite-support-one-object, with this record's witness under `meets`; second arguments for a
# verdict already argued (the trawl's, among them) were dropped. No argument of its own is left:
# every verdict recorded for it comes from the group.
# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date.
arguments:
- holds:
  - necessary-self-atoms-are-atoms-r
  - necessary-self-atoms-are-strong-atoms-r
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'Every arrow $k_n$ is determined by its value at $n+1$, so every singleton is in the domain, and
    the only atom containing the identity is $\{1\}$. A self-atom containing $k_n$ and $k_m$ with $n<m$
    would have $k_{m-n}$ in its transport along $k_n$, since $k_{m-n}\circ k_n=k_m$, so that transport
    would not be $\{1\}$. So the self-atoms are the singletons, atoms, and each is a strong atom: $\{k_n\}$
    becomes under $k_m$ the set of $k_j$ with $j+m=n$, of at most one arrow. A self-atom of a relational
    type sits over one arrow with one tuple, by the transport condition, so is an atom and a strong atom
    likewise. One object, so this holds at every world.'

- holds: [rigid-power-r]
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-04'
  text: >-
    Write $X_0(E)$ for the intension $n\mapsto k_n\cdot E$. Every arrow is finitely determined, so,
    as in the group's argument for Tame Rigidity, a weakly inextensible relation is $X_0$ of its
    extension at the identity, and the rigid relations are the $X_0(E)$ that are in the domain,
    namely those with $k_n\cdot E$ constant for all $n$ beyond some $s$. For rigid $F=X_0(S)$ the
    power property $\lambda X\, .\,\operatorname{Rigid}(X)\land X\le F$ has extension
    $\{X_0(T'):T'\subseteq k_m\cdot S,\ X_0(T')\text{ in the domain}\}$ at $k_m$, while its
    extension at the identity transported along $k_m$ is $\{X_0(k_m\cdot T):T\subseteq S,\
    X_0(T)\text{ in the domain}\}$. Given such a $T'$, put $T:=\{q\in S: k_m\cdot q\in T'\}$, so
    that $k_m\cdot T=T'$. Since $k_{n-m}\circ k_m=k_n$ for $n\ge m$, transport gives
    $k_n\cdot T=k_{n-m}\cdot T'$ for $n\ge m$, constant for large $n$; so $X_0(T)$ is in the domain. Hence
    the power property is $X_0$ of its extension; and $k_n$ applied to that extension is, by the same
    correspondence, $\{X_0(T''):T''\subseteq k_n\cdot S,\ X_0(T'')\text{ in the domain}\}$, constant
    for $n>s$, so the power property is in the domain and rigid. The boxed form follows from No Pure
    Contingency.

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
