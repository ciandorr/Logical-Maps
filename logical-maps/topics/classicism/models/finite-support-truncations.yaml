description: 'Proposition D.5, part 6 (p. 78): the arrows are the identity and the truncations $g_n$,
  $g_nm=\min\{m,n\}$, which compose as $g_n\circ g_m=g_{\min\{n,m\}}$. BF fails since an arrow sending
  $1$ to $0$ sends everything to $0$; Actuality fails because the strongest true proposition pinned down
  by $\{0,\ldots,n\}$ is $\{1_{\mathbb N}\}\cup\{g_m:m\ge n\}$, ever stronger as $n$ grows; Atomicity
  holds because every nonempty proposition contains some $g_n$ and each $\{g_n\}$ is pinned down by a
  finite set ($\{n-1,n,n+1\}$ for $n>0$, $\{0,1\}$ for $n=0$); Boolean Completeness fails because the
  strongest persistent property with extension $\mathbb N$ pinned down by $\{0,\ldots,n\}$ becomes ever
  stronger. In every part, $W_0^\ddagger$ is the set of finite subsets of $\mathbb N$ and the model is
  ideally full: a proposition is a set of arrows whose membership depends only on the arrows’ values on
  some finite set of individuals (it is pinned down by that set), an entity of a higher type is an applicative
  behaviour profile pinned down by a finite set in the same sense, and the individuals are the natural
  numbers acted on by the arrows themselves. Propositions and properties are thus about finitely many
  individuals and indifferent to how the arrows treat the rest. Evaluation point: the sole object, at
  the identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Boxed
  positive flags use the source’s explicit one-object No Pure Contingency observation, applied separately
  to each closed instance. Interpretation of Σ, fixed for this record: each relational constant denotes
  the top element of its type and each individual constant denotes one fixed individual. Under it the
  signature schemata fail. Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily.
  Witnessed Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but impossible
  of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\, .\,\top_\tau$ agree on $c$
  and differ; Independence (signature Σ) fails since $c$ denotes what the closed pure term $\top_\tau$
  denotes; Distinctness Maximalism (signature Σ) fails since $c=\top_\tau$ is a true identity that C(Σ)
  does not prove. Everything that implies these fails with them. Countable Boolean Completeness fails
  as well, at type $e\to t$: the property $E$ that the source shows to lack a least upper bound has as
  its extension a countable family of haecceities, and the extensional fullness the source invokes to
  put $E$ in the domain also puts in the relation pairing the haecceity of the $k$-th member of that family
  with the numeral $k$, which injects $E$ into the numerals. Observation of 23 September 2026. Distinctness-preserving
  collapse holds: for a true proposition $p$ pinned down by a finite set take as the witness $q$ the strongest
  true proposition pinned down by $\{0,\ldots,N\}$ for $N$ beyond the pinning set of $p$, namely $\{1_{\mathbb
  N}\}\cup\{g_m:m\ge N\}$. Under $g_n$ the only arrows reachable are $g_m$ with $m\le n$, so $\Diamond
  q$ holds at $g_n$ only if $n\ge N$, and then $g_n$ agrees with the identity on the pinning set of $p$
  and is in $p$. Boolean Completeness fails at type $t$ as well, which the source (n. 92) conjectures
  but does not show. Let $X$ be the family of singletons $\{g_n\}$ for even $n$. An upper bound of $X$
  pinned down by $\{0,\ldots,N\}$ contains, with any $g_m$ for $m\ge N$, every arrow agreeing with it
  on $\{0,\ldots,N\}$, so the least upper bound pinned down by that set is $X\cup\{1_{\mathbb N}\}\cup\{g_m
  : m\ge N\}$, which strictly shrinks as $N$ grows; hence $X$ has no least upper bound. $X$ is the extension
  of an element of the domain at type $t\to t$: the profile $\Phi\langle h,p\rangle:=\{i : i^tp\in X\}$
  satisfies the coherence condition $i^t\Phi\langle h,p\rangle=\Phi\langle i\circ h,i^tp\rangle$, and
  each of its values is pinned down by a finite set, the value at $\{g_n\}$ being $\{1_{\mathbb N}\}\cup\{g_m
  : m>n\}$, pinned down by $\{0,\ldots,n+1\}$, and the value at other propositions being computed likewise
  from the truncation order. Observation of Claude Fable 5.1 (Anthropic), 23 September 2026, prompted
  by Cian Dorr; not in the source. Relational Choice holds, necessarily. The model is ideally full, hence
  extensionally full at every object (Appendix D, the remark after Definition D.3): for any set $R$ of
  tuples from the domains at an object $V$, the intension that assigns to every arrow out of $V$ into
  an object $U$ a fixed set $R_U$ of tuples from $U$’s domains, with $R_V=R$, is pinned down by $\emptyset$,
  so it is the intension of an element of $V^{\bar\sigma\to t}$ with extension $R$ at $1_V$. Given a relation
  $U$ serial at $V$, choose for each $x$ a $y$ with $(Ux)y$, by choice in the metatheory; the graph is
  such an $R$, and its element $S$ is functional and a subrelation of $U$ at $1_V$, both conditions being
  unboxed. The closed Relational Choice instance is true at an arrow $h\colon W_0\to V$ iff it is true
  at $1_V$ in the truncation by $h$, whose domains at $V$ are those of the model, so it holds at every
  arrow and $\Box$Relational Choice follows. Cian Dorr’s observation of 23 September 2026. Inextensible
  Comprehension fails, at type $e\to t$, for the property of being even, which is in the domain as the
  constant intension $\{\langle b,h\rangle : b\text{ even}\}$, pinned down by $\emptyset$. Unpacking $\operatorname{Inextensible}$
  as in the left-to-right half of Dorr’s rigidity criterion (draft, Lemma 14, p. 7, with Lemma 13): even
  the unboxed matrix, evaluated at the identity, says that $Y$ is contained in every persistent (transport-closed)
  $B$ in the domain whose extension includes $Y$’s. For a finite $N^{\prime}$, the smallest such $B$ pinned
  down by $N^{\prime}$ is $B_{N^{\prime}}:=\{\langle b^{\prime\prime},i^{\prime}\rangle : i^{\prime\prime}(b)=b^{\prime\prime}\text{
  for some even }b\text{ and some arrow }i^{\prime\prime}\text{ agreeing with }i^{\prime}\text{ on }N^{\prime}\}$,
  which is transport-closed and pinned down by $N^{\prime}$. Now let $Y$ be coextensive with evenness
  and pinned down by a finite $N_0\subseteq[0,M_0]$; then $\langle b,i\rangle\in Y$ for every even $b$
  and every arrow $i$ fixing $N_0$ pointwise. Take $i:=g_n$ with $n\ge M_0$, an even $b>n$, and $N^{\prime}:=[0,n+1]$:
  the only arrow agreeing with $g_n$ on $[0,n+1]$ is $g_n$ itself, whose range $[0,n]$ omits $b$. Here
  even the universal property has no inextensible coextension, since $\operatorname{Inextensible}(\top_{et})$
  unfolds to $\Box$BF at type $e$. So $\langle b,i\rangle\in Y\setminus B_{N^{\prime}}$, and $Y$ is not
  even weakly inextensible, so Weakly Inextensible Comprehension fails too. Observation of 23 September
  2026, answering Cian Dorr’s question whether the failure of Actuality can be sharpened to a failure
  of Inextensible Comprehension. The type-$t$ Strong Leibniz Biconditionals fail although Atomicity holds,
  so the two come apart here. A strong world is an atom, and the atoms are the singletons $\{g_n\}$, since
  $\{1_{\mathbb N}\}$ is not pinned down by a finite set. Transported along $g_n$, $\{g_n\}$ becomes $\{k
  : k\circ g_n=g_n\}=\{1_{\mathbb N}\}\cup\{g_m : m\ge n\}$, which $\{g_n\}$ itself splits; so there is
  no strong world at all. BF fails at type $t$ as a consequence, by the recorded result that Atomicity
  (type $t$) and BF (type $t$) imply the type-$t$ Strong Leibniz Biconditionals. Directly: with $1$ and
  $0$ as individuals, $X:=\lambda p\, .\,(1\ne0\lor\Box p\lor\Box\neg p)$ is necessarily true of every
  proposition, since $g_0$ is the only arrow sending $1$ to $0$ and it transports every proposition to
  $\top$ or $\bot$; but at $g_0$ it fails of the contingent proposition $\{g_1\}$, which the domain there
  still contains. Observations of 23 September 2026, answering Cian Dorr’s questions whether the failure
  of BF sharpens to type $t$ and whether failures of Atomicity’s strengthening can be found where Atomicity
  holds; the derivation of BF’s failure from them and the direct counterexample, 25 September 2026.


  Review of 25 September 2026. Strong Leibniz-t fails by the nonidentity-idempotent singleton witness
  in writeups/strong-worlds-one-object-action-models.md. The successor quantifier ranges over all propositions
  at the target object, including ones outside the transported image. Its necessary form therefore also
  fails.  The same write-up gives an explicit finitely pinned BF-t counterexample, also covered by source
  footnote 92; BF-t and its boxed form now fail under the engine''s closure as well.'
