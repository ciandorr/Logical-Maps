definition: 'The model of finite-support-two-object-all-maps: two objects, $W_0=\mathbb N$ and $W_1=\{0\}$,
  with all functions between them as arrows, $W_i^\ddagger$ the finite subsets of $W_i$, ideally full.
  Evaluation point: $W_1$, at its identity arrow. The worlds it sees are its identity and the maps
  $c_n:0\mapsto n$ into $W_0$.


  Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each denotes the
  top element of its type.'
meets:
  sigma-top: This is the interpretation the definition fixes.
  codomain-intensions: The model is ideally full at both objects, and an intension whose value at an
    arrow depends only on the arrow's codomain is pinned down by $\emptyset$.
  extensionally-full: Every intension at $W_1$ is in the domain (see the argument for Atomicity), so any
    set of tuples is the extension at the identity of one of them.
arguments:
- holds:
  - strong-actuality
  - necessary-self-atoms-are-strong-atoms-r
  fails:
  - necessary-strong-actuality
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: At $W_1$ the true atom is $\{1_{W_1}\}$, which under $c_n$ becomes $\{!\}$, a set of one arrow,
    so it is a strong atom and Strong Actuality holds. It fails at $W_0$, which $c_n$ reaches, since
    Actuality fails there; so □Strong Actuality fails. The self-atoms are $\{1_{W_1}\}$ at $W_1$ and $\{!\}$
    at $W_0$, both strong atoms, and at relational types they carry one tuple (the argument of finite-support-two-object-all-maps);
    so Self-atoms are strong atoms holds at both objects, at every type.
- id: full-at-singleton
  holds:
  - atomicity-r
  - boolean-completeness-r
  - actuality
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    An arrow out of $W_1$ is fixed by its value at $0$, so any two arrows with a common target that
    agree on $\{0\}$ are equal, and every intension at $W_1$ is pinned down by $\{0\}$. The model being
    ideally full, every domain at $W_1$ holds all intensions of its type, ordered by inclusion at each
    arrow: a complete atomic Boolean algebra. So Atomicity and Boolean Completeness hold at every type,
    and the singleton of the identity arrow is a true proposition entailing every truth.
- id: necessary-atomicity-t
  fails:
  - necessary-atomicity-t
  - necessary-boolean-completeness-t
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    A closed sentence holds at $c_n$ iff it holds at the identity of $W_0$, the evaluation point of
    finite-support-two-object-all-maps. Boolean Completeness (type t) fails there by that model's
    argument; and Atomicity (type t) fails there, since BF holds and Inextensible Comprehension fails,
    while Atomicity (type t) with BF gives $\Box$Actuality, hence Actuality, which with BF gives
    Inextensible Comprehension. So neither is necessary at $W_1$.
- id: one-individual
  fails:
  - no-pure-contingency-r
  - barcan-r
  - infinity-e
  holds:
  - possible-infinity-e
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    At $W_1$ there is one individual, at $c_n$ the natural numbers. The closed pure sentence that there
    is exactly one individual is true at $W_1$ and false at each $c_n$, so No Pure Contingency fails, as
    does the Infinity Schema (type e) at $W_1$. BF fails for the haecceity of $0$: it holds necessarily of
    every individual, but not of every individual at $c_n$. The Axiom of Infinity (type e) holds at $c_n$,
    by the argument of finite-support-two-object-all-maps, so it is possible.
- id: plenitude
  holds:
  - plenitude-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    ND holds at $W_1$: $(c_n\cdot Y)_k=Y_{k\circ c_n}$, and $k\circ c_n$ is $1_{W_1}$ for the map back to
    $W_1$ and $c_m$ for each $m$ as $k$ ranges over the maps on $\mathbb N$, so transport along $c_n$
    determines $Y$ at every world. Given $U$ functional at the identity with values $Z_y$, put
    $X_k:=\{(k\cdot y,\bar a):\bar a\in(Z_y)_k\}$, well defined by ND, and in the domain, which at $W_1$
    holds every intension (see full-at-singleton); and $Xy=Z_y$.
- fails: [analytic-necessitism]
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  choice: free
  text: >-
    At $W_1$, at type $t$. The propositions at $W_1$ are all the sets of its arrows out, the
    identity and the $c_n$, each such set being pinned down by $\{0\}$; they are continuum many, and
    the model being extensionally full at $W_1$ there is a real number structure of propositions
    there, complete since every subset of its carrier is the extension of a subproperty. Suppose
    $\mathfrak R$ were a rigid one, necessarily a real number structure, with carrier $X$. Its boxed
    clauses hold at $c_1$ and along the arrows after it, and $X_{c_1}$, its instances at $W_0$, is a
    complete ordered field there. But no proposition $x$ at $W_0$ is determined by its transport
    along the arrow $k$ of $W_0$ collapsing $0$ and $1$: with $q$ the set of arrows out of $W_0$
    separating $0$ from $1$, pinned down by $\{0,1\}$ and containing no arrow after $k$,
    $y:=x\mathbin{\triangle}q$ is in the domain, differs from $x$, and has $k\cdot y=k\cdot x$; for
    $x\in X_{c_1}$ persistence gives $k\cdot y\in X_{k\circ c_1}$, inextensibility $y\in X_{c_1}$,
    and necessary distinctness $k\cdot y\ne k\cdot x$. So $X_{c_1}$ is empty, a contradiction, and
    Analytic Necessitism fails.
notes: 'Suggested by Cian Dorr on 16 October 2026 as a separation of Atomicity from □Atomicity, which no
  recorded model gave: Atomicity holds at every type at the singleton object, and fails at type t at the
  worlds into $W_0$. No Lean verification is claimed.'
