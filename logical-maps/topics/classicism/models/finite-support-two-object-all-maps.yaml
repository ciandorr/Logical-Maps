description: >-
  Use N and {0} with all maps between them, evaluated at N. BF holds there and fails at the
  accessible singleton; the paragraph gives the type-e failure. Atomlessness fails at N: the closed sentence
  $\exists x\, .\,\forall y\, .\,x=y$ denotes the set of arrows out of N whose target has a singleton individual
  domain, which is the singleton of the unique map to {0}. It is a nonempty proposition, hence possible,
  with no nonempty proper subproposition, so it is an atom below which Atomlessness finds no witness.
notes: The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References.
