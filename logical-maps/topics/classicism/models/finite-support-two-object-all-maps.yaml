description: 'Appendix D, p. 79, the paragraph beginning “One particularly interesting result”: two objects,
  $W_0=\mathbb N$ and $W_1=\{0\}$, with all functions between them as arrows, $W_i^\ddagger$ the finite
  subsets of $W_i$, and the model ideally full as in Proposition D.5. BF holds at $W_0$, since every map
  agrees on any finite set with a surjection, and fails at $W_1$, where $\forall y\,\Box\,x=y$ holds of
  the one individual but $\Box\forall y\,x=y$ does not; so BF holds without $\Box$BF. Atomlessness fails
  at $W_0$: the closed sentence that there is exactly one individual denotes the singleton of the unique
  map to $W_1$, a nonempty proposition with no nonempty proper subproposition. Evaluation point: $W_0$,
  at its identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Interpretation
  of Σ, fixed for this record: each relational constant denotes the top element of its type and each individual
  constant denotes one fixed individual. Under it the signature schemata fail. Let $c\in\Sigma$ have relational
  type $\tau$, so $c=\top_\tau$ necessarily. Witnessed Possibility fails for the pure formula $x\ne\top_\tau$,
  witnessed by $\bot_\tau$ but impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and
  $\lambda x\, .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes
  what the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since $c=\top_\tau$
  is a true identity that C(Σ) does not prove. Everything that implies these fails with them. Distinctness-preserving
  collapse fails at $W_0$: the transposition of $5$ and $6$ is an arrow with an inverse, so for any true
  $q$ the composite of a member of $q$ with the inverse carries the transposition into $q$, making $\Diamond
  q$ true there, while the true proposition that $5$ is fixed is false there. Relational Choice holds,
  necessarily. The model is ideally full, hence extensionally full at every object (Appendix D, the remark
  after Definition D.3): for any set $R$ of tuples from the domains at an object $V$, the intension that
  assigns to every arrow out of $V$ into an object $U$ a fixed set $R_U$ of tuples from $U$’s domains,
  with $R_V=R$, is pinned down by $\emptyset$, so it is the intension of an element of $V^{\bar\sigma\to
  t}$ with extension $R$ at $1_V$. Given a relation $U$ serial at $V$, choose for each $x$ a $y$ with
  $(Ux)y$, by choice in the metatheory; the graph is such an $R$, and its element $S$ is functional and
  a subrelation of $U$ at $1_V$, both conditions being unboxed. The closed Relational Choice instance
  is true at an arrow $h\colon W_0\to V$ iff it is true at $1_V$ in the truncation by $h$, whose domains
  at $V$ are those of the model, so it holds at every arrow and $\Box$Relational Choice follows. Cian
  Dorr’s observation of 23 September 2026. Atomicity fails at $W_0$ already at type $t$. A proposition
  at $W_0$ is a set of arrows out of $W_0$ whose membership depends on the target and on the values on
  a finite set; the singleton of the map to $W_1$ is one, and is an atom, but no singleton of a map $\mathbb
  N\to\mathbb N$ is, since such a map is not determined by finitely many values. So the nonempty proposition
  of the maps $h\colon\mathbb N\to\mathbb N$ with $h0=0$ has no atom below it: any nonempty subproposition
  pinned down by $N$ containing $h$ contains all arrows agreeing with $h$ on $N$, and those agreeing with
  it on $N\cup\{m\}$ form a smaller nonempty one. The following arguments, found independently on 25 September
  2026, overlap with those above. Further verdicts at $W_0$. Actuality fails: the strongest true proposition
  pinned down by $\{0,\ldots,N\}$ is the set of maps $W_0\to W_0$ agreeing with the identity there, and
  it strictly shrinks as $N$ grows, so no truth entails every truth; Actual Profile, $\Box$Actuality,
  Persistent Comprehension and the weak rigid comprehension principles fail with it. Atomicity fails at
  type $t$: the true proposition that $0$ is fixed is nonempty, and any nonempty proposition of maps $W_0\to
  W_0$ pinned down by a finite set splits into two nonempty propositions according to the value at a fresh
  individual, as all maps are arrows; so the Strong Leibniz Biconditionals fail at every type, boxed or
  not. Boolean Completeness fails at type $t$: any set $F$ of propositions is the extension of the profile
  $\langle h,p\rangle\mapsto\{i : i\cdot p\in F\}$, and for $F$ the family of propositions $A_m$ that
  a map $W_0\to W_0$ is constant on $\{0,\ldots,2m-1\}$ and first changes value at $2m$, the least superset
  of $\bigcup F$ pinned down by $\{0,\ldots,N\}$, the maps whose first change is at an even position or
  beyond $N$, strictly shrinks as $N$ grows, so $F$ has no least upper bound. The family is countable
  in the model''s sense, the relation pairing $A_m$ with the numeral $m$ being in the domain by extensional
  fullness, so Countable Boolean Completeness fails too. Necessity of Arithmetic nevertheless holds: at
  $W_0$ the finite cardinalities are the standard numerals and $I^*$ is true; at $W_1$ the numerals remain
  pairwise distinct, because they differ at the arrows back into $W_0$ and identity is necessary, $I^*$
  is again true, the numerals are the finite cardinalities by extensional fullness, and $\operatorname{Sum}$
  and $\operatorname{Prod}$ are standard, their graphs being in the domain; so every arithmetical sentence
  has its standard truth value at every world. $\Box$BF fails already at type $t$: at $W_1$ the arrow
  $c_n\colon W_1\to W_0$ picking $n$ sends a proposition $q$ to $\{j : c_{j(n)}\in q\}$ (with the arrow
  to $W_1$ added when $q$ contains $1_{W_1}$), a proposition pinned down by $\{n\}$, so the proposition
  that $0$ and $1$ are collapsed is in no such image; the profile holding at $\langle h,d\rangle$ iff
  $h=1_{W_1}$ or $d$ is in the image of $h$, pinned down by $\{0\}$, is necessary of every proposition
  at $W_1$ but not universal at the world $c_0$. Inextensible Comprehension fails at type $t\to t$, for
  the family $E$ of propositions $p_n$ that $n$ is fixed: for $Y$ inextensible with extension $E$ pinned
  down by the finite set $S$, pick $k\notin S$ and let $X$, pinned down by $S_X:=S\cup\{k\}$, hold at
  an arrow $h$ into $W_0$ exactly of the propositions $\{i : i(m)=n\}$ with $n\notin S_X$ and of the propositions
  $\{i : i(h(n))=n\}$ with $n\in S_X$; $X$ is necessary of every $p_n$, so $Y\le X$, yet at a map $h$
  fixing $S$ pointwise and moving $k$, where $h\cdot Y=Y$, the extension of $X$ omits $p_k$. B for pure
  sentences holds: every world can reach $W_0$ again, by a map $W_0\to W_0$ or by an arrow $c_n$ out of
  $W_1$, and a closed pure sentence true at $W_0$ is true at every arrow into $W_0$. B for sentences of
  $\Sigma$ holds under the record''s interpretation: a closed $\Sigma$-sentence denotes what $P(d,\ldots,d)$
  denotes for a pure $P$ and the individual $d$, and from any world some arrow into $W_0$ carries the
  current image of $d$ back to $d$, as all maps are arrows. Observations of Claude Fable 5.1 (Anthropic),
  25 September 2026; not in the source.'
