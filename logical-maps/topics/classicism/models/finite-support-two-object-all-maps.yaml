description: 'Appendix D, p. 79, the paragraph beginning “One particularly interesting result”: two objects,
  $W_0=\mathbb N$ and $W_1=\{0\}$, with all functions between them as arrows, $W_i^\ddagger$ the finite
  subsets of $W_i$, and the model ideally full as in Proposition D.5. BF holds at $W_0$, since every map
  agrees on any finite set with a surjection, and fails at $W_1$, where $\forall y\,\Box\,x=y$ holds of
  the one individual but $\Box\forall y\,x=y$ does not; so BF holds without $\Box$BF. Atomlessness fails
  at $W_0$: the closed sentence that there is exactly one individual denotes the singleton of the unique
  map to $W_1$, a nonempty proposition with no nonempty proper subproposition. Evaluation point: $W_0$,
  at its identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Interpretation
  of Σ, fixed for this record: each relational constant denotes the top element of its type and each individual
  constant denotes one fixed individual. Under it the signature schemata fail. Let $c\in\Sigma$ have relational
  type $\tau$, so $c=\top_\tau$ necessarily. Witnessed Possibility fails for the pure formula $x\ne\top_\tau$,
  witnessed by $\bot_\tau$ but impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and
  $\lambda x\, .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes
  what the closed pure term $\top_\tau$ denotes; Distinctness (signature Σ) fails since $c=\top_\tau$
  is a true identity that C(Σ) does not prove. Everything that implies these fails with them. Distinctness-preserving
  collapse fails at $W_0$: the transposition of $5$ and $6$ is an arrow with an inverse, so for any true
  $q$ the composite of a member of $q$ with the inverse carries the transposition into $q$, making $\Diamond
  q$ true there, while the true proposition that $5$ is fixed is false there. Relational Choice holds,
  necessarily. The model is ideally full, hence extensionally full at every object (Appendix D, the remark
  after Definition D.3): for any set $R$ of tuples from the domains at an object $V$, the intension that
  assigns to every arrow out of $V$ into an object $U$ a fixed set $R_U$ of tuples from $U$’s domains,
  with $R_V=R$, is pinned down by $\emptyset$, so it is the intension of an element of $V^{\bar\sigma\to
  t}$ with extension $R$ at $1_V$. Given a relation $U$ serial at $V$, choose for each $x$ a $y$ with
  $(Ux)y$, by choice in the metatheory; the graph is such an $R$, and its element $S$ is functional and
  a subrelation of $U$ at $1_V$, both conditions being unboxed. The closed Relational Choice instance
  is true at an arrow $h\colon W_0\to V$ iff it is true at $1_V$ in the truncation by $h$, whose domains
  at $V$ are those of the model, so it holds at every arrow and $\Box$Relational Choice follows. Cian
  Dorr’s observation of 23 September 2026. Atomicity fails at $W_0$ already at type $t$. A proposition
  at $W_0$ is a set of arrows out of $W_0$ whose membership depends on the target and on the values on
  a finite set; the singleton of the map to $W_1$ is one, and is an atom, but no singleton of a map $\mathbb
  N\to\mathbb N$ is, since such a map is not determined by finitely many values. So the nonempty proposition
  of the maps $h\colon\mathbb N\to\mathbb N$ with $h0=0$ has no atom below it: any nonempty subproposition
  pinned down by $N$ containing $h$ contains all arrows agreeing with $h$ on $N$, and those agreeing with
  it on $N\cup\{m\}$ form a smaller nonempty one.'
