- holds: [barcan-r]
  text: >-
    The full function domains and complete truth projection validate C, boxed BF, and boxed ND.

- holds: [functional-choice-r]
  text: >-
    Extensional fullness and metatheoretic choice give Relational Choice; full function domains
    give Plenitude, hence Functional Choice.

- fails: [atomicity-t]
  text: >-
    The sole atom $a$ witnesses Actuality and refutes Atomlessness, while $(0,1_A)$ is nonzero
    with no atom below it, refuting Atomicity at type $t$ and the full schema.

- holds: [necessary-intensional-choice-r]
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, at Cian Dorr's suggestion
  date: '2026-10-03'
  text: >-
    Here $\Box p$ is $p=\top$, so $\Box\exists x\, .\,Fx$ says $\bigvee_{x\in D_\sigma}F(x)=1_B$. Well-order
    $D_\sigma$ and put $G(x):=F(x)\land\neg\bigvee_{y<x}F(y)$. Then $G\le F$ pointwise, the $G(x)$ are
    pairwise disjoint, and $\bigvee_xG(x)=\bigvee_xF(x)=1_B$. With crisp equality
    $\exists x\, .\,(Gx\land\forall y\, .\,(Gy\to y=x))$ has value
    $\bigvee_x(G(x)\land\bigwedge_{y\ne x}\neg G(y))=\bigvee_xG(x)=1_B$, and so does its box. The function
    domains are full, so $G$ is in the domain. Every closed instance has value $1_B$, so Intensional
    Choice holds necessarily.

# --- 3 October 2026: Claude Fable 5.1, settling the verdicts the map had left open ---

- holds: [necessary-transversal-choice-r]
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's request
  date: '2026-10-03'
  text: >-
    Write $\pi$ and $\rho$ for the two coordinate projections of $B=\mathbf 2\times A$, both complete
    homomorphisms; $\Box p$ is $p=\top$, so a closed sentence is necessary when it is true and its
    $\rho$-coordinate is $1_A$. Under $\rho$ a sentence without $\Box$ takes its value in the
    Boolean-valued universe $V^A$, each $D_\sigma$ read as a ground set with crisp identity and the
    $\rho$-parts of relations on it ranging over all names for subsets of it. So a theorem of ZFC
    about relations on well-orderable sets has $\rho$-value $1_A$. Transversal Choice is of this kind:
    the least element of each class, $F(y):=\bigwedge_{y^{\prime}<y}\neg R(y^{\prime},y)$, is a
    transversal. Its truth is already derived, so it is necessary.

- holds: [necessary-countable-boolean-completeness-r]
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's request
  date: '2026-10-03'
  text: >-
    An effect of the single individual. The type-$e$ numerals are crisply three entities,
    $\mathbf 0_e$, $\mathbf 1_e$, and the empty cardinality, which is its own successor, so
    $\operatorname{Ctbl}(X)$ makes $X$ have at most three members internally; a finite subset of a
    ground set is a ground set, and finite families have joins in the complete pointwise order. So
    every closed instance has value $1_B$.
  withdrawn:
    date: '2026-10-16'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    reason: Countable Boolean Completeness now measures countability at every type. The argument covers
      only the instances counting at $e$; at type $t$, where $B$ is infinite and the numerals are the
      standard ones, it says nothing.

- holds: [axiom-of-infinity-t]
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's request
  date: '2026-10-03'
  text: >-
    $B$ is infinite and identity is crisp. The crisp characteristic function of the standard
    numerals is inductive, so finite cardinality has value $0_B$ off the standard numerals, and the
    $n$th numeral holds of the universal property of propositions with the value of "$B$ has exactly
    $n$ elements", $0_B$.

- fails: [necessary-boolean-completeness-t]
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's request
  date: '2026-10-03'
  text: >-
    For the algebra fixed in the definition. Take a countable maximal antichain $(a_n)$ in $A$, put
    $w_n:=(0,\neg a_n)$, choose $c_n\in A$, and let $X$ of type $t\to t$ have $\rho X(w_n)=c_n$ and
    $0$ elsewhere. With $s$ the fuzzy subset of $\omega$ given by the $c_n$, a direct computation
    gives $\rho[\![\exists y\, .\,\operatorname{GLB}_t(y,X)]\!]=\bigvee_{U\subseteq\omega}[\![s=\check
    U]\!]$, the value of "$s$ is a ground set". Forcing with $A$ adds a Cohen real; taking the $c_n$ to
    be its coordinates, $[\![s=\check U]\!]=0_A$ for every $U$, so the closed
    instance of Boolean Completeness (type $t$) has value exactly $a$: true, and not necessary. Whether
    it is necessary for an algebra adding no reals is open.
  revisions:
  - date: '2026-10-24'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: The argument used only that forcing with $A$ adds a Cohen real, which the algebras now fixed by
      cases on CH both do; the text names that property instead of the regular open algebra of the real line.

# migration: the old description's last sentence, then the old notes whole. The description's
# sentence on the boxed forms of Actuality, Plenitude and Functional Choice, whose failures are now
# derived, is dropped.

- fails: [necessary-countable-boolean-completeness-r]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  text: >-
    At $\sigma=\tau=t$, for the property $X$ of type $t\to t$ in the argument for the failure of
    $\Box$Boolean Completeness (type $t$). The crisp relation pairing $w_n$ with the $n$-th numeral, and
    nothing else, is in the full domain; the numerals at $t$ are crisply the standard ones (the argument
    for the Axiom of Infinity (type $t$)), so $\operatorname{Ctbl}_{t,t}(X)$ has value $1_B$. The
    instance of Countable Boolean Completeness at $X$ in its greatest-lower-bound form then has the
    value of $\exists y\, .\,\operatorname{GLB}_t(y,X)$, whose $A$-coordinate is $0_A$, so the closed
    instance is not necessary.
- fails: [forcing-possibilism]
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  text: >-
    The four-element Boolean algebra is finite, hence small, and present internally on any four
    propositions with the right order, the model being full. Forcing Possibilism would give a
    proposition $p\ne\top$ with exactly four propositions entailing it. In $B=\mathbf 2\times A$ the
    propositions below $(0,a)$ are the $(0,b)$ with $b\le a$, one of them if $a=0_A$ and infinitely many
    otherwise, $A$ being atomless; and those below $(1,a)$ are the $(\varepsilon,b)$ with $b\le a$, two
    of them if $a=0_A$ and infinitely many otherwise. No proposition has exactly four, so Forcing
    Possibilism fails.

- fails: [analytic-necessitism]
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  choice: free
  text: >-
    At type $t$, for the algebra fixed in the definition. Here $\Box p$ is $p=\top$, so a property
    $X$ of type $t\to t$ satisfies $\Box\forall x\,.\,(Xx\to\Box Xx)\land(\neg Xx\to\Box\neg Xx)$
    with first coordinate $1$ only if $X$ is crisp, taking the values $\top$ and $\bot$ alone, and
    likewise for relations; so a rigid real number structure $\mathfrak R$ is crisp, the check of a
    structure $(S,\le,+,\times,0,1,N)$ of the ground model, and $\Box\operatorname{Real}_t(\mathfrak
    R)$ asks that $\operatorname{Real}_t(\mathfrak R)$ have value $\top$, in particular
    $\rho$-coordinate $1_A$. That fails: forcing with $A$ adds a real $r$; the $A$-valued subproperty of $S$ naming the
    lower Dedekind cut of $r$ in $S$ is in the full domain and is bounded, but has no least upper
    bound in $S$ with positive value, since $[\![r=\check s]\!]=0$ for every ground real $s$. So the
    consequent of Analytic Necessitism is false at the evaluation point. Its antecedent is true: $B$
    has at least continuum many elements, the crisp characteristic functions of a set $S\subseteq B$
    in bijection with the reals and of its order, sum, product and natural numbers are in the full
    domains, and $\operatorname{Real}_t$ of this structure has $\pi$-coordinate $1$, every bounded
    crisp subset of $S$ having a least upper bound in it; so $\exists\mathfrak
    R\,.\,\operatorname{Real}_t(\mathfrak R)$ is not $\bot$ and its possibility is $\top$.
  revisions:
  - date: '2026-10-24'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: The argument used only that forcing with $A$ adds a real and that $B$ has at least continuum many
      elements, true of the algebras now fixed by cases on CH; the text says so instead of naming the
      regular open algebra of the real line.
- id: ch-contingent
  fails: [non-contingency-of-ch]
  by: Cian Dorr (the choice of algebra by cases on CH, after Bacon's §B.2), with Claude Opus 5.5 (Anthropic)
  date: '2026-10-24'
  writeup: full-boolean-valued-atom-and-atomless
  source:
    paper: bacon-mathematical-contingency
    locator: Online appendix §B.2, Lemmas B.1–B.4, pp. 7–9
  text: >-
    At type $t$. Write $\pi,\rho$ for the coordinate projections of $B=\mathbf 2\times A$. By extensional
    fullness, for a box-free formula whose relation variables are only applied to elements of a fixed
    carrier, with identity only between those elements, the $\pi$-coordinate is its truth in the full
    standard model over the same domains, and the $\rho$-coordinate its value in $V^A$, relations on a
    ground set ranging over all names for subsets of it. (Not every box-free sentence transfers: identity
    between relations is crisp, so box-free Extensionality has value $\bot$.) The sentences below are in
    this fragment. Both $V$ and $V^A$ have a real number structure on a subset of
    $D_t=B$: $|B|\ge2^{\aleph_0}$, and $|B|\ge(2^{\aleph_0})^{V^A}$, which is $\aleph_2$ in the first
    case (where $|B|=\aleph_2^{\aleph_0}=\aleph_2$, by CH) and $\aleph_1$ in the second. Real number structures are unique up to
    isomorphism, so $\exists\mathfrak R\, .\,\operatorname{Real}_t(\mathfrak R)\land\operatorname{CH}(\mathfrak R)$
    has $\pi$-coordinate $1$ iff CH holds in $V$ and $\rho$-coordinate $1_A$ iff CH holds in $V^A$, and
    likewise for $\neg\operatorname{CH}$, the value otherwise being $0$. CH takes opposite values in $V$
    and $V^A$, so each of $\forall\mathfrak R\, .\,\operatorname{Real}_t(\mathfrak R)\to\operatorname{CH}(\mathfrak R)$
    and $\forall\mathfrak R\, .\,\operatorname{Real}_t(\mathfrak R)\to\neg\operatorname{CH}(\mathfrak R)$ is
    $(1,0_A)$ or $(0,1_A)$, not $\top$. As $\Box p$ is $p=\top$, both disjuncts of Non-contingency of CH
    are $\bot$.
  revisions:
  - date: '2026-10-29'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, from a correction by OpenAI Codex (GPT-6),
      prompted by Daniel Kodsi, 25 October 2026, in Daniel Kodsi's pull request #18
    note: >-
      The first sentence claimed the transfer for every box-free sentence. That is false: with crisp
      identity of entities, take $F(*)=\bot$ and $G(*)=(1,0_A)$ at type $et$; coextension has value
      $(0,1_A)$ and identity $\bot$, so box-free Extensionality has value $\bot$. The transfer is now stated for
      formulas whose relation variables are only applied to carrier elements, with identity only on those;
      the real number structure and CH sentences are in that fragment, and the verdict is unchanged.
- holds: [arithmetic-necessitism]
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  choice: free
  text: >-
    At every type. The numerals are crisp entities, and the crisp characteristic function of the set
    of numerals at $\sigma$ is in the full domain and inductive with value $\top$, so $\mathbb
    N_\sigma$ is crisp, with the numerals as its instances. Here $\Box p$ is $p=\top$, so
    persistence, $\Box\forall n\,.\,\mathbb N_\sigma n\to\Box\mathbb N_\sigma n$, has value $\top$;
    inextensibility, $\Box\forall X\,.\,(\forall n\,.\,\mathbb N_\sigma n\to\Box Xn)\to\mathbb
    N_\sigma\le X$, has value $\top$, since for each $X$ both sides of the implication are
    $\bigwedge_n[\![Xn=\top]\!]$ over the numerals $n$; and distinct numerals are necessarily
    distinct, identity being crisp. So $\mathbb N_\sigma$ is rigid with necessarily distinct
    instances, whether or not $\Box I^*_\sigma$ holds.
notes: >-
  Full verification is in the write-up.


  The source uses an infinite individual domain, ZFC + CH, and the algebra adding $\aleph_2$ Cohen
  reals, to make CH contingent. The record keeps that algebra when CH holds and uses its dual when CH
  fails, so it requires only ZFC; the singleton individual domain does no harm, the real number
  structures living at type $t$. For an extensionally full model in ZFC, Relational
  Choice follows by representing a set-theoretic functional subrelation, and Plenitude then gives
  Functional Choice. The qualitative-contrast model of Classicism does not meet this fullness
  condition: its finite-support and symmetry restrictions exclude the needed selector. In the
  present model, $R(p,q):=(p\land q=\top)\lor(\neg p\land q=\bot)$ has Seriality and Functionality
  of value $1_B$, but $\exists f\,\forall p\,R(p,f(p))$ has value exactly $a$. The write-up
  includes the atomless-component calculation and the comparison with the older model. The finite
  check tests the Boolean calculation, not the infinite construction.

