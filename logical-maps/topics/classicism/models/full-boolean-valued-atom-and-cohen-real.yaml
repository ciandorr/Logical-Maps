references:
- paper: bacon-mathematical-contingency
  role: proof
  locator: pp. 22–23, note 55; online appendix §B.2, pp. 7–9 (PDF pp. 41–43)
  note: The full Boolean-valued construction, and the observation that a nonconstructible real makes an
