group: glued-free-monoid
settings:
  construction: 'Let $\mathcal C$ be the category of the two-object retract with two retractions: objects
    $W_0,W_1$, generated by $h:W_0\to W_1$ and $j_1,j_2:W_1\to W_0$ with $j_i\circ h=1_{W_0}$, so that $e_i:=h\circ
    j_i$ are idempotents with $e_i\circ h=h$. Let $\mathcal D:=\mathcal C*_{W_0}F$ be obtained by freely
    adjoining at $W_0$ the free monoid $F$ on countably many generators $f_1,f_2,\ldots$ (the pushout over
    the object $W_0$; its arrows are the alternating reduced words of non-identity arrows of $\mathcal C$
    and non-identity elements of $F$). Take the full action model over $\mathcal D$ with a single individual,
    evaluated at $1_{W_0}$, and glue the constants of Σ at the sites $f_k$: enumerate the pure formulas
    $P_k(\bar x)$, with $\bar x$ matching a tuple of distinct constants, whose existential closure is true
    at the root, choose a witness tuple for each, and let each constant denote the intension at $W_0$ whose
    value at an arrow $u\circ f_k$ is the extension at $u$ of the $k$-th witness and whose value at the
    remaining arrows is empty. Each part has one job (write-up, §4): the sites give Witnessed Possibility;
    the two retractions of $h$ make Strong Actuality fail at $W_0$ while it holds at $W_1$, so a pure sentence
    is contingent; and every arrow into $W_1$ factors through $h$, whose transports never yield the true
    atom of $W_1$, so Possibly Witnessed Possibility fails.'
meets:
  infinitely-many-propositions-everywhere: >-
    The model is full, and infinitely many arrows leave each object: the words $f_k$ at $W_0$, and
    $f_k\circ j_1$ at $W_1$.
  incomparable-free-arrows: >-
    The free generators $f_1$ and $f_2$ at $W_0$: in the pushout a reduced word is fixed under post-
    composition only by the identity when it ends in a free generator, and neither generator is a
    left multiple of the other.
  countably-many-arrows: >-
    The arrows of $\mathcal D$ are the reduced alternating words in the finitely many non-identity
    arrows of $\mathcal C$ and the countably many generators of $F$: countably many.
  full-model: Every intension of every relational type is present at both objects.
  full-action-model: A full action model with two objects.
  codomain-intensions: The domains are full.
  extensionally-full: The domains are full.
  identity-singletons: The singletons $\{1_{W_0}\}$ and $\{1_{W_1}\}$ are in the domains, the model being
    full.
  rigid-haecceity-disjunctions: Every intension is present at both objects, so for any set $E$ the intension
    $k\mapsto k\cdot E$ is in the domain; a relation is weakly inextensible at a world iff it lies below
    that intension over its extension there, and with persistence a weakly rigid relation equals it, so
    the rigid relations are exactly these, as in the group of full action models.
  one-individual: The construction fixes a single individual at each object.
  infinitely-many-propositions: Infinitely many arrows leave $W_0$ (the sites $f_k$ alone), and the propositions
    are all sets of them.
  nonidentity-arrow: $h$, or any site $f_k$.
  nonepic-arrow: '$h$: $e_1\circ h=1_{W_1}\circ h$ with $e_1\ne1_{W_1}$.'
  returning-arrow: $h$, which $j_1$ retracts.
  noninvertible-retracted-arrow: $h$ is retracted by $j_1$ and $j_2$ but has no inverse, since $h\circ
    j_i=e_i\ne1_{W_1}$.
  separated-retractions: $h$ has the retractions $j_1\ne j_2$, and these remain its only retractions in
    $\mathcal D$ (write-up, Corollary 3); the proposition $\{j_1\}$ at $W_1$ separates them.
  unretracted-arrow: '$f_1$: by the cancellation lemma of the write-up, $x\circ f_1=1_{W_0}$ would need
    a left inverse of $f_1$ in the free monoid.'
  trivial-isomorphisms-everywhere: By the cancellation lemma an isomorphism has only invertible syllables,
    and neither $\mathcal C$ nor $F$ has a non-identity invertible element ($h\circ j_i=e_i\ne1$).
  irreversible-arrow: 'The world $f_1$: no arrow $x$ has $x\circ f_1=1_{W_0}$, so no world after $f_1$
    makes the actual-world proposition true.'
arguments:
- id: witnessed-possibility
  holds:
  - witnessed-possibility-r
  writeup: full-double-retraction-glued-constants
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: 'The write-up, §§1–2, verifies the gluing at the root: the sites $f_k$ are right-cancellable with
    pairwise disjoint left ideals in $\mathcal D$, so the glued intensions are well defined and, the model
    being full, in the domain at $W_0$; at the site $f_k$ the constants denote the $k$-th witness tuple.
    If $\exists\bar x\,P$ is true at the root, $P$ is enumerated and $P[\bar c]$ holds at its site.'
- id: possibly-witnessed-possibility
  fails:
  - possibly-witnessed-possibility-r
  writeup: full-double-retraction-glued-constants
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: Strong Actuality fails at $W_0$, where $h$ has the two retractions $j_1,j_2$, and holds at $W_1$,
    where no non-identity arrow has a retraction (write-up, Corollary 3), so the true atom $\{1_{W_1}\}$
    is a strong atom there; a closed pure sentence being true at an arrow iff true at its target, the
    pure sentence SA is true exactly at the worlds with target $W_1$. Let $c$ be a constant of type $t$
    and $P(x)$ say that SA holds and $x$ is a true atom. $\Diamond\exists x\,P$ holds at the root, at
    the world $h$. But every arrow $W_0\to W_1$ is $h\circ v$, so at any world with target $W_1$ the constant
    denotes a transport along $h$ of a proposition at $W_0$, which contains $1_{W_1}$ iff it contains
    $e_1$ (as $e_1\circ h=h$) and so is not $\{1_{W_1}\}$; at worlds with target $W_0$, SA fails. So $P[c]$
    is possible nowhere (write-up, §3.3).
- id: pure-b
  holds:
  - pure-b-r
  writeup: full-double-retraction-glued-constants
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: 'Every object reaches every object ($h$ forward, $j_1$ back). A closed pure sentence true at the
    root is therefore possible at every world: at a world with target $W_0$ it holds there, and at one
    with target $W_1$ it holds after $j_1$ (write-up, §3.4).'
notes: 'Built on 14 October 2026 to separate Witnessed Possibility from Separated Structure (equivalently
  Possibly Witnessed Possibility) and from Strong Actuality, which no model with Witnessed Possibility
  refuted: the coalesced sums of Appendix E have it without No Pure Contingency but keep both, and the
  glued one-object models have all of Logical Necessity. Bacon derives both Independence and Separated
  Structure from Logical Necessity; the recorded result from Witnessed Possibility to Independence and
  this model show that only the latter needs No Pure Contingency. The construction is a recipe: freely
  adjoining the free monoid of sites at the root of any category and gluing the constants gives Witnessed
  Possibility at the root while preserving the category''s retractions, epimorphisms and reachability
  (write-up, §4). Being full, the model cannot separate Witnessed Possibility from the principles every
  full model satisfies. The failures of No Pure Contingency, Converse Witnessed Possibility and Modal
  Freedom are derived by the engine from Witnessed Possibility without Possibly Witnessed Possibility;
  the write-up, §3.2, gives them directly from the contingency of the pure sentence Strong Actuality.'
