description: 'The model of full-free-monoid-glued-constants with the type-e modalized set replaced by
  a singleton at every world, with identity counterparts; equivalently the full action model over the
  free monoid on countably many generators with the trivial M-set at type e, with the constants glued
  as there. Evaluation point: the root. The companion write-up records what changes.'
notes: 'Shows that Logical Necessity is consistent with there being exactly one individual, necessarily.
  Two individual constants of Σ co-denote at every world, which Logical Necessity tolerates. The Infinity
  principles at type e fail at every world; those at type t hold as in the thread variant. □Relational
  Choice holds: every truncation is a standard model over a frame isomorphic to the original, and Relational
  Choice holds in every full model given choice in the metatheory. Distinctness-preserving collapse holds:
  let $a$ be the proposition true at the actual world alone (the identity arrow). For any true $p$, take
  $q:=a$ in the definition of $\Box_{\ne}p$: under a non-identity arrow $i$, $\Diamond a$ would need an
  arrow $k$ with $k\circ i$ the identity, and none exists, since no arrow leads back to the actual world;
  under the identity, $p$ holds. So every truth is $\Box_{\ne}$-necessary, although ND fails.'
