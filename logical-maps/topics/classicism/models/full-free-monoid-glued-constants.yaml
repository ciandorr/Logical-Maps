description: 'Let M be the free monoid of finite sequences of natural numbers under concatenation; its
  induced Kripke frame is the infinitely branching tree with the initial-segment relation and the empty
  sequence as root. Take the standard model over this frame (propositions all sets of accessible worlds,
  function types all homomorphisms) whose individuals at a world are the functions from the infinite branches
  through that world to the natural numbers, with restriction as counterpart; equivalently, the full action
  model over M with this surjective M-set at type e. This higher-order frame is isomorphic to the coalesced
  sum of countably many copies of itself, so coalesced sums of Σ-models over it are again Σ-models over
  it. Enumerate the Σ-sentences satisfiable in some Σ-model over the frame, choose a model of each, and
  glue them by the book’s Definition 18.15. Evaluation point: the root. The write-up carries the full
  verification.'
notes: 'Promoted from conjectured on 22 September 2026. The gap in the source was its Theorem A.8, stated
  without proof, and the deferred type-e case; the write-up closes both by choosing a self-similar individual
  domain and applying the book’s coalesced sums. The signature is assumed countable; for a larger signature
  use a tree with as many branches. Distinct constants of one type denote distinct entities at the root,
  since every domain, including the individuals, has more than one element; they are also possibly identical.
  ND and B fail at type t already. Possibility Maximalism (pure) fails because Actuality is necessary while its negation
  is consistent with C. Everything else follows from the listed principles by the map’s results. Bacon’s
  interpretation of his predicates Pure and Fun in this model, and the principles stated with them, are
  not recorded, following Zachary Goodsell’s decision to keep the map to the logical vocabulary and the
  constants of Σ. □Relational Choice holds: every truncation is a standard model over a frame isomorphic
  to the original, and Relational Choice holds in every full model given choice in the metatheory. Distinctness-preserving
  collapse holds: let $a$ be the proposition true at the actual world alone (the identity arrow). For
  any true $p$, take $q:=a$ in the definition of $\Box_{\ne}p$: under a non-identity arrow $i$, $\Diamond
  a$ would need an arrow $k$ with $k\circ i$ the identity, and none exists, since no arrow leads back
  to the actual world; under the identity, $p$ holds. So every truth is $\Box_{\ne}$-necessary, although
  ND fails.'
changes:
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Replaced the type-e domain. A copy of the powerset of M is not isomorphic to the product of
    its children’s domains under truncation, so the coalesced sum of copies of the frame would not return
    the frame; the thread domain is. The record remains conjectured.
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Promoted to proved with a full write-up: the gluing theorem is derived from the book’s coalesced
    sums and the frame’s self-similarity, with a branch-indexed type-e domain. Verified the listed principles;
    added the Strong Leibniz Biconditionals, their necessitation and the Axiom of Infinity at type e.
    Renamed to distinguish it from the singleton-individual variant.'
