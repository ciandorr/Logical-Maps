settings:
  construction: 'Let $M:=F_\infty * E * B * \mathbb Z_2$ be the free product of monoids, where $F_\infty$
    is the free monoid on countably many generators $f_1,f_2,\ldots$, $E=\{1,e\}$ with $e^2=e$, $B=\langle
    b,c\mid cb=1\rangle$ is the bicyclic monoid, and $\mathbb Z_2=\{1,s\}$ with $s^2=1$. Take the full one-object
    action model over $M$ (Classicism, §3.5) with a single individual, evaluated at the identity. The constants
    of Σ are glued at the sites $f_k$: enumerate the pure formulas $P_k(\bar x)$, with $\bar x$ matching
    a tuple of distinct constants, such that $\exists\bar x\,P_k$ is true at the identity, choose a witness
    tuple for each, and let each constant denote the intension whose value at an arrow $u\circ f_k$ is $u$
    applied to the $k$-th witness and whose value at the remaining arrows is empty. Each factor has one
    job (write-up, §4): the free generators are the gluing sites that give Logical Necessity; the idempotent
    $e$ is a non-epic arrow, so BF fails; $b$ is retracted by $c$ but not invertible, so ND-necessity and
    two-hat necessity come apart; $s$ is a non-identity unit, so some truth is not 5-necessary.'
meets:
  fixed-arrow: >-
    The idempotent $e$: $e\cdot e=e$.
  incomparable-free-arrows: >-
    The free generators $f_1$ and $f_2$: in the free product only $1$ fixes a free generator, and
    neither is a left multiple of the other.
  countably-many-arrows: >-
    The arrows are the reduced alternating words in the finitely many non-identity arrows of the
    retract category and the countably many generators of the free monoid: countably many.
  one-object-action-model: It has one object.
  full-model: Every intension of every relational type is present.
  full-action-model: A full action model with one object.
  codomain-intensions: The domains are full.
  extensionally-full: The domains are full.
  one-individual: The construction fixes a single individual.
  infinitely-many-propositions: $M$ is infinite and the propositions are all its subsets.
  nonidentity-arrow: Any of $e$, $b$, $s$ or $f_1$.
  nonepic-arrow: $1\circ e=e\circ e$ with $1\ne e$; also $1\circ b=(b\circ c)\circ b$.
  unretracted-arrow: '$e$: no reduced word $x$ has $x\circ e=1$, the last syllable of $x\circ e$ being
    $e$ or a product with it.'
  returning-arrow: '$b$, which $c$ retracts: $c\circ b=1$.'
  noninvertible-retracted-arrow: '$b$: $c\circ b=1$ but $b\circ c\ne1$ in $B$.'
  nonidentity-isomorphism: $s$, with $s\circ s=1$.
  irreversible-arrow: '$e$: no arrow after it returns to the identity, so no world after $e$ makes $\{1\}$
    true.'
  identity-singletons: $\{1\}$ is in the domain, the model being full.
  unique-retractions-everywhere: By Lemma 3 of the write-up, $xu=1$ forces the syllables of $x$ to be,
    in reverse order, left inverses in their own factors of the syllables of $u$, and left inverses are
    unique in each factor ($c^k$ for $b^k$, $s$ for $s$, none for $e$, the generators or any $b^ic^j$
    with $j\ge1$); so every arrow has at most one retraction.
  rigid-haecceity-disjunctions: Every intension is present at the one object, so for any set $E$ the intension
    $k\mapsto k\cdot E$ is in the domain. A relation is weakly inextensible at a world iff it lies below
    that intension over its extension there, that being the smallest intension whose transports contain
    the extension, and with persistence a weakly rigid relation equals it; so the rigid relations, the
    necessarily weakly rigid ones, are exactly these, as in the group of full action models.
arguments:
- id: logical-necessity
  holds:
  - logical-necessity-r
  writeup: full-free-product-glued-constants
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: 'The write-up, §2, verifies the gluing: the sites $f_k$ are right-cancellable with pairwise disjoint
    left ideals $Mf_k$, so the glued intensions are well defined and, the model being full, in the domain;
    at the site $f_k$ the constants denote the $k$-th witness tuple, and one-object models make pure sentences
    world-independent, which gives both directions of the schema.'
notes: Built on 14 October 2026 to separate Logical Necessity from what the glued free-monoid models also
  satisfy. The free product is chosen so that each factor contributes one failure while the gluing sites
  stay free; models over $F_\infty * E$, $F_\infty * B$ or $F_\infty * \mathbb Z_2$ alone would disaggregate
  the failures (write-up, §4). Being full, the model satisfies Rigid Comprehension, Actuality, Atomicity,
  Boolean Completeness and the choice principles, so it cannot separate Logical Necessity from those;
  that needs a non-full gluing-closed construction. The failure of BF is derived by the engine from the
  non-epic arrow $e$ (write-up, §3). Strong Actuality, Rigid Power and Weakly Rigid Power, with their
  boxed forms, were settled on the evening of 14 October 2026 by the general arguments for full models
  with unique retractions (write-up, §3).
history:
- date: '2026-10-14'
