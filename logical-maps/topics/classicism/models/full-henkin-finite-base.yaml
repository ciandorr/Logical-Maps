settings:
  construction: The individual domain $D_e$ is finite with at least two members (with independent
    constants, at least twice as many as Σ has relational constants, plus one for each individual
    constant), $D_t=\{0,1\}$, and every relational type holds all functions between its domains.
  metatheory: zfc
meets:
  finitely-many-individuals: The individual domain is finite.
  several-individuals: There are at least two individuals.
arguments: []
notes: >-
  With independent constants (the generated variant), it witnesses the consistency of Independence
  (signature Σ) with Extensionality and the failure of both Infinity schemata, for every finite Σ whose
  constants all have types in which $e$ occurs. Codex's model is the case Σ $=\{c\}$, $c$ of type $et$
  denoting $\{0\}$, over $\{0,1\}$; two individuals suffice for one relational constant only. Whether
  infinitely many constants are possible with finitely many individuals is open (write-up
  extensional-independent-constants).
