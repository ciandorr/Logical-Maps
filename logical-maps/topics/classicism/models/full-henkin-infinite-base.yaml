description: >-
  Use the ordinary full Henkin interpretation with $D_e$ countably infinite, $D_t=\{0,1\}$, and every
  admitted function type containing all functions between its domains; by Proposition 3.7 it is a model of
  C. Identity is genuine identity and $\Box$ is the identity on truth values, so $\Diamond$ is truth.
  Because every domain is full, $\operatorname{FiniteCardinality}_\sigma$ holds exactly of the values of the
  numerals $\operatorname{Suc}_\sigma^k\mathbf{0}_\sigma$: the characteristic function of that set is in the
  domain and is inductive. At type $e$ the $k$-th numeral says that there are exactly $k$ individuals,
  which is false for every $k$, so the Axiom of Infinity at type $e$ holds, and with it the schema. At type
  $t$ the second numeral holds of $\lambda p\, .\,\top$, so the Axiom of Infinity at type $t$ fails, as
  does the third instance of the schema, and Possible Infinity at type $t$ fails because $\Diamond$ is
  truth. Possibility (pure) fails since the C-consistent pure sentence that there is exactly one individual
  is false. The Fregean axiom holds in any two-valued model.
notes: >-
  Explicit specialization of the source's standard Henkin construction to an infinite individual domain,
  recorded to separate the type-$e$ infinity principles from the type-$t$ ones: it satisfies the Axiom of
  Infinity at type $e$, hence Possible Infinity at type $e$, while violating the Axiom of Infinity at
  type $t$. It also shows that the sentence used in pure-possibility-implies-axiom-of-infinity-t, that there
  could be any positive number of individuals, does not follow from the Axiom of Infinity at type $e$:
  here there is not possibly exactly one individual.
