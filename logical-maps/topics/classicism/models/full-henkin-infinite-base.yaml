description: 'Use the ordinary full Henkin interpretation with $D_e$ countably infinite, $D_t=\{0,1\}$,
  and every admitted function type containing all functions between its domains; by Proposition 3.7 it
  is a model of C. Identity is genuine identity and $\Box$ is the identity on truth values, so $\Diamond$
  is truth. Because every domain is full, $\operatorname{FiniteCardinality}_\sigma$ holds exactly of the
  values of the numerals $\operatorname{Suc}_\sigma^k\mathbf{0}_\sigma$: the characteristic function of
  that set is in the domain and is inductive. At type $e$ the $k$-th numeral says that there are exactly
  $k$ individuals, which is false for every $k$, so the Axiom of Infinity at type $e$ holds, and with
  it the schema. At type $t$ the second numeral holds of $\lambda p\, .\,\top$, so the Axiom of Infinity
  at type $t$ fails, as does the third instance of the schema, and Possible Infinity at type $t$ fails
  because $\Diamond$ is truth. Possibility (pure) fails since the C-consistent pure sentence that there
  is exactly one individual is false. The remaining positive assertions hold as in every two-valued full
  model: each boxed principle reduces to its unboxed form; coextensive relations are identical, so Extensionality,
  the Fregean axiom and its modalized form hold; every relation is persistent, inextensible and Gallin-extensional,
  giving the comprehension principles; Actuality holds with top as the actual world; each relational type
  is the complete atomic Boolean algebra of subsets of a domain, giving Atomicity and Boolean Completeness;
  Tractarianism is a tautology; ND holds outright, giving C5; every closed sentence is non-contingent;
  and the choice principles hold because every function between domains is present, using choice in the
  metatheory to select from a serial relation on an infinite domain.'
notes: 'Explicit specialization of the source''s standard Henkin construction to an infinite individual
  domain, recorded to separate the type-$e$ infinity principles from the type-$t$ ones: it satisfies the
  Axiom of Infinity at type $e$, hence Possible Infinity at type $e$, while violating the Axiom of Infinity
  at type $t$. It also shows that the sentence used in pure-possibility-implies-axiom-of-infinity-t, that
  there could be any positive number of individuals, does not follow from the Axiom of Infinity at type
  $e$: here there is not possibly exactly one individual. It also witnesses the consistency of C with
  Goodsell''s $I$, assumed in n. 14 of Arithmetic is Necessary: with infinitely many individuals the numerals
  are pairwise distinct, so $\operatorname{Suc}_e$ is injective on finite cardinalities and $I^*$, hence
  $I$, is true. Signature principles are not listed, since they depend on how the nonlogical constants
  are interpreted, except No Contingency (signature Σ) and B for sentences of Σ, which hold in a one-world
  model however they are interpreted. With Boolean Completeness listed, the model also shows Countable
  Boolean Completeness consistent with C.'
