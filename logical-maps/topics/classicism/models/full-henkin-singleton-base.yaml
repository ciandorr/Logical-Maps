description: 'Use the ordinary full Henkin interpretation: D_e is a singleton, D_t={0,1}, and every admitted
  function type contains all functions between its domains. Domains are finite by induction on types,
  so every serial relation has a functional subrelation and, when the output type is relational, a selecting
  operation. Equality is genuine equality and Box is the identity on truth values. These facts verify
  the listed positive assertions. The two finite base domains refute the infinity assertions, top is an
  atom, and the possible existence of two individuals is false although its pure sentence is C-consistent.'
notes: >-
  Explicit specialization of the source’s standard Henkin construction to a singleton individual
  domain. No independent checking or formal verification is claimed. The model is a standard model of
  extensional classical type theory in which the defined necessity is truth: a boxed principle holds
  exactly when its unboxed form does, coextensive relations are identical, every relation is rigid in
  every recorded sense, the Boolean algebra at each relational type is the complete atomic algebra of
  subsets of the domain, and every closed sentence is non-contingent. The pure schemata fail because
  C-consistent sentences about how many individuals there are can be false. Signature principles are not
  listed, since they depend on how the nonlogical constants are interpreted.
