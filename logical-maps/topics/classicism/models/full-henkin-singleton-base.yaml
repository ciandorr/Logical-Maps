description: 'Use the ordinary full Henkin interpretation: D_e is a singleton, D_t={0,1}, and every admitted
  function type contains all functions between its domains. Domains are finite by induction on types,
  so every serial relation has a functional subrelation and, when the output type is relational, a selecting
  operation. Equality is genuine equality and Box is the identity on truth values. These facts verify
  the listed positive assertions. The two finite base domains refute the infinity assertions, top is an
  atom, and the possible existence of two individuals is false although its pure sentence is C-consistent.'
notes: Explicit specialization of the source’s standard Henkin construction to a singleton individual
  domain. No independent checking or formal verification is claimed.
