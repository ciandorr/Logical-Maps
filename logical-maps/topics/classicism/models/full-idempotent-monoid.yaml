description: The full model on {1,k} with k²=k, evaluated at its sole object. Refer to the cited paragraph
  for the four propositions and the failure witnesses.
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Interpretation
  of Σ, fixed for this record: one designated relational constant $c$ of type $\tau=\bar\sigma t$ denotes
  $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of the model, the actual-world proposition
  described above; every other relational constant denotes the top element of its type and every individual
  constant one fixed individual. Under it: No Contingency (signature Σ) fails, since the Σ-sentence $\forall\bar
  x\, .\,c\bar x$ denotes $a$, true and contingent; B for sentences of Σ fails, since under any arrow
  that no arrow composes back into $a$, $\Diamond a$ is false, so $\Box\Diamond a$ fails; Witnessed Possibility
  fails for the pure formula $x=\top_\tau$, witnessed by $\top_\tau$, since $\Diamond(c=\top_\tau)$ is
  $\Diamond\Box a$ and $a$ is necessary at no arrow; Separated Structure fails with it, being equivalent
  to Possibly Witnessed Possibility; Independence (signature Σ) and Distinctness Maximalism (signature
  Σ) fail through the other relational constants, Σ being assumed to contain at least one: such a constant
  $c''$ of type $\tau''$ denotes what the closed pure term $\top_{\tau''}$ denotes, and $c''=\top_{\tau''}$
  is a true identity that C(Σ) does not prove. The designated constant refutes neither: closed pure terms
  denote entities fixed by every arrow (Classicism, §3.5, p. 58), whereas $a$ is fixed by no arrow but
  the identity, so no closed pure term denotes $\lambda\bar x\, .\,a$. Everything that implies these fails
  with them. □Relational Choice holds: the truncation of a full action model at any arrow is again a full
  action model, its domains at the reachable objects being unchanged, and Relational Choice holds in every
  full model given choice in the metatheory (Classicism, p. 61). Distinctness-preserving collapse holds:
  for a true $p$ take $q:=\{1\}$; under $k$, $\Diamond\{1\}$ would need $x\circ k=1$, but $x\circ k=k$
  for both arrows, so it fails there, and under $1$, $p$ holds.


  Review of 25 September 2026. Strong Leibniz-t fails by the nonidentity-idempotent singleton witness
  in writeups/strong-worlds-one-object-action-models.md. The successor quantifier ranges over all propositions
  at the target object, including ones outside the transported image. Its necessary form therefore also
  fails. The earlier positive flag and supporting paragraph were erroneous; their original dated change
  remains as superseded history.'
