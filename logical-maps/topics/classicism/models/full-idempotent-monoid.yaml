description: The full model on {1,k} with k²=k, evaluated at its sole object. Refer to the cited paragraph
  for the four propositions and the failure witnesses.
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Interpretation
  of Σ, fixed for this record: each relational constant denotes the top element of its type and each individual
  constant denotes one fixed individual. Under it the signature schemata fail. Let $c\in\Sigma$ have relational
  type $\tau$, so $c=\top_\tau$ necessarily. Witnessed Possibility fails for the pure formula $x\ne\top_\tau$,
  witnessed by $\bot_\tau$ but impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and
  $\lambda x\, .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes
  what the closed pure term $\top_\tau$ denotes; Distinctness (signature Σ) fails since $c=\top_\tau$
  is a true identity that C(Σ) does not prove. Everything that implies these fails with them. In a one-object
  action model whose propositions are all the sets of arrows, every singleton $\{h\}$ is a strong world
  proposition: seen from an arrow $i$ it becomes $\{j : j\circ i=h\}$, and every proposition at that world
  is the shift $\{j : j\circ i\in Y\}$ of a root proposition $Y$, whose membership for such $j$ depends
  only on whether $h\in Y$; so it entails every proposition or its negation, at every world. Any possible
  proposition contains some arrow, so the type-t Strong Leibniz Biconditionals hold at every world. □Relational
  Choice holds: the truncation of a full action model at any arrow is again a full action model, its domains
  at the reachable objects being unchanged, and Relational Choice holds in every full model given choice
  in the metatheory (Classicism, p. 61).'
was_conjectured: true
