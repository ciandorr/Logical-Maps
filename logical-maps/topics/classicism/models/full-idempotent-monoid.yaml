  summary: >-
    Added Relational Choice at Cian Dorr's direction. With choice in the metatheory a serial relation
    has a functional subrelation, and a full model contains every intension, so that subrelation is in the
    domain; see Classicism, p. 61, on the principles common to full models.
    The propositions at the evaluation object are the subsets of the two arrows out of it, four in all,
    and every intension of a full model is present, so the numerals are the finite cardinalities and the
