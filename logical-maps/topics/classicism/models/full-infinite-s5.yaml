id: full-infinite-s5
name: 'Full action model: infinite S5'
certificate:
  source_id: misc
  produced_by: Cian Dorr, 7 October 2026
  recorded_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 7 October 2026
  checked_by: []
  date: '2026-10-07'
sources:
- Cian Dorr, suggestion of 7 October 2026, as a basic reference model.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, pp. 58–61 (full action models).
source_names:
- Dorr 7 Oct
- Classicism
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61
  note: Full action models; on this category the construction is the standard full S5 model.

group: full-action-models
settings:
  construction: >-
    The category whose objects are the members of an infinite set $W$, with exactly one arrow from
    each object to each object, evaluated at any object. The arrows out of an object correspond to
    the members of $W$, so this is the full S5 model with world set $W$ and a constant domain of
    individuals.
  individuals: singleton
  sigma: top
meets:
  arbitrary-infinite-set: $W$ is any infinite set.
  numbered-returning-arrows:
    when: {metatheory: [choice, no-countable-choice-reals]}
    text: >-
      $h_n$ is the arrow to world $n$, and $r_n$ the arrow back, once $W$ contains the natural
      numbers: by choice, or because $W$ is $\mathbb N$ in the variant without countable choice.
      With socks $W$ is their union, and no such arrows need be given.
  invertible-arrows: >-
    The unique arrow from $u$ to $v$ is inverted by the unique arrow from $v$ to $u$.
  epic-arrows: >-
    Every arrow is invertible; and on the individuals every arrow is the identity.
  retractions: >-
    Each arrow out of the evaluation object is retracted by the arrow back.
  unique-retractions-everywhere: >-
    Between two objects there is only one arrow, so an arrow has exactly one retraction.
  returning-arrow: >-
    The arrow to any other object, retracted by the arrow back.
  coherent-retractions: >-
    $r_g$ is the unique arrow back; any two arrows with the same ends are equal, so
    $r_{x\circ g}\circ x=r_g$.
  nonidentity-arrow: >-
    The arrow to any other object.
  infinitely-many-propositions: >-
    The propositions are all the sets of arrows out of the evaluation object, one for each subset
    of $W$.
  sigma-apart: The construction does not mention Σ.

arguments:

- holds: [no-pure-contingency-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-07'
  text: >-
    Any two objects are isomorphic, by the unique arrow between them, and composing with it carries
    the model based at one to the model based at the other. So a closed sentence has the same truth
    value at every object, and a true one is necessary. (The engine also derives this verdict, but
    the general argument for the Σ-schemata needs it recorded.)

- fails: [intensional-choice-r, relational-choice-r]
  when: {metatheory: socks}
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, after Cian Dorr's construction of 7 October 2026
  date: '2026-10-08'
  text: >-
    At type $t$, with the worlds the union $W$ of the socks. The propositions at a world are the
    sets of arrows out of it, one for each set of worlds; write $[v]$ for the one true at world $v$
    alone. Intensional Choice: let $F$ hold at (the arrow to) each world $w$ of the propositions
    $[v]$ with $v$ in the pair after $w$'s. It is in the domain, the model being full, and
    necessarily instantiated. A $G\le F$ necessarily uniquely instantiated holds at each $w$ of a
    single $[v]$, so $w\mapsto v$ sends each sock to a sock of the next pair, and iterated from one
    member of $P_0$ it would choose a sock from every pair. Relational Choice: let $U$ relate, at the
    evaluation world, each $[w]$ to the $[v]$ with $v$ in the pair after $w$'s, and every other
    proposition to every proposition; a functional subrelation gives the same function. So both
    fail, with one individual as with the socks as individuals. (Cian Dorr's construction of the
    choiceless S5 model, with the relation "lies in the next pair" for $F$.)

- id: forcing-possibilism-socks
  fails: [forcing-possibilism]
  when: {metatheory: socks}
  choice: free
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 23 October 2026; checked and recorded by Claude Opus
    5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    As in the general argument forcing-possibilism-continuum-arrows, with the worlds the union $W$ of the
    socks $P_n$, so that the propositions are the sets of worlds. The regular-open algebra $B$ of Cantor
    space has the size of the continuum in ZF, and it injects into the propositions, $S\mapsto\bigcup_{n\in
    S}P_n$ injecting the sets of natural numbers. The propositions do not inject into $B$: an injection
    would give one of $W$ into the sets of natural numbers, through $w\mapsto\{w\}$, and the lexicographic
    order of those sets would then choose a member of each sock. So $B$, realised at type $t$ by fullness,
    is a small complete Boolean algebra, atomless, while every entailment algebra below a proposition is
    atomic or has one element. (From Astra's note "Forcing Possibilism, Choice and Infinity", §6, in
    Daniel Kodsi's submission of 24 October 2026.)

notes: >-
  A basic reference model, recorded at Cian Dorr's request: the full S5 model with infinitely many
  worlds. Except for Forcing Possibilism, no recorded verdict depends on which infinite set $W$ is. In
  the variant with infinitely many individuals the group fixes them as the natural numbers; any
  infinite set gives the same verdicts under choice. Its verdicts are those of the full permutation
  group model, whose arrows are likewise all invertible, again except for Forcing Possibilism, which
  the map leaves unknown here. Under choice, Forcing Possibilism holds iff $2^{|W|}=2^{\aleph_0}$ (GPT-6
  Astra, prompted by Daniel Kodsi, 23 October 2026): if so, every small or Dedekind-finite complete
  Boolean algebra is finite, an infinite one having at least continuum many elements, and is isomorphic
  to the subsets of a finite set of worlds; if not, the regular-open algebra of Cantor space is small
  and atomless, while the algebra below any proposition is atomic. So it holds for $W=\mathbb N$ and
  fails for $|W|=2^{\aleph_0}$. With $W$ the union of Russell's socks it fails without choice
  (forcing-possibilism-socks).
