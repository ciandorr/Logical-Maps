id: full-involution-group
name: 'Full action model: two-element group'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), prompted by Zachary Goodsell, 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: none
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, p. 59, second paragraph; p. 61.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §3.5, p. 59, second paragraph; p. 61
group: full-action-models
settings:
  construction: 'The full action model on the two-element group $\{1,k\}$ with $k^2=1$: the construction
    of Classicism p. 59 (record full-idempotent-monoid) with the two-arrow multiplication changed to $k^2=1$.
    Evaluate at the sole object. The propositions at the evaluation object are the subsets of the two
    arrows out of it, four in all, and every intension of a full model is present.'
  individuals: singleton
  sigma: top
meets:
  returning-arrow: $k$, its own inverse.
  coherent-retractions: '$r_g:=g^{-1}$: then $r_{x\circ g}\circ x=g^{-1}\circ x^{-1}\circ x=g^{-1}$.'
  nonidentity-arrow: The involution $k$.
  invertible-arrows: The arrows form a group.
  epic-arrows: Every arrow is invertible; and on the individuals every arrow is the identity.
  finitely-many-propositions-everywhere: There is one object, with four propositions, the sets of the
    two arrows.
  sigma-apart: The construction does not mention Σ.
  one-object-action-model: It has one object.
  finitely-many-propositions: The propositions at the evaluation object are the subsets of the two arrows
    out of it, four in all.
arguments: []
notes: The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Everything
  that implies these fails with them.
was_conjectured: true
history:
- date: '2026-09-17'
  by: OpenAI Codex (GPT-6), prompted by Zachary Goodsell
  summary: Adopted the source’s relational type system at the user’s request. The cited construction now
    directly supplies the recorded model; the former type-extension obligation is removed.
  satisfies:
  - necessary-rigid-comprehension-r
  - necessary-atomicity-r
  - necessary-actuality
  - necessary-distinctness-necessary-r
  - no-pure-contingency-r
  violates:
