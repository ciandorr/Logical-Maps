notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Interpretation
  of Σ, fixed for this record: one designated relational constant $c$ of type $\tau=\bar\sigma t$ denotes
  $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of the model, the actual-world proposition
  described above; every other relational constant denotes the top element of its type and every individual
  constant one fixed individual. Under it: No Contingency (signature Σ) fails, since the Σ-sentence $\forall\bar
  x\, .\,c\bar x$ denotes $a$, true and contingent; Witnessed Possibility fails for the pure formula $x=\top_\tau$,
  witnessed by $\top_\tau$, since $\Diamond(c=\top_\tau)$ is $\Diamond\Box a$ and $a$ is necessary at
  no arrow; Separated Structure fails with it, being equivalent to Possibly Witnessed Possibility; Independence
  (signature Σ) and Distinctness (signature Σ) fail through the other relational constants, Σ being assumed
  to contain at least one: such a constant $c''$ of type $\tau''$ denotes what the closed pure term $\top_{\tau''}$
  denotes, and $c''=\top_{\tau''}$ is a true identity that C(Σ) does not prove. The designated constant
  refutes neither: closed pure terms denote entities fixed by every arrow (Classicism, §3.5, p. 58), whereas
  $a$ is fixed by no arrow but the identity, so no closed pure term denotes $\lambda\bar x\, .\,a$. Everything
  that implies these fails with them. In a one-object action model whose propositions are all the sets
  of arrows, every singleton $\{h\}$ is a strong world proposition: seen from an arrow $i$ it becomes
  $\{j : j\circ i=h\}$, and every proposition at that world is the shift $\{j : j\circ i\in Y\}$ of a
  root proposition $Y$, whose membership for such $j$ depends only on whether $h\in Y$; so it entails
  every proposition or its negation, at every world. Any possible proposition contains some arrow, so
  the type-t Strong Leibniz Biconditionals hold at every world. □Relational Choice holds: the truncation
  of a full action model at any arrow is again a full action model, its domains at the reachable objects
  being unchanged, and Relational Choice holds in every full model given choice in the metatheory (Classicism,
  p. 61).'
