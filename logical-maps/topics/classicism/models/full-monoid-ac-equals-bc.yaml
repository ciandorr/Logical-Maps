group: full-action-models
settings:
  construction: The full model over the monoid $M:=\langle a,b,c\mid ac=bc\rangle$, the free monoid on
    three generators modulo the congruence generated by $ac=bc$, evaluated at its sole object. Its elements
    are the words in $a,b,c$ with no factor $ac$, since the rewriting $ac\to bc$ has no overlaps; the
    relation preserves length.
  individuals: singleton
  sigma: top
meets:
  one-object-action-model: It has one object.
  sigma-apart: The construction does not mention Σ.
  infinitely-many-propositions: The subsets of an infinite monoid.
  nonepic-arrow: $a\cdot c=b\cdot c$ with $a\ne b$.
  nonidentity-arrow: $c$.
  unretracted-arrow: 'The relation preserves length, so $m\cdot k=1$ forces $m=k=1$: no non-identity element
    has a retraction.'
  irreversible-arrow: $c$, as no composite with it has length $0$.
  actual-world-isolated: The actual-world proposition $\{1\}$ is in the domain, the model being full;
    no product with a non-identity element is $1$, the relation preserving length.
  unique-retractions-everywhere: No non-identity element has a retraction, at the one object.
  retracted-arrows-invertible-everywhere: Only $1$ is retracted.
  trivial-left-stabilisers-everywhere: The relation preserves length, so $m\cdot k=k$ forces $m$ to have
    length $0$.
  incomparable-free-arrows: '$a$ and $b$: each is fixed only by $1$, and neither is a left multiple of
    the other, both having length $1$ and being distinct.'
  free-nonepic-composite: $ac=bc$ with $a\ne b$, and $ac$ is fixed only by $1$.
arguments: []
notes: 'A one-object companion to [[full-three-object-fork]]: Self-Atomicity, Atomicity, Strong Actuality
  and No Pure Contingency hold, all boxed, while Strong Atomicity (type t) and BF (type
  t) fail. The self-atom $\{a,b\}$ is not an atom.'
