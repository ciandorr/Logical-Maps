id: full-omega-chain-new-individuals
name: 'Full action model: ω-chain, one new individual at each step'
certificate:
  source_id: misc
  produced_by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell, 24 November 2026; the construction
    extends Cian Dorr's two-object chain with a new individual (11 October 2026) along the natural numbers
  recorded_by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell, 24 November 2026
  checked_by: []
  date: '2026-11-24'
  lean: none
sources:
- Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell, 24 November 2026, in a survey of the connections
  of Potential Infinity; after Cian Dorr's two-object chain with a new individual, suggestion of 11 October
  2026.
source_names:
- Claude Fable 5.2, 24 Nov
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74
  note: Full action models; the category is the natural numbers in their order.
definition: 'A full action model over the natural numbers in their order: objects $W_k$ for $k\in\mathbb
  N$, with exactly one arrow $f_{jk}:W_j\to W_k$ when $j\le k$ and none otherwise, evaluated at the identity
  of $W_0$. The individuals at $W_k$ are $0,\ldots,k$, and $f_{jk}$ acts on them as the inclusion. Every
  intension of every relational type is present at each object.


  Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each denotes the
  top element of its type.'
meets:
  full-model: Every intension of every relational type is present at every object.
  full-action-model: An action model, full at every object.
  codomain-intensions: The domains are full at every object.
  extensionally-full: A full model contains every intension, so in particular one with any given extension
    at the identity.
  finite-extension-properties-everywhere: The domains are full at every object, so they contain the haecceities,
    making identity literal, and an intension with any given extension at each identity arrow.
  identity-singletons: The singleton of the identity arrow at any object is in the domain, the model being
    full.
  rigid-haecceity-disjunctions: Every intension is present, so for any set $E$ the intension $k\mapsto
    k\cdot E$ is in the domain, and with persistence a rigid relation equals it (as for the group full-action-models).
  actuality-contingent: 'The singleton $a$ of the identity arrow at $W_0$ is in the domain. It is necessary
    at no world: the identity sees $f_{01}$, outside it, and every other world lies outside it. And $f_{01}$
    does not fix it, since $1\in f_{01}\cdot a$ would need $1\circ f_{01}=1$.'
  actual-world-isolated: The actual-world proposition, the singleton of the identity of $W_0$, is in the
    domain and lies below every proposition containing that identity; no arrow leads back to $W_0$ from
    a later object, so no world outside it sees a world in it.
  relationally-epic-arrows: Between two objects there is at most one arrow, so arrows after a given one
    that agree after it are equal.
  nonidentity-arrow: The arrow $f_{01}$.
  unretracted-arrow: No arrow leads from $W_1$ back to $W_0$, so $f_{01}$ has no retraction.
  trivial-isomorphisms-everywhere: An arrow $f_{jk}$ with $j<k$ has no arrow back, so only the identities
    are invertible.
  retracted-arrows-invertible-everywhere: 'No non-identity arrow has a retraction: nothing returns from a
    later object.'
  unique-retractions-everywhere: Only the identities have retractions, and each has just itself.
  trivial-left-stabilisers-everywhere: The only arrow from an object to itself is its identity, so $m\circ
    k=k$ only for $m$ the identity of the target of $k$.
  comparable-free-arrows-everywhere: Out of $W_j$ the arrows are the $f_{jk}$ with $k\ge j$, each fixed under
    post-composition only by an identity, and $f_{jl}=f_{kl}\circ f_{jk}$ for $k\le l$.
  uniquely-factored-free-arrows-everywhere: There is at most one arrow between two objects, so an arrow factors
    through another in at most one way.
  countably-many-arrows: The arrows out of $W_0$ are the $f_{0k}$, one for each natural number $k$.
  infinitely-many-propositions: The propositions at $W_0$ are the sets of the arrows $f_{0k}$, of which there
    are infinitely many.
  infinitely-many-propositions-everywhere: The propositions at $W_j$ are the sets of the infinitely many
    arrows $f_{jk}$, $k\ge j$.
  finitely-many-individuals-everywhere: There are $k+1$ individuals at $W_k$.
  finitely-many-individuals-somewhere: $W_0$, reached by its identity, has one individual.
  sigma-top: This is the interpretation the definition fixes.
arguments:
- id: potential-infinity-e
  holds:
  - necessary-potential-infinity-e
  choice: free
  by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
  date: '2026-11-24'
  text: At every object the numbers counted at type $e$ are the numerals, the model being full (as in the
    argument arithmetic-necessitism-extensionally-full), and transport along an arrow carries each numeral
    to the same numeral at the target. The numeral $\operatorname{Suc}^n_e\mathbf 0_e$ holds at the identity
    of an object of exactly the properties whose extension there has $n$ members, identity at type $e$
    being literal at an identity arrow. So at $W_k$, for each number $n$, the arrow $f_{kj}$ with $j\ge
    k$ and $j+1\ge n$ is a world at which that number holds of some property, $W_j$ having $j+1$ individuals,
    every set of which is the extension of a property. So Potential Infinity (type $e$) holds at the identity
    of every object. A closed sentence holds at an arrow exactly when it holds at the identity of the arrow's
    target, so its necessitation holds at the evaluation point.
- id: finitely-many-individuals
  fails:
  - possible-infinity-e
  - infinity-e
  choice: free
  by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
  date: '2026-11-24'
  text: There are $k+1$ individuals at $W_k$, so the numeral $\operatorname{Suc}^{k+1}_e\mathbf 0_e$, a finite
    cardinality, holds there of the universal property of individuals, and the Axiom of Infinity at type
    $e$ fails at every world. And the instance of the Infinity schema saying that there are at least two
    individuals is false at $W_0$, which has one.
- id: pure-b
  fails:
  - pure-b-r
  choice: free
  by: Claude Fable 5.2 (Anthropic), prompted by Zachary Goodsell
  date: '2026-11-24'
  text: The closed pure sentence saying that there is exactly one individual, $\exists x^e\, .\,\forall y^e\,
    .\,y=x$, is true at the identity of $W_0$ and false at every other world, each later object having
    at least two individuals. So it is true at the evaluation point, and at the world $f_{01}$ it is not
    possible.
notes: 'Every world has finitely many individuals and sees worlds with more, so Potential Infinity (type
  e) holds, necessarily, while Possible Infinity (type e) fails: Potential Infinity does not imply Possible
  Infinity at type $e$, even with □Rigid Comprehension, □Relational Choice and the boxed Axiom of Infinity
  at type $t$, which the model has by its fullness. BF fails at type $e$, as it must ([[potential-infinity-e-and-bf-imply-axiom-of-infinity-e]]):
  the haecceity of the individual $0$ is necessary of everything at $W_0$ and fails of $1$ after $f_{01}$.
  The numbers counted at type $e$ are rigid with necessarily distinct instances, though no world has more
  than finitely many individuals.'
