description: Use two objects with one nonidentity arrow from W0 to W1, evaluated at W0. The source makes
  the Fregean Axiom false at W0 and true at W1.
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Interpretation
  of Σ, fixed for this record: each relational constant denotes the top element of its type and each individual
  constant denotes one fixed individual. Under it the signature schemata fail. Let $c\in\Sigma$ have relational
  type $\tau$, so $c=\top_\tau$ necessarily. Witnessed Possibility fails for the pure formula $x\ne\top_\tau$,
  witnessed by $\bot_\tau$ but impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and
  $\lambda x\, .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes
  what the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since $c=\top_\tau$
  is a true identity that C(Σ) does not prove. Everything that implies these fails with them. The type-t
  Strong Leibniz Biconditionals hold necessarily: at $W_0$ the singleton $\{k\}$ becomes $\{\mathrm{id}_{W_1}\}$
  under $k$ and $\{\mathrm{id}_{W_0}\}$ becomes empty, so both singletons are strong worlds; at $W_1$
  there is one arrow and one non-bottom proposition. □Relational Choice holds: the truncation of a full
  action model at any arrow is again a full action model, its domains at the reachable objects being unchanged,
  and Relational Choice holds in every full model given choice in the metatheory (Classicism, p. 61).
  Distinctness-preserving collapse holds: let $a$ be the proposition true at the actual world alone (the
  identity arrow). For any true $p$, take $q:=a$ in the definition of $\Box_{\ne}p$: under a arrow $k$
  to $W_1$, $\Diamond a$ would need an arrow back to $W_0$, and none exists, since no arrow leads back
  to the actual world; under the identity, $p$ holds. So every truth is $\Box_{\ne}$-necessary, although
  ND fails. The Strong Leibniz Biconditionals hold at every relational type, necessarily. An atom of type
  $\bar\sigma t$ at $W_0$ is a single pair $\{\langle\bar a,h\rangle\}$, and its transport along $k$ is
  $\{\langle\bar a,j\rangle : j\circ k=h\}$ with $j$ ranging over the arrows out of $W_1$, of which there
  is one; so the transport is empty or a single pair, and decides every relation of $W_1$’s full domain.
  Every possible relation contains a pair, so every possible relation has a strong world below it, at
  $W_0$ and trivially at the one-world $W_1$. BF holds at type $t$, and necessarily. The arrow $k$ sends
  a proposition $p\subseteq\{1_{W_0},k\}$ to $\{1_{W_1}\}$ if $k\in p$ and to $\emptyset$ otherwise, so
  it acts surjectively on the two propositions of $W_1$, which gives the type-$t$ instance at $W_0$; $W_1$
  is a one-world model, where BF is trivial. Whether BF holds at type $e$ depends on the individual domains,
  which the record does not fix, so the schema is left open. Possible Infinity (type $t$) fails: $W_0$
  has four propositions and $W_1$ two, the models being full, so the Axiom of Infinity at type $t$ is
  false at both worlds. B for pure sentences fails, and B for sentences of $\Sigma$ with it: the pure
  sentence that there are three pairwise distinct propositions is true at $W_0$ and false at $W_1$, from
  which no arrow returns. Observations of Claude Fable 5.1 (Anthropic), 25 September 2026.'
