group: henkin
settings:
  construction: The individual domain is the domain of a serial relation with no functional subrelation,
    $D_t=\{0,1\}$, and every relational type holds all functions between its domains (the source's
    relative-consistency construction).
  metatheory: no-choice-function
meets:
  infinitely-many-individuals: A serial relation on a finite set has a functional subrelation in ZF, so the
    individual domain is infinite.
  several-individuals: There are infinitely many individuals.

