  text: >-
    As for the cloud models: identity at the root is literal for individuals and propositions, there are
    infinitely many of each, and every $\sim_r$-closed set of root tuples is the root extension of a
    relation existing there, with bottom components.
- id: truth-implies-nd-necessity
  holds: [necessary-distinctness-preserving-collapse]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    At the root $\{r\}$ is true and possible only at the root; at the Cohen points the box is idle; and
    full-idempotent-monoid satisfies the boxed principle, so it holds at every point of $M_k$, closed
    sentences holding there as in that model (Lemma 5.3).
- id: relational-choice
  holds: [necessary-relational-choice-r]
  choice: uses
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    At the root, choose for each $\sim_r$-class of inputs of a relation serial there a related class of
    outputs; the pairs from chosen classes, with bottom components, form a functional subrelation
    existing at the root. At the Cohen points the model is the full Boolean-valued model, whose type
    hierarchy is that of $V^B$, a model of ZFC. In $M_k$ it holds by □Relational Choice in full-
    idempotent-monoid.
