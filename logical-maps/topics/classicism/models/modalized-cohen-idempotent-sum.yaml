  date: '2026-10-29'
  text: >-
    The root algebra has three atoms, $\{r\}$ and the two atoms of the four propositions of $M_k$, and
    an atomless Cohen part. These four disjoint parts generate a complete sixteen-element algebra, while
    the propositions below one other than $\top$ form a sixteen-element algebra only if it is a join of
    four atoms.
