definition: Work in ZFC. Form M_C ⊕ M_k by Definition 5.2. M_C is the full modalized-domain model on the
  forcing frame of the Cohen algebra RO(Fn(ω,2)), with constant individuals ω. M_k is the rooted Kripke
  modalized-domain model obtained by unravelling the full one-object action model on the monoid {1,k},
  k²=k, with a single individual, as in §5.3. The new refinement-isolated root sees both components and
  itself. Actual individuals are a disjoint copy of ω, mapping identically into M_C and constantly to
  the sole individual of M_k. Underlying domains, component projections and root partial identities are
  those of Definition 5.2, not the full function-space construction. Evaluate at the new root. Interpret
  any relational signature constants as top; no signature verdict is asserted.
arguments:
- holds:
  - strong-actuality
  - necessary-strong-actuality
  fails:
  - self-atomicity-t
  - atoms-are-self-atoms-t
  - self-atoms-are-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'In the chain component $M_k$, the unravelling of the idempotent monoid, the proposition $q$ true
    at $a_1,a_2,\ldots$ and false at $a_0$ exists at $a_0$ and is an atom there, its only parts existing
    at $a_0$ being itself and bottom; but at $a_1$ it is identical to $\top$, which has the strict nonzero
    part $\{a_1\}$ there, so $q$ is not an atom at $a_1$ and not a self-atom. The root proposition with
    chain component $q$ and the other components bottom is therefore an atom at the root that is not a
    self-atom, with no self-atom below it: Atoms are self-atoms (type t) and Self-Atomicity (type t) fail.
    The root proposition with the Cohen component the whole cloud and the rest bottom is a self-atom (the
    argument self-atoms of the cloud models) with no atom below it, so Self-atoms are atoms (type t) fails.
    Strong Actuality holds at the root, whose singleton is the true atom and is seen by no other point,
    so transports to bottom everywhere; at the chain points the singleton of the point is the true atom
    and is likewise unseen from later points; and at the cloud points every proposition is $\top$ or $\bot$,
    so the true atom decides everything. Hence □Strong Actuality holds.'
- text: The Cohen component is rigidifiable and admits global choice by Lemma 5.5(a). The idempotent action
    model validates □RC, is extensionally full at its root, and validates □IC by the natural selector
    constructed in Lemma 5.7. Its unravelled modalized-domain model therefore satisfies Lemma 5.5(b).
    The transfer theorem 5.6(b,c) gives RC and IC at the new root and throughout both components, hence
    □RC and □IC.
  source:
    paper: bacon-modalized-domains-2026
    locator: Lemmas 5.5 and 5.7; Theorems 5.6(b,c) and 5.8, pp. 24–27
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  holds:
  - necessary-rigid-comprehension-r
  - necessary-intensional-choice-r
- text: In the full action model on {1,k}, k sends every proposition to top or bottom while four propositions
    remain available at the target. Thus its action at t is not surjective and BF_t fails (Lemma 5.7(c)).
    Unravelling preserves the relevant truth at its minimal root. Theorem 5.6(d) lifts a witnessing predicate
    to the rooted sum, using top in the other component and an everywhere-true root extension. All actual
    propositions satisfy it necessarily, while universal instantiation fails in the idempotent component.
  source:
    paper: bacon-modalized-domains-2026
    locator: Theorem 5.6(d), Lemma 5.7(c), and Theorem 5.8, pp. 25–27
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  fails:
  - barcan-t
- text: The everywhere-existing propositions of the Cohen component form its atomless complete Boolean
    algebra. Extend its top to be false at the new root and in the other component. It is a nonzero actual
    proposition with no atom below it, by Theorem 5.6(f).
  source:
    paper: bacon-modalized-domains-2026
    locator: Theorems 5.6(f) and 5.8, pp. 25–27
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  fails:
  - atomicity-t
- text: S and S minus the new root exist there and are distinct, but have identical component projections
    and hence are identical throughout both components. Theorem 5.6(e) gives failure of ND_t.
  source:
    paper: bacon-modalized-domains-2026
    locator: Theorems 5.6(e) and 5.8, pp. 25–27
  by: Andrew Bacon and Claude Opus 5.5 (Anthropic)
  date: '2026-10-21'
  fails:
  - distinctness-necessary-t
notes: 'Theorem B. The chain description in §5.3 is intuition for the unravelling, not a replacement for
  the source’s action-model construction. No propositionally full world–cloud model is claimed here: Proposition
  5.1 explains why that simpler construction cannot refute BF_t. Mathematical evidence is supplied by
  the cited paper; no independent checker or Lean certificate is asserted.'
