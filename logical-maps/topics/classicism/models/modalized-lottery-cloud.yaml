settings:
  family: Fix a strong limit cardinal μ>ω with cf(μ)=ω. Use one representative of every nontrivial complete
    Boolean algebra of cardinality <μ (Definition 6.4).
arguments:
- id: mathematical-possibilism
  holds: [forcing-possibilism]
  by: OpenAI Codex (GPT-6), prompted by Andrew Bacon
  date: '2026-11-16'
  choice: uses
  standing: conjectured
  text: >-
    The lottery represents all complete Boolean algebras of size below μ. To obtain the revised verdict it suffices to prove that the root inexact ordinal carrier has size below μ. Then any carrier of size at least μ contains a subset of size μ, strictly larger than H and power-closed by strong limit and full current extensions. The strict-propositional-smallness calculation alone does not give the ordinal bound.

- id: ch-contingent
  fails: [non-contingency-of-ch]
  choice: uses
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    The family contains $\mathrm{RO}(\mathrm{Add}(\omega,\omega_2))$ and
    $\mathrm{RO}(\mathrm{Col}(\omega_1,2^{\aleph_0}))$, each of cardinality below the strong limit
    $\mu$. At a point of a component with algebra $B$ the model is the full $B$-valued model over
    $\omega$, whose type hierarchy is that of $V^B$, so a formula about real number structures holds
    there iff the point forces it. The points of the first component force a real number structure of
    sets of naturals satisfying $\neg\mathrm{CH}$, those of the second one satisfying CH; the root sees
    both, so neither disjunct of Non-contingency of CH holds at type $e\to t$.
notes: There are 2^μ propositions at the root and 2^ℵ₀ rigid properties of individuals up to root identity.
  Choosing μ above any prescribed cardinal gives the unbounded-size assertion of Corollary 6.9. The original source uses strict propositional smallness. This model implements
  the paper’s full modalized-domain semantics. Bacon’s handout of 19 October 2026 presents the same frame,
  proposition algebra and individuals with constant domains, the functions self-related at every point, and
  quantifiers as meets and joins over them; it was recorded until 23 October 2026 as the separate model
  lottery-algebra-actual-point, with the same verdicts, and was folded into this record by Zachary Goodsell’s
  decision. The two are believed elementarily equivalent, since the handout’s domains are the root-existing
  entities of this model, every entity existing at a cloud point is identical there to a root-existing one
  (Lemma 4.3), and both models’ root-existing relations are, up to identity, the pairs of an actual
  extension and an extensional cloud profile, so every formula denotes the same proposition in both (argument
  by Claude Fable 5.1, prompted by Zachary Goodsell, 23 October 2026, not independently checked).
