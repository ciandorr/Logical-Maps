- id: at-v
  fails: [no-pure-contingency-r, necessary-five-implies-two-hat-necessity]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    No Pure Contingency fails at $W_0$ (paired-individuals-two-object-surjective), so some closed pure
    sentence true at $W_0$ is false at $V$, whose negation is then true at $V$ and false along an arrow
    to $W_0$. And 5-necessities are two-hat necessary fails at $W_0$, which $V$ reaches.
