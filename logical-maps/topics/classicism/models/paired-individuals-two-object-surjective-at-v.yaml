definition: 'A two-object ideally full action model. Fix a fixed-point-free involution $\pi$ on $\mathbb
  N$ (say $2k\leftrightarrow 2k+1$), which partitions $\mathbb N$ into two-element blocks. The objects
  are $W_0$, with individuals $\mathbb N$, and $V$, with individuals $\mathbb N\sqcup\{\star\}$ where
  $\star$ forms a block by itself. The arrows are all surjective block-respecting maps between these sets:
  $g(\pi c)\in\{g(c),\pi g(c)\}$ for every $c$, so a block maps into a block, either injectively or collapsed
  to a point, there are surjective arrows $W_0\to V$, obtained by collapsing one block onto $\star$ and
  mapping the remaining blocks onto all blocks; and the new individual $\star$ can be hit only by collapsing
  a block onto it. The pinning action is the identity on individuals, the ideal is the finite sets, and
  the individuals are the type-$e$ domains, so the model is ideally full in the sense of Classicism, Appendix
  D, and a model of C by its Proposition D.4. The evaluation point is the identity on $V$, the object
  with the new individual $\star$; every object is reachable from it, since there are surjective arrows
  $V\to W_0$ (send $\star$ anywhere).



  Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each denotes the
  top element of its type.'
meets:
  infinitely-many-individuals: >-
    The individuals are infinite at both objects.
  no-atoms-anywhere: >-
    At either object let $p\ne\bot$ be pinned down by a finite $N$ and contain $h$. Take a block $B$
    disjoint from $N$ and its $\pi$-image and $b\in B$: some arrow agreeing with $h$ on $N$ sends $b$ to
    $h(b)$ and some sends it elsewhere, both in $p$ (in the surjective model the infinitely many other
    blocks keep it surjective), so the arrows in $p$ sending $b$ to $h(b)$ lie strictly between $\bot$
    and $p$.
  infinitely-many-propositions-everywhere: >-
    At both objects the propositions that an arrow sends $0$ to $n$, one for each $n$, are pinned down
    by $\{0\}$ and pairwise distinct.
  finitely-pinned-domains: >-
    Ideally full with the ideal of finite sets: every intension pinned down by a finite set is in
    the domain, and every entity in a domain is one.
  infinitely-many-propositions: >-
    The propositions at $V$ include, for each $n$, the set of arrows sending $0$ to $2n$.
  non-injective-arrow: >-
    The surjective block-respecting map of $V$ collapsing the block $\{0,1\}$ onto $\star$ and
    mapping the remaining blocks onto all the blocks of $\mathbb N$ is an arrow out of $V$.
  sigma-top: This is the interpretation the definition fixes.
  codomain-intensions: The model is ideally full with the ideal of finite sets and no symmetry group,
    so every intension pinned down by the empty set, i.e. whose value at an arrow depends only on the
    codomain, is in the domain at every object (Classicism, Definition D.3).
  extensionally-full: Ideally full action models are extensionally full (Classicism, p. 74).
