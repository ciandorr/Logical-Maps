- id: necessary-barcan
  holds:
  - necessary-barcan-r
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: Every arrow is surjective on individuals, hence on finite sets of individuals, so Proposition
    D.6 of Classicism gives BF at every type with any object as the evaluation point.
- id: nd-necessity-not-b
  fails:
  - two-hat-implies-nd-necessity
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: 'At $V$ let $p:=\mathrm{fix}^{VV}_{\{\star\}}$, the true proposition that $\star$ is fixed. For
    any true $q$ at $V$, pinned by $N_q$, the surjection $u\colon V\to W_0$ that is the identity on $\mathbb
    N$ and sends $\star$ into a block $B$ disjoint from $N_q$ lies in $\Diamond q$ (a surjection fixing
    $N_q$ and collapsing $B$ onto $\star$ brings it back into $\mathrm{fix}^{VV}_{N_q}$) but not in $\hat\Diamond
    p$, since every $v$ with $vu\in p$ collapses $B$ onto $\star$ and so cannot return to $\mathrm{fix}^{00}_B$.
    So B fails for $\Box_{\ne}$ at $p$. By Proposition D11 of The Bounds of Possibility, $p\to\hat{\hat\Box}\hat\Diamond
    p$, so $\hat\Diamond p$ is two-hat necessary; it is not ND-necessary, which is what the failure of
    B says. Actuality fails: the true propositions $\mathrm{fix}^{VV}_N$ descend strictly.'
- id: not-all-truths-five-necessary
  fails:
  - truth-implies-five-necessity
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: As in the record evaluated at $W_0$, the three-hat operator $\hat{(3)}\Box$ is necessarily B in
    this model, so it is an S5 operator and $\Box_5\le\hat{(3)}\Box$; at $V$ its cluster on $\mathrm{fix}^{VV}_N$
    is the set of surjective block-bijections of $V$ fixing $\star$ and block-injective on $N$, which
    contains arrows moving any given point of $\mathbb N$, so the truth $\mathrm{fix}^{VV}_N$ is not 5-necessary.
