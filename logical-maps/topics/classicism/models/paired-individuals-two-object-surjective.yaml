notes: 'The surjective variant of the paired-individuals model: necessary BF holds at every type by Classicism,
  Proposition D.6, yet 5-necessity still fails to imply two-hat necessity at the evaluation point and
  $\Box_{\ne}\ne\hat{\hat\Box}$. Built in the conversation of 14 October 2026. The two operators $\Box_{\ne}$
  and $\hat{\hat\Box}$ are coextensive at the evaluation point but differ at $V$: Let $p:=\mathrm{fix}^{VV}_{\{\star\}}$.
  For any true $q$ at $V$, pinned by $N_q$, let $u\colon V\to W_0$ be the identity on $\mathbb N$ with
  $\star\mapsto b$ for a block $B\ni b$ disjoint from $N_q$; then $u\in\Diamond q$, since the map fixing
  $N_q$ and collapsing $B$ onto $\star$ brings it back into $\mathrm{fix}^{VV}_{N_q}$. But $u\notin\hat\Diamond
  p$: any $v$ with $vu\in p$ sends the whole block $B$ to $\star$, so no arrow after $v$ fixes $B$, i.e.
  $v\notin\Diamond\,\mathrm{fix}^{00}_B$. So B fails for $\Box_{\ne}$ at $V$, and by Propositions D11
  and D22 of The Bounds of Possibility $\hat{\hat\Box}\ne\Box_{\ne}$. These verdicts, with the failure
  of Actuality and of ND at type $e$ (the block of $0$ collapses onto $\star$), are derived by the engine
  from the recorded ones.'
