notes: >-
  Verdicts the engine derives, checked directly. □Well-Ordering: a well-ordering in $V$ of a root
  domain is the root extension of a root relation with any definable $C_0$-extension, the
  well-ordering conditions being unboxed, and at $C_0$ the full domain contains a well-ordering of each
  type. Functionality fails at type $(et)t$: the property of properties of individuals in the argument
  for the failure of BF and the one with $C_0$-extension $\mathcal P(\mathbb N)^{V[G]}$ take the same
  value, the necessary proposition, at every root property of individuals and differ at $C_0$ on the
  Cohen real. ND fails at type $t$: the proposition true at the root alone and the one true nowhere are
  distinct at the root and both become the false proposition at $C_0$; and the pure sentence that ND
  fails at type $t$ is true at the root and false at $C_0$, so No Pure Contingency fails. Atomicity
  fails at type $(et)t$, as atomicity-and-rigid-comprehension-imply-rigid-power requires: the root
  property $Z$ of properties of individuals with empty root extension and $C_0$-extension the reals of
  $V[G]$ not in $V$ is not bottom, and a root property $A$ below it has a definable $C_0$-extension
  $g$ of new reals; were $A$ an atom with $c\in g$, then for each $n$ the root property with
  $C_0$-extension $\{x\in g : x(n)=c(n)\}$, definable from $g$ and the bit $c(n)$, would lie below
  $A$ and not be bottom, hence be $A$, so that $g=\{c\}$ and $c$ would be definable from parameters
  in $V$, hence in $V$. At type $et$, by contrast, every nonbottom property has an atom below it,
  since a nonempty definable set of natural numbers has a definable singleton below it.


  The source's Theorem 20 (first- and second-order continuum contingency with □Rigid Comprehension and
  □Relational Choice, though not the contingency of CH) and Theorem 21 (the same with □Atomicity at type $t$), in the simplest instance of
  the construction. In the source's terms the reals, the rigid properties of natural numbers, are
  persistent but not inextensible: new reals appear at $C_0$. The construction presupposes a generic
  filter, so, as always with forcing, what it establishes is consistency relative to ZFC; a countable
  transitive ground model, or Boolean-valued names, turns it into a construction in ZFC. The source
  varies the construction: any $V$-decisive forcing in place of Cohen forcing (Theorem 20 varies the
  continuum hypothesis either way), a finite group $W$ of automorphisms of the root (Theorem 21), the
  canonical coin-toss model in place of the extensional one with $W$ the reals of $V$ (Theorem 22, which
  gives Recombination, not a principle of the map, and refutes Atomicity at type $t$, Corollary 23,
  answering a conjecture of Christopher Sun; on the map □Rigid Comprehension without Atomicity at type
  $t$ is already witnessed by symmetric-collapse-pair), and iterated stitching (§10). This record is the
  simplest instance; a single Cohen real leaves CH as it was, so Non-contingency of CH holds here, and
  the instance of Theorem 20 that changes CH is stitched-ch-reversing. It is the first model on the map with Atomicity at type $t$ and □Rigid
  Comprehension in which Rigid Power fails; it separates □Strong Atomicity (type $t$) with □Rigid
  Comprehension from BF at the relational types and from Atomicity at the higher types; and it shows
  that the Atomicity in atomicity-and-rigid-comprehension-imply-rigid-power cannot be weakened to
  type $t$.
