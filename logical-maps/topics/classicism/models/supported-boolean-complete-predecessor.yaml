id: supported-boolean-complete-predecessor
name: 'Supported model over the ultrafilters of a complete homogeneous algebra, with a free root'
certificate:
  source_id: misc
  produced_by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 25 October 2026 (as a Boolean-valued model);
    reformulated as an action model by Cian Dorr, 29 October 2026
  recorded_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 29 October 2026
  checked_by: []
  date: '2026-10-29'
  lean: none
sources:
- >-
  GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, Observer separation with propositional completeness and
  divergent possibilities, research note of 25 October 2026, §§1–3 (unpaginated), in Daniel Kodsi's pull
  request #18 (complete-boolean-root.md in the integration register); OpenAI Codex (GPT-6), prompted by
  Daniel Kodsi, the record supported-boolean-complete-predecessor in his pull request #21 of 28 October 2026.
