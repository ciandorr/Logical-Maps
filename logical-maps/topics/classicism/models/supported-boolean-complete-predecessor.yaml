  source_id: misc
  produced_by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 25 October 2026 (as a Boolean-valued model);
    reformulated as an action model by Cian Dorr, 29 October 2026
  recorded_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 29 October 2026
  checked_by: []
