# 29 October 2026: its arguments for Atomlessness, □Countable Boolean Completeness, the failures of
# Vicinity, Weakly Inextensible Comprehension, Rigid Power and Boolean Completeness at t, □Tame Rigidity,
# the choice principles and □Rigid Rigidity are the supported-products group's; Arithmetic Necessitism is
# the group's, and Second-Order Analytic Necessitism stays here.
arguments:
- holds: [logical-necessity-r]
  choice: uses
  writeup: supported-product-free-monoids-glued-constants
  text: >-
    By the gluing, $h_\alpha\cdot G_c=J_\alpha(c)$ for every constant at once, so a $\Sigma$-sentence is
    possible iff it is true under some interpretation of $\Sigma$; and $P[\bar c/\bar x]$ is so true iff
    $\exists\bar x\, .\,P$. So $\Diamond P[\bar c/\bar x]\leftrightarrow\exists\bar x\, .\,P$, and dually
    Logical Necessity.
- holds: [necessary-barcan-r]
  choice: free
  writeup: supported-product-free-monoids-glued-constants
  text: >-
    Transport is onto at every type: for $F$ with support $S$, the profile $G_m:=F_{r(m)}$, where $r(m)$
    strips the suffix $h_i$ from $m_i$ for $i\in S$ (and $G_m:=\varnothing$ if some $m_i$ lacks it), has
    $h\cdot G=F$. So $\forall a\, .\,\Box Ra$ gives $\Box\forall b\, .\,Rb$; BF is a closed pure schema in a
    one-object model, so it holds necessarily.
- holds: [necessary-relational-choice-r]
  choice: uses
  writeup: supported-product-free-monoids-glued-constants
  text: >-
    For a serial $U$, choose a value for each input and take the constant profile of the resulting graph,
    which has empty support.
- holds: [necessary-distinctness-preserving-collapse]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-25'
  writeup: supported-product-free-monoids-glued-constants
  text: >-
    For a true $p$ with support $S$, let $q_S:=\{m:m_i=\varepsilon\text{ for all }i\in S\}$. It is true,
    $\Diamond q_S=q_S$ since the free monoid has no inverses, and every member of $q_S$ agrees with $1$ on
    $S$, so lies in $p$. So $\Box(\Diamond q_S\to p)$, and $p$ is ND-necessary.
- holds: [second-order-analytic-necessitism, arithmetic-necessitism]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-25'
  writeup: supported-product-free-monoids-glued-constants
  text: >-
    $\mathbb N_\sigma$ is a closed pure term, so its profile is constant, with the numerals, fixed by every
    arrow, as instances: it is rigid with necessarily distinct instances. For analysis: at a type
    $\sigma\ne t$ with a relational argument, the constant profiles of continuum many fixed entities, with
    constant operations and constant represented powers, form a rigid real structure, real at every
    arrow since every set of the fixed entities is the extension of a constant profile. At $t$ (and at
    types with only individual arguments), the propositions $p_x:=\{m:\#_a(m_o)-\#_b(m_o)\in x\}$,
    $x\subseteq\mathbb Z$, are transported by integer shifts of $x$, injectively; the exact images of a
    real structure on continuum many of them, and of all relations among them, are supported by $\{o\}$
    and are rigid, and every transport is an isomorphic real structure. See the write-up.

notes: >-
  Separates Logical Necessity, with □BF and □Relational Choice, from Actuality, Vicinity and the
  comprehension principles, and Countable Boolean Completeness from Boolean Completeness. Every verdict
  on the map is settled. The variant with infinitely many individuals from the source note (§11), which
  adds the Axioms of Infinity at $e$ and $t$, is supported-product-surjections-glued-constants; it fails Truths are ND-necessary and, at type $e$, Analytic Necessitism.
