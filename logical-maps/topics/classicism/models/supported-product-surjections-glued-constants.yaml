# 29 October 2026: its arguments "as in the base model" (Atomlessness, □Countable Boolean Completeness,
# the failures of Vicinity, Weakly Inextensible Comprehension, Rigid Power and Boolean Completeness at t,
# □Tame Rigidity, the choice principles, Arithmetic Necessitism and □Rigid Rigidity) are the
# supported-products group's.
arguments:
- holds: [logical-necessity-r]
  choice: uses
  writeup: supported-product-surjections-glued-constants
  text: >-
    For each $\mathcal L(\Sigma)$-sentence true under some interpretation $J_\alpha$, a surjection
    $s_\alpha$ sends each $a_c$ to $J_\alpha(c)$, there being at most $\kappa$ constants and $\kappa^+$
    other individuals. Lifts $B_{\alpha,c}$ of the relational values along $(\varepsilon,s_\alpha)$, glued
    at a fresh coordinate $j$ as in the base model, give an arrow $h_\alpha$ at which every constant
    takes its $J_\alpha$-value at once. So a $\Sigma$-sentence is possible iff it is true under some
    interpretation, which gives Logical Necessity.
- holds: [axiom-of-infinity-e]
  choice: free
  writeup: supported-product-surjections-glued-constants
  text: >-
    The finite cardinalities are the standard numerals, and each holds exactly of the properties with that
    many actual instances. The universal property of individuals has $\kappa^+$ of them, so it has no finite
    cardinality. The axiom is closed and pure, so it holds necessarily.
- fails: [analytic-necessitism]
  choice: free
  writeup: supported-product-surjections-glued-constants
  text: >-
    At type $e$. Every set of tuples of individuals is the extension of a constant profile, and
    $|U|>2^{\aleph_0}$, so a real number structure on individuals exists. None is rigid: two distinct
    instances $a,b$ of its carrier are identified at the arrow $(\varepsilon,s)$ for a surjection $s$ with
    $s(a)=s(b)$, so they are not necessarily distinct. At every other type both principles hold, by the
    base model's arguments (see the write-up).
- holds: [necessary-two-hat-implies-nd-necessity, necessary-five-implies-nd-necessity, necessary-five-implies-two-hat-necessity]
  choice: free
  writeup: supported-product-surjections-glued-constants
  text: >-
    For $S\subseteq I$ of size at most $\kappa$, let $V_S$ be the set of arrows $(m,s)$ with $m$ empty on $S$ and $s$ a
    bijection. A truth $q$ with support $S$ has $V_S\le\Diamond q$, with equality for the truth
    $\{(m,s):m|_S=\varepsilon,\ s=\mathrm{id}\}$, so $\Box_{\ne}p$ iff $V_S\le p$ for some $S$. Hence
    $\Diamond_{\ne}q$ holds at $(m,s)$ iff $(m,\pi\circ s)\in q$ for some permutation $\pi$, and again some truth $q$
    has $\Box(\Diamond_{\ne}q\to p)$ iff $V_S\le p$ for some $S$. So $\Box_{\ne}$ is identical to its hat, and
    therefore to $\Box_5$ (Background, Hats). The principles are closed and pure.
- fails: [distinctness-preserving-collapse]
  choice: free
  writeup: supported-product-surjections-glued-constants
  text: >-
    $p:=\{(m,s):s=\mathrm{id}\}$ is true. Any true $q$ is possible at $(\varepsilon,\pi)$ for a permutation
    $\pi\ne\mathrm{id}$, since $(\varepsilon,\pi^{-1})(\varepsilon,\pi)=1$, while $p$ is false there; so
    no truth $q$ has $\Box(\Diamond q\to p)$. In the base model every truth is ND-necessary, but that relied on
    the free monoid having no inverses.
notes: >-
  The variant of supported-product-free-monoids-glued-constants with infinitely many individuals. It adds
  the Axioms of Infinity at $e$ and $t$ to Logical Necessity, □BF, □Relational Choice, □Countable Boolean
  Completeness and the choice principles, without Actuality, Vicinity, the comprehension principles or Rigid
  Power. Unlike the base model it fails Truths are ND-necessary. Analytic Necessitism, in both
  forms, holds at every type but $e$, and fails at $e$ because $\kappa$ is taken at least $2^{\aleph_0}$
  (Astra's note needs only $\kappa\ge|\Sigma|$). For countable $\Sigma$, the construction also works with
  $\kappa=\aleph_0$ and $U$ countable. Then no real number structure on individuals is possible, so both
  forms hold at $e$ trivially.
