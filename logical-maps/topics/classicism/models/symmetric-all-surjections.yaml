- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Recorded the failure of Relational Choice, at types (e→t) and e: a functional subrelation
    of the serial relation pairing each property with its members would be symmetric and finitely pinned,
    and a symmetry fixing its pinning set would carry its choice for the property of lying outside that
    set to a second choice. Cian Dorr’s observation that a choice cannot be finitely pinned; argument
    in the notes.'
