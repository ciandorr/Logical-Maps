description: >-
  A symmetric ideally-full intensional action model over one object, the set of natural numbers. Its symmetry
  group is the permutations that preserve a fixed pair of individuals setwise, and its arrows are those
  permutations together with all the surjections that collapse the two members of that pair. Every arrow
  is therefore invertible or a collapser, and which it is can be read off from its behaviour on that pair.
  The evaluation point is the identity arrow.


  Actuality holds because the symmetry group is the smallest symmetric set of arrows containing the identity,
  and here membership in it is detected by the fixed pair, so the group is a finitely pinned proposition
  and is an atom entailing every truth. Boolean Completeness holds by the draft's main theorem with the
  fixed pair as the distinguished set; splicing fails at that pair, but the pair is exactly what certifies
  invertibility, and the separated arrows are handled by symmetry instead. BF holds at every type by the
  surjectivity of the arrows. One object again gives No Pure Contingency and promotes each of these to
  its boxed form.


  Rigid Comprehension holds at every relational type. Given a relation with extension S pinned down by
  a finite set, take the least upper bound of the union of the haecceities of the members of S, computed
  with the fixed pair adjoined to the pinning set. Persistence is immediate, and the extension is exactly
  S because an arrow agreeing with the identity on a set containing the fixed pair is invertible. The
  rigidity criterion is then checked separately at invertible worlds, where leastness delivers it, and
  at collapsing worlds, where surjectivity supplies the preimages that persistence demands. Atomicity
  nonetheless fails, with the proposition that the two members of the fixed pair are identical as a nonzero
  proposition having no atom below it.
notes: >-
  This model is not a second witness to the draft's main result but a counterweight to it. Rigid Comprehension
  holds, so the failure of Actuality in the all-surjections model is no accident. Because Atomicity fails
  here, the model settles a question left open in Classicism: Rigid Comprehension does not imply Atomicity.
  The boxed forms of Actuality and Rigid Comprehension use the draft's one-object observation, which it
  states for Boolean Completeness and applies in the same way in its final section. ND fails at type e
  because the proposition that the two members of the fixed pair are identical is true at exactly the non-invertible
  arrows and so is nonzero; the draft displays that proposition without drawing the consequence for ND.
  The source is a work in progress.
