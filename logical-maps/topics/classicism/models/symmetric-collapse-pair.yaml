  note: The open question whether Rigid Comprehension implies Atomicity, and the ideally-full models of
    which this is the symmetric variant.
description: 'A symmetric ideally-full intensional action model over one object, the set of natural numbers.
  Its symmetry group is the permutations that preserve a fixed pair of individuals setwise, and its arrows
  are those permutations together with all the surjections that collapse the two members of that pair.
  Every arrow is therefore invertible or a collapser, and which it is can be read off from its behaviour
  on that pair. The evaluation point is the identity arrow.


  Actuality holds because the symmetry group is the smallest symmetric set of arrows containing the identity,
  and here membership in it is detected by the fixed pair, so the group is a finitely pinned proposition
  and is an atom entailing every truth. Boolean Completeness holds by the draft''s main theorem with the
  fixed pair as the distinguished set; splicing fails at that pair, but the pair is exactly what certifies
  invertibility, and the separated arrows are handled by symmetry instead. BF holds at every type by the
  surjectivity of the arrows. One object again gives No Pure Contingency and promotes each of these to
  its boxed form.


  Rigid Comprehension holds at every relational type. Given a relation with extension S pinned down by
  a finite set, take the least upper bound of the union of the haecceities of the members of S, computed
  with the fixed pair adjoined to the pinning set. Persistence is immediate, and the extension is exactly
  S because an arrow agreeing with the identity on a set containing the fixed pair is invertible. The
  rigidity criterion is then checked separately at invertible worlds, where leastness delivers it, and
  at collapsing worlds, where surjectivity supplies the preimages that persistence demands. Atomicity
  nonetheless fails, with the proposition that the two members of the fixed pair are identical as a nonzero
  proposition having no atom below it.'
notes: 'This model is not a second witness to the draft''s main result but a counterweight to it. Rigid
  Comprehension holds, so the failure of Actuality in the all-surjections model is no accident. Because
  Atomicity fails here, the model settles a question left open in Classicism: Rigid Comprehension does
  not imply Atomicity. The boxed forms of Actuality and Rigid Comprehension use the draft''s one-object
  observation, which it states for Boolean Completeness and applies in the same way in its final section.
  ND fails at type e because the proposition that the two members of the fixed pair are identical is true
  at exactly the non-invertible arrows and so is nonzero; the draft displays that proposition without
  drawing the consequence for ND. The source is a work in progress. Interpretation of Σ, fixed for this
  record: one designated relational constant $c$ of type $\tau=\bar\sigma t$ denotes $\lambda\bar x\,
  .\,a$, where $a$ is the unique true atom of the model, the actual-world proposition described above;
  every other relational constant denotes the top element of its type and every individual constant one
  fixed individual. Under it: No Contingency (signature Σ) fails, since the Σ-sentence $\forall\bar x\,
  .\,c\bar x$ denotes $a$, true and contingent; B for sentences of Σ fails, since under any arrow that
  no arrow composes back into $a$, $\Diamond a$ is false, so $\Box\Diamond a$ fails; Witnessed Possibility
  fails for the pure formula $x=\top_\tau$, witnessed by $\top_\tau$, since $\Diamond(c=\top_\tau)$ is
  $\Diamond\Box a$ and $a$ is necessary at no arrow; Separated Structure fails with it, being equivalent
  to Possibly Witnessed Possibility; Independence (signature Σ) and Distinctness (signature Σ) fail through
  the other relational constants, Σ being assumed to contain at least one: such a constant $c''$ of type
  $\tau''$ denotes what the closed pure term $\top_{\tau''}$ denotes, and $c''=\top_{\tau''}$ is a true
  identity that C(Σ) does not prove. The designated constant refutes neither: closed pure terms denote
  entities fixed by every arrow (Classicism, §3.5, p. 58), whereas $a$ is fixed by no arrow but the identity,
  so no closed pure term denotes $\lambda\bar x\, .\,a$. Everything that implies these fails with them.
  Distinctness-preserving collapse holds: let $a$ be the set of arrows that are permutations, a symmetric
  proposition true at the identity and, as the record’s Actuality witness, entailed by no other truth.
  For a true $p$, $a\le p$. Take $q:=a$: under a permutation $i$, $p$ holds since $i\in a\subseteq p$;
  under a non-permutation $i$, $\Diamond a$ would need $k\circ i$ to be a permutation, which no composite
  with a non-bijective arrow is. So every truth is $\Box_{\ne}$-necessary.'
changes:
- date: '2026-09-20'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added both Axioms of Infinity at Cian Dorr's direction. The individuals are the natural numbers
    and identity at the identity arrow is literal, so no numeral counts them. The propositions that a
    given individual is fixed by the arrow, one for each individual, are pairwise distinct, symmetric
    and pinned by that individual, so there are infinitely many propositions. The set of numerals at each
    type is invariant under every arrow, hence symmetric and pinned by the empty set, so finite cardinality
    is standard and no finite cardinality holds of the universal property at either type.
  satisfies:
  - axiom-of-infinity-e
  - axiom-of-infinity-t
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Fixed an interpretation of Σ (relational constants as top, individual constants as one fixed
    individual) and recorded the signature schemata it refutes, at Cian Dorr’s request.
  violates:
  - witnessed-possibility-r
  - separated-structure-r
  - independence-signature-r
  - distinctness-signature-r
