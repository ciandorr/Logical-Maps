notes: >-
  Rigid Comprehension, Weakly Rigid Power, Atomicity, Relational Choice and □Strong Actuality do not make
  Tame Rigidity necessary. Recorded with one individual, as built; the base at $A$ being the single point
  $*$, the group's variant with the base as individuals is not generated. The construction works for any one-object symmetric ideally-full tail with one
  individual: the entrance has these principles and fails the necessitation of whatever fails in the tail.
  Lean certificates of Relational Choice and of the failures of BF at $t$ and at the relational types are
  Astra's (Classicism.Meta.Intensional.FixedPointEntrance.Qualitative), ported from the submission; the
  rigidity verdicts are not formalized there.
