  note: Symmetric ideally-full models, of which this is one.
group: symmetric-ideally-full
settings:
  construction: 'A symmetric ideally-full model on two objects. The tail $B$ has the pinning base, arrows and
    symmetry group of symmetric-qualitative-links, together with one further point $d$, fixed by every arrow
    and every symmetry and in the image of no other point. The entrance $A$ has pinning base $\{*\}$, trivial
    symmetry group and the ideal of finite sets, and one arrow $i:A\to B$, sending $*$ to $d$, so that
    $m\circ i=i$ for every arrow $m$ out of $B$; there are no arrows from $B$ to $A$. Evaluation point: $1_A$.'
  individuals: singleton
  sigma: top
meets:
  finitely-pinned-domains: >-
    Both objects carry the ideal of finite sets, and the domains hold every symmetric intension pinned
    down by a finite set.
  actual-world-isolated: >-
    $\{1_A\}$ is in the domain and entails every truth, and the only other world, $i$, sees only itself.
  finite-pinning: Both objects carry the ideal of finite sets.
  symmetry-group-pinned: The symmetry group at $A$ is its identity alone, pinned down by $\varnothing$.
  actuality-contingent: The proposition true at $A$ only is the strongest truth; its transport along $i$ is
    $\bot$, so it is necessary at no world and $i$ does not fix it.
arguments:
- holds:
  - self-atoms-are-atoms-r
  - self-atoms-are-strong-atoms-r
  fails:
  - atoms-are-self-atoms-t
  - self-atomicity-t
  - necessary-self-atoms-are-atoms-t
  - necessary-self-atoms-are-strong-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'At $A$ the propositions are the four subsets of $\{1_A,i\}$. The atom $\{i\}$ is not a self-atom:
    its transport along $i$ is the set of all arrows out of $B$, since $m\circ i=i$ for every $m$, which
    is not an atom at $B$. So Atoms are self-atoms (type t) fails, and Self-Atomicity (type t) fails,
    $\{i\}$ being possible with no self-atom below it. No self-atom at $A$ has a pair at $i$, for the
    same reason: its transport along $i$ would be the constant intension of a set of tuples at $B$ over
    all arrows out of $B$, which has a proper nonzero part over any nonzero proper proposition of $B$.
    So the self-atoms at $A$ sit over $1_A$ with one tuple, are atoms, and are strong atoms, their transport
    along $i$ being empty: Self-atoms are atoms and Self-atoms are strong atoms hold at $A$, at every
    type. At $B$, the tail of symmetric-qualitative-links with the fixed point $d$, the self-atom of that
    model built from a collapsing arrow $k$ and a finite $N$ with $k(N)\supseteq\{0,1\}$ is again a self-atom
    that is not an atom, $d$ being fixed by every arrow and every symmetry; so Self-atoms are atoms (type
    t) and Self-atoms are strong atoms (type t) fail at $B$, which $i$ reaches, and their boxed forms
    fail at $A$.'
- holds: [rigid-comprehension-r]
  choice: free
  writeup: symmetric-entrance-qualitative-links
  text: >-
    The entities at $A$ are the pairs $(E,S)$ of an extension $E$ at $1_A$ and a $G$-invariant extension $S$
    at $i$, and transport along $i$ gives the constant intension $S$, fixed by every arrow. So $(E,i\cdot E)$
    is persistent and weakly inextensible at $A$ and at $B$: a rigid coextension of any relation with
    extension $E$.
- holds: [atomicity-r]
  choice: free
  writeup: symmetric-entrance-qualitative-links
  text: >-
    The entities at $A$ of each relational type form the complete atomic algebra of pairs of a set of
    tuples at $A$ and a union of $G$-orbits of tuples at $B$.
- holds: [relational-choice-r]
  choice: uses
  writeup: symmetric-entrance-qualitative-links
  text: >-
    A graph chosen in the metatheory, paired with the empty set, is an entity at $A$.
- holds: [weakly-rigid-power-r]
  choice: free
  writeup: symmetric-entrance-qualitative-links
  text: >-
    For weakly rigid $F=(E,i\cdot E)$, a weakly rigid relation below its transport at $B$ is the constant
    intension of a set $D$ of transported tuples, which is the transport of $(E_D,i\cdot E_D)$ for
    $E_D:=\{\bar x\in E:i\cdot\bar x\in D\}$. So the weak power property of $F$ is the pair of its extension
    and that extension's transport, and is rigid.
- holds: [necessary-strong-actuality]
  choice: free
  writeup: symmetric-entrance-qualitative-links
  text: >-
    The proposition true at $A$ only is a strong true atom there, its transport being $\bot$; at $B$ the
    tail's strong true atom serves.
- fails: [necessary-tame-rigidity-r]
  choice: free
  writeup: symmetric-entrance-qualitative-links
  text: >-
    With one individual, $d$ is a pinning point only, so the domains at $B$ are those of
    symmetric-qualitative-links-individuals-singleton, which fails Tame Rigidity at $(t\to t)\to t$ (the
    argument tame-rigidity of symmetric-qualitative-links), and $B$ is reachable from $A$.
- fails: [barcan-t, distinctness-necessary-t, strong-atomicity-t]
  choice: free
  writeup: symmetric-entrance-qualitative-links
  text: >-
    With $r$ the proposition true at $A$ only: every proposition $p$ at $A$ necessarily satisfies
    $r\lor p=\top\lor p=\bot$, its transport being $\top$ or $\bot$, but a contingent proposition of the
    tail does not, so BF at $t$ fails; $r\ne\bot$ while their transports agree; and $\neg r$ is an atom whose
    transport $\top$ is split at $B$, so no strong atom lies below it.
- id: transfer
  holds: [necessary-distinctness-preserving-collapse, necessary-weak-rigid-comprehension-r, possible-infinity-t]
  fails: [necessary-atomicity-t, necessary-rigid-power-r, infinity-t, pure-b-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    The arrows out of $A$ are $1_A$ and $i$, with $m\circ i=i$ for every $m$, so $i$ sees only itself
    and a closed sentence holds at $i$ iff at $1_B$; so a boxed sentence holds at $1_A$ iff it holds
    there and at $1_B$, where the tail, as the notes say, has the verdicts of the qualitative-links
    model with one individual: Truths are ND-necessary and Weak Rigid Comprehension hold, Atomicity
    at $t$ and Rigid Power fail, and there are infinitely many propositions. At $A$ there are exactly
    four propositions, so Infinity at $t$ fails there, and the pure sentence saying so is true at $1_A$
    and false at $1_B$, impossible at $i$.
