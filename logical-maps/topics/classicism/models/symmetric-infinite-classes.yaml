group: symmetric-ideally-full
settings:
  construction: 'A symmetric ideally-full intensional action model over one object, the set of natural
    numbers, equipped with an equivalence relation that has infinitely many classes, each infinite. Its
    arrows are all the surjections of that set, as in Base 1 of the draft, and its symmetry group is the
    automorphism group of the equivalence relation: the permutations that map classes onto classes. The
    evaluation point is the identity arrow.'
  individuals: base
  sigma: top
meets:
  no-actuality-anywhere: >-
    One object, so Actuality, a closed pure sentence, holds at every world iff at the identity,
    where it fails (recorded in this model’s verdicts).
  exact-collapses-of-every-size: >-
    The arrows are all the surjections: for any $n\ge2$ points, the one sending them to one of them
    and the remaining points bijectively onto the others.
  all-surjection-arrows: The arrows are all the surjections of $\mathbb N$, as in Base 1.
  section-arrows: 'As in symmetric-all-surjections, the arrows being all the surjections: let $k^{\prime}$
    agree with $k$ on $N$ and send distinct fresh points $x_t\notin N$ to $t\in T$, and let $\sigma$ be
    a surjection with $\sigma t=x_t$.'
  factorizable-arrows: Take $N^{\prime\prime}:=S$ and, enlarging $N$, assume $h(N^{\prime\prime})\subseteq
    N$. Let $k^{\prime\prime}$ agree with $h$ on $N^{\prime\prime}$; for $m\in M\setminus N^{\prime\prime}$
    let $k^{\prime\prime}m$ be some $n\in N$ with $kn=k^{\prime}m$ if there is one, and otherwise a fresh
    point outside $N$, one for each value of $k^{\prime}$. Let $j$ agree with $k$ on $N$ and send each
    fresh point to its value. Both extend to surjections, infinitely many points being left free, and
    $jk^{\prime\prime}$ agrees with $k^{\prime}$ on $M$.
  finitely-pinned-domains: A relational domain holds exactly the symmetric intensions pinned down by a
    finite set, and every individual $n$ is pinned down by $\{n\}$.
  collapse-onto-point: Take $F:=\lambda x\, .\,x\ne a$, so $p\notin F_h$. $h$ is any surjection constant
    on $N\cup\{a\}$; a transposition inside $y$'s class that fixes $p$ is an automorphism of the equivalence
    relation, and moves $y$.
  one-object-action-model: 'It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed
    by every arrow).'
  transposable: '$M=\emptyset$, and for $N$ the property of not belonging to $N$: the transposition of
    $y$ with another individual of its class outside $N$, which exists since the classes are infinite,
    maps classes onto classes, so lies in the symmetry group.'
  surjective-arrows: The arrows are all the surjections of $\mathbb N$, as in Base 1.
  hull-conditions: 'With $M_0=\emptyset$, as in Base 1: an arrow is prescribed only on a finite set and
    extends freely to a surjection; and a point outside $N$ can be transposed with a member of its own
    class outside $N\cup Q$, the classes being infinite, by a class-preserving permutation fixing $N$
    pointwise.'
  finite-pinning: Every object carries the ideal of finite sets.
arguments:
- fails:
  - transversal-r
  when:
    individuals: base
  text: 'At type e. The class of a fixed individual is the extension of a property pinned down by that
    individual. A classifier F pinned down by a finite set cannot choose a representative for the class
    of an individual in a class disjoint from that set: by symmetry and uniqueness the representative
    is fixed by every automorphism that fixes the pinning set of F and preserves the class, so its least
    pinning set lies inside the pinning set of F, and then its extension would be preserved by an automorphism
    that swaps the class with another.'
- holds:
  - inextensible-comprehension-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-28'
  writeup: symmetric-infinite-classes
  text: 'At every relational type: the witness for X pinned down by S agrees with X at the worlds that
    preserve the equivalence pattern on S, and is the S-hull of the extension of X elsewhere. Details
    in the write-up.'
- holds:
  - atomlessness
  text: As in Base 1.
- id: collapse-to-nd
  holds:
  - five-implies-nd-necessity
  fails:
  - truth-implies-five-necessity
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: Write $\mathrm{fix}_N$ for the arrows agreeing with the identity on the finite set $N$, the least
    true proposition pinned by $N$, and $\delta_N$ for the arrows injective on $N$. A true symmetric proposition
    pinned by $N$ contains the surjections that agree on $N$ with an automorphism of the equivalence relation.
    The set $\delta_N$ is symmetric, pinned by $N$ and true, with $\Diamond\delta_N=\delta_N$, and every
    true $q$ pinned by $N$ has $\Diamond q\supseteq\delta_N$, since a surjection injective on $N$ is undone
    on $N$ by some surjection. So $\Box_{\ne}p$ iff $p\supseteq\delta_N$ for some $N$. Likewise $\hat\Diamond\delta_N=\delta_N$
    (undo by a bijection, which returns to every truth), so $\hat{\hat\Box}$ and $\Box_{\ne}$ coincide,
    and BF at type $t$ holds for them by the bijection argument (a symmetric $Y$ pinned by $X_Y$ has $Y_k=Y_b$
    for a bijection $b$ agreeing with $k$ on $X_Y$); by Proposition D8 of The Bounds of Possibility, $\Box_5$
    implies ND-necessity. The truth that $0$ and $1$ are collapsed into one class... more precisely, with
    $0\sim1$, the true symmetric proposition $\{h:h(0)\sim h(1)\}$, pinned by $\{0,1\}$, is not ND-necessary,
    since a surjection injective on $\{0,1\}$ may separate the classes of $h(0)$ and $h(1)$; so not every
    truth is 5-necessary.
notes: 'The first recorded model refuting Transversal, so Transversal is not a theorem of C. Since the
  coalesced roots make every pure sentence consistent with C possible, □Transversal fails there too. The
  classes must be infinite: with finite classes, being identical to one of the members of a class is a
  canonical representative. The mechanism is a failure of weak elimination of imaginaries: the class,
  as a definable set, has no canonical finite set of parameters. Structures with weak elimination of imaginaries,
  such as a dense linear order or the random graph, give no such failure, and in the binary tree with
  a parent function the levels are fixed as soon as one node is. Since Inextensible Comprehension holds,
  it does not imply Transversal. Left unknown: the Axiom of Infinity at type e, and every signature schema,
  since no interpretation of Σ has been fixed. Vicinity fails by derivation: Weakly Inextensible Comprehension
  holds, and with Vicinity it would give Actuality.

  Since 2 October the Axiom of Infinity at type e holds by the group''s argument, and the record''s interpretation
  of Σ is its own text saying that none is fixed; its variants with each of the group''s interpretations
  are generated.'
