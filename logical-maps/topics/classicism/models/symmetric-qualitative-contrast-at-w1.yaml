references:
- paper: bacon-dorr-classicism
  role: background
  locator: Appendix D, p. 79, final construction (two copies of N)
  note: The construction of symmetric-qualitative-contrast, evaluated at the other object.
group: symmetric-ideally-full
settings:
  construction: >-
    The construction of symmetric-qualitative-contrast (Bacon and Dorr, Appendix D, p. 79): two objects
    $W_0$ and $W_1$, both copies of $\mathbb N$, all permutations of $\mathbb N$ as the arrows between
    any pair of objects, the ideal of finite sets at each, and the symmetry groups $G_{W_0}$ = all
    permutations and $G_{W_1}$ trivial. Evaluation point: $W_1$, at its identity arrow.
  individuals: base
  sigma: top
meets:
  finitely-pinned-domains: >-
    Each object carries the ideal of finite sets, and the domains hold the finitely pinned symmetric
    entities of every type.
arguments:
- id: c5
  holds: [necessary-distinctness-necessary-r]
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 25 October 2026; checked and recorded by Claude Opus
    5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  choice: free
  text: >-
    As at $W_0$ (symmetric-qualitative-contrast): every arrow is invertible, so transport along an arrow
    is injective at every type, and identity and distinctness persist along every arrow, from every object.
- id: relational-choice
  holds: [relational-choice-r]
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 25 October 2026; checked and recorded by Claude Opus
    5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  choice: uses
  text: >-
    At $W_1$ every relation between the entities there is the extension of a relation in the domain. Given
    a set $R$ of tuples, let $\hat R$ have value $R$ at every arrow into $W_1$ and $\emptyset$ at every arrow
    into $W_0$. Parallel arrows get the same value, so $\hat R$ is pinned down by $\emptyset$; at $W_1$
    there is no symmetry condition, $G_{W_1}$ being trivial, and the empty value meets the one at $W_0$.
    So for a serial relation, a choice of one output for each input, made in the metatheory, is the
    extension of a functional subrelation in the domain.
- id: transfer-from-w0
  when: {individuals: base}
  fails: [necessary-relational-choice-r, boolean-completeness-t, countable-boolean-completeness-r]
  holds: [necessary-intensional-choice-r]
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  choice: free
  text: >-
    Each object has arrows to both objects, so a boxed principle holds at $W_1$ iff it holds at $W_0$ and
    $W_1$. Relational Choice fails at $W_0$ (the group's argument relational-choice, the transposition
    of a chosen individual outside a pinning set being a symmetry of $W_0$), so □Relational Choice fails
    at $W_1$; Intensional Choice holds at both objects (symmetric-qualitative-contrast). Boolean
    Completeness (type $t$) and Countable Boolean Completeness fail at $W_1$ itself, by the argument
    for their boxed forms in symmetric-qualitative-contrast, which is made at $W_1$.
- id: transfer-boxed
  holds: [necessary-transversal-r, necessity-of-second-order-analysis]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    Every arrow leads to $W_0$ or $W_1$, and from each object to both, so a boxed sentence, or a
    disjunction of them, holds at $W_1$ iff at $W_0$. Transversal holds at $W_0$ (from Actuality) and at
    $W_1$ (from Transversal Choice), so □Transversal holds; Necessity of Second-Order Analysis holds at
    $W_0$ (recorded).
- id: infinity-t
  holds: [axiom-of-infinity-t]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    The numerals at $t$ form a property pinned down by $\varnothing$, so finite cardinality is standard,
    and the propositions that an arrow into $W_1$ sends $0$ to $n$, one for each $n$, are distinct.
- id: atom-at-w0
  fails: [atomlessness, forcing-possibilism]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-28'
  text: >-
    Any two arrows into $W_0$ differ by a member of $G_{W_0}$, so a proposition contains all of them or
    none; the proposition $q_0$ of the arrows into $W_0$, pinned down by $\varnothing$, is an atom. A
    nonzero set of arrows into $W_1$, pinned down by a finite $N$, is split by the value of the arrow at
    a point outside $N$; so the propositions below a proposition other than $\top$ number $1$, $2$ or
    infinitely many. But $\bot$, $q_0$, $\neg q_0$ and $\top$ form a complete four-element Boolean
    algebra, so Forcing Possibilism fails.
notes: >-
  Recorded for the separation of Relational Choice from its necessitation under C5: Relational Choice
  holds at $W_1$ because its symmetry group is trivial, and fails at $W_0$, which $W_1$ sees. Astra's note
  also shows that □Relational Choice fails at $W_1$ with relational outputs as well (input and output
  type $e\to t$, through haecceities), and that the model satisfies its strong "logical observer"
  separation principles, which the map does not record.
