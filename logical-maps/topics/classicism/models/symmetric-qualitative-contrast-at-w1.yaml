id: symmetric-qualitative-contrast-at-w1
name: 'Symmetric ideally-full model: qualitative contrast, evaluated at W1'
certificate:
  source_id: misc
  produced_by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, 25 October 2026 (evaluation at $W_1$ and
    the Relational Choice verdict), on the construction of Andrew Bacon and Cian Dorr
  recorded_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 28 October 2026
  checked_by: []
  date: '2026-10-28'
  lean: none
sources:
- >-
  GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, Logical observers and Choice, research note of 25
