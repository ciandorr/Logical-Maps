description: 'Appendix D, p. 79, the final construction, the paper’s precursor of the symmetric ideally-full
  models of Dorr’s draft (Definitions 15–18, p. 8): the base has two objects $W_0$ and $W_1$, both copies
  of $\mathbb N$, all permutations of $\mathbb N$ as the arrows between any pair of objects, the ideal
  of finite sets at each, and the symmetry groups $G_{W_0}$ = all permutations and $G_{W_1}$ trivial.
  The paper states the symmetry condition on propositions only, as the constraint that a set of arrows
  in $W_i^t$ containing an arrow $h$ into $W_0$ contains $g\circ h$ for every permutation $g$ of $W_0$,
  and takes the finitely pinned entities at higher types; since every arrow is invertible, that is the
  draft’s symmetry condition at every type, applied to the entities’ values. Intuitively $W_0$ is a state
  in which all individuals are qualitatively indiscernible and $W_1$ one in which each plays a unique
  role. The smallest proposition of $W_0^t$ containing the identity is the set of all arrows $W_0\to W_0$,
  which witnesses Actuality at $W_0$; Actuality fails at $W_1$ as in part 1, so $\Box$Actuality and hence
  Atomicity fail at $W_0$ although C5 holds. Evaluation point: $W_0$, at its identity arrow.'
notes: 'The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Interpretation
  of Σ, fixed for this record: each relational constant denotes the top element of its type and each individual
  constant denotes one fixed individual. Under it the signature schemata fail. Let $c\in\Sigma$ have relational
  type $\tau$, so $c=\top_\tau$ necessarily. Witnessed Possibility fails for the pure formula $x\ne\top_\tau$,
  witnessed by $\bot_\tau$ but impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and
  $\lambda x\, .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes
  what the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since $c=\top_\tau$
  is a true identity that C(Σ) does not prove. Everything that implies these fails with them. Distinctness-preserving
  collapse fails at $W_0$: every arrow has an inverse, so $\Diamond q$ holds at every arrow for every
  true $q$, and $\Box(\Diamond q\to p)$ would force every true $p$ to contain every arrow; but the true
  proposition consisting of all arrows $W_0\to W_0$ together with the arrows into $W_1$ fixing $0$ is
  pinned down by $\{0\}$, meets the closure constraint, and omits arrows. Relational Choice fails, at
  the types $(e\to t)$ and $e$. Let $U:=\lambda Xy\, .\,Xy\lor\neg\exists z\, .\,Xz$, a closed term, hence
  in the domain, and serial. A functional subrelation $S$ of $U$ would lie in the domain at the evaluation
  object, so it is symmetric and pinned down by a finite set $N$. Two facts about such an $S$ (Dorr, draft,
  Lemma 21): every $g\in G$ fixing $N$ pointwise satisfies $g^{[\sigma]}S=S$, and symmetry gives $\langle
  gA,gy,g\rangle\in S$ whenever $\langle A,y,1\rangle\in S$; together, $\langle gA,gy,1\rangle\in S$.
  Now let $A$ be the property of not belonging to $N$, at $W_0$. It is in the domain, being pinned down
  by that finite set and symmetric, and its extension is nonempty, so $S$ relates $A$ at the identity
  to some $y$ in its extension. The transposition of $y$ with another individual outside $N$ is a permutation
  of $W_0$, so lies in $G_{W_0}$, fixes $A$ and moves $y$ to some $gy\ne y$, so $S$ relates $A$ to $gy$
  as well, and $S$ is not functional at the identity arrow. Argument of 23 September 2026, after Cian
  Dorr’s observation that a choice over the individuals cannot be finitely pinned down; the well-ordering
  of the individuals that he had in mind is refuted by the same two facts, but the direct route needs
  no derivation of a well-ordering from Relational Choice in C. Functional Choice also fails, including
  with relational outputs: replace a selected individual by its haecceity (the accompanying write-up gives
  an independent transposition proof of both failures). Plenitude still holds by C5 plus Actuality and
  Propositions 2.5 and 2.14, so this model separates it from Functional Choice even under C5, Rigid Comprehension
  and Boolean Completeness. This does not settle whether C5 plus Functional Choice implies Atomicity:
  the model fails the proposed premise.'
