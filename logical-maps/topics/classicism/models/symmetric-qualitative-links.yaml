description: 'A symmetric ideally-full intensional action model over one object whose individuals carry
  qualitative structure. The domain is the disjoint union of points, of two companions for each point,
  and of infinitely many links for each ordered pair of distinct points. A ternary relation holds of two
  points and a third individual when that individual is a link over the two if they differ, and a companion
  of them if they coincide, so the relation''s fibres are infinite over distinct points and of size two
  over a repeated point. The arrows are required to preserve that relation. The symmetry group is the
  relation-preserving permutations that fix a distinguished pair of points setwise, and the remaining
  arrows are the surjective relation-preserving maps that collapse that pair. The evaluation point is
  the identity arrow.


  Actuality holds, and necessarily, since membership in the symmetry group is again the condition that
  the distinguished pair is not collapsed, so the group is pinned down by that pair. The type-e instance
  of BF holds, and necessarily, since every arrow is surjective, so a property necessarily had by everything
  is the top property. Boolean Completeness holds, and necessarily, by the draft''s main theorem in its
  closure-operation form: the constant closure operations do not work here, and the operation used instead
  adds to a finite set the point coordinates of its members and then both companions of each of its points.


  Rigid Comprehension fails at type e. The property of being related to the distinguished pair is persistent
  and finitely pinned, and it is shown to be the only candidate coextensive with itself. But at a world
  collapsing the pair, its extension shrinks to a two-element fibre, and the union of the two haecceities
  of that fibre is persistent with the same extension there while being strictly stronger, because some
  arrow merges the two companions. So the rigidity criterion fails at that world.'
notes: 'This is the draft''s answer to the question its two-object model leaves open. Boxed Boolean Completeness,
  boxed Actuality and the boxed type-e instance of BF all hold, and Rigid Comprehension still fails, so
  the obstruction need not live at a world where BF fails; it can live inside a qualitative fibre that
  BF at type e cannot see. The map has no separate principle for the type-e instance of BF, and the draft
  leaves the higher-type instances unchecked, so the BF schema is recorded as unknown here. The draft
  also asserts that Atomicity fails, as in the collapse-pair model, but does not write the argument out,
  so that too is left unknown; note that the recorded implication from boxed Atomicity, Boolean Completeness
  and BF to Rigid Comprehension means one of those two unknowns has to come out negative. ND fails at
  type e because the collapsing arrows are arrows. The source is a work in progress, and its own status
  note describes this section as exploratory though complete for the claims recorded here. Interpretation
  of Σ, fixed for this record: one designated relational constant $c$ of type $\tau=\bar\sigma t$ denotes
  $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of the model, the actual-world proposition
  described above; every other relational constant denotes the top element of its type and every individual
  constant one fixed individual. Under it: No Contingency (signature Σ) fails, since the Σ-sentence $\forall\bar
  x\, .\,c\bar x$ denotes $a$, true and contingent; B for sentences of Σ fails, since under any arrow
  that no arrow composes back into $a$, $\Diamond a$ is false, so $\Box\Diamond a$ fails; Witnessed Possibility
  fails for the pure formula $x=\top_\tau$, witnessed by $\top_\tau$, since $\Diamond(c=\top_\tau)$ is
  $\Diamond\Box a$ and $a$ is necessary at no arrow; Separated Structure fails with it, being equivalent
  to Possibly Witnessed Possibility; Independence (signature Σ) and Distinctness Maximalism (signature Σ) fail through
  the other relational constants, Σ being assumed to contain at least one: such a constant $c''$ of type
  $\tau''$ denotes what the closed pure term $\top_{\tau''}$ denotes, and $c''=\top_{\tau''}$ is a true
  identity that C(Σ) does not prove. The designated constant refutes neither: closed pure terms denote
  entities fixed by every arrow (Classicism, §3.5, p. 58), whereas $a$ is fixed by no arrow but the identity,
  so no closed pure term denotes $\lambda\bar x\, .\,a$. Everything that implies these fails with them.'
changes:
- date: '2026-09-20'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added both Axioms of Infinity at Cian Dorr's direction. The individuals are the natural numbers
    and identity at the identity arrow is literal, so no numeral counts them. The propositions that a
    given individual is fixed by the arrow, one for each individual, are pairwise distinct, symmetric
    and pinned by that individual, so there are infinitely many propositions. The set of numerals at each
    type is invariant under every arrow, hence symmetric and pinned by the empty set, so finite cardinality
    is standard and no finite cardinality holds of the universal property at either type.
  satisfies:
  - axiom-of-infinity-e
  - axiom-of-infinity-t
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Fixed an interpretation of Σ (relational constants as top, individual constants as one fixed
    individual) and recorded the signature schemata it refutes, at Cian Dorr’s request.
  violates:
  - witnessed-possibility-r
  - separated-structure-r
  - independence-signature-r
  - distinctness-signature-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: Re-fixed the interpretation of Σ so as to settle No Contingency (signature Σ) and B for sentences
    of Σ, at Cian Dorr’s request; see the notes.
  violates:
  - no-contingency-signature-r
  - signature-b-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Corrected the reason given for the failures of Independence (signature Σ) and Distinctness
    (signature Σ): the true atom is denoted by no closed pure term, since such terms denote entities fixed
    by every arrow; the failures come from the other relational constants, which denote top. No verdict
    changes.'
- date: '2026-09-25'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Recorded the Distinctness-preserving collapse by the argument used for the other symmetric
    models. Let $a$ be the symmetry group, the model’s Actuality witness, so $a\le p$ for every true
    $p$. Take $q:=a$: under an arrow $i$ in the group, $p$ holds since $i\in a\subseteq p$; under a
    collapsing arrow $i$, $\Diamond a$ would need $k\circ i$ to be a permutation, and no composite with
    a map that collapses the distinguished pair is injective. So every truth is $\Box_{\ne}$-necessary.'
  satisfies:
  - distinctness-preserving-collapse
