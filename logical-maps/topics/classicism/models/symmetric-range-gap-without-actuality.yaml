description: 'A symmetric ideally-full intensional action model over one object, the set of natural numbers.
  Its arrows are of two disjoint kinds: the surjections for which the distinguished individual is its
  own only preimage, and the functions that omit the distinguished individual from their range. Its symmetry
  group is the permutations fixing that individual, which is now a proper subset of the first kind. An
  arrow''s value at the distinguished individual still tells the two kinds apart, but no finite set separates
  any arrow. The evaluation point is the identity arrow.


  Boolean Completeness holds by the draft''s main theorem with the distinguished individual as the distinguished
  set. Two arrows agreeing there lie in the same one of the two classes, and a prescription taken from
  the two of them extends within that class, by nonzero values in the second case and by surjective nonzero
  values in the first. One object gives No Pure Contingency and the boxed form.


  BF fails at type e by the argument of the previous variant, which goes through verbatim. Actuality and
  Atomicity fail because the first class of arrows contains non-injective ones, which restores the arguments
  used for the all-surjections model: given a true proposition pinned down by a finite set containing
  the distinguished individual and one other, the proposition that a fresh individual is not collapsed
  with that set is a strictly stronger truth; and the same splitting applied to an arbitrary nonzero proposition
  rather than a true one gives Atomlessness.'
notes: 'The second of the draft''s two variants in which BF fails, arranged so that the range deficiency
  no longer brings Actuality with it. Since Actuality fails, Weak Rigid Comprehension and Rigid Comprehension
  fail too, which are recorded as derived verdicts. Atomlessness is the Proposition 45 argument for Atomicity
  read for an arbitrary nonzero proposition, and the failure of ND at type e follows from the non-injective
  arrows; neither is displayed separately in the draft. The source is a work in progress. Interpretation
  of Σ, fixed for this record: each relational constant denotes the top element of its type and each individual
  constant denotes one fixed individual. Under it the signature schemata fail. Let $c\in\Sigma$ have relational
  type $\tau$, so $c=\top_\tau$ necessarily. Witnessed Possibility fails for the pure formula $x\ne\top_\tau$,
  witnessed by $\bot_\tau$ but impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and
  $\lambda x\, .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes
  what the closed pure term $\top_\tau$ denotes; Distinctness (signature Σ) fails since $c=\top_\tau$
  is a true identity that C(Σ) does not prove. Everything that implies these fails with them. Relational
  Choice fails, at the types $(e\to t)$ and $e$. Let $U:=\lambda Xy\, .\,Xy\lor\neg\exists z\, .\,Xz$,
  a closed term, hence in the domain, and serial. A functional subrelation $S$ of $U$ would lie in the
  domain at the evaluation object, so it is symmetric and pinned down by a finite set $N$. Two facts about
  such an $S$ (Dorr, draft, Lemma 21): every $g\in G$ fixing $N$ pointwise satisfies $g^{[\sigma]}S=S$,
  and symmetry gives $\langle gA,gy,g\rangle\in S$ whenever $\langle A,y,1\rangle\in S$; together, $\langle
  gA,gy,1\rangle\in S$. Now let $A$ be the property of not belonging to $N\cup\{0\}$. It is in the domain,
  being pinned down by that finite set and symmetric, and its extension is nonempty, so $S$ relates $A$
  at the identity to some $y$ in its extension. The transposition of $y$ with another individual outside
  $N\cup\{0\}$ fixes $0$, so lies in $G$, fixes $A$ and moves $y$ to some $gy\ne y$, so $S$ relates $A$
  to $gy$ as well, and $S$ is not functional at the identity arrow. Argument of 23 September 2026, after
  Cian Dorr’s observation that a choice over the individuals cannot be finitely pinned down; the well-ordering
  of the individuals that he had in mind is refuted by the same two facts, but the direct route needs
  no derivation of a well-ordering from Relational Choice in C. Inextensible Comprehension is left unknown,
  and its failure of Actuality does not sharpen to it at the lowest types. The type-$t$ instance is trivial.
  At type $e\to t$ it holds: the persistent properties pinned down by a finite set with infinite extension
  $E$ are $\lambda x\, .\,x\ne0$ when $0\notin E$ and $\lambda x\, .\,x\ne0\lor h0=0$ when $0\in E$ (the
  value $0$ is reached only by arrows of the first kind, and only from $0$); a cofinite extension $\mathbb
  N\setminus F$ is then that of the inextensible $\lambda x\, .\,x\notin h[F]\land(x\ne0\lor h0=0)$, checked
  world by world against those two properties, and a finite extension has its rigid haecceity union. A
  failure, if there is one, lies at a relational or higher type. BF fails at type $t$ as well. In a one-object
  finitely pinned model, BF (type t) fails as soon as there are a finite $N$, an arrow $i$ and a proposition
  $q$ in the domain that is the transport $i^{\prime}\cdot p=\{k : k\circ i^{\prime}\in p\}$ of no proposition
  $p$ along any arrow $i^{\prime}$ agreeing with $i$ on $N$: the intension $X:=\{\langle r,j\rangle :
  r\ne q\text{ or }j\text{ disagrees with }i\text{ on }N\}$ is pinned down by $N$, contains $\langle i^{\prime}\cdot
  p,i^{\prime}\rangle$ for every $p$ and $i^{\prime}$, so $\forall p\, .\,\Box Xp$ holds at the identity,
  and omits $\langle q,i\rangle$, so $\Box\forall p\, .\,Xp$ fails there. Since membership of $k$ in $i^{\prime}\cdot
  p$ depends only on $k$ restricted to the range of $i^{\prime}$, it suffices that $q$ separate two arrows
  agreeing on every such range. Here take $N=\{0\}$, $i$ any arrow with $i0\ne0$, so that every arrow
  agreeing with it on $N$ omits $0$ from its range, and $q:=\{k : k0=0\}$, the first class of arrows,
  pinned down by $\{0\}$ and symmetric: an arrow $k$ of the first class and the arrow $k^{\prime}$ agreeing
  with it off $0$ but sending $0$ elsewhere, which omits $0$ from its range since $0$ is $k$’s only preimage
  of $0$, are separated by $q$. The intension $X$ is symmetric, since $g\cdot q=q$ for $g$ fixing $0$
  and $(g\circ j)0=0$ iff $j0=0$, so it lies in the domain. Observation of 23 September 2026, answering
  Cian Dorr’s question whether the failure of BF sharpens to type $t$.'
changes:
- date: '2026-09-20'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added both Axioms of Infinity at Cian Dorr's direction. The individuals are the natural numbers
    and identity at the identity arrow is literal, so no numeral counts them. The propositions that a
    given individual is fixed by the arrow, one for each individual, are pairwise distinct, symmetric
    and pinned by that individual, so there are infinitely many propositions. The set of numerals at each
    type is invariant under every arrow, hence symmetric and pinned by the empty set, so finite cardinality
    is standard and no finite cardinality holds of the universal property at either type.
  satisfies:
  - axiom-of-infinity-e
  - axiom-of-infinity-t
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Fixed an interpretation of Σ (relational constants as top, individual constants as one fixed
    individual) and recorded the signature schemata it refutes, at Cian Dorr’s request.
  violates:
  - witnessed-possibility-r
  - separated-structure-r
  - independence-signature-r
  - distinctness-signature-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Recorded the failure of Relational Choice, at types (e→t) and e: a functional subrelation
    of the serial relation pairing each property with its members would be symmetric and finitely pinned,
    and a symmetry fixing its pinning set would carry its choice for the property of lying outside that
    set to a second choice. Cian Dorr’s observation that a choice cannot be finitely pinned; argument
    in the notes.'
  violates:
  - relational-choice-r
