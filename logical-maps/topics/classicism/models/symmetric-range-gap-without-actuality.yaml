group: symmetric-ideally-full
settings:
  construction: 'A symmetric ideally-full intensional action model over one object, the set of natural
    numbers. Its arrows are of two disjoint kinds: the surjections for which the distinguished individual
    is its own only preimage, and the functions that omit the distinguished individual from their range.
    Its symmetry group is the permutations fixing that individual, which is now a proper subset of the
    first kind. An arrow''s value at the distinguished individual still tells the two kinds apart, but
    no finite set separates any arrow. The evaluation point is the identity arrow.'
  individuals: base
  sigma: top
meets:
  no-atoms-anywhere: >-
    One object. A symmetric proposition pinned down by a finite $N$ and containing an arrow $k$
    contains every arrow of the same kind agreeing with $k$ on $N$ up to symmetry; two of these, one
    identifying two fresh points outside $N$ and one separating them, have different kernels, which
    symmetry (post-composition with permutations) preserves, so they lie in disjoint nonempty
    symmetric propositions pinned down by a larger finite set. So no proposition is an atom.
  no-actuality-anywhere: >-
    One object, so Actuality, a closed pure sentence, holds at every world iff at the identity,
    where it fails (recorded in this model’s verdicts).
  exact-collapses-of-every-size: >-
    Take $n\ge2$ points other than the distinguished individual $d$: the map constant on them with a
    value other than $d$, and injective off them with values avoiding $d$ and that value, omits $d$
    from its range, so is an arrow of the second kind.
  factorizable-arrows: As in symmetric-range-gap, with $d$ in $S$ and $N$ and the kinds told apart by
    the value at $d$, the first kind now being the surjections for which $d$ is its own only preimage.
    For $m\in M\setminus N^{\prime\prime}$ let $k^{\prime\prime}m$ be some $n\in N$ with $kn=k^{\prime}m$
    when $k$ is of the first kind and there is one (then $n\ne d$, as $k^{\prime}m\ne d$), and otherwise
    a fresh point outside $N\cup\{d\}$, one for each value of $k^{\prime}$; let $j$ agree with $k$ on
    $N$ and send each fresh point to its value, never $d$. Arrows of the first kind need only be surjective
    with $d$ the only preimage of $d$, so $k^{\prime\prime}$ and $j$ extend to arrows of the kinds of
    $h$ and $k$, and $jk^{\prime\prime}$ agrees with $k^{\prime}$ on $M$.
  finitely-pinned-domains: A relational domain holds exactly the symmetric intensions pinned down by a
    finite set, and every individual $n$ is pinned down by $\{n\}$.
  collapse-onto-point: 'As for the range-gap model: $F:=\lambda x\, .\,x\ne a\land\neg Ex$ with $E$ the
    constant intension $\{d\}$ of the distinguished individual, and $h$ a range-deficient function constant
    with value $p\ne d$ on $N\cup\{a\}$; $F_h$ omits $p$ and $d$, and permutations fixing $p$ and $d$
    move every other point.'
  one-object-action-model: 'It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed
    by every arrow).'
  transposable: '$M=\{0\}$, the distinguished individual, and for $N$ the property of not belonging to
    $N\cup\{0\}$: the transposition of $y$ with another individual outside $N\cup\{0\}$ fixes $0$, so
    lies in the symmetry group.'
  fixes-or-omits: The arrows are the surjections for which $0$ is its own only preimage, which fix it,
    and the functions omitting $0$ from their range.
  transport-gap: 'Take $N=\{0\}$, $i$ any arrow with $i0\ne0$, so that every arrow agreeing with it on
    $N$ omits $0$ from its range, and $q:=\{k : k0=0\}$, the first class of arrows, pinned down by $\{0\}$
    and symmetric: an arrow $k$ of the first class and the arrow $k^{\prime}$ agreeing with it off $0$
    but sending $0$ elsewhere, which omits $0$ from its range since $0$ is $k$’s only preimage of $0$,
    are separated by $q$. The intension the argument uses is pinned down by $N$, and symmetric, since
    $g\cdot q=q$ for $g$ fixing $0$ and $(g\circ j)0=0$ iff $j0=0$, so it lies in the domain.'
  hull-conditions: With $M_0=\{0\}$, the distinguished individual (the draft's argument for this model).
    Two arrows agreeing there lie in the same one of the two classes, and a prescription taken from the
    two of them extends within that class, by nonzero values in the second case and by surjective nonzero
    values in the first; points are moved off a finite set by a permutation fixing $0$.
  retractable-means-actual-pattern: 'With $N^\prime=N\cup\{0\}$: if $x\circ u$ is the identity on $N^\prime$
    then $u$ fixes $0$, so is of the first kind, and is injective on $N^\prime$; it therefore agrees on
    $N$ with a permutation fixing $0$, a member of the symmetry group.'
arguments:
- holds:
  - atomlessness
  text: 'The first class of arrows contains non-injective ones, which restores the arguments used for
    the all-surjections model: given a true proposition pinned down by a finite set containing the distinguished
    individual and one other, the proposition that a fresh individual is not collapsed with that set is
    a strictly stronger truth; and the same splitting applied to an arbitrary nonzero proposition rather
    than a true one gives Atomlessness.'
- holds:
  - inextensible-comprehension-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: 'At every relational type, by an adaptation of the argument recorded for the all-surjections model
    (symmetric-all-surjections), whose facts (1)–(3) and transversal lemma are used here. Write $0$ for
    the distinguished individual, $A$ for the first class of arrows (surjections with $0$ as its own only
    preimage) and $B$ for the second (arrows omitting $0$ from their range). $B$ is absorbing: if $h\in
    B$ then $i\circ h$ omits $0$, since $i0=0$ only when $i\in A$ and then $i$ sends nothing else to $0$.
    So the proposition $\alpha:=\{k : k0=0\}$, the class $A$, is true at $1$, pinned down by $\{0\}$,
    symmetric, and once false stays false.

    Given $X$ pinned down by $S_X$, put $S:=S_X\cup\{0\}$ and $Y:=\lambda\bar z\, .\,\alpha\land\delta_S\land
    X\bar z$, with $\delta_S$ the proposition that no two members of $S$ are collapsed. $Y$ is symmetric,
    pinned down by $S$ and coextensive with $X$. At a world in $B$, or one collapsing $S$, $Y$ is empty
    there and at every world it sees. A world $i\in A$ injective on $S$ can be relabelled by a permutation
    fixing $0$, hence in the symmetry group, so that it fixes $S$ pointwise. For such $i$ the transversal
    lemma holds: $i$ is surjective, preimages of points outside $S$ lie outside $S$, the permutation $\tau$
    of $\mathbb N\setminus S$ fixes $0$ and so lies in the symmetry group, which keeps the extension of
    $X$ at $1$ closed under $\tau\cdot$, and $i\circ\tau\in A$ fixes the pinning set of $r$. The rest
    of the argument, including the leading box, goes through verbatim. BF fails here, so the surjectivity
    used in the lemma is available only at the worlds in $A$; the conjunct $\alpha$ removes the others.'
- id: rigid-power
  holds:
  - rigid-power-r
  by: GPT-6 Astra (OpenAI), at Cian Dorr's request; checked and recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-11'
  text: 'The argument rigid-power-surjections, adapted. Let $d$ be the distinguished individual and $B$
    the others; the kind-$A$ arrows are the surjections with $d$ its own only preimage, the kind-$K$ arrows
    the maps into $B$; an arrow''s kind is its value at $d$. Put $d$ in every pinning set below; Tame
    Rigidity holds at every type (tame-rigidity-factorizable).

    Stable sets: if a set of tuples is closed under the kind-$A$ arrows fixing $P$, its $B_P$ is weakly
    rigid. In the proof take $u$ of kind $A$ fixing $P$, sending $M\setminus P$ to fresh points of $B$
    outside $Q$, and $r$ of the kind of $l$; every prescribed value other than at $d$ lies in $B$, so
    $r$ extends to an arrow of that kind.

    Exact images: call $j$ regular when it maps $B$ onto $B$; every kind-$A$ arrow is regular. For weakly
    rigid $F$ with extension $E$, $F_j=jE$ for every regular $j$, taking the $u$ of the exact-image step
    of kind $A$ fixing $S$; the values prescribed off $S$ lie in $B$ and regularity supplies preimages
    in $B$.

    Lifting: extend $k|_N$ to a regular $j$ of $k$''s kind with finitely many non-singleton fibres, all
    finite, put them inside $P$, and take $T\setminus\{d\}\subseteq jP$. For $u$ of kind $A$ fixing $P$,
    define $v$ by $vj=ju$ on the range of $j$, and, when $j$ has kind $K$ (range $B$), $v(d):=d$. Then
    $v$ maps $B$ onto $B$, has no preimage of $d$ in $B$, and fixes $T$: it is a kind-$A$ arrow fixing
    $T$. So $\{a\in E:ja\in D\}$ is closed under the kind-$A$ arrows fixing $P$, and the rest is as before:
    Rigid Power at every type, for either choice of individuals.'
notes: The second of the draft's two variants in which BF fails, arranged so that the range deficiency
  no longer brings Actuality with it. Since Actuality fails, Weak Rigid Comprehension and Rigid Comprehension
  fail too, which are recorded as derived verdicts. Atomlessness is the Proposition 45 argument for Atomicity
  read for an arbitrary nonzero proposition, and the failure of ND at type e follows from the non-injective
  arrows; neither is displayed separately in the draft. The source is a work in progress. Everything that
  implies these fails with them.
history:
- date: '2026-09-20'
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr
  summary: Added both Axioms of Infinity at Cian Dorr's direction. The individuals are the natural numbers
    and identity at the identity arrow is literal, so no numeral counts them. The propositions that a
    given individual is fixed by the arrow, one for each individual, are pairwise distinct, symmetric
    and pinned by that individual, so there are infinitely many propositions. The set of numerals at each
    type is invariant under every arrow, hence symmetric and pinned by the empty set, so finite cardinality
    is standard and no finite cardinality holds of the universal property at either type.
  satisfies:
  - axiom-of-infinity-e
  - axiom-of-infinity-t
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr
  summary: Fixed an interpretation of Σ (relational constants as top, individual constants as one fixed
    individual) and recorded the signature schemata it refutes, at Cian Dorr’s request.
  violates:
  - witnessed-possibility-r
  - separated-structure-r
  - independence-signature-r
  - distinctness-signature-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr
  summary: 'Recorded the failure of Relational Choice, at types (e→t) and e: a functional subrelation
    of the serial relation pairing each property with its members would be symmetric and finitely pinned,
    and a symmetry fixing its pinning set would carry its choice for the property of lying outside that
    set to a second choice. Cian Dorr’s observation that a choice cannot be finitely pinned; argument
    in the notes.'
  violates:
