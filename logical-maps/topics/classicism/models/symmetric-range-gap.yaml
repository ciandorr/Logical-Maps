description: >-
  A symmetric ideally-full intensional action model over one object, the set of natural numbers. Its symmetry
  group is the permutations fixing a distinguished individual, and its arrows are those permutations together
  with all the functions that omit the distinguished individual from their range. The two classes are
  told apart by an arrow's value at that individual, so the symmetry group is a finitely pinned proposition
  and Actuality holds. The evaluation point is the identity arrow.


  Boolean Completeness holds by the draft's main theorem with the distinguished individual as the distinguished
  set. Moving points off a finite set can be done by a permutation fixing that individual, and two arrows
  agreeing there are either both permutations or both range-deficient, so a prescription taken from the
  two of them extends by nonzero values to an arrow of the same kind. One object gives No Pure Contingency
  and the boxed forms.


  BF fails at type e. Take the property of being positive unless things are as they actually are, which
  is pinned down by the distinguished individual and is symmetric. Every individual necessarily has it,
  since an arrow either fixes the distinguished individual or omits it from its range and so sends everything
  to something positive; but it is not necessary that everything has it, since any arrow moving the distinguished
  individual leaves it out.
notes: >-
  The first of the draft's two variants in which BF is made to fail. Actuality and the range deficiency
  come from the same finite test here, which is what the next variant prises apart. Atomicity and Rigid
  Comprehension are not settled in the draft and are left unknown. ND fails at type e because the range-deficient
  arrows include non-injective ones; the draft does not draw that consequence separately. The source is
  a work in progress.
