description: 'A symmetric ideally-full intensional action model over one object, the set of natural numbers.
  Its symmetry group is the permutations fixing a distinguished individual, and its arrows are those permutations
  together with all the functions that omit the distinguished individual from their range. The two classes
  are told apart by an arrow''s value at that individual, so the symmetry group is a finitely pinned proposition
  and Actuality holds. The evaluation point is the identity arrow.


  Boolean Completeness holds by the draft''s main theorem with the distinguished individual as the distinguished
  set. Moving points off a finite set can be done by a permutation fixing that individual, and two arrows
  agreeing there are either both permutations or both range-deficient, so a prescription taken from the
  two of them extends by nonzero values to an arrow of the same kind. One object gives No Pure Contingency
  and the boxed forms.


  BF fails at type e. Take the property of being positive unless things are as they actually are, which
  is pinned down by the distinguished individual and is symmetric. Every individual necessarily has it,
  since an arrow either fixes the distinguished individual or omits it from its range and so sends everything
  to something positive; but it is not necessary that everything has it, since any arrow moving the distinguished
  individual leaves it out.'
notes: 'The first of the draft''s two variants in which BF is made to fail. Actuality and the range deficiency
  come from the same finite test here, which is what the next variant prises apart. Atomicity and Rigid
  Comprehension are not settled in the draft and are left unknown. ND fails at type e because the range-deficient
  arrows include non-injective ones; the draft does not draw that consequence separately. The source is
  a work in progress. Interpretation of Σ, fixed for this record: each relational constant denotes the
  top element of its type and each individual constant denotes one fixed individual. Under it the signature
  schemata fail. Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily. Witnessed
  Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but impossible of $c$;
  Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\, .\,\top_\tau$ agree on $c$ and differ;
  Independence (signature Σ) fails since $c$ denotes what the closed pure term $\top_\tau$ denotes; Distinctness
  (signature Σ) fails since $c=\top_\tau$ is a true identity that C(Σ) does not prove. Everything that
  implies these fails with them.'
changes:
- date: '2026-09-20'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added both Axioms of Infinity at Cian Dorr's direction. The individuals are the natural numbers
    and identity at the identity arrow is literal, so no numeral counts them. The propositions that a
    given individual is fixed by the arrow, one for each individual, are pairwise distinct, symmetric
    and pinned by that individual, so there are infinitely many propositions. The set of numerals at each
    type is invariant under every arrow, hence symmetric and pinned by the empty set, so finite cardinality
    is standard and no finite cardinality holds of the universal property at either type.
  satisfies:
  - axiom-of-infinity-e
  - axiom-of-infinity-t
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Fixed an interpretation of Σ (relational constants as top, individual constants as one fixed
    individual) and recorded the signature schemata it refutes, at Cian Dorr’s request.
  violates:
  - witnessed-possibility-r
  - separated-structure-r
  - independence-signature-r
