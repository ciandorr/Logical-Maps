notes: >-
  The symmetric all-surjections model of Dorr's draft with pinning sets of size at most $\kappa$ in a base of
  size $\kappa^+$, a free-word factor on the arrows, and Σ glued along the words. It adds Logical Necessity
  to that model's package: Logical Necessity holds with □Boolean Completeness, □BF and □Weakly Rigid Power,
  while Actuality, Vicinity and Relational Choice fail. Finite pinning would not do, since the gluing
  absorbs the pinning sets of infinitely many witnesses, and nor would the surjections alone, since a later
  collapse merges any gluing sites among the points. The variant with an idempotent in the monoid factor
  keeps all of this but BF; the variant with the members of $U$ as individuals adds the Axioms of
  Infinity.
