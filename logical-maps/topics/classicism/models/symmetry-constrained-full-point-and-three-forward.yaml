references:
- paper: dorr-bc-not-rc
  role: background
  locator: Definitions 15–18, p. 8; Proposition 20
  note: The symmetry condition, with the improper ideal at both objects; Proposition 20 (in the topic's
    Lean, symIdeal_isModel, for any category of sets) needs only that the symmetries be invertible arrows.
group: symmetry-constrained-full
settings:
  construction: >-
    The arrows are the identity of $W_0=\{x\}$, the three maps $h_n:x\mapsto n$ into $X$, and the six
    permutations of $X$: no arrow leads from $X$ back to $W_0$, and no other map of $X$ to itself is an
    arrow.
  objects: two
  individuals: three
  sigma: top
meets:
  finitely-many-propositions-everywhere: >-
    Four propositions at $W_0$, two at $X$.
  symmetric-domains: >-
    The domains hold exactly the symmetric intensions, the symmetry group being trivial at $W_0$
    and the permutations of $X$ at $X$; every intension at $W_0$ is pinned down by $\{x\}$, an
    arrow out of $W_0$ being fixed by its value at $x$.
  extensionally-full: >-
    Any set $S$ of tuples at the identity of $W_0$ is the extension there of a symmetric intension:
    put $S$ at the identity and the empty set at the arrows into $X$.
  actuality-contingent: >-
    The actual-world proposition $a=\{1_{W_0}\}$ is in the domain and entails every truth, a
    symmetric true proposition containing the identity. It is necessary at no world: at $1_{W_0}$
    the worlds $h_n$ lie outside it, and its transport along $h_n$ is empty, no arrow leading back.
  collapse-onto-point:
    when: {individuals: three}
    text: >-
      Take $a:=x$ and $F:=\lambda y\, .\,(\exists z\, .\,z\ne x)\to y\ne x$, necessarily
      instantiated: its extension is $\{x\}$ at the identity and $X\setminus\{n\}$ at $h_n$. For any
      $N$, $h_n$ sends $N\cup\{x\}\subseteq\{x\}$ to the single point $n$, and every $y\ne n$ in
      $X\setminus\{n\}$ is moved by the transposition of $y$ with the third point, which fixes $n$,
      with $\sigma\circ h_n=h_n$ an arrow.
arguments:
- id: worlds
  holds:
  - necessary-strong-atomicity-t
  - necessary-self-atoms-are-strong-atoms-r
  by: Cian Dorr (Strong Atomicity), with Claude Opus 5.5 (Anthropic) (self-atoms at every type)
  date: '2026-10-29'
  choice: free
  text: >-
    Every arrow out of $X$ is a symmetry, and a symmetric entity is fixed by relabelling, so every world
    seen from $X$ agrees with $1_X$ on every formula with parameters at $X$: there $\Box$ is trivial,
    and a symmetric intension is fixed by its value at $1_X$, which may be any set of tuples (with
    $g\cdot S$ at the permutation $g$). So $X$ has two propositions, every atom there is a strong atom,
    and its atoms of a relational type are the intensions whose value at $1_X$ is a singleton. The
    arrows $h_n$ form one orbit, $g\circ h_n=h_{g(n)}$, so the propositions at $W_0$ are $\varnothing$,
    $a=\{1_{W_0}\}$, $H=\{h_0,h_1,h_2\}$ and $\top$. The transport of $a$ along $h_n$ is empty and that
    of $H$ is $\top$, an atom at $X$; so $a$ and $H$ are strong atoms, and every possible proposition
    at $W_0$ lies above one. With $X$, this gives □Strong Atomicity (type $t$). At a relational type the
    atoms at $W_0$ are the orbits of single pairs: $\{\langle\bar y,1_{W_0}\rangle\}$, whose transport
    along $h_n$ is empty, a strong atom; and the orbit of $\langle\bar y,h_n\rangle$, whose transport
    along $h_n$ has as its value at $1_X$ the orbit of $\bar y$ under the transposition fixing $n$, an
    atom at $X$ just when $\bar y$ is fixed by it, and then the orbit is a strong atom. A self-atom
    instantiated at $1_{W_0}$ is an atom there, so has no pair at any $h_n$; one instantiated at some
    $h_n$ has an atom as its transport, so its pairs at the $h_m$ form the orbit of one such fixed
    $\bar y$, and it has none at $1_{W_0}$. Either way it is one of the strong atoms, and at $X$ self-atoms
    are atoms are strong atoms: self-atoms are strong atoms, necessarily, at every relational type.
- id: not-self-atom
  when: {individuals: three}
  fails:
  - atoms-are-self-atoms-r
  by: Cian Dorr, recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-29'
  choice: free
  text: >-
    At type $e\to t$. The property $F:=\lambda y\, .\,y\ne x$ has extension $\varnothing$ at $1_{W_0}$
    and $X\setminus\{n\}$ at $h_n$. Its pairs form one orbit, the transposition fixing $n$ swapping
    the two individuals other than $n$, so $F$ is an atom. At $h_n$ it is instantiated and its
    transport has value $X\setminus\{n\}$ at $1_X$, two individuals, so it is not an atom there: the
    property of being one of them lies strictly below it. So $F$ is an atom and not a self-atom; and
    since $F$ is possible and is the only possible property below it, Self-Atomicity fails at type
    $e\to t$ too. In the object language, $F$ entails that there are two things each of whose
    haecceities entails $F$.
- id: rigid-comprehension-exact-images
  holds: [necessary-rigid-comprehension-r]
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  choice: free
  text: >-
    As in point-and-three: at either object the exact image $h\mapsto h\cdot E$ of an extension $E$ is
    symmetric, so in the domain, rigid and coextensive with any relation with extension $E$; a weakly
    rigid relation is that exact image. The domains are finite and closed under joins, so every
    property has a least upper bound.
- id: well-ordering
  holds: [necessary-well-ordering-r]
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  choice: free
  text: >-
    At either object every set of tuples at the identity is an extension (at $W_0$ with $\varnothing$ at
    the $h_n$; at $X$ with $g\cdot E$ at each permutation $g$). The domains are finite, so well-orders
    exist and are extensions.
- id: infinity-e
  fails:
  - infinity-e
  - possible-infinity-e
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  choice: free
  text: >-
    At $W_0$ there is one individual, and at every world at most three, with literal identity, so
    no two individuals are distinct at the evaluation point and no four are possibly distinct.
- id: pure-b
  fails:
  - pure-b-r
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  choice: free
  text: >-
    The closed pure sentence that there are exactly four propositions is true at $W_0$ and false at
    each world $h_n$, evaluated at $X$, where there are two; and from $h_n$ only worlds at $X$ are seen.
    So the sentence is true but not necessary, and not necessarily possible.
- id: distinctness-preserving-collapse
  holds:
  - necessary-distinctness-preserving-collapse
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  choice: free
  text: >-
    At $W_0$ take $q:=a$: at $1_{W_0}$, $\Diamond a$ holds, and at $h_n$ it fails, the transport of $a$
    being empty; so $\Box(\Diamond a\to p)$ says just that $p$ holds at $1_{W_0}$, and every truth is
    ND-necessary. At $X$, where $\Box$ is trivial, every truth is necessary.
notes: 'Cian Dorr''s two-world model, unfolded into this group: his model has one arrow $f$ from a world
  with one individual $a$ to a full world with $a$, $b$ and $c$, the first world''s entities being
  invariant at $f$ under the swap of $b$ and $c$. Here the three $h_n$ form one orbit and the transposition
  fixing $n$ does that swap, while the permutation worlds of $X$ are indistinguishable copies of $1_X$;
  so the two models agree on every formula. It is point-and-three without the non-injective maps of $X$
  and the map back to $W_0$, which are what make the orbit of the $h_n$ there an atom that is not a
  self-atom.'
