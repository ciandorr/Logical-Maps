id: symmetry-constrained-full-point-and-three-forward
name: 'Symmetry-constrained full model: a one-point object, its maps into three individuals, and their permutations'
certificate:
  source_id: misc
  produced_by: Cian Dorr (the model, as a two-world model with one arrow whose first world cannot tell
    two individuals apart, and its verdicts on Strong Atomicity and on atoms that are not self-atoms,
    29 October 2026), with Claude Opus 5.5 (Anthropic) (its presentation as a member of this group and
    the other verdicts)
  recorded_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 29 October 2026
  checked_by: []
  date: '2026-10-29'
  lean: none
