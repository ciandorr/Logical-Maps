id: symmetry-constrained-full-point-and-three
name: 'Symmetry-constrained full model: a one-point object and all maps to three individuals'
certificate:
  source_id: misc
  produced_by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, 16 October 2026, from Cian Dorr's suggestion that a
    symmetry-constrained full model would witness the consistency premise of
    maximalism-incompatible-with-intensional-choice
  recorded_by: Claude Opus 5.5 (Anthropic), 16 October 2026, at Cian Dorr's direction
  checked_by: []
  date: '2026-10-16'
  lean: none
sources:
- Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, construction and verification of 16 October 2026, on Cian Dorr's
  suggestion.
- Cian Dorr, Boolean Completeness does not imply Rigid Comprehension, draft of 30 July 2026, Definitions
  15–18, p. 8, and Proposition 20.
source_names:
- Opus 16 Oct
- BC does not imply RC
references:
- paper: dorr-bc-not-rc
  role: background
  locator: Definitions 15–18, p. 8; Proposition 20
  note: Symmetric ideally-full models, here with the improper ideal at both objects; Proposition 20,
    proved in the topic's Lean as symIdeal_isModel for any category of sets, needs only that the
    symmetries be invertible arrows.
group: symmetry-constrained-full
settings:
  construction: >-
    The arrows are all maps between $W_0=\{x\}$ and $X$: the identity of $W_0$, the three maps
    $h_n:x\mapsto n$ into $X$, the map from $X$ to $W_0$, and all $27$ maps from $X$ to itself.
  objects: two
  individuals: three
  sigma: top
meets:
  absorbed-arrow: The arrow $h_n$ is absorbed by the constant map $c_n$ of $X$ with value $n$, $c_n\circ h_n=h_n$, which is not a permutation.
  finitely-many-propositions-everywhere: >-
    Four propositions at $W_0$, sixty-four at $X$.
  symmetric-domains: >-
    The domains hold exactly the symmetric intensions, the symmetry group being trivial at $W_0$
    and the permutations of $X$ at $X$; every intension at $W_0$ is pinned down by $\{x\}$, an
    arrow out of $W_0$ being fixed by its value at $x$.
  extensionally-full: >-
    Any set $S$ of tuples at the identity of $W_0$ is the extension there of a symmetric intension:
    put $S$ at the identity and the empty set at the arrows into $X$.
  actuality-contingent: >-
    The actual-world proposition $a=\{1_{W_0}\}$ is in the domain and entails every truth, a
    symmetric true proposition containing the identity. It is necessary at no world: at $1_{W_0}$
    the worlds $h_n$ lie outside it, and at $h_n$ its transport holds only of the map back to
    $W_0$. Transport along $h_n$ does not carry it to the actual-world proposition of $X$, the
    permutations.
  collapse-onto-point:
    when: {individuals: three}
    text: >-
      Take $a:=x$ and $F:=\lambda y\, .\,(\exists z\, .\,z\ne x)\to y\ne x$, necessarily
      instantiated: its extension is $\{x\}$ at the identity and $X\setminus\{n\}$ at $h_n$. For any
      $N$, $h_n$ sends $N\cup\{x\}\subseteq\{x\}$ to the single point $n$, and every $y\ne n$ in
      $X\setminus\{n\}$ is moved by the transposition of $y$ with the third point, which fixes $n$,
      with $\sigma\circ h_n=h_n$ an arrow.
arguments:
- holds:
  - necessary-strong-actuality
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: At $W_0$ the true atom is $\{1_{W_0}\}$, whose transport along $c_i$ is $\{!\}$, the one arrow
    $X\to W_0$; so it is a strong atom. At $X$ the true atom is the orbit $P$ of the permutations, whose
    transport along a collapse or along $!$ is empty and along a permutation is $P$; so it is a strong
    atom too. Hence Strong Actuality holds at every object.
- id: infinity-e
  fails:
  - infinity-e
  - axiom-of-infinity-e
  - possible-infinity-e
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    At $W_0$ there is one individual, and at every world at most three, with literal identity, so
    no two individuals are distinct at the evaluation point and no four are possibly distinct.
- id: no-pure-contingency
  when: {individuals: three}
  fails:
  - no-pure-contingency-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    The closed pure sentence that there is exactly one individual is true at $W_0$ and false at each
    world $h_n$, evaluated at $X$, where there are three.
- id: plenitude
  holds:
  - plenitude-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    ND holds at $W_0$: transport along $h_n$ determines an entity $Y$ at $W_0$ at every world, since
    $(h_n\cdot Y)_k=Y_{k\circ h_n}$ and $k\circ h_n$ is $1_{W_0}$ for the map back to $W_0$ and $h_m$ for
    each $m$ as $k$ ranges over the maps on $X$; so distinct entities stay distinct at every world.
    Given $U$ functional at the identity with values $Z_y$, put $X_k:=\{(k\cdot y,\bar a):\bar a\in
    (Z_y)_k\}$, well defined by ND, symmetric because each $Z_y$ is, and so in the full domain; and
    $Xy=Z_y$.
- id: two-hat
  holds: [necessary-truth-implies-two-hat-necessity]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    At $W_0$, with $q:=\{1_{W_0}\}$, at each $h_n$ the transport of $\neg q$ is the self-maps of $X$,
    ND-necessary at $1_X$ with the permutations as witness, since from the map back to $W_0$ one sees
    only it and constant maps; so $\Diamond_{\ne}q$ fails at every $h_n$ and every truth at $W_0$ is
    two-hat necessary. At $X$ the permutations form a true proposition possible only at permutations, so
    every truth there is ND-necessary. (Checked by brute force over the finite domains.)
- id: rigid-comprehension-exact-images
  holds: [necessary-rigid-comprehension-r, necessary-tame-rigidity-r, necessary-boolean-completeness-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    At either object the exact image $h\mapsto h\cdot E$ of an extension $E$ is symmetric, so in the
    domain, rigid and coextensive with any relation with extension $E$; a weakly rigid relation is that
    exact image. The domains are finite and closed under joins, so every property has a least upper
    bound.
- id: well-ordering
  holds: [necessary-well-ordering-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    At either object every set of tuples at the identity is an extension (at $W_0$ with $\varnothing$ at
    the $h_n$; at $X$ with $g\cdot E$ at each permutation $g$ and $\varnothing$ elsewhere, which is
    symmetric). The domains are finite, so well-orders exist and are extensions.
notes: 'Added on 16 October 2026 as the witness for maximalism-incompatible-with-intensional-choice. At
  the evaluation point the closed pure sentence "there is exactly one individual, and no necessarily uniquely
  instantiated property entails being distinct from it if anything is" is true: a necessarily uniquely
  instantiated $G\le F_x$, with $F_x$ as under collapse-onto-point, would at $h_n$ have its instance $y\in
  X\setminus\{n\}$ fixed by every permutation fixing $n$, since $\sigma\circ h_n=h_n$; and the transposition of
  $y$ with the third point moves it. So that sentence is consistent with C. The one-object members cannot
  witness it: No Pure Contingency holds there, and the sentence is false at the identity. Kept, at Cian
  Dorr''s wish, as an instructive member although it was not added to separate principles. No Lean
  verification is claimed.'
