definition: 'An intensional action model with one individual. The objects are the root $o$, $s$, $u$,
  and $n$ for each $n\ge1$; besides identities the arrows are $h_s\colon o\to s$, $j\colon s\to u$, $h_u:=j\circ
  h_s$ and $h_n\colon o\to n$, so the root reaches each object by exactly one arrow and worlds may be
  identified with objects. The domains at $s$, $u$ and each $n$ are full. Identify the domains at the
  terminal objects $u$ and $n$ with one finite full type structure $M$ over one individual. Fix a non-principal
  ultrafilter $\mathcal U$ on the positive integers. At the root, an element of a relational type is any
  element of the full intension space whose extension at $u$ is the $\mathcal U$-limit of its extensions
  at the worlds $n$; its extensions at $o$, at $s$ and at each $n$ are unconstrained. So a root proposition
  is any choice of truth values at $o$, $s$ and the $n$s, with its value at $u$ fixed as the limit. Evaluation
  point: the root. Interpretation of Σ, fixed for this record: every constant of Σ is relational, and
  each denotes the top element of its type.'
meets:
  finite-reachable-object: >-
    The objects $u$ and $n$ carry one finite full type structure over one individual, and the root,
    extensionally full with continuum many propositions, has a real number structure of propositions.
  sigma-top: This is the interpretation the definition fixes.
  one-individual: The definition fixes one individual, at every world.
  extensionally-full: At the root an element's extension at $o$ is unconstrained, so every set of tuples
    is the extension there of an element of the domain; the domains at $s$, $u$ and each $n$ are full.
  infinitely-many-propositions: A root proposition is any choice of truth values at $o$, $s$ and the $n$s,
    so there are infinitely many.
  fewer-propositions-after: The root has at least three distinct propositions, while each world $n$, which
    sees only itself, has two.
  actual-world-isolated: The proposition true at $o$ alone (false at $s$, at every $n$, and so in the
    limit at $u$) is in the root domain and entails every truth, every true proposition being true at
    $o$; no world other than $o$ sees $o$.
arguments:
- fails:
  - self-atoms-are-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'At the root, a proposition is a choice of truth values at $o$, $s$ and the $n$s, its value at
    $u$ the limit. Let $P$ be true at two worlds $n_1,n_2$ and false elsewhere, so false at $u$. It is
    possible. It is a self-atom: at $n_1$ and $n_2$, which see only themselves, it becomes the top proposition
    of the two-element domain, an atom. It is not an atom, since the proposition true at $n_1$ alone lies
    strictly below it. So Self-atoms are atoms (type t) fails at the root.'
- holds:
  - necessary-atomicity-r
  - necessary-boolean-completeness-r
  text: At the root, the map sending an element to its extensions at $o$, $s$ and the $n$s is an order
    isomorphism onto a product of powerset algebras, the extension at $u$ being recomputed as the limit.
    So every family has a meet and a join, computed coordinatewise except at $u$, and every nonzero element
    lies above an atom with one tuple in one free coordinate. The other worlds carry finite full powerset
    algebras. Hence Boolean Completeness and Atomicity hold at every world and every relational type.
- holds:
  - necessary-barcan-r
  text: Every arrow acts surjectively at every type, so BF holds at every world (write-up, Proposition
    4).
- fails:
  - rigid-comprehension-r
  text: At type $t\to t$ (write-up, Theorem 6). Let $A_0$ be the root propositions false at $s$ and at
    $u$, and $X$ the property with extension $A_0$ at the root and empty extensions elsewhere. A persistent
    property coextensive with $X$ contains both truth values at every world $n$, since members of $A_0$
    take both values there; the limit condition then puts the true proposition in its extension at $u$.
    Rigidity at the root forces its extension at $s$ to be the proposition false at $s$ and $u$, and rigidity
    at $s$, tested against that proposition's haecceity, forbids the true proposition at $u$. The least
    upper bound of the haecceities of the $X$s, the candidate rigid coextension in the proof of Proposition
    2.11, is weakly rigid but fails the rigidity condition at $s$. The model therefore refutes Proposition
    2.11 (necessary-atomicity-completeness-bf-imply-rigid-comprehension); the gap is the normalization
    step of n. 42, part (iv), which the write-up runs inside the model (§5).
- holds:
  - necessary-intensional-choice-r
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, at Cian Dorr's suggestion
  date: '2026-10-03'
  text: 'At the root: given $F$ with $\Box\exists x\, .\,Fx$, let $G$ pick the least element of $F$ at
    $o$, $s$ and each $n$, under fixed well-orderings, the same ordering of $M^\sigma$ at every $n$. The
    sets $\{n : G(n)=\{a\}\}$ for $a\in M^\sigma$ partition the positive integers into finitely many pieces,
    so exactly one is in $\mathcal U$, say for $a_0$; then $\lim_{\mathcal U}G(n)=\{a_0\}$, and $a_0\in
    F(u)=\lim_{\mathcal U}F(n)$. Setting $G(u):=\{a_0\}$ puts $G$ in the root domain, with $G\le F$ and
    every extension a singleton. At $s$, $u$ and the $n$ the domains are full, and the well-ordering argument
    (arguments/intensional-choice-well-ordering) applies there, so the boxed form holds too.'
- id: rigid-power
  holds:
  - necessary-rigid-power-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-08'
  text: 'At every relational type and every world. Write $k\cdot E$ for the transport of a set $E$ of
    tuples along an arrow $k$, and $X_0(E)$ for the relation $k\mapsto k\cdot E$, the disjunction of the
    haecceities of the members of $E$. At $s$, $u$ and each $n$ the model is full, and Rigid Power holds
    there as in every full model (arguments/rigid-power-tight). At the root, call a set $E$ of root tuples
    admissible when $X_0(E)$ is in the domain, that is, when $h_u\cdot E$ is the $\mathcal U$-limit of
    the sets $h_n\cdot E$ (subsets of a finite set, so the limit is the set taken at $\mathcal U$-many
    $n$). Since each member of $E$ has its value at $u$ as the limit of its values at the $n$, $h_u\cdot
    E$ is always included in that limit; and every finite $E$ is admissible, the finitely many limits
    being attained together at $\mathcal U$-many $n$.


    (1) The rigid relations at the root are exactly the $X_0(E)$ with $E$ admissible. Such an $X_0(E)$,
    being in the domain, is rigid: it is persistent, and at every world $w$ it is $X_0(w\cdot E)$ there,
    included in every $X$ that necessarily holds of the members of $w\cdot E$. Conversely let $Y$ be rigid
    with extension $E$. Persistence gives $Y_k\supseteq k\cdot E$ at every arrow $k$. The root element
    $X$ with extensions $E$ at $o$, $h_s\cdot E$ at $s$, $h_n\cdot E$ at each $n$, and the limit at $u$,
    necessarily holds of every member of $E$ (its extension at $u$ includes $h_u\cdot E$, by the above),
    so inextensibility at the root gives $Y\le X$: $Y$ has extension $h_s\cdot E$ at $s$ and $h_n\cdot
    E$ at each $n$. Rigidity at $s$, in the full model on $s$ and $u$, makes the extension of $Y$ at $u$
    the transport $j\cdot(h_s\cdot E)=h_u\cdot E$, and since $Y$ is in the domain that is also the limit
    of the $h_n\cdot E$. So $E$ is admissible and $Y=X_0(E)$.


    (2) Let $F=X_0(S)$ be rigid at the root, and $P:=\lambda X\, .\,\operatorname{Rigid}(X)\land X\le
    F$, in the domain since it is definable from $F$. By (1) its extension at the root is $E_P:=\{X_0(T)
    : T\subseteq S\text{ admissible}\}$, and at a world $k$ among $s$, $u$ and the $n$ it is the set of
    rigid relations there below $k\cdot F$, which in those full models are the $X_0(T'')$ with $T''\subseteq
    k\cdot S$. Each such $T''$ is finite, the domains there being finite, so it is $k\cdot T$ for a finite,
    hence admissible, $T\subseteq S$ (one preimage for each member), and $X_0(T'')=k\cdot X_0(T)$. So
    the extension of $P$ at every $k$ is $k\cdot E_P$: $P=X_0(E_P)$, a rigid relation. Hence Rigid Power
    holds at the root, and so at every world.'
- id: transversal-choice-everywhere
  holds:
  - necessary-transversal-choice-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-08'
  text: At the root by the general argument transversal-choice-extensionally-full, the model being extensionally
