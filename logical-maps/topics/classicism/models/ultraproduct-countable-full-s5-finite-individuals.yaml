sources:
- GPT-6 Astra (OpenAI), prompted by Daniel Kodsi, Forcing Possibilism, Choice and Infinity, research note of
  23 October 2026, §§2, 5 (unpaginated), in Daniel Kodsi's submission of 24 October 2026 (branch
