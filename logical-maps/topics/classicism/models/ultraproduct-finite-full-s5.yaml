# 29 October 2026: the definition, the transfer argument and the type-e Infinity arguments are the
# s5-ultraproducts group's; the type-t ones stay here.
arguments:
- holds: [infinity-t]
  choice: free
  writeup: ultraproduct-finite-full-s5
  text: >-
    The instance of the Infinity Schema (type $t$) asking for $k$ distinct propositions holds in $M_n$ for
    $2^n\ge k$, a cofinite set of $n$, hence in $U$.
- fails: [possible-infinity-t]
  choice: free
  writeup: ultraproduct-finite-full-s5
  text: >-
    In $M_n$, at every world, the $2^n$-th finite cardinality counts the universal property of
    propositions, so $\Box\exists Z\, .\,\operatorname{FiniteCardinality}_t(Z)\land Z(\lambda p\, .\,\top)$
    is true in every factor, hence in $M$.

notes: >-
  The Infinity Schemata at $e$ and at $t$ do not imply the corresponding Axioms of Infinity, nor their
  possibility, even with □Functional Choice, C5, BF and □Atomicity. A sentence or schema instance true in
  every finite full S5 model holds in this model; only the schemata whose instances vary with the size of
  the factor, like the Infinity Schemata, come apart from the factors.
