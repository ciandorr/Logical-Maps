references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61
  note: Full action models; the factors are the full S5 models on finitely many worlds.
definition: >-
  For $n\ge1$ let $M_n$ be the full S5 model with $n$ worlds and $n$ individuals: the full action model
  on the category with $n$ objects and exactly one arrow between any two, the same $n$ individuals at
  every object, fixed by every arrow, evaluated at one object. Regard each $M_n$ as a many-sorted
  first-order structure, with a sort for each type, application, the logical constants, the constants
  of Σ, and a predicate $T$ on the sort of $t$ for truth at the evaluation object. Let $U$ be a
  nonprincipal ultrafilter on the positive integers, and $M:=\prod_nM_n/U$, the evaluation point
  being the class of the factors' evaluation objects. By Łoś's theorem a first-order sentence holds
  in $M$ iff it holds in $M_n$ for $U$-many $n$. $M$ is a Henkin model of C, and a sentence of the
  object language is true in $M$ iff it is true in $U$-many $M_n$ (see the write-up). It is not full.


  Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each denotes the
  top element of its type in every factor, hence in $M$.
meets:
  sigma-top: This is the interpretation the definition fixes.
arguments:
- holds: [necessary-functional-choice-r, necessary-intensional-choice-r, necessary-barcan-r,
    necessary-distinctness-necessary-r, necessary-atomicity-r, necessary-actuality,
    necessary-rigid-comprehension-r, necessary-strong-atomicity-r, necessary-well-ordering-r,
    no-pure-contingency-r]
  choice: uses
  writeup: ultraproduct-finite-full-s5
  text: >-
    Each instance of each of these schemata is a sentence true in every finite full S5 model, so true
    in $M$. The full domains contain every function, which gives the choice principles, Rigid
    Comprehension and Well-Ordering; constant domains give BF; identity is crisp, which gives ND; the
    domains are finite, so their algebras are atomic, the worlds being the atoms and every true
    proposition entailed by the actual one; and any two worlds are related by an automorphism, so a
    true pure sentence is necessary. All of this holds at every world.
- holds: [infinity-e, infinity-t]
  choice: free
  writeup: ultraproduct-finite-full-s5
  text: >-
    The instance of the Infinity Schema (type $e$) asking for $k$ distinct individuals holds in $M_n$
    for $n\ge k$, and the one asking for $k$ distinct propositions for $2^n\ge k$; both sets of $n$ are
    cofinite, hence in $U$.
- fails: [possible-infinity-e, possible-infinity-t]
  choice: free
  writeup: ultraproduct-finite-full-s5
  text: >-
    In $M_n$, at every world, the domains being full and finite, the finite cardinalities are the
    standard ones, and the $n$-th counts the universal property of individuals, the $2^n$-th the
    universal property of propositions. So the sentences $\Box\exists Z\, .\,\operatorname{FiniteCardinality}_e(Z)
    \land Z(\lambda u\, .\,\top)$ and its counterpart at $t$ are true in every factor, hence in $M$,
    where the witnessing cardinalities are nonstandard.
notes: >-
  The Infinity Schemata at $e$ and at $t$ do not imply the corresponding Axioms of Infinity, nor their
  possibility, even with □Functional Choice, C5, BF and □Atomicity. A sentence or schema instance true in
  every finite full S5 model holds in this model; only the schemata whose instances vary with the size of
  the factor, like the Infinity Schemata, come apart from the factors.
