papers:
- id: bacon-dorr-classicism
  title: Classicism
  citation: Bacon, Andrew, and Cian Dorr. Classicism. Draft dated 16 May 2023, 87 pages. All page, proposition
    and footnote locators in this map refer to this draft.
- id: barcan-1946
  title: A Functional Calculus of First Order Based on Strict Implication
  citation: Barcan, Ruth C. (1946). A Functional Calculus of First Order Based on Strict Implication.
    Journal of Symbolic Logic 11, 1–16. Bibliography and attribution as given in Classicism.
- id: prior-1963
  title: Formal Logic
  citation: Prior, A. N. (1963). Formal Logic. Oxford University Press. Pages 206–207, as credited in
    Classicism, Proposition 2.2.
- id: prior-lemmon
  title: Modality and Quantification in S5; Past, Present, and Future
  citation: Prior, A. N. (1956). Modality and Quantification in S5. Journal of Symbolic Logic 21(1), 60–62.
    See also Prior (1967), Past, Present, and Future, p. 146, crediting E. J. Lemmon’s simplified proof.
    Attribution as given in Classicism, Proposition 2.3.
- id: gallin-1975
  title: Intensional and Higher-Order Modal Logic
  citation: 'Gallin, Daniel (1975). Intensional and Higher-Order Modal Logic: With Applications to Montague
    Semantics. North-Holland. Page 77, as cited in Classicism, n. 37.'
- id: bacon-2020
  title: Logical Combinatorialism
  citation: Bacon, Andrew (2020). Logical Combinatorialism. Philosophical Review 129(4), 537–589. As cited
    in Classicism, §§2.5 and 3.5.
- id: the-broadest-necessity
  title: The Broadest Necessity
  citation: Bacon, Andrew (2018). The Broadest Necessity. Journal of Philosophical Logic 47(5), 733–783.
    As credited in Classicism, §1.5.
- id: necessity-of-identity
  title: On a Derivation of the Necessity of Identity
  citation: Burgess, John P. (2014). On a Derivation of the Necessity of Identity. Synthese 191(7). Historical
    reference for Quine’s argument, as cited in Classicism, §1.5.
- id: goodsell-yli-vakkuri-unpublished
  title: Logical Foundations of Philosophy
  citation: Goodsell, Zachary, and Juhani Yli-Vakkuri. Logical Foundations of Philosophy. Unpublished
    work cited in Classicism, p. 27; no proof from that work is imported here.
- id: goodsell-pc
  title: Personal communication on Maximalist Classicism
  citation: Goodsell, Zachary. Personal communication reported by Bacon and Dorr in Classicism, p. 41,
    concerning Rigid Comprehension and Maximalist Classicism.
