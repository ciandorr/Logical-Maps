id: analytic-necessitism
name: Analytic Necessitism
category: mathematical-contingency
statement: >-
  If there could be a real number structure, there is a rigid one that is necessarily a real number
  structure: a rigid property with necessarily distinct instances, with rigid order, addition,
  multiplication and natural numbers, which necessarily form a complete ordered field. One sentence for
  each type $\sigma$.
formal: >-
  $\Diamond\exists\mathfrak R\, .\,\operatorname{Real}_\sigma(\mathfrak R)\;\to\;
  \exists\mathfrak R\, .\,\operatorname{RigidStr}(\mathfrak R)\land\Box\operatorname{Real}_\sigma(\mathfrak R)$
definitions: >-
  See Background, Analysis, for real number structures and $\operatorname{RigidStr}$: $X$, $\le$, $+$,
  $\times$ and $N$ rigid in the map's sense (persistent and inextensible, each with its leading box) and
  the instances of $X$ necessarily distinct.
date: '2026-10-23'
