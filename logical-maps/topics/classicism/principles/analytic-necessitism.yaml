references:
- paper: barton-goodsell-continuum-contingency
  role: origin
  locator: §5.8, eqs. (30)–(32); §5.9
  note: Their First-Order Continuum Necessitism says that the reals, the rigid properties of natural
    numbers, are a rigid property with necessarily distinct instances; persistence and necessary
    distinctness being theorems there, its content is the Inextensibility of Reals, eq. (32). Rigid
    properties of numbers represent every set of numbers only under Rigid Comprehension, which their
    setting assumes.
- paper: bacon-mathematical-contingency
  role: related
  locator: §5, p. 24; Appendix C.2, Lemmas C.4–C.7
  note: Bacon's rigid and inflexible real number structures, with the rigidity of the canonical reals and
    of their power as the route to the Necessity of Analysis.
about: >-
  The entity-level counterpart of the Necessity of Analysis: not only are the truths of analysis fixed,
  the continuum itself is a necessary existent with a fixed membership and structure. Asking for some
  rigid real number structure, rather than for the rigidity of the reals defined as rigid properties of
  numbers, keeps the principle a definite claim in every theory extending C: under Rigid Comprehension it
  says what Barton and Goodsell's principle says, and without Rigid Comprehension it is simply false
  wherever no rigid continuum exists. The antecedent makes it trivially true at types that cannot carry
  a continuum; where a continuum is merely possible it demands an actual rigid one. The relations must be
  rigid as well as the domain: a rigid domain alone could carry differently threaded field structures at
  different worlds, which code different sets of naturals and so differ on first-order analytical
  sentences.
notes: >-
  Implies the Necessity of Analysis ([[analytic-necessitism-implies-necessity-of-analysis]]), by the
  induction of Barton and Goodsell's Theorem 7 run on the given structure; the two come apart over a
  ground model with enough large cardinals, where new reals can appear while projective truth is
  forcing-invariant. Under □Rigid Comprehension and necessary infinity at $\sigma$, the instance at the
  type of properties of numbers is Rigid Power at $\mathbb N_\sigma$: Rigid Power says that the rigid
  properties of numbers cannot acquire new members, and the field structure on them is definable and
  rigid. That instance is not a principle of the map, since Analytic Necessitism ranges over every type,
  and at a type too small at the actual world its existential can fail although the reals are fixed. What
  the argument gives at every type is recorded at the level of sentences:
  [[necessary-rigid-comprehension-rigid-power-and-necessary-axiom-of-infinity-e-imply-necessity-of-second-order-analysis]]
  and its companion at type t. Fails in [[stitched-cohen-extension]], where the ground model's reals are no longer complete
  at the extension.
