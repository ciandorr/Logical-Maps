id: any-number-possible-e
name: Any Number Possible (type e)
category: instances
statement: >-
  There could be any positive number of individuals: for every finite cardinality, its successor possibly
  holds of the universal property of individuals.
formal: $\forall Z^{(e t)t}\, .\,\operatorname{FiniteCardinality}_e(Z)\to\Diamond(\operatorname{Suc}_e Z)(\lambda u^e\, .\,\top)$
date: '2026-09-20'
sources:
- Cian Dorr, suggestion of 20 September 2026, with the successor shift by Claude Fable 5.1 (Anthropic).
source_names:
- Dorr 20 Sep
notes: >-
  The successor is used because the version with $\Diamond Z(\lambda u\, .\,\top)$ is refutable: Existence
  makes $\mathbf{0}_e(\lambda u\, .\,\top)$ identical to $\bot$ by Logical Equivalence, so its instance at
  $\mathbf{0}_e$ would say $\bot\ne\bot$. This is the sentence through which Possibility (pure) reaches the
  Axiom of Infinity at type $t$: it follows from Possibility (pure) because it is consistent with C, and it
  implies the Axiom of Infinity at type $t$ in C alone. It implies Potential Infinity (type $e$) and is
  strictly stronger, since it fails in the full Henkin model with infinitely many individuals. It is not
  implied by the Axiom of Infinity at type $e$ for the same reason. No type-$t$ analogue is recorded,
  because C refutes it: see the notes to Potential Infinity (type $t$).
