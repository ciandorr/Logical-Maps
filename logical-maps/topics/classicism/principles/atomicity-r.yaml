id: atomicity-r
name: Atomicity
category: lattice
statement: Every non-bottom entity of each relational type has an atom below it.
formal: $\forall^{\mathrm{Ty}}\tau\ne e\, .\,\forall x^\tau\, .\,x\le_\tau\neg_\tau x\lor\exists y^\tau\,
  .\,\operatorname{Atom}_\tau(y)\land y\le_\tau x$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.2, p. 24
- paper: bacon-2024-book
  role: related
  locator: §8.2, p. 166
  note: Bacon states the same principle as the Weak Leibniz Biconditionals, with weak worlds in place
    of atoms, and notes that Classicism calls its substantive direction Atomicity.
notes: ''
aliases:
- Weak Leibniz Biconditionals (Bacon 2024)
changes:
- date: '2026-09-22'
