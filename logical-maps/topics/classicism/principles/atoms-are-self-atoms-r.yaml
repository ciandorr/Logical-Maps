id: atoms-are-self-atoms-r
name: Atoms are self-atoms
category: more-boolean-structure
statement: 'At each relational type, every atom is a self-atom: necessarily, if it is instantiated, it
  is an atom.'
formal: $\forall X^\sigma\, .\,\operatorname{Atom}_\sigma(X)\to\operatorname{SelfAtom}_\sigma(X)\qquad(\sigma\ne
  e)$
definitions: 'where $\Diamond_\sigma X:=X\ne\bot_\sigma$ and $\operatorname{SelfAtom}_\sigma(X):=\Diamond_\sigma
  X\land\Box(\exists\bar x\, .\,X\bar x\to\operatorname{Atom}_\sigma(X))$: a self-atom is a possible entity
  that is necessarily an atom whenever it is instantiated; for a proposition, one that, wherever it is
  true, is the actual-world proposition there (Background, Self-atoms).'
date: '2026-10-25'
sources:
- Cian Dorr, the notion of a self-atom, Self-Atomicity (Self-Atomism) and the four bridge principles,
  25 October 2026.
source_names:
- Dorr 25 Oct
notes: 'Bridge principle (Cian Dorr, 25 October 2026): atoms stay atoms wherever they hold. With Atomicity
  it gives Self-Atomicity, and it follows from [[atoms-are-strong-atoms-r]]. In a full action model it
  says that no non-identity arrow $m$ has $m\circ k=k$ for an arrow $k$ out of the evaluation object.'
