id: axiom-of-infinity-e
name: Axiom of Infinity (type e)
category: instances
statement: >-
  No finite cardinality of individuals is uninstantiated, and none is coextensive with its successor. This is
  a single sentence, not a schema.
formal: $\forall Z^{(e t)t}\, .\,\operatorname{Finite}_e(Z)\to\bigl((\exists X^{e t}\, .\,ZX)\land\neg(Z\equiv\operatorname{Suc}_e
  Z)\bigr)$
date: '2026-09-19'
sources:
- Cian Dorr, suggestion of 19 September 2026.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 47, p. 32.
source_names:
- Dorr 19 Sep
- Classicism
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.3, n. 47, p. 32
  note: The draft's informal infinity claim, which the map had recorded only in its schematic form.
notes: >-
  See Background for $\mathbf{0}$, $\operatorname{Suc}$, $\operatorname{Finite}$ and coextensiveness $\equiv$.
  The quantified form is what is normally meant by an axiom of infinity. It implies the schema of the
  same name, and the converse fails by a compactness argument, so the two are kept as separate principles.
  The clause ruling out an uninstantiated finite cardinality already forces the domain to be infinite;
  the successor clause is retained because it is the more direct reading of the intended claim and does
  not follow from the first in a nonstandard model.
