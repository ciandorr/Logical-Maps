id: distinctness-preserving-collapse
name: Truths are ND-necessary
category: necessity-varieties
statement: Every truth is ND-necessary, that is, necessary under the distinctness-preserving modality.
formal: $\forall p\, .\,p\to\Box_{\ne}p$
definitions: where $\Box_{\ne}p:=\exists q\, .\,q\land\Box(\Diamond q\to p)$ and $\Diamond_{\ne}p:=\neg\Box_{\ne}\neg
  p$.
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix E, p. 83.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: Appendix E, p. 83
notes: Formerly named Distinctness-preserving collapse; renamed on 14 October 2026 when the Varieties
  of necessity category was added at the suggestion of Christopher Sun. The id is unchanged.
variants:
- id: dual
  lean:
    ref: Classicism.P.DistinctnessPreservingCollapseDual.schemaIn
    equivalence_ref: Classicism.Map.distinctness_preserving_collapse.dual
    status: verified
  name: Dual form
  statement: Whatever is possible under the distinctness-preserving modality is true.
  formal: $\forall p\, .\,\Diamond_{\ne}p\to p$
  equivalence: Instantiate either form at the negations of its propositional or relational variables,
    contrapose, and rewrite with $\Diamond_{\ne}=\neg\Box_{\ne}\neg$ and $q\le r\leftrightarrow\neg r\le\neg
    q$. This yields the other form, and the same steps lead back.
lean_def: Classicism.P.DistinctnessPreservingCollapse.schemaIn
aliases:
- Distinctness-preserving collapse
- Truth implies ND-necessity
changes:
