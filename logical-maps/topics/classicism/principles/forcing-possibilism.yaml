id: forcing-possibilism
name: Mathematical Possibilism
category: mathematical-contingency
statement: At each admitted carrier type, every complete Boolean algebra whose carrier contains no power-closed
  subcollection strictly larger than the inexact ordinal benchmark over individuals is relationally order-isomorphic
  to the propositions entailing some proposition.
formal: $\forall B^{\sigma t}E^{\sigma\sigma t}\, .\,(\operatorname{CBA}(B,E)\land\operatorname{Small}_{\sigma}(B))\to\exists
  p^t I^{\sigma tt}\,\operatorname{OrderIso}(I,B,E,D_p,\preceq_t)$
definitions: $q\preceq_t r$ means $\Box(q\to r)$ and $D_p(q)$ means $q\preceq_t p$. Small means $\neg\exists Y^{\sigma
  t}(Y\subseteq B\land H<Y\land\operatorname{PowerClosed}(Y))$. PowerClosed(Y) means that every $A\subseteq Y$
  with $A<Y$ has $C\subseteq Y$ with $C<Y$ and Pow(C,A). Pow uses a typed relation with unique codes for coextensive
  rows and a code for every subcollection of A, including nonrigid subcollections. Comparisons use actual relational
  injections, and subsethood is pointwise. H is the inexact inductive Ordinal_e at type rho = (e -> e -> t) ->
  (e -> t) -> t, closed under zero, successor and limits of rigid subcollections. Successor evaluates a property
  on a restricted initial-segment relation. The full chain of definitions is in the cardinal CH proof and its
  finite-power smallness lemma.
date: '2026-10-19'
sources:
- Andrew Bacon, proposed power-closed-exclusion definition of Mathematical Possibilism and Finite-Power CH Strategy,
  formalized by OpenAI Codex, prompted by Andrew Bacon, October 2026.
source_names:
- Bacon / Codex Finite-Power CH
notes: The former entry required a Dedekind-finite carrier or a carrier strictly smaller than the propositions,
  and required the representing proposition to differ from top. The revised schema permits top. The two smallness
  tests are different. The old definition appears in the cited paper. The correction is due to Andrew Bacon.
aliases:
- Forcing Possibilism (former map name)
references:
- paper: bacon-modalized-domains-2026
  role: formulation
  locator: §6.1, p. 27
- paper: bacon-mathematical-contingency
  role: origin
  locator: §6, p. 27; Appendix A.3, Figure 2
  note: Bacon's Mathematical Possibilism. The map's name records what the principle says, that every small complete
    Boolean algebra, hence every small forcing, is realised below some proposition.
changes:
- date: '2026-10-21'
  by: OpenAI Codex, prompted by Andrew Bacon
  summary: Linked the existing strict-smallness formulation to Modalized Domains §6.1; statement unchanged.
- date: '2026-10-23'
