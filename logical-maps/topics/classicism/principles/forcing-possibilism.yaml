  summary: Renamed Forcing Possibilism, with Bacon's Mathematical Possibilism as an alias, and placed in the new
    category Mathematical contingency. Up to forcing equivalence, forcing notions are the complete Boolean algebras,
    so the principle says that every small forcing is broadly possible; the statement is unchanged.
- date: '2026-11-16'
  by: OpenAI Codex (GPT-6), prompted by Andrew Bacon
  summary: Replaced strict propositional smallness with the power-closed test at the inexact ordinal carrier and
    admitted top as a representing proposition.
