id: fundamental-possibility-r
name: Fundamental Possibility
category: fundamentality
statement: For a pure-formula P consistent with C with free variables among x, every tuple of fundamental
  entities, pairwise distinct within each type, possibly satisfies P. Include the empty tuple.
formal: $\forall\bar x\, .\,\operatorname{Fun}(\bar x)\to\Diamond P$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 39–40.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.5, pp. 39–40
notes: The predicates Fun_sigma are nonlogical and receive no standing axioms.
