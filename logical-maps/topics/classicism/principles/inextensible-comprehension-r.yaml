id: inextensible-comprehension-r
name: Inextensible Comprehension
category: comprehension
statement: Every relation, including a proposition, is coextensive with a inextensible one.
formal: $\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{Inextensible}(Y)\land(X\equiv Y)$
definitions: where $\operatorname{Inextensible}(Y):=\Box\forall X\, .\,(\forall\bar x\, .\,Y[\bar x]\to\Box
  X[\bar x])\to Y\le X$.
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 38, p. 29.
