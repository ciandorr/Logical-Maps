id: infinity-t
name: Infinity (type t)
category: instances
statement: There are arbitrarily many pairwise distinct entities of this fixed type; one sentence for
  each positive integer n.
formal: $\exists x_1^t\cdots x_n^t\, .\,\bigwedge_{i<j}x_i\ne x_j\quad(n\ge1)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 47, p. 32.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.3, n. 47, p. 32
notes: Schema-level reading of the source’s informal infinity claim; no choice-dependent equivalence with
  Dedekind infinity is assumed.
