id: intensionality-r
name: Intensionality
category: base
statement: Necessarily coextensive relations are identical.
formal: $\forall^{\mathrm{Ty}}\bar\sigma\, .\,\forall X Y\, .\,\Box(\forall\bar z\, .\,X[\bar z]\leftrightarrow
  Y[\bar z])\to X=Y$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, pp. 17–18.
