id: logical-necessity-r
name: Logical Necessity
category: schematic
statement: 'The Logical Necessity schema: necessity at distinct matching constants is equivalent to universal
  truth of the pure-formula. Preserve the side conditions of Witnessed Possibility.'
formal: $\Box P[\bar c/\bar x]\leftrightarrow(\forall\bar x\, .\,P)$
