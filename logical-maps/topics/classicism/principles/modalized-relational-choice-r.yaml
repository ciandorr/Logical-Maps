id: modalized-relational-choice-r
name: Modalized Relational Choice
category: choice
statement: Every necessarily serial relation is entailed by a necessarily functional relation.
formal: $\forall R^{\sigma\tau t}\, .\,\Box\operatorname{Serial}(R)\to\exists S^{\sigma\tau t}\, .\,\Box\operatorname{Functional}(S)\land S\le R$
definitions: where $\operatorname{Serial}(U):=\forall x^\sigma\, .\,\exists y^\tau\, .\,(Ux)y$; and $\operatorname{Functional}(U):=\forall
  x^\sigma\, .\,\exists y^\tau\, .\,(Ux)y\land\forall z^\tau\, .\,(Ux)z\to y=z$.
date: '2026-10-11'
sources:
- Cian Dorr, suggestion of 11 October 2026.
source_names:
- Dorr 11 Oct
references: []
notes: >-
  Due to Cian Dorr. It implies Intensional Choice (its polyadic form at the empty tuple is Intensional
  Choice) and Relational Choice; □Relational Choice with Intensional Choice implies it, the
  necessarily instantiated property of being a functional subrelation of a necessarily serial relation
  being necessarily uniquely instantiated below. Whether unboxed Relational Choice with Intensional
  Choice suffices is open: the argument needs the functional subrelations to exist at every world.
  Boxed, □Modalized Relational Choice is equivalent to □Relational Choice with □Intensional Choice.
  It implies its own necessitation
  ([[modalized-relational-choice-implies-necessary-modalized-relational-choice]]), so it is equivalent
  to □Relational Choice with Intensional Choice, and to its boxed form.
