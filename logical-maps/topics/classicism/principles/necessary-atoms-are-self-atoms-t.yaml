id: necessary-atoms-are-self-atoms-t
name: □Atoms are self-atoms (type t)
category: more-boolean-structure
statement: 'Necessarily, every atom is a self-atom: necessarily, if it is true, it is an atom.'
formal: $\Box\forall p\, .\,\operatorname{Atom}_t(p)\to\operatorname{SelfAtom}_t(p)$
definitions: 'where $\operatorname{SelfAtom}_t(p):=\Diamond p\land\Box(p\to\operatorname{Atom}_t(p))$: a
  self-atom is a possible proposition that necessarily, if true, is an atom; equivalently, in C, one that
  entails that it is the actual world, $\Box(p\to\forall q\, .\,q\to p\le q)$.'
date: '2026-10-25'
sources:
- Cian Dorr, the notion of a self-atom, Self-Atomicity (Self-Atomism) and the four bridge principles,
  25 October 2026.
source_names:
- Dorr 25 Oct
notes: The boxed form of [[atoms-are-self-atoms-t]], and the type $t$ instance of [[necessary-atoms-are-self-atoms-r]].
lean_def: Classicism.P.NecAtomsAreSelfAtomsT.schemaIn
