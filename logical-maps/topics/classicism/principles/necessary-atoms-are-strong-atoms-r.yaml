id: necessary-atoms-are-strong-atoms-r
name: □Atoms are strong atoms
category: more-boolean-structure
statement: 'Necessarily, at each relational type, every atom is a strong atom: it necessarily entails
  every entity of the type or its negation.'
formal: $\Box\forall X^\sigma\, .\,\operatorname{Atom}_\sigma(X)\to\operatorname{SAtom}_\sigma(X)\qquad(\sigma\ne
  e)$
definitions: 'where $\Diamond_\sigma X:=X\ne\bot_\sigma$ and $\operatorname{SAtom}_\sigma(W):=\Diamond_\sigma
  W\land\Box\forall Y^\sigma\, .\,W\le_\sigma Y\lor W\le_\sigma\neg_\sigma Y$ is a strong atom (Background,
  Strong atoms)'
date: '2026-10-25'
sources:
- Cian Dorr, the notion of a self-atom, Self-Atomicity (Self-Atomism) and the four bridge principles,
  25 October 2026.
source_names:
- Dorr 25 Oct
notes: The boxed form of [[atoms-are-strong-atoms-r]].
aliases:
- □Atoms are strong atoms
lean_def: Classicism.P.NecAtomsAreStrongAtoms.schemaIn
