id: necessary-atoms-are-strong-atoms-t
name: □Atoms are strong atoms (type t)
category: more-boolean-structure
statement: Necessarily, every atom is a strong atom.
formal: $\Box\forall p\, .\,\operatorname{Atom}_t(p)\to\operatorname{SAtom}_t(p)$
definitions: 'where $\operatorname{SAtom}_t(W):=\Diamond_t
  W\land\Box\forall q\, .\,W\le_t q\lor W\le_t\neg_t q$ is a strong atom (Background, Strong atoms)'
date: '2026-10-25'
sources:
- Cian Dorr, the notion of a self-atom, Self-Atomicity (Self-Atomism) and the four bridge principles,
  25 October 2026.
source_names:
- Dorr 25 Oct
notes: The boxed form of [[atoms-are-strong-atoms-t]], and the type $t$ instance of [[necessary-atoms-are-strong-atoms-r]].
aliases:
- □Atoms are strong atoms (type t)
