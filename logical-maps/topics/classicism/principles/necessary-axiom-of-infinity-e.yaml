id: necessary-axiom-of-infinity-e
name: □Axiom of Infinity (type e)
category: infinity
statement: Necessarily, there are not finitely many individuals.
formal: $\Box\neg\exists Z^{(e t)t}\, .\,\operatorname{FiniteCardinality}_e(Z)\land Z(\lambda u^e\, .\,\top)$
date: '2026-10-30'
sources:
- Cian Dorr, suggestion of 30 October 2026.
- Neil Barton and Zachary Goodsell, Continuum Contingency, draft of 14 October 2026, §5.6, eq. (22), p. 17.
source_names:
- Dorr 30 Oct
- Continuum Contingency
references:
- paper: barton-goodsell-continuum-contingency
  role: formulation
  locator: §5.6, eq. (22), p. 17
  note: Their axiom of Infinity, that necessarily successor is injective on the natural numbers, which they
    count at type e. It is the case σ = e of the Background lemma that the boxed Axiom of Infinity makes
    successor necessarily injective.
notes: >-
  The necessitated form of [[axiom-of-infinity-e]]. It gives $\Box I^*_e$, the antecedent of Arithmetic
  Necessitism at $e$ ([[necessary-infinity-injective-successor]]), so with □Rigid Comprehension the numbers
  counted at $e$ are a rigid property with necessarily distinct instances.
lean_def: Classicism.P.NecAxiomOfInfinityE.schemaIn
