id: necessary-axiom-of-infinity-t
name: □Axiom of Infinity (type t)
category: infinity
statement: Necessarily, there are not finitely many propositions.
formal: $\Box\neg\exists Z^{(t t)t}\, .\,\operatorname{FiniteCardinality}_t(Z)\land Z(\lambda u^t\, .\,\top)$
date: '2026-10-30'
sources:
- Cian Dorr, suggestion of 30 October 2026.
- Neil Barton and Zachary Goodsell, Continuum Contingency, draft of 14 October 2026, §5.6, eq. (22), p. 17.
source_names:
- Dorr 30 Oct
- Continuum Contingency
references:
- paper: barton-goodsell-continuum-contingency
  role: formulation
  locator: §5.6, eq. (22), p. 17
  note: Their axiom of Infinity, that necessarily successor is injective on the natural numbers, which they
    count at type e. It is the case σ = t of the Background lemma that the boxed Axiom of Infinity makes
    successor necessarily injective.
notes: >-
  The necessitated form of [[axiom-of-infinity-t]]. It gives $\Box I^*_t$, the antecedent of Arithmetic
  Necessitism at $t$ ([[necessary-infinity-injective-successor]]), so with □Rigid Comprehension the numbers
  counted at $t$ are a rigid property with necessarily distinct instances.
lean_def: Classicism.P.NecAxiomOfInfinityT.schemaIn
