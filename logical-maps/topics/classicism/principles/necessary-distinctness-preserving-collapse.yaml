id: necessary-distinctness-preserving-collapse
name: □Truths are ND-necessary
category: necessity-varieties
statement: Necessarily, every truth is ND-necessary. In C this is the identity $\Box_{\ne}=\lambda p\,
  .\,p$.
formal: $\Box\,\forall p\, .\,p\to\Box_{\ne}p$
definitions: where $\Box_{\ne}p:=\exists q\, .\,q\land\Box(\Diamond q\to p)$ and $\Diamond_{\ne}p:=\neg\Box_{\ne}\neg
  p$.
date: '2026-10-14'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix E, p. 83 (the unboxed principle,
  under its former name Distinctness-preserving collapse).
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: Appendix E, p. 83
  note: Formulation of the unboxed principle; the boxed form was added with the Varieties of necessity
    category.
aliases:
- □Distinctness-preserving collapse
- □Truth implies ND-necessity
notes: The necessitated form of [[distinctness-preserving-collapse]]. Added 14 October 2026 to match the
  boxed forms of the other collapse principles, at the suggestion of Christopher Sun and Cian Dorr. Equivalent
  to the conjunction of [[necessary-five-implies-nd-necessity]] and [[necessary-truth-implies-five-necessity]].
changes:
- date: '2026-10-19'
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  summary: 'At Cian Dorr’s request: the formal statement now displays the boxed formula (and so do the
    equivalent forms); the notes now name the base principle with a link, without the boilerplate about
    closed instances and the box; the equivalent forms are stated as necessitations of the base forms;
    definitions of its technical terms added.'
- date: '2026-10-29'
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  summary: Renamed from □Truth implies ND-necessity to □Truths are ND-necessary, at Cian Dorr's request, so that the name does not use the verb
    of entailment; the statement is unchanged.
  minor: true
variants:
- id: dual
  name: Dual form
  statement: Necessarily, whatever is possible under the distinctness-preserving modality is true.
  formal: $\Box\forall p\, .\,\Diamond_{\ne}p\to p$
  equivalence: The dual form is derivable from the official form in C and conversely, as on the page of
    Truths are ND-necessary; necessitating the derivation and applying K carries the equivalence to
    the boxed forms.
lean_def: Classicism.P.NecDistinctnessPreservingCollapse.schemaIn
