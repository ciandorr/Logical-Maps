id: necessary-inextensible-comprehension-r
name: □Inextensible Comprehension
category: comprehension
statement: Necessarily, every relation, including a proposition, is coextensive with an inextensible one.
formal: $\Box\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{Inextensible}(Y)\land(X\equiv Y)$
definitions: where $\operatorname{Inextensible}(Y):=\Box\forall X\, .\,(\forall\bar x\, .\,Y[\bar x]\to\Box
  X[\bar x])\to Y\le X$.
date: '2026-10-02'
sources:
- Cian Dorr, suggestion of 2 October 2026.
source_names:
- Dorr 2 Oct
references: []
notes: The necessitated form of [[inextensible-comprehension-r]].
