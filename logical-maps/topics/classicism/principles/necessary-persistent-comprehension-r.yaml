id: necessary-persistent-comprehension-r
name: □Persistent Comprehension
category: comprehension
statement: Necessarily, every relation, including a proposition, is coextensive with a persistent one.
formal: $\Box\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{Persistent}(Y)\land(X\equiv Y)$
definitions: where $\operatorname{Persistent}(Y):=Y\le\lambda\bar x\, .\,\Box Y[\bar x]$, that is, $\Box\forall\bar
  x\, .\,Y[\bar x]\to\Box Y[\bar x]$.
date: '2026-10-02'
sources:
- Cian Dorr, suggestion of 2 October 2026.
source_names:
- Dorr 2 Oct
references: []
notes: The necessitated form of [[persistent-comprehension-r]].
