id: necessary-potential-infinity-t
name: □Potential Infinity (type t)
category: infinity
statement: >-
  Necessarily, for every natural number there could be at least that many propositions.
formal: $\Box\forall n\in\mathbb N_t\, .\,\Diamond\exists X^{tt}\, .\,nX$
definitions: >-
  $\mathbb N_t$ is $\operatorname{FiniteCardinality}_t$, the numbers counted at type $t$, of type $(tt)t$;
  $nX$ says that $X$ has exactly $n$ instances. See Background, Cardinality, arithmetic and analysis.
date: '2026-11-24'
sources:
- Zachary Goodsell, suggestion of 24 November 2026 (the principle, its name, and its identification with
  the necessitated Peano conditions).
- Zachary Goodsell, Arithmetic is Necessary, draft of 5 June 2024, §4, Definitions 3–5 and 8, pp. 11–13, 19.
source_names:
- Goodsell 24 Nov
- Arithmetic is Necessary
references:
- paper: goodsell-arithmetic-necessary
  role: formulation
  locator: §4, Definitions 3–5 and 8, pp. 11–13, 19
  note: The Peano form is $\Box I^*$ at the numbers counted at type $t$.
variants:
- id: peano
  lean:
    ref: Classicism.P.NecPotentialInfinityTPeano.schemaIn
    equivalence_ref: Classicism.Map.necessary_potential_infinity_t.peano
    status: verified
  name: Peano form
  statement: Necessarily, zero is not a successor and successor is injective, on the numbers counted at
    type $t$ ($\Box I^*_t$).
  formal: $\Box\forall m\,n\in\mathbb N_t\, .\,\mathbf 0_t\ne\operatorname{Suc}_t m\land(\operatorname{Suc}_t
    m=\operatorname{Suc}_t n\to m=n)$
  equivalence: The unboxed forms are equivalent in C (Background, [[potential-infinity-forms]]); necessitating
    the two derivations and applying K carries the equivalence to the boxed forms.
- id: at-least
  lean:
    ref: Classicism.P.NecPotentialInfinityTAtLeast.schemaIn
    equivalence_ref: Classicism.Map.necessary_potential_infinity_t.at_least
    status: verified
  name: At-least form
  statement: Necessarily, at-least zero is not a successor and successor is injective, on the at-least
    numbers over propositions.
  formal: $\Box\forall m\,n\in\operatorname{LowerNat}_t\, .\,\mathbf 0^{\ge}_t\ne\operatorname{Suc}_t m\land(\operatorname{Suc}_t
    m=\operatorname{Suc}_t n\to m=n)$
  definitions: $\mathbf 0^{\ge}_t:=\lambda X^{tt}\, .\,\top$, and $\operatorname{LowerNat}_t$ is the least
    property of cardinalities containing it and closed under $\operatorname{Suc}_t$ (Background, the at-least
    numbers).
  equivalence: The unboxed forms are equivalent in C (Background, [[at-least-numbers]], with [[potential-infinity-forms]]);
    necessitating the derivations and applying K carries the equivalence to the boxed forms.
notes: >-
  The necessitated form of [[potential-infinity-t]], which implies it by T and is implied by it given B for
  pure sentences ([[potential-infinity-t-and-pure-b-imply-necessary-potential-infinity-t]]). The boxed Axiom
  of Infinity at $t$ implies it ([[necessary-axiom-of-infinity-t-implies-necessary-potential-infinity-t]]).
  It is the antecedent $\Box I^*_t$ of Arithmetic Necessitism at $t$. Possibility Maximalism (pure) refutes
  it ([[possibility-and-necessary-potential-infinity-t-incompatible]]).
lean_def: Classicism.P.NecPotentialInfinityT.schemaIn
