id: necessary-relational-choice-r
name: □Relational Choice
category: choice
statement: "Necessarily, every serial binary relation has a functional subrelation."
formal: $\Box\forall U^{\sigma\tau t}\, .\,\operatorname{Serial}(U)\to\exists S^{\sigma\tau t}\, .\,\operatorname{Functional}(S)\land(\forall
  x y\, .\,(Sx)y\to(Ux)y)$
definitions: where $\operatorname{Serial}(U):=\forall x^\sigma\, .\,\exists y^\tau\, .\,(Ux)y$; and $\operatorname{Functional}(U):=\forall
  x^\sigma\, .\,\exists y^\tau\, .\,(Ux)y\land\forall z^\tau\, .\,(Ux)z\to y=z$.
date: '2026-09-22'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 31–33.
- Andrew Bacon, A Philosophical Introduction to Higher-Order Logics, Routledge, 2024, §8.4, pp. 175–176.
source_names:
- Classicism
- Philosophical Introduction to HOL
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.3, pp. 31–33
- paper: bacon-2024-book
  role: related
  locator: §8.4, pp. 175–176
  note: □Functional Choice is the principle valid in the Gallin and Williamson models, from which Bacon
    and Dorr derive S5, Strong Atomicity, Rigid Comprehension and Boolean Completeness.
notes: The necessitated form of [[relational-choice-r]]. Added at Cian Dorr’s request on 22 September
  2026, after the coalesced roots showed Relational Choice holding at a root while failing at accessible
  worlds.
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic), prompted by Zachary Goodsell
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
- date: '2026-10-19'
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  summary: 'At Cian Dorr’s request: the formal statement now displays the boxed formula (and so do the
    equivalent forms); the notes now name the base principle with a link, without the boilerplate about
    closed instances and the box; the equivalent forms are stated as necessitations of the base forms;
    definitions of its technical terms added.'
variants:
- id: polyadic
  lean:
    ref: Classicism.P.NecRelationalChoice.listSchemaIn
    equivalence_ref: Classicism.Map.necessary_relational_choice_r.polyadic
    status: verified
  name: Polyadic form
  statement: Necessarily, every serial relation from tuples has a functional subrelation.
  formal: $\Box\forall U^{\bar\sigma\tau t}\, .\,\operatorname{Serial}(U)\to\exists S^{\bar\sigma\tau
    t}\, .\,\operatorname{Functional}(S)\land(\forall\bar x^{\bar\sigma}\,y^\tau\, .\,(S[\bar x])y\to(U[\bar
    x])y)$
  equivalence: Each instance of the polyadic form of Relational Choice is derivable in C from finitely
    many instances of the original form, and conversely; the derivations are on the page of the unboxed
    principle. Necessitating them and applying K carries the equivalence to the boxed forms.
