id: necessary-strong-actuality
name: □Strong Actuality
category: lattice
statement: 'Necessarily, there is a true strong atom: a true proposition that necessarily
  entails every proposition or its negation.'
formal: $\Box\exists p\, .\,p\land\Box\forall q\, .\,p\le q\lor p\le\neg q$
date: '2026-10-06'
sources:
- Cian Dorr, formulation and name, 6 October 2026.
source_names:
- Dorr 6 Oct
notes: The necessitated form of [[strong-actuality]].
