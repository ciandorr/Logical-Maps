  formal: $\Box\exists F^{(\bar\sigma t)t}\, .\,\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\,
    .\,FY\land(X\equiv Y)\land\forall Y'^{\bar\sigma
    t}\, .\,(FY'\landX\equiv Y')\to Y'=Y$
  equivalence: Each instance of the polyadic form of Transversal is derivable in C from finitely many
