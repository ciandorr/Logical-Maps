id: necessary-weakly-inextensible-comprehension-r
name: □Weakly Inextensible Comprehension
category: comprehension
statement: "Necessarily, every relation, including a proposition, is coextensive with a weakly inextensible one."
formal: $\Box\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{WeaklyInextensible}(Y)\land(X\equiv Y)$
definitions: where $\operatorname{WeaklyInextensible}(Y):=\forall X\, .\,(\forall\bar x\, .\,Y[\bar x]\to\Box
  X[\bar x])\to Y\le X$.
date: '2026-09-27'
sources:
- Cian Dorr, suggestion of 27 September 2026.
source_names:
- Dorr 27 Sep
references:
- paper: dorr-bc-not-rc
  role: background
  locator: Proposition 1, p. 2; p. 12
  note: Source of weak inextensibility.
notes: The necessitated form of [[weakly-inextensible-comprehension-r]]. This differs from [[inextensible-comprehension-r]],
  which asks for a single actual witness that is weakly inextensible at every world; here the witness
  may vary from world to world.
lean_def: Classicism.P.NecWeaklyInextensibleComprehension.schemaIn
