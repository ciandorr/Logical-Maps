id: possibility-plus-r
name: Possibility+
category: schematic
statement: The strengthened Possibility schema for pure C-consistent formulas whose only free variables
  are the displayed individual variables; include the empty tuple.
formal: $\forall x_1^e\cdots x_n^e\, .\,(\bigwedge_{i<j}x_i\ne x_j)\to\Diamond P$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 41 and n. 60; Appendix E, p.
  83.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.6, p. 41 and n. 60; Appendix E, p. 83
notes: The consistency and purity restrictions are inherited from Possibility, which the surrounding text
  says this strengthens; the shortened display on p. 41 must not be read as admitting contradictory P.
