id: possible-infinity-t
name: Possible Infinity (type t)
category: instances
statement: >-
  Possibly there are not finitely many propositions: the Axiom of Infinity at this type, under a diamond.
formal: $\Diamond\neg\exists Z^{(t t)t}\, .\,\operatorname{FiniteCardinality}_t(Z)\land Z(\lambda u^t\, .\,\top)$
date: '2026-09-20'
sources:
- Cian Dorr, suggestion of 20 September 2026.
source_names:
- Dorr 20 Sep
notes: >-
  Weaker than the Axiom of Infinity at this type by T, and stronger than Potential Infinity at this type.
  Since the Axiom of Infinity at type $t$ is consistent with C, Possibility (pure) implies this principle.
  Whether it implies the Axiom of Infinity at type $t$ back is recorded as an open question; it would
  follow if a finite count of propositions were necessary whenever true. See Background for
  $\mathbf{0}$, $\operatorname{Suc}$ and $\operatorname{FiniteCardinality}$.
