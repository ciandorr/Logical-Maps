id: potential-infinity-t
name: Potential Infinity (type t)
category: instances
statement: >-
  Every possibly instantiated finite cardinality of propositions has a possibly instantiated successor: if
  a finite cardinality could hold of some property of propositions, the next one could hold of some
  property of propositions.
formal: >-
  $\forall Z^{(t t)t}\, .\,\bigl(\operatorname{FiniteCardinality}_t(Z)\land\Diamond\exists X^{t t}\, .\,ZX\bigr)\to\Diamond\exists X^{t t}\, .\,(\operatorname{Suc}_t Z)X$
date: '2026-09-20'
sources:
- Cian Dorr, suggestion of 20 September 2026.
source_names:
- Dorr 20 Sep
notes: >-
  The type-$t$ instance of Potential Infinity, with the successor as the greater cardinality. It follows
  from Possible Infinity (type $t$). Whether it implies the Axiom of Infinity at type $t$ is recorded as
  an open question. No type-$t$ analogue of Any Number Possible is recorded, since C refutes it: its
  instance at $\mathbf{0}_t$ would say that there could be exactly one proposition, against
  $\top\ne\bot$, and its instance at the second numeral that there could be exactly three, which the
  Boolean structure of propositions under Logical Equivalence excludes.
