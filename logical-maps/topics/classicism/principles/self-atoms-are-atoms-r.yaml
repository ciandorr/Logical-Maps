id: self-atoms-are-atoms-r
name: Self-atoms are atoms
category: more-boolean-structure
statement: At each relational type, every self-atom is an atom.
formal: $\forall X^\sigma\, .\,\operatorname{SelfAtom}_\sigma(X)\to\operatorname{Atom}_\sigma(X)\qquad(\sigma\ne
  e)$
definitions: 'where $\Diamond_\sigma X:=X\ne\bot_\sigma$ and $\operatorname{SelfAtom}_\sigma(X):=\Diamond_\sigma
  X\land\Box(\exists\bar x\, .\,X\bar x\to\operatorname{Atom}_\sigma(X))$: a self-atom is a possible entity
  that is necessarily an atom whenever it is instantiated; for a proposition, one that, wherever it is
  true, is the actual-world proposition there (Background, Self-atoms).'
date: '2026-10-25'
sources:
- Cian Dorr, the notion of a self-atom, Self-Atomicity (Self-Atomism) and the four bridge principles,
  25 October 2026.
source_names:
- Dorr 25 Oct
notes: 'Bridge principle (Cian Dorr, 25 October 2026). A self-atom need not be an atom: in the full model
  over the free monoid on $a,b$ the proposition $\{a,b\}$ becomes the actual-world proposition under either
  generator, but $\{a\}$ lies strictly below it. With Self-Atomicity it gives Atomicity; 5 implies it.'
