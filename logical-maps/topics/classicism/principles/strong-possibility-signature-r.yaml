id: strong-possibility-signature-r
name: Strong Possibility (signature Σ)
category: schematic
statement: Every closed sentence of the fixed signature consistent with its Maximalist Classicism is possible
  under the distinctness-preserving modality.
formal: $\Diamond_{\ne}P\quad(P\in\mathcal L(\Sigma)\text{ closed; }\operatorname{Max}(C(\Sigma))+P\text{
  consistent})$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 37–39; §2.6, p. 42.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.5, pp. 37–39; §2.6, p. 42
notes: This keeps the signature-expanded reference theory throughout the consistency side condition. The
  separate pure-language variant uses Max(C). No conservativity between these two maximalizations is assumed.
  Consistency of Strong Possibility is left open in the source.
