id: witnessed-possibility-r
name: Witnessed Possibility
category: schematic
statement: For pure-formulas P with free variables among a finite tuple x, and distinct matching nonlogical
  constants c, a witness to P entails that P at those constants is possible.
formal: $(\exists\bar x\, .\,P)\to\Diamond P[\bar c/\bar x]$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38.
source_names:
- Classicism
references:
