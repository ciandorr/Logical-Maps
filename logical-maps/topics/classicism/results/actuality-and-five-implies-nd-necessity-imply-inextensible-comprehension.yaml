notes: >-
  BF itself is not needed. Its restriction to the possibilities compatible with the
  actual world, that is to those of the form $\Diamond(\Diamond a\land p)$, is derived from the
  5-necessity collapse. Since 5-necessity obeys the Barcan formula outright, the collapse is used
  only at the actual world, through actual coextensiveness of the operators. With the recorded results,
  Self-Atomicity and Strong Atomicity (each at type $t$ or at every type) now give Inextensible
  Comprehension. The recorded results from Actuality with BF, and from Actuality with Distinctness-Preserving
  Collapse, now follow from this one and the recorded implications to the 5-necessity collapse.
