proof: >-
  See the write-up. Let $a$ witness [[actuality]] and put $D_ap:=\Diamond(\Diamond a\land p)$. Actuality
  makes $D_a$ coextensive with $\Diamond_{\ne}$: one direction takes $q:=a$ in
  $\Diamond_{\ne}p\leftrightarrow\forall q\, .\,q\to\Diamond(\Diamond q\land p)$, and the other uses
  $a\le q$ for each truth $q$. With [[five-implies-nd-necessity|5-necessities are ND-necessary]] and the
  theorem $\Box_{\ne}\le\Box_5$, $D_a$ is then coextensive with $\Diamond_5$. The Barcan formula for
  $\Box_5$ holds at every type ([[box5-barcan]]), so, transferring it through these actual
  coextensions, $\Diamond\exists\bar x\, .\,\Diamond a\land R[\bar x]\to\exists\bar x\,
  .\,\Diamond(\Diamond a\land R[\bar x])$. This replaces BF in the proof of
  [[actuality-and-bf-imply-inextensible-comprehension]]: the relation $\lambda\bar z\,
  .\,\Diamond(a\land F[\bar z])$ is coextensive with $F$ and inextensible, since both formulas from
  which that proof extracts witnesses imply $\Diamond a$.
