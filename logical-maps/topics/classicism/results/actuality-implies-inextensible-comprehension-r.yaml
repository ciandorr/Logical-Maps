proof: If w is the actual atom, the source takes $\lambda\bar y\, .\,w\land X[\bar y]$. Since w is true,
  this is coextensive with X. Its restriction to the actual complete profile makes the universal necessary
  consequences of its instances entailed by it, giving the source’s inextensibility condition.
