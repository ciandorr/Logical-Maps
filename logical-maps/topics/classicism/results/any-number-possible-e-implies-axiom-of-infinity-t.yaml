proof: >-
  Write $g(Z)$ for $(\operatorname{Suc}_e Z)(\lambda x^e\, .\,\top)$. Two finite cardinalities are either
  identical or necessarily share no instance, by an induction that stays inside the presentation
  $\operatorname{Suc}_e$ supplies; under the premise the second alternative is excluded when $g(Z)=g(Z')$,
  since that proposition is possible, so $g$ is injective on finite cardinalities and so is
  $\operatorname{Suc}_e$. The propositions $g(Z)$ then carry a copy of the successor structure: the relation
  taking $g(Z)$ to $g(\operatorname{Suc}_e Z)$ and every other proposition to itself is total and injective
  on $\lambda p\, .\,\top$ and misses $g(\mathbf{0}_e)$. A property with such a relation has no finite
  cardinality, by induction on the cardinality. Hence no finite cardinality of type $(tt)t$ holds of
  $\lambda p\, .\,\top$. Full proof in the write-up.
