notes: >-
  A theorem of C about the premise; no consistency side condition is involved. ND is never used:
  distinctness of the propositions $g(Z)$ comes from a boxed exclusivity lemma rather than from a possible
  identity, which without ND would give only $\Diamond(Z=Z')$. Together with
  possibility-schema-r-implies-any-number-possible-e this gives the Axiom of Infinity at type $t$ from
  Pure Maximalist Classicism.
