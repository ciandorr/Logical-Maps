proof: >-
  For finite $Z$ the premise gives $\Diamond(\operatorname{Suc}_e Z)(\lambda u\, .\,\top)$, and
  $(\operatorname{Suc}_e Z)(\lambda u\, .\,\top)\to\exists X\, .\,(\operatorname{Suc}_e Z)X$ is a theorem,
  so $\Diamond\exists X\, .\,(\operatorname{Suc}_e Z)X$ follows by K. The antecedent of Potential Infinity is
  not needed.
references: []
notes: The converse fails in the full Henkin model with infinitely many individuals.
