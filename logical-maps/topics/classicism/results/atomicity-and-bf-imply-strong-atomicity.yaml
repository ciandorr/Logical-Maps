proof: 'Let $W$ be an atom of relational type $\sigma$: $W\ne\bot$ and $\forall Y\, .\,W\le Y\lor
  W\le\neg Y$. We show $\Box\forall Y\, .\,W\le Y\lor W\le\neg Y$. Each instance is necessary once true,
  since $W\le Y$ is $\Box$ of a closed formula and 4 holds; so $\forall Y\, .\,\Box(W\le Y\lor W\le\neg
  Y)$. BF at type $\sigma$ (the instance for the property $\lambda Y\, .\,W\le Y\lor W\le\neg Y$) turns
  this into $\Box\forall Y\, .\,W\le Y\lor W\le\neg Y$. Thus every atom is a strong atom, and Atomicity
  supplies an atom below each possible $X$.'
