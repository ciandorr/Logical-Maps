proof: >-
  The argument of atomicity-and-bf-imply-strong-atomicity uses BF only at the relational type $\sigma$
  of the worlds, for the property $\lambda Y\, .\,W\le Y\lor W\le\neg Y$: every atom of type
  $\sigma$ is then a strong atom, and Atomicity supplies an atom below each possible $X$.
