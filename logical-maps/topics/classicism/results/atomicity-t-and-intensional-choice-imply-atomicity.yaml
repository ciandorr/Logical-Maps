proof: >-
  Let $X^{\bar\sigma t}\ne\bot$, so that $\Diamond\exists\bar x\, .\,X\bar x$ by Intensionality. Atomicity
  (type t) gives an atom $w\le\exists\bar x\, .\,X\bar x$. Intensional Choice (polyadic form), applied to $\lambda\bar
  x\, .\,w\to X\bar x$, which is necessarily instantiated, gives a necessarily uniquely instantiated $G$ with
  $A_w:=\lambda\bar x\, .\,w\land G\bar x\le X$. By [[unique-instance-copies]], $A_w$ is an atom because $w$
  is one.
notes: >-
  The Intensional Choice counterpart of [[atomicity-t-and-bf-imply-atomicity]]: there BF supplies an instance
  $\bar x$ of $X$ and the atom is $\lambda\bar y\, .\,w\land\bar y=\bar x$; here Intensional Choice supplies
  an instance that may vary from world to world.
