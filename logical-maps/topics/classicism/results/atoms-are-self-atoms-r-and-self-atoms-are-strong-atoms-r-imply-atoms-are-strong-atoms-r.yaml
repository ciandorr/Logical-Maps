proof: An atom is a self-atom by the first premise, and so a strong atom by the second.
notes: 'The converse fails without Self-atoms are atoms: the full model over the free monoid on two generators
  satisfies Atoms are strong atoms, every singleton being strong, while the self-atom of its two generators
  is not strong.'
