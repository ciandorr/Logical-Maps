proof: >-
  Let $X^{\bar\sigma t}$ be an atom. By [[unique-instance-copies]], Intensional Choice makes $X$ the copy $A_w$
  of its instance proposition $w:=\exists\bar x\, .\,X\bar x$ along a necessarily uniquely instantiated $G$,
  and $w$ is an atom. By the type-$t$ principle $w$ is a strong atom, so $X=A_w$ is a strong atom by the same
  lemma.
notes: >-
  Intensional Choice is what makes an atom a copy of a proposition: without it an atom may have several instances
  at a world where none of them exists at the evaluation point. Compare [[barcan-relational-implies-atoms-are-strong-atoms-r]],
  where BF gives the relational form outright.
