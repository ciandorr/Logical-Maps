proof: >-
  Background, [[potential-infinity-forms]], part 3, at $\sigma=t$. By the induction that
  $\operatorname{FiniteCardinality}_t$ provides, every number $n$ counted at type $t$ holds of some
  property. The empty property has cardinality $\mathbf 0_t$. If a number $k$ holds of $X$, then $X$ is not
  coextensive with $\lambda u^t\, .\,\top$, of which no number holds, by the Axiom and since a finite
  cardinality respects coextension; so $\neg Xy$ for some $y$, and $\operatorname{Suc}_tk$ holds of $X$ with
  $y$ added, $y$ witnessing it. What holds of some property possibly does, by T.
notes: >-
  The proof gives more than is asked: under the Axiom every number holds of some property outright. The
  converse fails. Potential Infinity (type $t$) asks only that the propositions could be ever more numerous,
  and it holds at a world with finitely many propositions that sees one with infinitely many, since Possible
  Infinity already implies it ([[possible-infinity-t-implies-potential-infinity-t]]).
