proof: Let $W$ be an atom of a relational type $\sigma$. For each $Y^\sigma$, $W\le Y\lor W\le\neg Y$
  is true and, being a disjunction of two necessities, necessary by 4; so $\forall Y\, .\,\Box(W\le Y\lor
  W\le\neg Y)$. BF at $\sigma$, for the property $\lambda Y\, .\,W\le Y\lor W\le\neg Y$, gives $\Box\forall
  Y\, .\,W\le Y\lor W\le\neg Y$. With $W\ne\bot$, $W$ is a strong atom. This is the argument of Bacon’s
  Exercise 8.12 (the recorded derivation of Strong Atomicity from Atomicity and BF) with
  its use of Atomicity removed.
