proof: Let $w$ be an atom. For each $q$, $w\le q\lor w\le\neg q$ is true and, being a disjunction of two
  necessities, necessary by 4; so $\forall q\, .\,\Box(w\le q\lor w\le\neg q)$. BF (type t), for the property
  $\lambda q\, .\,w\le q\lor w\le\neg q$, gives $\Box\forall q\, .\,w\le q\lor w\le\neg q$. With $w\ne\bot$,
  $w$ is a strong atom. This is the argument of Bacon’s Exercise 8.12 (the recorded derivation of Strong Atomicity from Atomicity and BF) with its use of Atomicity removed.
