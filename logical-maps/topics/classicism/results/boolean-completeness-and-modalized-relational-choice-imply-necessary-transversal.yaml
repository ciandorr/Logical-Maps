proof: >-
  See the write-up. Put $\rho:=\sigma t$ and call $Y^{\rho t}$ separated if necessarily no two distinct
  instances of $Y$ are coextensive. Modalized Relational Choice gives a necessarily functional $S$ that
  picks an instance of every instantiated property of type $\rho$. Let $\Phi Y$ add to $Y$ the $S$-choice
  from the properties coextensive with no instance of $Y$. The [[bourbaki-witt|Bourbaki–Witt lemma]],
  for the partial order $\le$ on the separated properties and the graph of $\Phi$, gives a separated $m$
  with $\Phi m=m$: Boolean Completeness supplies joins of chains, which are separated, and $\Phi$
  preserves separation. As $\Phi m=m$ is an identity, necessarily no property is missed by $m$, so $m$
  is necessarily a transversal.
references: []
notes: >-
  The instance at $\sigma$ uses Boolean Completeness at $(\sigma t)t$ and Modalized Relational Choice at
  $((\sigma t)t,\sigma t)$. The unboxed Transversal already followed, through Relational Choice and Boolean
  Completeness ⇒ Actuality. With [[modalized-relational-choice-implies-necessary-modalized-relational-choice]],
  Boolean Completeness and Modalized Relational Choice now give □Transversal Choice, □Well-Ordering and
  Modal Well-Ordering.
