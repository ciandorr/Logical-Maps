notes: '5 is equivalent to ND in C, by the recorded results, so this gives □ND from ND and Strong
  Atomicity (type t). 5 is used only to make the strong atoms necessarily possible. Atoms do not suffice: ND with □Atomicity (type t) does not give □ND, by the recorded models.


