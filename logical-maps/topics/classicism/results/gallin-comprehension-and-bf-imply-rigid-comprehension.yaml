proof: The source states that, under BF, persistence of a relation and of its negation implies its inextensibility.
  Given pointwise necessary consequences on its instances, the persistent complement makes all non-instance
  cases necessary too; BF assembles the resulting pointwise necessary conditional into entailment. Use
  the Gallin-rigid coextension, which is then rigid in the source’s sense.
