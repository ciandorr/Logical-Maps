proof: >-
  Vacuously, at every type $\sigma$. In the full model with one world and one individual every type is
  finite. If the type $\sigma$ has $m$ entities there, the number $\operatorname{Suc}_\sigma^{m+1}\mathbf
  0_\sigma$ holds of no property, so it is the empty property of type $\nu_\sigma$, and so is its successor.
  Thus $\operatorname{Suc}_\sigma(\operatorname{Suc}^m_\sigma\mathbf 0_\sigma)=\operatorname{Suc}_\sigma
  (\operatorname{Suc}^{m+1}_\sigma\mathbf 0_\sigma)$, while $\operatorname{Suc}^m_\sigma\mathbf 0_\sigma$,
  which holds of the universal property, differs from $\operatorname{Suc}^{m+1}_\sigma\mathbf 0_\sigma$.
  Both are numbers, so $I^*_\sigma$ fails there. So $I^*_\sigma=\top$ is a closed pure identity not provable
  in C, and Maximalism (pure) makes it false. Hence $\Box I^*_\sigma$ is false, and the instance of
  Arithmetic Necessitism at $\sigma$ holds.
notes: >-
  This is the coalesced-sums argument arithmetic-necessitism-complete-components, stated with its actual
  premise. The principle holds only vacuously here. Maximalism refutes the sentence-level
  [[necessity-of-arithmetic]] guard as well, and nothing about a necessitated form follows.
