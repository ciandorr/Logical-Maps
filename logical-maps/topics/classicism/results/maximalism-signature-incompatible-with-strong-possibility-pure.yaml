proof: >-
  Suppose $\Sigma$ has a constant $c$ of type $t$. Let C5 be $\Box$ND and let $F:=\lambda p\, .\,
  (\Diamond p\land\Diamond\neg p)\land\mathrm{C5}\land\mathrm{Atomicity}\land\forall x\forall y\, .\,
  x=y$, a closed pure term of type $tt$: being contingent while $\Box$ND, Atomicity and "there is exactly
  one individual" hold. Let $\Psi:=\forall p\, .\,\neg\Diamond F(p)$, closed and pure.

  (1) $\Psi$ is consistent with Maximalist Classicism (pure): it holds at the evaluation point of
  coalesced-definable-root, which satisfies Maximalism (pure) (see its write-up). In brief: at that root
  $\Box$ND fails, so nothing is $F$ there; and at a world where the side conditions of $F$ hold there is
  necessarily exactly one individual, so the sentence defining a root proposition is there the same
  proposition as a pure sentence, which is not contingent by $\Box$ND + Atomicity (type $t$) ⇒ No Pure
  Contingency.

  (2) Strong Possibility (pure) therefore gives $\Diamond_{\ne}\Psi$, that is $\forall q\, .\,q\to\Diamond(
  \Diamond q\land\Psi)$. Suppose $\Diamond F(p_0)$ for some $p_0$. With $q:=\Diamond F(p_0)$ there is a
  world $w$ at which $\Psi$ and $\Diamond\Diamond F(p_0)$ hold, hence $\Diamond F(p_0)$ by 4; but $\Psi$
  at $w$, instantiated at $p_0$, says $\neg\Diamond F(p_0)$. So $\forall p\, .\,\neg\Diamond F(p)$.

  (3) $F(c)$ is a closed sentence of $\mathcal L(\Sigma)$ consistent with C($\Sigma$): the full S5 model
  over the two-element group with one individual, with $c$ true at one world and false at the other,
  satisfies it. Maximalism for $\Sigma$, in its possibility form, gives $\Diamond F(c)$, contradicting (2)
  at $p:=c$.

  If the constant of $\Sigma$ has a relational type $\bar\sigma t$ instead, replace "contingent" in $F$
  by "contingently universal", $(X\ne\top\land\Diamond X=\top)\lor(X=\top\land\Diamond X\ne\top)$: for
  a closed term $X=\top$ is the closed sentence $\forall\bar x\, .\,X\bar x$, non-contingent by the same
  route, and $F(c)$ is satisfied by the same two-world model with $c$ universal at one world only.
