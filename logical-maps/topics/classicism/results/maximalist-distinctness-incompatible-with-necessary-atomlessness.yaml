source_names:
- Dorr 29 Oct
proof: >-
  Atomlessness is a closed pure sentence, and it fails in full-henkin-singleton-base, a model of C whose
  propositions are $\top$ and $\bot$, $\top$ being an atom. So its negation is consistent with C, and the
  possibility form of Maximalism (pure) makes it possible, while □Atomlessness makes Atomlessness necessary.
references: []
notes: >-
  Instance of the pattern of maximalist-distinctness-incompatible-with-necessary-atomicity-t, from the other
  side: since Atomlessness and Atomicity (type $t$) each hold in some model of C, Maximalism (pure) excludes
  the necessitation of either.
