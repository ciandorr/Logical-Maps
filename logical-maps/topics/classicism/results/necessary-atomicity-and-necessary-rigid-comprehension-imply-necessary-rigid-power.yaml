proof: >-
  The argument of [[atomicity-and-rigid-comprehension-imply-rigid-power]] is a derivation in C from instances
  of Atomicity, at the type of the power property, and of Rigid Comprehension, at the type of the relation
  and at that of its power property. Its necessitation is therefore a theorem of C: at every world where
  those instances hold, so does the instance of Rigid Power. □Atomicity and □Rigid Comprehension supply
  them at every world, so every closed instance of Rigid Power is necessary.
notes: >-
  It dispenses with the □BF of necessary-bf-atomicity-and-rigid-comprehension-imply-necessary-rigid-power,
  which the engine now reports as redundant. With necessary-strong-atomicity-implies-necessary-atomicity it
  gives □Rigid Power from □Strong Atomicity and □Rigid Comprehension, and through Cian Dorr's argument in
  strong-atomicity-necessary-rigid-comprehension-and-rigid-power-imply-bf-relational, necessitated, □BF at the
