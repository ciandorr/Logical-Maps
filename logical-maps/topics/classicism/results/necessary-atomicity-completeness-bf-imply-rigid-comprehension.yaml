proof: For a relation X, form the property F of haecceities of its instances and take their least upper
  bound $X^*$. It contains each X-instance. Actuality follows from Atomicity and BF by Proposition 2.7;
  let w be the actual atom. The relation $w\to X$ is an upper bound of F, so $X^*$ is also contained in
  X. Each haecceity entails its own necessitation by NI, so $\Box X^*$ is another upper bound; hence $X^*$
  is persistent. For inextensibility, note 42 assumes a possible failure, uses boxed Atomicity and BF
  to obtain atoms w and w′ witnessing the two stages, and replaces w′ by the GLB of its w-possible aliases.
  Then $w^{\prime}\to Y$ is an upper bound of F but is contradicted by the proposed failure of inextensibility.
  This contradiction establishes rigidity.
