proof: >-
  By 4, $\Box$Atomlessness gives $\Box\Box$Atomlessness, so at every world, and every world it sees, there is no
  atom of type $t$. Nor is there one of a relational type: an atom $X$ of type $\bar\sigma t$ would give the
  atom $\exists\bar x\, .\,X\bar x$ of type $t$, since for $q$ below it, $\lambda\bar x\, .\,X\bar x\land q$ is
  below $X$, so it is $X$ or $\bot$, and $q$ is then $\exists\bar x\, .\,X\bar x$ or $\bot$. So, necessarily,
  nothing is a self-atom: a self-atom is possible, so instantiated at some world it sees, where it is an atom.
  Necessarily, then, every self-atom is a strong atom (and so an atom), vacuously.
