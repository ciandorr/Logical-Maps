- Dorr 30 Oct
proof: >-
  As for [[necessary-rigid-comprehension-rigid-power-and-necessary-axiom-of-infinity-e-imply-necessity-of-second-order-analysis]],
  at $\sigma:=t$: the numbers are the finite cardinalities of properties of propositions, and the reals the
  rigid properties of those numbers. See the write-up.
references:
- paper: barton-goodsell-continuum-contingency
  role: proof
  locator: §§5.6–5.9, Theorems 3–7 and eqs. (22)–(33), pp. 16–21
  note: Their reals are the rigid properties of numbers, R = PN, and their Theorem 7 derives the non-contingency
    of analytical sentences from continuum necessitism; Rigid Power at N and at R is that necessitism.
notes: >-
  The Axiom of Infinity at $t$ is independent of the one at $e$: under the Fregean Axiom there are two propositions,
  and a world with finitely many individuals can have infinitely many propositions. Either suffices, since
  the comparison between real number structures happens within each world. With [[necessary-atomlessness-implies-necessary-axiom-of-infinity-t]],
  □Atomlessness can stand in for the infinity premise.
