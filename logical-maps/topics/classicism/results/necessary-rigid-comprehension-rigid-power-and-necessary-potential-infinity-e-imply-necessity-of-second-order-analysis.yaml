proof: >-
  The write-up of
  [[necessary-rigid-comprehension-rigid-power-and-necessary-axiom-of-infinity-e-imply-necessity-of-second-order-analysis]],
  read at $\sigma:=e$, uses the boxed Axiom of Infinity only in its first step, to obtain $\Box I^*_e$;
  every later step rests on Arithmetic Necessitism at $e$, which □Rigid Comprehension gives from $\Box
  I^*_e$, on Rigid Power at $\mathbb N_e$ and one type up, and on the second-order Peano axioms holding at
  every world, which is $\Box I^*_e$ again. And $\Box I^*_e$ is the Peano form of □Potential Infinity (type
  $e$) (Background, [[potential-infinity-forms]], necessitated). So the argument goes through from this
  premise.
references:
- paper: barton-goodsell-continuum-contingency
  role: proof
  locator: §§5.6–5.9, Theorems 3–7 and eqs. (22)–(33), pp. 16–21
  note: Their axiom of Infinity, eq. (22), is the Peano form of the premise; their Theorem 7 derives the
    non-contingency of analytical sentences from continuum necessitism, which Rigid Power at N and at R
    supplies.
notes: >-
  Strengthens the record with the boxed Axiom of Infinity at type $e$, which implies □Potential Infinity
  there: one type that is necessarily potentially infinite is all the argument needs. This is Barton and
  Goodsell's own infinity premise, their eq. (22). Not Lean-verified.
