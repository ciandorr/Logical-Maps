proof: >-
  □Strong Atomicity gives □Atomicity (necessary-strong-atomicity-implies-necessary-atomicity), and with □Rigid
  Comprehension, □Rigid Power (necessary-atomicity-and-necessary-rigid-comprehension-imply-necessary-rigid-power).
  Cian Dorr's argument in strong-atomicity-necessary-rigid-comprehension-and-rigid-power-imply-bf-relational
  derives BF at a relational type $\sigma$ in C from Strong Atomicity at $\sigma$, Rigid Comprehension at
  $\sigma\to t$ at every world, and Rigid Power at $\sigma\to t$. It is a derivation in C from instances of
  its three premises, so its necessitation is a theorem of C, and □Strong Atomicity, □Rigid Comprehension
  (whose own necessitation it is by 4) and □Rigid Power give □BF at $\sigma$.
notes: 'The boxed form of [[necessary-strong-atomicity-and-rigid-comprehension-imply-necessary-bf-relational]].


  Theorem 8.2 of Bacon''s book, with □Rigid Comprehension in place of Rigid Comprehension. Rigid Comprehension
  at other worlds enters twice: in Lemma C.6''s pull-back, run at every world for □Rigid Power, and in step
  (ii) of Dorr''s argument. The conjecture with unboxed Rigid Comprehension is untouched: a countermodel to
  it would have □Strong Atomicity and Rigid Comprehension without □Rigid Comprehension.'
