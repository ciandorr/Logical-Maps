notes: >-
  Downgraded from proved to conjectured on 11 October 2026, at Cian Dorr's request. The proof of
  Theorem 8.2 in the book has a gap, found while formalizing it in Lean and confirmed by Cian Dorr;
  the write-up sets out the book's argument with the gap marked. The argument proves
  $\forall p\,.\,Wp\to p=r$ at the evaluation point and then boxes it as following "from necessary
  assumptions". But step (i), that a $W$-proposition $p$ falls under some member of $H$ at every
  world, uses the claim that the world property $U=\lambda q\,.\,v\land q=p$ is $H$ because it is
  a world property accessible to $W$; that holds at the evaluation point, where $H$ is coextensive
  with the accessible world properties, but at another world $H$ is known only to be rigid, and
  need not contain the world properties built there from that world's $v$ and $p$. The step is
  needed exactly at such worlds, since $W$ may have no actual instance. Boxing Rigid Comprehension
  does not obviously help, since $r$ must be defined from a single actual $H$. What would settle
  the conjecture: a repair of step (i), or a model of C with □Strong Atomicity and Rigid Comprehension
  in which BF fails at some relational type. No recorded model refutes it, and without this record
  the map does not derive it. With □Rigid Comprehension and Rigid Power in place of Rigid
  Comprehension the conclusion holds (strong-atomicity-necessary-rigid-comprehension-and-rigid-power-imply-bf-relational,
  Cian Dorr), so a countermodel must fail one of those. The converse half of Theorem 8.2,
  atomicity-and-bf-relational-imply-strong-atomicity and its boxed form, is unaffected.
