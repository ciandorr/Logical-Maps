notes: 'The unboxed form, Strong Atomicity (type t) + BF ⇒ Strong Atomicity,
  is already derivable on the map through Atomicity: Strong Atomicity (type t) gives Atomicity (t), Atomicity (t) + BF gives
  Atomicity, and Atomicity + BF gives Strong Atomicity. The direct construction above proves it in one step and is what
  is necessitated here; the boxed form was not derivable, since no record boxes the type-t instance of
  Atomicity. Only BF at the argument types of the target type is used, as in atomicity-t-and-bf-imply-atomicity.'
