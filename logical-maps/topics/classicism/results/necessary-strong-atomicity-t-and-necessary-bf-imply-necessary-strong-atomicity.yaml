proof: 'First the unboxed statement, for a relational type $\tau=\bar\sigma t$. Let $X^\tau\ne\bot$. Intensionality’s
  contrapositive gives $\Diamond\exists\bar y\, .\,X\bar y$, and BF at the argument types gives $\bar
  x$ with $\Diamond X\bar x$. The type-t Strong Atomicity gives a strong atom $w\le X\bar
  x$: $w\ne\bot$ and $\Box\forall q\, .\,(w\le q\lor w\le\neg q)$. Put $W:=\lambda\bar y\, .\,w\land\bar
  y=\bar x$. Then $W\ne\bot$, since $W\bar x=w$, and $W\le X$, since $\Box(w\to X\bar x)$ and Leibniz’s
  law give $\Box\forall\bar y\, .\,W\bar y\to X\bar y$ by K. $W$ is a strong atom at $\tau$: under the
  box, for any $Y^\tau$, instantiate the strong-world clause of $w$ at $q:=Y\bar x$; if $w\le Y\bar x$
  then $\Box\forall\bar y\, .\,W\bar y\to Y\bar y$, that is $W\le Y$, by the same K step, and if $w\le\neg
  Y\bar x$ then $W\le\neg Y$ likewise; so $\Box\forall Y\, .\,(W\le Y\lor W\le\neg Y)$, the passage under
  the outer box being by necessitation and K since each step is a theorem of C. For each $\tau$ this derives
  the closed instance $\mathrm{SAt}_\tau$ from $\mathrm{SAt}_t$ and finitely many BF instances in C; necessitating
  that conditional and applying K gives $\Box\mathrm{SAt}_\tau$ from $\Box\mathrm{SAt}_t$ and $\Box$BF.'
