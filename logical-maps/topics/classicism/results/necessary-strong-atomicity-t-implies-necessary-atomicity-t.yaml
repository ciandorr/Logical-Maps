proof: >-
  The proof of [[strong-atomicity-t-implies-atomicity-t]] uses its premises only at finitely many closed instances and nothing beyond C.
  So for each closed instance of the conclusion, C proves the conditional from the corresponding premise
  instances to it. Necessitate that theorem and apply K with the boxed premise instances.
  Generalization over the admitted types is metalinguistic; no type quantifier is placed inside the box.
