proof: >-
  Every closed instance of Weakly Inextensible Comprehension is a closed sentence of the pure language, since the principle
  is stated with object-language quantifiers and contains no nonlogical constant. Given Weakly Inextensible Comprehension,
  each instance is true, and No Pure Contingency makes it necessary. Type ranges stay outside the box.
