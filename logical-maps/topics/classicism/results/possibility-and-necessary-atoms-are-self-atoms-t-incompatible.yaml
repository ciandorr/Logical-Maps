proof: Atoms are self-atoms (type t) is a closed pure sentence. It fails at the evaluation point of the
  recorded [[full-idempotent-monoid]], an action model and so a model of C by Theorem 3.23, where the
  atom $\{k\}$ becomes $\{1,k\}$ under $k$. Possibility Maximalism (pure) therefore makes its negation
  possible, while □Atoms are self-atoms (type t) says the sentence is necessary.
notes: Instance of the pattern of [[possibility-and-necessary-strong-atomicity-t-incompatible]]; the relational
  form follows through its type-t instance.
