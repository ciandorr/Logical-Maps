proof: >-
  Potential Infinity (type $t$) is a closed pure sentence, and its negation is consistent with C: in the
  full Henkin model on one individual every type is finite, so the Peano form $I^*_t$ fails there (the
  numerals cannot be pairwise distinct), and with it Potential Infinity (Background,
  [[potential-infinity-forms]]). So Possibility Maximalism (pure), which follows from Distinctness
  Maximalism (pure), gives $\Diamond\neg\operatorname{PotInf}_t$, against $\Box\operatorname{PotInf}_t$.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.2, Proposition 3.7, pp. 47–48
  note: The soundness of Henkin models, which makes the one-individual model a witness to the consistency of
    the negated sentence.
notes: >-
  An instance of the pattern of [[possibility-and-necessary-barcan-t-incompatible]]: Possibility Maximalism
  (pure) refutes $\Box Y$ whenever a model of C refutes the closed pure $Y$. Since the boxed Axiom of
  Infinity at type $t$ implies □Potential Infinity there, Maximalism refutes that too. The unboxed Potential
  Infinity (type $t$) follows from Maximalism, through Possible Infinity.
