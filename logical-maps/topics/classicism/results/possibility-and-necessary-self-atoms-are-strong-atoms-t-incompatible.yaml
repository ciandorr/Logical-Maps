proof: Self-atoms are strong atoms (type t) is a closed pure sentence. It fails at the evaluation point
  of the recorded [[full-free-monoid-glued-constants]], an action model and so a model of C by Theorem
  3.23, where the self-atom $\{f_1,f_2\}$ of two free generators is not a strong atom. Possibility Maximalism
  (pure) therefore makes its negation possible, while □Self-atoms are strong atoms (type t) says the
  sentence is necessary.
notes: Instance of the pattern of [[possibility-and-necessary-strong-atomicity-t-incompatible]]; the relational
  form follows through its type-t instance.
