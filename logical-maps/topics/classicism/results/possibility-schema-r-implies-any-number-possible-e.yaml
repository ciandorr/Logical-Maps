proof: >-
  Any Number Possible (type $e$) is a closed pure sentence, and it is true at the root of the coalesced sum
  of the full Henkin models with $1,2,3,\ldots$ individuals, so it is consistent with C and Possibility
  (pure) gives its diamond. Being a finite cardinality is persistent, so for a finite $Z$ the diamond gives
  $\Diamond\Diamond(\operatorname{Suc}_e Z)(\lambda x\, .\,\top)$, and axiom 4 removes one diamond.
  See the write-up.
