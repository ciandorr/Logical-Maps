proof: >-
  Two inductions inside C show that finite cardinalities respect coextension and that, when no finite
  cardinality holds of the universal property, every finite cardinality holds of some property. The second
  is necessitated and combined with the persistence of being a finite cardinality, so that Possible Infinity
  gives, for every finite cardinality $Z$, that $Z$ possibly holds of some property. Applied to
  $\operatorname{Suc}_e Z$ this is Potential Infinity, whose antecedent is not even needed. See the write-up.
references: []
notes: >-
  The proof is schematic in the type $\sigma$ and is applied here with $\sigma=e$. It shows the stronger
  unconditional form $\forall Z\, .\,\operatorname{FiniteCardinality}_e(Z)\to\Diamond\exists X\, .\,ZX$.
