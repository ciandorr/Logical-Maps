proof: >-
  The Axiom of Infinity at type $e$ implies Potential Infinity there, in C
  ([[axiom-of-infinity-e-implies-potential-infinity-e]]); necessitating that derivation, Possible Infinity
  gives $\Diamond\operatorname{PotInf}_e$. And Potential Infinity is true if possible (Background,
  [[potential-infinity-forms]], part 2): if a number $n$ had $\neg\Diamond\exists X\, .\,nX$, then
  necessarily $n$ would be a number, numbers being necessarily numbers, and necessarily $\neg\Diamond\exists
  X\, .\,nX$, by 4, so that Potential Infinity would be impossible.
notes: >-
  So Potential Infinity (type $e$) is the weakest of the infinity principles at this type that the map
  records. The converse fails: in [[full-omega-chain-new-individuals]] every world has finitely many
  individuals and sees worlds with more.
