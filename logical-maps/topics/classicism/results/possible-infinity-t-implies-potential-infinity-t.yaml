proof: >-
  The Axiom of Infinity at type $t$ implies Potential Infinity there, in C
  ([[axiom-of-infinity-t-implies-potential-infinity-t]]); necessitating that derivation, Possible Infinity
  gives $\Diamond\operatorname{PotInf}_t$. And Potential Infinity is true if possible (Background,
  [[potential-infinity-forms]], part 2): if a number $n$ had $\neg\Diamond\exists X\, .\,nX$, then
  necessarily $n$ would be a number, numbers being necessarily numbers, and necessarily $\neg\Diamond\exists
  X\, .\,nX$, by 4, so that Potential Infinity would be impossible.
notes: >-
  So Potential Infinity (type $t$) is the weakest of the infinity principles at this type that the map
  records. Whether the converse holds is open; see the notes to [[potential-infinity-t]].
