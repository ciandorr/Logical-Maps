proof: >-
  The proof recorded for possible-infinity-e-implies-potential-infinity-e is schematic in the type
  $\sigma$: read it with $\sigma=t$. Finite cardinalities of type $(tt)t$ respect coextension of properties
  of propositions, and when no finite cardinality holds of $\lambda p\, .\,\top$ every finite cardinality
  holds of some property of propositions; necessitating this and using the persistence of being a finite
  cardinality, Possible Infinity at type $t$ gives that every finite cardinality possibly holds of some
  property, in particular every successor.
