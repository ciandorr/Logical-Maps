notes: >-
  Proposed as the type-$e$ half of the route from Maximalist Classicism to the Axiom of Infinity at type
  $t$. Under the recorded formulation of Potential Infinity it is refuted: the full Henkin model with a
  countably infinite individual domain satisfies Potential Infinity (type $e$), and even the Axiom of
  Infinity at type $e$, while having exactly two propositions. The argument that does go through starts from
  Any Number Possible (type $e$), which asks each successor cardinality to hold possibly of the universal
  property, not merely of some property; see any-number-possible-e-implies-axiom-of-infinity-t.
