proof: >-
  Potential Infinity (type $t$) is a closed pure sentence $P$, so B for pure sentences gives
  $P\to\Box\Diamond P$. And $\Diamond P\to P$ is a theorem of C (Background, [[potential-infinity-forms]],
  part 2), hence necessary: $\Box(\Diamond P\to P)$. So $P$ gives $\Box\Diamond P$ and, by K, $\Box P$.
notes: >-
  So Potential Infinity (type $t$) and its necessitation are equivalent given B for pure sentences, and in
  particular given No Pure Contingency, B, or C5. In C alone they differ
  ([[necessary-potential-infinity-t-implies-potential-infinity-t]]).
