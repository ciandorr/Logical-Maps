notes: >-
  Proposed with the remark that the three type-$t$ principles would then be equivalent in C. The
  type-$e$ argument does not transfer: its sentence, that there could be any positive number of
  propositions, is refuted by C, since $\top\ne\bot$ and the propositions form a Boolean algebra under
  Logical Equivalence, so there can be neither exactly one nor exactly three. What would settle the
  question is whether a finite count of propositions is necessary whenever it is true. If some finite
  $Z$ holds of $\lambda p\, .\,\top$, then every proposition is one of finitely many, and NI carries each
  identity across; but collecting them under a box is an instance of the Barcan formula at type $t$,
  which C does not prove. A proof would need to bypass that, and a countermodel would need a world with
  finitely many propositions that can see one with more.
