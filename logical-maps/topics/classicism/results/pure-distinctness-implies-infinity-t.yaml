notes: >-
  Recorded from Distinctness because the proof uses its non-theoremhood side condition directly. The
  equivalent Possibility form gives the same result through the recorded equivalence. The witnesses need
  not be possible propositions, and at most one of them is true. What Distinctness supplies is that C
  proves no identity among them. Only the type-$t$ instance follows, since the witnesses are propositions
  about how many individuals there are, not individuals.
