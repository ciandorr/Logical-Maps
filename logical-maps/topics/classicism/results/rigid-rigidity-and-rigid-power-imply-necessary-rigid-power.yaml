proof: >-
  Let $R:=\lambda X\, .\,\operatorname{Rigid}(X)$ and $Z:=\lambda F\, .\,\operatorname{Rigid}(\lambda
  X\, .\,\operatorname{Rigid}(X)\land X\le F)$. By Rigid Power, every $F$ with $RF$ has $ZF$, and so
  $\Box ZF$, since rigidity, if true, is necessary ([[rigid-necessary]]). Rigid Rigidity makes $R$ rigid,
  so in particular inextensible; at the actual world, by T, this says that if every $F$ with $RF$ has
  $\Box ZF$ then $R\le Z$. So $R\le Z$, that is, $\Box\forall F\, .\,\operatorname{Rigid}(F)\to
  \operatorname{Rigid}(\lambda X\, .\,\operatorname{Rigid}(X)\land X\le F)$, which is □Rigid Power.
references: []
notes: >-
  The instance of Rigid Rigidity used is the one at the type of $F$, together with Rigid Power at the
  same type. Since □BF and Rigid Power imply Rigid Rigidity
  ([[necessary-barcan-and-rigid-power-imply-rigid-rigidity]]), □BF and Rigid Power imply □Rigid Power.
