proof: 'See the write-up. For each atom $w$ of type $t$ choose a self-atom $X_w$ of type $\sigma t$ below
  $\lambda y\, .\,w\land Fy$; take a weakly rigid $R$ coextensive with the property of being some $X_w$,
  and put $G:=\lambda y\, .\,\exists X\, .\,RX\land Xy$. The recorded argument from Strong Atomicity
  Biconditionals goes through: the uniqueness step needs the chosen property to settle the haecceity of
  an instance only at worlds where it is instantiated, where a self-atom is an atom.'
notes: Strengthens [[strong-atomicity-weak-rigid-comprehension-and-relational-choice-imply-intensional-choice]],
  since Strong Atomicity gives Self-Atomicity and Atomicity (type t). Atomicity (type
  t) is used to index the choice by atoms and to make $G$ necessarily instantiated; two self-atoms of
  type $t$ may overlap, which would break the pair lemma, so self-atoms cannot serve as indices.
