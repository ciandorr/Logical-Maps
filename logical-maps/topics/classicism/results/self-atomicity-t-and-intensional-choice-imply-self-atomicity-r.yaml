proof: >-
  Let $X^{\bar\sigma t}\ne\bot$, so that $\Diamond\exists\bar x\, .\,X\bar x$ by Intensionality. Self-Atomicity
  (type t) gives a self-atom $w\le\exists\bar x\, .\,X\bar x$. Intensional Choice (polyadic form), applied
  to $\lambda\bar x\, .\,w\to X\bar x$, which is necessarily instantiated, gives a necessarily uniquely instantiated
  $G$ with $A_w:=\lambda\bar x\, .\,w\land G\bar x\le X$. By [[unique-instance-copies]], $A_w$ is a self-atom
  because $w$ is one.
notes: >-
  The Intensional Choice counterpart of [[self-atomicity-t-and-bf-imply-self-atomicity-r]].
