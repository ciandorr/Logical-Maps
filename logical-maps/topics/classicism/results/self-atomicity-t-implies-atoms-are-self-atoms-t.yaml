proof: Let $p$ be an atom. It is possible, so Self-Atomicity (type t) gives a self-atom $q\le p$; as $q\ne\bot$
  and $p$ is an atom, $q=p$, so $p$ is a self-atom.
notes: So Self-Atomicity lies between Atomicity with Atoms are self-atoms, which imply it, and Atoms are
  self-atoms alone; the converse fails, since Atoms are self-atoms holds vacuously wherever there are
  no atoms (symmetric-all-surjections) while Self-Atomicity fails there.
