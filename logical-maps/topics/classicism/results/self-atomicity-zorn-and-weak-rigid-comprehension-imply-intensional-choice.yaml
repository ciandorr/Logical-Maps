proof: >-
  See the write-up. Given $\Box\exists y\, .\,Fy$, Zorn's Lemma gives a maximal family $A$ of self-atoms below
  $F$, any two of them identical or incompatible (not possibly both instantiated). Weak Rigid Comprehension
  gives a weakly rigid $A^*$ coextensive with $A$; put $G:=\lambda x\, .\,\exists Y\, .\,A^*Y\land Yx$. Weak
  inextensibility carries to every world that each member is a self-atom below $F$ and that any two members
  are identical or incompatible, so $G\le F$ and $G$ has at most one instance at every world. If $G$ were possibly
  uninstantiated, Self-Atomicity would give a self-atom below $\lambda x\, .\,Fx\land\neg\exists Y(A^*Y\land\exists
  Y)$, incompatible with every member of $A$ by weak persistence, contradicting maximality.
notes: >-
  With Transversal Choice ⇒ Zorn ([[transversal-choice-r-implies-zorn-r]]) and Rigid Comprehension ⇒ Weak Rigid
  Comprehension, this gives Cian Dorr's form, Self-Atomicity + Transversal Choice + Rigid Comprehension ⇒ Intensional
  Choice. His transversal of the relation of being possibly both instantiated needs repair without 5, since
  that relation need not be transitive (the write-up has a three-object countermodel to transitivity); the
  maximal antichain replaces it. Compare [[self-atomicity-atomicity-t-weak-rigid-comprehension-and-relational-choice-imply-intensional-choice]],
  where the type-t atoms do the antichain's work.
