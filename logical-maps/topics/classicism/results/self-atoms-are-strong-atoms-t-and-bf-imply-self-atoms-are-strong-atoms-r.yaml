proof: 'Let $X^{\bar\sigma t}\ne\bot$. As in the recorded [[atomicity-t-and-bf-imply-atomicity]], $\Diamond\exists\bar
  y\, .\,X\bar y$ and BF at the argument types give $\bar x$ with $\Diamond X\bar x$; for a proposition
  $w\le X\bar x$ write $A_w:=\lambda\bar y\, .\,w\land\bar y=\bar x$, which lies below $X$. Two facts
  about $A_w$ are theorems of C and so hold necessarily: $A_w$ is instantiated iff $w$ is true, and $A_w$
  is an atom iff $w$ is one (the atom step of that record, which uses only Leibniz’s law and Intensionality).
  Self-atoms are strong atoms (type t) gives Self-atoms are atoms (type t), so by the argument of [[self-atoms-are-atoms-t-and-bf-imply-self-atoms-are-atoms-r]]
  a self-atom $X$ is $A_w$ with $w=X\bar x$ a self-atom, hence a strong atom. Then $X$ is a strong atom:
  at any world and for any $Y$, $A_w\le Y$ iff $w\le Y\bar x$ and $A_w\le\neg Y$ iff $w\le\neg Y\bar x$,
  by Leibniz’s law under the box, and $w$ decides $Y\bar x$.'
notes: The lift of Self-atoms are strong atoms from type $t$ to every relational type under BF, on the
  pattern of [[atomicity-t-and-bf-imply-atomicity]]; BF is used at the argument types, to pass from a
  possible relation to a possible instance. Atoms are strong atoms needs no such lift, since BF at relational
  types gives it outright ([[barcan-relational-implies-atoms-are-strong-atoms-r]]).
