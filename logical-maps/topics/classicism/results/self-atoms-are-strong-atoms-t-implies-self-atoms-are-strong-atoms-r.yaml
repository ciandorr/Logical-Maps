proof: >-
  Let $X^{\bar\sigma t}$ be a self-atom and $w:=\exists\bar x\, .\,X\bar x$. By [[atom-instance-proposition]],
  $w$ is a self-atom, so by the type-$t$ principle a strong atom; and $X\ne\bot$. Reason inside the box, with
  $Y^{\bar\sigma t}$ arbitrary, and put $r:=\exists\bar x\, .\,X\bar x\land Y\bar x$. Then $w\le r$ or $w\le\neg
  r$. In the second case $X\le\neg Y$. In the first, necessarily, if $X\bar a$, then $X$ is an atom (its self-atom
  clause holds there by 4), and $Z:=\lambda\bar x\, .\,X\bar x\land Y\bar x\le X$ is instantiated, since $r$
  holds, hence non-bottom; so $Z=X$ and $Y\bar a$. That is, $X\le Y$. So $X$ is a strong atom.
notes: >-
  No choice is needed: a self-atom is an atom wherever it is instantiated, and that already forces its instances
  there to be unique, which is what Intensional Choice supplies for atoms in [[atoms-are-strong-atoms-t-and-intensional-choice-imply-atoms-are-strong-atoms-r]].
