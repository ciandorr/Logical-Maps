proof: >-
  See the write-up. With the rigid cuts of
  [[strong-atomicity-and-rigid-comprehension-imply-necessary-strong-atomicity]] and Rigid Power, the
  premises give BF at every relational type. For $X^{\sigma t}$ with $\sigma$ relational and a strong
  propositional world $w$ in the rigid cover, rigid coextensions $P,Q$ of
  $\lambda z\, .\,w\le Xz$ and $\lambda z\, .\,w\le\neg Xz$ make $P$ coextensive with $X$ wherever
  $w$ is true (BF at $\sigma$ for the covering step). Weak inextensibility of the cover and
  $\Box\exists w\, .\,Aw\land w$ give $\Box\exists Y\, .\,\operatorname{Rigid}(Y)\land Y\equiv X$,
  and BF at $\sigma t$ boxes the quantifier over $X$. Haecceity codes extend this to individual and
  tuple arguments.
references: []
notes: >-
  BF at type $e$ does not follow: [[full-two-object-chain-new-individual]] satisfies both premises
  and fails it. Through [[necessary-rigid-comprehension-r-implies-necessary-boolean-completeness-r]]
  this also gives □Boolean Completeness, and with
  [[strong-atomicity-and-rigid-comprehension-imply-necessary-strong-atomicity]] □BF at relational types.
  Lemma 4 of the write-up, BF at relational types from these premises, strengthens
  [[strong-atomicity-necessary-rigid-comprehension-and-rigid-power-imply-bf-relational]].
