proof: >-
  See the write-up. Take a rigid $A$ coextensive with the property of being a strong atom or $\bot$.
  Then $\Box A\bot$, $A$ necessarily entails deciding every entity, and the union of $A$'s instances
  is $\top$. Necessarily, for every $Y$, the cut $\lambda W\, .\,AW\land W\le Y$ is rigid (because
  $\bot$ is in $A$) and has union $Y$. If $Y\ne\bot$, its cut has an instance other than $\bot$, since
  a rigid property whose actual instances are all $\bot$ has only $\bot$ as instance; that instance is
  a strong atom below $Y$.
