notes: >-
  Cian Dorr's salvage of Bacon's Theorem 8.2, at every relational type. Strong Atomicity is used at
  $\sigma$ and at the evaluation point only, Rigid Comprehension at $\sigma\to t$ at every world, and
  Rigid Power at $\sigma\to t$. So a model of □Strong Atomicity and Rigid Comprehension refuting BF at a
  relational type $\sigma$ (a countermodel to Bacon's theorem) must fail □Rigid Comprehension or Rigid
  Power at $\sigma\to t$.
