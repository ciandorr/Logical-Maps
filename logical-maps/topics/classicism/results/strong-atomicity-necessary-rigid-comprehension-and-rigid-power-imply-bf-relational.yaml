proof: >-
  Fix a relational type $\sigma=\bar\sigma\to t$, write $W\bar x$ for application to a tuple, and let
  $J(R):=\lambda\bar x\,.\,\exists W\,.\,RW\land W\bar x$, the join of the members of $R$. This is the
  argument of strong-atomicity-t-necessary-rigid-comprehension-and-rigid-power-imply-bf-t with atoms of
  type $\sigma$ for atoms, "$W\bar x$" for "$w$ is true", and $J(R)$ for $\exists w\,.\,Rw\land w$.

  Let $A$ be rigid and coextensive with being an atom of type $\sigma$. (a) $\Box\forall\bar
  x\,\exists W\,.\,AW\land W\bar x$: $J(A)$ is entailed by every atom, so by the dual of Atomicity at
  $\sigma$ (which Strong Atomicity at $\sigma$ gives) it is necessarily universal. (b) Necessarily every
  $A$-instance decides every entity of type $\sigma$, since the actual atoms are strong atoms by
  Strong Atomicity.

  (ii) At every world $v$, each $Y$ of type $\sigma$ is $J(R_Y)$ for a rigid $R_Y\le A$ coextensive at
  $v$ with $\lambda W\,.\,AW\land W\le Y$, by Rigid Comprehension at $v$: $J(R_Y)\le Y$ by weak
  inextensibility of $R_Y$, and $Y\le J(R_Y)$ by weak inextensibility of $A$ at $v$ applied to
  $\lambda W\,.\,(\exists\bar x\,.\,W\bar x)\to W\le Y\to R_YW$, with (a) and (b) at later worlds;
  antisymmetry gives identity.

  (iii) Rigid Power makes $\lambda R\,.\,\operatorname{Rigid}(R)\land R\le A$ rigid; if $\forall
  Y\,.\,\Box XY$, its weak inextensibility gives $\Box\forall R\,.\,(\operatorname{Rigid}(R)\land R\le
  A)\to X(J(R))$, and with (ii) under the box, $\Box\forall Y\,.\,XY$. This is BF at $\sigma$.
