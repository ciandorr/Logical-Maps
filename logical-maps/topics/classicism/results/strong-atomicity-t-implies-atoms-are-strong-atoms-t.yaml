proof: Let $X$ be an atom. It is not bottom, so Strong Atomicity gives a strong atom
  $W\le X$. $W$ is not bottom and is a part of the atom $X$, so $W=X$, and $X$ is a strong atom.
notes: With [[atomicity-t-and-atoms-are-strong-atoms-t-imply-strong-atomicity-t]] and the recorded derivation
  of Atomicity, Strong Atomicity is equivalent to Atomicity together with Atoms are
  strong atoms.
