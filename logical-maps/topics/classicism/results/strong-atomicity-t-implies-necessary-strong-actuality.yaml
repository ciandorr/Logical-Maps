proof: >-
  The argument of [[strong-atomicity-t-implies-necessary-actuality]], with Strong Actuality in place of
  Actuality. Write $D(w)$ for $\Box\forall q\, .\,w\le q\lor w\le\neg q$ and $A$ for Strong Actuality,
  $\exists w\, .\,w\land D(w)$. Every strong atom $w$ entails $A$: by 4, $D(w)\to\Box D(w)$, and
  $\Box D(w)$ gives $\Box(w\to w\land D(w))$, hence $\Box(w\to A)$, which is $w\le A$. Now suppose
  $\Diamond\neg A$. Strong Atomicity (type $t$) supplies a strong atom $w\le\neg A$. With $w\le A$ this
  gives $w=\bot$, contradicting $\Diamond w$. Hence $\Box A$.
