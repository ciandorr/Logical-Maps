proof: 'A strong atom is a self-atom. From $\Box\forall Y\, .\,W\le Y\lor W\le\neg Y$, reason under the
  box: if $W$ is true it is not bottom, and an entity that is not bottom and lies below every entity of
  its type or its negation is an atom, since a strict part $Z$ of $W$ has $W\le\neg Z$ (else $W\le Z$
  and $Z=W$), so $Z\le W\le\neg Z$ is bottom. Hence $\Box(W\to\operatorname{Atom}(W))$, and with $W\ne\bot$,
  $\operatorname{SelfAtom}(W)$. The strong atom below a possible entity is therefore a self-atom below it.'
notes: 'Self-Atomicity is a weakening of Strong Atomicity: the fork model [[full-three-object-fork]]
  and the monoid model [[full-monoid-ac-equals-bc]] satisfy it, with Atomicity and Strong Actuality, and
  fail them.'
