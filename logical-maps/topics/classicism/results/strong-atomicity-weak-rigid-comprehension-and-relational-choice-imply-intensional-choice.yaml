proof: See the write-up. For each type-$t$ atom $w$, choose a strong atom $X_w$ of type $\sigma t$ below
  $\lambda y\, .\,w\land Fy$; take a weakly rigid $R$ coextensive with the property of being some $X_w$,
  and put $G:=\lambda y\, .\,\exists X\, .\,RX\land Xy$. Weak inextensibility carries to every world the
  facts that each instance of $R$ is a strong atom below $F$, and that any two instances are identical
  or not both instantiated. A strong atom has at most one instance.
