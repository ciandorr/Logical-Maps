notes: 'Strengthens [[bf-weak-rigid-comprehension-atomicity-and-relational-choice-imply-intensional-choice]],
  since BF and Atomicity imply Strong Atomicity; BF is not used, and the modal reasoning
  needs only T and 4. Strong Atomicity is used at type $\sigma t$, where atoms would
  not do: an atom of type $\sigma t$ settles only actual properties, while the uniqueness step needs the
  chosen property to settle the haecceity of an instance at another world.


  The argument does not extend to Modalized Relational Choice. With inputs, values would be chosen for
  pairs of an atom and an actual input. Distinct actual inputs may be identified, without ND, at a world
  where the atom is true, and the merged input then has two values, so the pair-lemma step fails. And
  without BF an input that is not actual has no chosen value at all.


  Strengthened by [[self-atomicity-atomicity-t-weak-rigid-comprehension-and-relational-choice-imply-intensional-choice]]:
  self-atoms of type $\sigma t$ serve for strong atoms, with Atomicity (type t) kept for the indices.'
