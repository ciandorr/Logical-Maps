notes: >-
  Conjectured for every signature $\Sigma$ of the kind the map assumes. Proved, in the write-up, when
  $\Sigma$ has a constant with an argument of a type other than $e$: for instance a constant of type
  $t\to t$, $(e\to t)\to t$ or $(t\to t)\to t$. For such a $\Sigma$ a closed term $r$ of type $t\to t$
  built from the constant can be made true of any chosen set of root propositions in the model
  [[coalesced-definable-root-signature]]. From $r$ one defines a pairing, a closed term $Q$ of type
  $(t\to t)\to t$, and two existential sentences $E_1$, $E_2$ that split the Russell–Myhill collision
  for $Q$ by whether its witness agrees with $\rho$ at $\top$. C($\Sigma$) proves $E_1\lor E_2$, and
  Maximalism (signature Σ) is consistent with $\neg E_1$ and with $\neg E_2$, by two members of that
  family of models that differ in the root extension of the constant. Each $E_i$ is an existential
  closure of identities and distinctnesses, so C proves $E_i\to\Box_{\ne}E_i$, and Strong Possibility
  (signature Σ) is refuted outright.


  Not proved: the signatures every constant of which is an individual constant, a propositional
  constant or a predicate of individuals. No closed term then has a freely choosable root extension
  on relational arguments. This case contains the question for the pure language, Strong Possibility
  (pure), which the source leaves open.


  What would settle it: for such a signature, either a disjunction of existential identity sentences
  that Maximalism (signature Σ) proves without proving a disjunct, or a model of Strong Possibility
  (signature Σ). A model for some $\Sigma$ would refute the conjecture as stated for arbitrary
  $\Sigma$.
