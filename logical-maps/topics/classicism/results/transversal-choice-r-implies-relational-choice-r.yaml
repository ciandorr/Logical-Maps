proof: >-
  Let $U^{\sigma\tau t}$ be serial. For $x^\sigma$ and $y^\tau$ write $\langle x,y\rangle$ for the rigid pair
  $\lambda u^\sigma v^\tau\, .\,u=x\land v=y$, of the admitted type $\sigma\tau t$; the case $\tau=e$ is
  included. Pairing is injective: if $\langle x,y\rangle=\langle x',y'\rangle$, apply both sides to $x$ and
  $y$. The left side is $x=x\land y=y$, a theorem of H, so by Logical Equivalence it is $\top$; hence
  $x=x'\land y=y'$ is $\top$ and so true. Call $P$ a $U$-pair if $\exists x y\, .\,(Ux)y\land P=\langle
  x,y\rangle$. Let $E$ relate two $U$-pairs when some $x$ is the first coordinate of both, and relate any
  two non-$U$-pairs. By injectivity $E$ is an equivalence relation on type $\sigma\tau t$, and the cell of a
  $U$-pair $\langle x,y_0\rangle$ consists exactly of the pairs $\langle x,y\rangle$ with $(Ux)y$. Transversal
  Choice gives $F^{(\sigma\tau t)t}$ with exactly one instance in each cell. Put $(Sx)y:=(Ux)y\land F\langle
  x,y\rangle$; this is a subrelation of $U$. Given $x$, seriality gives $y_0$ with $(Ux)y_0$, so the cell of
  $\langle x,y_0\rangle$ has a unique $F$-instance $\langle x,y_x\rangle$, and $(Sx)y$ holds iff $\langle
  x,y\rangle$ is that instance iff $y=y_x$. So $S$ is functional.
