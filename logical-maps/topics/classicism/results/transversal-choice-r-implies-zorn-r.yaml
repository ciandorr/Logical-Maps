proof: >-
  See the write-up. Apply the [[bourbaki-witt|Bourbaki–Witt lemma]] at type $\sigma t$ to the $R$-chains,
  preordered by inclusion, so that $\approx$ is coextension. The supremum of a family of $R$-chains that
  inclusion totally preorders is their union, which is again an $R$-chain. Relational Choice, which follows
  from Transversal Choice, chooses for each chain a point that extends it if anything does. The step
  relation $F$ adds that point. To make $F$ invariant, as the lemma requires, the point is chosen at the
  representative of the chain's coextension class given by Transversal, the instance of Transversal Choice
  at $\sigma t$ for coextension. The lemma gives a chain that nothing extends, and any upper bound of it is
  maximal.
references:
- paper: lang-algebra
  role: proof
  locator: Appendix 2
  note: >-
    Lang derives Zorn's Lemma for partial orders on sets from the Bourbaki–Witt fixed-point theorem,
    applied to the chains ordered by inclusion. The translation replaces sets by properties and the
    choice function by a functional relation. It adapts the argument to preorders, and uses Transversal
    to make the step invariant under coextension, which for sets is automatic.
notes: >-
  Only the invariance of the step goes beyond Relational Choice. Since Zorn's Lemma implies Well-Ordering
  and so Transversal Choice, proving it from Relational Choice alone would settle whether Relational Choice
  implies Transversal Choice, which is open. The Lean certificate formalizes an earlier proof of the
  record, which followed Lewin's proof by conforming subsets.
