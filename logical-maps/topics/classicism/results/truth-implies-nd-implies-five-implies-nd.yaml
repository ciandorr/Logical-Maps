proof: 'The chain $\Box\le\Box_{\ne}\le\hat{\hat\Box}\le\Box_5\le\lambda p\, .\,p$ is a theorem of C (Background,
  Hats, two-hat necessity and 5-necessity): hatting is monotone, $\Box\le\hat\Box=\Box_{\ne}$, $\hat{\hat\Box}\le\Box_5$
  is Proposition D21 of The Bounds of Possibility, Appendix D, right to left, and $\Box_5$ is T. So $\Box_5p\to
  p\to\Box_{\ne}p$.'
notes: One of the composition and decomposition facts for the chain of necessity operators.
