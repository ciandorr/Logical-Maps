proof: >-
  See the write-up. Let $v$ witness [[vicinity]] and put $s:=v\land\forall r\, .\,r\to v\le\Diamond r$,
  which is true. Then $s$ settles every identity statement ($s\le p$ or $s\le\neg p$), and if $s\le Fx$
  for every $x$ then $s\le\forall x\, .\,Fx$ (Sun's argument). So every formula built from identities
  and atoms $Yb$, with each such $Y$ settled or bound by a quantifier restricted to settled properties,
  is settled. Given an equivalence relation $R$ at $\sigma$, call $B^{\sigma t}$ a candidate if $B\le\lambda
  x\, .\,s$ and $B$ is necessarily a partial transversal. [[relational-choice-r|Relational Choice]] chooses,
  for each $B$, a point outside the cells $B$ meets, if there is one, and $fB$ adds it to $B$. The [[bourbaki-witt-admissible|Bourbaki–Witt
  lemma for admissible chains]], with the settled properties admissible, the candidates ordered by $\le$,
  and $f$ as the step, gives a candidate $m$ with $fm=m$, which must be a transversal. Its hypotheses
  hold: the union of a settled chain of candidates, restricted to $s$, is their supremum, and the properties
  the lemma's proof forms are settled.
references: []
notes: >-
  Through the recorded results, ND at type $t$, and in particular C5, gives Transversal Choice from Relational
  Choice, and Vicinity with Relational Choice gives Transversal. So any model separating Relational Choice
  from Transversal Choice ([[relational-choice-r-implies-transversal-choice-r]]) falsifies Vicinity. Astra's
  proof interprets C5 in C with Vicinity and proves the result for C5. The recorded proof works directly
  in C, and the core of that interpretation reappears in its first three lemmas.
