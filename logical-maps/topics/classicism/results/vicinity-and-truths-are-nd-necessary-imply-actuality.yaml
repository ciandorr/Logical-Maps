proof: Let $w$ witness Vicinity; we show that $w$ itself witnesses Actuality. Let $p$ be true. Truths are
  ND-necessary gives $\Box_{\ne}p$, that is, a true $q$ with $\Box(\Diamond q\to p)$, i.e. $\Diamond q\le
  p$. Since $q$ is true, Vicinity gives $w\le\Diamond q$. So $w\le p$.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.6, p. 42; Appendix E, p. 83
  note: Definition of $\Box_{\ne}$ and formulation of Truths are ND-necessary.
notes: 'The witness is the same proposition. With Actuality ⇒ Vicinity, Actuality is equivalent to Vicinity
  under Truths are ND-necessary, as it is under Weakly Inextensible Comprehension. With the ND-necessity
  form of Vicinity (added 14 October 2026) the proof is one line: a witness entails every ND-necessary
  truth, and under Truths are ND-necessary every truth is ND-necessary.'
