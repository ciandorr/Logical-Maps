notes: >-
  The instance used is Relational Choice with inputs and outputs of type $t$. Astra derives the theorem by
  interpreting C5 inside C with Vicinity and proving it for C5; Astra also proves the form with Zorn at
  type $t$ in place of Relational Choice, which follows from this one through the recorded implications
  from Zorn to Relational Choice. With [[actuality-implies-vicinity]], over Boolean Completeness at $t$ and
  Relational Choice, Vicinity and Actuality are equivalent.
