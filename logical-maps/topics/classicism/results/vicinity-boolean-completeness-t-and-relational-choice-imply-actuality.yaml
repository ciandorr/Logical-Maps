proof: >-
  See the write-up. Let $s$ be the true proposition of [[vicinity-and-relational-choice-imply-transversal-choice]],
  below which every identity is settled and material quantification over a settled family of propositions
  computes its actual meet or join. If no atom is true, some true $h\le s$ has nothing but atomless
  elements below it. [[relational-choice-r|Relational Choice]] partitions each nonzero $p\le h$ into proper
  parts, settledly, and the [[bourbaki-witt|Bourbaki–Witt lemma]], with [[boolean-completeness-t|Boolean
  Completeness]] at $t$ for the glbs of chains, gives a descending chain $M$ following the true parts, all
  of whose members are true except the last, $m$, which is their glb. A second use of Relational Choice
  codes the discarded parts in one proposition $b$, which yields a term $g$ agreeing with the step of $M$
  at its true members. The [[bourbaki-witt-admissible|admissible Bourbaki–Witt lemma]] for $g$, with the
  settled properties admissible, gives a settled chain $N$ containing $M$, whose members above $m$ form a
  settled family of truths with glb $m$. So $m$ is true, a contradiction.
