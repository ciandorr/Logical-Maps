id: semiorder
name: Semiorder
description: |
  A semiorder with a just-noticeable difference. Fix u : X → ℝ non-constant
  and ε > 0, and let p ≽ q iff EU_u(p) ≥ EU_u(q) − ε. Completeness: one of
  the two differences is ≥ 0 > −ε. Quasi-transitivity: p ≻ q iff
  EU_u(p) > EU_u(q) + ε, and this is transitive. Closed graph: the graph is
  the preimage of [−ε, ∞) under a continuous map. Transitivity fails: pick
  p, q, r with EU_u equal to 0, −0.8ε, −1.6ε; then p ≽ q ≽ r but not p ≽ r.
satisfies:
- completeness
- quasi-transitivity
- closed-graph-continuity
violates:
- transitivity
- independence
status: proved
certificate:
  provenance: ai
  lean: none
  produced_by: Claude Fable 5.1 (Cowork session)
  checked_by: []
  date: '2026-09-08'
sources:
- Luce (1956), Semiorders and a theory of utility discrimination, Econometrica 24
notes: Sanity-checked numerically in checks/countermodels.py. The relation is Luce's semiorder;
  the verification that it fits this framework is AI-produced and unchecked.
checks:
- topics/decision-theory/checks/countermodels.py
