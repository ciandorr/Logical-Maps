id: acyclicity
name: Acyclicity
statement: >
  There is no finite cycle of strict preferences p₁ ≻ p₂ ≻ … ≻ pₙ ≻ p₁.
formal: "∀n ∀p₁…pₙ. ¬(p₁ ≻ p₂ ∧ … ∧ pₙ ≻ p₁)"
aliases: []
tags: [ordering]
sources:
  - Sen (1970), Collective Choice and Social Welfare, ch. 1*
notes: ""
