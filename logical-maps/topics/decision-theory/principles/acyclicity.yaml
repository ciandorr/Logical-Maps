id: acyclicity
name: Acyclicity
statement: |-
  There is no finite cycle of strict preferences $p_{1} \succ p_{2} \succ \ldots \succ p_{n} \succ p_{1}$.
formal: |-
  $\forall n \forall p_{1}\ldots p_{n}. \neg (p_{1} \succ p_{2} \land \ldots \land p_{n} \succ p_{1})$
aliases: []
tags: [ordering]
sources:
  - Sen (1970), Collective Choice and Social Welfare, ch. 1*
notes: ""
