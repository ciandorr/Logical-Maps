id: closed-graph-continuity
name: Closed-graph continuity
statement: |-
  The set $\{(p, q) \in \Delta (X) \times \Delta (X) : p \succeq q\}$ is closed in the product topology.
formal: |-
  $\operatorname{IsClosed} \{(p,q) | p \succeq q\}$
aliases: [Continuity (DMO), Topological continuity]
tags: [axiom, topological]
sources:
  - Dubra, Maccheroni & Ok (2004), JET 115, Axiom C
notes: ""
date: 2026-09-08
