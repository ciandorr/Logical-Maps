id: completeness
name: Completeness
statement: |-
  For all $p, q \in \Delta (X): p \succeq q$ or $q \succeq p$.
formal: |-
  $\forall p q. p \succeq q \lor q \succeq p$
aliases: [Connectedness, Totality]
tags: [ordering]
sources:
  - von Neumann & Morgenstern (1944), Theory of Games and Economic Behavior, §3.5
notes: ""
date: 2026-09-08
lean: null
