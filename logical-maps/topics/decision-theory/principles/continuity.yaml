id: continuity
name: Mixture continuity
statement: |-
  For all $p, q, r \in \Delta (X)$ the sets $\{\lambda \in [0,1] : \lambda p + (1- \lambda )q \succeq r\}$ and $\{\lambda \in [0,1] : r \succeq \lambda p + (1- \lambda )q\}$ are closed.
formal: |-
  $\forall p q r$. closed $\{\lambda | \lambda p+(1- \lambda )q \succeq r\} \land$ closed $\{\lambda | r \succeq \lambda p+(1- \lambda )q\}$
aliases: [Herstein–Milnor continuity, Closedness]
tags: [axiom, topological]
sources:
  - Herstein & Milnor (1953), Econometrica 21, Axiom 2
notes: ""
