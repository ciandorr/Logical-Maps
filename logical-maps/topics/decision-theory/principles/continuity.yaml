id: continuity
name: Mixture continuity
statement: >
  For all p, q, r ∈ Δ(X) the sets {λ ∈ [0,1] : λp + (1−λ)q ≽ r} and
  {λ ∈ [0,1] : r ≽ λp + (1−λ)q} are closed.
formal: "∀p q r. closed {λ | λp+(1−λ)q ≽ r} ∧ closed {λ | r ≽ λp+(1−λ)q}"
aliases: [Herstein–Milnor continuity, Closedness]
tags: [axiom, topological]
sources:
  - Herstein & Milnor (1953), Econometrica 21, Axiom 2
notes: ""
date: 2026-09-08
