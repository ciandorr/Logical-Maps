id: eu-representation
name: Expected-utility representation
statement: |-
  There is a function $u : X \to \mathbb{R}$ such that for all $p, q \in \Delta (X): p \succeq q$ if and only if $\operatorname{EU}_u(p) \ge \operatorname{EU}_u(q)$.
formal: |-
  $\exists u:X\to \mathbb{R} . \forall p q. p \succeq q \leftrightarrow \sum _x p(x)u(x) \ge \sum _x q(x)u(x)$
aliases: [vNM representation, Linear utility representation]
tags: [representation]
sources:
  - von Neumann & Morgenstern (1944)
notes: ""
