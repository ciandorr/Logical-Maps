id: multi-utility
name: Expected multi-utility representation
statement: >
  There is a set U of functions u : X → ℝ such that for all p, q ∈ Δ(X):
  p ≽ q if and only if EU_u(p) ≥ EU_u(q) for every u ∈ U.
formal: "∃U ⊆ (X→ℝ). ∀p q. p ≽ q ↔ ∀u∈U. EU_u(p) ≥ EU_u(q)"
aliases: [Incomplete expected utility, Unanimity representation]
tags: [representation]
sources:
  - Aumann (1962), Utility theory without the completeness axiom, Econometrica 30
  - Dubra, Maccheroni & Ok (2004), Expected utility theory without the completeness axiom, JET 115
notes: ""
