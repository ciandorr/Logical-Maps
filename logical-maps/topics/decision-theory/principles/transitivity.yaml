id: transitivity
name: Transitivity
statement: |-
  For all $p, q, r \in \Delta (X)$: if $p \succeq q$ and $q \succeq r$ then $p \succeq r$.
formal: |-
  $\forall p q r. p \succeq q \to q \succeq r \to p \succeq r$
aliases: []
tags: [ordering]
sources:
  - von Neumann & Morgenstern (1944), §3.5
notes: ""
date: 2026-09-08
