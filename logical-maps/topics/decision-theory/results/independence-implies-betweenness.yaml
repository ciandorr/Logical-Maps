id: independence-implies-betweenness
premises: [independence]
conclusion: betweenness
status: proved
certificate:
  provenance: ai
  lean: none
  produced_by: "Claude Fable 5.1 (Cowork session)"
  checked_by: []
  date: 2026-09-08
proof: |
  Fix λ ∈ (0,1) and write m = λp + (1−λ)q. Independence with r = p and
  mixing weight 1−λ gives p ≽ q ⟺ (1−λ)p+λp ≽ (1−λ)q+λp, i.e. p ≽ q ⟺ p ≽ m,
  and likewise q ≽ p ⟺ m ≽ p. Hence p ≻ q ⟺ p ≻ m and p ~ q ⟺ p ~ m.
  Independence with r = q and weight λ gives p ≽ q ⟺ m ≽ q and
  q ≽ p ⟺ q ≽ m, so p ≻ q ⟺ m ≻ q. Together: p ≻ q ⟹ p ≻ m ≻ q and
  p ~ q ⟹ p ~ m.
sources: []
notes: >
  No ordering assumptions are needed because independence is taken in the
  biconditional form.
