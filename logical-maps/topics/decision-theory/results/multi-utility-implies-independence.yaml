proof: |
  EU_u is affine in mixtures, so for λ ∈ (0,1]:
  EU_u(λp+(1−λ)r) − EU_u(λq+(1−λ)r) = λ(EU_u(p) − EU_u(q)),
  which is ≥ 0 iff EU_u(p) ≥ EU_u(q). Quantify over u ∈ U.
