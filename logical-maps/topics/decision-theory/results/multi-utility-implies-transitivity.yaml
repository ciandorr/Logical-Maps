proof: |-
  If $\operatorname{EU}_u(p) \ge \operatorname{EU}_u(q)$ and $\operatorname{EU}_u(q) \ge \operatorname{EU}_u(r)$ for every $u \in U$ then
  $\operatorname{EU}_u(p) \ge \operatorname{EU}_u(r)$ for every $u \in U$.
