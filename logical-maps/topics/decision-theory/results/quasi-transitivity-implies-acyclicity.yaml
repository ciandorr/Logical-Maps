id: quasi-transitivity-implies-acyclicity
premises: [quasi-transitivity]
conclusion: acyclicity
status: proved
certificate:
  provenance: ai
  lean: none
  produced_by: "Claude Fable 5.1 (Cowork session)"
  checked_by: []
  date: 2026-09-08
proof: |-
  If $p_{1} \succ p_{2} \succ \ldots \succ p_{n} \succ p_{1}$ then by induction on n, transitivity of $\succ$ gives
  $p_{1} \succ p_{n}$, and with $p_{n} \succ p_{1}$ this contradicts asymmetry of $\succ$.
