id: transitivity-implies-quasi-transitivity
premises: [transitivity]
conclusion: quasi-transitivity
status: proved
certificate:
  provenance: ai
  lean: none
  produced_by: "Claude Fable 5.1 (Cowork session)"
  checked_by: []
  date: 2026-09-08
proof: |-
  Let $p \succ q \succ r$. Then $p \succeq q \succeq r$, so $p \succeq r$. If also $r \succeq p$ then $r \succeq p \succeq q$
  gives $r \succeq q$, contradicting $q \succ r$. So $p \succ r$.
