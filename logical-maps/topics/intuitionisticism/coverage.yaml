- number: 2
  title: Exact propositional modal logic of □₂ and ◇₂
  locator: §7.1, p. 46
  account: Theorem 17 states the IS4 lower bound and conjectures exactness. The two 4 proofs still need expansion
    in this map.
- number: 3
  title: Spouse uniqueness for □ and general monogamy
  locator: §7.1, p. 46
  account: Both qualified uniqueness statements are principle nodes. §4.5 contains contrary draft remarks about
    polygamy, but no completed countermodel is supplied.
- number: 4
  title: Consequences of Descriptions over II
  locator: §7.1, p. 46
  account: The type-ambiguous necessary description principle is recorded. No S5 conclusion is imported from the
    discussion of Classicism.
