papers:
- id: possibility-in-intuitionistic-higher-order-logic
  title: Possibility in Intuitionistic Higher-Order Logic
  citation: 'Zachary Goodsell (21 August 2026). Possibility in Intuitionistic Higher-Order Logic. Manuscript.

    '
- id: the-broadest-necessity
  title: The Broadest Necessity
  citation: Andrew Bacon (2018). The Broadest Necessity. Journal of Philosophical Logic 47.5, pp. 733–783.
  note: Bibliographic details and original attribution transcribed from Goodsell. The present map uses
    Goodsell’s intuitionistic proof of Theorem 1.
- id: plotkin-stirling-1986
  title: A framework for intuitionistic modal logics
  citation: Gordon Plotkin and Colin Stirling (1986). A framework for intuitionistic modal logics. Proceedings
    of TARK, pp. 399–406.
  note: Original attribution of Goodsell’s Theorem 3; its external proof is not transcribed. Bibliographic
    details follow the supplied manuscript.
- id: simpson-1994
  title: The Proof Theory and Semantics of Intuitionistic Modal Logic
  citation: Alex K. Simpson (1994). The Proof Theory and Semantics of Intuitionistic Modal Logic. PhD
    thesis, University of Edinburgh.
  note: Chapter 3 is cited for the proof of Goodsell’s Theorem 3. Bibliographic details follow the supplied
    manuscript.
- id: wijesekera-1990
  title: Constructive Modal Logics I
  citation: Duminda Wijesekera (1990). Constructive Modal Logics I. Annals of Pure and Applied Logic 50.3,
    pp. 271–301.
  note: Original attribution of Goodsell’s Theorem 4; its external proof is not transcribed. Bibliographic
    details follow the supplied manuscript.
- id: classicism-2024
  title: Classicism
  citation: Andrew Bacon and Cian Dorr (2024). Classicism. In Higher-Order Metaphysics, edited by Peter
    Fritz and Nicholas K. Jones, pp. 109–190.
  note: Cited for the equivalence involving modalized functionality in Goodsell’s soundness proof. Bibliographic
    details follow the supplied manuscript.
- id: henkin-1950
  title: Completeness in the Theory of Types
  citation: Leon Henkin (1950). Completeness in the Theory of Types. Journal of Symbolic Logic 15.2, pp.
    81–91.
  note: Background for the prime-theory extension construction in Goodsell’s Lemma 24; the II adaptation
    is Goodsell’s. Bibliographic details follow the supplied manuscript.
