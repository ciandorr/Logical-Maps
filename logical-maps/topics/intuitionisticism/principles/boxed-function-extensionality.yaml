id: boxed-function-extensionality
name: □Function extensionality
statement: |-
  For every $\sigma ,\tau : \Box (\forall f,g:\sigma \tau . (\forall x:\sigma . f x = g x) \to (f = g))$
formal: |-
  For every $\sigma ,\tau : \Box (\forall f,g:\sigma \tau . (\forall x:\sigma . f x = g x) \to (f = g))$
category: higher-order
