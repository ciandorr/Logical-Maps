id: boxed-infinitary-distribution-distinct-from-bottom
name: □Infinitary distribution (≠⊥)
statement: |-
  $\Box (\forall F:tt. \operatorname{Inex}^t(F) \to (((\exists x:t. F x) \ne \bot ) \to \exists x:t. (F x \ne \bot )))$
