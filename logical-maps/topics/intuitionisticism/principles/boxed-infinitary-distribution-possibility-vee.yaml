id: boxed-infinitary-distribution-possibility-vee
name: □Infinitary distribution (◇_∨)
statement: |-
  $\Box (\forall F:tt. \operatorname{Inex}^t(F) \to (\Diamond _\lor (\exists x:t. F x) \to \exists x:t. \Diamond _\lor (F x)))$
