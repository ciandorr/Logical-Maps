id: boxed-marriage-uniqueness
name: □Marriage is monogamous
statement: |-
  $\Box (\forall N,P,Q:tt. (\operatorname{Necessity}_{2}(N) \land \operatorname{Possibility}_{2}(P) \land \operatorname{Possibility}_{2}(Q) \land \operatorname{Married}(N,P) \land \operatorname{Married}(N,Q)) \to (P = Q))$
formal: |-
  $\Box (\forall N,P,Q:tt. (\operatorname{Necessity}_{2}(N) \land \operatorname{Possibility}_{2}(P) \land \operatorname{Possibility}_{2}(Q) \land \operatorname{Married}(N,P) \land \operatorname{Married}(N,Q)) \to (P = Q))$
category: candidate-laws
sources:
- Codex (GPT-6), connecting-principle formulation, 2026-09-13.
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §7.1, Question
  3, p. 46.
source_names:
