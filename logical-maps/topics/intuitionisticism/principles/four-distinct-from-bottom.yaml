id: four-distinct-from-bottom
name: 4 (≠⊥)
category: distinct-from-bottom
statement: For every p, (p ≠ ⊥) ≠ ⊥ implies p ≠ ⊥.
formal: '∀p : t. (((p ≠ ⊥) ≠ ⊥) → (p ≠ ⊥))'
