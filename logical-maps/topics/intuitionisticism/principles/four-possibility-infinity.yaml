id: four-possibility-infinity
name: 4 (◇_∞)
category: possibility-infinity
statement: |-
  For every $p, \Diamond _\infty$ applied twice to p implies $\Diamond _\infty$ applied once to p.
formal: |-
  $\forall p : t. (\Diamond _\infty (\Diamond _\infty (p)) \to \Diamond _\infty (p))$
