id: four-possibility-two
name: 4 (◇₂)
category: possibility-two
statement: |-
  For every $p, \Diamond _{2}$ applied twice to p implies $\Diamond _{2}$ applied once to p.
formal: |-
  $\forall p : t. (\Diamond _{2}(\Diamond _{2}(p)) \to \Diamond _{2}(p))$
