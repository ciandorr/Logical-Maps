id: four-possibility-vee
name: 4 (◇_∨)
category: possibility-vee
statement: For every p, ◇_∨ applied twice to p implies ◇_∨ applied once to p.
formal: '∀p : t. (◇_∨(◇_∨(p)) → ◇_∨(p))'
