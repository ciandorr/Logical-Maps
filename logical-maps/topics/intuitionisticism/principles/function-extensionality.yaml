id: function-extensionality
name: Function extensionality
category: higher-order
statement: |-
  For every $\sigma ,\tau : \forall f,g:\sigma \tau . (\forall x:\sigma . f x = g x) \to (f = g)$
formal: |-
  For every $\sigma ,\tau : \forall f,g:\sigma \tau . (\forall x:\sigma . f x = g x) \to (f = g)$
