id: infinitary-distribution-distinct-from-bottom
name: Infinitary distribution (≠⊥)
category: distinct-from-bottom
statement: |-
  $\forall F:tt. \operatorname{Inex}^t(F) \to (((\exists x:t. F x) \ne \bot ) \to \exists x:t. (F x \ne \bot ))$
formal: |-
  $\forall F:tt. \operatorname{Inex}^t(F) \to (((\exists x:t. F x) \ne \bot ) \to \exists x:t. (F x \ne \bot ))$
sources:
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §4.4, Eq. (43),
  p. 23.
source_names:
- Possibility in Intuitionistic Higher-Order Logic
references:
