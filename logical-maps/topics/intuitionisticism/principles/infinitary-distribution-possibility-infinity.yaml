id: infinitary-distribution-possibility-infinity
name: Infinitary distribution (◇_∞)
category: possibility-infinity
statement: |-
  $\forall F:tt. \operatorname{Inex}^t(F) \to (\Diamond _\infty (\exists x:t. F x) \to \exists x:t. \Diamond _\infty (F x))$
formal: |-
  $\forall F:tt. \operatorname{Inex}^t(F) \to (\Diamond _\infty (\exists x:t. F x) \to \exists x:t. \Diamond _\infty (F x))$
sources:
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §4.4, Eq. (43),
  p. 23.
source_names:
- Possibility in Intuitionistic Higher-Order Logic
references:
- paper: possibility-in-intuitionistic-higher-order-logic
  role: formulation
  locator: §4.4, Eq. (43), p. 23
date: '2026-09-13'
lean: null
notes: |-
  The $\sigma =t$ instance, using the named operator. This is kept distinct from the schema covering every $\sigma$.
