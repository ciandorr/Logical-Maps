id: infinitary-distribution-possibility-two
name: Infinitary distribution (◇₂)
category: possibility-two
statement: |-
  $\forall F:tt. \operatorname{Inex}^t(F) \to (\Diamond _{2}(\exists x:t. F x) \to \exists x:t. \Diamond _{2}(F x))$
formal: |-
  $\forall F:tt. \operatorname{Inex}^t(F) \to (\Diamond _{2}(\exists x:t. F x) \to \exists x:t. \Diamond _{2}(F x))$
sources:
