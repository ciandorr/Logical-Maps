id: infinitary-k-necessity
name: Infinitary K (□)
category: higher-order
statement: |-
  For every $\sigma : \forall F:\sigma t. \operatorname{Inex}^\sigma (F) \to ((\forall x:\sigma . \Box (F x)) \to \Box (\forall x:\sigma . F x))$
formal: |-
  For every $\sigma : \forall F:\sigma t. \operatorname{Inex}^\sigma (F) \to ((\forall x:\sigma . \Box (F x)) \to \Box (\forall x:\sigma . F x))$
sources:
