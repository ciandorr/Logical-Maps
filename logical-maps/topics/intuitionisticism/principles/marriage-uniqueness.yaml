id: marriage-uniqueness
name: Marriage is monogamous
category: candidate-laws
statement: ∀N,P,Q:tt. (Necessity₂(N) ∧ Possibility₂(P) ∧ Possibility₂(Q) ∧ Married(N,P) ∧ Married(N,Q))
  → (P = Q)
formal: ∀N,P,Q:tt. (Necessity₂(N) ∧ Possibility₂(P) ∧ Possibility₂(Q) ∧ Married(N,P) ∧ Married(N,Q)) →
  (P = Q)
sources:
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §7.1, Question
  3, p. 46.
source_names:
- Possibility in Intuitionistic Higher-Order Logic
references:
- paper: possibility-in-intuitionistic-higher-order-logic
  role: formulation
  locator: §7.1, Question 3, p. 46
date: '2026-09-13'
lean: null
notes: Possibility-spouse uniqueness for a fixed qualified necessity; no symmetric uniqueness of necessities
  is included.
