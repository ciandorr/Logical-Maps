id: necessary-nonfalsity-disjunction
name: □Nonfalsity distributes over ∨
category: classical-principles
statement: |-
  $\Box (\forall p,q:t. \neg \neg (p \lor q) \to (\neg \neg p \lor \neg \neg q))$
formal: |-
  $\Box (\forall p,q:t. \neg \neg (p \lor q) \to (\neg \neg p \lor \neg \neg q))$
sources:
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §4.2, Theorem 8,
  Eq. (34), p. 19.
