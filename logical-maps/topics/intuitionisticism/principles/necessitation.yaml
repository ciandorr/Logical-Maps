id: necessitation
name: Necessitation (□)
category: necessity
statement: |-
  For every formula A: from $\vdash A$ infer $\vdash \Box A$; the assumption context must be empty.
formal: |-
  For every formula A: from $\vdash A$ infer $\vdash \Box A$; the assumption context must be empty.
sources:
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §3.2, Theorem 1,
  p. 9.
