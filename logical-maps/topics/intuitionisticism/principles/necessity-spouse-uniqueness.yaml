id: necessity-spouse-uniqueness
name: Spouse uniqueness for □
category: candidate-laws
statement: ∀P,Q:tt. (Possibility₂(P) ∧ Possibility₂(Q) ∧ Married((λp:t. □p), P) ∧ Married((λp:t. □p),
  Q)) → (P = Q)
