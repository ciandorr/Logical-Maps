id: nonfalsity-candidate-characterization
name: Nonfalsity candidate characterization
category: classical-principles
statement: |-
  $\operatorname{Possibility}_\lor (\neg \circ \neg ) = \Box (\forall p:t. \neg p \lor \neg \neg p)$
formal: |-
  $\operatorname{Possibility}_\lor (\neg \circ \neg ) = \Box (\forall p:t. \neg p \lor \neg \neg p)$
