id: nonfalsity-disjunction
name: Nonfalsity distributes over ∨
category: classical-principles
statement: |-
  $\forall p,q:t. \neg \neg (p \lor q) \to (\neg \neg p \lor \neg \neg q)$
formal: |-
  $\forall p,q:t. \neg \neg (p \lor q) \to (\neg \neg p \lor \neg \neg q)$
sources:
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §3.2, Eqs. (14)–(15),
  p. 10; §4.2, Theorem 8, p. 19.
