id: nonfalsity-distinct-disjunction
name: Nonfalsity gives distinct disjunct
category: distinct-from-bottom
statement: ∀p,q:t. ¬¬(p ∨ q) → ((p ≠ ⊥) ∨ (q ≠ ⊥))
