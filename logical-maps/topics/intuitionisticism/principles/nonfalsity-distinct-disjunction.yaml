id: nonfalsity-distinct-disjunction
name: Nonfalsity gives distinct disjunct
category: distinct-from-bottom
statement: |-
  $\forall p,q:t. \neg \neg (p \lor q) \to ((p \ne \bot ) \lor (q \ne \bot ))$
formal: |-
  $\forall p,q:t. \neg \neg (p \lor q) \to ((p \ne \bot ) \lor (q \ne \bot ))$
sources:
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §5.5, Theorem 23,
  Eq. (77), p. 37.
