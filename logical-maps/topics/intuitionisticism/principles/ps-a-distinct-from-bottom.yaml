id: ps-a-distinct-from-bottom
name: PSa (≠⊥)
category: distinct-from-bottom
statement: |-
  For every p and $q, \Box (p \to q)$ implies that $p \ne \bot$ implies $q \ne \bot$, with $\Box p$ defined as $p = \top$.
formal: |-
  $\forall p, q : t. (\Box (p \to q) \to ((p \ne \bot ) \to (q \ne \bot )))$
aliases:
- PSa for ≠⊥
tags:
- modal-condition
- distinct-from-bottom
sources:
- 'Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §4.1, Eq. (22),
  p. 16; operator definition: §3.1, p. 8.'
source_names:
- Possibility in Intuitionistic Higher-Order Logic
references:
- paper: possibility-in-intuitionistic-higher-order-logic
  role: formulation
  locator: '§4.1, Eq. (22), p. 16; operator definition: §3.1, p. 8'
  note: The condition is instantiated with the defined operator ≠⊥; propositional quantification is explicit.
    □ denotes =⊤.
