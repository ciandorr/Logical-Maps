id: ps-a-possibility-infinity
name: PSa (◇_∞)
category: possibility-infinity
statement: |-
  For every p and $q, \Box (p \to q)$ implies that $\Diamond _\infty (p)$ implies $\Diamond _\infty (q)$, with $\Box p$ defined as $p = \top$.
formal: |-
  $\forall p, q : t. (\Box (p \to q) \to (\Diamond _\infty (p) \to \Diamond _\infty (q)))$
aliases:
- PSa for ◇_∞
tags:
- modal-condition
- possibility-infinity
sources:
- 'Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §4.1, Eq. (22),
  p. 16; operator definition: §4.4, Eqs. (42)–(45), p. 23.'
source_names:
- Possibility in Intuitionistic Higher-Order Logic
references:
- paper: possibility-in-intuitionistic-higher-order-logic
  role: formulation
  locator: '§4.1, Eq. (22), p. 16; operator definition: §4.4, Eqs. (42)–(45), p. 23'
  note: The condition is instantiated with the defined operator ◇_∞; propositional quantification is explicit.
    □ denotes =⊤.
