id: ps-a-possibility-two
name: PSa (◇₂)
category: possibility-two
statement: |-
  For every p and $q, \Box (p \to q)$ implies that $\Diamond _{2}(p)$ implies $\Diamond _{2}(q)$, with $\Box p$ defined as $p = \top$.
formal: |-
  $\forall p, q : t. (\Box (p \to q) \to (\Diamond _{2}(p) \to \Diamond _{2}(q)))$
aliases:
- PSa for ◇₂
tags:
- modal-condition
- possibility-two
sources:
- 'Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §4.1, Eq. (22),
  p. 16; operator definition: §4.5, Eqs. (48)–(56), p. 25.'
source_names:
- Possibility in Intuitionistic Higher-Order Logic
references:
- paper: possibility-in-intuitionistic-higher-order-logic
  role: formulation
  locator: '§4.1, Eq. (22), p. 16; operator definition: §4.5, Eqs. (48)–(56), p. 25'
  note: The condition is instantiated with the defined operator ◇₂; propositional quantification is explicit.
    □ denotes =⊤. It is not replaced by □₂.
