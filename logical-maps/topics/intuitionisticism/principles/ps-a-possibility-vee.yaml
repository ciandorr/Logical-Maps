id: ps-a-possibility-vee
name: PSa (◇_∨)
category: possibility-vee
statement: |-
  For every p and $q, \Box (p \to q)$ implies that $\Diamond _\lor (p)$ implies $\Diamond _\lor (q)$, with $\Box p$ defined as $p = \top$.
formal: |-
  $\forall p, q : t. (\Box (p \to q) \to (\Diamond _\lor (p) \to \Diamond _\lor (q)))$
aliases:
- PSa for ◇_∨
tags:
- modal-condition
- possibility-vee
sources:
- 'Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §4.1, Eq. (22),
  p. 16; operator definition: §4.2, Eqs. (32)–(33), pp. 18–19.'
source_names:
- Possibility in Intuitionistic Higher-Order Logic
references:
- paper: possibility-in-intuitionistic-higher-order-logic
  role: formulation
  locator: '§4.1, Eq. (22), p. 16; operator definition: §4.2, Eqs. (32)–(33), pp. 18–19'
  note: The condition is instantiated with the defined operator ◇_∨; propositional quantification is explicit.
    □ denotes =⊤.
