id: ps-c-distinct-from-bottom
name: PSc (≠⊥)
category: distinct-from-bottom
statement: For every p and q, (p ∨ q) ≠ ⊥ implies p ≠ ⊥ or q ≠ ⊥.
formal: '∀p, q : t. (((p ∨ q) ≠ ⊥) → ((p ≠ ⊥) ∨ (q ≠ ⊥)))'
aliases:
- PSc for ≠⊥
tags:
