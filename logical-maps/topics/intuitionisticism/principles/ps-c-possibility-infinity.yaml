id: ps-c-possibility-infinity
name: PSc (◇_∞)
category: possibility-infinity
statement: For every p and q, ◇_∞(p ∨ q) implies ◇_∞(p) ∨ ◇_∞(q).
formal: '∀p, q : t. (◇_∞(p ∨ q) → (◇_∞(p) ∨ ◇_∞(q)))'
