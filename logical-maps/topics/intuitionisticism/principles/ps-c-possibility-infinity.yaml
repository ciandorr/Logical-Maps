id: ps-c-possibility-infinity
name: PSc (◇_∞)
category: possibility-infinity
statement: |-
  For every p and $q, \Diamond _\infty (p \lor q)$ implies $\Diamond _\infty (p) \lor \Diamond _\infty (q)$.
formal: |-
  $\forall p, q : t. (\Diamond _\infty (p \lor q) \to (\Diamond _\infty (p) \lor \Diamond _\infty (q)))$
