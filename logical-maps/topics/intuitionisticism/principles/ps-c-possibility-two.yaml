id: ps-c-possibility-two
name: PSc (◇₂)
category: possibility-two
statement: For every p and q, ◇₂(p ∨ q) implies ◇₂(p) ∨ ◇₂(q).
formal: '∀p, q : t. (◇₂(p ∨ q) → (◇₂(p) ∨ ◇₂(q)))'
