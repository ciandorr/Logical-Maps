id: ps-c-possibility-vee
name: PSc (◇_∨)
category: possibility-vee
statement: |-
  For every p and $q, \Diamond _\lor (p \lor q)$ implies $\Diamond _\lor (p) \lor \Diamond _\lor (q)$.
formal: |-
  $\forall p, q : t. (\Diamond _\lor (p \lor q) \to (\Diamond _\lor (p) \lor \Diamond _\lor (q)))$
aliases:
- PSc for ◇_∨
