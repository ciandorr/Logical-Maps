id: ps-d-possibility-infinity
name: PSd (◇_∞)
category: possibility-infinity
statement: For every p and q, if ◇_∞(p) implies □q, then □(p → q), with □p defined as p = ⊤.
formal: '∀p, q : t. ((◇_∞(p) → □q) → □(p → q))'
aliases:
- PSd for ◇_∞
tags:
- modal-condition
- possibility-infinity
sources:
- 'Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §4.1, Eq. (25),
  p. 16; operator definition: §4.4, Eqs. (42)–(45), p. 23.'
source_names:
- Possibility in Intuitionistic Higher-Order Logic
references:
- paper: possibility-in-intuitionistic-higher-order-logic
  role: formulation
  locator: '§4.1, Eq. (25), p. 16; operator definition: §4.4, Eqs. (42)–(45), p. 23'
  note: The condition is instantiated with the defined operator ◇_∞; propositional quantification is explicit.
    □ denotes =⊤.
date: '2026-09-13'
