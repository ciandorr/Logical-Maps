id: ps-d-possibility-two
name: PSd (◇₂)
category: possibility-two
statement: |-
  For every p and q, if $\Diamond _{2}(p)$ implies $\Box q$, then $\Box (p \to q)$, with $\Box p$ defined as $p = \top$.
formal: |-
  $\forall p, q : t. ((\Diamond _{2}(p) \to \Box q) \to \Box (p \to q))$
aliases:
- PSd for ◇₂
tags:
