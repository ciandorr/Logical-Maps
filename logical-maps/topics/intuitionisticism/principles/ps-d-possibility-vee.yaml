id: ps-d-possibility-vee
name: PSd (◇_∨)
category: possibility-vee
statement: |-
  For every p and q, if $\Diamond _\lor (p)$ implies $\Box q$, then $\Box (p \to q)$, with $\Box p$ defined as $p = \top$.
formal: |-
  $\forall p, q : t. ((\Diamond _\lor (p) \to \Box q) \to \Box (p \to q))$
aliases:
- PSd for ◇_∨
tags:
