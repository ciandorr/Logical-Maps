id: uniform-possibility-counterexamples
name: Uniform impossibility counterexamples
category: candidate-laws
statement: |-
  $\forall f:tt. (\operatorname{PSb}(f) \land \operatorname{PSc}(f)) \to \exists p:t. (\neg f p \land p \ne \bot )$
