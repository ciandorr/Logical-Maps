proof: With the two selected necessary binary clauses, the II theorems □PSa(◇_∞) and □PSb(◇_∞), and necessary
  normality of □, the operator ◇_∞ witnesses Necessity₂(□). This gives □₂p→□p; the reverse is an II theorem.
  Both selected premises imply their own boxes, so the discharged comparison argument lifts to necessary
  universal equivalence, which implies operator identity. No infinitary-to-binary implication is assumed.
