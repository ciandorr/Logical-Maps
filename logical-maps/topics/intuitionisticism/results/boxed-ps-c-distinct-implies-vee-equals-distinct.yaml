proof: |-
  The necessary PSa and PSb conditions for $\ne \bot$ follow by necessitating their assumption-free II proofs. With the selected $\Box \operatorname{PSc}(\ne \bot )$, this makes $\ne \bot a \operatorname{Possibility}_\lor$ candidate. It follows that $p\ne \bot \to \Diamond _\lor p$. Conversely, the II bound for every PSb candidate gives $\Diamond _\lor p\to p\ne \bot$.

  The selected premise is boxed and implies its own box. Thus necessitating the discharged argument and using K yields $\Box \forall p.(\Diamond _\lor p\leftrightarrow p\ne \bot )$. Apply the predicate intensionality lemma to obtain the identity of the two operators.
