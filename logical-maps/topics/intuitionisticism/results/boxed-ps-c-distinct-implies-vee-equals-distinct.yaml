proof: 'The necessary PSa and PSb conditions for ≠⊥ follow by necessitating their assumption-free II proofs.
  With the selected □PSc(≠⊥), this makes ≠⊥ a Possibility_∨ candidate. It follows that p≠⊥→◇_∨p. Conversely,
  the II bound for every PSb candidate gives ◇_∨p→p≠⊥.


  The selected premise is boxed and implies its own box. Thus necessitating the discharged argument and
  using K yields □∀p.(◇_∨p↔p≠⊥). Apply the predicate intensionality lemma to obtain the identity of the
  two operators.'
