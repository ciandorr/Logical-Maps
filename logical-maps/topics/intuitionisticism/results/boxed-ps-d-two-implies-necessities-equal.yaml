proof: Necessary PSa, PSb and PSc for ◇₂ with the fixed □ are II theorems. Together with the selected
  □PSd(◇₂) and the necessary normality of □ they give Necessity₂(□). Hence □₂p→□p universally, while the
  reverse comparison is an II theorem. The selected premise is boxed and therefore self-necessitating;
  lift this discharged comparison proof under □ using K and 4, then apply predicate intensionality to
  obtain □₂=□.
