proof: 'Let A be □PSd(◇_∨). The standing necessary PSa, PSb and PSc clauses for ◇_∨, and the standing
  necessary normality of □, show that □ and ◇_∨ form a qualified married pair. Thus Necessity₂(□). Instantiating
  the definition of □₂p with this candidate yields □₂p→□p for every p. The reverse comparison is an II
  theorem.


  After discharging A, the pointwise argument is a closed theorem A→∀p.(□₂p↔□p). Since A is boxed, 4 gives
  A→□A. Necessitate the closed conditional and apply K to obtain □∀p.(□₂p↔□p). Apply the proved predicate
  intensionality lemma to identify □₂ and □.'
