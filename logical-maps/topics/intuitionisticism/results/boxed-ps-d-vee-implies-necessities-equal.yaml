proof: |-
  Let A be $\Box \operatorname{PSd}(\Diamond _\lor )$. The standing necessary PSa, PSb and PSc clauses for $\Diamond _\lor$, and the standing necessary normality of $\Box$, show that $\Box$ and $\Diamond _\lor$ form a qualified married pair. Thus $\operatorname{Necessity}_{2}(\Box )$. Instantiating the definition of $\Box _{2}p$ with this candidate yields $\Box _{2}p\to \Box p$ for every p. The reverse comparison is an II theorem.

  After discharging A, the pointwise argument is a closed theorem $A\to \forall p.(\Box _{2}p\leftrightarrow \Box p)$. Since A is boxed, 4 gives $A\to \Box A$. Necessitate the closed conditional and apply K to obtain $\Box \forall p.(\Box _{2}p\leftrightarrow \Box p)$. Apply the proved predicate intensionality lemma to identify $\Box _{2}$ and $\Box$.
