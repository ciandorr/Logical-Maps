proof: Fix p and instantiate the selected quantified excluded-middle formula at the proposition p=⊥. Under
  ¬¬(p=⊥), its negative disjunct is impossible, so p=⊥. Discharge and generalize p. The excluded-middle
  assumption is not necessitated.
