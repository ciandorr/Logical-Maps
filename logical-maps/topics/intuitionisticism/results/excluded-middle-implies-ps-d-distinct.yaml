proof: Fix p,q and assume (p≠⊥)→□q. Instantiate excluded middle at p=⊥. If p=⊥, substitution and the closed
  identity (⊥→q)=⊤ give □(p→q). Otherwise p≠⊥, so □q; the necessitated intuitionistic theorem q→(p→q),
  with K, gives □(p→q). Discharge and generalize p,q. Only the closed intuitionistic theorem is necessitated,
  never excluded middle.
