proof: Fix arbitrary σ,τ and f,g:σ→τ. Under □∀x.fx=gx, T gives ∀x.fx=gx. Use the selected function-extensionality
  instance at exactly these σ,τ to get f=g. Discharge, generalize f,g, and then observe that σ,τ were
  arbitrary. This supplies every target instance.
