proof: Suppose ¬((p≠⊥)=⊥) and p=⊥. Substitution gives (p≠⊥)=(⊥≠⊥)=⊥, where the last identity follows from
  reflexivity and assumption-free intensionality. This is a contradiction. Hence p≠⊥; discharge and generalize.
