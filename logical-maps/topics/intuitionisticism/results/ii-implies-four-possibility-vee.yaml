proof: |-
  Theorem 6 supplies $\operatorname{Possibility}_\lor (\Diamond _\lor )$. Theorem 9 applied to that candidate twice supplies $\operatorname{Possibility}_\lor (\Diamond _\lor \circ \Diamond _\lor )$. If $\Diamond _\lor (\Diamond _\lor p)$, this composition is a witness in the existential definition of $\Diamond _\lor p$. Discharge and generalize p.
