proof: Assume □₂(p→q) and □₂p. For any qualified N, its necessary normality gives its universally quantified
  K condition. Instantiate that condition at p,q, and use N(p→q) and Np obtained from the two assumptions,
  to get Nq. Quantify N, discharge and generalize p,q.
