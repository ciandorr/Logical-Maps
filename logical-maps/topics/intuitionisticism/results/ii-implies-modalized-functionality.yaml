proof: 'Fix arbitrary types σ and τ. Since every type is built from t by arrows, write τ=τ₁→⋯→τₙ→t, allowing
  n=0. Fix f,g:σ→τ, and put A:=∀x:σ. fx=gx. Choose x,y₁,…,yₙ fresh for A.


  With no assumptions, intuitionistic logic and substitution of equals prove

  (A ∧ f x y₁⋯yₙ) ↔ (A ∧ g x y₁⋯yₙ).

  Apply propositional intensionality to this assumption-free equivalence. Then apply function intensionality
  successively to yₙ,…,y₁,x. This yields the assumption-free identity

  (λx y₁⋯yₙ. A∧f x y₁⋯yₙ) = (λx y₁⋯yₙ. A∧g x y₁⋯yₙ).


  Now assume □A, that is A=⊤. Leibniz substitution replaces A by ⊤ in that previously derived identity.
  The assumption-free identities ⊤∧r=r, abstracted using function intensionality, and η-conversion simplify
  its two sides to f and g. Hence f=g. Discharge □A and generalize f,g. Since σ,τ were arbitrary, this
  proves every instance of modalized functionality. Neither intensionality rule was applied under the
  □A assumption.


  The same construction, starting with A:=∀x.(fx↔gx) when f,g:σ→t, proves the predicate form □∀x.(fx↔gx)→f=g.
  The zero-argument case proves □(p↔q)→p=q. These forms will be used in the connecting proofs.'
