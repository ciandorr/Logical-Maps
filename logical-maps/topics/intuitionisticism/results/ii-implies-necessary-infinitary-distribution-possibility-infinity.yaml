proof: |-
  Fix $F:t\to t$ and assume $\operatorname{Inex}(F)$ and $\Diamond _\infty (\exists x.Fx)$. Choose a witness P with $\operatorname{Possibility}_\infty (P)$ and $P(\exists x.Fx)$. Its $\operatorname{PSc}_{\infty }^t$ condition yields $\exists x.P(Fx)$. Each such x, with the same candidate P, witnesses $\Diamond _\infty (Fx)$, so $\exists x.\Diamond _\infty (Fx)$. Discharge the assumptions and quantify F. This is an assumption-free theorem, so necessitate the whole sentence.
