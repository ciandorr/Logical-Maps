proof: Fix F:t→t and assume Inex(F) and ◇_∞(∃x.Fx). Choose a witness P with Possibility_∞(P) and P(∃x.Fx).
  Its PSc∞^t condition yields ∃x.P(Fx). Each such x, with the same candidate P, witnesses ◇_∞(Fx), so
  ∃x.◇_∞(Fx). Discharge the assumptions and quantify F. This is an assumption-free theorem, so necessitate
  the whole sentence.
