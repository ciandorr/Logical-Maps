proof: Assume □₂(p→q) and ◇₂p. Choose a candidate P witnessing ◇₂p. The candidate definition supplies
  a qualified spouse N, so □₂(p→q) gives N(p→q). Extract PSa₂(N,P) from their marriage and infer Pq, hence
  ◇₂q. Discharge temporary assumptions and universally generalize p,q. Necessitate the resulting closed
  theorem with the standing □ rule, as required by the outer identity in Married.
