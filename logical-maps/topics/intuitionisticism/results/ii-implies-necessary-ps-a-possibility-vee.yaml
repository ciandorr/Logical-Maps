proof: |-
  Given $\Box (p \to q)$ and $\Diamond _\lor p$, choose its defining witness P with $\operatorname{Possibility}_\lor (P)$ and Pp. Extract $\operatorname{PSa}(P)$ using $\Box A \to A$, and infer Pq, hence $\Diamond _\lor q$. Discharge all temporary assumptions and universally generalize the displayed free proposition variables. Necessitate this closed theorem using the admissible empty-context rule for $\Box$.
