proof: If ◇_∞⊥, its defining witness P has Possibility_∞(P) and P⊥. The candidate condition includes □¬P⊥,
  hence ¬P⊥, a contradiction. Discharge all temporary assumptions and universally generalize the displayed
  free proposition variables. Necessitate this closed theorem using the admissible empty-context rule
  for □.
