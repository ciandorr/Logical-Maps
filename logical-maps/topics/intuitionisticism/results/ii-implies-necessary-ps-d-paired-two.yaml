proof: Assume ◇₂p→□₂q. For arbitrary qualified N choose its qualified spouse P. Then Pp→◇₂p→□₂q→Nq. Their
  PSd₂ clause gives N(p→q). Quantifying over qualified N gives □₂(p→q). Discharge temporary assumptions
  and universally generalize p,q. Necessitate the resulting closed theorem with the standing □ rule, as
  required by the outer identity in Married.
