proof: For P=¬∘¬, PSa follows from □(p→q)→(p→q) and intuitionistic monotonicity of double negation; PSb
  is also an intuitionistic theorem. Universally close and necessitate both. Thus Possibility_∨(¬∘¬) is
  equivalent to necessary nonfalsity distribution. Theorem 8’s case argument gives the assumption-free
  equivalence of that sentence with necessary weak excluded middle (the two implications are recorded
  separately). Apply standing propositional intensionality to this assumption-free equivalence to obtain
  the displayed identity.
