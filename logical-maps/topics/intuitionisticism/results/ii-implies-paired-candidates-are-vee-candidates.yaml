proof: 'Fix P and assume Possibility₂(P). Choose its spouse N, retaining □Normal(N), □PSa₂(N,P), □PSd₂(N,P),
  and □(PSb(P)∧PSc(P)). The closed substitution argument N⊤∧□r→Nr holds for every r: if r=⊤, replace equals
  in N⊤. By closing and necessitating this argument, □N⊤ gives the necessary version of ∀r.(□r→Nr).


  Apply it to r=(p→q), and combine with the necessary PSa₂(N,P) clause. Necessitated logical implication
  and K give □PSa(P), now with the fixed necessity □. The necessary PSb and PSc clauses are already present.
  Their necessary conjunction is exactly Possibility_∨(P). Eliminate the spouse witness and discharge
  the candidate assumption; generalize P. Necessitation was used only on closed logical arguments, with
  boxed assumptions propagated by K.'
