proof: Let Truth = λp.p. PSa follows from □(p→q)→(p→q), PSb is ¬⊥, and the infinitary clause becomes Inex(F)→(∃x.Fx→∃x.Fx).
  Each necessary candidate condition can be necessitated after its assumption-free derivation, so Truth
  is a qualified candidate. Given p, choose Truth in the existential definition of ◇_∞p. Discharge and
  generalize p.
