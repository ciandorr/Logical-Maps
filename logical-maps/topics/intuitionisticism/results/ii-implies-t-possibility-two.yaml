proof: Let Truth = λp.p. Truth satisfies N and K, PSb and PSc; both marriage clauses for Truth paired
  with itself reduce to intuitionistic tautologies. Each necessary candidate condition can be necessitated
  after its assumption-free derivation, so Truth is a qualified candidate. Given p, choose Truth in the
  existential definition of ◇₂p. Discharge and generalize p.
