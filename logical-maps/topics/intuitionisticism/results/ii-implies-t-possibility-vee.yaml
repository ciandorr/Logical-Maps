proof: |-
  Let $\operatorname{Truth} = \lambda p.p. \operatorname{PSa}$ follows from $\Box (p\to q)\to (p\to q); \operatorname{PSb}$ and PSc reduce to intuitionistic tautologies. Each necessary candidate condition can be necessitated after its assumption-free derivation, so Truth is a qualified candidate. Given p, choose Truth in the existential definition of $\Diamond _\lor p$. Discharge and generalize p.
