proof: 'Assume Possibility_∨(P) and Possibility_∨(Q). Both premises are identities with ⊤, so they imply
  their own □-necessitations by 4. This permits modal reasoning with these necessary conditions; it does
  not permit unrestricted necessitation under assumptions.


  For PSa, □(p→q) and the necessary PSa condition for Q give □(Qp→Qq), by the necessitated universal-instantiation
  theorem and K. PSa(P) then takes P(Qp) to P(Qq). For PSb, □¬Q⊥ gives Q⊥=⊥, using □¬r↔r=⊥; substituting
  this into □¬P⊥ yields the required necessary bottom clause. For PSc, the necessary disjunction clause
  for Q gives □(Q(p∨q)→(Qp∨Qq)); use PSa(P) and then PSc(P). These same derivations can be performed inside
  □, since the candidate premises imply their own □ forms. The closed logical deductions and K therefore
  give the necessary conjunction of PSa, PSb and PSc for P∘Q. Discharge the two candidate assumptions
  and generalize P,Q.'
