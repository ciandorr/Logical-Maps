proof: |-
  Assume the two candidate predicates, which are themselves $\Box$-stable identities with $\top$. For $R = \lambda p.(Pp\lor Qp), \operatorname{PSa}$ follows by cases from the PSa clauses of P and Q. Neither disjunct of $R\bot$ can hold by their PSb clauses. For PSc, split $P(p\lor q)\lor Q(p\lor q)$, apply the respective PSc clause, and inject into $Rp\lor Rq$. The same finite deduction is available necessarily: the candidate conditions are necessary, and necessitated logical theorems plus K transport the deduction under $\Box$. Thus the conjunction defining $\operatorname{Possibility}_\lor (R)$ is identical to $\top$. Discharge and generalize P,Q.
