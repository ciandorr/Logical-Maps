proof: 'Assume the two candidate predicates, which are themselves □-stable identities with ⊤. For R =
  λp.(Pp∨Qp), PSa follows by cases from the PSa clauses of P and Q. Neither disjunct of R⊥ can hold by
  their PSb clauses. For PSc, split P(p∨q)∨Q(p∨q), apply the respective PSc clause, and inject into Rp∨Rq.
  The same finite deduction is available necessarily: the candidate conditions are necessary, and necessitated
  logical theorems plus K transport the deduction under □. Thus the conjunction defining Possibility_∨(R)
  is identical to ⊤. Discharge and generalize P,Q.'
