proof: |-
  Given $\Diamond _\lor p$, choose its candidate witness P with $\operatorname{Possibility}_\lor (P)$ and Pp. The candidate predicate implies $\operatorname{PSb}(P)$, namely $\neg P\bot$. If $p=\bot$, substitution in Pp gives $P\bot , a$ contradiction. Thus $p\ne \bot$. Discharge and generalize p. This bound only needs PSb and does not assume the disputed infinitary-to-binary reduction.
