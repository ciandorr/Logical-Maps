proof: The closed intuitionistic implication from quantified excluded middle to ∀p.(¬¬p→p) can be necessitated.
  With necessary excluded middle, K and necessitated universal instantiation give □(¬¬p→p) for each p.
  Choose the existential witness with □¬¬p and p≠⊤; K yields □p, which is p=⊤, contradicting p≠⊤.
