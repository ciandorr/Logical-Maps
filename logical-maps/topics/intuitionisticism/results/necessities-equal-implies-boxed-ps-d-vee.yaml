proof: |-
  Let E be $\Box =\Box _{2}$. Suppose $\Diamond _\lor p\to \Box q$. Since $\Diamond _{2}p\to \Diamond _\lor p$ is an II theorem, E gives $\Diamond _{2}p\to \Box _{2}q$. Paired $\operatorname{PSd}_{2}$ yields $\Box _{2}(p\to q)$, and E converts this to $\Box (p\to q)$. Discharge and generalize p,q, retaining only E.

  This proves the closed implication $E\to \operatorname{PSd}(\Diamond _\lor )$. Identity implies its own $\Box$ by substituting equals into the reflexivity theorem, so $E\to \Box E$. Necessitate the closed implication and apply K to obtain $\Box \operatorname{PSd}(\Diamond _\lor )$.
