proof: 'Let E be □=□₂. Suppose ◇_∨p→□q. Since ◇₂p→◇_∨p is an II theorem, E gives ◇₂p→□₂q. Paired PSd₂
  yields □₂(p→q), and E converts this to □(p→q). Discharge and generalize p,q, retaining only E.


  This proves the closed implication E→PSd(◇_∨). Identity implies its own □ by substituting equals into
  the reflexivity theorem, so E→□E. Necessitate the closed implication and apply K to obtain □PSd(◇_∨).'
