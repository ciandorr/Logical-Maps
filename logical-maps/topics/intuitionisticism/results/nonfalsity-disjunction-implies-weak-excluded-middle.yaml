proof: For arbitrary p, intuitionistic logic proves ¬¬(p∨¬p). Apply the selected distribution formula
  to p and ¬p, obtaining ¬¬p∨¬¬¬p. Triple-negation reduction gives ¬¬p∨¬p, hence weak excluded middle
  after swapping disjuncts. Generalize p.
