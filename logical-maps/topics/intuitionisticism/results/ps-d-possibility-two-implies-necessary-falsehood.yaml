proof: |-
  Fix p and assume $\neg \Diamond _{2}(p)$. Then $\Diamond _{2}(p)\to \Box \bot$ by explosion. Instantiate PSd at p and $q=\bot$ to get $\Box (p\to \bot )$, which is $\Box \neg p$. Discharge and generalize p.
