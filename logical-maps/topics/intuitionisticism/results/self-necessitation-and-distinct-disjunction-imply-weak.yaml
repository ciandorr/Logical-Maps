proof: Instantiate self-necessitation at ¬p to obtain ¬p→□¬p, equivalently ¬p→p=⊥. Contraposition gives
  p≠⊥→¬¬p. At ¬¬p the same reasoning gives ¬p≠⊥→¬¬¬p→¬p. Intuitionistic logic proves ¬¬(p∨¬p); Eq. (77),
  instantiated at p and ¬p, therefore yields p≠⊥∨¬p≠⊥. The two implications just obtained give ¬¬p∨¬p.
  Generalize p.
sources:
- Zachary Goodsell, Possibility in Intuitionistic Higher-Order Logic (21 August 2026), §5.5, Eqs. (77)–(79),
  pp. 37–38.
