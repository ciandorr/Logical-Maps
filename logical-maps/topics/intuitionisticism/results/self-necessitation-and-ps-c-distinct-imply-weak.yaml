proof: For arbitrary p, ¬¬(p∨¬p) is an intuitionistic theorem. It implies (p∨¬p)≠⊥, since identity with
  ⊥ would contradict its double negation. PSc for ≠⊥ gives p≠⊥∨¬p≠⊥. The self-necessitation instances
  at ¬p and ¬¬p, followed by contraposition and triple-negation reduction, turn these disjuncts into ¬¬p
  and ¬p respectively. Generalize p.
