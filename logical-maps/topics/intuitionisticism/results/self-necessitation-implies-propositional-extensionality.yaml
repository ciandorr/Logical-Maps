proof: 'Given p↔q, instantiate self-necessitation at the proposition p↔q to obtain □(p↔q). The zero-argument
  form of the proved intensionality lemma gives p=q: it follows by necessitation-free substitution into
  the closed identity ((p↔q)∧p)=((p↔q)∧q). Discharge and generalize p,q.'
