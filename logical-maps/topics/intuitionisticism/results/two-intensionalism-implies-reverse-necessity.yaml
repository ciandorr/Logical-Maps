proof: Fix p and assume □₂p. Necessitate the closed intuitionistic theorem p→(p↔⊤) using the proved empty-context
  □₂ rule, and use K for □₂ to obtain □₂(p↔⊤). Instantiate the selected □₂-intensionalism sentence at
  p,⊤ to infer p=⊤, namely □p. Discharge and generalize p.
