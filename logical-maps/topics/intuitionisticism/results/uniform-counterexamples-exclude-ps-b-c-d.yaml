proof: |-
  Choose f with PSb, PSc and PSd. The uniform counterexample formula at f gives p with $\neg fp$ and $p\ne \bot . \operatorname{PSd}$ at $p,\bot$ turns $\neg fp$ into $\Box \neg p$, hence $p=\bot$ by footnote 5. Contradiction.
