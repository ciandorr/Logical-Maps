proof: 'For use below, the spouse sentence is self-necessitating. Each necessary candidate or marriage
  clause is a boxed sentence, hence implies its own box by 4. A conjunction of such clauses has the same
  property. Also, if B(x)→□B(x) is a closed theorem, then ∃x.B(x)→□∃x.B(x): choose the same witness x,
  obtain □B(x), and apply K to the necessitated existential-introduction theorem B(x)→∃y.B(y). This is
  the valid direction using an existing witness, not a converse Barcan assumption. Expanding Necessity₂(N)
  shows it is a conjunction and existential combination of boxed clauses. Therefore ∃N.(Necessity₂(N)∧Married(N,P))
  implies its own □, for each fixed P.'
