proof: |-
  Write S for $\operatorname{Spouse}(\Diamond _\lor )$. Given S, choose a qualified spouse N. Theorems 6 and 14–15's definitions give the necessary PSb/PSc clauses for $\Diamond _\lor$ and the required marriage with N. Thus $\Diamond _\lor$ itself is $a \operatorname{Possibility}_{2}$ candidate, so $\forall p.(\Diamond _\lor p\to \Diamond _{2}p)$. The reverse implication $\forall p.(\Diamond _{2}p\to \Diamond _\lor p)$ is an II theorem by candidate inclusion.

  For use below, the spouse sentence is self-necessitating. Each necessary candidate or marriage clause is a boxed sentence, hence implies its own box by 4. A conjunction of such clauses has the same property. Also, if $B(x)\to \Box B(x)$ is a closed theorem, then $\exists x.B(x)\to \Box \exists x.B(x)$: choose the same witness x, obtain $\Box B(x)$, and apply K to the necessitated existential-introduction theorem $B(x)\to \exists y.B(y)$. This is the valid direction using an existing witness, not a converse Barcan assumption. Expanding $\operatorname{Necessity}_{2}(N)$ shows it is a conjunction and existential combination of boxed clauses. Therefore $\exists N.(\operatorname{Necessity}_{2}(N)\land \operatorname{Married}(N,P))$ implies its own $\Box$, for each fixed P.

  The preceding pointwise proof, after discharging S, gives an assumption-free theorem $S\to \forall p.(\Diamond _\lor p\leftrightarrow \Diamond _{2}p)$. Necessitate that closed implication and use $\Box S$ and K to get $\Box \forall p.(\Diamond _\lor p\leftrightarrow \Diamond _{2}p)$. The predicate form of the proved modalized-functionality lemma then gives $\Diamond _\lor =\Diamond _{2}$. This final step establishes identity of operators, not merely their material equivalence at the selected background.
