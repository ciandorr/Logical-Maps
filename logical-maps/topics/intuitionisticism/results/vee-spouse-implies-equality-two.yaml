proof: 'Write S for Spouse(◇_∨). Given S, choose a qualified spouse N. Theorems 6 and 14–15''s definitions
  give the necessary PSb/PSc clauses for ◇_∨ and the required marriage with N. Thus ◇_∨ itself is a Possibility₂
  candidate, so ∀p.(◇_∨p→◇₂p). The reverse implication ∀p.(◇₂p→◇_∨p) is an II theorem by candidate inclusion.


  For use below, the spouse sentence is self-necessitating. Each necessary candidate or marriage clause
  is a boxed sentence, hence implies its own box by 4. A conjunction of such clauses has the same property.
  Also, if B(x)→□B(x) is a closed theorem, then ∃x.B(x)→□∃x.B(x): choose the same witness x, obtain □B(x),
  and apply K to the necessitated existential-introduction theorem B(x)→∃y.B(y). This is the valid direction
  using an existing witness, not a converse Barcan assumption. Expanding Necessity₂(N) shows it is a conjunction
  and existential combination of boxed clauses. Therefore ∃N.(Necessity₂(N)∧Married(N,P)) implies its
  own □, for each fixed P.


  The preceding pointwise proof, after discharging S, gives an assumption-free theorem S→∀p.(◇_∨p↔◇₂p).
  Necessitate that closed implication and use □S and K to get □∀p.(◇_∨p↔◇₂p). The predicate form of the
  proved modalized-functionality lemma then gives ◇_∨=◇₂. This final step establishes identity of operators,
  not merely their material equivalence at the selected background.'
