notation: 'p, q, r : t; □p := (p = ⊤); (≠⊥)(p) := ¬(p = ⊥). ◇_∨, ◇₂ and ◇_∞ retain their separate definitions.
  □₂ is the married necessity of §4.5. PSa/PSd entries use □ unless their labels explicitly say □₂. Truth
  := λp.p. Inex, Prime, PSa–PSd, Possibility and Married are defined in the Background tab. Quantified
  candidate variables are bound variables, not an unspecified designated possibility operator.'
