id: intuitionisticism
draft: true
title: Intuitionisticism [Draft]
require_sources: true
description: 'Principles of necessity and possibility in intuitionistic intensional higher-order logic.

  '
framework: 'The fixed base theory is Intuitionisticism (II), as formulated in Goodsell, Possibility in
  Intuitionistic Higher-Order Logic (21 August 2026), §§2.1–2.2. Types are generated from the propositional
  type t by function types ⟨στ⟩. The language has application, lambda abstraction, intuitionistic propositional
  connectives, identity and quantification at every type. The base rules are beta-eta conversion, intuitionistic
  propositional and quantifier rules, reflexivity of identity and Leibniz''s Law, together with propositional
  and function intensionality restricted to derivations with no assumptions. Intensionality is part of
  the fixed logic. Write □p for p = ⊤. The distinct defined operators ◇_∨, ◇₂, ◇_∞ and ≠⊥ retain their
  own definitions; no unindexed possibility operator is part of the framework. An arrow to a rule or schema
  requires a derivation of every instance; an arrow from it may use particular instances. This convention
  also applies to type-ambiguous schemata. Preserve rule side conditions and distinguish schematic instances
  from object-language quantification. See background.md for definitions and arrow conventions.

  '
