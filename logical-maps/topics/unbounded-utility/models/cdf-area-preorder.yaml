description: Use real outcomes with their identity utility. For d=S_X−S_Y, define X ≽R Y iff ∫d₋<∞ and ∫d₊≥∫d₋.
  This is the manuscript’s explicit base preorder, satisfying DU but not DTU because Totality fails. Its elementary properties, comonotonic sum consistency,
  and forward independent-sum preservation are established in the accompanying write-up, with the quantile-area
  argument made valid for infinite areas. The draft’s proof does not establish reverse independent-sum cancellation,
  so full Independent Sum Invariance is not asserted. Symmetric Cauchy versus zero has both areas infinite,
  witnessing incompleteness and failure of Symmetric Neutrality and Folded Expectation. The St Petersburg arguments
  supply the two sum-consistency violations.
