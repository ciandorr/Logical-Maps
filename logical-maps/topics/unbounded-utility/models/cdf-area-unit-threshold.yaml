description: |-
  Real outcomes with identity utility. For the width $h=Q_X- Q_Y$ on (0,1), let $X \succeq Y$ iff either some step function $s\le h$ (finitely many values on finitely many intervals) has $\int s\ge 0$, or $\int h_{-}<\infty$ and $\int h\ge 1$. In survival coordinates the second clause is $A_{-}<\infty$ and $A_{+}- A_{-}\ge 1$. Sums of floors are floors and the threshold clause absorbs the floor clause, giving transitivity. Widths of simple pairs are step functions, so simple gambles are ranked by expectation (Simple EU, hence Archimedean Outcomes and Restricted Totality); a nonnegative width is its own floor and a nonzero one admits no floor in reverse (Stochastic Dominance). The width is unchanged by comonotonic sums, shifts and reflection. Witness $X^{*}=3- U^{- 1/2}$: mean 1 and quantile unbounded below, so $X^{*}\succeq 0$ by the threshold but $\tfrac12 X^{*}\not\succeq 0$, refuting cancellation ($2X \succeq 2Y$ does not give $X \succeq Y$), Rational Scale Invariance and the affine principles; its half-mixture with sure 0 has mean 1/2 and no floor, refuting Mixture Independence. U against 1/2 has continuous width $u- 1/2$ of integral 0, so the two are incomparable although $U+\epsilon \succeq 1/2$ for every $\epsilon >0$: Totality, the expectation rules, CDF-Area Extension, neutrality and both continuity principles fail. The write-up verifies every listed property; the check script verifies the witnesses. Integer Affine Preservation holds, since floors and the threshold scale with k and every ranked width has nonnegative integral; Rational Affine Preservation fails at a = 1/2 by the same witness.
