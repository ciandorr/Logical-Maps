notes: |-
  Original countermodel. It shows that Totality cannot be dropped from comonotonic-sum-totality-imply-rational-scale: iterated comonotonic addition preserves comparisons here, but the cancellation direction fails. It is not a DU model, since Mixture Independence fails, so it leaves open whether DU with Comonotonic Sum Invariance gives Rational Scale Invariance. Only the listed principles are verified. No independent checker or Lean verification is claimed.
