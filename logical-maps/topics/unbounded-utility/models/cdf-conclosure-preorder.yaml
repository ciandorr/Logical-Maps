description: >-
  Use all real outcomes with identity utility. In the vector space of
  survival differences, let C={v: integral(v_-) is finite and integral(v_+)
  is at least integral(v_-)} be Goodsell's CDF-area cone. Define
  Sat(C)={v: T_xi v belongs to C for some probability law xi}, where
  T_xi is convolution by xi, and set X >= Y iff S_X-S_Y belongs to Sat(C).
  This is Goodsell's conclosure, stopped before the total-extension step.
  The previously recorded commutation and strict-preservation argument
  makes it a cone extending the area comparisons strictly and invariant
  in both directions under every independent convolution. Reflection of
  the survival difference conjugates xi to its reflected law; positive
  affine changes conjugate xi to its positively scaled law. The area cone
  is invariant under these changes, so the conclosure inherits reflection
  anti-invariance and positive affine invariance. It fails Symmetric
  Neutrality by the completed Levy obstruction. Since a comparable
  symmetric gamble in any law-invariant reflection-anti-invariant preorder
  must be indifferent to zero, this model must also fail Totality. It is
  consequently a model of DU, but not DTU: Totality is the additional DTU axiom.
