notes: >-
  Original work: construction-stage extraction and model adaptation/property
  audit. The CDF-area seed and conclosure construction are Goodsell's, and
  the stage already appears in the recorded total-extension proof. GPT-6
  now records this intermediate model separately, proves the inherited
  affine/reflection symmetries by kernel conjugation, and establishes its
  incompleteness using the completed Goodsell stable-law proposal. No new
  independent invention of conclosure or claim of literature novelty is
  made. The construction quantifies over all probability kernels; it is not
  a computable comparison algorithm. No comonotonic sum property is asserted:
  conclosure does not automatically inherit the exact area's comonotonic
  invariance. No independent checker or Lean verification is claimed.
  The 25 September 2026 addition in the write-up proves that the alternating
  St Petersburg fixed point and sure -1/2 are either indifferent or
  incomparable, and rules out convolution witnesses with lower tail o(1/t).
  It leaves this pair and both self-similarity principles undecided; success
  for one pair would not establish a universally quantified principle.
