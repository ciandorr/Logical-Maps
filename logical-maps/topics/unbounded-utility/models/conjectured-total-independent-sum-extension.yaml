description: 'Use real outcomes with identity utility. In the vector space of survival functions of finite
  signed measures of mass zero, let C be the CDF-area cone. Its weak and strict comparisons are preserved by
  forward convolution. Take Goodsell’s conclosure of C, expressed in cone language by declaring v positive
  whenever some convolution Tξv belongs to C; commutation ensures cone closure and full convolution cancellation,
  and forward strict preservation prevents collapse of old strict comparisons. A convolution-invariant cone
  D can be extended to orient any incomparable v: first adjoin all d+aTξv, then saturate. Convex mixtures of
  convolution kernels show that this intermediate cone has the same indifferent part as D and preserves strictness
  under forward convolution. Zorn’s lemma yields a total invariant cone extending C strictly. Pull its order
  back to random variables through survival differences. This proves Totality, CDF-Area Extension, Mixture
  Independence and Independent Sum Invariance; expectation and dominance follow from the area rule. The accompanying
  write-up proves every closure and orientation step. Known violations follow from the recorded St Petersburg/DU
  impossibility arguments.'
