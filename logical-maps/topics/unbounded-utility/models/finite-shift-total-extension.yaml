notes: >-
  Original work: model adaptation and separation following Goodsell's
  proposal. The conclosure method and total-extension strategy are
  Goodsell's; the canonical seed, bounded witness, finite-kernel argument
  and explicit preservation of the indifferent subspace are credited to
  GPT-6 (Codex). Misc. is the direct source of this new separating model;
  the manuscript supplies a method, not the new result. This is
  nonconstructive existence using Zorn's lemma. It also preserves addition
  of independent finite-valued summands; no claim is made for arbitrary
  independent summands or for positive affine invariance. The separate
  conjectured-dtu-shift-implies-transfer record keeps its statement and
  conjectured status, with refutation computed from this model. Exact
  checks support the bounded witness; they do not implement the total
  order or certify the universal extension proof. No independent checker,
  literature-priority claim or Lean verification is asserted.
