description: >-
  Use real outcomes with identity utility and all measurable real random
  variables. In the vector space V of survival profiles of finite signed
  measures with total mass zero, modulo almost-everywhere equality, let
  P be the cone of nonnegative profiles and N the subspace of compactly
  supported finite-step profiles with integral zero. Define X>=Y iff
  S_X-S_Y belongs to P+N. This orders gambles by stochastic dominance
  after allowing a finite-support zero-mean compensation. The cone is
  preserved by common translations, positive affine changes and reflected
  comparison reversal. Its indifferent part is exactly N. Finite gambles
  are compared by their ordinary expectations, giving Simple EU and the
  identity chart, while strict stochastic dominance remains strict.
  A finite-mixture cancellation argument shows that this is the least
  DU preorder on real utility laws: every DU preorder preserves all its
  weak and strict comparisons.
  For U uniform on [0,1], U and sure 1/2 are incomparable despite their
  equal finite means. Nevertheless U+epsilon>=1/2 for every epsilon>0:
  sufficiently fine lower finite quantizations have mean at least 1/2.
  Thus Continuity under Vanishing Shifts and L1 Continuity fail. Shift Transfer also fails
  explicitly: M_(1/2)(U+1,0) and M_(1/2)(U,1) have equal means but a
  non-step survival difference, so are incomparable. Coupling their
  branches with the same fair coin gives a simple difference taking
  values +1 and -1, also refuting Simple Relative Expectation.
