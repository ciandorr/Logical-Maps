notes: >-
  Original work: substantive elementary cone construction with direct axiom
  checks, a least-DU characterization, and explicit separating examples,
  motivated by the user's question.
  The construction and new proofs are credited to GPT-6, not to a paper
  merely because the paper also uses cones or supplies principle definitions.
  This describes work performed in the project and makes no literature-priority
  claim. DU holds, but DTU fails because Totality fails. Therefore this model
  settles the failure of DU plus Shift Invariance to imply Shift Transfer;
  this incomplete seed does not itself settle the DTU conjecture. Its
  separately recorded finite-shift-total-extension, added on 13 September
  2026, supplies that separation while retaining every weak and strict
  comparison of this seed. All comparisons
  refer to the full standing domain, and all listed failures have exact
  witnesses in the write-up. No independent checker or Lean verification is
  asserted; no numerical computation is used as a proof of a universal axiom.
