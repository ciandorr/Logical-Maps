notes: 'Original work: substantial model adaptation and separation. Goodsell supplies the area-order
  idea, folded-tail evaluations, alternating-game recursion and use of total cone extensions.
  Work here passes to folded profiles modulo zero-integral L1 profiles, inserts an infinitesimal
  lexicographic comparison, proves that the two cones remain compatible, and gives an explicit
  upper-section continuity counterexample. This establishes DTU + Folded Expectation (even with
  Relative Expectation, reflection, shift and CDF-Area Extension) does not imply L1 Continuity.
  It does not contradict the source equivalence under full affine symmetry: Scale Invariance
  fails in this model. This is work accounting, not a claim of literature priority. The executable
  diagnostic checks exact dyadic tails and finite lexicographic witnesses; it does not execute
  the nonconstructive extension or certify the quantified axioms.'
