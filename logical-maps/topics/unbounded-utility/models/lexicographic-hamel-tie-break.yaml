notes: |-
  Original countermodel. It shows that the premises of comonotonic-sum-totality-imply-rational-scale, even with Archimedean Outcomes, Stochastic Dominance and Simple EU, do not give Scale Invariance for real factors: iterated addition sees only rational multiples. Mixture Independence is the one DTU principle it fails, so it does not settle conjectured-dtu-comonotonic-imply-scale; the pair of models cdf-area-unit-threshold and this one locate Totality and Mixture Independence as the premises that the two halves of the affine claim need. The infinite-width part of the order is a Zorn completion and is not otherwise specified; only the listed principles are verified. No independent checker or Lean verification is claimed.
