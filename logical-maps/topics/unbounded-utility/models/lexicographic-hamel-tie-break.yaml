description: |-
  Real outcomes with identity utility. Widths $h=Q_X- Q_Y$ form the real vector space H of differences of nondecreasing functions on (0,1); let $H_{\mathrm{fin}}$ be the integrable ones and $H_{0}$ those of integral 0. Fix a $\mathbb{Q}$-linear $\psi :H_{0}\to \mathbb{R}$ (Hamel basis) vanishing on step functions with $\psi (h_{1})=1, \psi (\sqrt{2}h_{1})=- 1$ and $\psi (h_{2})=- 1$, where $h_{1}=u- 1/2$ is the width of the uniform $X_{1}$ on [−1/2, 1/2] against 0 and $h_{2}$ the width of its half-mixture with sure 0 against 0; these are $\mathbb{Q}$-independent modulo step functions by a slope count. On $H/H_{\mathrm{fin}}$ take, by Zorn's lemma, a maximal pointed $\mathbb{Q}$-cone K containing the classes of nonnegative widths; maximality makes it total. Rank $X \succeq Y$ iff the width has nonzero class in K, or is integrable with positive integral, or has integral 0 and $\psi \ge 0$. This is a total preorder: classes add in K, integrals add, ψ adds. Simple widths are step functions, so simple gambles are ranked by expectation; nonnegative widths are positive in every clause, strictly when nonzero; the width is unchanged by comonotonic sums and shifts, and every clause is invariant under rational scaling, since K is a $\mathbb{Q}$-cone and ψ is $\mathbb{Q}$-linear. But $X_{1}\succ 0$ while $\sqrt{2}X_{1}\not\succeq 0$, refuting Scale Invariance; the half-mixture refutes Mixture Independence; $X_{1}$ is symmetric with equal means and areas against 0, refuting the expectation rules, CDF-Area Extension, neutrality and reflection; $\sqrt{2}X_{1}+\epsilon \succeq 0$ for every $\epsilon >0$ refutes both continuity principles. Non-constructive, like the continuous-ultrafilter models. Rational Scale Invariance with Shift Invariance gives Rational and Integer Affine Preservation.
