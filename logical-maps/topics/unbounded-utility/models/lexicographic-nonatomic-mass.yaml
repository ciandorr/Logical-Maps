notes: >-
  Original countermodel to both two-premise questions on the standing full
  measurable domain. Their stable IDs and conjectured statuses remain;
  the engine computes refutation from this proved model when it matches
  the selected background. The model also satisfies Totality and
  Stochastic Equivalence, so merely adding those assumptions does not
  repair either arrow. On countably supported lotteries its second
  coordinate vanishes, leaving ordinary bounded EU. This distinguishes
  the full-domain questions from the Russell–Isaacs discrete-lottery
  theorem. Neither question assumes Rich Outcomes; the model violates
  that principle and is not a DU or DTU model. Exact checks support the
  witness and evidence integration, not the universal measure-theoretic
  proof. The completed classification records 23 satisfactions and 16
  violations. The write-up distinguishes substantive satisfactions from
  trivial or empty scope on [0,1], especially Vanishing Shift Continuity,
  whose antecedent requires every positive shift to be available. The
  underlying principles and their quantifiers are unchanged. No
  independent checker or Lean verification is claimed.
