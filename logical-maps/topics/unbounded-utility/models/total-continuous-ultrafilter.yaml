description: |-
  Take all real-valued random variables and a cobounded ultrafilter U. Define $X\succeq Y$ iff for every $\epsilon >0, \{t:E[c_t(X)]\ge E[c_t(Y)]- \epsilon \}\in U$. This is the continuous-hyperreal quotient ordering in the proof of Theorem 3. Its EU, shift, reflection, and failed scale claims are given in Appendix B; see the accompanying write-up. Consequently Expected Utility does not imply Positive Affine Invariance, even with DTU.
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, Appendix
  B, Lemma 6 and proof of Theorem 3, p. 691; Theorems 7, 8 and 10, pp. 693–695
- 'Claude (Fable 5.1), Logical Maps, 23 September 2026: failure of Comonotonic Sum Invariance (half-Cauchy common summand) in writeups/total-continuous-ultrafilter.md; diagnostic checks/comonotonic_witnesses.py.'
notes: |-
  No $L^{1}$ Continuity or Relative Expectation flag is inferred merely from the word continuous; these are distinct claims. Scale failure is source-attributed as above.
