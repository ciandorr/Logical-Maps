changes:
- date: '2026-09-23'
  by: Claude (Fable 5.1)
  summary: >-
    Comonotonic Sum Invariance shown to fail (write-up section “Failure of Comonotonic Sum Invariance”). A standard Cauchy C has v_C(t) = 0 = v_0(t) for every t, but with the common comonotonic summand Z = max(C,0) the clipped gap v_{0+Z}(t) − v_{C+Z}(t) = 2∫_{t/2}^{t} P(C>x)dx is positive for every t, so 0 + Z ≻ C + Z on the whole domain of truncation levels.
  violates:
  - comonotonic-sum-consistency
- date: '2026-09-24'
  by: Claude (Fable 5.1)
  summary: >-
    Rational Scale Invariance shown to fail with the same evidence as Scale Invariance: the source’s Theorem 10 (Decision theory unbound, pp. 693–695) compares μ with μ₂, the law of 2X, so the recorded scale failure is at the rational factor 2. Source-attributed, with the audit caveats of the scale flag; the factor was confirmed by the author in the Logical Maps session of 24 September 2026. The same doubling refutes Integer Affine Preservation: μ ≻ ν is not carried to 2μ ≽ 2ν.
  violates:
  - rational-scale-invariance
  - integer-affine-preservation
- date: '2026-09-24'
  by: Zachary Goodsell (argument); Claude (Fable 5.1) (verification and write-up)
  summary: >-
    Shift Invariance shown to fail (write-up section “Failure of Shift Invariance”). A standard Cauchy C has v_C(t) = 0 = v_0(t), so C ∼ 0, but clipping C + 1 to [−t, t] clips C to [−t−1, t−1] and loses the upper tail between t−1 and t+1: v_{C+1}(t) = 1 − ∫_{t−1}^{t+1} P(C>x)dx < 1 = v_1(t) for t ≥ 1, and v_{C+1}(t) < t = v_1(t) below, so 1 ≻ C + 1 for every ultrafilter. The deficit vanishes as t → ∞, which is why the continuous quotient keeps Shift Invariance. Since the model satisfies DTU, DTU does not imply Shift Invariance.
  violates:
  - shift-invariance
references:
- paper: decision-theory-unbound
