description: |-
  Take all real-valued random variables. Choose a cobounded ultrafilter U on positive truncation levels; define $X\succeq Y$ iff $\{t:E[c_t(X)]\ge E[c_t(Y)]\}\in U$. This is the exact hyperreal ordering of Theorem 1, not its continuous quotient. The accompanying write-up explains the satisfied axioms and EU counterexample; failure of Scale Invariance is the source’s Theorem 10.
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, Appendix
  B, Theorem 1, pp. 690–691; Theorems 3 and 10, pp. 691, 693–695
- 'Claude (Fable 5.1), Logical Maps, 23 September 2026: failure of Comonotonic Sum Invariance (half-Cauchy common summand) in writeups/total-exact-ultrafilter.md; diagnostic checks/comonotonic_witnesses.py.'
- 'Zachary Goodsell, Logical Maps session, 24 September 2026: observation that Shift Invariance fails in the exact ordering,
  since a symmetric prospect shifted by 1 stays strictly behind sure 1 at every truncation level; verification in
  writeups/total-exact-ultrafilter.md and checks/exact_shift_witness.py.'
notes: The scale failure is recorded from the source theorem; its printed analytic witness has apparent
  typographical issues itemized in extraction.md. This record is a literature extraction, not a separately
  audited reconstruction of that witness.
