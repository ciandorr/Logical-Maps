  B, Theorem 1, pp. 690–691; Theorems 3 and 10, pp. 691, 693–695
- 'Claude (Fable 5.1), Logical Maps, 23 September 2026: failure of Comonotonic Sum Invariance (half-Cauchy common summand) in writeups/total-exact-ultrafilter.md; diagnostic checks/comonotonic_witnesses.py.'
notes: The scale failure is recorded from the source theorem; its printed analytic witness has apparent
  typographical issues itemized in extraction.md. This record is a literature extraction, not a separately
  audited reconstruction of that witness.
