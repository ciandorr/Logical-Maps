id: archimedean-gambles
name: Archimedean Gambles
statement: For any gambles X ≻ Y ≻ Z, there is p ∈ (0,1) with Y ~ M_p(X,Z). Unlike Archimedean Outcomes,
  X,Y,Z may themselves be unbounded gambles.
