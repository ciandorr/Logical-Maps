id: cdf-area-extension
name: CDF-Area Extension
statement: The normalized utility chart is total and measurable. Write S_X(t)=P(u(X)>t), d=S_X−S_Y, A₊=∫max(d,0)dt
  and A₋=∫max(−d,0)dt over ℝ. Whenever at least one of A₊,A₋ is finite, X ≽ Y iff A₊≥A₋. If both are infinite,
  this axiom imposes no comparison.
formal: ''
category: extensions-of-eut
tags:
- background-risk
sources:
- Zachary Goodsell, Unbounded Utility and Background Risk, 5 June 2026, unpublished manuscript marked “do not
  cite” and erroneous; §3, pp. 7–8; §4, p. 8 (strictness-preserving extensions)
source_names:
- Unbounded Utility and Background Risk (unpublished)
notes: This names the requirement to extend the manuscript’s base preorder, preserving its strict comparisons.
  It is distinct from the exact CDF-area model, which leaves every both-infinite pair incomparable. Survival-CDF
  endpoint conventions do not change these Lebesgue areas. No subtraction ∞−∞ is used.
