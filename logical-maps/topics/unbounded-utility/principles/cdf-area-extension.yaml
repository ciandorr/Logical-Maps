id: cdf-area-extension
name: CDF-Area Extension
statement: |-
  The normalized utility chart is total and measurable. Write $S_X(t)=P(u(X)>t), d=S_X- S_Y, A_{+}=\int \max (d,0)dt$ and $A_{-}=\int \max (- d,0)dt$ over $\mathbb{R}$. Whenever at least one of $A_{+},A_{-}$ is finite, $X \succeq Y$ iff $A_{+}\ge A_{-}$. If both are infinite, this axiom imposes no comparison.
formal: ''
category: extensions-of-eut
tags:
- background-risk
sources:
- Zachary Goodsell, Unbounded Utility and Background Risk, 5 June 2026, unpublished manuscript marked “do not
  cite” and erroneous; §3, pp. 7–8; §4, p. 8 (strictness-preserving extensions)
source_names:
- Unbounded Utility and Background Risk (unpublished)
notes: |-
  This names the requirement to extend the manuscript’s base preorder, preserving its strict comparisons. It is distinct from the exact CDF-area model, which leaves every both-infinite pair incomparable. Survival-CDF endpoint conventions do not change these Lebesgue areas. No subtraction $\infty - \infty$ is used.
date: '2026-09-09'
