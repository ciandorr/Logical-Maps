id: countable-sure-thing
name: Countable Sure-Thing
statement: For every countable measurable partition (E_n) into events of positive probability, if X|E_n ≽ Y|E_n
  for every n, then X ≽ Y. If one conditional comparison is strict, X ≻ Y.
