id: integer-affine-preservation
name: Integer Affine Preservation
statement: |-
  For every positive integer $k$ and real $b$: if $X \succeq Y$ then $kX+b \succeq kY+b$, and if $X \succ Y$ then $kX+b \succ kY+b$.
formal: ''
tags:
