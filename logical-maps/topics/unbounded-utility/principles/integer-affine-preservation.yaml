notes: |-
  The preservation halves of Positive Affine Invariance, restricted to integer factors; no cancellation ($kX+b \succeq kY+b$ back to $X \succeq Y$) is asserted. Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes available. This is exactly what iterated comonotonic addition gives (comonotonic-sum-implies-integer-affine-preservation): the chain $kX \succeq (k-1)X+Y \succeq \dots \succeq kY$ needs Rich Outcomes and Stochastic Equivalence but neither Totality nor Mixture Independence. Fractional factors are Rational Affine Preservation. Recorded by Claude (Fable 5.1), 24 September 2026.
  With Reflection Anti-Invariance, Totality and Mixture Independence it gives Uniqueness of Negative Self-Similarity for integer ratios (totality-independence-integer-affine-reflection-imply-integer-self-similarity), hence Alternating St Petersburg = −1/2 and, with Relative Expectation, Pasadena = ln 2, without any real or rational scale invariance.
