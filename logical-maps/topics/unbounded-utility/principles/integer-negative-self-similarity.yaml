notes: |-
  Uniqueness of Negative Self-Similarity restricted to integer ratios a; the paper's Theorem 10 states the real-ratio principle. The recorded evaluations of the alternating St Petersburg game and of Pasadena use only the instance p = 1/2, a = 2, so this restriction carries them (integer-self-similarity-evaluates-alternating, integer-self-similarity-relative-evaluates-pasadena). It follows from Totality, Mixture Independence, Integer Affine Preservation and Reflection Anti-Invariance (totality-independence-integer-affine-reflection-imply-integer-self-similarity), so no real or rational scale invariance is needed for those evaluations. Recorded by Claude (Fable 5.1), 24 September 2026.
