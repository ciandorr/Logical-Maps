id: integer-negative-self-similarity
name: Uniqueness of Negative Self-Similarity (integer ratios)
statement: |-
  Fix $0<p<1$, a positive integer $a$, $b\in \mathbb{R}$ and Z. If $X \sim M_p(- aX+b,Z)$ and $Y \sim M_p(- aY+b,Z)$, then $X \sim Y$.
