id: pasadena-value
name: Pasadena = ln 2
statement: Every X with P(u(X)=−(−2)^n/n)=2^(−n), n≥1, is indifferent to sure utility ln 2.
formal: ''
tags:
- evaluation
sources:
- Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 11, pp. 32–33
notes: A comparison with a sure outcome, not an assertion that the ordinary expected utility exists.
date: '2026-09-08'
category: prospect-evaluations
source_names:
- Symmetries of Value
lean_def: UnboundedUtility.PasadenaValue
references:
- paper: symmetries-of-value
  role: formulation
  locator: Theorem 11, pp. 32–33
- paper: nover-hajek-2004
  role: background
  note: Introduces the Pasadena game. The ln(2) valuation recorded here is attributed to Goodsell’s Symmetries
    of value, Theorem 11.
