id: rational-affine-preservation
name: Rational Affine Preservation
statement: |-
  For every rational $a>0$ and real $b$: if $X \succeq Y$ then $aX+b \succeq aY+b$, and if $X \succ Y$ then $aX+b \succ aY+b$.
