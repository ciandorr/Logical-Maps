notes: |-
  The preservation halves of Positive Affine Invariance, restricted to rational factors; no cancellation is asserted. Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes available. Given Integer Affine Preservation, the extra content is the fractional factors $1/n$, and $X \succeq Y \Rightarrow X/n \succeq Y/n$ is the cancellation $nX' \succeq nY' \Rightarrow X' \succeq Y'$: it follows from Rational Scale Invariance with Shift Invariance, hence from Comonotonic Sum Invariance with Totality, fails in cdf-area-unit-threshold without Mixture Independence, and is open under DU (conjectured-du-comonotonic-imply-rational-affine-preservation). Recorded by Claude (Fable 5.1), 24 September 2026.
