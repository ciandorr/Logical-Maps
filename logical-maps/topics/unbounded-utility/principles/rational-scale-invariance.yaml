notes: |-
  Scale Invariance restricted to rational factors; the papers define the real-factor principle, not this restriction. Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes available. Since $a=m/n$, the principle is equivalent to invariance under every positive integer factor in both directions: $X \succeq Y$ iff $nX \succeq nY$. Iterated comonotonic addition gives the preservation half for integers; the cancellation half is where Totality enters (comonotonic-sum-totality-imply-rational-scale), and the passage from rational to real factors is open under DTU (conjectured-dtu-comonotonic-imply-scale) and fails without Mixture Independence (lexicographic-hamel-tie-break). Recorded by Claude (Fable 5.1), 24 September 2026.
  Every model recorded as failing Scale Invariance fails it at the factor 2 (Theorem 10 of Decision theory unbound, the geometric clipping reversal, the folded-tail cone’s reversal and the unit-threshold model), so each fails this principle too; lexicographic-hamel-tie-break is the model that separates the two.
