sources:
- Colyvan, M. (2008). Relative expectation theory. Journal of Philosophy, 105(1), 37–44. pp. 37–44. https://doi.org/10.5840/jphil200810519
- Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, p. 26
notes: This is a same-space random-variable principle. Stochastic Equivalence is retained separately when importing
  the paper’s arbitrary-coupling formulation about laws.
