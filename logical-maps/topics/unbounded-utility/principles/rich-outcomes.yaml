id: rich-outcomes
name: Rich Outcomes
statement: |-
  Every real number r occurs as a utility level of a sure outcome: for each $r \in \mathbb{R}$ there is an outcome $o_r$ with $u(o_r)=r$, with u defined by the normalized binary-mixture comparisons in the background. This does not assert that every outcome has a finite real level.
formal: |-
  $\forall r\in \mathbb{R} \exists o\in O_{\mathrm{fin}}: u(o)=r$
tags:
- outcomes
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.2,
  p. 673 (called Unbounded Utility)
- Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, pp. 22–23
notes: |-
  Stronger than merely having no upper bound. Kept separate from Archimedean Outcomes at the user’s request. No Rich Outcomes $\Rightarrow$ Archimedean Outcomes edge is asserted.
date: '2026-09-08'
category: basic-decision-theory
source_names:
- Decision Theory Unbound
- Symmetries of Value
lean_def: UnboundedUtility.RichOutcomes
