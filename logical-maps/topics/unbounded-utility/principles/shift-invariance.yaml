id: shift-invariance
name: Shift Invariance
statement: |-
  For every real $b, X \succeq Y$ iff $X+b \succeq Y+b$.
formal: ''
tags:
- symmetry
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.2,
  pp. 686–688
- Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24
notes: |-
  Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes available. The source’s full $\mathbb{R}$ setting is supplied by Rich Outcomes and Simple EU in theorem packages.
