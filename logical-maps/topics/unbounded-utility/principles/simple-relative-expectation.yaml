id: simple-relative-expectation
name: Simple Relative Expectation
statement: For real-utility variables X,Y on the same probability space, if u(X)−u(Y) takes finitely many values,
  X ≽ Y iff E[u(X)−u(Y)] ≥ 0. X and Y themselves need not be simple or integrable.
