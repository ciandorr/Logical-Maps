id: stochastic-dominance
name: Stochastic Dominance
statement: |-
  If $P(X>o) \ge P(Y>o)$ for every outcome threshold o, then $X \succeq Y$; if one threshold inequality is strict, $X \succ Y$. Thresholds use the sure-outcome order.
formal: ''
tags:
- dominance
- distribution
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2,
  p. 678
notes: Includes the weak clause, as in the random-variable statement of the 2024 paper. The 2026 distribution
  formulation writes only the strict clause because equality of laws has already been identified there.
date: '2026-09-08'
category: basic-decision-theory
