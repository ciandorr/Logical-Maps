id: stochastic-equivalence
name: Stochastic Equivalence
statement: If X and Y have the same probability law over outcomes, then X ~ Y. The variables remain distinct
  objects; indifference is an additional axiom.
formal: L(X)=L(Y) ⇒ X ~ Y
