id: sure-thing
name: Sure-Thing
statement: For an event E with 0<P(E)<1, if X|E ~ Y|E, then X ≽ Y iff X|Eᶜ ≽ Y|Eᶜ. Here X|E equals X on
  E and sure 0 elsewhere; it is not a conditional expectation.
