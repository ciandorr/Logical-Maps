proof: |-
  By Stochastic Equivalence replace Y by its comonotonic copy $Y^\dagger=Q_Y(U)$ on a uniform U with $X=Q_X(U)$; all comparisons below are unchanged. For an integer $k\ge 1$ put $W_j=jX+(k-j)Y^\dagger$ for $0\le j\le k$ (Rich Outcomes supplies these gambles). Then $W_{j+1}=X+Z_j$ and $W_j=Y^\dagger+Z_j$ with $Z_j=jX+(k-j-1)Y^\dagger$ comonotonic with both, so by Comonotonic Sum Invariance $W_{j+1}\succeq W_j$ iff $X\succeq Y$. Chaining, $X\succeq Y$ gives $kX\succeq kY$, and $X\succ Y$ gives $kX\succ kY$ (if $kY\succeq kX$, transitivity along the chain would give $W_0\succeq W_1$, contradicting $Y\not\succeq X$). Cancellation: if $kX\succeq kY$ but $X\not\succeq Y$, Totality gives $Y\succ X$, hence $kY\succ kX$, a contradiction. So $X\succeq Y$ iff $kX\succeq kY$ for every positive integer k. For $a=m/n$ apply this twice: $X\succeq Y$ iff $mX\succeq mY$ iff $n(aX)\succeq n(aY)$ iff $aX\succeq aY$. The write-up gives the details and shows that each premise is used.
