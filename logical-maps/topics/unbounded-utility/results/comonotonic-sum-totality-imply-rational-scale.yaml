notes: |-
  Original connecting proof. Stochastic Equivalence is needed because the doubling step adds A to both sides of A ≽ B, which requires B to be comonotonic with A; Rich Outcomes supplies the mixed sums jX + (k − j)Y; Totality is used only for cancellation (kX ≽ kY ⇒ X ≽ Y). Without Totality cancellation fails: the model cdf-area-unit-threshold satisfies the other three premises together with Simple EU and Stochastic Dominance and violates the conclusion. With the recorded comonotonic-sum-implies-shift and Rich Outcomes, the same package gives invariance under every map aX + b with rational a > 0. It does not give real factors: lexicographic-hamel-tie-break satisfies these premises, Archimedean Outcomes, Stochastic Dominance and Simple EU and violates Scale Invariance; the real-factor question under DTU is conjectured-dtu-comonotonic-imply-scale. No independent checker or Lean verification is claimed.
