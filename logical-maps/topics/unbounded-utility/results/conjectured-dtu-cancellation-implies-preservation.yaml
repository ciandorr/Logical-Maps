notes: >-
  The original seven-premise conjecture is proved without changing its
  statement; was_conjectured preserves its history. The geometric
  renewal law closes the earlier indifference gap. The existing proof
  with L1 Continuity remains valid but its extra premise is unnecessary.
  Under DTU, Cancellation, Preservation and Independent Sum Invariance
  are equivalent by this theorem and the existing converse deductions.
  Arbitrary independent noise is essential to the argument: the
  geometric auxiliary law generally has infinite support. No full-noise
  property is thereby established for the finite-shift total extension.
  Original connecting work under Misc.; no literature-priority claim,
  independent checker or Lean verification is asserted.
