proof: >-
  Totality plus Cancellation preserves strict comparisons by contraposition.
  Suppose X is indifferent to Y but X+Z strictly exceeds Y+Z. Let nu be the
  law of Z and let rho be the law of a sum of N independent copies of Z,
  where P(N=n)=2^(-n-1) for n>=0. This is an admissible real law and
  2 rho - nu*rho = delta_0. Put A=M_(2/3)(X,Y+Z) and
  B=M_(2/3)(Y,X+Z). Mixture Independence gives B strictly above A,
  hence B+W strictly above A+W for independent W of law rho.
  With alpha=law X, beta=law Y, and
  eta=(alpha*nu*rho+beta*nu*rho)/2, the renewal identity rewrites
  law(A+W)=alpha/3+2 eta/3 and law(B+W)=beta/3+2 eta/3.
  Mixture Independence and Stochastic Equivalence therefore make the
  sums indifferent, a contradiction. Ties are preserved, and strict
  preservation supplies the rest. The write-up checks the law
  realizations and all finite-mixture substitutions; no continuity,
  moment assumption or countable mixture independence is used.
