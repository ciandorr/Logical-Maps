notes: >-
  Original work: conjecture formulation and partial analysis, with a
  separately recorded countermodel added on 13 September 2026. The
  candidate asks whether DTU plus Shift
  Invariance alone implies Shift Transfer, equivalently under DTU Simple
  Relative Expectation. The recorded neutrality-shift-imply-shift-transfer
  proof settles the question after adding Symmetric Neutrality. The
  du-vanishing-shifts-imply-relative proof settles it after adding
  Continuity under Vanishing Shifts; under DU this is equivalent to L1
  Continuity. The independent du-l1-implies-relative proof also supplies
  the continuity route, without Totality or Shift Invariance. Consequently a
  separating model would have to fail both neutrality and L1 Continuity.
  The continuous clipping models already satisfy Relative Expectation;
  the new lexicographic folded-tail model fails continuity but still
  satisfies Relative Expectation and neutrality. Neither family supplies
  the required separation. The new finite-support-compensated-dominance
  model does separate DU plus Shift Invariance from Shift Transfer, but
  it violates Totality and therefore does not settle this DTU conjecture.
  Its explicit transfer and vanishing-shift continuity failures are proved
  in its write-up. Its finite-shift-total-extension now supplies Totality
  while strictly ordering the same transfer pair. The new proof checks
  finite-kernel saturation and preserves the indifferent subspace through
  the orientation and maximal-extension steps. The original implication,
  ID, empty proof and conjectured status remain unchanged: the viewer
  computes refutation from this separate proved model. Stronger backgrounds
  can still prove the conditional implication, and source filters can
  remove its refuting evidence. Conjectured records question history,
  not a claim that the current full evidence leaves it open.
