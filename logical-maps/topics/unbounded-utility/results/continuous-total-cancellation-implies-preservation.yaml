notes: >-
  Original work: connecting proof by a strict-order argument and a
  constant-shift L1 limit. This is not claimed as a new model or as a
  theorem already proved in the cited papers. Only the existing UPPER
  continuity clause is used. No integrability of X,Y,Z, mixture
  independence, or stochastic-equivalence substitution is required.
  Rich Outcomes ensures the arbitrarily small real shifts are available;
  arithmetic remains restricted to the finite real chart. Under DTU plus
  L1 Continuity, Cancellation, Preservation and full Independent Sum
  Invariance are therefore equivalent. Combining this with the existing
  Levy obstruction rules out Cancellation under DTU plus L1 Continuity
  and Symmetric Neutrality, without adding a redundant incompatibility
  record.
