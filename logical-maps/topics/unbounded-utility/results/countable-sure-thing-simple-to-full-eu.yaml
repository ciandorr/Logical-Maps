notes: >-
  Refuted on the standing full measurable domain by the proved
  lexicographic-nonatomic-mass model, supplied by GPT-6 (Codex) on
  13 September 2026. It satisfies both proposed premises, as well as
  Totality, Stochastic Equivalence, Stochastic Dominance, Mixture
  Independence and Sure-Thing, while violating both Expected Utility
  and Archimedean Gambles. Its outcome chart is [0,1], so Rich Outcomes
  fails; that principle is not a premise of this question. The
  Russell–Isaacs theorem concerns countably supported lotteries:
  its domain excludes the nonatomic witness used here. The original
  ID, premises, authorship and conjectured status are preserved.
  Refutation is computed from the separate proved model and selected
  background; under DU or DTU the premises instead conflict with the
  background. See the handwritten write-up for the witness and source
  comparison. No independent checking or Lean proof is claimed.
