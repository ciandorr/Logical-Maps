notes: >-
  Original work: moderate connecting proof and premise reduction. A short
  upward-quantization lemma derives bounded EU; the earlier conditional
  truncation argument is then adapted with finite quantization, mean
  correction and a bounded-event proof of strictness. This removes both
  assumed full Expected Utility and global Totality from the earlier
  DTU+L1 consequence. Finite-valued replacements suffice for the proof;
  no arbitrary outcome-space translation map is required. Under DU, the
  existing Relative-to-CDF and Relative-to-Simple-Relative-to-Shift-Transfer
  results give CDF-Area Extension and Shift Transfer as well. The five DU
  axioms remain explicit, including Stochastic Equivalence even though
  dominance implies it. No minimality, literature priority, independent
  certification or Lean verification is claimed.
