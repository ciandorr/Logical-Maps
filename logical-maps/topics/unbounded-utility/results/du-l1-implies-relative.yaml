proof: >-
  The existing finite-lottery representation argument derives Simple EU from
  Rich Outcomes, Archimedean Outcomes, Stochastic Dominance and Independence.
  For any bounded utility variable V, upward finite quantizations Q_n satisfy
  Q_n~E Q_n by Simple EU, Q_n>=V by dominance, and E Q_n>=E V. Thus
  Q_n>=E V and the sure E Q_n>=V. Their two upper-section L1 limits give
  V~E V. Now let D=X-Y be integrable with mean m>=0. On
  E_n={|X|<=n,|Y|<=n}, with p_n=P(E_n)>0, quantize X upward within 1/n
  to a finite-valued q_n and set c_n=(E[(q_n-Y)1_E_n]-m)/p_n. Define
  Z_n=q_n-c_n on E_n and Z_n=Y elsewhere. Its changed conditional branch
  has mean at least that of Y, by m/p_n; bounded EU, law invariance and
  Independence therefore give Z_n>=Y. At p_n=1 bounded EU gives this
  directly. Moreover E|Z_n-X|<=2E[|D|1_(E_n complement)]+2/n tends to zero,
  so upper L1 gives X>=Y. If m>0, replace Y on a sufficiently small
  positive-probability event where Y is bounded by a strictly better sure
  outcome. The resulting Y' strictly dominates Y and has
  0<E(Y'-Y)<m. The weak result gives X>=Y', hence X>Y. For m=0 apply
  the weak result in both directions; for m<0 interchange the variables.
  This proves the Relative Expectation biconditional without Totality,
  Shift Invariance, lower-section continuity or assumed full Expected Utility.
