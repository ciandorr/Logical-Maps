notes: 'Original work: direct consequence. Use the shifted first variable itself as the common gamble,
  avoiding a Rich Outcomes premise for a new sure outcome b; cancel two half-mixtures. This describes
  the work needed for this database entry, not a claim of novelty in the literature.'
