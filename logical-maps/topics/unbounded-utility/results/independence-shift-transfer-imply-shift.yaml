proof: Fix eligible X,Y,X+b,Y+b. Shift Transfer at p=1/2 with transfer parameter b/2 gives M_1/2(X+b,X)~M_1/2(X,X+b)
  and M_1/2(Y+b,X)~M_1/2(Y,X+b). Mixture Independence with common second argument X+b identifies X≽Y with
  the comparison between the latter two right-hand mixtures. Substitute the displayed indifferences and
  cancel the common second argument X by Independence. The resulting comparison is X+b≽Y+b. The equivalences
  work in both directions and require no exchange of mixture branches.
