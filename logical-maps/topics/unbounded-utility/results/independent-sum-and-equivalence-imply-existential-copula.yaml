proof: Choose the product copula once. For an eligible triple admitting that copula in both pairs, Z is
  separately independent of X and Y, but need not be independent of (X,Y). On the standing atomless space
  realize independent uniforms U,V, and utility coordinates X′=Q_X(U), Y′=Q_Y(U), Z′=Q_Z(V). Now Z′ is
  independent of (X′,Y′). The marginal laws and both pair laws agree with those of the original triple;
  consequently so do the two sum laws. Independent Sum Invariance gives the biconditional for the new
  triple. Stochastic Equivalence and transitivity transfer it to the original comparisons. This establishes
  SC(C) for the product copula.
