proof: |-
  Fix rational $a>0$ and real $b$, with the transformed outcomes available in
  the common utility-chart scope of the two principles. Positive Affine
  Invariance gives $X\succeq Y$ iff $aX+b\succeq aY+b$, so it gives weak
  preservation. If $X\succ Y$, then $X\succeq Y$ and not $Y\succeq X$.
  Applying the same biconditional also to the reversed pair gives
  $aX+b\succeq aY+b$ and not $aY+b\succeq aX+b$, hence
  $aX+b\succ aY+b$. Every positive rational factor is among the real factors
  quantified over by Positive Affine Invariance. No additional assumption is
  required.
