proof: Let H=M_1/2(X,−X). Its reflected law equals its own law, so H~−H. If H≻0, reflection gives −H≺0,
  contradiction; likewise if H≺0. Totality gives H~0. If X itself has symmetric law, Stochastic Equivalence
  gives −X~X and H~X, since the mixture then has X’s law. Thus X~0.
