proof: Archimedean Outcomes supplies a total chart, measurable by the background convention; Rich Outcomes
  supplies all intermediate utility levels. Dominance entails Stochastic Equivalence. Quantile couple
  A,B with the marginal laws of X,Y. Nested threshold events and Tonelli give E[(A−B)₊]=A₊ and E[(A−B)₋]=A₋,
  the two survival-difference areas. If both are finite, Relative Expectation compares A,B exactly by
  A₊−A₋, and equivalence transfers the result to X,Y. If A₊=∞ and A₋<∞, put D=A−B and Z_N=B+min(D₊,N)−D₋.
  Then Z_N≤A, E|Z_N−B|<∞, and E[Z_N−B] tends to +∞. For some N, Relative Expectation gives Z_N≻B; weak
  Dominance gives A≽Z_N, hence A≻B. Swap the variables for the other one-infinite case. These exhaust
  the cases required by CDF-Area Extension.
