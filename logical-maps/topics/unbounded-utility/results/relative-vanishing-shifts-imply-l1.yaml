notes: >-
  Original work: short positive-buffer argument. With Rich Outcomes and
  Relative Expectation, Continuity under Vanishing Shifts and L1 Continuity
  are equivalent, using the separately recorded reverse implication.
  The proof concerns actual coupled utility differences and assumes neither
