proof: >-
  Suppose E|u(X_n)−u(X)| tends to zero and X_n ≽ Y for every n. Fix ε>0.
  Rich Outcomes supplies X+ε in the real utility chart. For a sufficiently
  large n, the actual difference (X+ε)−X_n is integrable and has expectation
  at least ε−E|u(X_n)−u(X)|>0. Relative Expectation applied in both
  directions gives X+ε ≻ X_n, so transitivity gives X+ε ≽ Y. This holds
  for every ε>0. Continuity under Vanishing Shifts yields X ≽ Y, exactly
  the recorded upper-section L1 Continuity clause. Neither transporting
  a preference by a shift nor closing a lower section is required.
