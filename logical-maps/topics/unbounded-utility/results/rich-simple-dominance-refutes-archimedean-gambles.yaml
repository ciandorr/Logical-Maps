proof: Let S take utility 2ⁿ with probability 2⁻ⁿ for n≥1. Rich Outcomes and standing prospect richness supply
  S, its finite truncations T_N=min(S,2ᴺ), and the required mixtures. For N≥1, E[T_N]=N+1. By Simple EU, T_N
  is indifferent to the sure utility N+1. Stochastic Dominance gives S ≽ T_N, hence S ≻ c for every real c
  by choosing N+1>c. Thus S ≻ 1 ≻ 0. Fix any p∈(0,1) and choose N with p(N+1)>1. The mixture M_p(S,0) stochastically
  dominates the finite-valued mixture M_p(T_N,0), which Simple EU makes indifferent to the sure utility p(N+1)>1.
  Therefore M_p(S,0) ≻ 1 for every p∈(0,1). Archimedean Gambles would require one such mixture to be indifferent
  to 1, a contradiction. Only the standing preorder is used to compose these comparisons; no Totality or Mixture
  Independence is required.
