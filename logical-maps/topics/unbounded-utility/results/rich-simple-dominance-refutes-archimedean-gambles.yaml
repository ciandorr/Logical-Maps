notes: This is the existing Goodsell argument with its sufficient assumptions made explicit, not a new counterexample.
  The original source-attributed DTU result is retained unchanged. Stochastic Equivalence follows from this
  topic’s dominance axiom, but is not separately needed in the displayed proof. Relative to these assumptions,
  Archimedean Gambles is ruled out; adding it to the background yields False.
