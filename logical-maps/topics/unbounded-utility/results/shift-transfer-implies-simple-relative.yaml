proof: Write D=u(X)−u(Y), with finitely many values d_i of positive probabilities p_i, and let Y_i have
  the conditional law of Y given D=d_i. The law of M_1/2(X,0) is the finite mixture with weights p_i of
  M_1/2(Y_i+d_i,0). Shift Transfer gives M_1/2(Y_i+d_i,0)~M_1/2(Y_i,d_i). Mixture Independence propagates
  these indifferences through the finite mixture; Stochastic Equivalence licenses conditional-law realizations,
  regrouping and branch exchanges. The resulting law is M_1/2(Y,D), so M_1/2(X,0)~M_1/2(Y,D). Two mixture
  cancellations then give X≽Y iff D≽0, and Simple EU makes this equivalent to E[D]≥0. Rich Outcomes supplies
  the sure d_i and the simple gamble realizing D.
