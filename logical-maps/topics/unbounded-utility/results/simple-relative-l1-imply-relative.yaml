proof: For real-utility X,Y with D=u(X)−u(Y) integrable, choose simple q_n→D in L1 and put d_n=q_n+E[D]−E[q_n],
  so d_n is simple, has mean E[D], and tends to D in L1. Rich Outcomes supplies X_n with utility u(Y)+d_n.
  If E[D]≥0, Simple Relative Expectation gives X_n≽Y, and upper-section L1 Continuity gives X≽Y. To prove
  the converse when E[D]<0, put c=−E[D]/2>0. The already proved forward direction gives Y≽X+c, while Simple
  Relative Expectation gives X+c≻X. Transitivity yields Y≻X, ruling out X≽Y. No lower-section continuity,
  totality, law invariance or symmetry is used.
