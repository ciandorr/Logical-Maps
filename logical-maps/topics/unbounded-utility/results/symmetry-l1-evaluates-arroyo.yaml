proof: 'Theorem 8 evaluates the folded tail difference of A+1/2. Pair its positive and negative tails:
  the residual weights are 1/[2n(2n−1)]−1/[2n(2n+1)] at heights 2n+1/2, a positive integrable tail whose
  expectation is 1/2+ln 2. Folded Expectation gives A+1/2~1/2+ln 2. Shift Invariance gives A~ln 2.'
