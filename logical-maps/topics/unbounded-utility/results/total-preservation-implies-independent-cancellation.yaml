proof: >-
  Suppose Z is independent of (X,Y) and X+Z is weakly preferred to Y+Z.
  If X were not weakly preferred to Y, Totality would give Y strictly
  preferred to X. The strict clause of Independent Sum Preservation
  would then give Y+Z strictly preferred to X+Z, contradicting the
  assumed weak comparison. Hence X is weakly preferred to Y.
