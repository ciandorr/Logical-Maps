notes: >-
  Original work: elementary connecting deduction; no model construction
  or imported theorem proof is needed. Preservation in this project
  includes STRICT preservation. Under Totality, that extra clause makes
  preservation equivalent to full Independent Sum Invariance by the
  already recorded decomposition. Weak preservation alone would not
  justify this implication. No dominance, mixture independence,
  stochastic equivalence, continuity, or outcome richness is used.
