proof: If Z is independent of (X,Y), it is independent of X and independent of Y. Hence the joint CDFs
  of (X,Z) and (Y,Z) both factor through the product copula H(u,v)=uv. Instantiate Universal Copula Sum
  Consistency at that copula and apply it to the original triple.
