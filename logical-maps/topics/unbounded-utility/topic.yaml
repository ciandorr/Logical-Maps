title: 'Unbounded Utility'
framework: Gambles are measurable outcome-valued random variables on an atomless standard probability space.
  All such variables are available (Prospect Richness is standing). ≽ is reflexive and transitive, not assumed
  total or law-invariant. Outcomes are linearly ordered, with distinct reference outcomes 0 and 1, and sure-indifferent
  outcomes identified. A possibly partial real utility chart is defined by binary certainty comparisons; see
  background.md. Rich Outcomes supplies all real levels; Archimedean Outcomes rules out outcomes beyond the
  finite chart. M_p(X,Y) is randomized selection, never the pointwise sum pX+(1-p)Y.
background: []
background_presets:
- id: du
  name: DU
  category: basic-decision-theory
  default: true
  principles:
  - rich-outcomes
  - archimedean-outcomes
  - stochastic-equivalence
  - stochastic-dominance
  - independence
- id: dtu
  name: DTU
  category: basic-decision-theory
  principles:
  - rich-outcomes
  - archimedean-outcomes
  - totality
  - stochastic-equivalence
  - stochastic-dominance
  - independence
notation: X ≽ Y; X ≻ Y iff X ≽ Y and not Y ≽ X; X ~ Y iff both. L(X) is the law, X|E is X on E and sure 0 elsewhere.
  Numerical expressions use the normalized utility chart.
principle_categories:
- id: basic-decision-theory
  name: Basic decision theory
- id: invariance-principles
  name: Invariance principles
- id: extensions-of-eut
  name: Extensions of EUT
- id: calculation-methods
  name: Calculation methods
- id: prospect-evaluations
  name: Prospect evaluations
lean_lib: UnboundedUtility
lean:
  imports: [UnboundedUtility.Principles]
  namespace: UnboundedUtility
  definition_check: |-
    example {O : Type*} [MeasurableSpace O] [LinearOrder O] (P : Pref O) : Prop :=
      {def} P
  result:
    binder: "∀ {O : Type*} [MeasurableSpace O] [LinearOrder O] (P : Pref O) [P.Regular],"
    principle: "{def} P"
  model:
    binder: "∃ W : Witness,"
    principle: "{def} W.pref"
