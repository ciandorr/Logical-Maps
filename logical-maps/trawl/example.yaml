version: 1
source:
  repository: https://github.com/zwlgzwlg/Logical-Maps.git
  ref: main
# Draft topics are always skipped. Add further active topics explicitly.
topics: [classicism, unbounded-utility]
backgrounds: [all]  # or [base, c5, du, dtu]
live_api: false
limits:
  # Agents choose delegation with spawn_subagent; up to 32 HTTP calls run concurrently.
  # All agents share the budgets below. No worker-count setup is needed.
  requests_per_run: 5  # API-turn budget; saved workspaces resume on later runs
  max_output_tokens: 4096
  output_tokens_per_run: 20000  # generation across all turns/passes; input tokens cost extra
  passes_per_workspace: budget  # repeat after mathematical edits while budget permits; or a positive integer
  max_prompt_chars: 120000  # or model: use the API's full context, compact on an explicit context rejection
  trawls_per_question: 1  # fresh workspaces; resuming does not consume this limit
  related_records: 12
  central_questions: 20  # initial prompt size, or all; the full list is always available as a file/tool
  timeout_seconds: 120

discovery:
  protocol: offline
  provider: offline
  model: smoke-test
review:
  protocol: offline
  provider: offline
  model: smoke-test

# To use a compatible endpoint, replace a profile above with:
# discovery:
#   protocol: chat-completions
#   provider: your-provider-name
#   endpoint: https://your-provider.example/v1/chat/completions
#   api_key_env: TRAWL_API_KEY
#   model: exact-api-model-id
#   token_parameter: max_completion_tokens  # or max_tokens for compatible servers
#   parameters: {}  # e.g. reasoning_effort; only when supported by this model
#
# Or use the native Messages protocol:
# review:
#   protocol: anthropic-messages
#   provider: anthropic
#   endpoint: https://api.anthropic.com/v1/messages
#   api_key_env: ANTHROPIC_API_KEY
#   model: exact-api-model-id
#   parameters: {}
