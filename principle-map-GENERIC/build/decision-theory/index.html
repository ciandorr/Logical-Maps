<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preference axioms over lotteries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F4F5F7;
    --panel: #FFFFFF;
    --panel-2: #EEF0F3;
    --line: #D8DCE2;
    --line-strong: #B9BFC8;
    --ink: #1B2230;
    --ink-2: #4B5563;
    --ink-3: #7C8594;
    --accent: #2B3F6B;
    --human: #2E6F95;
    --assisted: #6E5BA6;
    --ai: #C4762B;
    --derived: #8A9098;
    --indep: #B8394B;
    --open: #E3E6EA;
    --open-ink: #8A9098;
    --conj: #C9A227;
    --node-fill: #FFFFFF;
    --node-stroke: #8E96A3;
    --junction: #4B5563;
    --hl: #FFF3C4;
    --focus: #2B3F6B;
    --shadow: 0 1px 2px rgba(27,34,48,.08), 0 6px 18px rgba(27,34,48,.06);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151920; --panel: #1D2230; --panel-2: #242A38; --line: #313849; --line-strong: #454D60;
      --ink: #E6E9EF; --ink-2: #B4BAC6; --ink-3: #7F8798; --accent: #9DB4E6;
      --human: #5FA3CC; --assisted: #A594DB; --ai: #E09A55; --derived: #7B8393; --indep: #E06A7A;
      --open: #2A3140; --open-ink: #6B7383; --conj: #D9B64A;
      --node-fill: #232938; --node-stroke: #5A6274; --junction: #B4BAC6; --hl: #3B3A22; --focus: #9DB4E6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151920; --panel: #1D2230; --panel-2: #242A38; --line: #313849; --line-strong: #454D60;
    --ink: #E6E9EF; --ink-2: #B4BAC6; --ink-3: #7F8798; --accent: #9DB4E6;
    --human: #5FA3CC; --assisted: #A594DB; --ai: #E09A55; --derived: #7B8393; --indep: #E06A7A;
    --open: #2A3140; --open-ink: #6B7383; --conj: #D9B64A;
    --node-fill: #232938; --node-stroke: #5A6274; --junction: #B4BAC6; --hl: #3B3A22; --focus: #9DB4E6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header.top { display: flex; align-items: baseline; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header.top h1 { font: 600 22px/1.2 var(--serif); margin: 0; text-wrap: balance; }
  header.top .sub { color: var(--ink-3); font-size: 12.5px; max-width: 80ch; }
  .stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chip b { color: var(--ink); font-weight: 600; }

  .body { display: grid; grid-template-columns: 1fr; min-height: 0; }
  @media (max-width: 1100px) { .detail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
  aside.controls { min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); display: grid; grid-template-rows: minmax(0, 1fr) 9px var(--background-height, clamp(145px, 27vh, 230px)); }
  .controls-scroll { min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; scrollbar-gutter: stable; overflow-anchor: none; }
  .background-dock { min-height: 0; border-top: 1px solid var(--line-strong); padding: 12px 16px; display: flex; flex-direction: column; gap: 7px; background: var(--panel-2); }
  .background-dock h2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .background-dock h2 .lnk { margin-left: auto; }
  .background-hint, .background-status { font-size: 11px; color: var(--ink-3); margin: 0; }
  #background-list { overflow: auto; min-height: 0; flex: 1; scrollbar-gutter: stable; overflow-anchor: none; }
  .background-row, .pr-row { display: flex; align-items: flex-start; gap: 6px; }
  .background-row { font-size: 12px; padding: 3px 0; }
  .background-row .lnk, .pr-row .principle-name { flex: 1; min-width: 0; }
  .pr-row .principle-name { color: var(--ink); text-align: left; }
  .pr-row input[type=checkbox] { flex: none; margin: 3px 2px 0 0; cursor: pointer; }
  .background-row.is-removed, .pr-row.in-background { visibility: hidden; pointer-events: none; }
  .background-row.is-collapsed, .pr-row.is-collapsed { display: none; }
  .background-move { flex: none; min-width: 23px; padding: 0 3px; border: 1px solid var(--line); border-radius: 4px; color: var(--accent); background: var(--panel); cursor: pointer; }
  .background-move:hover { border-color: var(--accent); }
  .background-fixed { color: var(--ink-3); font-size: 10px; }
  aside.controls h2 .lnk { font: inherit; text-transform: none; letter-spacing: 0; margin-left: 6px; }
  aside.controls h2, .detail h2 { font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .ctl { display: flex; flex-direction: column; gap: 6px; }
  .ctl label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .ctl input[type=checkbox] { accent-color: var(--accent); }
  #pr-filters { gap: 16px; }
  .pr-category { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .pr-category:first-child { border-top: 0; padding-top: 0; }
  .pr-category h3 { font: 600 13px/1.35 var(--sans); color: var(--ink); margin: 0 0 5px; }
  .pr-category-actions { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 9px; font-size: 11px; }
  .pr-category-actions .lnk:disabled { opacity: .45; cursor: default; }
  .pr-category-count { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }
  .pr-category .principle-name { font-size: 13px; }
  .pr-category input { flex: none; margin-top: 3px; }
  .sw { width: 22px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
  .sw.dotted { border-top-style: dotted; }
  .sw.dashed { border-top-style: dashed; }
  .sw.human { border-color: var(--human); } .sw.assisted { border-color: var(--assisted); } .sw.ai { border-color: var(--ai); }
  .sw.derived { border-color: var(--derived); } .sw.conj { border-color: var(--conj); }
  .search { width: 260px; margin: 0 0 12px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); }
  .legend-note { color: var(--ink-3); font-size: 12px; }
  .framework { font-size: 12.5px; color: var(--ink-2); }
  .framework p { margin: 0 0 6px; }
  .btn { padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); cursor: pointer; }
  .btn:hover { background: var(--panel-2); }
  .btn.small { padding: 3px 8px; font-size: 12px; }

  main { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
  .tabs { display: flex; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { padding: 8px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: none; cursor: pointer; color: var(--ink-2); }
  .tab[aria-selected="true"] { background: var(--bg); border-color: var(--line); color: var(--ink); margin-bottom: -1px; }
  .tab .n { color: var(--ink-3); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .pane { display: none; min-height: 0; overflow: auto; }
  .pane[data-active="true"] { display: block; }
  #pane-graph[data-active="true"] { display: grid; grid-template-columns: var(--sidebar-width, 250px) 9px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  .pane-divider { position: relative; background: var(--panel-2); touch-action: none; user-select: none; z-index: 2; }
  .pane-divider::after { content: ''; position: absolute; border-radius: 3px; background: var(--line-strong); }
  .pane-divider[aria-orientation="vertical"] { cursor: col-resize; }
  .pane-divider[aria-orientation="vertical"]::after { width: 3px; height: 36px; top: calc(50% - 18px); left: 3px; }
  .pane-divider[aria-orientation="horizontal"] { cursor: row-resize; }
  .pane-divider[aria-orientation="horizontal"]::after { height: 3px; width: 36px; left: calc(50% - 18px); top: 3px; }
  .pane-divider:hover, .pane-divider:focus-visible, .pane-divider.dragging { background: var(--hl); }
  .pane-divider:focus-visible { outline-offset: -2px; }
  .pane-divider:hover::after, .pane-divider:focus-visible::after, .pane-divider.dragging::after { background: var(--accent); }
  body.resizing-panes, body.resizing-panes * { cursor: var(--resize-cursor) !important; user-select: none !important; }
  .graph-area { position: relative; overflow: hidden; min-width: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #graph:active { cursor: grabbing; }
  .graph-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
  .graph-warning { position: absolute; inset: 24px; overflow: auto; padding: 24px; border: 2px solid #b42318; border-radius: 8px; background: #fff1f0; color: #b42318; }
  .graph-warning h2 { margin: 0 0 12px; font-size: 21px; }
  .graph-warning .lnk { color: #912018; text-decoration: underline; }
  .graph-warning li { margin: 10px 0; }

  /* SVG */
  .edge { fill: none; stroke-width: 1.6; }
  .edge.source { stroke: var(--source-color); }
  .badge.source { background: var(--source-color); }
  .source-group { border: 0; margin: 0; padding: 0; min-width: 0; }
  .source-group legend { font-size: 11px; color: var(--ink-3); margin-bottom: 5px; }
  .source-group label { font-size: 12px; margin-bottom: 6px; }
  .model-category { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .model-category h3 { font-size: 13px; margin: 0 0 8px; }
  .edge.human { stroke: var(--human); } .edge.assisted { stroke: var(--assisted); } .edge.ai { stroke: var(--ai); }
  .edge.derived { stroke: var(--derived); stroke-dasharray: 2 4; stroke-width: 1.3; }
  .edge.conjectured { stroke-dasharray: 7 5; }
  .edge.lean { stroke-width: 3; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .edge-g.dim .edge { opacity: .18; }
  .edge-g.hot .edge { stroke-width: 3; }
  .node { cursor: pointer; }
  .node rect { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.2; }
  .node.dim { opacity: .3; }
  .node.hot rect, .node.selected rect { stroke: var(--accent); stroke-width: 2.2; }
  .node.selected rect { fill: var(--hl); }
  .node.from-background rect { fill: var(--hl); stroke: var(--accent); }
  .node text { font: 500 12.5px var(--sans); fill: var(--ink); pointer-events: none; }
  .node text[data-principle] { pointer-events: auto; cursor: pointer; }
  .node text.equiv { font-size: 10.5px; fill: var(--ink-3); }
  .node.iso rect { stroke-dasharray: 4 3; }
  .junction { cursor: pointer; }
  .junction circle { fill: var(--panel); stroke: var(--junction); stroke-width: 1.4; }
  .junction.source circle { stroke: var(--source-color); }
  .junction.human circle { stroke: var(--human); } .junction.assisted circle { stroke: var(--assisted); } .junction.ai circle { stroke: var(--ai); }
  .junction text { font: 600 10px var(--sans); fill: var(--ink-2); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .junction.dim { opacity: .3; }
  .layer-label { font: 400 10px var(--mono); fill: var(--ink-3); }

  /* matrix */
  .matrix-wrap { padding: 16px 20px; }
  table.matrix { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
  table.matrix th { font-weight: 500; color: var(--ink-2); text-align: left; padding: 2px 6px; white-space: nowrap; }
  table.matrix th.col { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; vertical-align: bottom; height: 215px; padding: 6px 2px; }
  table.matrix td { width: 26px; height: 26px; border-radius: 3px; cursor: pointer; text-align: center; font: 500 10px var(--mono); }
  td.c-implies { background: var(--human); color: #fff; }
  td.c-implies.prov-ai { background: var(--ai); } td.c-implies.prov-assisted { background: var(--assisted); }
  td.c-derived { background: color-mix(in srgb, var(--human) 45%, var(--panel)); }
  td.c-independent { background: var(--indep); color: #fff; }
  td.c-independent.derived { background: color-mix(in srgb, var(--indep) 45%, var(--panel)); }
  td.c-open { background: var(--open); color: var(--open-ink); }
  td.c-conj { background: repeating-linear-gradient(45deg, var(--open) 0 4px, color-mix(in srgb, var(--conj) 50%, var(--panel)) 4px 8px); }
  td.c-self { background: transparent; cursor: default; }
  td.hot { outline: 2px solid var(--accent); }
  .matrix-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 0; font-size: 12px; color: var(--ink-2); }
  .matrix-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .matrix-legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .matrix-wrap p.hint { color: var(--ink-3); font-size: 12.5px; margin: 0 0 12px; max-width: 65ch; }

  /* lists */
  .list { padding: 16px 20px; }
  table.results { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.results th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.results td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.results tr { cursor: pointer; }
  table.results tr:hover td { background: var(--panel-2); }
  table.results tr.filtered td { opacity: .4; }
  .stmt { font-family: var(--serif); font-size: 14px; }
  .open-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .open-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; font-family: var(--serif); }
  .open-item:hover { border-color: var(--accent); }
  .list h3 { font: 600 16px var(--serif); margin: 18px 0 8px; }
  .list h3:first-child { margin-top: 0; }
  .list p.hint { color: var(--ink-3); font-size: 12.5px; max-width: 65ch; margin: 0 0 12px; }

  /* badges */
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font: 500 11px var(--sans); letter-spacing: .02em; color: #fff; white-space: nowrap; }
  .badge.source { white-space: normal; }
  .badge.human { background: var(--human); } .badge.assisted { background: var(--assisted); } .badge.ai { background: var(--ai); }
  .badge.lean { background: transparent; color: var(--ink-2); border: 1px solid var(--line-strong); }
  .badge.lean.verified { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .badge.conj { background: var(--conj); color: #1B2230; }
  .badge.kind { background: var(--panel-2); color: var(--ink-2); }
  .badge.indep { background: var(--indep); }

  /* detail */
  .detail { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px 18px; }
  .detail .empty { color: var(--ink-3); font-size: 13px; }
  .detail h2.title { font: 600 18px/1.25 var(--serif); letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0 0 4px; text-wrap: balance; }
  .detail .id { font: 12px var(--mono); color: var(--ink-3); margin-bottom: 10px; }
  .detail .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .detail .statement { font: 15px/1.5 var(--serif); margin: 0 0 12px; }
  .detail .formal { font: 12px var(--mono); background: var(--panel-2); padding: 6px 8px; border-radius: 4px; overflow-x: auto; margin: 0 0 12px; }
  .detail .proof { font: 13px/1.5 var(--serif); background: var(--panel-2); padding: 10px 12px; border-radius: 6px; margin: 0 0 12px; }
  .detail dl { margin: 0 0 12px; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; }
  .detail dt { color: var(--ink-3); }
  .detail dd { margin: 0; }
  .detail ul.rel { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .detail ul.rel li { display: flex; gap: 6px; align-items: baseline; }
  .detail ul.rel button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
  .detail ul.rel button:hover { text-decoration: underline; }
  .detail .via { font: 11px var(--mono); color: var(--ink-3); }
  .detail .src { font-size: 12.5px; color: var(--ink-2); padding-left: 16px; margin: 0 0 12px; }
  .detail .file { font: 11px var(--mono); color: var(--ink-3); }
  .rel-head { font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 4px; }

  @media (prefers-reduced-motion: no-preference) { .node rect, .edge { transition: opacity .15s, stroke-width .15s; } }

  /* additions */
  .pkg-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; background: var(--panel); font-size: 13px; }
  .pill.on { background: var(--hl); border-color: var(--accent); }
  .pill input { margin: 0; accent-color: var(--accent); }
  .pkg-head { font: 600 16px var(--serif); margin: 4px 0 10px; }
  .note { font-size: 12.5px; color: var(--ink-2); }
  .warn { color: var(--indep); font-size: 12.5px; }
  .mono { font: 11px var(--mono); color: var(--ink-3); }
  .dim { color: var(--ink-3); font-size: 11px; }
  .lnk { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  .lnk:hover { text-decoration: underline; }
  .list h3 .n, .list h3 span.n { color: var(--ink-3); font: 400 13px var(--sans); }
  table.matrix tr.filtered td, table.matrix tr.filtered th { opacity: .4; }
  table.matrix th button.lnk { color: var(--ink); }
  .list ul.rel { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .list ul.rel li { display: flex; gap: 8px; align-items: baseline; }
  .list ul.rel button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  .list ul.rel button:hover { text-decoration: underline; }
  .list .via { font: 11px var(--mono); color: var(--ink-3); }
  .list .via button { color: var(--ink-3); font: inherit; }
  .list .empty { color: var(--ink-3); }

  /* explorer */
  .ex { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr); gap: 28px; align-items: start; }
  .ex-head { font: 500 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
  .ex-head .n { font: 400 12px var(--mono); }
  .ex-list { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; }
  .ex-p { display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 5px; }
  .ex-p.in { background: color-mix(in srgb, var(--human) 14%, transparent); }
  .ex-p.out { background: color-mix(in srgb, var(--indep) 14%, transparent); }
  .ex-p.fin, .ex-p.fout { color: var(--ink-2); }
  .ex-p .lnk { color: var(--ink); }
  .ex-p.model-in { background: color-mix(in srgb, var(--human) 14%, transparent); }
  .ex-p.model-out { background: color-mix(in srgb, var(--indep) 14%, transparent); }
  .ex-p > .lnk { flex: 1; text-align: left; }
  .verdict { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; color: inherit; cursor: pointer; }
  .pop-sources { font-size: 12px; margin: 9px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: var(--panel); width: 26px; height: 22px; cursor: pointer; color: var(--ink-3); font-size: 12px; padding: 0; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.on { background: var(--ink); color: var(--panel); }
  .seg button.auto { color: var(--ink); background: var(--panel-2); }
  .ex-m { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  .ex-m.sel { background: var(--hl); }
  .ex-m .lnk { color: var(--ink); font: 500 13.5px var(--sans); }
  .ex-m .ex-sum { margin-left: auto; white-space: nowrap; }
  .ex .empty { color: var(--ink-3); padding: 4px 8px; }
  .models-background-dock { height: 230px; min-height: 140px; max-height: 65vh; resize: vertical; overflow: auto; border: 1px solid var(--line-strong); border-radius: 6px; margin-bottom: 22px; }
  .models-background-dock #models-background-list { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; overflow-anchor: none; }
  .models-background-dock h2 { margin: 0; font-size: 13px; }
  .model-bg-placeholder { visibility: hidden; pointer-events: none; }

  /* page */
  .page { padding: 20px 28px 40px; max-width: 78ch; }
  .page h1 { font: 600 24px/1.25 var(--serif); margin: 12px 0 8px; text-wrap: balance; }
  .page h2 { font: 500 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 8px; }
  .page .prose { font: 15px/1.55 var(--serif); }
  .page .prose.statement { font-size: 16px; }
  .page .plist { list-style: none; padding: 0; margin: 0; font: 15px/1.55 var(--serif); display: flex; flex-direction: column; gap: 6px; }
  .page .badges { display: flex; gap: 6px; margin: 0 0 10px; }
  .page dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; margin: 0; }
  .page dt { color: var(--ink-3); } .page dd { margin: 0; }
  .page .src { font-size: 13px; color: var(--ink-2); padding-left: 18px; }
  .page .file { margin-top: 24px; font: 11px var(--mono); color: var(--ink-3); }
  .page .formal { font: 12.5px var(--mono); background: var(--panel-2); padding: 6px 8px; border-radius: 4px; margin-top: 8px; overflow-x: auto; }
  .page .id { font: 12px var(--mono); color: var(--ink-3); margin-bottom: 8px; }
  .page table.results tr { cursor: default; } .page table.results tr[data-result], .page table.results tr[data-model] { cursor: pointer; }
  .nowrap { white-space: nowrap; }
  .detail .goto { margin: 0 0 12px; }

  .links { font-size: 12.5px; margin: 0 0 10px; } .links a { color: var(--accent); }
  .goto-row { display: flex; gap: 12px; align-items: center; margin: 0 0 12px; } .goto-row .goto, .goto-row .links { margin: 0; }
  .dl { display: flex; gap: 10px; font-size: 12.5px; align-self: center; } .dl a { color: var(--ink-3); }

  .pop { position: fixed; z-index: 20; max-width: 380px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px; }
  .pop .pop-t { font: 600 15px/1.3 var(--serif); margin-bottom: 4px; }
  .pop .pop-t + .pop-t { margin-top: 10px; }
  .pop .pop-s { font: 13.5px/1.45 var(--serif); }
  .pop .formal { font: 12px var(--mono); background: var(--panel-2); padding: 5px 7px; border-radius: 4px; margin-top: 6px; overflow-x: auto; }
  .pop .pop-l { font-size: 12px; color: var(--ink-2); margin-top: 6px; } .pop code { font: 12px var(--mono); }
  .pop .badges { display: flex; gap: 6px; margin: 6px 0; } .pop .links { margin: 4px 0 0; }

  .ex-p.bad { background: color-mix(in srgb, var(--indep) 32%, transparent); outline: 1.5px solid var(--indep); }
  .ex-bad { border: 1px solid var(--indep); color: var(--indep); border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; font-size: 13px; }
  .ex-bad .lnk { color: var(--indep); text-decoration: underline; }

  .prose-page { font: 15px/1.55 var(--serif); } .prose-page h2 { margin-top: 20px; } .prose-page p { margin: 0 0 10px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="dl" id="downloads"></div>
  </header>
  <div class="body">
    <main>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="background" aria-selected="false">Background</button>
        <button class="tab" role="tab" data-tab="graph" aria-selected="true">Graph</button>
        <button class="tab" role="tab" data-tab="models" aria-selected="false">Models <span class="n" id="n-models"></span></button>
        <button class="tab" role="tab" data-tab="open" aria-selected="false">Conjectures <span class="n" id="n-open"></span></button>
        <button class="tab" role="tab" data-tab="results" aria-selected="false">Changes <span class="n" id="n-results"></span></button>
        <button class="tab" role="tab" data-tab="contribute" aria-selected="false" hidden>Contribute</button>
      </div>
      <section class="pane" id="pane-graph" data-active="true">
    <aside class="controls" id="graph-sidebar">
      <div class="controls-scroll" id="principle-controls">
      <div>
        <h2>Sources</h2>
        <div class="ctl" id="source-filters"></div>
        <div class="ctl">
          <label><input type="checkbox" id="lean-only"><span class="sw" style="border-color:var(--ink)"></span>Lean-verified only</label>
        </div>
      </div>
      <div>
        <h2>Graph</h2>
        <div class="ctl">
          <label><input type="checkbox" id="show-derived"><span class="sw derived dotted"></span>Derived implications</label>
          <label><input type="checkbox" id="show-conj"><span class="sw conj dashed"></span>Conjectures</label>
          <label><input type="checkbox" id="show-iso" checked><span class="sw" style="border-style:dashed;border-color:var(--node-stroke)"></span>Isolated principles</label>
        </div>
      </div>
      <div>
        <h2>Principles <button class="lnk dim" id="pr-all">select all</button> <button class="lnk dim" id="pr-none">unselect all</button></h2>
        <div class="ctl" id="pr-filters"></div>
      </div>
      </div>
      <div class="pane-divider" id="background-divider" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize background pane" aria-controls="background-dock principle-controls" title="Drag to resize background · Arrow keys to adjust · Double-click to reset"></div>
      <section class="background-dock" id="background-dock" aria-labelledby="background-heading">
        <h2 id="background-heading">Background <span id="background-count"></span><button class="lnk" id="background-reset">reset</button></h2>
        <p class="background-hint">↓ assume a principle · ↑ return it to the list</p>
        <div id="background-list" class="ctl"></div>
        <p id="background-status" class="background-status" role="status" aria-live="polite"></p>
      </section>
    </aside>
        <div class="pane-divider" id="sidebar-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize left sidebar" aria-controls="graph-sidebar" title="Drag to resize sidebar · Arrow keys to adjust · Double-click to reset"></div>
        <div class="graph-area">
          <svg id="graph" role="img" aria-label="Implication graph"></svg>
          <div id="graph-warning" class="graph-warning" role="alert" hidden></div>
          <div class="graph-tools"><button class="btn small" id="fit">Fit</button></div>
        </div>
      </section>
      <section class="pane" id="pane-models"><div class="list" id="models"></div></section>
      <section class="pane" id="pane-results"><div class="list"><input class="search" id="search" type="search" placeholder="Filter" aria-label="Filter changes"><div id="results"></div></div></section>
      <section class="pane" id="pane-open"><div class="list" id="open"></div></section>
      <section class="pane" id="pane-page"><div class="page" id="page"></div></section>
      <section class="pane" id="pane-background"><div class="page prose-page" id="background"></div></section>
      <section class="pane" id="pane-contribute"><div class="page prose-page" id="contribute"></div></section>
    </main>
  </div>
</div>
<div id="pop" class="pop" hidden></div>

<script>
const DATA = {"topic": {"id": "decision-theory", "title": "Preference axioms over lotteries", "description": "", "framework": "≽ a reflexive binary relation on Δ(X), X finite with |X| ≥ 3; ≻, ~ its asymmetric and symmetric parts.\n", "background": [], "notation": ""}, "principles": [{"id": "acyclicity", "name": "Acyclicity", "statement": "There is no finite cycle of strict preferences p₁ ≻ p₂ ≻ … ≻ pₙ ≻ p₁.\n", "formal": "∀n ∀p₁…pₙ. ¬(p₁ ≻ p₂ ∧ … ∧ pₙ ≻ p₁)", "aliases": [], "tags": ["ordering"], "sources": ["Sen (1970), Collective Choice and Social Welfare, ch. 1*"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/acyclicity.yaml"}, {"id": "archimedean", "name": "Archimedean", "statement": "For all p, q, r ∈ Δ(X): if p ≻ q ≻ r then there are α, β ∈ (0,1) with αp + (1−α)r ≻ q and q ≻ βp + (1−β)r.\n", "formal": "∀p q r. p ≻ q ≻ r → ∃α β∈(0,1). αp+(1−α)r ≻ q ∧ q ≻ βp+(1−β)r", "aliases": ["Jensen continuity", "Weak continuity"], "tags": ["axiom", "topological"], "sources": ["Jensen (1967), An introduction to Bernoullian utility theory I, Swedish Journal of Economics 69"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/archimedean.yaml"}, {"id": "betweenness", "name": "Betweenness", "statement": "For all p, q ∈ Δ(X) and λ ∈ (0,1): if p ≻ q then p ≻ λp + (1−λ)q ≻ q, and if p ~ q then p ~ λp + (1−λ)q.\n", "formal": "∀p q, ∀λ∈(0,1). (p ≻ q → p ≻ λp+(1−λ)q ≻ q) ∧ (p ~ q → p ~ λp+(1−λ)q)", "aliases": ["Mixture betweenness"], "tags": ["axiom", "mixture"], "sources": ["Chew (1983), A generalization of the quasilinear mean…, Econometrica 51", "Dekel (1986), An axiomatic characterization of preferences under uncertainty, JET 40"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/betweenness.yaml"}, {"id": "closed-graph-continuity", "name": "Closed-graph continuity", "statement": "The set {(p, q) ∈ Δ(X) × Δ(X) : p ≽ q} is closed in the product topology.\n", "formal": "IsClosed {(p,q) | p ≽ q}", "aliases": ["Continuity (DMO)", "Topological continuity"], "tags": ["axiom", "topological"], "sources": ["Dubra, Maccheroni & Ok (2004), JET 115, Axiom C"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/closed-graph-continuity.yaml"}, {"id": "completeness", "name": "Completeness", "statement": "For all p, q ∈ Δ(X): p ≽ q or q ≽ p.\n", "formal": "∀p q. p ≽ q ∨ q ≽ p", "aliases": ["Connectedness", "Totality"], "tags": ["ordering"], "sources": ["von Neumann & Morgenstern (1944), Theory of Games and Economic Behavior, §3.5"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/completeness.yaml"}, {"id": "continuity", "name": "Mixture continuity", "statement": "For all p, q, r ∈ Δ(X) the sets {λ ∈ [0,1] : λp + (1−λ)q ≽ r} and {λ ∈ [0,1] : r ≽ λp + (1−λ)q} are closed.\n", "formal": "∀p q r. closed {λ | λp+(1−λ)q ≽ r} ∧ closed {λ | r ≽ λp+(1−λ)q}", "aliases": ["Herstein–Milnor continuity", "Closedness"], "tags": ["axiom", "topological"], "sources": ["Herstein & Milnor (1953), Econometrica 21, Axiom 2"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/continuity.yaml"}, {"id": "eu-representation", "name": "Expected-utility representation", "statement": "There is a function u : X → ℝ such that for all p, q ∈ Δ(X): p ≽ q if and only if EU_u(p) ≥ EU_u(q).\n", "formal": "∃u:X→ℝ. ∀p q. p ≽ q ↔ Σ_x p(x)u(x) ≥ Σ_x q(x)u(x)", "aliases": ["vNM representation", "Linear utility representation"], "tags": ["representation"], "sources": ["von Neumann & Morgenstern (1944)"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/eu-representation.yaml"}, {"id": "independence", "name": "Independence", "statement": "For all p, q, r ∈ Δ(X) and λ ∈ (0,1]: p ≽ q if and only if λp + (1−λ)r ≽ λq + (1−λ)r.\n", "formal": "∀p q r, ∀λ∈(0,1]. p ≽ q ↔ λp+(1−λ)r ≽ λq+(1−λ)r", "aliases": ["Substitution axiom", "vNM independence", "Linearity"], "tags": ["axiom", "mixture"], "sources": ["Marschak (1950), Rational behavior, uncertain prospects, and measurable utility, Econometrica 18", "Herstein & Milnor (1953), An axiomatic approach to measurable utility, Econometrica 21"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/independence.yaml"}, {"id": "multi-utility", "name": "Expected multi-utility representation", "statement": "There is a set U of functions u : X → ℝ such that for all p, q ∈ Δ(X): p ≽ q if and only if EU_u(p) ≥ EU_u(q) for every u ∈ U.\n", "formal": "∃U ⊆ (X→ℝ). ∀p q. p ≽ q ↔ ∀u∈U. EU_u(p) ≥ EU_u(q)", "aliases": ["Incomplete expected utility", "Unanimity representation"], "tags": ["representation"], "sources": ["Aumann (1962), Utility theory without the completeness axiom, Econometrica 30", "Dubra, Maccheroni & Ok (2004), Expected utility theory without the completeness axiom, JET 115"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/multi-utility.yaml"}, {"id": "quasi-transitivity", "name": "Quasi-transitivity", "statement": "Strict preference is transitive: if p ≻ q and q ≻ r then p ≻ r.\n", "formal": "∀p q r. p ≻ q → q ≻ r → p ≻ r", "aliases": ["PP-transitivity"], "tags": ["ordering"], "sources": ["Sen (1969), Quasi-transitivity, rational choice and collective decisions, Review of Economic Studies 36"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/quasi-transitivity.yaml"}, {"id": "transitivity", "name": "Transitivity", "statement": "For all p, q, r ∈ Δ(X): if p ≽ q and q ≽ r then p ≽ r.\n", "formal": "∀p q r. p ≽ q → q ≽ r → p ≽ r", "aliases": [], "tags": ["ordering"], "sources": ["von Neumann & Morgenstern (1944), §3.5"], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/transitivity.yaml"}, {"id": "weak-order", "name": "Weak order", "statement": "≽ is complete and transitive.\n", "formal": "Completeness ∧ Transitivity", "aliases": ["Total preorder", "Ordering axiom"], "tags": ["ordering", "bundle"], "sources": [], "notes": "", "date": "2026-09-08", "lean": null, "file": "topics/decision-theory/principles/weak-order.yaml"}], "results": [{"id": "archimedean-independence-imply-continuity", "premises": ["transitivity", "independence", "archimedean"], "conclusion": "continuity", "status": "conjectured", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "", "sources": [], "notes": "Known with completeness added (Jensen 1967). Without it the cone K = {q − p : q ≽ p} is convex; the question is whether the Archimedean axiom forces it to be closed.\n", "file": "topics/decision-theory/results/archimedean-independence-imply-continuity.yaml", "files": {"md": "writeups/archimedean-independence-imply-continuity.md", "handwritten": false, "html": "writeups/archimedean-independence-imply-continuity.html"}}, {"id": "betweenness-continuity-imply-transitivity", "premises": ["completeness", "closed-graph-continuity", "betweenness"], "conclusion": "transitivity", "status": "conjectured", "certificate": {"provenance": "human", "lean": "none", "produced_by": "ZG", "checked_by": [], "date": "2026-09-08"}, "proof": "", "sources": [], "notes": "Sample conjecture.", "file": "topics/decision-theory/results/betweenness-continuity-imply-transitivity.yaml", "files": {"md": "writeups/betweenness-continuity-imply-transitivity.md", "handwritten": false, "html": "writeups/betweenness-continuity-imply-transitivity.html"}}, {"id": "closed-graph-implies-mixture-continuity", "premises": ["closed-graph-continuity"], "conclusion": "continuity", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "λ ↦ (λp+(1−λ)q, r) and λ ↦ (r, λp+(1−λ)q) are continuous maps\n[0,1] → Δ(X)×Δ(X); the two sections are their preimages of the closed\ngraph of ≽.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/closed-graph-implies-mixture-continuity.yaml", "files": {"md": "writeups/closed-graph-implies-mixture-continuity.md", "handwritten": false, "html": "writeups/closed-graph-implies-mixture-continuity.html"}}, {"id": "continuity-completeness-imply-archimedean", "premises": ["continuity", "completeness"], "conclusion": "archimedean", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "Let p ≻ q ≻ r and set A = {λ : λp+(1−λ)r ≽ q}, B = {λ : q ≽ λp+(1−λ)r}.\nBoth are closed by continuity and A ∪ B = [0,1] by completeness. Since\n1 ∉ B (as p ≻ q) and [0,1]∖B is open, some interval (1−ε, 1] lies in\n[0,1]∖B ⊆ A; any α in it with α < 1 gives αp+(1−α)r ≻ q. Symmetrically,\n0 ∉ A (as q ≻ r) yields [0, ε) ⊆ B∖A and any β in it with β > 0 gives\nq ≻ βp+(1−β)r.\n", "sources": [], "notes": "Completeness is used to conclude λ ∈ A from λ ∉ B; whether continuity alone suffices is left open here.\n", "file": "topics/decision-theory/results/continuity-completeness-imply-archimedean.yaml", "files": {"md": "writeups/continuity-completeness-imply-archimedean.md", "handwritten": false, "html": "writeups/continuity-completeness-imply-archimedean.html"}}, {"id": "dmo-theorem", "premises": ["transitivity", "independence", "closed-graph-continuity"], "conclusion": "multi-utility", "status": "proved", "certificate": {"provenance": "human", "lean": "none", "produced_by": "literature", "checked_by": [], "date": "2026-09-08"}, "proof": "Dubra–Maccheroni–Ok, Theorem 1, for compact metric X (finite X is a\nspecial case): a reflexive transitive relation on Δ(X) satisfying\nindependence and closed-graph continuity has an expected multi-utility\nrepresentation. The proof identifies ≽ with a closed convex cone of\nsigned measures and takes U to be the dual cone.\n", "sources": ["Dubra, Maccheroni & Ok (2004), Expected utility theory without the completeness axiom, JET 115, Theorem 1"], "notes": "Reflexivity is a standing assumption of the framework.\n", "file": "topics/decision-theory/results/dmo-theorem.yaml", "files": {"md": "writeups/dmo-theorem.md", "handwritten": false, "html": "writeups/dmo-theorem.html"}}, {"id": "eu-implies-completeness", "premises": ["eu-representation"], "conclusion": "completeness", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "Real numbers are totally ordered: EU_u(p) ≥ EU_u(q) or EU_u(q) ≥ EU_u(p).\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/eu-implies-completeness.yaml", "files": {"md": "writeups/eu-implies-completeness.md", "handwritten": false, "html": "writeups/eu-implies-completeness.html"}}, {"id": "eu-implies-multi-utility", "premises": ["eu-representation"], "conclusion": "multi-utility", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "Take U = {u}.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/eu-implies-multi-utility.yaml", "files": {"md": "writeups/eu-implies-multi-utility.md", "handwritten": false, "html": "writeups/eu-implies-multi-utility.html"}}, {"id": "independence-implies-betweenness", "premises": ["independence"], "conclusion": "betweenness", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "Fix λ ∈ (0,1) and write m = λp + (1−λ)q. Independence with r = p and\nmixing weight 1−λ gives p ≽ q ⟺ (1−λ)p+λp ≽ (1−λ)q+λp, i.e. p ≽ q ⟺ p ≽ m,\nand likewise q ≽ p ⟺ m ≽ p. Hence p ≻ q ⟺ p ≻ m and p ~ q ⟺ p ~ m.\nIndependence with r = q and weight λ gives p ≽ q ⟺ m ≽ q and\nq ≽ p ⟺ q ≽ m, so p ≻ q ⟺ m ≻ q. Together: p ≻ q ⟹ p ≻ m ≻ q and\np ~ q ⟹ p ~ m.\n", "sources": [], "notes": "No ordering assumptions are needed because independence is taken in the biconditional form.\n", "file": "topics/decision-theory/results/independence-implies-betweenness.yaml", "files": {"md": "writeups/independence-implies-betweenness.md", "handwritten": false, "html": "writeups/independence-implies-betweenness.html"}}, {"id": "mixture-continuity-implies-closed-graph", "premises": ["transitivity", "independence", "continuity"], "conclusion": "closed-graph-continuity", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "Let V = {x ∈ ℝ^X : Σx = 0} and D = Δ(X) − Δ(X) ⊆ V (compact, convex,\ncontains 0). Put K = {q − p : q ≽ p}.\n\n(i) Membership in K depends only on the difference: if q − p = q' − p'\nthen ½q + ½p' = ½q' + ½p, and by independence (λ = ½, mixing with p'\nresp. p) q ≽ p ⟺ ½q+½p' ≽ ½p+½p' and q' ≽ p' ⟺ ½q'+½p ≽ ½p'+½p; the two\nright-hand sides are the same pair. So \"x ∈ K\" is well defined for x ∈ D.\n\n(ii) K is a cone in D: if x ∈ K and tx ∈ D (t > 0) then tx ∈ K. For\nt < 1 use independence with r = p: q ≽ p ⟹ tq+(1−t)p ≽ p, whose\ndifference is t(q−p). For t > 1 apply the t < 1 case to tx.\n\n(iii) K is convex: with x = q−p, y = q'−p' in K, independence gives\n½q+½q' ≽ ½p+½q' and ½q'+½p ≽ ½p'+½p, and transitivity gives\n½q+½q' ≽ ½p+½p', whose difference is ½x+½y.\n\n(iv) K is closed along every line. Let [x₀, x₁] = ℓ ∩ D for a line ℓ and\nx(λ) = λx₁ + (1−λ)x₀. Pick ε > 0 and the uniform lottery c so that\nc + εx(λ) ∈ Δ(X) for all λ ∈ [0,1]. By (ii), x(λ) ∈ K ⟺ εx(λ) ∈ K ⟺\nc + εx(λ) ≽ c. Since c + εx(λ) = λ(c+εx₁) + (1−λ)(c+εx₀), the set\n{λ : x(λ) ∈ K} is a section of the form {λ : λa+(1−λ)b ≽ c}, closed by\nmixture continuity.\n\n(v) A convex subset of a finite-dimensional space that meets every line\nin a closed set is closed (if x ∈ cl K ∖ K and y is in the relative\ninterior of K then [y, x) ⊆ K by the accessibility lemma, so K ∩ line(y,x)\nis not closed). Hence K is closed, and if (pₙ, qₙ) → (p, q) with qₙ ≽ pₙ\nthen qₙ − pₙ ∈ K → q − p ∈ K, i.e. q ≽ p.\n", "sources": [], "notes": "This is the bridge between the mixture-continuity axiom used in the vNM literature and the closed-graph axiom used by Dubra–Maccheroni–Ok. It has not been checked by a human; if it fails, the map still reaches multi-utility from closed-graph continuity via dmo-theorem.\n", "file": "topics/decision-theory/results/mixture-continuity-implies-closed-graph.yaml", "files": {"md": "writeups/mixture-continuity-implies-closed-graph.md", "handwritten": true, "html": "writeups/mixture-continuity-implies-closed-graph.html"}}, {"id": "multi-utility-implies-closed-graph", "premises": ["multi-utility"], "conclusion": "closed-graph-continuity", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "{(p,q) : p ≽ q} = ⋂_{u∈U} {(p,q) : EU_u(p) − EU_u(q) ≥ 0}, an intersection\nof preimages of [0,∞) under continuous (indeed linear) maps on Δ(X)×Δ(X).\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/multi-utility-implies-closed-graph.yaml", "files": {"md": "writeups/multi-utility-implies-closed-graph.md", "handwritten": false, "html": "writeups/multi-utility-implies-closed-graph.html"}}, {"id": "multi-utility-implies-independence", "premises": ["multi-utility"], "conclusion": "independence", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "EU_u is affine in mixtures, so for λ ∈ (0,1]:\nEU_u(λp+(1−λ)r) − EU_u(λq+(1−λ)r) = λ(EU_u(p) − EU_u(q)),\nwhich is ≥ 0 iff EU_u(p) ≥ EU_u(q). Quantify over u ∈ U.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/multi-utility-implies-independence.yaml", "files": {"md": "writeups/multi-utility-implies-independence.md", "handwritten": false, "html": "writeups/multi-utility-implies-independence.html"}}, {"id": "multi-utility-implies-transitivity", "premises": ["multi-utility"], "conclusion": "transitivity", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "If EU_u(p) ≥ EU_u(q) and EU_u(q) ≥ EU_u(r) for every u ∈ U then\nEU_u(p) ≥ EU_u(r) for every u ∈ U.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/multi-utility-implies-transitivity.yaml", "files": {"md": "writeups/multi-utility-implies-transitivity.md", "handwritten": false, "html": "writeups/multi-utility-implies-transitivity.html"}}, {"id": "quasi-transitivity-implies-acyclicity", "premises": ["quasi-transitivity"], "conclusion": "acyclicity", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "If p₁ ≻ p₂ ≻ … ≻ pₙ ≻ p₁ then by induction on n, transitivity of ≻ gives\np₁ ≻ pₙ, and with pₙ ≻ p₁ this contradicts asymmetry of ≻.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/quasi-transitivity-implies-acyclicity.yaml", "files": {"md": "writeups/quasi-transitivity-implies-acyclicity.md", "handwritten": false, "html": "writeups/quasi-transitivity-implies-acyclicity.html"}}, {"id": "transitivity-implies-quasi-transitivity", "premises": ["transitivity"], "conclusion": "quasi-transitivity", "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "proof": "Let p ≻ q ≻ r. Then p ≽ q ≽ r, so p ≽ r. If also r ≽ p then r ≽ p ≽ q\ngives r ≽ q, contradicting q ≻ r. So p ≻ r.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/transitivity-implies-quasi-transitivity.yaml", "files": {"md": "writeups/transitivity-implies-quasi-transitivity.md", "handwritten": false, "html": "writeups/transitivity-implies-quasi-transitivity.html"}}, {"id": "vnm-theorem", "premises": ["completeness", "transitivity", "independence", "continuity"], "conclusion": "eu-representation", "status": "proved", "certificate": {"provenance": "human", "lean": "none", "produced_by": "literature", "checked_by": [], "date": "2026-09-08"}, "proof": "The von Neumann–Morgenstern theorem in the Herstein–Milnor mixture-set form.\nContinuity plus weak order give, for any p ≽ q ≽ r with p ≻ r, a unique\nλ with q ~ λp + (1−λ)r (connectedness of [0,1] and closedness of both\nsections). Fix a best and a worst lottery (exist since X is finite and ≽\nis a weak order respecting mixtures), define U(q) as that λ, and use\nindependence to show U is affine in mixtures; then u(x) = U(δ_x)\nrepresents ≽ by expected utility.\n", "sources": ["von Neumann & Morgenstern (1944), Theory of Games and Economic Behavior, appendix", "Herstein & Milnor (1953), An axiomatic approach to measurable utility, Econometrica 21, Theorem 8", "Kreps (1988), Notes on the Theory of Choice, Theorem 5.15"], "notes": "", "file": "topics/decision-theory/results/vnm-theorem.yaml", "files": {"md": "writeups/vnm-theorem.md", "handwritten": false, "html": "writeups/vnm-theorem.html"}}, {"id": "weak-order-def-completeness", "premises": ["weak-order"], "conclusion": "completeness", "status": "proved", "certificate": {"provenance": "human", "lean": "none", "produced_by": "definition", "checked_by": [], "date": "2026-09-08"}, "proof": "By definition of weak order.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/weak-order-def-completeness.yaml", "files": {"md": "writeups/weak-order-def-completeness.md", "handwritten": false, "html": "writeups/weak-order-def-completeness.html"}}, {"id": "weak-order-def-forward", "premises": ["completeness", "transitivity"], "conclusion": "weak-order", "status": "proved", "certificate": {"provenance": "human", "lean": "none", "produced_by": "definition", "checked_by": [], "date": "2026-09-08"}, "proof": "By definition of weak order.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/weak-order-def-forward.yaml", "files": {"md": "writeups/weak-order-def-forward.md", "handwritten": false, "html": "writeups/weak-order-def-forward.html"}}, {"id": "weak-order-def-transitivity", "premises": ["weak-order"], "conclusion": "transitivity", "status": "proved", "certificate": {"provenance": "human", "lean": "none", "produced_by": "definition", "checked_by": [], "date": "2026-09-08"}, "proof": "By definition of weak order.\n", "sources": [], "notes": "", "file": "topics/decision-theory/results/weak-order-def-transitivity.yaml", "files": {"md": "writeups/weak-order-def-transitivity.md", "handwritten": false, "html": "writeups/weak-order-def-transitivity.html"}}], "models": [{"id": "band-relation", "name": "Band relation", "description": "Fix u : X → ℝ non-constant and ε > 0. Define an asymmetric relation P by\np P q iff EU_u(p) − EU_u(q) ∈ (ε, 2ε], and let p ≽ q iff not q P p. Then\n≽ is complete (P is asymmetric) and ≻ = P. P is acyclic because EU_u\nstrictly increases along any P-chain. But P is not transitive: with\nEU_u(p), EU_u(q), EU_u(r) = 3ε, 1.5ε, 0 we have p P q and q P r while\nEU_u(p) − EU_u(r) = 3ε ∉ (ε, 2ε].\n", "satisfies": ["completeness", "acyclicity"], "violates": ["quasi-transitivity"], "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "sources": [], "notes": "Sanity-checked numerically in checks/countermodels.py. Not yet checked by a human.", "checks": ["topics/decision-theory/checks/countermodels.py"], "file": "topics/decision-theory/models/band-relation.yaml", "files": {"md": "writeups/band-relation.md", "handwritten": false, "html": "writeups/band-relation.html"}}, {"id": "incomplete-continuous-non-archimedean", "name": "Incomplete, continuous, non-Archimedean", "description": "", "satisfies": ["transitivity", "continuity"], "violates": ["archimedean"], "status": "conjectured", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "sources": [], "notes": "Completeness is used essentially in continuity-completeness-imply-archimedean; no countermodel yet.", "file": "topics/decision-theory/models/incomplete-continuous-non-archimedean.yaml", "files": {"md": "writeups/incomplete-continuous-non-archimedean.md", "handwritten": false, "html": "writeups/incomplete-continuous-non-archimedean.html"}}, {"id": "lexicographic-eu", "name": "Lexicographic EU", "description": "Lexicographic expected utility. With X = {a, b, c} let p ≽ q iff\np(a) > q(a), or p(a) = q(a) and p(b) ≥ q(b). This is complete and\ntransitive (a lexicographic order on ℝ²), and satisfies independence\nbecause mixing with r multiplies the vector of differences by λ, which\npreserves lexicographic sign. But {λ : λδ_a + (1−λ)δ_c ≽ δ_b} = (0, 1],\nwhich is not closed.\n\nThe same lexicographic order (p ≽ q iff p(a) > q(a), or p(a) = q(a) and\np(b) ≥ q(b)). Here δ_a ≻ δ_b ≻ δ_c, but every mixture βδ_a + (1−β)δ_c\nwith β > 0 puts positive weight on a and so is strictly preferred to\nδ_b; no β with δ_b ≻ βδ_a + (1−β)δ_c exists.\n", "satisfies": ["completeness", "transitivity", "independence"], "violates": ["continuity", "archimedean"], "status": "proved", "certificate": {"provenance": "human", "lean": "none", "produced_by": "literature", "checked_by": [], "date": "2026-09-08"}, "sources": ["Hausner (1954), Multidimensional utilities, in Decision Processes (Thrall, Coombs & Davis eds.)", "Fishburn (1971), A study of lexicographic expected utility, Management Science 17", "Hausner (1954), Multidimensional utilities", "Fishburn (1971), A study of lexicographic expected utility, Management Science 17"], "notes": "Derivable from lexicographic-not-archimedean together with continuity-completeness-imply-archimedean (the validator reports it as redundant); kept because it is the form the literature states.", "file": "topics/decision-theory/models/lexicographic-eu.yaml", "files": {"md": "writeups/lexicographic-eu.md", "handwritten": false, "html": "writeups/lexicographic-eu.html"}}, {"id": "non-convex-cone", "name": "Non-convex cone", "description": "Let X = {a, b, c} and identify a difference q − p of lotteries with the\npoint (q(a) − p(a), q(b) − p(b)) ∈ ℝ². Let C ⊆ ℝ² be the closed upper\nhalf-plane together with the closed sector of directions [225°, 270°],\nand define q ≽ p iff q − p ∈ C.\n\nCompleteness: C ∪ (−C) = ℝ² since −C contains the closed lower\nhalf-plane. Independence: mixing both sides with r multiplies the\ndifference by λ > 0, and C is a cone. Closed graph: (p, q) ↦ q − p is\ncontinuous and C is closed. Reflexivity: 0 ∈ C.\n\nTransitivity fails: take x at direction 240° and y at direction 170°,\nboth in C and small enough that p, q = p + x… are lotteries; x + y has\ndirection ≈ 205°, which is not in C. So with q − p = x and r − q = y we\nhave q ≽ p and r ≽ q but not r ≽ p.\n", "satisfies": ["completeness", "independence", "closed-graph-continuity"], "violates": ["transitivity"], "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "sources": [], "notes": "Sanity-checked numerically in checks/countermodels.py (completeness and independence hold, transitivity fails on random samples). Not yet checked by a human. Any non-convex closed cone C with C ∪ −C = ℝ² works.", "checks": ["topics/decision-theory/checks/countermodels.py"], "file": "topics/decision-theory/models/non-convex-cone.yaml", "files": {"md": "writeups/non-convex-cone.md", "handwritten": false, "html": "writeups/non-convex-cone.html"}}, {"id": "rational-levels", "name": "Rational levels", "description": "Let X = {a, b, c} and define a three-valued function V on Δ(X):\nV(p) = 2 if p(a) ∈ ℚ; V(p) = 1 if p(a) ∉ ℚ and p(b) ∈ ℚ; V(p) = 0\notherwise. Let p ≽ q iff V(p) ≥ V(q). This is a weak order.\n\nMixture continuity fails: along the line from δ_a to δ_b the mixture\nλδ_a + (1−λ)δ_b has V = 2 exactly when λ ∈ ℚ, so\n{λ : λδ_a + (1−λ)δ_b ≽ δ_c} = ℚ ∩ [0,1] is not closed.\n\nArchimedean holds: a chain p ≻ q ≻ r forces V(p) = 2, V(q) = 1, V(r) = 0,\nso p(a) ∈ ℚ and r(a) ∉ ℚ, in particular p(a) ≠ r(a). Along\nm(α) = αp + (1−α)r the coordinate m(α)(a) = r(a) + α(p(a) − r(a)) is\nrational for a dense set of α, so some α ∈ (0,1) close to 1 has\nV(m(α)) = 2 > V(q). For the other half, m(β)(a) is irrational for all but\ncountably many β; and m(β)(b) = r(b) + β(p(b) − r(b)) is irrational for\nall but countably many β when p(b) ≠ r(b), and equals r(b) ∉ ℚ when\np(b) = r(b) (because V(r) = 0). So some β ∈ (0,1) close to 0 has\nV(m(β)) = 0 < V(q).\n", "satisfies": ["completeness", "transitivity", "archimedean"], "violates": ["continuity"], "status": "proved", "certificate": {"provenance": "ai", "lean": "none", "produced_by": "Claude Fable 5.1 (Cowork session)", "checked_by": [], "date": "2026-09-08"}, "sources": [], "notes": "The construction is deliberately artificial: it shows that the Archimedean axiom cannot replace mixture continuity even for weak orders, unless something like independence is added. Not yet checked by a human.", "file": "topics/decision-theory/models/rational-levels.yaml", "files": {"md": "writeups/rational-levels.md", "handwritten": false, "html": "writeups/rational-levels.html"}}, {"id": "semiorder", "name": "Semiorder", "description": "A semiorder with a just-noticeable difference. Fix u : X → ℝ non-constant\nand ε > 0, and let p ≽ q iff EU_u(p) ≥ EU_u(q) − ε. Completeness: one of\nthe two differences is ≥ 0 >       : { min: Math.min(130, height * .3), max: Math.max(0, height - Math.min(140, height * .3) - 9), initial: Math.min(230, Math.max(145, window.innerHeight * .27)) };
  }
  function apply() {
    if (pane.dataset.active !== 'true') return;
    const previousWidth = current.sidebar;
    for (const key of Object.keys(handles)) {
      const bounds = limits(key), min = Math.min(bounds.min, bounds.max);
      const value = Math.round(Math.max(min, Math.min(bounds.max, saved[key] ?? bounds.initial)));
      current[key] = value;
      pane.style.setProperty(key === 'sidebar' ? '--sidebar-width' : '--background-height', `${value}px`);
      const handle = handles[key];
      handle.setAttribute('aria-valuemin', Math.round(min));
      handle.setAttribute('aria-valuemax', Math.round(bounds.max));
      handle.setAttribute('aria-valuenow', value);
      handle.setAttribute('aria-valuetext', `${value} pixels ${key === 'sidebar' ? 'wide' : 'high'}`);
    }
    if (previousWidth !== current.sidebar) fit();
  }
  function persist() { try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch (_) {} }
  function setSize(key, value) { saved[key] = value; apply(); saved[key] = current[key]; }
  function finish(cancel = false) {
    if (!drag) return;
    const previous = drag; drag = null;
    if (cancel) { saved = previous.saved; apply(); } else persist();
    handles[previous.key].classList.remove('dragging');
    document.body.classList.remove('resizing-panes');
    document.body.style.removeProperty('--resize-cursor');
    if (handles[previous.key].hasPointerCapture?.(previous.pointerId)) handles[previous.key].releasePointerCapture(previous.pointerId);
  }
  for (const [key, handle] of Object.entries(handles)) {
    handle.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || drag) return;
      ev.preventDefault(); handle.focus(); apply();
      drag = { key, pointerId: ev.pointerId, coordinate: key === 'sidebar' ? ev.clientX : ev.clientY, size: current[key], saved: { ...saved } };
      handle.setPointerCapture?.(ev.pointerId);
      handle.classList.add('dragging');
      document.body.style.setProperty('--resize-cursor', key === 'sidebar' ? 'col-resize' : 'row-resize');
      document.body.classList.add('resizing-panes');
      document.getElementById('pop').hidden = true;
    });
    handle.addEventListener('lostpointercapture', () => finish());
    handle.addEventListener('dblclick', () => { finish(); delete saved[key]; apply(); persist(); });
    handle.addEventListener('keydown', ev => {
      if (drag) return;
      const bounds = limits(key), step = ev.shiftKey ? 40 : 10;
      const increase = key === 'sidebar' ? 'ArrowRight' : 'ArrowUp';
      const decrease = key === 'sidebar' ? 'ArrowLeft' : 'ArrowDown';
      if (![increase, decrease, 'Home', 'End', 'Enter'].includes(ev.key)) return;
      ev.preventDefault();
      if (ev.key === 'Enter') { delete saved[key]; apply(); }
      else setSize(key, ev.key === 'Home' ? bounds.min : ev.key === 'End' ? bounds.max : current[key] + (ev.key === increase ? step : -step));
      persist();
    });
  }
  window.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    const delta = (drag.key === 'sidebar' ? ev.clientX : -ev.clientY) - (drag.key === 'sidebar' ? drag.coordinate : -drag.coordinate);
    setSize(drag.key, drag.size + delta);
  });
  window.addEventListener('pointerup', ev => { if (drag?.pointerId === ev.pointerId) finish(); });
  window.addEventListener('pointercancel', ev => { if (drag?.pointerId === ev.pointerId) finish(true); });
  window.addEventListener('blur', () => finish());
  window.addEventListener('keydown', ev => { if (ev.key === 'Escape' && drag) { ev.preventDefault(); finish(true); } });
  window.addEventListener('resize', apply);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', apply));
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(apply).observe(pane);
  apply();
})();
window.addEventListener('resize', () => { if (state.tab === 'graph') fit(); });
renderAll(true);
requestAnimationFrame(fit);
</script>
