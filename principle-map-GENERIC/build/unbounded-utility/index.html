w. Thus X~0.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, pp. 25, 27"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/reflection-implies-symmetric-neutrality.yaml", "files": {"md": "writeups/reflection-implies-symmetric-neutrality.md", "handwritten": false, "html": "writeups/reflection-implies-symmetric-neutrality.html"}}, {"id": "relative-implies-eu", "premises": ["archimedean-outcomes", "relative-expectation"], "conclusion": "expected-utility", "status": "proved", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Archimedean Outcomes makes the real chart total. If u(X),u(Y) are integrable, so is their difference, and E[u(X)−u(Y)]=E[u(X)]−E[u(Y)]. Apply Relative Expectation.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, pp. 26–27", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/relative-implies-eu.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/relative-implies-eu.yaml", "files": {"md": "writeups/relative-implies-eu.md", "handwritten": false, "html": "writeups/relative-implies-eu.html"}}, {"id": "relative-implies-simple-relative", "premises": ["relative-expectation"], "conclusion": "simple-relative-expectation", "status": "proved", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "A finite-valued difference is integrable. Restrict Relative Expectation to such pairs.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, p. 26", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/relative-implies-simple-relative.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/relative-implies-simple-relative.yaml", "files": {"md": "writeups/relative-implies-simple-relative.md", "handwritten": false, "html": "writeups/relative-implies-simple-relative.html"}}, {"id": "rich-simple-sure-thing-refutes-countable", "premises": ["rich-outcomes", "simple-eu", "sure-thing"], "conclusion": "failure-countable-sure-thing", "status": "proved", "certificate": {"source_id": "decision-theory-unbound", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Use the strengthened St Petersburg contradiction from §2.3. Simple EU supplies Restricted Totality, Restricted Stochastic Equivalence and finite conditional EU calculations. With independent sequences of fair tosses let A be first-toss St Petersburg, B the same starting at toss 2, and C an independent St Petersburg variable. Conditional on B=2^n, A is a fair mixture of 2 and 2^(n+1), so its conditional expected value exceeds B by 1; Countable Sure-Thing would give A≻B. Partition the A,C space by the maximum of their finite stopping times. On each cell they are simple and their restricted laws coincide, so Countable Sure-Thing would give A~C. Repeat for B,C to get B~C, contradicting Preordering. Null sets can be assigned a finite outcome without changing the simple-law comparisons.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.3, pp. 675–676"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/results/rich-simple-sure-thing-refutes-countable.yaml", "files": {"md": "writeups/rich-simple-sure-thing-refutes-countable.md", "handwritten": false, "html": "writeups/rich-simple-sure-thing-refutes-countable.html"}}, {"id": "shift-scale-imply-positive-affine", "premises": ["rich-outcomes", "shift-invariance", "scale-invariance"], "conclusion": "positive-affine-invariance", "status": "proved", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Apply Scale Invariance and then Shift Invariance. Rich Outcomes supplies all intermediate outcome levels.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §§3, 5, pp. 24, 34", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/shift-scale-imply-positive-affine.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/shift-scale-imply-positive-affine.yaml", "files": {"md": "writeups/shift-scale-imply-positive-affine.md", "handwritten": false, "html": "writeups/shift-scale-imply-positive-affine.html"}}, {"id": "simple-eu-implies-archimedean-outcomes", "premises": ["simple-eu"], "conclusion": "archimedean-outcomes", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "For a≻b≻c put p=(u(b)−u(c))/(u(a)−u(c)). Then 0<p<1 and the simple variable M_p(a,c) has expectation u(b), so is indifferent to b.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, p. 22, footnote 3"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/simple-eu-implies-archimedean-outcomes.yaml", "files": {"md": "writeups/simple-eu-implies-archimedean-outcomes.md", "handwritten": false, "html": "writeups/simple-eu-implies-archimedean-outcomes.html"}}, {"id": "simple-eu-implies-restricted-equivalence", "premises": ["simple-eu"], "conclusion": "restricted-stochastic-equivalence", "status": "proved", "certificate": {"source_id": "decision-theory-unbound", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Equal laws of simple variables give equal finite expectations. Simple EU therefore gives both preference directions.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §§2.3, 3.2"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/results/simple-eu-implies-restricted-equivalence.yaml", "files": {"md": "writeups/simple-eu-implies-restricted-equivalence.md", "handwritten": false, "html": "writeups/simple-eu-implies-restricted-equivalence.html"}}, {"id": "simple-eu-implies-restricted-totality", "premises": ["simple-eu"], "conclusion": "restricted-totality", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Finite real expectations are comparable, and Simple EU represents the preference in both directions.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, pp. 22–23"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/simple-eu-implies-restricted-totality.yaml", "files": {"md": "writeups/simple-eu-implies-restricted-totality.md", "handwritten": false, "html": "writeups/simple-eu-implies-restricted-totality.html"}}, {"id": "stochastic-equivalence-restricts", "premises": ["stochastic-equivalence"], "conclusion": "restricted-stochastic-equivalence", "status": "proved", "certificate": {"source_id": "misc", "lean": "stated", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Restrict the quantifiers to simple random variables.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.3, p. 675", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/stochastic-equivalence-restricts.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/stochastic-equivalence-restricts.yaml", "files": {"md": "writeups/stochastic-equivalence-restricts.md", "handwritten": false, "html": "writeups/stochastic-equivalence-restricts.html"}}, {"id": "sure-thing-to-independence", "premises": ["rich-outcomes", "archimedean-outcomes", "totality", "stochastic-dominance", "sure-thing"], "conclusion": "independence", "status": "proved", "certificate": {"source_id": "decision-theory-unbound", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Source reduction, §3.2: in the original DTU framework, Stochastic Dominance yields Stochastic Equivalence. Preferences therefore descend to laws. Every law and its conditional realizations are available by Prospect Richness, and the paper identifies Sure-Thing in this quotient with von Neumann–Morgenstern Independence. Pull this implication back along X↦L(X). The full original DTU assumptions are retained; a weaker converse for arbitrary incomplete orders has not been extracted.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, p. 679"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/results/sure-thing-to-independence.yaml", "files": {"md": "writeups/sure-thing-to-independence.md", "handwritten": false, "html": "writeups/sure-thing-to-independence.html"}}, {"id": "symmetry-evaluates-alternating", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance"], "conclusion": "alternating-st-petersburg-value", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "The law identity A =d M_1/2(−2,−2A) gives indifference by Stochastic Equivalence. If A≻−1/2 then −2A≺1, so Independence and Simple EU imply A~M_1/2(−2,−2A)≺M_1/2(−2,1)~−1/2, contradiction. The opposite strict case is analogous. Totality gives A~−1/2.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 9, p. 30"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-evaluates-alternating.yaml", "files": {"md": "writeups/symmetry-evaluates-alternating.md", "handwritten": false, "html": "writeups/symmetry-evaluates-alternating.html"}}, {"id": "symmetry-implies-negative-self-similarity", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance"], "conclusion": "negative-self-similarity", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "If X≻Y, negative affine anti-invariance makes −aX+b≺−aY+b. Independence with the common Z then reverses the strict comparison between their mixtures. The assumed fixed-point indifferences imply X≺Y, contradiction. Interchange X,Y for the other strict case and use Totality.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 10, pp. 30–31"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-implies-negative-self-similarity.yaml", "files": {"md": "writeups/symmetry-implies-negative-self-similarity.md", "handwritten": false, "html": "writeups/symmetry-implies-negative-self-similarity.html"}}, {"id": "symmetry-implies-shift-transfer", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance"], "conclusion": "shift-transfer", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "This is Theorem 3 transported from laws to random variables using Stochastic Equivalence. Reflection, Totality and Independence first make a half-mixture of V and −V indifferent to 0. Shift invariance then gives M_1/2(V+c,−V)~c/2. Pair the terms on the two sides of the proposed transfer with their negatives; both reduce to the same simple constant mixture. Independence cancels the common terms.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 3, pp. 25–26"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-implies-shift-transfer.yaml", "files": {"md": "writeups/symmetry-implies-shift-transfer.md", "handwritten": false, "html": "writeups/symmetry-implies-shift-transfer.html"}}, {"id": "symmetry-implies-simple-relative", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance"], "conclusion": "simple-relative-expectation", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Theorem 4. If D=u(X)−u(Y) has finite range, work with the diluted variables M_1/2(X,0), M_1/2(Y,0). Partition into the finitely many values of D. Transfer each constant difference to the zero branch by Theorem 3. Finite mixture substitution leaves M_1/2(Y,D) in place of M_1/2(X,0). Independence and Simple EU reduce the comparison to E[D]≥0. Law invariance permits each rearrangement of branches.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 4, pp. 26–27"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-implies-simple-relative.yaml", "files": {"md": "writeups/symmetry-implies-simple-relative.md", "handwritten": false, "html": "writeups/symmetry-implies-simple-relative.html"}}, {"id": "symmetry-l1-evaluates-arroyo", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance", "l1-continuity"], "conclusion": "arroyo-value", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Theorem 8 evaluates the folded tail difference of A+1/2. Pair its positive and negative tails: the residual weights are 1/[2n(2n−1)]−1/[2n(2n+1)] at heights 2n+1/2, a positive integrable tail whose expectation is 1/2+ln 2. Folded Expectation gives A+1/2~1/2+ln 2. Shift Invariance gives A~ln 2.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 8, pp. 29–30"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-l1-evaluates-arroyo.yaml", "files": {"md": "writeups/symmetry-l1-evaluates-arroyo.md", "handwritten": false, "html": "writeups/symmetry-l1-evaluates-arroyo.html"}}, {"id": "symmetry-l1-evaluates-pasadena", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance", "l1-continuity"], "conclusion": "pasadena-value", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Theorem 11. Couple Pasadena P with Highland Park H, retaining each outcome probability and replacing each negative denominator 2n by 2n−1. Then E[H−P]=−ln 2 with integrable difference. The paper writes H as M_2/3(Q,−2Q). It proves by Relative Expectation that Q~M_1/4(4Q,0), then Totality and affine invariance give Q~M_1/2(2Q,0). Reflection and Independence yield H~0; Relative Expectation together with shift transfer then gives P~ln 2. These are preference equalities, not ordinary expectations of P or H.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 11, pp. 32–33"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-l1-evaluates-pasadena.yaml", "files": {"md": "writeups/symmetry-l1-evaluates-pasadena.md", "handwritten": false, "html": "writeups/symmetry-l1-evaluates-pasadena.html"}}, {"id": "symmetry-l1-implies-folded", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance", "l1-continuity"], "conclusion": "folded-expectation", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Theorem 6 couples the positive and negative utility tails in opposing order. Absolute integrability of the folded tail difference yields an integrable difference of these tail variables, with expectation F(X). Relative Expectation (Corollary 5) and reflection identify X with sure F(X). Apply the same construction to Y and compare the constants. Law invariance transfers the chosen couplings to the original variables.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 6, p. 27 and Figure 7, p. 29"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-l1-implies-folded.yaml", "files": {"md": "writeups/symmetry-l1-implies-folded.md", "handwritten": false, "html": "writeups/symmetry-l1-implies-folded.html"}}, {"id": "symmetry-l1-implies-relative", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance", "l1-continuity"], "conclusion": "relative-expectation", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Corollary 5. Approximate an integrable difference u(X)−u(Y) in L¹ by simple differences, apply Theorem 4, and use L¹ continuity to pass to the limit. This is recorded with the full source context DTU+Sym; the equivalence between its law metric and this topic’s random-variable continuity requires Stochastic Equivalence.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Corollary 5, p. 27"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-l1-implies-relative.yaml", "files": {"md": "writeups/symmetry-l1-implies-relative.md", "handwritten": false, "html": "writeups/symmetry-l1-implies-relative.html"}}, {"id": "symmetry-relative-implies-l1", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance", "relative-expectation"], "conclusion": "l1-continuity", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "This is the reverse direction of Corollary 5 in its full DTU+Sym context. Pull preferences down to probability laws using Stochastic Equivalence and apply the source equivalence between Relative Expectation Theory and the extended L¹ metric continuity. Actual-coupling convergence implies convergence in that infimum metric, giving the random-variable clause. The source states this as a corollary without an expanded reverse-direction proof; no claim of an independent proof audit is made.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Corollary 5, p. 27"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/symmetry-relative-implies-l1.yaml", "files": {"md": "writeups/symmetry-relative-implies-l1.md", "handwritten": false, "html": "writeups/symmetry-relative-implies-l1.html"}}, {"id": "totality-restricts", "premises": ["totality"], "conclusion": "restricted-totality", "status": "proved", "certificate": {"source_id": "misc", "lean": "stated", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Restrict the quantifiers to simple random variables.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.3, p. 675", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/totality-restricts.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/totality-restricts.yaml", "files": {"md": "writeups/totality-restricts.md", "handwritten": false, "html": "writeups/totality-restricts.html"}}], "models": [{"id": "affine-symmetric-extension", "name": "Total affine-symmetric extension (source existence construction)", "satisfies": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "negative-affine-anti-invariance", "l1-continuity"], "violates": ["countable-sure-thing", "archimedean-gambles"], "status": "pro ilure-countable-sure-thing"], ["sure-thing", "independence"], ["sure-thing", "negative-self-similarity"], ["sure-thing", "pasadena-value"], ["sure-thing", "reflection-anti-invariance"], ["sure-thing", "restricted-stochastic-equivalence"], ["sure-thing", "restricted-totality"], ["sure-thing", "rich-outcomes"], ["sure-thing", "shift-invariance"], ["sure-thing", "shift-transfer"], ["sure-thing", "simple-eu"], ["sure-thing", "simple-relative-expectation"], ["sure-thing", "statewise-dominance"], ["sure-thing", "stochastic-dominance"], ["sure-thing", "stochastic-equivalence"], ["sure-thing", "symmetric-neutrality"], ["symmetric-neutrality", "archimedean-outcomes"], ["symmetric-neutrality", "arroyo-value"], ["symmetric-neutrality", "failure-archimedean-gambles"], ["symmetric-neutrality", "failure-countable-sure-thing"], ["symmetric-neutrality", "independence"], ["symmetric-neutrality", "negative-self-similarity"], ["symmetric-neutrality", "pasadena-value"], ["symmetric-neutrality", "reflection-anti-invariance"], ["symmetric-neutrality", "restricted-stochastic-equivalence"], ["symmetric-neutrality", "restricted-totality"], ["symmetric-neutrality", "rich-outcomes"], ["symmetric-neutrality", "shift-invariance"], ["symmetric-neutrality", "shift-transfer"], ["symmetric-neutrality", "simple-eu"], ["symmetric-neutrality", "simple-relative-expectation"], ["symmetric-neutrality", "statewise-dominance"], ["symmetric-neutrality", "stochastic-dominance"], ["symmetric-neutrality", "stochastic-equivalence"], ["symmetric-neutrality", "sure-thing"], ["totality", "alternating-st-petersburg-value"], ["totality", "archimedean-outcomes"], ["totality", "arroyo-value"], ["totality", "failure-archimedean-gambles"], ["totality", "failure-countable-sure-thing"], ["totality", "independence"], ["totality", "negative-self-similarity"], ["totality", "pasadena-value"], ["totality", "reflection-anti-invariance"], ["totality", "restricted-stochastic-equivalence"], ["totality", "rich-outcomes"], ["totality", "shift-invariance"], ["totality", "shift-transfer"], ["totality", "simple-eu"], ["totality", "simple-relative-expectation"], ["totality", "statewise-dominance"], ["totality", "stochastic-dominance"], ["totality", "stochastic-equivalence"], ["totality", "sure-thing"], ["totality", "symmetric-neutrality"]], "unknown": {"affine-symmetric-extension": [], "eventual-clipped-expectation": ["arroyo-value", "negative-affine-anti-invariance", "negative-self-similarity", "pasadena-value", "positive-affine-invariance", "shift-invariance", "shift-transfer", "simple-relative-expectation"], "total-continuous-ultrafilter": ["alternating-st-petersburg-value", "arroyo-value", "folded-expectation", "l1-continuity", "negative-self-similarity", "pasadena-value", "relative-expectation", "shift-transfer", "simple-relative-expectation"], "total-exact-ultrafilter": ["alternating-st-petersburg-value", "arroyo-value", "negative-self-similarity", "pasadena-value", "shift-invariance", "shift-transfer", "simple-relative-expectation"]}, "problems": [], "infos": []}, "downloads": {"bundle": "unbounded-utility-map.zip", "json": "data.json", "zip": "source.zip", "lean": "lean/"}, "background_md": "# Unbounded utility: random variables\n\nThis topic records a first reading of **Decision theory unbound** (Goodsell,\n2024; published online in 2023) and **Symmetries of value** (Goodsell, 2026).\nThe source PDFs are in this topic's `sources/` directory:\n[Decision theory unbound](sources/Nous%20-%202023%20-%20Goodsell%20-%20Decision%20theory%20unbound%20%281%29.pdf)\nand [Symmetries of value](sources/Goodsell%20-%202026%20-%20Symmetries%20of%20value.pdf).\nSee `extraction.md` for the source inventory, limitations, and transcription notes.\n\n## Objects and standing assumptions\n\nA gamble is a measurable **outcome-valued random variable** X on a fixed\natomless standard probability space, which can be represented by [0,1] with\nLebesgue measure or by countably many independent fair coin tosses. All such\nvariables are available. Thus the first paper's **Prospect Richness** is a\ndomain convention here; it is different from the **Rich Outcomes** node.\n\nThe relation ≽ on gambles is reflexive and transitive. Write X ~ Y when both\ncomparisons hold, and X ≻ Y when X ≽ Y but not Y ≽ X. **Totality is optional.**\nOutcomes themselves are linearly ordered by their sure comparisons; outcomes\nindifferent for sure are identified. There are two distinct reference outcomes\ncalled 0 and 1, with 1 ≻ 0. These are outcome and nondegeneracy conventions,\nnot an assumption that all gambles are comparable.\n\nEqual random variables are the same object, but random variables with the same\nlaw need not be indifferent. **Stochastic Equivalence is optional.** In\nparticular, do not replace a variable with an independent copy in a preference\ncomparison without an axiom that licenses the replacement. Almost-sure\nindifference also follows from the dominance or equivalence axioms when used;\nit is not an extra background preference axiom.\n\n## Mixtures and restrictions\n\nM_p(X,Y) means a p chance of X and a 1-p chance of Y. Fix the following lift on\n[0,1], with an arbitrary fixed convention at endpoints:\n\n- if 0 ≤ w < p, M_p(X,Y)(w) = X(w/p);\n- otherwise, M_p(X,Y)(w) = Y((w-p)/(1-p)).\n\nIts law is the mixture of the input laws. It is **not** the pointwise utility\naverage pX+(1-p)Y. Associativity and commutativity of probability mixtures are\nidentities of laws; their use as preference identities requires Stochastic\nEquivalence. All theorem imports from the distribution formulation retain that\naxiom explicitly or obtain it from Stochastic Dominance.\n\nX|E equals X on E and the reference outcome 0 off E. Set X ≽_E Y iff\nX|E ≽ Y|E. This is the first paper's definition, not conditional expectation\nand not a fresh ranking conditional on a changed probability measure.\n\n## Real utility levels and the two outcome principles\n\nDo not make all outcomes real-valued utilities by definition: doing so would\nhide the outcome assumption the user wants to inspect. Start with an ordered\nstandard Borel outcome space O. Its finite real utility chart u is calibrated by\nbinary comparisons relative to 0 and 1, as in Decision theory unbound, §2.1,\nfootnote 9:\n\n- for 0 ≤ r ≤ 1, u(o)=r means o ~ M_r(1,0);\n- for r > 1, u(o)=r means 1 ~ M_(1/r)(o,0);\n- for r < 0, u(o)=r means 0 ~ M_(-r/(1-r))(1,o).\n\nThe better outcome is placed first in each binary mixture. In the negative\nbranch this exchanges the two branches of the source's notation, to align\nthe fixed random-variable lift with Archimedean Outcomes. Under the source's\nStochastic Equivalence the two conventions agree. No branch exchange is\nsilently used as an indifference when Stochastic Equivalence is absent.\n\nThe chart, wherever defined, is understood to be single-valued, measurable,\nand compatible with the sure-outcome order; sure-indifferent outcomes have\nalready been identified. These are the source's utility-level conventions.\nThey are not a representation of preferences over all gambles. The remaining\naxioms constrain how these binary comparisons extend to other random variables.\n\n**Rich Outcomes:** every r ∈ ℝ occurs in this chart. This does not exclude\nadditional outcomes lacking a finite level. It is the first paper's axiom\ncalled \"Unbounded Utility\", which is stronger than mere unboundedness.\n\n**Archimedean Outcomes:** whenever sure a ≻ b ≻ c, there is p ∈ (0,1) such\nthat b ~ M_p(a,c). This supplies a finite chart coordinate for every outcome:\napply the condition to o and the reference pair 0,1 in their order. It does\nnot require that every real coordinate be realized. In particular it must not\nbe conflated with **Archimedean Gambles**, which quantifies over arbitrary\ngambles in all three positions.\n\nThe **Simple Expected Utility** node asserts that this chart is total and\nrepresents every finite-valued gamble by its expectation. Surjectivity is\ndeliberately omitted from that node and supplied by **Rich Outcomes**.\nConsequently Simple EU implies Archimedean Outcomes, but no implication from\nRich Outcomes to Archimedean Outcomes is recorded.\n\nArithmetic notation such as X+b and −X abbreviates transforming the **utility\nlevels of the outcomes of X**, using u and its inverse on realized levels.\nNumerical principles quantify over variables in the finite chart for which\nthe indicated transformed outcomes are available; they make no claim about\noutcomes outside that chart. Full affine-group composition uses Rich Outcomes.\nThe source theorem packages include Rich Outcomes and Simple EU, so their\nchart is all of ℝ and all the operations exist. Thus, throughout the numerical\nproofs, X may simply be read as the real random variable u(X).\n\n## Expectation and continuity\n\nAn ordinary expected utility in this dataset is **finite**: E|u(X)|<∞.\nThe sources treat St Petersburg as lacking an expected utility for their EU\nprinciple. No rule comparing equal +∞ expectations is imported, and a\nconditionally convergent series is not treated as a Lebesgue expectation.\n\nRelative Expectation uses the expectation of the **pointwise difference**\nu(X)-u(Y), which can be integrable when neither variable is. Mixtures remain\nrandomized selection, so these are different operations.\n\nThe L¹ node uses E|u(X_n)-u(X)|→0 for the variables' actual coupling, and the\nupper-section closure clause printed in Symmetries, p. 23. This does not impose\nStochastic Equivalence by definition. With Stochastic Equivalence and the full\nrandom-variable domain it is equivalent to the source's infimum-over-couplings\nmetric; the translation is explained in `writeups/l1-translation.md`.\n\nFolded expectation requires absolute integrability of the *combined tail\ndifference*. It does not require each tail to be integrable and does not mean\nmerely taking a conditionally convergent improper integral.\n\n## Source theorem packages\n\nPreordering and availability of all random variables are standing throughout.\nThe 2026 paper's DTU is represented by:\n\n**Rich Outcomes + Totality + Stochastic Equivalence + Simple EU + Stochastic\nDominance + Mixture Independence.**\n\nThe Stochastic Equivalence premise is redundant given this topic's weak-plus-\nstrict Dominance node, but is retained in imports to make the translation\nvisible. Archimedean Outcomes follows from Simple EU. **DTU + Sym** additionally\nassumes Negative Affine Anti-Invariance, which supplies Positive Affine\nInvariance as well as reflection. The elementary decomposition is recorded.\n\nFull sufficient premise packages are preferred over unproved claims that a\npaper's assumptions are minimal. There are no Lean files or Lean claims.\n\n## Evidence and logical limitations\n\nProvenance names the direct source: **Decision Theory Unbound**, **Symmetries\nof Value**, or **Misc.** for original connecting proofs and one-off suggestions.\nAll records retain precise source references. The certificate names the mathematical author in\n`produced_by` and credits AI transcription separately in `recorded_by`.\nThe checker list remains empty: human authorship of the source does not assert\nhuman checking of its database transcription. A proved status here includes\n**an application of a cited source theorem**; it does not mean that every\npublished proof has been independently audited. The record states when a\nsource supplies no expanded proof.\n\nCountermodels witness non-implication. Source-based existence models are not\nimplemented comparison algorithms. The executable checks verify selected\nconcrete witness calculations, not arbitrary infinite or nonconstructive claims.\n\nThe two \"Failure of ...\" nodes express genuine negations, recorded with\nexplicit `negates` links. If the background implies both sides of either pair,\nthe graph displays a red inconsistency warning and hides all arrows. This\ncheck uses proved results under the current source filters. The inference\nengine still uses positive Horn rules; it does not infer arbitrary statements\nfrom a contradiction. Missing arrows and missing model flags mean **not recorded**.\n", "background_html": "<h1 id=\"unbounded-utility-random-variables\">Unbounded utility: random variables<\/h1>\n<p>This topic records a first reading of <strong>Decision theory unbound<\/strong> (Goodsell, 2024; published online in 2023) and <strong>Symmetries of value<\/strong> (Goodsell, 2026). The source PDFs are in this topic’s <code>sources/<\/code> directory: <a href=\"sources/Nous%20-%202023%20-%20Goodsell%20-%20Decision%20theory%20unbound%20%281%29.pdf\">Decision theory unbound<\/a> and <a href=\"sources/Goodsell%20-%202026%20-%20Symmetries%20of%20value.pdf\">Symmetries of value<\/a>. See <code>extraction.md<\/code> for the source inventory, limitations, and transcription notes.<\/p>\n<h2 id=\"objects-and-standing-assumptions\">Objects and standing assumptions<\/h2>\n<p>A gamble is a measurable <strong>outcome-valued random variable<\/strong> X on a fixed atomless standard probability space, which can be represented by [0,1] with Lebesgue measure or by countably many independent fair coin tosses. All such variables are available. Thus the first paper’s <strong>Prospect Richness<\/strong> is a domain convention here; it is different from the <strong>Rich Outcomes<\/strong> node.<\/p>\n<p>The relation ≽ on gambles is reflexive and transitive. Write X ~ Y when both comparisons hold, and X ≻ Y when X ≽ Y but not Y ≽ X. <strong>Totality is optional.<\/strong> Outcomes themselves are linearly ordered by their sure comparisons; outcomes indifferent for sure are identified. There are two distinct reference outcomes called 0 and 1, with 1 ≻ 0. These are outcome and nondegeneracy conventions, not an assumption that all gambles are comparable.<\/p>\n<p>Equal random variables are the same object, but random variables with the same law need not be indifferent. <strong>Stochastic Equivalence is optional.<\/strong> In particular, do not replace a variable with an independent copy in a preference comparison without an axiom that licenses the replacement. Almost-sure indifference also follows from the dominance or equivalence axioms when used; it is not an extra background preference axiom.<\/p>\n<h2 id=\"mixtures-and-restrictions\">Mixtures and restrictions<\/h2>\n<p>M_p(X,Y) means a p chance of X and a 1-p chance of Y. Fix the following lift on [0,1], with an arbitrary fixed convention at endpoints:<\/p>\n<ul>\n<li>if 0 ≤ w &lt; p, M_p(X,Y)(w) = X(w/p);<\/li>\n<li>otherwise, M_p(X,Y)(w) = Y((w-p)/(1-p)).<\/li>\n<\/ul>\n<p>Its law is the mixture of the input laws. It is <strong>not<\/strong> the pointwise utility average pX+(1-p)Y. Associativity and commutativity of probability mixtures are identities of laws; their use as preference identities requires Stochastic Equivalence. All theorem imports from the distribution formulation retain that axiom explicitly or obtain it from Stochastic Dominance.<\/p>\n<p>X|E equals X on E and the reference outcome 0 off E. Set X ≽_E Y iff X|E ≽ Y|E. This is the first paper’s definition, not conditional expectation and not a fresh ranking conditional on a changed probability measure.<\/p>\n<h2 id=\"real-utility-levels-and-the-two-outcome-principles\">Real utility levels and the two outcome principles<\/h2>\n<p>Do not make all outcomes real-valued utilities by definition: doing so would hide the outcome assumption the user wants to inspect. Start with an ordered standard Borel outcome space O. Its finite real utility chart u is calibrated by binary comparisons relative to 0 and 1, as in Decision theory unbound, §2.1, footnote 9:<\/p>\n<ul>\n<li>for 0 ≤ r ≤ 1, u(o)=r means o ~ M_r(1,0);<\/li>\n<li>for r &gt; 1, u(o)=r means 1 ~ M_(1/r)(o,0);<\/li>\n<li>for r &lt; 0, u(o)=r means 0 ~ M_(-r/(1-r))(1,o).<\/li>\n<\/ul>\n<p>The better outcome is placed first in each binary mixture. In the negative branch this exchanges the two branches of the source’s notation, to align the fixed random-variable lift with Archimedean Outcomes. Under the source’s Stochastic Equivalence the two conventions agree. No branch exchange is silently used as an indifference when Stochastic Equivalence is absent.<\/p>\n<p>The chart, wherever defined, is understood to be single-valued, measurable, and compatible with the sure-outcome order; sure-indifferent outcomes have already been identified. These are the source’s utility-level conventions. They are not a representation of preferences over all gambles. The remaining axioms constrain how these binary comparisons extend to other random variables.<\/p>\n<p><strong>Rich Outcomes:<\/strong> every r ∈ ℝ occurs in this chart. This does not exclude additional outcomes lacking a finite level. It is the first paper’s axiom called “Unbounded Utility”, which is stronger than mere unboundedness.<\/p>\n<p><strong>Archimedean Outcomes:<\/strong> whenever sure a ≻ b ≻ c, there is p ∈ (0,1) such that b ~ M_p(a,c). This supplies a finite chart coordinate for every outcome: apply the condition to o and the reference pair 0,1 in their order. It does not require that every real coordinate be realized. In particular it must not be conflated with <strong>Archimedean Gambles<\/strong>, which quantifies over arbitrary gambles in all three positions.<\/p>\n<p>The <strong>Simple Expected Utility<\/strong> node asserts that this chart is total and represents every finite-valued gamble by its expectation. Surjectivity is deliberately omitted from that node and supplied by <strong>Rich Outcomes<\/strong>. Consequently Simple EU implies Archimedean Outcomes, but no implication from Rich Outcomes to Archimedean Outcomes is recorded.<\/p>\n<p>Arithmetic notation such as X+b and −X abbreviates transforming the <strong>utility levels of the outcomes of X<\/strong>, using u and its inverse on realized levels. Numerical principles quantify over variables in the finite chart for which the indicated transformed outcomes are available; they make no claim about outcomes outside that chart. Full affine-group composition uses Rich Outcomes. The source theorem packages include Rich Outcomes and Simple EU, so their chart is all of ℝ and all the operations exist. Thus, throughout the numerical proofs, X may simply be read as the real random variable u(X).<\/p>\n<h2 id=\"expectation-and-continuity\">Expectation and continuity<\/h2>\n<p>An ordinary expected utility in this dataset is <strong>finite<\/strong>: E|u(X)|&lt;∞. The sources treat St Petersburg as lacking an expected utility for their EU principle. No rule comparing equal +∞ expectations is imported, and a conditionally convergent series is not treated as a Lebesgue expectation.<\/p>\n<p>Relative Expectation uses the expectation of the <strong>pointwise difference<\/strong> u(X)-u(Y), which can be integrable when neither variable is. Mixtures remain randomized selection, so these are different operations.<\/p>\n<p>The L¹ node uses E|u(X_n)-u(X)|→0 for the variables’ actual coupling, and the upper-section closure clause printed in Symmetries, p. 23. This does not impose Stochastic Equivalence by definition. With Stochastic Equivalence and the full random-variable domain it is equivalent to the source’s infimum-over-couplings metric; the translation is explained in <code>writeups/l1-translation.md<\/code>.<\/p>\n<p>Folded expectation requires absolute integrability of the <em>combined tail difference<\/em>. It does not require each tail to be integrable and does not mean merely taking a conditionally convergent improper integral.<\/p>\n<h2 id=\"source-theorem-packages\">Source theorem packages<\/h2>\n<p>Preordering and availability of all random variables are standing throughout. The 2026 paper’s DTU is represented by:<\/p>\n<p><strong>Rich Outcomes + Totality + Stochastic Equivalence + Simple EU + Stochastic Dominance + Mixture Independence.<\/strong><\/p>\n<p>The Stochastic Equivalence premise is redundant given this topic’s weak-plus- strict Dominance node, but is retained in imports to make the translation visible. Archimedean Outcomes follows from Simple EU. <strong>DTU + Sym<\/strong> additionally assumes Negative Affine Anti-Invariance, which supplies Positive Affine Invariance as well as reflection. The elementary decomposition is recorded.<\/p>\n<p>Full sufficient premise packages are preferred over unproved claims that a paper’s assumptions are minimal. There are no Lean files or Lean claims.<\/p>\n<h2 id=\"evidence-and-logical-limitations\">Evidence and logical limitations<\/h2>\n<p>Provenance names the direct source: <strong>Decision Theory Unbound<\/strong>, <strong>Symmetries of Value<\/strong>, or <strong>Misc.<\/strong> for original connecting proofs and one-off suggestions. All records retain precise source references. The certificate names the mathematical author in <code>produced_by<\/code> and credits AI transcription separately in <code>recorded_by<\/code>. The checker list remains empty: human authorship of the source does not assert human checking of its database transcription. A proved status here includes <strong>an application of a cited source theorem<\/strong>; it does not mean that every published proof has been independently audited. The record states when a source supplies no expanded proof.<\/p>\n<p>Countermodels witness non-implication. Source-based existence models are not implemented comparison algorithms. The executable checks verify selected concrete witness calculations, not arbitrary infinite or nonconstructive claims.<\/p>\n<p>The two “Failure of …” nodes express genuine negations, recorded with explicit <code>negates<\/code> links. If the background implies both sides of either pair, the graph displays a red inconsistency warning and hides all arrows. This check uses proved results under the current source filters. The inference engine still uses positive Horn rules; it does not infer arbitrary statements from a contradiction. Missing arrows and missing model flags mean <strong>not recorded<\/strong>.<\/p>\n", "contribute_md": "# Contribute\n\nEmail me (Zach) at [zacharyw.goodsell@gmail.com](mailto:zacharyw.goodsell@gmail.com) with further suggestions.\n\nTo contribute to Unbounded Utility, please include **[Unbounded Utility]** in the subject line of your email. You can suggest a new principle, establish a new result, or define a new model, along with supporting documents if necessary (e.g. a PDF or Markdown file). I will be sure to record your role in the contribution if I add it to this page. Thank you!\n\nTo contribute to the Logical Maps project in general, please include **[Logical Maps]** in the subject line.\n", "contribute_html": "<h1 id=\"contribute\">Contribute<\/h1>\n<p>Email me (Zach) at <a href=\"mailto:zacharyw.goodsell@gmail.com\">zacharyw.goodsell@gmail.com<\/a> with further suggestions.<\/p>\n<p>To contribute to Unbounded Utility, please include <strong>[Unbounded Utility]<\/strong> in the subject line of your email. You can suggest a new principle, establish a new result, or define a new model, along with supporting documents if necessary (e.g. a PDF or Markdown file). I will be sure to record your role in the contribution if I add it to this page. Thank you!<\/p>\n<p>To contribute to the Logical Maps project in general, please include <strong>[Logical Maps]<\/strong> in the subject line.<\/p>\n", "extraction_md": "# Source extraction: 8 September 2026\n\n## Sources\n\n| Key | Supplied file | Published reference |\n| --- | --- | --- |\n| U | `sources/Nous - 2023 - Goodsell - Decision theory unbound (1).pdf` | Goodsell, *Decision theory unbound*, Noûs 58 (2024), 669–695, DOI 10.1111/nous.12473; online 2023 |\n| S | `sources/Goodsell - 2026 - Symmetries of value.pdf` | Goodsell, *Symmetries of value*, Noûs 60 (2026), 16–37, DOI 10.1111/nous.12549 |\n\nPage references in the YAML are **printed journal pages**. For U, PDF page 1\nis printed p. 669; for S, PDF page 1 is printed p. 16. Local PDFs were read\ndirectly; no other papers were used as substitute evidence.\n\n## Main extracted relations\n\nAll rows are relative to the framework in `background.md`; DTU and Sym are\nexpanded there and in each YAML record.\n\n| Relation | Source |\n| --- | --- |\n| Simple EU ⇒ Archimedean Outcomes, Restricted Totality, Restricted Stochastic Equivalence | S p. 22 n. 3; U §§2.3, 3.2 |\n| Stochastic Dominance ⇒ Stochastic Equivalence; with Archimedean Outcomes ⇒ Statewise Dominance | U pp. 678–679 |\n| Rich + Archimedean Outcomes + Stochastic Equivalence + Statewise Dominance ⇒ Stochastic Dominance | U p. 678 n. 19; real quantile translation |\n| Stochastic Equivalence + Mixture Independence ⇒ Sure-Thing | U p. 679 and p. 682 n. 28 |\n| Original DTU axiom package ⇒ Simple EU and Mixture Independence | U pp. 679–681 |\n| Rich Outcomes + Simple EU + Sure-Thing ⇒ failure of Countable Sure-Thing | U §2.3, pp. 675–676 |\n| DTU ⇒ failure of Archimedean Gambles | S p. 22 |\n| Under Rich Outcomes: shift + scale ⇔ positive affine invariance | U §4.2; S §5 |\n| Under Rich Outcomes: negative affine anti-invariance ⇔ positive affine invariance + reflection anti-invariance | S p. 24 |\n| DTU + L¹ Continuity ⇒ Expected Utility | S p. 23 |\n| DTU + Sym ⇒ shift transfer and Simple Relative Expectation | S Theorems 3–4 |\n| Under DTU + Sym: Relative Expectation ⇔ L¹ Continuity | S Corollary 5 |\n| DTU + Sym + L¹ Continuity ⇒ Folded Expectation | S Theorem 6 |\n| DTU + Sym ⇒ alternating St Petersburg ~ −1/2 and uniqueness of negative self-similarity | S Theorems 9–10 |\n| DTU + Sym + L¹ Continuity ⇒ Arroyo ~ ln 2 and Pasadena ~ ln 2 | S Theorems 8, 11 |\n| DTU + Sym + L¹ Continuity is consistent | S Theorem 2, with construction in §5 |\n| DTU does not imply Expected Utility, and is consistent with it | U Theorems 1–3, Appendix B |\n| DTU + EU + shift + reflection does not imply scale invariance | U Theorems 7, 8, 10 |\n\nThese are implications with **joint premises**, not separate arrows from each\npremise. Straightforward restrictions (for example EU ⇒ Simple EU) and the\nreflection/symmetric-neutrality observation are also recorded.\n\n## Models\n\n1. **Eventual clipped expectations** (U Theorem 2): incomplete, satisfies\n   finite EU and dominance; violates EU. Its lack of Totality has an explicit\n   alternating-St-Petersburg witness. The checks also exhibit failure of L¹\n   Continuity.\n2. **Exact ultrafilter ordering** (U Theorem 1): total, satisfies DTU, violates\n   EU. Source Theorem 10 supplies failure of scale invariance.\n3. **Continuous ultrafilter quotient** (U Theorem 3): satisfies DTU and EU,\n   shift and reflection. Source Theorem 10 supplies failure of scale invariance.\n4. **Affine-symmetric extension** (S Theorem 2): a source-attributed\n   nonconstructive existence model for DTU + Sym + L¹ Continuity. Its\n   Countable Sure-Thing and Archimedean Gambles failures follow from the same\n   St Petersburg arguments as for other DTU models.\n\nEach satisfies/violates entry is either explained in its write-up, inherited\nfrom a recorded implication, or explicitly attributed to a source theorem.\nSource-attributed is weaker evidence than an independent proof audit. The direct\nsource is identified by `certificate.source_id`; `produced_by`, `recorded_by`,\nand the empty checker list describe authorship and the separate transcription.\n\n## Provenance and display categories\n\nDirect source filters distinguish **Decision Theory Unbound** (11 records),\n**Symmetries of Value** (19 records), and **Misc.** (12 records: ten connecting\nproofs and two user-suggested conjectures). Every arrow and model retains its\nauthor, date, and precise source references.\nThe ten AI arrows are restrictions/compositions added to connect definitions:\n`totality-restricts`, `stochastic-equivalence-restricts`,\n`expected-utility-implies-simple`, `archimedean-gambles-restricts`,\n`positive-affine-implies-shift`, `positive-affine-implies-scale`,\n`shift-scale-imply-positive-affine`, `relative-implies-simple-relative`,\n`relative-implies-eu`, and `folded-implies-eu`. Their sources explicitly\nidentify the AI proof as well as the paper definitions it uses.\n\nThe graph filter groups all 31 principles into Basic decision theory (15),\nInvariance principles (7), Extensions of EUT (5), and Prospect evaluations (4).\nEach group has independent select-all/unselect-all controls. Category and\ncheckbox changes only affect display, not the underlying implication rules.\n\n## Transcription decisions and issues needing care\n\n- S p. 24 prints a same-direction sign in the displayed **Reflection\n  Anti-Invariance** definition. Read it as X≽Y iff −X≼−Y. This is forced by\n  the negative-affine definition directly above, the introduction, and the\n  subsequent proofs. It was checked visually in the PDF.\n- The intended reflection axiom uses **one fixed utility origin**, as the\n  explanatory prose on p. 24 says. Requiring reflection around every possible\n  origin would also imply shifts. The literal phrase \"for any utility\n  representation\" in that display should not silently strengthen this node.\n- U p. 673 n. 9 prints an impossible interval in the middle branch of the\n  utility definition. The normalized branch is 0≤r≤1, as required for the\n  described probabilities. The negative and greater-than-one branches are\n  kept separate.\n- U pp. 683–684 defines **clipping**: mass beyond ±t moves to the endpoints.\n  Its shorthand integral with bounds ±t must not be implemented as deleting\n  the tails. We use E[max(−t,min(X,t))]. The prose and figure were checked\n  visually. The cone discussion in S §5 inherits a related notational issue.\n- S p. 28's Pasadena prose omits `/n`; Table 2 and Theorem 11 include it.\n  This extraction uses −(−2)^n/n, probability 2^(−n).\n- S Theorem 9 repeats one strict-comparison sign in the concluding sentence;\n  the second case is the opposite strict comparison.\n- S Theorem 10's expanded formula appears to print `−a^n` where the\n  geometric recursion requires `(−a)^n`. The extracted principle records its\n  clear **uniqueness in value** conclusion. No questionable expansion is used\n  as a formula in the map.\n- S p. 27's informal comparison with a reflection needs attention to a\n  factor of two if it is used numerically. We do not import that sentence as\n  a separate theorem or algorithm.\n- U Theorem 10's displayed scale identity should be interpreted using\n  E[c_t(aX)] = a E[c_(t/a)(X)]. The printed oscillating-function witness also\n  has endpoint and normalization issues. Scale non-implication is recorded\n  as the **source theorem's claim**, not as a numerically reconstructed proof.\n\n## Deferred rather than silently asserted\n\n- S Theorem 1 states stronger non-implications even after adding L¹, Relative\n  Expectation, Weak Expectation, and Principal Value principles. The present\n  models record the weaker, clearly identified U witnesses; they are **not**\n  given these extra satisfies flags without a further proof audit.\n- Weak Expectation and Principal Value theories are discussed and distinguished\n  in S §4, but their full source definitions would need another careful pass.\n  Their relative strength is not guessed from the words \"principal value\".\n- The conjecture at the end of S §4 that DTU + Sym + L¹ entails either of those\n  theories remains a conjecture. Pasadena's evaluation does not prove it.\n- U's Coherent Extensibility concerns a class of alternative orderings and\n  extension relations, beyond this topic's single primitive preorder. Its\n  role in the consistency discussion is noted but it is not forced into an\n  axiom about an individual random variable.\n- No Rich Outcomes ⇒ Archimedean Outcomes implication has been inferred from\n  the papers' convenient identification of outcomes with ℝ.\n- No blanket EU ⇒ affine symmetry, EU ⇒ full Stochastic Equivalence, or\n  Countable Sure-Thing equivalence is asserted. EU only governs integrable\n  variables; full symmetry and law invariance cover more variables.\n- The two explicit negation pairs now have `negates` links. A background\n  deriving both sides triggers a red graph warning and suppresses arrows.\n  This is a consistency check; the Horn rules do not use explosion.\n\n## Reproduce\n\n### Candidate additions from the user\n\nTwo further **human-proposed conjectures** were recorded on 8 September 2026:\n\n- Countable Sure-Thing + Archimedean Outcomes ⇒ Archimedean Gambles.\n- Countable Sure-Thing + Simple EU ⇒ Expected Utility.\n\nThese supplement the 36 proved records above. They appear in Conjectures and\nas dashed arrows when the graph's Conjectures option is enabled; they do not\nparticipate in proved deductions. Each record identifies the user's proposal\nas its source and lists the remaining verification work. The Russell–Isaacs\nreference attached to the first is related literature, not a verified\nattribution of the exact two-premise claim.\n\nThe map is deliberately selective and can grow through later additions.\nAn unrecorded implication need not be an open problem in the literature.\n\n### Commands\n\nFrom `principle-map-GENERIC/`, with its Python requirements installed:\n\n```sh\npython3 scripts/pmap.py validate unbounded-utility\npython3 topics/unbounded-utility/checks/countermodels.py\npython3 scripts/pmap.py build unbounded-utility --no-pdf\n```\n\nOpen `build/unbounded-utility/index.html`. Source YAML, the framework, and\nwrite-ups remain under `topics/unbounded-utility/`; the original example topic\nand shared renderer are unchanged.\n"};

// ---------------------------------------------------------------- engine (mirrors scripts/pmap.py)
function closure(seed, rules, background) {
  const facts = new Set([...background, ...seed]);
  const why = new Map(); for (const f of facts) why.set(f, null);
  let changed = true;
  while (changed) {
    changed = false;
    for (const r of rules) if (!facts.has(r.conclusion) && r.premises.every(p => facts.has(p))) { facts.add(r.conclusion); why.set(r.conclusion, r.id); changed = true; }
  }
  return { facts, why };
}
function chain(target, why, byId) {
  const out = [], seen = new Set();
  (function visit(f) { const rid = why.get(f); if (rid == null || seen.has(rid)) return; seen.add(rid); for (const p of byId.get(rid).premises) visit(p); out.push(rid); })(target);
  return out;
}
class Engine {
  constructor(ids, results, models, background) {
    this.ids = ids; this.background = background; this.rules = results; this.byId = new Map(results.map(r => [r.id, r])); this.models = models;
    this.holds = new Map(); this.fails = new Map(); this.failWhy = new Map();
    for (const m of models) {
      this.holds.set(m.id, closure(m.satisfies, results, background).facts);
      const f = new Set(), fw = new Map();
      for (const c of ids) {
        const { facts, why } = closure([...m.satisfies, c], results, background);
        const hit = m.violates.find(v => facts.has(v));
        if (hit !== undefined) { f.add(c); fw.set(c, [m.id, ...chain(hit, why, this.byId)]); }
      }
      this.fails.set(m.id, f); this.failWhy.set(m.id, fw);
    }
  }
  cl(P) { return closure(P, this.rules, this.background); }
  entails(P, c) { const { facts, why } = this.cl(P); return facts.has(c) ? chain(c, why, this.byId) : null; }
  separates(P, c) { return this.models.filter(m => P.every(p => this.holds.get(m.id).has(p)) && this.fails.get(m.id).has(c)); }
  pair(a, b) {
    const via = this.entails([a], b); if (via) return { status: 'implies', via };
    const ms = this.separates([a], b); if (ms.length) return { status: 'independent', via: this.failWhy.get(ms[0].id).get(b), models: ms.map(m => m.id) };
    return { status: 'open', via: [] };
  }
  package(P) {
    const { facts, why } = this.cl(P); const out = { entails: [], separated: [], open: [] };
    for (const c of this.ids) {
      if (P.includes(c)) continue;
      if (facts.has(c)) out.entails.push([c, chain(c, why, this.byId)]);
      else { const ms = this.separates(P, c); if (ms.length) out.separated.push([c, ms.map(m => m.id)]); else out.open.push([c, []]); }
    }
    return out;
  }
}

function computeLayout(g) {

// ---------------------------------------------------------------- render graph
const svg = document.getElementById('graph');
const view = { k: 1, tx: 0, ty: 0 };
function edgePath(e, L) {

  let x1 = L.x.get(e.from), y1 = L.y.get(e.from) + s.h / 2, x2 = L.x.get(e.to), y2 = L.y.get(e.to) - t.h / 2;

    y1 = L.y.get(e.from) - s.h / 2; y2 = L.y.get(e.to) + t.h / 2;
    const dy = Math.max(30, (y1 - y2) / 2);
    return `M${x1},${y1} C${x1},${y1 - dy} ${x2},${y2 + dy} ${x2},${y2}`;
  }
  const dy = Math.max(30, (y2 - y1) / 2);

}
function renderGraph() {

  if (backgroundConflicts.length) {
    const { why } = E.cl([]);
    warning.innerHTML = `<h2>Background is inconsistent</h2><p>The background assumptions imply both a principle and its negation. All graph arrows are hidden.</p><ul>${backgroundConflicts.map(pair => {
      const rules = [...new Set(pair.flatMap(id => chain(id, why, E.byId)))];
      return `<li>${pair.map(id => `<button class="lnk" data-principle="${id}">${esc(name(id))}</button>`).join(' conflicts with ')}${rules.length ? `<details><summary>Supporting results</summary><ul>${rules.map(id => `<li><button class="lnk" data-result="${id}">${resultStmt(byRid.get(id))}</button> ${certBadges(byRid.get(id))}</li>`).join('')}</ul></details>` : '<div>Both are assumed in the background.</div>'}</li>`;

    const conj = e.type !== 'derived' && e.r.status === 'conjectured';

    edgesHtml += `<g class="edge-g" data-edge="${esc(key)}" data-from="${e.from}" data-to="${e.to}"${source ? ` data-source="${esc(source.id)}" style="--source-color:${sourceColor(source)}"` : ''}><path class="edge-hit" d="${edgePath(e, L)}"/><path class="edge ${cls}${conj ? ' conjectured' : ''}${lean ? ' lean' : ''}" d="${edgePath(e, L)}" ${marker}/></g>`;

    } else {

function applyView() { const vp = document.getElementById('vp'); if (vp) vp.setAttribute('transform', `translate(${view.tx},${view.ty}) scale(${view.k})`); }

  const L = layout; if (!L || !L.visible.length) return;

  const ys = L.visible.map(n => L.y.get(n.id) - L.size.get(n.id).h / 2), ye = L.visible.map(n => L.y.get(n.id) + L.size.get(n.id).h / 2);

// pan / zoom
(function () {
  let drag = null;
  svg.addEventListener('pointerdown', ev => { if (ev.button !== 0) return; drag = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty, moved: false, target: ev.target }; svg.setPointerCapture(ev.pointerId); });
  svg.addEventListener('pointermove', ev => { if (!drag) return; const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; view.tx = drag.tx + dx; view.ty = drag.ty + dy; applyView(); });
  svg.addEventListener('pointerup', () => { if (drag && !drag.moved) handleGraphClick(drag.target); drag = null; });
  svg.addEventListener('wheel', ev => { ev.preventDefault(); const f = Math.exp(-ev.deltaY * 0.0015); const r = svg.getBoundingClientRect(); const mx = ev.clientX - r.left, my = ev.clientY - r.top; view.tx = mx - (mx - view.tx) * f; view.ty = my - (my - view.ty) * f; view.k *= f; applyView(); }, { passive: false });
  svg.addEventListener('pointermove', ev => { const t = ev.target.closest('.node,.junction,.edge-g'); hover(t ? (t.dataset.class ? { node: t.dataset.class } : { result: t.dataset.result || t.dataset.edge }) : null); });
  svg.addEventListener('pointerleave', () => hover(null));
})();
function handleGraphClick(target) {
  const t = target.closest('.node,.junction,.edge-g');
  if (!t) { select(null); return; }
  if (t.dataset.class) select({ type: 'principle', id: target.closest('[data-principle]')?.dataset.principle || t.dataset.members.split(',')[0] });
  else if (t.dataset.result) select({ type: 'result', id: t.dataset.result });
  else if (t.dataset.edge) { const key = t.dataset.edge; if (key.startsWith('d:')) { const [i, j] = key.slice(2).split('>').map(Number); select({ type: 'pair', a: A.classes[i][0], b: A.classes[j][0] }); } else select({ type: 'result', id: key }); }
}
function hover(h) {
  const nodes = svg.querySelectorAll('.node,.junction'), edges = svg.querySelectorAll('.edge-g');
  if (!h) { nodes.forEach(n => n.classList.remove('dim', 'hot')); edges.forEach(e => e.classList.remove('dim', 'hot')); return; }
  const hotNodes = new Set(), hotEdges = new Set();
  if (h.node) {
    hotNodes.add(h.node);
    edges.forEach(e => { if (e.dataset.from === h.node || e.dataset.to === h.node) { hotEdges.add(e.dataset.edge); hotNodes.add(e.dataset.from); hotNodes.add(e.dataset.to); } });
    // junction: include its other endpoints
    edges.forEach(e => { if (hotNodes.has(e.dataset.from) && e.dataset.from.startsWith('j:') || hotNodes.has(e.dataset.to) && e.dataset.to.startsWith('j:')) { hotEdges.add(e.dataset.edge); hotNodes.add(e.dataset.from); hotNodes.add(e.dataset.to); } });
  } else if (h.result) {
    edges.forEach(e => { if (e.dataset.edge === h.result) { hotEdges.add(e.dataset.edge); hotNodes.add(e.dataset.from); hotNodes.add(e.dataset.to); } });

// ---------------------------------------------------------------- model explorer
function principleOrder() { return layout ? [...new Set(layout.layers.flat().filter(n => n.kind === 'class').flatMap(n => n.members).concat(ids))] : ids; }
function modelEvidence(m, c) {
  if (!m || !passes(m) || (m.status !== 'proved' && !state.showConj)) return null;
  if (m.satisfies.includes(c)) return { value: true, items: [m], rules: [], direct: true };
  if (m.violates.includes(c)) return { value: false, items: [m], rules: [], direct: true };
  if (m.status !== 'proved') return null;
  let value, rules, contradiction;
  if (baseE.holds.get(m.id)?.has(c)) {
    value = true;
    rules = chain(c, baseE.cl(m.satisfies).why, baseE.byId);
  } else if (baseE.fails.get(m.id)?.has(c)) {
    value = false;
    const trial = baseE.cl([...m.satisfies, c]);
    contradiction = m.violates.find(v => trial.facts.has(v));
    rules = chain(contradiction, trial.why, baseE.byId);
  } else return null;
  return { value, rules, contradiction, direct: false, items: [m, ...rules.map(id => byRid.get(id))] };
}
function evidenceBadges(e) {

const modelBackgroundSlots = new Map();
function principleGroups() {

function renderModels() {

  const IN = [...new Set([...background, ...state.pkg])], OUT = [...state.out];

  let h = `<div class="ex"><div class="ex-col"><div class="ex-head">Principles <button class="btn small" id="ex-clear">clear</button></div>`;
  h += `<p class="background-hint">${inspected ? `Inspecting <b>${esc(inspected.name)}</b>. Click a verdict for its evidence. <button class="lnk" id="ex-deselect">clear selection</button>` : 'Click a model to inspect its principles. Use ✓ / ✗ to filter models.'}</p>`;

  }

  for (const m of ms) {

  h += `</div></div>`;
