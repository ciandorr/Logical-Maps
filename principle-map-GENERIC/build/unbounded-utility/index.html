<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbounded utility: random variables</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F4F5F7;
    --panel: #FFFFFF;
    --panel-2: #EEF0F3;
    --line: #D8DCE2;
    --line-strong: #B9BFC8;
    --ink: #1B2230;
    --ink-2: #4B5563;
    --ink-3: #7C8594;
    --accent: #2B3F6B;
    --human: #2E6F95;
    --assisted: #6E5BA6;
    --ai: #C4762B;
    --derived: #8A9098;
    --indep: #B8394B;
    --open: #E3E6EA;
    --open-ink: #8A9098;
    --conj: #C9A227;
    --node-fill: #FFFFFF;
    --node-stroke: #8E96A3;
    --junction: #4B5563;
    --hl: #FFF3C4;
    --focus: #2B3F6B;
    --shadow: 0 1px 2px rgba(27,34,48,.08), 0 6px 18px rgba(27,34,48,.06);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151920; --panel: #1D2230; --panel-2: #242A38; --line: #313849; --line-strong: #454D60;
      --ink: #E6E9EF; --ink-2: #B4BAC6; --ink-3: #7F8798; --accent: #9DB4E6;
      --human: #5FA3CC; --assisted: #A594DB; --ai: #E09A55; --derived: #7B8393; --indep: #E06A7A;
      --open: #2A3140; --open-ink: #6B7383; --conj: #D9B64A;
      --node-fill: #232938; --node-stroke: #5A6274; --junction: #B4BAC6; --hl: #3B3A22; --focus: #9DB4E6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151920; --panel: #1D2230; --panel-2: #242A38; --line: #313849; --line-strong: #454D60;
    --ink: #E6E9EF; --ink-2: #B4BAC6; --ink-3: #7F8798; --accent: #9DB4E6;
    --human: #5FA3CC; --assisted: #A594DB; --ai: #E09A55; --derived: #7B8393; --indep: #E06A7A;
    --open: #2A3140; --open-ink: #6B7383; --conj: #D9B64A;
    --node-fill: #232938; --node-stroke: #5A6274; --junction: #B4BAC6; --hl: #3B3A22; --focus: #9DB4E6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header.top { display: flex; align-items: baseline; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header.top h1 { font: 600 22px/1.2 var(--serif); margin: 0; text-wrap: balance; }
  header.top .sub { color: var(--ink-3); font-size: 12.5px; max-width: 80ch; }
  .stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chip b { color: var(--ink); font-weight: 600; }

  .body { display: grid; grid-template-columns: 1fr; min-height: 0; }
  @media (max-width: 1100px) { .detail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
  aside.controls { min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); display: grid; grid-template-rows: minmax(0, 1fr) 9px var(--background-height, clamp(145px, 27vh, 230px)); }
  .controls-scroll { min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; scrollbar-gutter: stable; overflow-anchor: none; }
  .background-dock { min-height: 0; border-top: 1px solid var(--line-strong); padding: 12px 16px; display: flex; flex-direction: column; gap: 7px; background: var(--panel-2); }
  .background-dock h2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .background-dock h2 .lnk { margin-left: auto; }
  .background-hint, .background-status { font-size: 11px; color: var(--ink-3); margin: 0; }
  #background-list { overflow: auto; min-height: 0; flex: 1; scrollbar-gutter: stable; overflow-anchor: none; }
  .background-row, .pr-row { display: flex; align-items: flex-start; gap: 6px; }
  .background-row { font-size: 12px; padding: 3px 0; }
  .background-row .lnk, .pr-row .principle-name { flex: 1; min-width: 0; }
  .pr-row .principle-name { color: var(--ink); text-align: left; }
  .pr-row input[type=checkbox] { flex: none; margin: 3px 2px 0 0; cursor: pointer; }
  .background-row.is-removed, .pr-row.in-background { visibility: hidden; pointer-events: none; }
  .background-row.is-collapsed, .pr-row.is-collapsed { display: none; }
  .background-move { flex: none; min-width: 23px; padding: 0 3px; border: 1px solid var(--line); border-radius: 4px; color: var(--accent); background: var(--panel); cursor: pointer; }
  .background-move:hover { border-color: var(--accent); }
  .background-fixed { color: var(--ink-3); font-size: 10px; }
  aside.controls h2 .lnk { font: inherit; text-transform: none; letter-spacing: 0; margin-left: 6px; }
  aside.controls h2, .detail h2 { font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .ctl { display: flex; flex-direction: column; gap: 6px; }
  .ctl label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .ctl input[type=checkbox] { accent-color: var(--accent); }
  #pr-filters { gap: 16px; }
  .pr-category { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .pr-category:first-child { border-top: 0; padding-top: 0; }
  .pr-category h3 { font: 600 13px/1.35 var(--sans); color: var(--ink); margin: 0 0 5px; }
  .pr-category-actions { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 9px; font-size: 11px; }
  .pr-category-actions .lnk:disabled { opacity: .45; cursor: default; }
  .pr-category-count { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }
  .pr-category .principle-name { font-size: 13px; }
  .pr-category input { flex: none; margin-top: 3px; }
  .sw { width: 22px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
  .sw.dotted { border-top-style: dotted; }
  .sw.dashed { border-top-style: dashed; }
  .sw.human { border-color: var(--human); } .sw.assisted { border-color: var(--assisted); } .sw.ai { border-color: var(--ai); }
  .sw.derived { border-color: var(--derived); } .sw.conj { border-color: var(--conj); }
  .search { width: 260px; margin: 0 0 12px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); }
  .legend-note { color: var(--ink-3); font-size: 12px; }
  .framework { font-size: 12.5px; color: var(--ink-2); }
  .framework p { margin: 0 0 6px; }
  .btn { padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); cursor: pointer; }
  .btn:hover { background: var(--panel-2); }
  .btn.small { padding: 3px 8px; font-size: 12px; }

  main { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
  .tabs { display: flex; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { padding: 8px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: none; cursor: pointer; color: var(--ink-2); }
  .tab[aria-selected="true"] { background: var(--bg); border-color: var(--line); color: var(--ink); margin-bottom: -1px; }
  .tab .n { color: var(--ink-3); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .pane { display: none; min-height: 0; overflow: auto; }
  .pane[data-active="true"] { display: block; }
  #pane-graph[data-active="true"] { display: grid; grid-template-columns: var(--sidebar-width, 250px) 9px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  .pane-divider { position: relative; background: var(--panel-2); touch-action: none; user-select: none; z-index: 2; }
  .pane-divider::after { content: ''; position: absolute; border-radius: 3px; background: var(--line-strong); }
  .pane-divider[aria-orientation="vertical"] { cursor: col-resize; }
  .pane-divider[aria-orientation="vertical"]::after { width: 3px; height: 36px; top: calc(50% - 18px); left: 3px; }
  .pane-divider[aria-orientation="horizontal"] { cursor: row-resize; }
  .pane-divider[aria-orientation="horizontal"]::after { height: 3px; width: 36px; left: calc(50% - 18px); top: 3px; }
  .pane-divider:hover, .pane-divider:focus-visible, .pane-divider.dragging { background: var(--hl); }
  .pane-divider:focus-visible { outline-offset: -2px; }
  .pane-divider:hover::after, .pane-divider:focus-visible::after, .pane-divider.dragging::after { background: var(--accent); }
  body.resizing-panes, body.resizing-panes * { cursor: var(--resize-cursor) !important; user-select: none !important; }
  .graph-area { position: relative; overflow: hidden; min-width: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #graph:active { cursor: grabbing; }
  .graph-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
  .graph-warning { position: absolute; inset: 24px; overflow: auto; padding: 24px; border: 2px solid #b42318; border-radius: 8px; background: #fff1f0; color: #b42318; }
  .graph-warning h2 { margin: 0 0 12px; font-size: 21px; }
  .graph-warning .lnk { color: #912018; text-decoration: underline; }
  .graph-warning li { margin: 10px 0; }

  /* SVG */
  .edge { fill: none; stroke-width: 1.6; }
  .edge.source { stroke: var(--source-color); }
  .badge.source { background: var(--source-color); }
  .source-group { border: 0; margin: 0; padding: 0; min-width: 0; }
  .source-group legend { font-size: 11px; color: var(--ink-3); margin-bottom: 5px; }
  .source-group label { font-size: 12px; margin-bottom: 6px; }
  .model-category { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .model-category h3 { font-size: 13px; margin: 0 0 8px; }
  .edge.human { stroke: var(--human); } .edge.assisted { stroke: var(--assisted); } .edge.ai { stroke: var(--ai); }
  .edge.derived { stroke: var(--derived); stroke-dasharray: 2 4; stroke-width: 1.3; }
  .edge.conjectured { stroke-dasharray: 7 5; }
  .edge.lean { stroke-width: 3; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .edge-g.dim .edge { opacity: .18; }
  .edge-g.hot .edge { stroke-width: 3; }
  .node { cursor: pointer; }
  .node rect { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.2; }
  .node.dim { opacity: .3; }
  .node.hot rect, .node.selected rect { stroke: var(--accent); stroke-width: 2.2; }
  .node.selected rect { fill: var(--hl); }
  .node.from-background rect { fill: var(--hl); stroke: var(--accent); }
  .node text { font: 500 12.5px var(--sans); fill: var(--ink); pointer-events: none; }
  .node text[data-principle] { pointer-events: auto; cursor: pointer; }
  .node text.equiv { font-size: 10.5px; fill: var(--ink-3); }
  .node.iso rect { stroke-dasharray: 4 3; }
  .junction { cursor: pointer; }
  .junction circle { fill: var(--panel); stroke: var(--junction); stroke-width: 1.4; }
  .junction.source circle { stroke: var(--source-color); }
  .junction.human circle { stroke: var(--human); } .junction.assisted circle { stroke: var(--assisted); } .junction.ai circle { stroke: var(--ai); }
  .junction text { font: 600 10px var(--sans); fill: var(--ink-2); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .junction.dim { opacity: .3; }
  .layer-label { font: 400 10px var(--mono); fill: var(--ink-3); }

  /* matrix */
  .matrix-wrap { padding: 16px 20px; }
  table.matrix { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
  table.matrix th { font-weight: 500; color: var(--ink-2); text-align: left; padding: 2px 6px; white-space: nowrap; }
  table.matrix th.col { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; vertical-align: bottom; height: 215px; padding: 6px 2px; }
  table.matrix td { width: 26px; height: 26px; border-radius: 3px; cursor: pointer; text-align: center; font: 500 10px var(--mono); }
  td.c-implies { background: var(--human); color: #fff; }
  td.c-implies.prov-ai { background: var(--ai); } td.c-implies.prov-assisted { background: var(--assisted); }
  td.c-derived { background: color-mix(in srgb, var(--human) 45%, var(--panel)); }
  td.c-independent { background: var(--indep); color: #fff; }
  td.c-independent.derived { background: color-mix(in srgb, var(--indep) 45%, var(--panel)); }
  td.c-open { background: var(--open); color: var(--open-ink); }
  td.c-conj { background: repeating-linear-gradient(45deg, var(--open) 0 4px, color-mix(in srgb, var(--conj) 50%, var(--panel)) 4px 8px); }
  td.c-self { background: transparent; cursor: default; }
  td.hot { outline: 2px solid var(--accent); }
  .matrix-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 0; font-size: 12px; color: var(--ink-2); }
  .matrix-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .matrix-legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .matrix-wrap p.hint { color: var(--ink-3); font-size: 12.5px; margin: 0 0 12px; max-width: 65ch; }

  /* lists */
  .list { padding: 16px 20px; }
  table.results { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.results th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.results td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.results tr { cursor: pointer; }
  table.results tr:hover td { background: var(--panel-2); }
  table.results tr.filtered td { opacity: .4; }
  .stmt { font-family: var(--serif); font-size: 14px; }
  .open-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .open-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; font-family: var(--serif); }
  .open-item:hover { border-color: var(--accent); }
  .list h3 { font: 600 16px var(--serif); margin: 18px 0 8px; }
  .list h3:first-child { margin-top: 0; }
  .list p.hint { color: var(--ink-3); font-size: 12.5px; max-width: 65ch; margin: 0 0 12px; }

  /* badges */
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font: 500 11px var(--sans); letter-spacing: .02em; color: #fff; white-space: nowrap; }
  .badge.source { white-space: normal; }
  .badge.human { background: var(--human); } .badge.assisted { background: var(--assisted); } .badge.ai { background: var(--ai); }
  .badge.lean { background: transparent; color: var(--ink-2); border: 1px solid var(--line-strong); }
  .badge.lean.verified { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .badge.conj { background: var(--conj); color: #1B2230; }
  .badge.kind { background: var(--panel-2); color: var(--ink-2); }
  .badge.indep { background: var(--indep); }

  /* detail */
  .detail { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px 18px; }
  .detail .empty { color: var(--ink-3); font-size: 13px; }
  .detail h2.title { font: 600 18px/1.25 var(--serif); letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0 0 4px; text-wrap: balance; }
  .detail .id { font: 12px var(--mono); color: var(--ink-3); margin-bottom: 10px; }
  .detail .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .detail .statement { font: 15px/1.5 var(--serif); margin: 0 0 12px; }
  .detail .formal { font: 12px var(--mono); background: var(--panel-2); padding: 6px 8px; border-radius: 4px; overflow-x: auto; margin: 0 0 12px; }
  .detail .proof { font: 13px/1.5 var(--serif); background: var(--panel-2); padding: 10px 12px; border-radius: 6px; margin: 0 0 12px; }
  .detail dl { margin: 0 0 12px; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; }
  .detail dt { color: var(--ink-3); }
  .detail dd { margin: 0; }
  .detail ul.rel { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .detail ul.rel li { display: flex; gap: 6px; align-items: baseline; }
  .detail ul.rel button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
  .detail ul.rel button:hover { text-decoration: underline; }
  .detail .via { font: 11px var(--mono); color: var(--ink-3); }
  .detail .src { font-size: 12.5px; color: var(--ink-2); padding-left: 16px; margin: 0 0 12px; }
  .detail .file { font: 11px var(--mono); color: var(--ink-3); }
  .rel-head { font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 4px; }

  @media (prefers-reduced-motion: no-preference) { .node rect, .edge { transition: opacity .15s, stroke-width .15s; } }

  /* additions */
  .pkg-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; background: var(--panel); font-size: 13px; }
  .pill.on { background: var(--hl); border-color: var(--accent); }
  .pill input { margin: 0; accent-color: var(--accent); }
  .pkg-head { font: 600 16px var(--serif); margin: 4px 0 10px; }
  .note { font-size: 12.5px; color: var(--ink-2); }
  .warn { color: var(--indep); font-size: 12.5px; }
  .mono { font: 11px var(--mono); color: var(--ink-3); }
  .dim { color: var(--ink-3); font-size: 11px; }
  .lnk { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  .lnk:hover { text-decoration: underline; }
  .list h3 .n, .list h3 span.n { color: var(--ink-3); font: 400 13px var(--sans); }
  table.matrix tr.filtered td, table.matrix tr.filtered th { opacity: .4; }
  table.matrix th button.lnk { color: var(--ink); }
  .list ul.rel { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .list ul.rel li { display: flex; gap: 8px; align-items: baseline; }
  .list ul.rel button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  .list ul.rel button:hover { text-decoration: underline; }
  .list .via { font: 11px var(--mono); color: var(--ink-3); }
  .list .via button { color: var(--ink-3); font: inherit; }
  .list .empty { color: var(--ink-3); }

  /* explorer */
  .ex { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr); gap: 28px; align-items: start; }
  .ex-head { font: 500 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
  .ex-head .n { font: 400 12px var(--mono); }
  .ex-list { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; }
  .ex-p { display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 5px; }
  .ex-p.in { background: color-mix(in srgb, var(--human) 14%, transparent); }
  .ex-p.out { background: color-mix(in srgb, var(--indep) 14%, transparent); }
  .ex-p.fin, .ex-p.fout { color: var(--ink-2); }
  .ex-p .lnk { color: var(--ink); }
  .ex-p.model-in { background: color-mix(in srgb, var(--human) 14%, transparent); }
  .ex-p.model-out { background: color-mix(in srgb, var(--indep) 14%, transparent); }
  .ex-p > .lnk { flex: 1; text-align: left; }
  .verdict { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; color: inherit; cursor: pointer; }
  .pop-sources { font-size: 12px; margin: 9px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: var(--panel); width: 26px; height: 22px; cursor: pointer; color: var(--ink-3); font-size: 12px; padding: 0; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.on { background: var(--ink); color: var(--panel); }
  .seg button.auto { color: var(--ink); background: var(--panel-2); }
  .ex-m { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  .ex-m.sel { background: var(--hl); }
  .ex-m .lnk { color: var(--ink); font: 500 13.5px var(--sans); }
  .ex-m .ex-sum { margin-left: auto; white-space: nowrap; }
  .ex .empty { color: var(--ink-3); padding: 4px 8px; }
  .models-background-dock { height: 230px; min-height: 140px; max-height: 65vh; resize: vertical; overflow: auto; border: 1px solid var(--line-strong); border-radius: 6px; margin-bottom: 22px; }
  .models-background-dock #models-background-list { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; overflow-anchor: none; }
  .models-background-dock h2 { margin: 0; font-size: 13px; }
  .model-bg-placeholder { visibility: hidden; pointer-events: none; }

  /* page */
  .page { padding: 20px 28px 40px; max-width: 78ch; }
  .page h1 { font: 600 24px/1.25 var(--serif); margin: 12px 0 8px; text-wrap: balance; }
  .page h2 { font: 500 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 8px; }
  .page .prose { font: 15px/1.55 var(--serif); }
  .page .prose.statement { font-size: 16px; }
  .page .plist { list-style: none; padding: 0; margin: 0; font: 15px/1.55 var(--serif); display: flex; flex-direction: column; gap: 6px; }
  .page .badges { display: flex; gap: 6px; margin: 0 0 10px; }
  .page dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; margin: 0; }
  .page dt { color: var(--ink-3); } .page dd { margin: 0; }
  .page .src { font-size: 13px; color: var(--ink-2); padding-left: 18px; }
  .page .file { margin-top: 24px; font: 11px var(--mono); color: var(--ink-3); }
  .page .formal { font: 12.5px var(--mono); background: var(--panel-2); padding: 6px 8px; border-radius: 4px; margin-top: 8px; overflow-x: auto; }
  .page .id { font: 12px var(--mono); color: var(--ink-3); margin-bottom: 8px; }
  .page table.results tr { cursor: default; } .page table.results tr[data-result], .page table.results tr[data-model] { cursor: pointer; }
  .nowrap { white-space: nowrap; }
  .detail .goto { margin: 0 0 12px; }

  .links { font-size: 12.5px; margin: 0 0 10px; } .links a { color: var(--accent); }
  .goto-row { display: flex; gap: 12px; align-items: center; margin: 0 0 12px; } .goto-row .goto, .goto-row .links { margin: 0; }
  .dl { display: flex; gap: 10px; font-size: 12.5px; align-self: center; } .dl a { color: var(--ink-3); }

  .pop { position: fixed; z-index: 20; max-width: 380px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px; }
  .pop .pop-t { font: 600 15px/1.3 var(--serif); margin-bottom: 4px; }
  .pop .pop-t + .pop-t { margin-top: 10px; }
  .pop .pop-s { font: 13.5px/1.45 var(--serif); }
  .pop .formal { font: 12px var(--mono); background: var(--panel-2); padding: 5px 7px; border-radius: 4px; margin-top: 6px; overflow-x: auto; }
  .pop .pop-l { font-size: 12px; color: var(--ink-2); margin-top: 6px; } .pop code { font: 12px var(--mono); }
  .pop .badges { display: flex; gap: 6px; margin: 6px 0; } .pop .links { margin: 4px 0 0; }

  .ex-p.bad { background: color-mix(in srgb, var(--indep) 32%, transparent); outline: 1.5px solid var(--indep); }
  .ex-bad { border: 1px solid var(--indep); color: var(--indep); border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; font-size: 13px; }
  .ex-bad .lnk { color: var(--indep); text-decoration: underline; }

  .prose-page { font: 15px/1.55 var(--serif); } .prose-page h2 { margin-top: 20px; } .prose-page p { margin: 0 0 10px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="dl" id="downloads"></div>
  </header>
  <div class="body">
    <main>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="background" aria-selected="false">Background</button>
        <button class="tab" role="tab" data-tab="graph" aria-selected="true">Graph</button>
        <button class="tab" role="tab" data-tab="models" aria-selected="false">Models <span class="n" id="n-models"></span></button>
        <button class="tab" role="tab" data-tab="open" aria-selected="false">Conjectures <span class="n" id="n-open"></span></button>
        <button class="tab" role="tab" data-tab="results" aria-selected="false">Changes <span class="n" id="n-results"></span></button>
        <button class="tab" role="tab" data-tab="contribute" aria-selected="false" hidden>Contribute</button>
      </div>
      <section class="pane" id="pane-graph" data-active="true">
    <aside class="controls" id="graph-sidebar">
      <div class="controls-scroll" id="principle-controls">
      <div>
        <h2>Sources</h2>
        <div class="ctl" id="source-filters"></div>
        <div class="ctl">
          <label><input type="checkbox" id="lean-only"><span class="sw" style="border-color:var(--ink)"></span>Lean-verified only</label>
        </div>
      </div>
      <div>
        <h2>Graph</h2>
        <div class="ctl">
          <label><input type="checkbox" id="show-derived"><span class="sw derived dotted"></span>Derived implications</label>
          <label><input type="checkbox" id="show-conj"><span class="sw conj dashed"></span>Conjectures</label>
          <label><input type="checkbox" id="show-iso" checked><span class="sw" style="border-style:dashed;border-color:var(--node-stroke)"></span>Isolated principles</label>
        </div>
      </div>
      <div>
        <h2>Principles <button class="lnk dim" id="pr-all">select all</button> <button class="lnk dim" id="pr-none">unselect all</button></h2>
        <div class="ctl" id="pr-filters"></div>
      </div>
      </div>
      <div class="pane-divider" id="background-divider" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize background pane" aria-controls="background-dock principle-controls" title="Drag to resize background · Arrow keys to adjust · Double-click to reset"></div>
      <section class="background-dock" id="background-dock" aria-labelledby="background-heading">
        <h2 id="background-heading">Background <span id="background-count"></span><button class="lnk" id="background-reset">reset</button></h2>
        <p class="background-hint">↓ assume a principle · ↑ return it to the list</p>
        <div id="background-list" class="ctl"></div>
        <p id="background-status" class="background-status" role="status" aria-live="polite"></p>
      </section>
    </aside>
        <div class="pane-divider" id="sidebar-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize left sidebar" aria-controls="graph-sidebar" title="Drag to resize sidebar · Arrow keys to adjust · Double-click to reset"></div>
        <div class="graph-area">
          <svg id="graph" role="img" aria-label="Implication graph"></svg>
          <div id="graph-warning" class="graph-warning" role="alert" hidden></div>
          <div class="graph-tools"><button class="btn small" id="fit">Fit</button></div>
        </div>
      </section>
      <section class="pane" id="pane-models"><div class="list" id="models"></div></section>
      <section class="pane" id="pane-results"><div class="list"><input class="search" id="search" type="search" placeholder="Filter" aria-label="Filter changes"><div id="results"></div></div></section>
      <section class="pane" id="pane-open"><div class="list" id="open"></div></section>
      <section class="pane" id="pane-page"><div class="page" id="page"></div></section>
      <section class="pane" id="pane-background"><div class="page prose-page" id="background"></div></section>
      <section class="pane" id="pane-contribute"><div class="page prose-page" id="contribute"></div></section>
    </main>
  </div>
</div>
<div id="pop" class="pop" hidden></div>

<script>
const DATA = {"topic": {"id": "unbounded-utility", "require_sources": true, "source_catalog": [{"id": "decision-theory-unbound", "name": "Decision Theory Unbound", "kind": "published-paper"}, {"id": "symmetries-of-value", "name": "Symmetries of Value", "kind": "published-paper"}, {"id": "misc", "name": "Misc.", "kind": "misc"}], "title": "Unbounded utility: random variables", "description": "First source-based extraction from Goodsell (2024, 2026). Preordering is standing; stochastic equivalence, outcome richness, and outcome Archimedeanness are explicit principles.", "framework": "Gambles are measurable outcome-valued random variables on an atomless standard probability space. All such variables are available (Prospect Richness is standing). ≽ is reflexive and transitive, not assumed total or law-invariant. Outcomes are linearly ordered, with distinct reference outcomes 0 and 1, and sure-indifferent outcomes identified. A possibly partial real utility chart is defined by binary certainty comparisons; see background.md. Rich Outcomes supplies all real levels; Archimedean Outcomes rules out outcomes beyond the finite chart. M_p(X,Y) is randomized selection, never the pointwise sum pX+(1-p)Y.", "background": [], "background_presets": [{"id": "du", "name": "DU", "category": "basic-decision-theory", "default": true, "principles": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence"]}], "notation": "X ≽ Y; X ≻ Y iff X ≽ Y and not Y ≽ X; X ~ Y iff both. L(X) is the law, X|E is X on E and sure 0 elsewhere. Numerical expressions use the normalized utility chart.", "principle_categories": [{"id": "basic-decision-theory", "name": "Basic decision theory"}, {"id": "invariance-principles", "name": "Invariance principles"}, {"id": "extensions-of-eut", "name": "Extensions of EUT"}, {"id": "prospect-evaluations", "name": "Prospect evaluations"}], "lean_lib": "UnboundedUtility"}, "principles": [{"id": "alternating-st-petersburg-value", "name": "Alternating St Petersburg = −1/2", "statement": "Every X with P(u(X)=(−2)^n)=2^(−n), n≥1, is indifferent to sure utility −1/2.", "formal": "", "tags": ["evaluation"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 9, p. 30"], "notes": "A comparison with a sure outcome, not an assertion that the ordinary expected utility exists.", "date": "2026-09-08", "category": "prospect-evaluations", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/alternating-st-petersburg-value.yaml"}, {"id": "archimedean-gambles", "name": "Archimedean Gambles", "statement": "For any gambles X ≻ Y ≻ Z, there is p ∈ (0,1) with Y ~ M_p(X,Z). Unlike Archimedean Outcomes, X,Y,Z may themselves be unbounded gambles.", "formal": "", "tags": ["mixture", "continuity"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 22, footnote 3"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/archimedean-gambles.yaml"}, {"id": "archimedean-outcomes", "name": "Archimedean Outcomes", "statement": "For any three sure outcomes a ≻ b ≻ c, some nontrivial mixture of the outer two is equally good as the intermediate one: b ~ M_p(a,c) for some p ∈ (0,1). Only the three inputs are sure outcomes. This is the no-infinite-ratios condition, not continuity of preferences over arbitrary gambles.", "formal": "a ≻ b ≻ c ⇒ ∃p∈(0,1): b ~ M_p(a,c)", "tags": ["outcomes"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 22, footnote 3", "Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, p. 678"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Symmetries of Value", "Decision Theory Unbound"], "lean_def": "UnboundedUtility.ArchimedeanOutcomes", "file": "topics/unbounded-utility/principles/archimedean-outcomes.yaml"}, {"id": "arroyo-value", "name": "Arroyo = ln 2", "statement": "Every X with P(u(X)=(−1)^(n+1)(n+1))=1/[n(n+1)], n≥1, is indifferent to sure utility ln 2.", "formal": "", "tags": ["evaluation"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 8, pp. 29–30"], "notes": "A comparison with a sure outcome, not an assertion that the ordinary expected utility exists.", "date": "2026-09-08", "category": "prospect-evaluations", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/arroyo-value.yaml"}, {"id": "countable-sure-thing", "name": "Countable Sure-Thing", "statement": "For every countable measurable partition (E_n) into events of positive probability, if X|E_n ≽ Y|E_n for every n, then X ≽ Y. If one conditional comparison is strict, X ≻ Y.", "formal": "", "tags": ["conditioning", "countable"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.2, p. 674"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/principles/countable-sure-thing.yaml"}, {"id": "expected-utility", "name": "Expected Utility", "statement": "The normalized chart u is defined on all outcomes and is measurable. Whenever u(X),u(Y) are integrable, X ≽ Y iff E[u(X)] ≥ E[u(Y)]. Expectations here are finite Lebesgue expectations; this says nothing about two +∞ expectations or conditionally convergent sums.", "formal": "", "tags": ["expectation"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.1, p. 685", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 23"], "notes": "", "date": "2026-09-08", "category": "extensions-of-eut", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "lean_def": "UnboundedUtility.ExpectedUtility", "file": "topics/unbounded-utility/principles/expected-utility.yaml"}, {"id": "failure-archimedean-gambles", "name": "Failure of Archimedean Gambles", "negates": "archimedean-gambles", "statement": "There exist X ≻ Y ≻ Z such that no p ∈ (0,1) satisfies Y ~ M_p(X,Z).", "formal": "", "tags": ["incompatibility"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 22"], "notes": "Logical negation of archimedean-gambles; the negates link enables inconsistency detection.", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/failure-archimedean-gambles.yaml"}, {"id": "failure-countable-sure-thing", "name": "Failure of Countable Sure-Thing", "negates": "countable-sure-thing", "statement": "Countable Sure-Thing is false: there are X,Y and a countable positive-probability partition satisfying its conditional premises but failing its corresponding weak or strict conclusion.", "formal": "", "tags": ["incompatibility"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §§2.2–2.3, pp. 674–676"], "notes": "This node is the logical negation of countable-sure-thing. The negates link enables inconsistency detection; see extraction.md.", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/principles/failure-countable-sure-thing.yaml"}, {"id": "folded-expectation", "name": "Folded Expectation", "statement": "Put h_X(t)=P(u(X)>t)−P(u(X)<−t) for t≥0. If ∫₀∞|h_X(t)|dt and ∫₀∞|h_Y(t)|dt are finite, compare X,Y exactly by F(X)=∫₀∞h_X(t)dt and F(Y). Boundary atoms do not change these integrals.", "formal": "", "tags": ["expectation"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, pp. 27–29"], "notes": "Absolute Lebesgue integrability of the combined tail difference is essential. Mere convergence of an improper integral is a different proposal. Symmetric laws have F=0, however heavy their tails.", "date": "2026-09-08", "category": "extensions-of-eut", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/folded-expectation.yaml"}, {"id": "independence", "name": "Mixture Independence", "statement": "For all X,Y,Z and 0<p<1, X ≽ Y iff M_p(X,Z) ≽ M_p(Y,Z), where M is the fixed randomized-selection construction described in the background.", "formal": "X ≽ Y ⇔ M_p(X,Z) ≽ M_p(Y,Z)", "tags": ["mixture"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, p. 679", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 23"], "notes": "Mixture identities are identities in law; without Stochastic Equivalence they cannot be substituted as preference identities. Bridges to Sure-Thing explicitly retain Stochastic Equivalence.", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "lean_def": "UnboundedUtility.MixtureIndependence", "file": "topics/unbounded-utility/principles/independence.yaml"}, {"id": "l1-continuity", "name": "L¹ Continuity (random variables)", "statement": "On variables with real utility levels, if E|u(X_n)−u(X)| → 0 and X_n ≽ Y for every n, then X ≽ Y. Only the upper-section clause is imposed, matching the paper. Distance can be infinite between other pairs.", "formal": "E|u(X_n)−u(X)|→0 and ∀n X_n ≽ Y ⇒ X ≽ Y", "tags": ["continuity"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 23"], "notes": "Uses the actual coupling of random variables, so does not build in law invariance. With Stochastic Equivalence and the standing availability of all variables this is equivalent to the paper’s extended Wasserstein-1 (infimum-over-couplings) formulation; see writeups/l1-translation.md.", "date": "2026-09-08", "category": "extensions-of-eut", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/l1-continuity.yaml"}, {"id": "negative-affine-anti-invariance", "name": "Negative Affine Anti-Invariance", "statement": "For all real a>0 and b, X ≽ Y iff −aY+b ≽ −aX+b.", "formal": "", "tags": ["symmetry"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.2, pp. 686–688", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24"], "notes": "Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes available. The source’s full ℝ setting is supplied by Rich Outcomes and Simple EU in theorem packages.", "date": "2026-09-08", "category": "invariance-principles", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "file": "topics/unbounded-utility/principles/negative-affine-anti-invariance.yaml"}, {"id": "negative-self-similarity", "name": "Uniqueness of Negative Self-Similarity", "statement": "Fix 0<p<1, a>0, b∈ℝ and Z. If X ~ M_p(−aX+b,Z) and Y ~ M_p(−aY+b,Z), then X ~ Y. This records the uniqueness-in-value content of Theorem 10.", "formal": "", "tags": ["mixture", "symmetry"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 10, pp. 30–31"], "notes": "The paper also supplies a geometric-mixture solution. Its expanded formula has an apparent sign/power typo; the extraction records the unambiguous uniqueness statement.", "date": "2026-09-08", "category": "invariance-principles", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/negative-self-similarity.yaml"}, {"id": "pasadena-value", "name": "Pasadena = ln 2", "statement": "Every X with P(u(X)=−(−2)^n/n)=2^(−n), n≥1, is indifferent to sure utility ln 2.", "formal": "", "tags": ["evaluation"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 11, pp. 32–33"], "notes": "A comparison with a sure outcome, not an assertion that the ordinary expected utility exists.", "date": "2026-09-08", "category": "prospect-evaluations", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/pasadena-value.yaml"}, {"id": "positive-affine-invariance", "name": "Positive Affine Invariance", "statement": "For all real a>0 and b, X ≽ Y iff aX+b ≽ aY+b.", "formal": "", "tags": ["symmetry"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.2, pp. 686–688", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24"], "notes": "Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes available. The source’s full ℝ setting is supplied by Rich Outcomes and Simple EU in theorem packages.", "date": "2026-09-08", "category": "invariance-principles", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "file": "topics/unbounded-utility/principles/positive-affine-invariance.yaml"}, {"id": "reflection-anti-invariance", "name": "Reflection Anti-Invariance", "statement": "X ≽ Y iff −Y ≽ −X, using the one fixed normalized origin 0.", "formal": "", "tags": ["symmetry"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.2, pp. 686–688", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24"], "notes": "Arithmetic changes outcomes via their utility levels; it is not a relabeling of the utility function. Applies to finite-level variables when the indicated outcome transformation is available. Full-group implications explicitly assume Rich Outcomes. Reflection reverses the comparison; the displayed same-direction sign on p. 24 of Symmetries is a source typo, as its other definitions and proofs confirm.", "date": "2026-09-08", "category": "invariance-principles", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "file": "topics/unbounded-utility/principles/reflection-anti-invariance.yaml"}, {"id": "relative-expectation", "name": "Relative Expectation", "statement": "For real-utility variables X,Y on the same probability space, if E|u(X)−u(Y)|<∞, then X ≽ Y iff E[u(X)−u(Y)] ≥ 0. Their individual expectations may both be undefined.", "formal": "", "tags": ["expectation", "relative"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, p. 26"], "notes": "This is a same-space random-variable principle. Stochastic Equivalence is retained separately when importing the paper’s arbitrary-coupling formulation about laws.", "date": "2026-09-08", "category": "extensions-of-eut", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/relative-expectation.yaml"}, {"id": "restricted-stochastic-equivalence", "name": "Restricted Stochastic Equivalence", "statement": "If simple gambles X,Y have the same law, then X ~ Y.", "formal": "", "tags": ["distribution", "finite"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.3, p. 675"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "lean_def": "UnboundedUtility.RestrictedStochasticEquivalence", "file": "topics/unbounded-utility/principles/restricted-stochastic-equivalence.yaml"}, {"id": "restricted-totality", "name": "Restricted Totality", "statement": "Every two simple (finite-valued) gambles are comparable. Outcome comparability is already standing in this topic.", "formal": "", "tags": ["ordering", "finite"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.3, p. 675"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "lean_def": "UnboundedUtility.RestrictedTotality", "file": "topics/unbounded-utility/principles/restricted-totality.yaml"}, {"id": "rich-outcomes", "name": "Rich Outcomes", "statement": "Every real number r occurs as a utility level of a sure outcome: for each r ∈ ℝ there is an outcome o_r with u(o_r)=r, with u defined by the normalized binary-mixture comparisons in the background. This does not assert that every outcome has a finite real level.", "formal": "∀r∈ℝ ∃o∈O_fin: u(o)=r", "tags": ["outcomes"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.2, p. 673 (called Unbounded Utility)", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, pp. 22–23"], "notes": "Stronger than merely having no upper bound. Kept separate from Archimedean Outcomes at the user’s request. No Rich Outcomes ⇒ Archimedean Outcomes edge is asserted.", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "lean_def": "UnboundedUtility.RichOutcomes", "file": "topics/unbounded-utility/principles/rich-outcomes.yaml"}, {"id": "scale-invariance", "name": "Scale Invariance", "statement": "For every real a>0, X ≽ Y iff aX ≽ aY.", "formal": "", "tags": ["symmetry"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.2, pp. 686–688", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24"], "notes": "Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes available. The source’s full ℝ setting is supplied by Rich Outcomes and Simple EU in theorem packages.", "date": "2026-09-08", "category": "invariance-principles", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "file": "topics/unbounded-utility/principles/scale-invariance.yaml"}, {"id": "shift-invariance", "name": "Shift Invariance", "statement": "For every real b, X ≽ Y iff X+b ≽ Y+b.", "formal": "", "tags": ["symmetry"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.2, pp. 686–688", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24"], "notes": "Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes available. The source’s full ℝ setting is supplied by Rich Outcomes and Simple EU in theorem packages.", "date": "2026-09-08", "category": "invariance-principles", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "file": "topics/unbounded-utility/principles/shift-invariance.yaml"}, {"id": "shift-transfer", "name": "Transfer of a Shift Across a Mixture", "statement": "For all real b and 0<p<1, M_p(X+b/p,Y) ~ M_p(X,Y+b/(1−p)). Variables and transformed outcomes are in the real utility chart.", "formal": "", "tags": ["mixture", "symmetry"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 3, pp. 25–26"], "notes": "", "date": "2026-09-08", "category": "invariance-principles", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/shift-transfer.yaml"}, {"id": "simple-eu", "name": "Simple Expected Utility", "statement": "The normalized real utility chart u is defined on every outcome, is measurable, and ranks every pair of simple random variables exactly by finite expected utility: X ≽ Y iff E[u(X)] ≥ E[u(Y)]. Surjectivity of u is not included here.", "formal": "X,Y simple ⇒ (X ≽ Y ⇔ E[u(X)] ≥ E[u(Y)])", "tags": ["expectation", "finite"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, p. 680", "Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 23"], "notes": "The papers sometimes bundle a bijective representation with Simple EUT. Here its surjectivity is split out as Rich Outcomes. This principle does entail Archimedean Outcomes.", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound", "Symmetries of Value"], "lean_def": "UnboundedUtility.SimpleEU", "file": "topics/unbounded-utility/principles/simple-eu.yaml"}, {"id": "simple-relative-expectation", "name": "Simple Relative Expectation", "statement": "For real-utility variables X,Y on the same probability space, if u(X)−u(Y) takes finitely many values, X ≽ Y iff E[u(X)−u(Y)] ≥ 0. X and Y themselves need not be simple or integrable.", "formal": "", "tags": ["expectation", "relative", "finite"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, p. 26"], "notes": "", "date": "2026-09-08", "category": "extensions-of-eut", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/simple-relative-expectation.yaml"}, {"id": "statewise-dominance", "name": "Statewise Dominance", "statement": "If X ≥ Y almost surely in the sure-outcome order, then X ≽ Y; if also P(X>Y)>0, then X ≻ Y.", "formal": "", "tags": ["dominance"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, pp. 678–679"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "lean_def": "UnboundedUtility.StatewiseDominance", "file": "topics/unbounded-utility/principles/statewise-dominance.yaml"}, {"id": "stochastic-dominance", "name": "Stochastic Dominance", "statement": "If P(X>o) ≥ P(Y>o) for every outcome threshold o, then X ≽ Y; if one threshold inequality is strict, X ≻ Y. Thresholds use the sure-outcome order.", "formal": "", "tags": ["dominance", "distribution"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, p. 678"], "notes": "Includes the weak clause, as in the random-variable statement of the 2024 paper. The 2026 distribution formulation writes only the strict clause because equality of laws has already been identified there.", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "lean_def": "UnboundedUtility.StochasticDominance", "file": "topics/unbounded-utility/principles/stochastic-dominance.yaml"}, {"id": "stochastic-equivalence", "name": "Stochastic Equivalence", "statement": "If X and Y have the same probability law over outcomes, then X ~ Y. The variables remain distinct objects; indifference is an additional axiom.", "formal": "L(X)=L(Y) ⇒ X ~ Y", "tags": ["distribution"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.2, p. 674"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "lean_def": "UnboundedUtility.StochasticEquivalence", "file": "topics/unbounded-utility/principles/stochastic-equivalence.yaml"}, {"id": "sure-thing", "name": "Sure-Thing", "statement": "For an event E with 0<P(E)<1, if X|E ~ Y|E, then X ≽ Y iff X|Eᶜ ≽ Y|Eᶜ. Here X|E equals X on E and sure 0 elsewhere; it is not a conditional expectation.", "formal": "", "tags": ["conditioning"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.2, p. 673"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "lean_def": "UnboundedUtility.SureThing", "file": "topics/unbounded-utility/principles/sure-thing.yaml"}, {"id": "symmetric-neutrality", "name": "Symmetric Gambles Are Neutral", "statement": "If u(X) and −u(X) have the same law, then X ~ 0.", "formal": "", "tags": ["evaluation", "symmetry"], "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, p. 27"], "notes": "", "date": "2026-09-08", "category": "prospect-evaluations", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/principles/symmetric-neutrality.yaml"}, {"id": "totality", "name": "Totality", "statement": "For all gambles X,Y, either X ≽ Y or Y ≽ X.", "formal": "", "tags": ["ordering"], "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.2, p. 673"], "notes": "", "date": "2026-09-08", "category": "basic-decision-theory", "source_names": ["Decision Theory Unbound"], "lean_def": "UnboundedUtility.Totality", "file": "topics/unbounded-utility/principles/totality.yaml"}], "results": [{"id": "archimedean-gambles-restricts", "premises": ["archimedean-gambles"], "conclusion": "archimedean-outcomes", "status": "proved", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Sure outcomes are particular gambles. Restrict the triple of quantified gambles to constants.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, p. 22, footnote 3", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/archimedean-gambles-restricts.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/archimedean-gambles-restricts.yaml", "files": {"md": "writeups/archimedean-gambles-restricts.md", "handwritten": false, "html": "writeups/archimedean-gambles-restricts.html"}}, {"id": "countable-sure-thing-outcomes-to-gambles", "premises": ["countable-sure-thing", "archimedean-outcomes"], "conclusion": "archimedean-gambles", "status": "conjectured", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "User suggestion, 2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08"}, "proof": "", "sources": ["User suggestion in this project's conversation, 2026-09-08; proposed implication, not a completed proof.", "Possible related reference, not verified as establishing this exact arrow: Jeffrey Sanford Russell and Yoaav Isaacs, Infinite Prospects, Philosophy and Phenomenological Research 103 (2021), 178–198, DOI 10.1111/phpr.12704. Author-hosted manuscript, §§4–5 and Appendix A, especially pp. 15, 22, 25: https://www.yoaavisaacs.com/uploads/6/9/2/0/69204575/infinite-prospects-final.pdf"], "notes": "Record the user's two-premise proposal as stated, relative to this topic's standing framework. The related Russell–Isaacs theorem uses Countable Independence, complete preferences, and countably supported lotteries; its passage from acts to lotteries assumes law invariance. A proof in the present random-variable framework, or identification of any additional necessary premises, is still required. Neither Totality nor Stochastic Equivalence should silently be treated as background. Excluded from proved deductions until verified.\n", "source_names": ["User suggestion 8 Sep", "Infinite Prospects (candidate source)"], "file": "topics/unbounded-utility/results/countable-sure-thing-outcomes-to-gambles.yaml", "files": {"md": "writeups/countable-sure-thing-outcomes-to-gambles.md", "handwritten": false, "html": "writeups/countable-sure-thing-outcomes-to-gambles.html"}}, {"id": "countable-sure-thing-simple-to-full-eu", "premises": ["countable-sure-thing", "simple-eu"], "conclusion": "expected-utility", "status": "conjectured", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "User suggestion, 2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08"}, "proof": "", "sources": ["User suggestion in this project's conversation, 2026-09-08; proposed implication, not a completed proof.", "Related motivation rather than a verified theorem with these exact premises: Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695, DOI 10.1111/nous.12473, §4.1, pp. 685–686."], "notes": "Candidate extension from finite-valued gambles to all integrable utility random variables. Verification must cover the full measurable domain, including variables with non-atomic distributions, and both directions of the expected-utility comparison. Do not silently add Rich Outcomes, Totality, Stochastic Equivalence, or Sure-Thing as premises. Rich Outcomes is optional here; the existing unbounded-utility inconsistency argument is not by itself a proof of this two-premise implication. Excluded from proved deductions until verified.\n", "source_names": ["User suggestion 8 Sep", "Decision Theory Unbound"], "file": "topics/unbounded-utility/results/countable-sure-thing-simple-to-full-eu.yaml", "files": {"md": "writeups/countable-sure-thing-simple-to-full-eu.md", "handwritten": false, "html": "writeups/countable-sure-thing-simple-to-full-eu.html"}}, {"id": "dominance-implies-equivalence", "premises": ["stochastic-dominance"], "conclusion": "stochastic-equivalence", "status": "proved", "certificate": {"source_id": "decision-theory-unbound", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Equal laws give equal upper-tail probabilities at every outcome threshold. Apply the weak dominance clause in both directions.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, p. 678"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/results/dominance-implies-equivalence.yaml", "files": {"md": "writeups/dominance-implies-equivalence.md", "handwritten": false, "html": "writeups/dominance-implies-equivalence.html"}}, {"id": "dominance-implies-statewise", "premises": ["archimedean-outcomes", "stochastic-dominance"], "conclusion": "statewise-dominance", "status": "proved", "certificate": {"source_id": "decision-theory-unbound", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Use the real outcome chart supplied by Archimedean Outcomes. If X≥Y almost surely, {Y>t}⊆{X>t} modulo null events. If P(X>Y)>0, the countable family of rational cuts contains a cut with P(Y≤t<X)>0; approximate by a realized outcome threshold if necessary. The strict tail inequality then gives strict preference.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, pp. 678–679 and footnote 19"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/results/dominance-implies-statewise.yaml", "files": {"md": "writeups/dominance-implies-statewise.md", "handwritten": false, "html": "writeups/dominance-implies-statewise.html"}}, {"id": "dtu-l1-implies-eu", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence", "l1-continuity"], "conclusion": "expected-utility", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Source-stated implication, §3, p. 23: adding L¹ Continuity to DTU yields Expected Utility. Stochastic Equivalence makes the quotient ordering on laws well-defined; the remaining premises give exactly the source’s DTU, with the surjectivity part of its Simple EU supplied separately by Rich Outcomes. The L¹ translation write-up establishes that the random-variable continuity axiom implies the source’s metric continuity. Apply the stated theorem and pull its expected-utility comparison back to X,Y. The source does not supply an expanded proof of the underlying implication; this is a theorem application and translation, not a new proof of that theorem.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 23"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/dtu-l1-implies-eu.yaml", "files": {"md": "writeups/dtu-l1-implies-eu.md", "handwritten": false, "html": "writeups/dtu-l1-implies-eu.html"}}, {"id": "dtu-refutes-archimedean-gambles", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "stochastic-dominance", "independence"], "conclusion": "failure-archimedean-gambles", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Let S have P(u(S)=2^n)=2^(−n). For any real c choose N with N>c. The simple truncation min(S,2^N) has expectation N+1 and is stochastically dominated by S. Thus S≻c. In particular S≻1≻0. Every M_p(S,0), p>0, is also better than every sure outcome: its simple truncations have arbitrarily large finite expectations. Hence none is indifferent to 1. This violates Archimedean Gambles while preserving Archimedean Outcomes.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 22"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/dtu-refutes-archimedean-gambles.yaml", "files": {"md": "writeups/dtu-refutes-archimedean-gambles.md", "handwritten": false, "html": "writeups/dtu-refutes-archimedean-gambles.html"}}, {"id": "equivalence-and-statewise-imply-dominance", "premises": ["rich-outcomes", "archimedean-outcomes", "stochastic-equivalence", "statewise-dominance"], "conclusion": "stochastic-dominance", "status": "proved", "certificate": {"source_id": "decision-theory-unbound", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "On the full real chart, first-order dominance permits quantile realizations X′,Y′ using the same uniform random variable with X′≥Y′ almost surely. Distinct laws give P(X′>Y′)>0. Statewise Dominance compares these realizations, and Stochastic Equivalence plus transitivity transfers that comparison to X,Y. All realizations exist by standing Prospect Richness.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, footnote 19 (RV/quantile translation)"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/results/equivalence-and-statewise-imply-dominance.yaml", "files": {"md": "writeups/equivalence-and-statewise-imply-dominance.md", "handwritten": false, "html": "writeups/equivalence-and-statewise-imply-dominance.html"}}, {"id": "expected-utility-implies-simple", "premises": ["expected-utility"], "conclusion": "simple-eu", "status": "proved", "certificate": {"source_id": "misc", "lean": "stated", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "All simple variables have finite real expected utility. Restrict Expected Utility to them.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.1, p. 685", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/expected-utility-implies-simple.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/expected-utility-implies-simple.yaml", "files": {"md": "writeups/expected-utility-implies-simple.md", "handwritten": false, "html": "writeups/expected-utility-implies-simple.html"}}, {"id": "folded-implies-eu", "premises": ["archimedean-outcomes", "folded-expectation"], "conclusion": "expected-utility", "status": "proved", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "For an integrable real utility variable, the integral of the absolute folded tail difference is bounded by E|u(X)|, and the tail-integral formula gives F(X)=E[u(X)]. Archimedean Outcomes makes the chart total. Restrict the Folded Expectation comparison to integrable X,Y.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, p. 27", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/folded-implies-eu.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/folded-implies-eu.yaml", "files": {"md": "writeups/folded-implies-eu.md", "handwritten": false, "html": "writeups/folded-implies-eu.html"}}, {"id": "folded-implies-symmetric-neutrality", "premises": ["rich-outcomes", "folded-expectation"], "conclusion": "symmetric-neutrality", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "For a symmetric real law, h_X(t)=0 almost everywhere, so F(X)=0. The zero constant also has folded value zero; apply Folded Expectation.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, pp. 27–28"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/folded-implies-symmetric-neutrality.yaml", "files": {"md": "writeups/folded-implies-symmetric-neutrality.md", "handwritten": false, "html": "writeups/folded-implies-symmetric-neutrality.html"}}, {"id": "independence-to-sure-thing", "premises": ["stochastic-equivalence", "independence"], "conclusion": "sure-thing", "status": "proved", "certificate": {"source_id": "decision-theory-unbound", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Let p=P(E). Realize the conditional laws on E and Eᶜ as A,B for X and C,D for Y. Law invariance gives X~M_p(A,B), Y~M_p(C,D), X|E~M_p(A,0), Y|E~M_p(C,0). Independence cancels 0 to yield A~C from the hypothesis. Replace indifferent mixture components and cancel the common E component: X≽Y iff B≽D. The latter is equivalent to X|Eᶜ≽Y|Eᶜ by independence and law invariance.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, p. 679 and p. 682, footnote 28"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/results/independence-to-sure-thing.yaml", "files": {"md": "writeups/independence-to-sure-thing.md", "handwritten": false, "html": "writeups/independence-to-sure-thing.html"}}, {"id": "negative-affine-implies-positive-affine", "premises": ["rich-outcomes", "negative-affine-anti-invariance"], "conclusion": "positive-affine-invariance", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Compose x↦−x with x↦−ax+b. Both reverse the ordering, so their composition x↦ax+b preserves it. Rich Outcomes supplies all intermediate outcome levels.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/negative-affine-implies-positive-affine.yaml", "files": {"md": "writeups/negative-affine-implies-positive-affine.md", "handwritten": false, "html": "writeups/negative-affine-implies-positive-affine.html"}}, {"id": "negative-affine-implies-reflection", "premises": ["negative-affine-anti-invariance"], "conclusion": "reflection-anti-invariance", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Set a=1,b=0. The order is reversed.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24 (corrected sign)"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/negative-affine-implies-reflection.yaml", "files": {"md": "writeups/negative-affine-implies-reflection.md", "handwritten": false, "html": "writeups/negative-affine-implies-reflection.html"}}, {"id": "original-dtu-implies-simple-eu", "premises": ["rich-outcomes", "archimedean-outcomes", "totality", "stochastic-dominance", "sure-thing"], "conclusion": "simple-eu", "status": "proved", "certificate": {"source_id": "decision-theory-unbound", "lean": "stated", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Goodsell §3.2 gives the finite-lottery representation consequence of the original DTU axioms. Stochastic Dominance includes law invariance; Sure-Thing becomes Independence on laws. Restrict to finite gambles and use the outcome mixture calibrations to obtain the normalized vNM utility representation. Prospect Richness, Preordering and comparable outcomes are standing here.", "sources": ["Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2, pp. 679–681 (representation result)"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Decision Theory Unbound"], "file": "topics/unbounded-utility/results/original-dtu-implies-simple-eu.yaml", "files": {"md": "writeups/original-dtu-implies-simple-eu.md", "handwritten": false, "html": "writeups/original-dtu-implies-simple-eu.html"}}, {"id": "positive-affine-implies-scale", "premises": ["positive-affine-invariance"], "conclusion": "scale-invariance", "status": "proved", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Set b=0.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/positive-affine-implies-scale.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/positive-affine-implies-scale.yaml", "files": {"md": "writeups/positive-affine-implies-scale.md", "handwritten": false, "html": "writeups/positive-affine-implies-scale.html"}}, {"id": "positive-affine-implies-shift", "premises": ["positive-affine-invariance"], "conclusion": "shift-invariance", "status": "proved", "certificate": {"source_id": "misc", "lean": "none", "produced_by": "GPT-6 (Codex), 2026-09-08", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Set a=1.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24", "GPT-6 (Codex), 2026-09-08: elementary connecting proof in topics/unbounded-utility/results/positive-affine-implies-shift.yaml (proof field), using the cited paper’s definitions; not a separately stated paper theorem."], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value", "GPT-6 generated 8 Sep"], "file": "topics/unbounded-utility/results/positive-affine-implies-shift.yaml", "files": {"md": "writeups/positive-affine-implies-shift.md", "handwritten": false, "html": "writeups/positive-affine-implies-shift.html"}}, {"id": "positive-reflection-imply-negative", "premises": ["rich-outcomes", "positive-affine-invariance", "reflection-anti-invariance"], "conclusion": "negative-affine-anti-invariance", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Apply reflection to reverse the comparison, then the positive transformation x↦ax+b to preserve that reversed comparison.", "sources": ["Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24"], "notes": "Source-based result or immediate restriction/composition. Premises are sufficient; minimality is not claimed. The direct source is recorded separately from the transcription; no translation checker is asserted.", "source_names": ["Symmetries of Value"], "file": "topics/unbounded-utility/results/positive-reflection-imply-negative.yaml", "files": {"md": "writeups/positive-reflection-imply-negative.md", "handwritten": false, "html": "writeups/positive-reflection-imply-negative.html"}}, {"id": "reflection-implies-symmetric-neutrality", "premises": ["rich-outcomes", "totality", "stochastic-equivalence", "simple-eu", "independence", "reflection-anti-invariance"], "conclusion": "symmetric-neutrality", "status": "proved", "certificate": {"source_id": "symmetries-of-value", "lean": "none", "produced_by": "Zachary Goodsell (cited paper)", "checked_by": [], "date": "2026-09-08", "recorded_by": "GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation"}, "proof": "Let H=M_1/2(X,−X). Its reflected law equals its own law, so H~−H. If H≻0, reflection gives −H≺0, contradiction; likewise if H≺0. Totality gives H~0. If X itself has symmetric law, Stochastic Equivalence gives −X~X and H~X, since the mixture then has X’s la
