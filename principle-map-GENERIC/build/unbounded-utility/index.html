    const m = byMid.get(sel.id), e = modelEvidence(m, sel.principle);
    h += `<div class="pop-t">${esc(m.name)}</div><div class="pop-s">${esc(name(sel.principle))}: ${e ? e.value ? '✓ satisfied' : '✗ violated' : '? unknown'}</div>`;
    if (e) h += `<div class="badges">${evidenceBadges(e)}</div><div class="pop-l">${e.direct ? 'Recorded in the model write-up.' : 'Derived from the model and the recorded implications.'}</div>${sourceSummary(e.items)}<div class="links"><button class="lnk" data-goto="1">write-up</button></div>`;
  } else {
    const x = sel.type === 'result' ? byRid.get(sel.id) : byMid.get(sel.id);
    h += `<div class="pop-t">${sel.type === 'result' ? resultStmt(x) : esc(x.name)}</div>${sel.type === 'model' ? `<div class="pop-s">${modelStmt(x)}</div>` : ''}<div class="badges">${certBadges(x)}</div>${sourceSummary([x])}${x.certificate.lean_ref ? `<div class="pop-l">Lean: <code>${esc(x.certificate.lean_ref)}</code></div>` : ''}<div class="links"><button class="lnk" data-goto="1">write-up</button>${fileLinks(x).replace('<div class="links">', ' · ').replace('</div>', '')}</div>`;
  }
  el.innerHTML = h; el.hidden = false;
  el.querySelector('button[data-goto]')?.addEventListener('click', () => { const e = sel.type === 'model-verdict' && modelEvidence(byMid.get(sel.id), sel.principle); openPage(e && e.direct ? { type: 'model', id: sel.id } : sel); el.hidden = true; });
  const W = window.innerWidth, H = window.innerHeight, r = el.getBoundingClientRect();
  let x = (popAt ? popAt.x + 12 : W - r.width - 24), y = (popAt ? popAt.y + 12 : 80);
  if (x + r.width > W - 8) x = Math.max(8, (popAt ? popAt.x : W) - r.width - 12);
  if (y + r.height > H - 8) y = Math.max(8, H - r.height - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
document.addEventListener('pointerdown', ev => { popAt = { x: ev.clientX, y: ev.clientY }; const el = document.getElementById('pop'); if (!el.hidden && !el.contains(ev.target)) el.hidden = true; });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') document.getElementById('pop').hidden = true; });
function select(sel) {
  if (sel?.type === 'model') { state.modelId = sel.id; renderModels(); }
  state.selected = sel; renderDetail(); applySelection();
}

// ---------------------------------------------------------------- header
function renderHeader() {
  document.getElementById('title').textContent = T.title;
  document.getElementById('subtitle').textContent = (T.description || '').trim();
  const all = [...R, ...MODELS].filter(x => x.status === 'proved');
  const leanCount = all.filter(r => r.certificate.lean === 'verified').length;
  let implies = 0, indep = 0, open = 0;
  for (const v of A.pair.values()) { if (v.status === 'implies') implies++; else if (v.status === 'independent') indep++; else open++; }
  const dl = DATA.downloads || {};
  document.getElementById('downloads').innerHTML = [dl.bundle && `<a href="${dl.bundle}">AI bundle (zip)</a>`, dl.json && `<a href="${dl.json}">data.json</a>`, dl.zip && `<a href="${dl.zip}">source.zip</a>`, dl.lean && `<a href="${dl.lean}">lean/</a>`].filter(Boolean).join('') || '<span class="dim">—</span>';
  document.getElementById('stats').innerHTML = [`<b>${ids.length}</b> principles`, `<b>${R.length}</b> results`, `<b>${MODELS.length}</b> models`,
    `<b>${background.size}</b> background assumptions`,
    `<b>${new Set(all.map(x => sourceOf(x).id)).size}</b> sources`,
    `Lean <b>${leanCount}</b>`, `<b>${implies}</b> ⇒ · <b>${indep}</b> ⇏ · <b>${open}</b> open`].map(s => `<span class="chip">${s}</span>`).join('');
}

// ---------------------------------------------------------------- wiring
let refreshPrincipleControls = () => {};
function changeBackground(id, assumed) {
  if (!byPid.has(id) || (!assumed && topicBackground.includes(id))) return;
  assumed ? background.add(id) : background.delete(id);
  state.pkg.delete(id); state.out.delete(id);
  saveBackground(); refreshPrincipleControls(); renderAll(true);
}
function saveBackground() {
  // Keep exploration shareable/reloadable without changing the source topic.
  const additions = [...background].filter(p => !topicBackground.includes(p)).sort();
  try {
    const url = new URL(window.location.href);
    if (additions.length || backgroundPresets.some(p => p.default)) url.searchParams.set('assume', additions.join(','));
    else url.searchParams.delete('assume');
    window.history.replaceState(window.history.state, '', url);
  } catch { /* Some local-file viewers do not allow history updates. */ }
}
function renderBackground() {
  document.querySelectorAll('[data-background-preset]').forEach(button => {
    const preset = backgroundPresets.find(p => p.id === button.dataset.backgroundPreset);
    button.disabled = preset.principles.every(id => background.has(id));
  });
  for (const prefix of ['', 'models-']) {
  const list = document.getElementById(prefix + 'background-list');
  if (!list) continue;
  list.querySelectorAll('.background-row').forEach(row => {
    const removed = !background.has(row.dataset.backgroundId);
    row.classList.toggle('is-removed', removed);
    row.inert = removed;
    if (!removed) row.classList.remove('is-collapsed');
  });
  for (const id of background) {
    if ([...list.querySelectorAll('.background-row')].some(row => row.dataset.backgroundId === id)) continue;
    const row = document.createElement('div');
    row.className = 'background-row'; row.dataset.backgroundId = id;
    row.innerHTML = `<button class="lnk" data-background-principle="${esc(id)}">${esc(name(id))}</button>${topicBackground.includes(id) ? '<span class="background-fixed">fixed</span>' : `<button type="button" class="background-move" data-remove-background="${esc(id)}" title="Return ${esc(name(id))} to principles" aria-label="Return ${esc(name(id))} to principles">↑</button>`}`;
    row.querySelector('[data-background-principle]').addEventListener('click', () => select({ type: 'principle', id }));
    row.querySelector('[data-remove-background]')?.addEventListener('click', () => changeBackground(id, false));
    list.appendChild(row);
  }
  document.getElementById(prefix + 'background-count').textContent = background.size;
  document.getElementById(prefix + 'background-reset').disabled = background.size === topicBackground.length;
  const consequences = [...E.cl([]).facts].filter(p => !background.has(p));
  document.getElementById(prefix + 'background-status').textContent = backgroundConflicts.length ? 'Inconsistent background — see the graph warning.' : background.size ? `${consequences.length} further principles follow · ${E.models.length} known models` : 'No additional assumptions.';
  }
}
function renderAll(refit) {
  recompute(); renderHeader(); renderBackground();
  document.querySelector('[data-tab="contribute"]').hidden = !DATA.contribute_html;
  document.getElementById('contribute').innerHTML = DATA.contribute_html || '';
  const current = background.size ? `<h2>Current background assumptions</h2><ul>${[...background].map(p => `<li>${esc(name(p))}</li>`).join('')}</ul>` : '';
  document.getElementById('background').innerHTML = current + (DATA.background_html || '<p class="dim">—</p>');
  renderGraph(); if (refit) fit(); renderModels(); renderResults(); renderOpen(); renderDetail();
}
function resetBackground() {
  for (const id of [...background]) if (!topicBackground.includes(id)) background.delete(id);
  modelBackgroundSlots.clear();
  saveBackground(); refreshPrincipleControls(); renderAll(true);
}
document.getElementById('background-reset').addEventListener('click', resetBackground);
function wireBackgroundCompaction(list) {
  const compact = () => list.querySelectorAll('.is-removed').forEach(row => row.classList.add('is-collapsed'));
  list.addEventListener('pointerleave', compact);
  list.addEventListener('focusout', ev => { if (!list.contains(ev.relatedTarget) && !list.matches(':hover')) compact(); });
}
wireBackgroundCompaction(document.getElementById('background-list'));
(function renderSourceFilters() {
  const el = document.getElementById('source-filters');
  el.innerHTML = [['published-paper', 'Published papers'], ['online-submission', 'Online submissions'], ['misc', 'Miscellaneous']].map(([kind, label]) => {
    const sources = sourceCatalog.filter(s => s.kind === kind);
    return sources.length ? `<fieldset class="source-group"><legend>${label}</legend>${sources.map(s => `<label><input type="checkbox" data-source-filter="${esc(s.id)}" checked><span class="sw" style="border-color:${sourceColor(s)}"></span>${esc(s.name)}</label>`).join('')}</fieldset>` : '';
  }).join('');
  el.querySelectorAll('[data-source-filter]').forEach(cb => cb.addEventListener('change', () => { cb.checked ? state.allowed.add(cb.dataset.sourceFilter) : state.allowed.delete(cb.dataset.sourceFilter); renderAll(true); }));
})();
document.getElementById('lean-only').addEventListener('change', e => { state.leanOnly = e.target.checked; renderAll(true); });
document.getElementById('show-derived').addEventListener('change', e => { state.showDerived = e.target.checked; renderAll(true); });
document.getElementById('show-conj').addEventListener('change', e => { state.showConj = e.target.checked; renderAll(true); });
document.getElementById('show-iso').addEventListener('change', e => { state.showIso = e.target.checked; renderAll(true); });
document.getElementById('fit').addEventListener('click', fit);
(function () {
  const el = document.getElementById('pr-filters');
  const sorted = [...P].sort((a, b) => a.name.localeCompare(b.name));
  const categories = T.principle_categories || [];
  const groups = principleGroups();
  const labels = principles => principles.map(p => `<div class="pr-row${background.has(p.id) ? ' in-background is-collapsed' : ''}" data-pr-row="${esc(p.id)}"><input type="checkbox" data-pid="${esc(p.id)}" aria-label="Show ${esc(p.name)} on graph"${state.excluded.has(p.id) ? '' : ' checked'}><button type="button" class="lnk principle-name" data-principle="${esc(p.id)}" title="View principle details">${esc(p.name)}</button><button type="button" class="background-move" data-add-background="${esc(p.id)}" title="Move ${esc(p.name)} to background" aria-label="Move ${esc(p.name)} to background">↓</button></div>`).join('');
  el.innerHTML = categories.length ? groups.filter(g => g.principles.length).map((g, i) => `
    <section class="pr-category" data-category="${esc(g.id)}" aria-labelledby="pr-category-${i}">
      <h3 id="pr-category-${i}">${esc(g.name)}</h3>
      ${backgroundPresets.filter(p => p.category === g.id).map(p => `<button type="button" class="btn small" data-background-preset="${esc(p.id)}" style="margin-bottom:8px">Add ${esc(p.name)} to background</button>`).join('')}
      <div class="pr-category-actions">
        <button type="button" class="lnk" data-category-select="all" aria-label="Select all ${esc(g.name)}">select all</button>
        <button type="button" class="lnk" data-category-select="none" aria-label="Unselect all ${esc(g.name)}">unselect all</button>
        <span class="pr-category-count" aria-live="polite"></span>
      </div>
      <div class="ctl">${labels(g.principles)}</div>
    </section>`).join('') : labels(sorted);
  const updateCounts = () => {
    el.querySelectorAll('.pr-category').forEach(group => {
      const checkboxes = [...group.querySelectorAll('input[data-pid]')].filter(cb => !cb.disabled);
      const selected = checkboxes.filter(cb => cb.checked).length;
      group.querySelector('.pr-category-count').textContent = `${selected}/${checkboxes.length}`;
      group.querySelector('[data-category-select="all"]').disabled = selected === checkboxes.length;
      group.querySelector('[data-category-select="none"]').disabled = selected === 0;
    });
  };
  const setSelection = (checkboxes, selected) => {
    checkboxes.forEach(cb => {
      if (cb.disabled) return;
      cb.checked = selected;
      selected ? state.excluded.delete(cb.dataset.pid) : state.excluded.add(cb.dataset.pid);
    });
    updateCounts(); renderGraph(); fit();
  };
  el.querySelectorAll('input[data-pid]').forEach(cb => cb.addEventListener('change', () => {
    cb.checked ? state.excluded.delete(cb.dataset.pid) : state.excluded.add(cb.dataset.pid);
    updateCounts(); renderGraph(); fit();
  }));
  el.querySelectorAll('button[data-category-select]').forEach(button => button.addEventListener('click', () => {
    setSelection(button.closest('.pr-category').querySelectorAll('input[data-pid]'), button.dataset.categorySelect === 'all');
  }));
  document.getElementById('pr-all').addEventListener('click', () => setSelection(el.querySelectorAll('input[data-pid]'), true));
  document.getElementById('pr-none').addEventListener('click', () => setSelection(el.querySelectorAll('input[data-pid]'), false));
  el.querySelectorAll('[data-add-background]').forEach(button => button.addEventListener('click', () => changeBackground(button.dataset.addBackground, true)));
  el.querySelectorAll('[data-background-preset]').forEach(button => button.addEventListener('click', () => {
    const preset = backgroundPresets.find(p => p.id === button.dataset.backgroundPreset);
    for (const id of preset.principles) { background.add(id); state.pkg.delete(id); state.out.delete(id); }
    saveBackground(); refreshPrincipleControls(); renderAll(true);
  }));
  wire(el);
  const compact = () => el.querySelectorAll('.pr-row.in-background').forEach(row => row.classList.add('is-collapsed'));
  el.addEventListener('pointerleave', compact);
  el.addEventListener('focusout', ev => { if (!el.contains(ev.relatedTarget) && !el.matches(':hover')) compact(); });
  refreshPrincipleControls = () => {
    el.querySelectorAll('.pr-row').forEach(row => {
      const id = row.dataset.prRow, assumed = background.has(id);
      row.classList.toggle('in-background', assumed); row.inert = assumed;
      if (!assumed) row.classList.remove('is-collapsed');
      const checkbox = row.querySelector('input[data-pid]');
      checkbox.disabled = assumed; checkbox.checked = !assumed && !state.excluded.has(id);
      row.querySelector('[data-add-background]').disabled = assumed;
    });
    updateCounts();
  };
  refreshPrincipleControls();
})();
document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value; renderResults();
  const q = state.search.trim().toLowerCase(); if (!q) { hover(null); return; }
  const hit = P.find(p => (p.name + ' ' + p.id + ' ' + (p.aliases || []).join(' ')).toLowerCase().includes(q));
  if (hit) hover({ node: 'c' + A.classes.findIndex(c => c.includes(hit.id)) });
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));
// Resize without rebuilding either list, so selections, scroll positions and click slots survive.
(function setupPaneDividers() {
  const pane = document.getElementById('pane-graph');
  const sidebar = document.getElementById('graph-sidebar');
  const storageKey = 'principle-map:pane-sizes:v1';
  let saved = {};
  try {
    const stored = JSON.parse(localStorage.getItem(storageKey));
    for (const key of ['sidebar', 'background']) if (Number.isFinite(stored?.[key]) && stored[key] > 0) saved[key] = stored[key];
  } catch (_) { /* Resizing also works when storage is unavailable. */ }
  const handles = { sidebar: document.getElementById('sidebar-divider'), background: document.getElementById('background-divider') };
  const current = {};
  let drag = null;
  function limits(key) {
    const width = pane.clientWidth || window.innerWidth;
    const height = sidebar.clientHeight || pane.clientHeight || window.innerHeight;
    return key === 'sidebar'
      ? { min: Math.min(200, width * .4), max: Math.max(0, width - Math.min(240, width * .4) - 9), initial: 250 }
      : { min: Math.min(130, height * .3), max: Math.max(0, height - Math.min(140, height * .3) - 9), initial: Math.min(230, Math.max(145, window.innerHeight * .27)) };
  }
  function apply() {
    if (pane.dataset.active !== 'true') return;
    const previousWidth = current.sidebar;
    for (const key of Object.keys(handles)) {
      const bounds = limits(key), min = Math.min(bounds.min, bounds.max);
      const value = Math.round(Math.max(min, Math.min(bounds.max, saved[key] ?? bounds.initial)));
      current[key] = value;
      pane.style.setProperty(key === 'sidebar' ? '--sidebar-width' : '--background-height', `${value}px`);
      const handle = handles[key];
      handle.setAttribute('aria-valuemin', Math.round(min));
      handle.setAttribute('aria-valuemax', Math.round(bounds.max));
      handle.setAttribute('aria-valuenow', value);
      handle.setAttribute('aria-valuetext', `${value} pixels ${key === 'sidebar' ? 'wide' : 'high'}`);
    }
    if (previousWidth !== current.sidebar) fit();
  }
  function persist() { try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch (_) {} }
  function setSize(key, value) { saved[key] = value; apply(); saved[key] = current[key]; }
  function finish(cancel = false) {
    if (!drag) return;
    const previous = drag; drag = null;
    if (cancel) { saved = previous.saved; apply(); } else persist();
    handles[previous.key].classList.remove('dragging');
    document.body.classList.remove('resizing-panes');
    document.body.style.removeProperty('--resize-cursor');
    if (handles[previous.key].hasPointerCapture?.(previous.pointerId)) handles[previous.key].releasePointerCapture(previous.pointerId);
  }
  for (const [key, handle] of Object.entries(handles)) {
    handle.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || drag) return;
      ev.preventDefault(); handle.focus(); apply();
      drag = { key, pointerId: ev.pointerId, coordinate: key === 'sidebar' ? ev.clientX : ev.clientY, size: current[key], saved: { ...saved } };
      handle.setPointerCapture?.(ev.pointerId);
      handle.classList.add('dragging');
      document.body.style.setProperty('--resize-cursor', key === 'sidebar' ? 'col-resize' : 'row-resize');
      document.body.classList.add('resizing-panes');
      document.getElementById('pop').hidden = true;
    });
    handle.addEventListener('lostpointercapture', () => finish());
    handle.addEventListener('dblclick', () => { finish(); delete saved[key]; apply(); persist(); });
    handle.addEventListener('keydown', ev => {
      if (drag) return;
      const bounds = limits(key), step = ev.shiftKey ? 40 : 10;
      const increase = key === 'sidebar' ? 'ArrowRight' : 'ArrowUp';
      const decrease = key === 'sidebar' ? 'ArrowLeft' : 'ArrowDown';
      if (![increase, decrease, 'Home', 'End', 'Enter'].includes(ev.key)) return;
      ev.preventDefault();
      if (ev.key === 'Enter') { delete saved[key]; apply(); }
      else setSize(key, ev.key === 'Home' ? bounds.min : ev.key === 'End' ? bounds.max : current[key] + (ev.key === increase ? step : -step));
      persist();
    });
  }
  window.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    const delta = (drag.key === 'sidebar' ? ev.clientX : -ev.clientY) - (drag.key === 'sidebar' ? drag.coordinate : -drag.coordinate);
    setSize(drag.key, drag.size + delta);
  });
  window.addEventListener('pointerup', ev => { if (drag?.pointerId === ev.pointerId) finish(); });
  window.addEventListener('pointercancel', ev => { if (drag?.pointerId === ev.pointerId) finish(true); });
  window.addEventListener('blur', () => finish());
  window.addEventListener('keydown', ev => { if (ev.key === 'Escape' && drag) { ev.preventDefault(); finish(true); } });
  window.addEventListener('resize', apply);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', apply));
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(apply).observe(pane);
  apply();
})();
window.addEventListener('resize', () => { if (state.tab === 'graph') fit(); });
renderAll(true);
requestAnimationFrame(fit);
</script>
