id: weighted-utility
name: Weighted utility
description: |
  Weighted utility. Fix u : X → ℝ and a weight w : X → (0,∞) that is not
  constant, and let V(p) = Σ p(x)w(x)u(x) / Σ p(x)w(x); put p ≽ q iff
  V(p) ≥ V(q). V is continuous on Δ(X), so ≽ is a weak order with closed
  graph. Its indifference sets are the intersections of Δ(X) with
  hyperplanes {p : Σ p(x)w(x)(u(x) − v) = 0}, which are straight, so
  betweenness holds. Since w is not constant these hyperplanes are not
  parallel, so ≽ is not an expected-utility order and (being a continuous
  weak order) must violate independence.
satisfies:
- completeness
- transitivity
- closed-graph-continuity
- betweenness
violates:
- independence
status: proved
certificate:
  provenance: human
  lean: none
  produced_by: literature
  checked_by: []
  date: '2026-09-08'
sources:
- Chew (1983), A generalization of the quasilinear mean with applications to the measurement
  of income inequality and decision theory resolving the Allais paradox, Econometrica 51
- 'Dekel (1986), An axiomatic characterization of preferences under uncertainty: weakening
  the independence axiom, JET 40'
