id: archimedean
name: Archimedean
statement: >
  For all p, q, r ∈ Δ(X): if p ≻ q ≻ r then there are α, β ∈ (0,1) with
  αp + (1−α)r ≻ q and q ≻ βp + (1−β)r.
formal: "∀p q r. p ≻ q ≻ r → ∃α β∈(0,1). αp+(1−α)r ≻ q ∧ q ≻ βp+(1−β)r"
aliases: [Jensen continuity, Weak continuity]
tags: [axiom, topological]
sources:
  - Jensen (1967), An introduction to Bernoullian utility theory I, Swedish Journal of Economics 69
notes: ""
date: 2026-09-08
lean: null
