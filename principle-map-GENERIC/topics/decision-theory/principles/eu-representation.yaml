id: eu-representation
name: Expected-utility representation
statement: >
  There is a function u : X → ℝ such that for all p, q ∈ Δ(X):
  p ≽ q if and only if EU_u(p) ≥ EU_u(q).
formal: "∃u:X→ℝ. ∀p q. p ≽ q ↔ Σ_x p(x)u(x) ≥ Σ_x q(x)u(x)"
aliases: [vNM representation, Linear utility representation]
tags: [representation]
sources:
  - von Neumann & Morgenstern (1944)
notes: ""
