id: quasi-transitivity-implies-acyclicity
premises: [quasi-transitivity]
conclusion: acyclicity
status: proved
certificate:
  provenance: ai
  lean: none
  produced_by: "Claude Fable 5.1 (Cowork session)"
  checked_by: []
  date: 2026-09-08
proof: |
  If p₁ ≻ p₂ ≻ … ≻ pₙ ≻ p₁ then by induction on n, transitivity of ≻ gives
  p₁ ≻ pₙ, and with pₙ ≻ p₁ this contradicts asymmetry of ≻.
