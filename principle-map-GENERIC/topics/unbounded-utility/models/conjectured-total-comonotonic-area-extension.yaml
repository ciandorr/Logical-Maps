notes: >-
  Original work: precise candidate formulation and comparison of two
  extension problems. The base area construction, its comonotonic
  property, and the broader unresolved consistency question are credited
  to Goodsell. The manuscript's Theorem 7 supplies only the incomplete
  area model, not this proposed total CDF-area extension. No new completed
  model is claimed.
  To settle positively, give a total extension and verify that adjoining
  comparisons preserves every old strict area comparison, full Mixture
  Independence, and comonotonic preservation and cancellation. To settle
  negatively, derive an incompatibility from the displayed package.
  A generic order extension is insufficient, and the total convolution
  model is not evidence that comonotonic invariance survives. No claim
  is made that the question is open in the literature.
