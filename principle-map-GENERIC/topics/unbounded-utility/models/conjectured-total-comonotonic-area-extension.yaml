description: >-
  Proposed existence claim, not a completed construction: a total
  preorder on all real-valued random variables that strictly extends
  Goodsell's CDF-area preorder and satisfies both Mixture Independence
  and Comonotonic Sum Invariance. Real outcomes and the inherited area
  comparisons supply Rich Outcomes, Simple Expected Utility and
  Stochastic Dominance; require Stochastic Equivalence explicitly.
  The incomplete exact CDF-area preorder already satisfies all these
  properties except Totality. Seek a total extension preserving both
  the mixture comparisons and the comonotonic-sum biconditionals.
  The existing total independent-sum extension does not establish this:
  convolution is linear on survival differences, whereas comonotonic
  addition is translation of increasing quantiles, and its compatibility
  with the extension step remains unproved. No symmetry, independent-sum,
  continuity or negative verdict is asserted for this candidate.
sources:
- 'Zachary Goodsell, Unbounded Utility and Background Risk, unpublished manuscript, 5 June 2026, §3, pp. 7–8, and discussion before Theorem 7 and Theorem 7, pp. 19–20: CDF-area construction, its comonotonic invariance, and the broader unresolved consistency question.'
- 'GPT-6 (Codex), 9 September 2026, proposed total-extension package and obstacle analysis in writeups/conjectured-total-comonotonic-area-extension.md.'
