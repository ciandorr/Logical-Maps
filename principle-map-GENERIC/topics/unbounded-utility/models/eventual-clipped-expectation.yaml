certificate:
  source_id: decision-theory-unbound
  lean: stated
  produced_by: Zachary Goodsell (cited paper)
  checked_by: []
  date: '2026-09-08'
  recorded_by: GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation
description: Take all real-valued random variables and let c_t(x)=max(−t,min(x,t)). Define X≽Y iff ∃s∀t>s E[c_t(X)]≥E[c_t(Y)].
  The full construction, verification, and explicit witnesses are in the accompanying write-up. This is the
  incomplete DU model from Decision theory unbound, Theorem 2; it fails the additional Totality axiom of DTU. It witnesses consistency of the unbounded framework
  and failure of full EU despite finite EU.
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, Theorem
  2, pp. 683–685; Theorems 7 and 9, p. 693
notes: Clipping sends tails to ±t; it is not deletion of tail mass. No Shift Invariance claim is needed for
  this model.
source_names:
- Decision Theory Unbound
