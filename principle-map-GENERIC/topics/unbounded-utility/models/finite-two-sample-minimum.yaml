notes: >-
  Original work: elementary countermodel construction, calibration audit and
  explicit finite witnesses. This records the work performed for the project,
  without asserting literature novelty. Finite support refers to the probability
  law, so changes on null sets do not change the assigned score. The value-zero
  clause for all other laws makes the construction a total preorder on the
  full standing domain; its dominance failures are explicit. The example shows
  that Rich Outcomes and Archimedean Outcomes alone do not entail Simple EU,
  even after adding Totality and Stochastic Equivalence. Additional DU premises
  such as Mixture Independence remain essential to the separate representation
  argument. Other principle verdicts are left to recorded implications or future
  analysis. No independent checker or Lean verification is asserted.
