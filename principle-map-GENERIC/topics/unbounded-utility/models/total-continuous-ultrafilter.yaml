  checked_by: []
  date: '2026-09-08'
  recorded_by: GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation
description: Take all real-valued random variables and a cobounded ultrafilter U. Define X≽Y iff for every
  ε>0, {t:E[c_t(X)]≥E[c_t(Y)]−ε}∈U. This is the continuous-hyperreal quotient ordering in the proof of
  Theorem 3. Its EU, shift, reflection, and failed scale claims are given in Appendix B; see the accompanying
  write-up. Consequently Expected Utility does not imply Positive Affine Invariance, even with DTU.
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, Appendix
  B, Lemma 6 and proof of Theorem 3, p. 691; Theorems 7, 8 and 10, pp. 693–695
notes: No L¹ Continuity or Relative Expectation flag is inferred merely from the word continuous; these
  are distinct claims. Scale failure is source-attributed as above.
