id: antitonic-sum-consistency
name: Antitonic Sum Invariance
statement: If X and Z are antitonic, and Y and Z are antitonic, then X ≽ Y iff X+Z ≽ Y+Z. A pair is antitonic
  when one member is nondecreasing and the other nonincreasing in a common uniform random variable.
formal: ''
category: invariance-principles
tags:
- background-risk
sources:
- Zachary Goodsell, Unbounded Utility and Background Risk, 5 June 2026, unpublished manuscript marked “do not
  cite” and erroneous; §6.2, p. 18; Theorem 6, p. 19
source_names:
- Unbounded Utility and Background Risk (unpublished)
notes: 'Numerical scope: real-utility variables for which the indicated sums exist in the outcome chart. These
  are pointwise utility sums, not randomized mixtures. Stochastic Equivalence remains a separate principle.
  On laws, use Q_X(U)+Q_Z(1−U). Constant variables count as both comonotonic and antitonic. Atoms are handled
  by quantiles up to null sets.'
date: '2026-09-09'
