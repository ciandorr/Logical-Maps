id: archimedean-outcomes
name: Archimedean Outcomes
statement: 'For any three sure outcomes a ≻ b ≻ c, some nontrivial mixture of the outer two is equally
  good as the intermediate one: b ~ M_p(a,c) for some p ∈ (0,1). Only the three inputs are sure outcomes.
  This is the no-infinite-ratios condition, not continuity of preferences over arbitrary gambles.'
formal: 'a ≻ b ≻ c ⇒ ∃p∈(0,1): b ~ M_p(a,c)'
