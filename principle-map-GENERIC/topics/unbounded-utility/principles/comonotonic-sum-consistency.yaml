id: comonotonic-sum-consistency
name: Comonotonic Sum Invariance
statement: If X and Z are comonotonic, and Y and Z are comonotonic, then X ≽ Y iff X+Z ≽ Y+Z. A pair is comonotonic
  when its members admit nondecreasing representations in one common uniform random variable.
formal: ''
category: invariance-principles
tags:
- background-risk
sources:
- Zachary Goodsell, Unbounded Utility and Background Risk, 5 June 2026, unpublished manuscript marked “do not
  cite” and erroneous; §6.2, p. 18; Theorem 7, pp. 19–20
source_names:
- Unbounded Utility and Background Risk (unpublished)
notes: 'Numerical scope: real-utility variables for which the indicated sums exist in the outcome chart. These
  are pointwise utility sums, not randomized mixtures. Stochastic Equivalence remains a separate principle.
  On laws the sums are represented by Q_X(U)+Q_Z(U) and Q_Y(U)+Q_Z(U), using increasing quantiles. No law-invariance
  of preferences is built into this node.'
