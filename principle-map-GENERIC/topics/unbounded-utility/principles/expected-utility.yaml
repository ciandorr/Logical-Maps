id: expected-utility
name: Expected Utility
statement: The normalized chart u is defined on all outcomes and is measurable. Whenever u(X),u(Y) are
  integrable, X ≽ Y iff E[u(X)] ≥ E[u(Y)]. Expectations here are finite Lebesgue expectations; this says
  nothing about two +∞ expectations or conditionally convergent sums.
