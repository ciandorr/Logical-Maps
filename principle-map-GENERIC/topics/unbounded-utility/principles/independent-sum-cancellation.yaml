id: independent-sum-cancellation
name: Independent Sum Cancellation
statement: Whenever Z is independent of (X,Y), X+Z ≽ Y+Z implies X ≽ Y.
formal: ''
category: invariance-principles
tags:
- background-risk
sources:
- Zachary Goodsell, Unbounded Utility and Background Risk, 5 June 2026, unpublished manuscript marked “do not
  cite” and erroneous; Lemma 1, p. 8 (reverse direction, proof gap)
source_names:
- Unbounded Utility and Background Risk (unpublished)
notes: 'Numerical scope: real-utility variables for which the indicated sums exist in the outcome chart. These
  are pointwise utility sums, not randomized mixtures. Stochastic Equivalence remains a separate principle.
  Extracted as an optional axiom, not accepted as a theorem about the CDF-area construction. Convolution can
  mix positive and negative contributions; the printed proof does not establish cancellation.'
date: '2026-09-09'
lean_def: UnboundedUtility.IndependentSumCancellation
