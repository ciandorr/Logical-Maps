id: independent-sum-consistency
name: Independent Sum Invariance
statement: Whenever Z is independent of the pair (X,Y), X ≽ Y iff X+Z ≽ Y+Z.
formal: ''
category: invariance-principles
tags:
- background-risk
sources:
- Zachary Goodsell, Unbounded Utility and Background Risk, 5 June 2026, unpublished manuscript marked “do not
  cite” and erroneous; §1, pp. 1–4; §2, p. 6
source_names:
- Unbounded Utility and Background Risk (unpublished)
notes: 'Numerical scope: real-utility variables for which the indicated sums exist in the outcome chart. These
  are pointwise utility sums, not randomized mixtures. Stochastic Equivalence remains a separate principle.
  With Stochastic Equivalence and the full real domain this is the manuscript’s Convolution Invariance: compare
  the two laws before and after convolution by the same probability law. Joint independence supplies a canonical
  common-noise realization; it does not assume that X and Y are independent.'
date: '2026-09-09'
aliases:
- Independent Sum Consistency
- Convolution Invariance
