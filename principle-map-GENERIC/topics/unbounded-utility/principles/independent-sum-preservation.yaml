id: independent-sum-preservation
name: Independent Sum Preservation
statement: Whenever Z is independent of (X,Y), X ≽ Y implies X+Z ≽ Y+Z, and X ≻ Y implies X+Z ≻ Y+Z.
formal: ''
category: invariance-principles
tags:
- background-risk
sources:
- Zachary Goodsell, Unbounded Utility and Background Risk, 5 June 2026, unpublished manuscript marked “do not
  cite” and erroneous; Lemma 1, pp. 7–8 (forward direction)
source_names:
- Unbounded Utility and Background Risk (unpublished)
notes: 'Numerical scope: real-utility variables for which the indicated sums exist in the outcome chart. These
  are pointwise utility sums, not randomized mixtures. Stochastic Equivalence remains a separate principle.
  An explicit separation of the valid forward part of the source’s convolution claim. Weak preservation alone
  would not ensure preservation of strict preference.'
