id: l1-continuity
name: L¹ Continuity (random variables)
statement: On variables with real utility levels, if E|u(X_n)−u(X)| → 0 and X_n ≽ Y for every n, then
  X ≽ Y. Only the upper-section clause is imposed, matching the paper. Distance can be infinite between
  other pairs.
formal: E|u(X_n)−u(X)|→0 and ∀n X_n ≽ Y ⇒ X ≽ Y
tags:
- continuity
sources:
- Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 23
notes: Uses the actual coupling of random variables, so does not build in law invariance. With Stochastic
  Equivalence and the standing availability of all variables this is equivalent to the paper’s extended
  Wasserstein-1 (infimum-over-couplings) formulation; see writeups/l1-translation.md.
date: '2026-09-08'
category: basic-decision-theory
source_names:
- Symmetries of Value
