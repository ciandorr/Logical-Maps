id: negative-self-similarity
name: Uniqueness of Negative Self-Similarity
statement: Fix 0<p<1, a>0, b∈ℝ and Z. If X ~ M_p(−aX+b,Z) and Y ~ M_p(−aY+b,Z), then X ~ Y. This records
  the uniqueness-in-value content of Theorem 10.
