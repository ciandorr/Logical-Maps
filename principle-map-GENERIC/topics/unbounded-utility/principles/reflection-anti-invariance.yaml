id: reflection-anti-invariance
name: Reflection Anti-Invariance
statement: X ≽ Y iff −Y ≽ −X, using the one fixed normalized origin 0.
formal: ''
tags:
- symmetry
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §4.2,
  pp. 686–688
- Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24
notes: Arithmetic changes outcomes via their utility levels; it is not a relabeling of the utility function.
  Applies to finite-level variables when the indicated outcome transformation is available. Full-group
  implications explicitly assume Rich Outcomes. Reflection reverses the comparison; the displayed same-direction
  sign on p. 24 of Symmetries is a source typo, as its other definitions and proofs confirm.
