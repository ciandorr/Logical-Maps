id: relative-expectation
name: Relative Expectation
statement: For real-utility variables X,Y on the same probability space, if E|u(X)−u(Y)|<∞, then X ≽ Y
  iff E[u(X)−u(Y)] ≥ 0. Their individual expectations may both be undefined.
formal: ''
tags:
- expectation
- relative
sources:
- Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §4, p. 26
notes: This is a same-space random-variable principle. Stochastic Equivalence is retained separately when
  importing the paper’s arbitrary-coupling formulation about laws.
date: '2026-09-08'
