  pp. 686–688
- Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, §3, p. 24
notes: Arithmetic uses the utility chart, on finite-level variables with the required transformed outcomes
  available. The source’s full ℝ setting is supplied by Rich Outcomes and Simple EU in theorem packages.
