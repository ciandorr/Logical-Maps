id: universal-copula-sum-consistency
name: Universal Copula Sum Invariance
statement: 'For every copula C, SC(C) holds. A copula C is a Borel probability measure on [0,1]² with
  both marginals uniform. Write H_C(u,v)=C([0,u]×[0,v]). A real-utility pair (A,B) admits C when P(A≤a,B≤b)=H_C(F_A(a),F_B(b))
  for every real a,b. Define SC(C): for every eligible triple X,Y,Z for which both (X,Z) and (Y,Z) admit
  this same C, X ≽ Y iff X+Z ≽ Y+Z.'
formal: ∀ C ∈ Cop₂, SC(C).
category: invariance-principles
tags:
- background-risk
- copula
sources:
- Zachary Goodsell, project TODO.md copula-sum proposal and request to add universal/existential variants,
  9 September 2026; precise definitions recorded by GPT-6 (Codex).
- Fred Espen Benth, Giulia Di Nunno and Dennis Schroers, Copula Measures and Sklar’s Theorem in Arbitrary
  Dimensions, arXiv:2012.11530v2, Definition 2.1 and Theorem 2.3; https://arxiv.org/html/2012.11530v2.
  Reference for copula terminology only, not these preference principles or implication proofs.
source_names:
- Zach Goodsell proposal 9 Sep
- Copula Measures and Sklar’s Theorem (definitions)
notes: 'Numerical scope: variables in the finite real utility chart for which both pointwise sums exist
  as gambles. The copula fixes dependence, not the marginal utility distributions. With atoms a pair may
  admit several copulas; require the displayed compatibility condition, not a uniquely assigned copula.
  Preferences compare the actual random variables, not their laws or equivalence classes; no indifference
  of same-law variables is assumed. The dependence condition concerns each pair separately and places
  no extra condition on the joint law of (X,Y,Z). Proposal: Zachary Goodsell; precise recording: GPT-6
  (Codex), 9 September 2026.'
