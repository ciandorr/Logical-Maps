proof: Choose Z to be the constant utility b. A constant is independent of every pair and is both comonotonic
  and antitonic with every variable, so the sum biconditional becomes X ≽ Y iff X+b ≽ Y+b. Apply this wherever
  the shifted outcomes exist.
