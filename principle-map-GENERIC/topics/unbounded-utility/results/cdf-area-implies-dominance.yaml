proof: Under stochastic dominance, S_X≥S_Y pointwise, so A₋=0 and A₊≥0. This forces X ≽ Y. If some threshold
  is strictly improved, one-sided continuity makes d positive on an interval, giving A₊>0, possibly infinite;
  then Y ≽ X is false. Equality of laws gives two zero areas.
