notes: >-
  Original work: conjecture formulation and partial analysis, not a proof
  or consistency witness. Totality plus cancellation already preserves
  strict comparisons. The unsettled issue is whether DTU forces common
  independent noise to preserve indifference as well. The new proved
  result continuous-total-cancellation-implies-preservation settles this
  after adding L1 Continuity: shift the upper variable by 1/n and pass
  to the limit. Without continuity that limiting step is unavailable.
  A proof must close the indifference gap without assuming continuity;
  a countermodel must satisfy all six DTU axioms plus cancellation and
  exhibit a tied pair that independent noise separates. Such a model
  would necessarily violate L1 Continuity. The existing total
  independent-sum extension satisfies both directions and does not
  separate them. This is an open entry in this map, not a claim about
  whether the question has been settled in the literature.
