  checked_by: []
  date: '2026-09-08'
  recorded_by: GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation
proof: Use the real outcome chart supplied by Archimedean Outcomes. If X≥Y almost surely, {Y>t}⊆{X>t}
  modulo null events. If P(X>Y)>0, the countable family of rational cuts contains a cut with P(Y≤t<X)>0;
  approximate by a realized outcome threshold if necessary. The strict tail inequality then gives strict
  preference.
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2,
  pp. 678–679 and footnote 19
