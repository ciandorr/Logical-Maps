proof: Let P have St Petersburg law and S have the symmetric mixture ½P+½(−P). Write ⊕Anti for the law of the
  antitonic sum. Since P has law ½δ₂+½(2P), pairing opposite quantiles gives S⊕Anti P = ½(P+2)+½P, which strictly
  stochastically dominates P=0⊕Anti P. Antitonic Sum Invariance would therefore give S ≻ 0 (both weak directions
  allow strict cancellation). Applying it again with common summand of law S gives S⊕Anti S ≻ 0⊕Anti S. Symmetry
  of the quantiles makes the left law δ₀ and the right law S, so 0 ≻ S, a contradiction. Dominance supplies
  Stochastic Equivalence for every law identity used. This does not assume Symmetric Neutrality or Totality.
