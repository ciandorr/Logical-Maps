proof: 'Let P,Q each have St Petersburg law P(P=2ⁿ)=2⁻ⁿ, n≥1, coupled antitonically so exactly one equals 2.
  Dominance supplies Stochastic Equivalence, hence P~Q. Full Sum Invariance with common summand P would give
  2P~P+Q. But P+Q has the law of 2P+2: for n≥2 it takes 2ⁿ+2 with probability 2^(1−n). This strictly stochastically
  dominates the law of 2P, contradicting the asserted indifference. Rich Outcomes and standing prospect richness
  supply the variables and sums.'
