notes: >-
  Original work: substantial connecting proof with an auxiliary common-mixture
  law. The main step turns a positive-area comparison into dominance outside
  a compact interval after every positive shift; finite EU handles the compact
  remainder, one upper-section continuity step removes the shift, and mixture
  cancellation removes the auxiliary law. The source papers supply the
  framework and area method, not this proved implication. Source accounting
  does not assert literature priority. The auxiliary law can have undefined
  expectation; only actual differences are integrated. Stochastic Equivalence
  is listed explicitly for law replacements, although Stochastic Dominance
  already implies it. The proof also applies directly with Simple EU in place
  of the representation assumptions. No Totality, prior Shift Invariance,
  symmetry or lower-section continuity is used. No independent checker or
  Lean verification is asserted. Combining the result with the recorded
  area implications and the exact CDF-area model's L1 continuity shows that
  the exact area preorder is the least DU-plus-vanishing-shift-continuity
  model on the common real-utility domain, with all its strict comparisons
  preserved by every such extension; equality of all extensions is not claimed.
