proof: >-
  The DU premises give Simple EU by the recorded finite-lottery representation.
  First, any integrable survival difference g that is nonnegative outside a
  compact interval and has positive integral gives a strict preference: choose
  a compact finite-step minorant n<=g with positive integral; write
  n=q(S_mu−S_nu) for finite laws with E[mu]>E[nu]. Dominance compares the
  enlarged mixtures X+q nu and Y+q mu, finite EU and Independence replace
  mu by nu strictly, and common-mixture cancellation gives X strictly above Y.
  Now suppose D=X−Y is integrable with ED>=0, and set d=S_X−S_Y.
  This d is integrable and of bounded variation. Its local envelope
  h(t)=sup_{|s−t|<2}|d(s)| is integrable. Choose a nonnegative weight r(t)
  tending to infinity in both tails with K=integral(rh) finite and positive,
  and let Z have density rh/K. If d is identically zero, use Stochastic
  Equivalence instead. For each 0<epsilon<=1, sufficiently far in either
  tail the increment S_{Z+epsilon}(t)−S_Z(t) is at least |d(t)|.
  Therefore A=M_1/2(X,Z) and B=M_1/2(Y,Z) have survival difference
  S_{A+epsilon}−S_B nonnegative outside a compact interval, integrable
  everywhere, and of integral ED/2+epsilon>0. The first step gives
  A+epsilon strictly above B. Dominance extends this to larger epsilon.
  Vanishing-shift continuity yields A weakly above B, and Independence
  cancels Z to give X weakly above Y. Apply this weak conclusion to
  X and Y+ED/2 when ED>0 to obtain strict preference by Dominance.
  Swap X,Y when ED<0, and apply the weak conclusion in both directions
  when ED=0. This is exactly Relative Expectation. Totality, Shift
  Invariance and lower-section continuity are never assumed.
