  checked_by: []
  date: '2026-09-08'
  recorded_by: GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation
proof: On the full real chart, first-order dominance permits quantile realizations X′,Y′ using the same
  uniform random variable with X′≥Y′ almost surely. Distinct laws give P(X′>Y′)>0. Statewise Dominance
  compares these realizations, and Stochastic Equivalence plus transitivity transfers that comparison
  to X,Y. All realizations exist by standing Prospect Richness.
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2,
  footnote 19 (RV/quantile translation)
notes: Source-based result or immediate restriction/composition. Premises are sufficient; minimality is
  not claimed. The direct source is recorded separately from the transcription; no translation checker
  is asserted.
