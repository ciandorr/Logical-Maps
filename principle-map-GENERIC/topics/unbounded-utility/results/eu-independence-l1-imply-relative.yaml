notes: 'Original work: moderate connecting argument by truncation adaptation. The source supplies
  the expectation/continuity principles and their implication with full affine symmetry. This
  proof instead compares bounded conditional pieces and corrects their means before taking
  upper-section limits. In combination with the existing DTU+L1-to-EU record, it removes
  symmetry from the DTU+L1-to-Relative implication. No lower-section continuity, prior
  Relative Expectation, Shift Transfer or Shift Invariance is assumed. This is work accounting,
  not a claim of literature priority. Stochastic Equivalence is retained to show the conditional-
  law replacements explicitly, although it follows from Stochastic Dominance in this topic.'
