proof: First take an integrable actual difference D=X−Y with ED=0. On E_n={|X|≤n,|Y|≤n},
  put p_n=P(E_n) and c_n=E[D 1_E_n]/p_n, starting after p_n>0. Set X_n=X−c_n on
  E_n and X_n=Y elsewhere. The conditional laws of X−c_n and Y on E_n are bounded
  with equal expectations, so Expected Utility, Stochastic Equivalence and Mixture
  Independence give X_n~Y; when p_n=1 use Expected Utility directly. Furthermore
  E|X_n−X|≤E[|D|1_(E_n complement)]+|E[D1_E_n]|→0. Upper-section L1 Continuity
  gives X≽Y. Interchanging X,Y proves Y≽X. For arbitrary mean m, apply this
  zero-mean argument to X and Y+m to obtain X~Y+m. Stochastic Dominance compares
  Y+m with Y strictly according to the sign of m, giving exactly Relative Expectation.
