proof: >-
  For Arroyo A, the folded tail h_A(t) on [m+1,m+2), m>=1,
  is the alternating remainder sum over n>=m+1 of
  (-1)^(n+1)/(n(n+1)), whose absolute value is at most
  1/((m+1)(m+2)). Thus h_A is absolutely integrable. At cutoff
  T=N+1 its integral is the alternating harmonic prefix through N,
  plus (N+1) times that alternating probability remainder. The
  remainder has absolute value at most 1/(N+2), so the integral
  tends to ln 2. Sure ln 2 has the same folded expectation and
  exists by Rich Outcomes. Folded Expectation gives A~ln 2.
