proof: For actual-coupling real-utility variables X,Y with E|X−Y| finite, the survival difference
  d=S_X−S_Y is absolutely integrable and its integral is E(X−Y). Let A=M_(1/2)(X,−Y)
  and B=M_(1/2)(Y,−Y). Except at atom thresholds, h_A(t)=(d(t)+d(−t))/2 and h_B(t)=0.
  Thus A and B have folded expectations E(X−Y)/2 and zero. Folded Expectation compares
  them exactly by that sign. Mixture Independence cancels their common −Y branch, giving
  X≽Y iff E(X−Y)≥0. Rich Outcomes supplies the reflected finite-chart variable −Y.
  Neither Totality nor a law replacement in preferences is used.
