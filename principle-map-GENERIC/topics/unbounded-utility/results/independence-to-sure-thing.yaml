id: independence-to-sure-thing
premises:
- stochastic-equivalence
- independence
conclusion: sure-thing
status: proved
certificate:
  source_id: decision-theory-unbound
  lean: stated
  produced_by: Zachary Goodsell (cited paper)
  checked_by: []
  date: '2026-09-08'
  recorded_by: GPT-6 (Codex), 2026-09-08; transcription and random-variable formulation
proof: 'Let p=P(E). Realize the conditional laws on E and Eᶜ as A,B for X and C,D for Y. Law invariance
  gives X~M_p(A,B), Y~M_p(C,D), X|E~M_p(A,0), Y|E~M_p(C,0). Independence cancels 0 to yield A~C from the
  hypothesis. Replace indifferent mixture components and cancel the common E component: X≽Y iff B≽D. The
  latter is equivalent to X|Eᶜ≽Y|Eᶜ by independence and law invariance.'
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §3.2,
  p. 679 and p. 682, footnote 28
notes: Source-based result or immediate restriction/composition. Premises are sufficient; minimality is
