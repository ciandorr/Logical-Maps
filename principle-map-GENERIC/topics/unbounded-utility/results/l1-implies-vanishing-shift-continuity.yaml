proof: >-
  Suppose all the eligible positive shifts X+ε satisfy X+ε ≽ Y. Use the
  actual coupling X_n=X+1/n. Its expected absolute utility difference from
  X is exactly 1/n, tending to zero. Upper-section L1 Continuity therefore
  yields X ≽ Y. No shift invariance, law replacement, or lower-section
  continuity is used.
