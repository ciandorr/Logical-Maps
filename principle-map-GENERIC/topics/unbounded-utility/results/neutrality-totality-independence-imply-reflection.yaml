proof: Suppose X ≽ Y but not −Y ≽ −X. Totality gives −X ≻ −Y. Mixture Independence (including its strict consequence),
  transitivity, and Stochastic Equivalence to interchange mixture branches give M_½(X,−X) ≻ M_½(Y,−Y). Each
  mixture has a symmetric law, so Symmetric Neutrality makes both indifferent to 0, a contradiction. Therefore
  −Y ≽ −X. Applying the same implication to −Y,−X proves the converse. Rich Outcomes supplies the reflected
  variables.
