notes: >-
  Original work: moderate proof adaptation. The two distributions and
  integrable-difference identities come from Goodsell's Theorem 11.
  The new step factors the proof through the already recorded uniqueness
  principle: H is a fixed value of X -> M_(1/2)(-2X,0), so one can
  replace the source's Totality/positive-affine square-root argument
  by Negative Self-Similarity. No separate Totality, Scale Invariance,
  Reflection Anti-Invariance, or L1 Continuity is required. Exact
  couplings and remainder bounds are supplied in the write-up and
  diagnostic. This is work accounting, not a claim of literature novelty.
