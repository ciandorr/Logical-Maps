proof: >-
  For Pasadena P, replace the negative payoff -4^k/(2k) by
  -4^k/(2k-1) to obtain Highland Park H. The actual pointwise
  difference P-H is nonnegative and has expectation ln 2.
  Write H in law as M_(2/3)(Q,-2Q), where Q takes
  2^(2k-1)/(2k-1) with probability 3/4^k. Couple Q with
  S of law M_(1/4)(4Q,0) by sending its first atom to zero
  and its kth atom, k>=2, to four times its (k-1)st value.
  The difference has absolute expectation 3 and expectation zero,
  so Relative Expectation gives Q~S. Substitute this comparison
  into the Q branch of H and regroup: H~M_(1/2)(-2H,0).
  Zero solves the same fixed-value equation. Negative Self-Similarity
  yields H~0. Relative Expectation gives P~H+ln 2; a half-mixture
  shift transfer, itself an integrable zero-mean comparison, and
  Independence give H+ln 2~ln 2. All distributional replacements
  are licensed by Stochastic Equivalence.
