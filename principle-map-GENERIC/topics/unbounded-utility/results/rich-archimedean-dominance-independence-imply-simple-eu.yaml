notes: >-
  Original work: small proof adaptation and premise audit. The source
  supplies the finite-lottery representation and DU framework; this entry
  writes out the argument without global Totality and without presupposing
  Simple EU or Restricted Totality. It is a new connecting proof, not a
  change to the existing source-attributed original-dtu-implies-simple-eu
  record. Rich and Archimedean Outcomes alone are not sufficient: dominance
  and mixture independence supply essential steps in this proof. The DU
  and DTU presets can therefore omit Simple EU as an assumed axiom while
  retaining it as a derived consequence. No minimality, literature priority,
  independent certification or Lean verification is claimed.
