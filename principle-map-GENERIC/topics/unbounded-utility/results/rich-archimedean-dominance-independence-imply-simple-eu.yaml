proof: >-
  Stochastic Dominance gives Stochastic Equivalence and strictly orders
  binary mixtures of fixed distinct sure endpoints by the probability of
  the better endpoint. Archimedean Outcomes calibrates each outcome against
  0 and 1, giving a unique finite chart value u. For any two simple gambles,
  choose common sure endpoints enclosing their finite supports and 0,1.
  Every supported outcome is indifferent to a binary mixture of these
  endpoints. Independence and law invariance replace the finite branches
  and flatten the resulting compound lotteries. The endpoint probability
  of an outcome o is q(0)+(q(1)-q(0))*u(o), by the chart's three binary
  calibration clauses. Thus the two flattened probabilities compare exactly
  as their finite expected chart utilities. The chart is strictly increasing;
  Rich Outcomes supplies an outcome o_r at every real level, making each
  inverse upper ray {u>r} the measurable outcome ray {o>o_r}. The chart is
  therefore total and measurable, as required by Simple EU. No Totality
  over arbitrary gambles or gamble continuity is used. See the write-up
  for endpoint, calibration and finite-mixture details.
