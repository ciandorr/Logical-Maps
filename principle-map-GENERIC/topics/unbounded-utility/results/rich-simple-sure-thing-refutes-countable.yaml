proof: Use the strengthened St Petersburg contradiction from §2.3. Simple EU supplies Restricted Totality,
  Restricted Stochastic Equivalence and finite conditional EU calculations. With independent sequences of fair
  tosses let A be first-toss St Petersburg, B the same starting at toss 2, and C an independent St Petersburg
  variable. Conditional on B=2^n, A is a fair mixture of 2 and 2^(n+1), so its conditional expected value exceeds
  B by 1; Countable Sure-Thing would give A≻B. Partition the A,C space by the maximum of their finite stopping
  times. On each cell they are simple and their restricted laws coincide, so Countable Sure-Thing would give
  A~C. Repeat for B,C to get B~C, contradicting Preordering. Null sets can be assigned a finite outcome without
  changing the simple-law comparisons.
sources:
- Goodsell, Decision theory unbound, Noûs 58 (2024), 669–695; online 2023; DOI 10.1111/nous.12473, §2.3, pp.
  675–676
