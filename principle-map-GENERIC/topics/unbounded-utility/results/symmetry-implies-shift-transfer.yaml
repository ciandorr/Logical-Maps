proof: This is Theorem 3 transported from laws to random variables using Stochastic Equivalence. Reflection,
  Totality and Independence first make a half-mixture of V and −V indifferent to 0. Shift invariance then
  gives M_1/2(V+c,−V)~c/2. Pair the terms on the two sides of the proposed transfer with their negatives;
  both reduce to the same simple constant mixture. Independence cancels the common terms.
