proof: Theorem 4. If D=u(X)−u(Y) has finite range, work with the diluted variables M_1/2(X,0), M_1/2(Y,0).
  Partition into the finitely many values of D. Transfer each constant difference to the zero branch by
  Theorem 3. Finite mixture substitution leaves M_1/2(Y,D) in place of M_1/2(X,0). Independence and Simple
  EU reduce the comparison to E[D]≥0. Law invariance permits each rearrangement of branches.
