proof: Theorem 11. Couple Pasadena P with Highland Park H, retaining each outcome probability and replacing
  each negative denominator 2n by 2n−1. Then E[H−P]=−ln 2 with integrable difference. The paper writes
  H as M_2/3(Q,−2Q). It proves by Relative Expectation that Q~M_1/4(4Q,0), then Totality and affine invariance
  give Q~M_1/2(2Q,0). Reflection and Independence yield H~0; Relative Expectation together with shift
  transfer then gives P~ln 2. These are preference equalities, not ordinary expectations of P or H.
