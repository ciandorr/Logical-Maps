proof: Theorem 6 couples the positive and negative utility tails in opposing order. Absolute integrability
  of the folded tail difference yields an integrable difference of these tail variables, with expectation
  F(X). Relative Expectation (Corollary 5) and reflection identify X with sure F(X). Apply the same construction
  to Y and compare the constants. Law invariance transfers the chosen couplings to the original variables.
