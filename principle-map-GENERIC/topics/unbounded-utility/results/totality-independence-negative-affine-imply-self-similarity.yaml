proof: Fix p,a,b,Z and write T(V)=−aV+b and F(V)=M_p(T(V),Z). Negative Affine Anti-Invariance reverses
  strict preference under T, while Mixture Independence preserves strict preference between first arguments
  with the common Z. Hence F reverses strict preference. If X~F(X) and Y~F(Y) but X≻Y, then F(Y)≻F(X),
  so Y≻X by the two indifferences, a contradiction. The case Y≻X is symmetric. Totality leaves only X~Y.
  The other premises in the original full DTU+Sym package are unused.
