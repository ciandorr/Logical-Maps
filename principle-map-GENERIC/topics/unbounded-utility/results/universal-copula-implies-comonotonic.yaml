proof: Use the diagonal copula, the law of (U,U) for uniform U, with H(u,v)=min(u,v). For a comonotonic
  pair, the lower-threshold events are nested up to null sets, so its joint CDF is min(F_A(a),F_B(b)).
  Thus both comonotonic pairs (X,Z) and (Y,Z) admit this same copula. Applying SC(C) gives the desired
  biconditional for the actual X,Y,Z. No replacement of variables in a preference comparison is used.
