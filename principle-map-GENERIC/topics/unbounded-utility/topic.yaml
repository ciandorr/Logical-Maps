title: 'Unbounded utility: random variables'
description: First source-based extraction from Goodsell (2024, 2026). Preordering is standing; stochastic
  equivalence, outcome richness, and outcome Archimedeanness are explicit principles.
framework: Gambles are measurable outcome-valued random variables on an atomless standard probability
  space. All such variables are available (Prospect Richness is standing). ≽ is reflexive and transitive,
  not assumed total or law-invariant. Outcomes are linearly ordered, with distinct reference outcomes
  0 and 1, and sure-indifferent outcomes identified. A possibly partial real utility chart is defined
  by binary certainty comparisons; see background.md. Rich Outcomes supplies all real levels; Archimedean
  Outcomes rules out outcomes beyond the finite chart. M_p(X,Y) is randomized selection, never the pointwise
  sum pX+(1-p)Y.
