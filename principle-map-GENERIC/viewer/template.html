<title>__PMAP_TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F4F5F7;
    --panel: #FFFFFF;
    --panel-2: #EEF0F3;
    --line: #D8DCE2;
    --line-strong: #B9BFC8;
    --ink: #1B2230;
    --ink-2: #4B5563;
    --ink-3: #7C8594;
    --accent: #2B3F6B;
    --human: #2E6F95;
    --assisted: #6E5BA6;
    --ai: #C4762B;
    --derived: #8A9098;
    --indep: #B8394B;
    --open: #E3E6EA;
    --open-ink: #8A9098;
    --conj: #C9A227;
    --node-fill: #FFFFFF;
    --node-stroke: #8E96A3;
    --junction: #4B5563;
    --hl: #FFF3C4;
    --focus: #2B3F6B;
    --shadow: 0 1px 2px rgba(27,34,48,.08), 0 6px 18px rgba(27,34,48,.06);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151920; --panel: #1D2230; --panel-2: #242A38; --line: #313849; --line-strong: #454D60;
      --ink: #E6E9EF; --ink-2: #B4BAC6; --ink-3: #7F8798; --accent: #9DB4E6;
      --human: #5FA3CC; --assisted: #A594DB; --ai: #E09A55; --derived: #7B8393; --indep: #E06A7A;
      --open: #2A3140; --open-ink: #6B7383; --conj: #D9B64A;
      --node-fill: #232938; --node-stroke: #5A6274; --junction: #B4BAC6; --hl: #3B3A22; --focus: #9DB4E6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151920; --panel: #1D2230; --panel-2: #242A38; --line: #313849; --line-strong: #454D60;
    --ink: #E6E9EF; --ink-2: #B4BAC6; --ink-3: #7F8798; --accent: #9DB4E6;
    --human: #5FA3CC; --assisted: #A594DB; --ai: #E09A55; --derived: #7B8393; --indep: #E06A7A;
    --open: #2A3140; --open-ink: #6B7383; --conj: #D9B64A;
    --node-fill: #232938; --node-stroke: #5A6274; --junction: #B4BAC6; --hl: #3B3A22; --focus: #9DB4E6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header.top { display: flex; align-items: baseline; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header.top h1 { font: 600 22px/1.2 var(--serif); margin: 0; text-wrap: balance; }
  header.top .sub { color: var(--ink-3); font-size: 12.5px; max-width: 80ch; }
  .stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chip b { color: var(--ink); font-weight: 600; }

  .body { display: grid; grid-template-columns: 1fr; min-height: 0; }
  @media (max-width: 1100px) { .detail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
  aside.controls { min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); display: grid; grid-template-rows: minmax(0, 1fr) 9px var(--background-height, clamp(145px, 27vh, 230px)); }
  .controls-scroll { min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; scrollbar-gutter: stable; overflow-anchor: none; }
  .background-dock { min-height: 0; border-top: 1px solid var(--line-strong); padding: 12px 16px; display: flex; flex-direction: column; gap: 7px; background: var(--panel-2); }
  .background-dock h2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .background-dock h2 .lnk { margin-left: auto; }
  .background-hint, .background-status { font-size: 11px; color: var(--ink-3); margin: 0; }
  #background-list { overflow: auto; min-height: 0; flex: 1; scrollbar-gutter: stable; overflow-anchor: none; }
  .background-row, .pr-row { display: flex; align-items: flex-start; gap: 6px; }
  .background-row { font-size: 12px; padding: 3px 0; }
  .background-row .lnk, .pr-row .principle-name { flex: 1; min-width: 0; }
  .pr-row .principle-name { color: var(--ink); text-align: left; }
  .pr-row input[type=checkbox] { flex: none; margin: 3px 2px 0 0; cursor: pointer; }
  .background-row.is-removed, .pr-row.in-background { visibility: hidden; pointer-events: none; }
  .background-row.is-collapsed, .pr-row.is-collapsed { display: none; }
  .background-move { flex: none; min-width: 23px; padding: 0 3px; border: 1px solid var(--line); border-radius: 4px; color: var(--accent); background: var(--panel); cursor: pointer; }
  .background-move:hover { border-color: var(--accent); }
  .background-fixed { color: var(--ink-3); font-size: 10px; }
  aside.controls h2 .lnk { font: inherit; text-transform: none; letter-spacing: 0; margin-left: 6px; }
  aside.controls h2, .detail h2 { font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .ctl { display: flex; flex-direction: column; gap: 6px; }
  .ctl label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .ctl input[type=checkbox] { accent-color: var(--accent); }
  #pr-filters { gap: 16px; }
  .pr-category { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .pr-category:first-child { border-top: 0; padding-top: 0; }
  .pr-category h3 { font: 600 13px/1.35 var(--sans); color: var(--ink); margin: 0 0 5px; }
  .pr-category-actions { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 9px; font-size: 11px; }
  .pr-category-actions .lnk:disabled { opacity: .45; cursor: default; }
  .pr-category-count { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }
  .pr-category .principle-name { font-size: 13px; }
  .pr-category input { flex: none; margin-top: 3px; }
  .sw { width: 22px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
  .sw.dotted { border-top-style: dotted; }
  .sw.dashed { border-top-style: dashed; }
  .sw.human { border-color: var(--human); } .sw.assisted { border-color: var(--assisted); } .sw.ai { border-color: var(--ai); }
  .sw.derived { border-color: var(--derived); } .sw.conj { border-color: var(--conj); }
  .search { width: 260px; margin: 0 0 12px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); }
  .legend-note { color: var(--ink-3); font-size: 12px; }
  .framework { font-size: 12.5px; color: var(--ink-2); }
  .framework p { margin: 0 0 6px; }
  .btn { padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); cursor: pointer; }
  .btn:hover { background: var(--panel-2); }
  .btn.small { padding: 3px 8px; font-size: 12px; }

  main { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
  .tabs { display: flex; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { padding: 8px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: none; cursor: pointer; color: var(--ink-2); }
  .tab[aria-selected="true"] { background: var(--bg); border-color: var(--line); color: var(--ink); margin-bottom: -1px; }
  .tab .n { color: var(--ink-3); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .pane { display: none; min-height: 0; overflow: auto; }
  .pane[data-active="true"] { display: block; }
  #pane-graph[data-active="true"] { display: grid; grid-template-columns: var(--sidebar-width, 250px) 9px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  .pane-divider { position: relative; background: var(--panel-2); touch-action: none; user-select: none; z-index: 2; }
  .pane-divider::after { content: ''; position: absolute; border-radius: 3px; background: var(--line-strong); }
  .pane-divider[aria-orientation="vertical"] { cursor: col-resize; }
  .pane-divider[aria-orientation="vertical"]::after { width: 3px; height: 36px; top: calc(50% - 18px); left: 3px; }
  .pane-divider[aria-orientation="horizontal"] { cursor: row-resize; }
  .pane-divider[aria-orientation="horizontal"]::after { height: 3px; width: 36px; left: calc(50% - 18px); top: 3px; }
  .pane-divider:hover, .pane-divider:focus-visible, .pane-divider.dragging { background: var(--hl); }
  .pane-divider:focus-visible { outline-offset: -2px; }
  .pane-divider:hover::after, .pane-divider:focus-visible::after, .pane-divider.dragging::after { background: var(--accent); }
  body.resizing-panes, body.resizing-panes * { cursor: var(--resize-cursor) !important; user-select: none !important; }
  .graph-area { position: relative; overflow: hidden; min-width: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #graph:active { cursor: grabbing; }
  .graph-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
  .graph-warning { position: absolute; inset: 24px; overflow: auto; padding: 24px; border: 2px solid #b42318; border-radius: 8px; background: #fff1f0; color: #b42318; }
  .graph-warning h2 { margin: 0 0 12px; font-size: 21px; }
  .graph-warning .lnk { color: #912018; text-decoration: underline; }
  .graph-warning li { margin: 10px 0; }

  /* SVG */
  .edge { fill: none; stroke-width: 1.6; }
  .edge.source { stroke: var(--source-color); }
  .badge.source { background: var(--source-color); }
  .source-group { border: 0; margin: 0; padding: 0; min-width: 0; }
  .source-group legend { font-size: 11px; color: var(--ink-3); margin-bottom: 5px; }
  .source-group label { font-size: 12px; margin-bottom: 6px; }
  .model-category { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .model-category h3 { font-size: 13px; margin: 0 0 8px; }
  .edge.human { stroke: var(--human); } .edge.assisted { stroke: var(--assisted); } .edge.ai { stroke: var(--ai); }
  .edge.derived { stroke: var(--derived); stroke-dasharray: 2 4; stroke-width: 1.3; }
  .edge.conjectured { stroke-dasharray: 7 5; }
  .edge.lean { stroke-width: 3; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .edge-g.dim .edge { opacity: .18; }
  .edge-g.hot .edge { stroke-width: 3; }
  .node { cursor: pointer; }
  .node rect { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.2; }
  .node.dim { opacity: .3; }
  .node.hot rect, .node.selected rect { stroke: var(--accent); stroke-width: 2.2; }
  .node.selected rect { fill: var(--hl); }
  .node.from-background rect { fill: var(--hl); stroke: var(--accent); }
  .node text { font: 500 12.5px var(--sans); fill: var(--ink); pointer-events: none; }
  .node text[data-principle] { pointer-events: auto; cursor: pointer; }
  .node text.equiv { font-size: 10.5px; fill: var(--ink-3); }
  .node.iso rect { stroke-dasharray: 4 3; }
  .junction { cursor: pointer; }
  .junction circle { fill: var(--panel); stroke: var(--junction); stroke-width: 1.4; }
  .junction.source circle { stroke: var(--source-color); }
  .junction.human circle { stroke: var(--human); } .junction.assisted circle { stroke: var(--assisted); } .junction.ai circle { stroke: var(--ai); }
  .junction text { font: 600 10px var(--sans); fill: var(--ink-2); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .junction.dim { opacity: .3; }
  .layer-label { font: 400 10px var(--mono); fill: var(--ink-3); }

  /* matrix */
  .matrix-wrap { padding: 16px 20px; }
  table.matrix { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
  table.matrix th { font-weight: 500; color: var(--ink-2); text-align: left; padding: 2px 6px; white-space: nowrap; }
  table.matrix th.col { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; vertical-align: bottom; height: 215px; padding: 6px 2px; }
  table.matrix td { width: 26px; height: 26px; border-radius: 3px; cursor: pointer; text-align: center; font: 500 10px var(--mono); }
  td.c-implies { background: var(--human); color: #fff; }
  td.c-implies.prov-ai { background: var(--ai); } td.c-implies.prov-assisted { background: var(--assisted); }
  td.c-derived { background: color-mix(in srgb, var(--human) 45%, var(--panel)); }
  td.c-independent { background: var(--indep); color: #fff; }
  td.c-independent.derived { background: color-mix(in srgb, var(--indep) 45%, var(--panel)); }
  td.c-open { background: var(--open); color: var(--open-ink); }
  td.c-conj { background: repeating-linear-gradient(45deg, var(--open) 0 4px, color-mix(in srgb, var(--conj) 50%, var(--panel)) 4px 8px); }
  td.c-self { background: transparent; cursor: default; }
  td.hot { outline: 2px solid var(--accent); }
  .matrix-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 0; font-size: 12px; color: var(--ink-2); }
  .matrix-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .matrix-legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .matrix-wrap p.hint { color: var(--ink-3); font-size: 12.5px; margin: 0 0 12px; max-width: 65ch; }

  /* lists */
  .list { padding: 16px 20px; }
  table.results { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.results th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.results td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.results tr { cursor: pointer; }
  table.results tr:hover td { background: var(--panel-2); }
  table.results tr.filtered td { opacity: .4; }
  .stmt { font-family: var(--serif); font-size: 14px; }
  .open-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .open-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; font-family: var(--serif); }
  .open-item:hover { border-color: var(--accent); }
  .list h3 { font: 600 16px var(--serif); margin: 18px 0 8px; }
  .list h3:first-child { margin-top: 0; }
  .list p.hint { color: var(--ink-3); font-size: 12.5px; max-width: 65ch; margin: 0 0 12px; }

  /* badges */
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font: 500 11px var(--sans); letter-spacing: .02em; color: #fff; white-space: nowrap; }
  .badge.source { white-space: normal; }
  .badge.human { background: var(--human); } .badge.assisted { background: var(--assisted); } .badge.ai { background: var(--ai); }
  .badge.lean { background: transparent; color: var(--ink-2); border: 1px solid var(--line-strong); }
  .badge.lean.verified { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .badge.conj { background: var(--conj); color: #1B2230; }
  .badge.kind { background: var(--panel-2); color: var(--ink-2); }
  .badge.indep { background: var(--indep); }

  /* detail */
  .detail { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px 18px; }
  .detail .empty { color: var(--ink-3); font-size: 13px; }
  .detail h2.title { font: 600 18px/1.25 var(--serif); letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0 0 4px; text-wrap: balance; }
  .detail .id { font: 12px var(--mono); color: var(--ink-3); margin-bottom: 10px; }
  .detail .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .detail .statement { font: 15px/1.5 var(--serif); margin: 0 0 12px; }
  .detail .formal { font: 12px var(--mono); background: var(--panel-2); padding: 6px 8px; border-radius: 4px; overflow-x: auto; margin: 0 0 12px; }
  .detail .proof { font: 13px/1.5 var(--serif); background: var(--panel-2); padding: 10px 12px; border-radius: 6px; margin: 0 0 12px; }
  .detail dl { margin: 0 0 12px; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; }
  .detail dt { color: var(--ink-3); }
  .detail dd { margin: 0; }
  .detail ul.rel { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .detail ul.rel li { display: flex; gap: 6px; align-items: baseline; }
  .detail ul.rel button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
  .detail ul.rel button:hover { text-decoration: underline; }
  .detail .via { font: 11px var(--mono); color: var(--ink-3); }
  .detail .src { font-size: 12.5px; color: var(--ink-2); padding-left: 16px; margin: 0 0 12px; }
  .detail .file { font: 11px var(--mono); color: var(--ink-3); }
  .rel-head { font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 4px; }

  @media (prefers-reduced-motion: no-preference) { .node rect, .edge { transition: opacity .15s, stroke-width .15s; } }

  /* additions */
  .pkg-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; background: var(--panel); font-size: 13px; }
  .pill.on { background: var(--hl); border-color: var(--accent); }
  .pill input { margin: 0; accent-color: var(--accent); }
  .pkg-head { font: 600 16px var(--serif); margin: 4px 0 10px; }
  .note { font-size: 12.5px; color: var(--ink-2); }
  .warn { color: var(--indep); font-size: 12.5px; }
  .mono { font: 11px var(--mono); color: var(--ink-3); }
  .dim { color: var(--ink-3); font-size: 11px; }
  .lnk { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  .lnk:hover { text-decoration: underline; }
  .conjunction-abbreviation { font-weight: 600; white-space: nowrap; }
  .full-conjunction { margin: 8px 0; font: 13px/1.45 var(--sans); }
  .full-conjunction summary { color: var(--accent); cursor: pointer; }
  .full-conjunction-statement { margin-top: 6px; color: var(--ink-2); }
  .list h3 .n, .list h3 span.n { color: var(--ink-3); font: 400 13px var(--sans); }
  table.matrix tr.filtered td, table.matrix tr.filtered th { opacity: .4; }
  table.matrix th button.lnk { color: var(--ink); }
  .list ul.rel { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .list ul.rel li { display: flex; gap: 8px; align-items: baseline; }
  .list ul.rel button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  .list ul.rel button:hover { text-decoration: underline; }
  .list .via { font: 11px var(--mono); color: var(--ink-3); }
  .list .via button { color: var(--ink-3); font: inherit; }
  .list .empty { color: var(--ink-3); }

  /* explorer */
  .ex { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr); gap: 28px; align-items: start; }
  .ex-head { font: 500 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
  .ex-head .n { font: 400 12px var(--mono); }
  .ex-list { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; }
  .ex-p { display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 5px; }
  .ex-p.in { background: color-mix(in srgb, var(--human) 14%, transparent); }
  .ex-p.out { background: color-mix(in srgb, var(--indep) 14%, transparent); }
  .ex-p.fin, .ex-p.fout { color: var(--ink-2); }
  .ex-p .lnk { color: var(--ink); }
  .ex-p.model-in { background: color-mix(in srgb, var(--human) 14%, transparent); }
  .ex-p.model-out { background: color-mix(in srgb, var(--indep) 14%, transparent); }
  .ex-p > .lnk { flex: 1; text-align: left; }
  .verdict { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; color: inherit; cursor: pointer; }
  .pop-sources { font-size: 12px; margin: 9px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; flex: none; }

<script>
const DATA = /*__PMAP_DATA__*/null;
const FALSE = "false";

// ---------------------------------------------------------------- engine (mirrors scripts/pmap.py)
function closure(seed, rules, background) {
  const facts = new Set([...background, ...seed]);
  const why = new Map(); for (const f of facts) why.set(f, null);
  let changed = true;
  while (changed) {
    changed = false;
    for (const r of rules) if (!facts.has(r.conclusion) && r.premises.every(p => facts.has(p))) { facts.add(r.conclusion); why.set(r.conclusion, r.id); changed = true; }
  }
  return { facts, why };
}
function chain(target, why, byId) {
  const out = [], seen = new Set();
  (function visit(f) { const rid = why.get(f); if (rid == null || seen.has(rid)) return; seen.add(rid); for (const p of [...byId.get(rid).premises].sort()) visit(p); out.push(rid); })(target);
  return out;
}
class Engine {
  constructor(ids, results, models, background) {
    this.ids = ids; this.background = background; this.rules = results; this.byId = new Map(results.map(r => [r.id, r])); this.models = models;
    this.cache = new Map(); this.holds = new Map(); this.fails = new Map(); this.failWhy = new Map(); this.modelConflicts = new Map();
    for (const m of models) {
      this.holds.set(m.id, new Set([...this.cl(m.satisfies).facts].filter(c => c !== FALSE)));
      const conflict = this.conflict(m.satisfies, m.violates);
      if (conflict) this.modelConflicts.set(m.id, conflict);
      const f = new Set(), fw = new Map();
      if (!conflict) for (const c of ids) {
        const hit = this.conflict([...m.satisfies, c], m.violates);
        if (hit) { f.add(c); fw.set(c, [m.id, ...hit.via]); }
      }
      this.fails.set(m.id, f); this.failWhy.set(m.id, fw);
    }
  }
  cl(P) {
    const key = JSON.stringify([...new Set(P)].sort());
    if (!this.cache.has(key)) this.cache.set(key, closure(P, this.rules, this.background));
    return this.cache.get(key);
  }
  conflict(P, violates = []) {
    const {facts, why} = this.cl(P);
    const target = facts.has(FALSE) ? FALSE : violates.find(v => facts.has(v));
    return target === undefined ? null : {target, via: chain(target, why, this.byId)};
  }
  entails(P, c) {
    const { facts, why } = this.cl(P);
    if (facts.has(FALSE) && c !== FALSE) return null;
    return facts.has(c) ? chain(c, why, this.byId) : null;
  }
  excludes(P, c) { return this.conflict(P) ? null : this.conflict([...P, c]); }
  separates(P, c) { return this.models.filter(m => !this.modelConflicts.has(m.id) && P.every(p => this.holds.get(m.id).has(p)) && this.fails.get(m.id).has(c)); }
  pair(a, b) {
    const conflict = this.conflict([a]); if (conflict) return {status: 'inconsistent', via: conflict.via};
    const via = this.entails([a], b); if (via) return { status: 'implies', via };
    const excluded = this.excludes([a], b); if (excluded) return {status: 'excludes', via: excluded.via};
    const ms = this.separates([a], b); if (ms.length) return { status: 'independent', via: this.failWhy.get(ms[0].id).get(b), models: ms.map(m => m.id) };
    return { status: 'open', via: [] };
  }
  package(P) {
    const conflict = this.conflict(P);
    const out = {inconsistent: !!conflict, via: conflict?.via || [], entails: [], excludes: [], separated: [], open: []};
    if (conflict) return out;
    const { facts, why } = this.cl(P);
    for (const c of this.ids) {
      if (P.includes(c)) continue;
      if (facts.has(c)) out.entails.push([c, chain(c, why, this.byId)]);
      else {
        const excluded = this.excludes(P, c);
        if (excluded) out.excludes.push([c, excluded.via]);
        else { const ms = this.separates(P, c); if (ms.length) out.separated.push([c, ms.map(m => m.id)]); else out.open.push([c, []]); }
      }
    }
    return out;
  }
}

// ---------------------------------------------------------------- state
const P = DATA.principles, R = DATA.results.map(r => ({...r, conclusion: r.conclusion === false ? FALSE : r.conclusion})), MODELS = DATA.models, T = DATA.topic;
const byPid = new Map(P.map(p => [p.id, p])), byRid = new Map(R.map(r => [r.id, r])), byMid = new Map(MODELS.map(m => [m.id, m]));
const ids = P.map(p => p.id);
const topicBackground = T.background || [];
const backgroundPresets = T.background_presets || [];
const backgroundParams = new URLSearchParams(window.location.search);
const initialBackground = backgroundParams.has('assume') ? (backgroundParams.get('assume') || '').split(',') : backgroundPresets.filter(p => p.default).flatMap(p => p.principles);
const background = new Set([...topicBackground, ...initialBackground.filter(id => byPid.has(id))]);
const sourceCatalog = [...(T.source_catalog || [])];
if (!sourceCatalog.some(s => s.id === 'misc')) sourceCatalog.push({ id: 'misc', name: 'Misc.', kind: 'misc' });
const sourceOf = x => sourceCatalog.find(s => s.id === x.certificate?.source_id) || sourceCatalog.find(s => s.id === 'misc');
const sourceColor = s => `hsl(${(sourceCatalog.indexOf(s) * 137 + 205) % 360} 45% 45%)`;
const sourceMarker = s => 'source-' + sourceCatalog.indexOf(s);
const state = { allowed: new Set(sourceCatalog.map(s => s.id)), leanOnly: false, showDerived: false, showConj: false, showIso: true, selected: null, modelId: null, tab: 'graph', search: '', pkg: new Set(), out: new Set(), excluded: new Set() };
let E = null, EC = null, baseE = null, baseEC = null, A = null, layout = null, backgroundConflicts = [], backgroundExcluded = new Map();
function passes(x) { return state.allowed.has(sourceOf(x).id) && (!state.leanOnly || x.certificate.lean === 'verified'); }
function recompute() {
  const rules = R.filter(r => r.status === 'proved' && passes(r));
  const models = MODELS.filter(m => m.status === 'proved' && passes(m));
  baseE = new Engine(ids, rules, models, topicBackground);
  baseEC = new Engine(ids, R.filter(passes), MODELS.filter(passes), topicBackground);
  // A model with unknown or false background assumptions is not a witness
  // for the restricted theory. Never manufacture its missing assumptions.
  const fits = engine => engine.models.filter(m => !engine.modelConflicts.has(m.id) && [...background].every(p => engine.holds.get(m.id).has(p)));
  E = new Engine(ids, rules, fits(baseE), [...background]);
  const conflict = E.conflict([]);
  backgroundConflicts = conflict ? [conflict] : [];
  backgroundExcluded = new Map(conflict ? [] : ids.map(id => [id, E.excludes([], id)]).filter(([,proof]) => proof));
  EC = new Engine(ids, R.filter(passes), fits(baseEC), [...background]);
  const pair = new Map(); for (const a of ids) for (const b of ids) if (a !== b) pair.set(a + '|' + b, E.pair(a, b));
  const classes = [], seen = new Set();
  for (const a of ids) { if (seen.has(a)) continue; const cls = [a, ...ids.filter(b => b !== a && pair.get(a + '|' + b).status === 'implies' && pair.get(b + '|' + a).status === 'implies')]; cls.forEach(x => seen.add(x)); classes.push(cls); }
  A = { pair, classes };
}
function pairStatus(a, b) {
  const base = A.pair.get(a + '|' + b);
  if (base.status !== 'open' || !state.showConj) return base;
  const c = EC.pair(a, b); return c.status !== 'open' ? { ...c, status: c.status + '?' } : base;
}
function name(id) { return id === FALSE ? "False (⊥)" : byPid.get(id)?.name || id; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmt(s) { return esc(s.trim()).split(/\n\s*\n/).map(x => x.replace(/\s*\n\s*/g, ' ')).join('<br><br>'); }

// ---------------------------------------------------------------- layout
function buildGraph() {
  const cls = A.classes;
  const assumedFacts = E.cl([]).facts;
  const hidden = id => state.excluded.has(id) || background.has(id);
  const classOf = new Map(); cls.forEach((c, i) => c.forEach(x => classOf.set(x, i)));
  const hiddenClass = new Set(cls.map((c, i) => i).filter(i => cls[i].every(hidden)));
  const nodes = cls.map((c, i) => ({ id: 'c' + i, kind: 'class', members: c.filter(x => !hidden(x)) })).filter((n, i) => !hiddenClass.has(i));
  const edges = [];
  const remainingPremises = r => r.premises.filter(p => !assumedFacts.has(p));
  const shown = R.filter(r => passes(r) && (r.status === 'proved' || state.showConj) && !assumedFacts.has(r.conclusion) && ![...remainingPremises(r), r.conclusion].some(x => hiddenClass.has(classOf.get(x))));
  for (const r of shown) {
    const to = r.conclusion === FALSE ? 'falsity' : 'c' + classOf.get(r.conclusion);
    if (to === 'falsity' && !nodes.some(n => n.id === to)) nodes.push({id: to, kind: 'falsity', members: [FALSE]});
    const prem = [...new Set(remainingPremises(r).map(p => 'c' + classOf.get(p)))].filter(x => x !== to);
    if (prem.length === 0) continue;               // within-class definitional edge: shown in panel only
    if (prem.length === 1) edges.push({ id: r.id, from: prem[0], to, r, type: 'direct' });
    else {
      const j = { id: 'j:' + r.id, kind: 'junction', r };
      nodes.push(j);
      prem.forEach(p => edges.push({ id: r.id + '←' + p, from: p, to: j.id, r, type: 'direct', toJunction: true }));
      edges.push({ id: r.id + '→', from: j.id, to, r, type: 'direct', fromJunction: true });
    }
  }
  if (state.showDerived) {
    const have = new Set(edges.filter(e => !e.toJunction && !e.fromJunction).map(e => e.from + '>' + e.to));
    for (let i = 0; i < cls.length; i++) for (let j = 0; j < cls.length; j++) {
      if (i === j || hiddenClass.has(i) || hiddenClass.has(j)) continue;
      if (cls[j].every(p => assumedFacts.has(p))) continue;
      const st = A.pair.get(cls[i][0] + '|' + cls[j][0]);
      if (st.status !== 'implies' || have.has('c' + i + '>c' + j)) continue;
      // transitive reduction over visible classes: skip if some visible k with i⇒k⇒j
      let reducible = false;
      for (let k = 0; k < cls.length && !reducible; k++) {
        if (k === i || k === j || hiddenClass.has(k)) continue;
        if (A.pair.get(cls[i][0] + '|' + cls[k][0]).status === 'implies' && A.pair.get(cls[k][0] + '|' + cls[j][0]).status === 'implies') reducible = true;
      }
      if (!reducible) edges.push({ id: 'd:' + i + '>' + j, from: 'c' + i, to: 'c' + j, type: 'derived', via: st.via });
    }
  }
  return { nodes, edges, classOf };
}

function computeLayout(g) {
  const nodes = g.nodes, edges = g.edges;
  const byId = new Map(nodes.map(n => [n.id, n]));
  const out = new Map(nodes.map(n => [n.id, []])), inn = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) { out.get(e.from).push(e); inn.get(e.to).push(e); }
  const degree = n => out.get(n.id).length + inn.get(n.id).length;
  const visible = nodes.filter(n => n.kind === 'junction' || degree(n) > 0 || state.showIso);
  const vis = new Set(visible.map(n => n.id));
  // Unconnected nodes have no neighbours to follow during straightening.
  // Keep them out of the tree layout and pack them against its final bounds.
  const isolated = visible.filter(n => degree(n) === 0);
  const connected = visible.filter(n => degree(n) > 0);
  const classes = connected.filter(n => n.kind === 'class');
  const rep = n => n.members[0];
  const implies = (a, b) => a.kind === 'class' && b.kind === 'class' && A.pair.get(rep(a) + '|' + rep(b))?.status === 'implies';
  // Layering follows logical strength: the derived implication order on classes
  // (a DAG, since classes are its strongly connected components), plus junction
  // constraints for results whose conclusion is not stronger than every premise.
  const rankEdges = [];  // [fromId, toId, priority]
  for (const e of edges) if (byId.get(e.to).kind === 'falsity' && !e.fromJunction && e.r.status === 'proved') rankEdges.push([e.from, e.to, 1]);
  for (const a of classes) for (const b of classes) if (a !== b && implies(a, b)) {
    const reducible = classes.some(k => k !== a && k !== b && implies(a, k) && implies(k, b));
    if (!reducible) rankEdges.push([a.id, b.id, 0]);
  }
  const upward = new Set();
  for (const j of connected.filter(n => n.kind === 'junction')) {
    const prem = edges.filter(e => e.to === j.id).map(e => byId.get(e.from));
    const concl = byId.get(edges.find(e => e.from === j.id).to);
    if (prem.every(p => implies(concl, p))) { upward.add(j.id); continue; }
    if (j.r.status === 'conjectured') continue;   // conjectures do not shape the layering
    prem.forEach(p => rankEdges.push([p.id, j.id, 1]));
    rankEdges.push([j.id, concl.id, 1]);
  }
  // break any remaining cycles (mixed junctions) by DFS, preferring to keep strength edges
  const rOut = new Map(connected.map(n => [n.id, []]));
  rankEdges.sort((p, q) => p[2] - q[2]).forEach(e => rOut.get(e[0]).push(e));
  const color = new Map(); const dropped = new Set();
  const dfs = u => { color.set(u, 1); for (const e of rOut.get(u)) { const c = color.get(e[1]) || 0; if (c === 1) dropped.add(e); else if (c === 0) dfs(e[1]); } color.set(u, 2); };
  for (const n of connected) if (!color.get(n.id)) dfs(n.id);
  const fwd = rankEdges.filter(e => !dropped.has(e));
  const rank = new Map(connected.map(n => [n.id, 0]));
  let changed = true, guard = 0;
  while (changed && guard++ < 1000) { changed = false; for (const [f, t] of fwd) { const r = rank.get(f) + 1; if (r > rank.get(t)) { rank.set(t, r); changed = true; } } }
  // classes on even layers; junctions just above (or, for upward results, just below) their conclusion
  const layerOf = new Map();
  for (const n of connected.filter(n => n.kind !== 'junction')) layerOf.set(n.id, 2 * rank.get(n.id));
  for (const j of connected.filter(n => n.kind === 'junction')) {
    const concl = edges.find(e => e.from === j.id).to;
    layerOf.set(j.id, layerOf.get(concl) + (upward.has(j.id) ? 1 : -1));

// ---------------------------------------------------------------- results & open
function certBadges(r) {
  const c = r.certificate;
  return `${sourceBadge(sourceOf(r))}${c.lean === 'verified' ? '<span class="badge lean verified">Lean ✓</span>' : ''}${r.status === 'conjectured' ? '<span class="badge conj">conjecture</span>' : ''}`;
}
// Abbreviate only equivalent positive conjunctions. These are presentation
// aliases: the original records and the engines' premise arrays stay intact.
// baseE uses proved, source-filtered rules and the fixed topic framework;
// exploration background and conjectures must never complete a named package.
function abbreviateConjunction(principleIds) {
  let remaining = [...principleIds];
  const presets = [];
  if (baseE) for (const preset of [...backgroundPresets].sort((a, b) => b.principles.length - a.principles.length)) {
    const members = preset.principles;
    if (!members.length || !members.every(id => byPid.has(id))) continue;
    const packageFacts = baseE.cl(members).facts;
    if (packageFacts.has(FALSE)) continue;
    const remainingFacts = baseE.cl(remaining).facts;
    if (!members.every(id => remainingFacts.has(id))) continue;
    // A stronger remaining assumption may help imply the package without
    // being replaceable by it. Remove only terms the package implies back.
    const consumed = remaining.filter(id => packageFacts.has(id));
    if (consumed.length < 2) continue;
    presets.push({ id: preset.id, name: preset.name, principles: [...members], consumed });
    remaining = remaining.filter(id => !packageFacts.has(id));
  }

}
function conjunctionStmt(positiveIds, negativeIds = [], abbreviated = true) {
  const grouped = abbreviated ? abbreviateConjunction(positiveIds) : { presets: [], remaining: positiveIds };

    ...grouped.remaining.map(name).map(esc),

}

  const definitions = grouped.presets.map(p => `<div class="full-conjunction-statement"><b>${esc(p.name)}</b> = ${p.principles.map(name).map(esc).join(' ∧ ')}</div>`).join('');
  return `<details class="full-conjunction"><summary>Show full conjunction</summary><div class="full-conjunction-statement"><b>Recorded conjunction:</b> ${statement}</div>${definitions}</details>`;
}
function dateOf(x) { return x.satisfies || x.premises ? (x.certificate.date || '') : (x.date || ''); }

}
function addBackgroundPreset(presetId) {
  const preset = backgroundPresets.find(p => p.id === presetId);
  if (!preset) return;
  for (const id of preset.principles) { background.add(id); state.pkg.delete(id); state.out.delete(id); }
  saveBackground(); refreshPrincipleControls(); renderAll(true);
}
function saveBackground() {
  // Keep exploration shareable/reloadable without changing the source topic.
  const additions = [...background].filter(p => !topicBackground.includes(p)).sort();
  try {
    const url = new URL(window.location.href);
    if (additions.length || backgroundPresets.some(p => p.default)) url.searchParams.set('assume', additions.join(','));
    else url.searchParams.delete('assume');
    window.history.replaceState(window.history.state, '', url);
  } catch { /* Some local-file viewers do not allow history updates. */ }
}
function renderBackground() {
  document.querySelectorAll('[data-background-preset]').forEach(button => {
    const preset = backgroundPresets.find(p => p.id === button.dataset.backgroundPreset);
    button.disabled = preset.principles.every(id => background.has(id));
  });
  for (const prefix of ['', 'models-']) {
  const list = document.getElementById(prefix + 'background-list');
  if (!list) continue;
  list.querySelectorAll('.background-row').forEach(row => {
    const removed = !background.has(row.dataset.backgroundId);
    row.classList.toggle('is-removed', removed);
    row.inert = removed;
    if (!removed) row.classList.remove('is-collapsed');
  });
  for (const id of background) {
    if ([...list.querySelectorAll('.background-row')].some(row => row.dataset.backgroundId === id)) continue;
    const row = document.createElement('div');
    row.className = 'background-row'; row.dataset.backgroundId = id;
    row.innerHTML = `<button class="lnk" data-background-principle="${esc(id)}">${esc(name(id))}</button>${topicBackground.includes(id) ? '<span class="background-fixed">fixed</span>' : `<button type="button" class="background-move" data-remove-background="${esc(id)}" title="Return ${esc(name(id))} to principles" aria-label="Return ${esc(name(id))} to principles">↑</button>`}`;
    row.querySelector('[data-background-principle]').addEventListener('click', () => select({ type: 'principle', id }));
    row.querySelector('[data-remove-background]')?.addEventListener('click', () => changeBackground(id, false));
    list.appendChild(row);
  }
  document.getElementById(prefix + 'background-count').textContent = background.size;
  document.getElementById(prefix + 'background-reset').disabled = background.size === topicBackground.length;
  const consequences = [...E.cl([]).facts].filter(p => p !== FALSE && !background.has(p));
  document.getElementById(prefix + 'background-status').textContent = backgroundConflicts.length ? 'Inconsistent background — see the graph warning.' : background.size ? `${consequences.length} further principles follow · ${backgroundExcluded.size} ruled out · ${E.models.length} known models` : 'No additional assumptions.';
  }
}

  recompute(); renderHeader(); renderBackground();

function resetBackground() {

}

// Resize without rebuilding either list, so selections, scroll positions and click slots survive.
(function setupPaneDividers() {
  const pane = document.getElementById('pane-graph');
  const sidebar = document.getElementById('graph-sidebar');
  const storageKey = 'principle-map:pane-sizes:v1';
  let saved = {};
  try {
    const stored = JSON.parse(localStorage.getItem(storageKey));
    for (const key of ['sidebar', 'background']) if (Number.isFinite(stored?.[key]) && stored[key] > 0) saved[key] = stored[key];
  } catch (_) { /* Resizing also works when storage is unavailable. */ }
  const handles = { sidebar: document.getElementById('sidebar-divider'), background: document.getElementById('background-divider') };
  const current = {};
  let drag = null;
  function limits(key) {
    const width = pane.clientWidth || window.innerWidth;
    const height = sidebar.clientHeight || pane.clientHeight || window.innerHeight;
    return key === 'sidebar'
      ? { min: Math.min(200, width * .4), max: Math.max(0, width - Math.min(240, width * .4) - 9), initial: 250 }
      : { min: Math.min(130, height * .3), max: Math.max(0, height - Math.min(140, height * .3) - 9), initial: Math.min(230, Math.max(145, window.innerHeight * .27)) };
  }
  function apply() {
    if (pane.dataset.active !== 'true') return;
    const previousWidth = current.sidebar;
    for (const key of Object.keys(handles)) {
      const bounds = limits(key), min = Math.min(bounds.min, bounds.max);
      const value = Math.round(Math.max(min, Math.min(bounds.max, saved[key] ?? bounds.initial)));
      current[key] = value;
      pane.style.setProperty(key === 'sidebar' ? '--sidebar-width' : '--background-height', `${value}px`);
      const handle = handles[key];
      handle.setAttribute('aria-valuemin', Math.round(min));
      handle.setAttribute('aria-valuemax', Math.round(bounds.max));
      handle.setAttribute('aria-valuenow', value);
      handle.setAttribute('aria-valuetext', `${value} pixels ${key === 'sidebar' ? 'wide' : 'high'}`);
    }
    if (previousWidth !== current.sidebar) fit();
  }
  function persist() { try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch (_) {} }
  function setSize(key, value) { saved[key] = value; apply(); saved[key] = current[key]; }
  function finish(cancel = false) {
    if (!drag) return;
    const previous = drag; drag = null;
    if (cancel) { saved = previous.saved; apply(); } else persist();
    handles[previous.key].classList.remove('dragging');
    document.body.classList.remove('resizing-panes');
    document.body.style.removeProperty('--resize-cursor');
    if (handles[previous.key].hasPointerCapture?.(previous.pointerId)) handles[previous.key].releasePointerCapture(previous.pointerId);
  }

    handle.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || drag) return;
      ev.preventDefault(); handle.focus(); apply();
      drag = { key, pointerId: ev.pointerId, coordinate: key === 'sidebar' ? ev.clientX : ev.clientY, size: current[key], saved: { ...saved } };
      handle.setPointerCapture?.(ev.pointerId);
      handle.classList.add('dragging');
      document.body.style.setProperty('--resize-cursor', key === 'sidebar' ? 'col-resize' : 'row-resize');
      document.body.classList.add('resizing-panes');
      document.getElementById('pop').hidden = true;
    });
    handle.addEventListener('lostpointercapture', () => finish());
    handle.addEventListener('dblclick', () => { finish(); delete saved[key]; apply(); persist(); });
    handle.addEventListener('keydown', ev => {
      if (drag) return;
      const bounds = limits(key), step = ev.shiftKey ? 40 : 10;
      const increase = key === 'sidebar' ? 'ArrowRight' : 'ArrowUp';
      const decrease = key === 'sidebar' ? 'ArrowLeft' : 'ArrowDown';
      if (![increase, decrease, 'Home', 'End', 'Enter'].includes(ev.key)) return;
      ev.preventDefault();
      if (ev.key === 'Enter') { delete saved[key]; apply(); }
      else setSize(key, ev.key === 'Home' ? bounds.min : ev.key === 'End' ? bounds.max : current[key] + (ev.key === increase ? step : -step));

  window.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    const delta = (drag.key === 'sidebar' ? ev.clientX : -ev.clientY) - (drag.key === 'sidebar' ? drag.coordinate : -drag.coordinate);
    setSize(drag.key, drag.size + delta);
  });
  window.addEventListener('pointerup', ev => { if (drag?.pointerId === ev.pointerId) finish(); });
  window.addEventListener('pointercancel', ev => { if (drag?.pointerId === ev.pointerId) finish(true); });

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', apply));
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(apply).observe(pane);
  apply();
})();
