<title>__PMAP_TITLE__</title>
<!--__PMAP_THEME__-->
<style>
  html, body { height: 100%; }
  body { display: flow-root; }
  .app { display: grid; grid-template-rows: auto 1fr; height: calc(100vh - 64px); height: calc(100dvh - 64px); min-height: 420px; margin: 32px 0; border-bottom: 1px solid var(--line); }
  header.top { display: flex; align-items: baseline; gap: 18px; padding: 0 24px 18px; border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
  header.top h1 { font: 700 22px/1.4 var(--sans); margin: 0; text-wrap: balance; }
  header.top .sub { color: var(--ink-3); font-size: 12.5px; max-width: 80ch; margin-top: 4px; }

  .body { display: grid; grid-template-columns: 1fr; min-height: 0; }
  @media (max-width: 1100px) { .detail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
  aside.controls { min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); display: grid; grid-template-rows: minmax(0, 1fr) 9px var(--background-height, clamp(145px, 27vh, 230px)); }
  .controls-scroll { min-height: 0; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-gutter: stable; overflow-anchor: none; }
  .background-dock { min-height: 0; border-top: 1px solid var(--line-strong); padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; background: var(--panel-2); }
  .background-dock h2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .background-dock h2 .lnk { margin-left: auto; }
  .background-hint, .background-status { font-size: 11px; color: var(--ink-3); margin: 0; }
  .background-status:not(.is-conflict) { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .background-status.is-conflict { color: var(--indep); }
  #background-list { overflow: auto; min-height: 0; flex: 1; scrollbar-gutter: stable; overflow-anchor: none; }
  .background-row, .pr-row { display: flex; align-items: flex-start; gap: 6px; }
  .background-row { font-size: 12px; padding: 3px 0; }
  .background-row .lnk, .pr-row .principle-name { flex: 1; min-width: 0; }
  .pr-row .principle-name { color: var(--ink); text-align: left; }
  .pr-row input[type=checkbox] { flex: none; margin: 3px 2px 0 0; cursor: pointer; }
  .background-row.is-removed, .pr-row.in-background { visibility: hidden; pointer-events: none; }
  .background-row.is-collapsed, .pr-row.is-collapsed { display: none; }
  .background-move { flex: none; min-width: 23px; padding: 0 3px; border: 1px solid var(--line); border-radius: 4px; color: var(--accent); background: var(--panel); cursor: pointer; }
  .background-move:hover { border-color: var(--accent); }
  .background-fixed { color: var(--ink-3); font-size: 10px; }
  aside.controls h2 .lnk { font: inherit; text-transform: none; letter-spacing: 0; margin-left: 6px; }
  aside.controls h2, .detail h2 { font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .ctl { display: flex; flex-direction: column; gap: 6px; }
  .ctl label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .ctl input[type=checkbox] { accent-color: var(--accent); }
  aside.controls .ctl { gap: 2px; }
  aside.controls h2 { margin-bottom: 5px; line-height: 1.4; }
  #pr-filters { gap: 8px; }
  .pr-category { min-width: 0; border-top: 1px solid var(--line); padding-top: 8px; }
  .pr-category:first-child { border-top: 0; padding-top: 0; }
  .pr-category h3 { font: 600 13px/1.35 var(--sans); color: var(--ink); margin: 0 0 5px; }
  .pr-category-actions { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; margin-bottom: 3px; font-size: 11px; }
  .pr-category-actions .lnk:disabled { opacity: .45; cursor: default; }
  .pr-category-count { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }
  .pr-category .principle-name { font-size: 13px; }
  .pr-category input { flex: none; margin-top: 3px; }
  .sw { width: 22px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
  .sw.dotted { border-top-style: dotted; }
  .sw.dashed { border-top-style: dashed; }
  .sw.human { border-color: var(--human); } .sw.assisted { border-color: var(--assisted); } .sw.ai { border-color: var(--ai); }
  .sw.derived { border-color: var(--derived); } .sw.conj { border-color: var(--conj); }
  .graph-hint { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); margin: 4px 0 8px; }
  .search { width: min(100%, 320px); margin: 0 0 12px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--panel); }
  .legend-note { color: var(--ink-3); font-size: 12px; }
  .framework { font-size: 12.5px; color: var(--ink-2); }
  .framework p { margin: 0 0 6px; }
  .btn { padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--panel); cursor: pointer; }
  .btn:hover { background: var(--panel-2); }
  .btn.small { padding: 3px 8px; font-size: 12px; }

  main { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
  .tabs { display: flex; gap: 2px; padding: 0 24px; gap: 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { padding: 12px 0; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; cursor: pointer; color: var(--ink-2); }
  .tab[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tab:hover { color: var(--link-hover); }
  .tab .n { color: var(--ink-3); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .pane { display: none; min-height: 0; overflow: auto; }
  .pane[data-active="true"] { display: block; }
  #pane-graph[data-active="true"], #pane-open[data-active="true"] { display: grid; grid-template-columns: var(--sidebar-width, 250px) 9px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  #conjecture-options, .conjecture-hint { display: none; }
  #pane-open #conjecture-options, #pane-open .conjecture-hint { display: block; }
  #pane-open #graph-options, #pane-open .graph-hint, #pane-open .graph-choice, #pane-open [data-clear-graph], #pane-open .pr-category-actions, #pane-open #pr-all, #pane-open #pr-none { display: none; }
  .open-content { overflow: auto; min-width: 0; min-height: 0; }
  #open-warning { position: static; margin: 16px 20px 0; }
  .conjecture-row { padding: 16px 0; border-top: 1px solid var(--line); }
  .conjecture-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 8px; }
  .conjecture-heading .stmt { flex: 1; min-width: min(240px, 100%); text-align: left; }
  .resolution { font-size: 12px; color: var(--ink-2); }
  .resolution.proved { color: var(--human); }
  .resolution.refuted, .resolution.incompatible { color: var(--indep); }
  .resolution.evidence-limited { color: var(--conj); }
  .conjecture-row .note, .conjecture-evidence { margin-top: 8px; }
  .conjecture-evidence summary, #open-incompatible > summary { cursor: pointer; }
  .conjecture-evidence li { margin: 8px 0; }
  #open-incompatible { margin-top: 20px; }
  .pane-divider { position: relative; background: var(--panel-2); touch-action: none; user-select: none; z-index: 2; }
  .pane-divider::after { content: ''; position: absolute; border-radius: 3px; background: var(--line-strong); }
  .pane-divider[aria-orientation="vertical"] { cursor: col-resize; }
  .pane-divider[aria-orientation="vertical"]::after { width: 3px; height: 36px; top: calc(50% - 18px); left: 3px; }
  .pane-divider[aria-orientation="horizontal"] { cursor: row-resize; }
  .pane-divider[aria-orientation="horizontal"]::after { height: 3px; width: 36px; left: calc(50% - 18px); top: 3px; }
  .pane-divider:hover, .pane-divider:focus-visible, .pane-divider.dragging { background: var(--hl); }
  .pane-divider:focus-visible { outline-offset: -2px; }
  .pane-divider:hover::after, .pane-divider:focus-visible::after, .pane-divider.dragging::after { background: var(--accent); }
  body.resizing-panes, body.resizing-panes * { cursor: var(--resize-cursor) !important; user-select: none !important; }
  .graph-area { position: relative; overflow: hidden; min-width: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #graph:active { cursor: grabbing; }
  .graph-tools { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; align-items: flex-start; gap: 6px; pointer-events: none; }
  .graph-tools > * { pointer-events: auto; }
  .graph-tools #fit { margin-left: auto; }
  .graph-search { width: 280px; max-width: calc(100% - 48px); min-width: 0; }
  .graph-search .search { width: 100%; margin: 0; }
  #graph-search-status { display: block; width: fit-content; max-width: 100%; background: var(--panel); color: var(--ink-2); font-size: 12px; }
  #graph-search-status:not(:empty) { padding: 2px 6px; }
  .pr-row.search-match, .background-row.search-match { background: var(--hl); box-shadow: inset 3px 0 var(--focus); border-radius: 3px; }
  .pr-row.search-current, .background-row.search-current { outline: 2px solid var(--focus); outline-offset: 1px; }
  #graph .node.search-match { opacity: 1; }
  #graph .node.search-match rect { stroke: var(--focus); stroke-width: 3; vector-effect: non-scaling-stroke; }
  #graph .node.search-current rect { stroke-width: 4; }
  .graph-warning { position: absolute; inset: 24px; overflow: auto; padding: 24px; border: 1px solid var(--indep); border-radius: 4px; background: var(--warning-bg); color: var(--indep); }
  .graph-warning h2 { margin: 0 0 12px; font-size: 21px; }
  .graph-warning .lnk { color: var(--indep); text-decoration: underline; }
  .graph-warning li { margin: 10px 0; }
  .graph-empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100% - 32px)); color: var(--ink-3); background: var(--bg); text-align: center; padding: 12px; }

  /* SVG */
  .edge { fill: none; stroke-width: 1.6; }
  .edge.source { stroke: var(--source-color); }
  .badge.source { background: var(--source-color); }
  .source-group { border: 0; margin: 0; padding: 0; min-width: 0; }
  .source-group legend { font-size: 11px; color: var(--ink-3); margin-bottom: 1px; }
  .source-group label { font-size: 12px; line-height: 1.4; margin-bottom: 2px; }
  .model-category { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .model-category h3 { font-size: 13px; margin: 0 0 8px; }
  .edge.human { stroke: var(--human); } .edge.assisted { stroke: var(--assisted); } .edge.ai { stroke: var(--ai); }
  .edge.derived, .edge.premise { stroke: var(--derived); stroke-width: 1.3; }
  .edge.conjectured { stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; }
  .edge.lean { stroke-width: 3; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .edge-g.dim .edge { opacity: .18; }
  .edge-g.hot .edge { stroke-width: 3; }
  .node { cursor: pointer; }
  .node rect { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.2; }
  .node.dim { opacity: .3; }
  .node.hot rect, .node.selected rect { stroke: var(--accent); stroke-width: 2.2; }
  .node.selected rect { fill: var(--hl); }
  .node.from-background rect { fill: var(--hl); stroke: var(--accent); }
  .node text { font: 500 12.5px var(--sans); fill: var(--ink); pointer-events: none; }
  .node text[data-principle] { pointer-events: auto; cursor: pointer; }
  .node text.equiv { font-size: 10.5px; fill: var(--ink-3); }
  .node.iso rect { stroke-dasharray: 4 3; }
  .junction { cursor: pointer; }
  .junction circle { fill: var(--panel); stroke: var(--junction); stroke-width: 1.4; }
  .junction.source circle { stroke: var(--source-color); }
  .junction.human circle { stroke: var(--human); } .junction.assisted circle { stroke: var(--assisted); } .junction.ai circle { stroke: var(--ai); }
  .junction text { font: 600 10px var(--sans); fill: var(--ink-2); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .junction.dim { opacity: .3; }
  .layer-label { font: 400 10px var(--mono); fill: var(--ink-3); }

  /* matrix */
  .matrix-wrap { padding: 16px 20px; }
  table.matrix { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
  table.matrix th { font-weight: 500; color: var(--ink-2); text-align: left; padding: 2px 6px; white-space: nowrap; }
  table.matrix th.col { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; vertical-align: bottom; height: 215px; padding: 6px 2px; }
  table.matrix td { width: 26px; height: 26px; border-radius: 3px; cursor: pointer; text-align: center; font: 500 10px var(--mono); }
  td.c-implies { background: var(--human); color: var(--badge-ink); }
  td.c-implies.prov-ai { background: var(--ai); } td.c-implies.prov-assisted { background: var(--assisted); }
  td.c-derived { background: color-mix(in srgb, var(--human) 45%, var(--panel)); }
  td.c-independent { background: var(--indep); color: var(--badge-ink); }
  td.c-independent.derived { background: color-mix(in srgb, var(--indep) 45%, var(--panel)); }
  td.c-open { background: var(--open); color: var(--open-ink); }
  td.c-conj { background: repeating-linear-gradient(45deg, var(--open) 0 4px, color-mix(in srgb, var(--conj) 50%, var(--panel)) 4px 8px); }
  td.c-self { background: transparent; cursor: default; }
  td.hot { outline: 2px solid var(--accent); }
  .matrix-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 0; font-size: 12px; color: var(--ink-2); }
  .matrix-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .matrix-legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .matrix-wrap p.hint { color: var(--ink-3); font-size: 12.5px; margin: 0 0 12px; max-width: 65ch; }

  /* lists */
  .list { padding: 16px 20px; }
  table.results { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.results th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.results td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.results tr { cursor: pointer; }
  table.results tr:hover td { background: var(--panel-2); }
  table.results tr.filtered td { opacity: .4; }
  .stmt { font-family: var(--serif); font-size: 14px; }
  .open-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .open-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); cursor: pointer; font-family: var(--serif); }
  .open-item:hover { border-color: var(--accent); }
  .list h3 { font: 600 16px var(--serif); margin: 18px 0 8px; }
  .list h3:first-child { margin-top: 0; }
  .list p.hint { color: var(--ink-3); font-size: 12.5px; max-width: 65ch; margin: 0 0 12px; }

  /* badges */
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font: 500 11px var(--sans); letter-spacing: .02em; color: var(--badge-ink); white-space: nowrap; }
  .badge.source { white-space: normal; }
  .badge.human { background: var(--human); } .badge.assisted { background: var(--assisted); } .badge.ai { background: var(--ai); }
  .badge.lean { background: transparent; color: var(--ink-2); border: 1px solid var(--line-strong); }
  .badge.lean.verified { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .badge.conj { background: var(--conj); color: var(--badge-ink); }
  .badge.kind { background: var(--panel-2); color: var(--ink-2); }
  .badge.indep { background: var(--indep); }

  /* detail */
  .detail { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px 18px; }
  .detail .empty { color: var(--ink-3); font-size: 13px; }
  .detail h2.title { font: 600 18px/1.25 var(--serif); letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0 0 4px; text-wrap: balance; }
  .detail .id { font: 12px var(--mono); color: var(--ink-3); margin-bottom: 10px; }
  .detail .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .detail .statement { font: 15px/1.5 var(--serif); margin: 0 0 12px; }
  .detail .formal { font: 12px var(--mono); background: var(--panel-2); padding: 6px 8px; border-radius: 4px; overflow-x: auto; margin: 0 0 12px; }
  .detail .proof { font: 13px/1.5 var(--serif); background: var(--panel-2); padding: 10px 12px; border-radius: 3px; margin: 0 0 12px; }
  .detail dl { margin: 0 0 12px; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; }
  .detail dt { color: var(--ink-3); }
  .detail dd { margin: 0; }
  .detail ul.rel { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .detail ul.rel li { display: flex; gap: 6px; align-items: baseline; }
  .detail ul.rel button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
  .detail ul.rel button:hover { text-decoration: underline; }
  .detail .via { font: 11px var(--mono); color: var(--ink-3); }
  .detail .src { font-size: 12.5px; color: var(--ink-2); padding-left: 16px; margin: 0 0 12px; }
  .detail .file { font: 11px var(--mono); color: var(--ink-3); }
  .rel-head { font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 4px; }

  @media (prefers-reduced-motion: no-preference) { .node rect, .edge { transition: opacity .15s, stroke-width .15s; } }

  /* additions */
  .pkg-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 3px; cursor: pointer; background: var(--panel); font-size: 13px; }
  .pill.on { background: var(--hl); border-color: var(--accent); }
  .pill input { margin: 0; accent-color: var(--accent); }
  .pkg-head { font: 600 16px var(--serif); margin: 4px 0 10px; }
  .note { font-size: 12.5px; color: var(--ink-2); }
  .warn { color: var(--indep); font-size: 12.5px; }
  .mono { font: 11px var(--mono); color: var(--ink-3); }
  .dim { color: var(--ink-3); font-size: 11px; }
  .lnk { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  .lnk:hover { text-decoration: underline; }
  .conjunction-abbreviation { font-weight: 600; white-space: nowrap; }
  .full-conjunction { margin: 8px 0; font: 13px/1.45 var(--sans); }
  .full-conjunction summary { color: var(--accent); cursor: pointer; }
  .full-conjunction-statement { margin-top: 6px; color: var(--ink-2); }
  .list h3 .n, .list h3 span.n { color: var(--ink-3); font: 400 13px var(--sans); }
  table.matrix tr.filtered td, table.matrix tr.filtered th { opacity: .4; }
  table.matrix th button.lnk { color: var(--ink); }
  .list ul.rel { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .list ul.rel li { display: flex; gap: 8px; align-items: baseline; }
  .list ul.rel button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
  .list ul.rel button:hover { text-decoration: underline; }
  .list .via { font: 11px var(--mono); color: var(--ink-3); }
  .list .via button { color: var(--ink-3); font: inherit; }
  .list .empty { color: var(--ink-3); }

  /* explorer */
  .ex { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr); gap: 28px; align-items: start; }
  .ex-head { font: 500 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
  .ex-head .n { font: 400 12px var(--mono); }
  .ex-list { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; }
  .ex-p { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px 10px; padding: 6px; border-radius: 5px; }
  .ex-p.in { background: color-mix(in srgb, var(--human) 14%, transparent); }
  .ex-p.out { background: color-mix(in srgb, var(--indep) 14%, transparent); }
  .ex-p .lnk { color: var(--ink); }
  .ex-p > .seg { grid-column: 1; grid-row: 1; }
  .ex-p > .lnk { grid-column: 2; grid-row: 1; min-width: 0; text-align: left; overflow-wrap: normal; word-break: normal; }
  .ex-p > .background-move { grid-column: 3; grid-row: 1; }
  .ex-p > .verdict, .ex-p > .via { grid-column: 2 / -1; min-width: 0; max-width: 100%; justify-self: start; text-align: left; }
  .ex-p .badge.source { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
  .ex-p .model-flag { white-space: nowrap; }
  .verdict { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; color: inherit; cursor: pointer; }
  .pop-sources { font-size: 12px; margin: 9px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: var(--panel); width: 26px; height: 22px; cursor: pointer; color: var(--ink-3); font-size: 12px; padding: 0; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.on { background: var(--indep); color: var(--panel); }

<script>
const DATA = /*__PMAP_DATA__*/null;
const FALSE = "false";

// ---------------------------------------------------------------- engine (mirrors scripts/pmap.py)
function closure(seed, rules, background) {
  const facts = new Set([...background, ...seed]);

      h += `<li class="ex-p ${tint}" data-assumption-row="${id}">${assumptionButtons(id, follows, ruledOut)}<div class="principle-line"><button class="lnk" data-principle="${id}">${esc(name(id))}</button>${inspected ? ' ' + verdictButton(inspected, id, evidence, true) : ''}</div></li>`;

    }

  }
  h += '</div></div><div class="ex-col explorer-models">';
  const ms = MODELS.filter(m => passes(m) && (m.status === 'proved' || state.showConj));

    const holds = m.status === 'proved' ? baseE.holds.get(m.id) : new Set(m.satisfies);
    const fails = m.status === 'proved' ? baseE.fails.get(m.id) : new Set(m.violates);
    if (IN.some(p => fails.has(p)) || OUT.some(p => holds.has(p))) continue;
    const gaps = [...IN.filter(p => !holds.has(p)), ...OUT.filter(p => !fails.has(p)).map(p => '!' + p)];
    (gaps.length || m.status !== 'proved' ? unknown : known).push([m, gaps]);

  if (conflict) h += `<h2 class="ex-head">Models</h2><div class="ex-bad" role="alert">These assumptions are inconsistent. Clear or change an assumption to compare models.${conflict.via.length ? `<ul>${conflict.via.map(id => `<li><button class="lnk" data-result="${id}">${resultStmt(byRid.get(id))}</button> ${certBadges(byRid.get(id))}</li>`).join('')}</ul>` : ''}</div>`;
  else {
    h += `<h2 class="ex-head">Matching models <span class="n">${known.length}</span></h2><ul class="ex-list">${known.map(row).join('') || '<li class="empty">No known matching model.</li>'}</ul>`;
    h += `<h2 class="ex-head">Potential models <span class="n">${unknown.length}</span></h2><ul class="ex-list">${unknown.map(row).join('') || '<li class="empty">—</li>'}</ul>`;
  }
  h += '</div></div>';
  const el = document.getElementById('models');
  const focused = el.contains(document.activeElement) ? ['data-assume-positive', 'data-assume-negative'].map(a => [a, document.activeElement.getAttribute(a)]).find(([,id]) => id) : null;
  el.innerHTML = h;
  wireAssumptions(el);
  el.querySelectorAll('[data-background-preset]').forEach(button => { button.disabled = backgroundPresets.find(p => p.id === button.dataset.backgroundPreset).principles.every(id => background.has(id)); button.addEventListener('click', () => addBackgroundPreset(button.dataset.backgroundPreset)); });
  el.querySelector('#ex-clear').addEventListener('click', resetBackground);
  el.querySelector('#ex-deselect')?.addEventListener('click', () => { state.modelId = null; select(null); renderModels(); });
  wire(el);
  if (focused) el.querySelector(`[${focused[0]}="${focused[1]}"]`)?.focus({preventScroll: true});
  document.getElementById('n-models').textContent = MODELS.length;
}

function certBadges(r) {
  const c = r.certificate;
  return `${sourceBadge(sourceOf(r))}${c.lean === 'verified' ? '<span class="badge lean verified">Lean ✓</span>' : ''}${r.status === 'conjectured' ? '<span class="badge conj">conjecture</span>' : ''}`;
}
// Abbreviate only equivalent positive conjunctions. These are presentation
// aliases: the original records and the engines' premise arrays stay intact.
// baseE uses proved, source-filtered rules and the fixed topic framework;
// exploration background and conjectures must never complete a named package.
function abbreviateConjunction(principleIds) {
  let remaining = [...principleIds];
  const presets = [];
  if (baseE) for (const preset of [...backgroundPresets].sort((a, b) => b.principles.length - a.principles.length)) {
    const members = preset.principles;
    if (!members.length || !members.every(id => byPid.has(id))) continue;
    const packageFacts = baseE.cl(members).facts;
    if (packageFacts.has(FALSE)) continue;
    const remainingFacts = baseE.cl(remaining).facts;
    if (!members.every(id => remainingFacts.has(id))) continue;
    // A stronger remaining assumption may help imply the package without
    // being replaceable by it. Remove only terms the package implies back.
    const consumed = remaining.filter(id => packageFacts.has(id));
    if (consumed.length < 2) continue;
    presets.push({ id: preset.id, name: preset.name, principles: [...members], consumed });
    remaining = remaining.filter(id => !packageFacts.has(id));
  }
  return { presets, remaining, abbreviated: presets.length > 0 };
}
function conjunctionStmt(positiveIds, negativeIds = [], abbreviated = true) {
  const grouped = abbreviated ? abbreviateConjunction(positiveIds) : { presets: [], remaining: positiveIds };
  return [
    ...grouped.presets.map(p => `<span class="conjunction-abbreviation" data-preset="${esc(p.id)}">${esc(p.name)}</span>`),
    ...grouped.remaining.map(name).map(esc),
    ...negativeIds.map(id => '¬' + esc(name(id)))
  ].join(' ∧ ') || '⊤';
}
function resultStmt(r, abbreviated = true) { return `${conjunctionStmt(r.premises, [], abbreviated)} ⇒ ${esc(name(r.conclusion))}`; }
function modelStmt(m, abbreviated = true) { return conjunctionStmt(m.satisfies, m.violates, abbreviated); }
function fullConjunctionDetails(x) {
  const isResult = Array.isArray(x.premises);
  const grouped = abbreviateConjunction(isResult ? x.premises : x.satisfies);
  if (!grouped.abbreviated) return '';
  const statement = isResult ? resultStmt(x, false) : modelStmt(x, false);
  const definitions = grouped.presets.map(p => `<div class="full-conjunction-statement"><b>${esc(p.name)}</b> = ${p.principles.map(name).map(esc).join(' ∧ ')}</div>`).join('');
  return `<details class="full-conjunction"><summary>Show full conjunction</summary><div class="full-conjunction-statement"><b>Recorded conjunction:</b> ${statement}</div>${definitions}</details>`;
}
function dateOf(x) { return x.satisfies || x.premises ? (x.certificate.date || '') : (x.date || ''); }
function kindOf(x) { return x.satisfies ? 'model' : x.premises ? 'result' : 'principle'; }
function renderResults() {
  const q = state.search.trim().toLowerCase();
  const items = [...P, ...R, ...MODELS].filter(x => !q || [JSON.stringify(x), x.premises ? resultStmt(x, false) : x.satisfies ? modelStmt(x, false) : ''].join(' ').toLowerCase().includes(q))
    .sort((a, b) => dateOf(b).localeCompare(dateOf(a)));
  let h = `<table class="results changes"><tbody>`;
  for (const x of items) {
    const k = kindOf(x);
    const stmt = k === 'principle' ? `<b>${esc(x.name)}</b> &nbsp; ${esc(x.statement)}` : k === 'result' ? resultStmt(x) : `<b>${esc(x.name)}</b> &nbsp; ${modelStmt(x)}`;
    const by = k === 'principle' ? '' : esc(x.certificate.produced_by || '');
    h += `<tr data-kind="${k}" data-id="${x.id}" class="${k !== 'principle' && !passes(x) ? 'filtered' : ''}"><td class="mono nowrap">${esc(dateOf(x))}</td><td><span class="badge ${k === 'model' ? 'indep' : 'kind'}">${x.status === 'conjectured' ? 'conjecture' : k}</span></td><td class="stmt">${stmt}</td><td>${k === 'principle' ? '' : certBadges(x)}</td><td class="mono">${by}</td></tr>`;
  }

  const el = document.getElementById('results'); el.innerHTML = h;
  el.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => select({ type: tr.dataset.kind, id: tr.dataset.id })));
  document.getElementById('n-results').textContent = items.length;
}
function conjectureEvidence(answer, evidenceBase = baseE, summary = 'Evidence') {
  // The rule chains returned for a witness certify the first matching model.
  const witness = answer.models.length ? byMid.get(answer.models[0]) : null;
  const via = new Set();
  if (witness) {
    // Include the proof that the witness fits the background, using the same
    // evidence set that established its verdict (selected or complete).
    const {why} = evidenceBase.cl(witness.satisfies);
    for (const p of background) for (const id of chain(p, why, evidenceBase.byId)) via.add(id);
    for (const p of negativeBackground) for (const id of (evidenceBase.failWhy.get(witness.id).get(p) || []).slice(1)) via.add(id);
  }
  for (const id of answer.via) via.add(id);
  const items = [...(witness ? [witness] : []), ...[...via].map(id => byRid.get(id))];
  if (!items.length) return '<p class="note">This follows directly from the selected assumptions and the question’s requirements.</p>';
  return `<details class="conjecture-evidence"><summary>${esc(summary)} ${evidenceBadges({items})}</summary><ol>${items.map(x => `<li><button class="lnk" data-open-${kindOf(x)}="${esc(x.id)}">${x.satisfies ? esc(x.name) : resultStmt(x)} — write-up</button> ${certBadges(x)}</li>`).join('')}</ol>${sourceSummary(items)}</details>`;
}
function renderOpen() {
  const questions = [...R, ...MODELS].filter(x => x.status === 'conjectured' || x.was_conjectured)
    .map(item => {
      const answer = E.resolveConjecture(item), allAnswer = allEvidenceE.resolveConjecture(item);
      const status = answer.status === 'open' && allAnswer.status !== 'open'
        ? allAnswer.status === 'inconsistent-background' ? 'inconsistent-background' : 'evidence-limited'
        : answer.status;
      return {item, answer, allAnswer, status};
    });
  const inconsistent = backgroundConflicts.length > 0;
  const allConflict = allEvidenceE.conflict([]);
  const assumedFacts = inconsistent ? new Set() : E.cl([]).facts;
  const labels = {open: 'Open', 'evidence-limited': 'Unresolved by selected evidence', proved: '✓ Proved', refuted: '✗ Refuted', incompatible: 'Incompatible premises', 'inconsistent-background': 'Resolution unavailable'};
  const verdictLabel = (x, status) => Array.isArray(x.satisfies) && status === 'proved' ? '✓ Existence witnessed' : Array.isArray(x.satisfies) && status === 'refuted' ? '✗ Existence refuted' : labels[status];
  const row = ({item: x, answer, allAnswer, status}) => {
    const isM = Array.isArray(x.satisfies);
    const shown = isM ? {...x, satisfies: x.satisfies.filter(p => !assumedFacts.has(p)), violates: x.violates.filter(p => !backgroundExcluded.has(p))}
      : {...x, premises: x.premises.filter(p => !assumedFacts.has(p))};
    const statement = isM ? esc(x.name) : resultStmt(shown);
    const requirements = isM ? `<div class="stmt">${shown.satisfies.length || shown.violates.length ? `Exists: ${modelStmt(shown)}` : 'Exists: a model of the current background.'}</div>` : '';
    let evidence = '';
    if (status === 'open') evidence = '<p class="note">No resolution in all recorded proved evidence under this background.</p>';
    else if (status === 'evidence-limited') {
      evidence = conjectureEvidence(allAnswer, allEvidenceBaseE, `${verdictLabel(x, allAnswer.status)} with all recorded evidence`);
      if (allAnswer.status === 'incompatible') evidence += '<p class="note">The full evidence makes the premises incompatible with this background; this does not settle the implication.</p>';
      if (isM && allAnswer.status === 'proved') evidence += '<p class="note">A proved model meets the requirements; this need not establish the proposed construction.</p>';
    }
    else if (!inconsistent) {
      if (isM && answer.status === 'proved') evidence += '<p class="note">A proved model meets these requirements. This settles their consistency; it need not establish the proposed construction.</p>';
      if (answer.status === 'incompatible') evidence += '<p class="note">The premises conflict with this background. This is not counted as a resolution of the implication.</p>';
      if (status !== 'inconsistent-background') evidence += conjectureEvidence(answer);
    }
    return `<article class="conjecture-row" data-conjecture-id="${esc(x.id)}" data-resolution="${status}" data-selected-resolution="${answer.status}" data-full-resolution="${allAnswer.status}"><div class="conjecture-heading"><button class="lnk stmt" data-${isM ? 'model' : 'result'}="${esc(x.id)}">${statement}</button><span class="resolution ${status}">${verdictLabel(x, status)}</span></div>${requirements}<div class="note">Recorded question: ${sourceBadge(sourceOf(x))} ${esc(x.certificate.date || '')}</div>${evidence}${x.notes ? `<details class="note"><summary>Notes on the recorded question</summary><p>${fmt(x.notes)}</p></details>` : ''}</article>`;
  };
  const warning = document.getElementById('open-warning');
  warning.hidden = !inconsistent && !allConflict;
  warning.innerHTML = inconsistent ? `<h2>Background is inconsistent</h2><p>These assumptions cannot all hold together. Conjecture resolutions are unavailable until the conflicting assumptions are removed.</p>${conjectureEvidence({via: backgroundConflicts[0].via, models: []})}<p>This check uses proved results under the current evidence filters.</p>` : allConflict ? `<h2>Additional evidence shows the background is inconsistent</h2><p>Verdicts from the selected evidence cannot establish which questions remain open with all recorded evidence.</p>${conjectureEvidence({via: allConflict.via, models: []}, allEvidenceBaseE, 'Background conflict with all recorded evidence')}` : '';
  wire(warning);
  const visible = questions.filter(q => q.answer.status !== 'incompatible' && (state.showResolved || !['proved', 'refuted'].includes(q.answer.status)));
  const incompatible = questions.filter(q => q.answer.status === 'incompatible');
  let h = '<h3>Conjectures</h3><p class="hint">“Open” means unresolved by all recorded proved evidence under this background. “Unresolved by selected evidence” means the filters omit evidence available below. Background assumptions are omitted from statements; click a question for its full statement.</p>';
  h += visible.map(row).join('') || `<p class="empty">${questions.length ? 'No open questions apply to this background. Use “Show resolved” to include resolved questions.' : 'No conjectures have been recorded.'}</p>`;
  if (incompatible.length) h += `<details id="open-incompatible"><summary>Incompatible with this background (${incompatible.length})</summary>${incompatible.map(row).join('')}</details>`;
  const el = document.getElementById('open'); el.innerHTML = h;
  wire(el);
  const count = document.getElementById('n-open');
  count.textContent = inconsistent || allConflict ? '—' : questions.filter(q => q.status === 'open').length;
  count.title = 'Open with all recorded evidence; questions unresolved only by the selected evidence are not counted.';
}

// ---------------------------------------------------------------- write-up page
function sourceEntries(items) {
  const entries = new Map();
  for (const x of items) (x.sources || []).forEach((source, i) => {
    if (!entries.has(source)) entries.set(source, { source, label: (x.source_names || [])[i] || (source.length <= 80 ? source : `Source ${entries.size + 1}`) });
  });
  return [...entries.values()];
}
function sourceSummary(items) {
  const entries = sourceEntries(items);
  return `<div class="pop-sources"><b>Source${entries.length === 1 ? '' : 's'}:</b> ${entries.length ? entries.map(x => `<span title="${esc(x.source)}">${esc(x.label)}</span>`).join('; ') : 'not recorded'}</div>`;
}
function sourceList(items) {
  const entries = sourceEntries(items);
  return entries.length ? `<h2>Sources</h2><ul class="src">${entries.map(x => `<li><b>${esc(x.label)}</b>${x.label === x.source ? '' : ' — ' + esc(x.source)}</li>`).join('')}</ul>` : '';
}
function fileLinks(x) {
  const f = x.files || {}; const parts = [];
  if (f.html) parts.push(`<a href="${f.html}" target="_blank">html</a>`);
  if (f.pdf) parts.push(`<a href="${f.pdf}" target="_blank">pdf</a>`);

function pstmt(id) { if (id === FALSE) return "<li><b>False (⊥).</b> These premises cannot all hold together.</li>"; const p = byPid.get(id); return `<li><button class="lnk" data-principle="${id}"><b>${esc(p.name)}</b></button> ${esc(p.statement)}</li>`; }
function renderPage(sel) {

    if (p.notes) h += `<h2>Notes</h2><div class="prose">${fmt(p.notes)}</div>`;
    const inR = R.filter(r => r.premises.includes(p.id) || r.conclusion === p.id), inM = MODELS.filter(m => m.satisfies.includes(p.id) || m.violates.includes(p.id));
    h += `<h2>Results</h2><table class="results"><tbody>${inR.map(r => `<tr data-result="${r.id}"><td class="stmt">${resultStmt(r)}</td><td>${certBadges(r)}</td></tr>`).join('') || '<tr><td>—</td></tr>'}</tbody></table>`;
    h += `<h2>Models</h2><table class="results"><tbody>${inM.map(m => `<tr data-model="${m.id}"><td class="mono nowrap">${m.satisfies.includes(p.id) ? '✓' : '✗'}</td><td class="stmt"><b>${esc(m.name)}</b> &nbsp; ${modelStmt(m)}</td><td>${certBadges(m)}</td></tr>`).join('') || '<tr><td>—</td></tr>'}</tbody></table>`;

      if (ev.button !== 0 || drag) return;
      ev.preventDefault(); handle.focus(); apply();
      drag = { key, pointerId: ev.pointerId, coordinate: key === 'sidebar' ? ev.clientX : ev.clientY, size: current[key], saved: { ...saved } };
      handle.setPointerCapture?.(ev.pointerId);
      handle.classList.add('dragging');
      document.body.style.setProperty('--resize-cursor', key === 'sidebar' ? 'col-resize' : 'row-resize');
      document.body.classList.add('resizing-panes');
      document.getElementById('pop').hidden = true;
    });
    handle.addEventListener('lostpointercapture', () => finish());
    handle.addEventListener('dblclick', () => { finish(); delete saved[key]; apply(); persist(); });
    handle.addEventListener('keydown', ev => {
      if (drag) return;
      const bounds = limits(key), step = ev.shiftKey ? 40 : 10;
      const increase = key === 'sidebar' ? 'ArrowRight' : 'ArrowUp';
      const decrease = key === 'sidebar' ? 'ArrowLeft' : 'ArrowDown';
      if (![increase, decrease, 'Home', 'End', 'Enter'].includes(ev.key)) return;
      ev.preventDefault();
      if (ev.key === 'Enter') { delete saved[key]; apply(); }
      else setSize(key, ev.key === 'Home' ? bounds.min : ev.key === 'End' ? bounds.max : current[key] + (ev.key === increase ? step : -step));
      persist();
    });
  }
  window.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    const delta = (drag.key === 'sidebar' ? ev.clientX : -ev.clientY) - (drag.key === 'sidebar' ? drag.coordinate : -drag.coordinate);
    setSize(drag.key, drag.size + delta);
  });
  window.addEventListener('pointerup', ev => { if (drag?.pointerId === ev.pointerId) finish(); });
  window.addEventListener('pointercancel', ev => { if (drag?.pointerId === ev.pointerId) finish(true); });
  window.addEventListener('blur', () => finish());
  window.addEventListener('keydown', ev => { if (ev.key === 'Escape' && drag) { ev.preventDefault(); finish(true); } });
  window.addEventListener('resize', apply);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', apply));
  if (typeof ResizeObserver !== 'undefined') {
    const observer = new ResizeObserver(apply);
    for (const pane of panes) observer.observe(pane);
  }
  apply();
})();
window.addEventListener('resize', () => { if (state.tab === 'graph') fit(); });
renderAll(true);
requestAnimationFrame(fit);
</script>
